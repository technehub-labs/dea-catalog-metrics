id: dea:metric-asset-condition-index-public-infrastructure
name: Asset Condition Index (Public Infrastructure)
type: Metric
description: Asset Condition Index (Public Infrastructure) (ACI-P) captures the utilization or availability
  of capacity for organizations tracking government & public administration. It is defined as Weighted
  Infrastructure Condition Score; the result is stated in index (0-100 or normalized). In Public Sector,
  it is a recognized element of the standard performance toolkit. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It should be maximized within the limits of cost
  and quality trade-offs.
