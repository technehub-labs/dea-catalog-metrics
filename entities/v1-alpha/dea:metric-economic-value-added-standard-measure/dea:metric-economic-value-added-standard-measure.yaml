id: dea:metric-economic-value-added-standard-measure
name: Economic Value Added (Standard Measure)
type: Metric
description: Economic Value Added (Standard Measure) (EVA) captures the economic value created or preserved
  for organizations tracking valuation & corporate finance standard measures. It is defined as NOPAT -
  (Invested Capital x WACC); the result is stated in currency value. It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
