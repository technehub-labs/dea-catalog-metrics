id: dea:metric-hotel-rate-variance-to-corporate-rate
name: Hotel Rate Variance to Corporate Rate
type: Metric
description: Hotel Rate Variance to Corporate Rate (HRVC) measures the economic value created or preserved
  in the Corporate Travel Management domain. Its calculation is Average Paid Rate - Negotiated Rate, Averaged,
  measured in currency per unit. It provides the day-to-day signal that a process is running as designed.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
