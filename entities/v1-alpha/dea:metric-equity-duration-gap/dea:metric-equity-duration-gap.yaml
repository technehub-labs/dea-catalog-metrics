id: dea:metric-equity-duration-gap
name: Equity Duration Gap
type: Metric
description: Equity Duration Gap (EDG-VCF) captures exposure to adverse outcomes for organizations tracking
  valuation & corporate finance standard measures. Its calculation is Duration of Assets minus Duration
  of Liabilities, measured in ratio (x:1 or x). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Values
  outside the intended band, on either side, warrant investigation.
