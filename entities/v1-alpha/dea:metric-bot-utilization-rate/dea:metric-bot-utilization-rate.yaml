id: dea:metric-bot-utilization-rate
name: Bot Utilization Rate
type: Metric
description: 'Bot Utilization Rate (BUR) measures the utilization or availability of capacity in the Automation
  & Robotic Process Automation domain. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is Bot Productive Hours / Bot Licensed Hours - reported
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.'
abbreviation: BUR
unit: percent
