id: dea:metric-cost-of-poor-quality
name: Cost of Poor Quality
type: Metric
description: Cost of Poor Quality (COPQ) measures the economic value created or preserved in the Quality
  Management domain. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Internal Failure + External Failure + Appraisal + Prevention Costs - reported
  in currency value. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: COPQ
unit: currency
