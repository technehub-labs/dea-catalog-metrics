id: dea:metric-payment-run-error-rate
name: Payment Run Error Rate
type: Metric
description: 'Within Treasury & Cash Management, Payment Run Error Rate (PER) is used to gauge the quality
  of outputs and outcomes. The formula is Failed or Rejected Payments / Payments Initiated - reported
  in percent (%). It is applied across virtually every sector. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
