id: dea:metric-working-capital-productivity-deep-dive
name: Working Capital Productivity (Deep Dive)
type: Metric
description: 'Working Capital Productivity (Deep Dive) (WCP-D) addresses how efficiently resources are
  converted into outputs and is a fixture of balanced scorecard - financial perspective reporting. It
  is computed as Revenue / Working Capital, expressed in ratio (x:1 or x). It is applied across virtually
  every sector. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: WCP-D
unit: ratio
version: 1.1.0
