id: dea:metric-app-store-rejection-rate
name: App Store Rejection Rate
type: Metric
description: App Store Rejection Rate (ASRR) addresses the quality of outputs and outcomes and is a fixture
  of mobile & client development reporting. Its calculation is Submissions Rejected / Submissions, measured
  in percent (%). It provides the day-to-day signal that a process is running as designed. Lower values
  are better; each reduction is an improvement. It originates from and is most used in Software practice.
abbreviation: ASRR
unit: percent
