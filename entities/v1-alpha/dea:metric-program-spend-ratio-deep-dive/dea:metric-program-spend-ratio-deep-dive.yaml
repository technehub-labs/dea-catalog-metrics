id: dea:metric-program-spend-ratio-deep-dive
name: Program Spend Ratio (Deep Dive)
type: Metric
description: 'Program Spend Ratio (Deep Dive) (PSR-D) captures conformance to standards, plans, or obligations
  for organizations tracking nonprofit & donor operations (deep dive). It is computed as Program Expenses
  / Total Expenses, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is concentrated in Nonprofit.'
abbreviation: PSR-D
unit: percent
