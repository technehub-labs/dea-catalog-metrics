id: dea:metric-invention-disclosure-rate
name: Invention Disclosure Rate
type: Metric
description: Invention Disclosure Rate (IDR-IP) measures growth over time in the Intellectual Property
  & Licensing domain. Its calculation is Disclosures Filed per 1,000 R&D Staff per Year, measured in events
  per thousand or million (scaled). It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Values outside
  the intended band, on either side, warrant investigation.
