id: dea:metric-post-harvest-quality-rejection-rate-deep-dive
name: Post-Harvest Quality Rejection Rate (Deep Dive)
type: Metric
description: A Agriculture & Agronomy (Deep Dive) indicator, Post-Harvest Quality Rejection Rate (Deep
  Dive) (PHQR-D) quantifies the quality of outputs and outcomes. Its calculation is Rejected Lots / Delivered
  Lots, measured in percent (%). Its value drives prioritization and resource reallocation among competing
  initiatives. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Agriculture practice.
