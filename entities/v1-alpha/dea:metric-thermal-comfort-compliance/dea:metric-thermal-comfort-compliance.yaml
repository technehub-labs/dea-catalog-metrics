id: dea:metric-thermal-comfort-compliance
name: Thermal Comfort Compliance
type: Metric
description: 'Thermal Comfort Compliance (TCC-E) measures the quality of outputs and outcomes in the Operations
  Energy Management domain. It is defined as Working Hours within Comfort Band / Total Working Hours;
  the result is stated in percent (%). It is applied across virtually every sector. It is a working-level
  control: thresholds trigger immediate operational response. It should be maximized within the limits
  of cost and quality trade-offs.'
