id: dea:metric-revenue-per-veterinarian-hour
name: Revenue per Veterinarian Hour
type: Metric
description: Revenue per Veterinarian Hour (RPVH) addresses how efficiently resources are converted into
  outputs and is a fixture of veterinary & animal health reporting. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Revenue / Veterinarian
  Hours - reported in currency per unit. Improvement means raising this figure toward best-in-class levels.
  It is a standard measure in the Healthcare sector.
