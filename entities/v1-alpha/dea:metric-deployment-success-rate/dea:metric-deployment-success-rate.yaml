id: dea:metric-deployment-success-rate
name: Deployment Success Rate
type: Metric
description: A Continuous Delivery & Deployment indicator, Deployment Success Rate (DSR-CD) quantifies
  the quality of outputs and outcomes. It is defined as Deployments without Failure / Deployments; the
  result is stated in percent (%). It is applied across virtually every sector. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: DSR-CD
unit: percent
