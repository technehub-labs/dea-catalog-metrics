id: dea:metric-cost-to-raise-a-dollar-deep-dive
name: Cost to Raise a Dollar (Deep Dive)
type: Metric
description: 'A Nonprofit & Donor Operations (Deep Dive) indicator, Cost to Raise a Dollar (Deep Dive)
  (CRD-D) quantifies how efficiently resources are converted into outputs. It is computed as Fundraising
  Cost / Funds Raised, expressed in ratio (x:1 or x). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Nonprofit.'
