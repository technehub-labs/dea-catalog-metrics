id: dea:metric-pages-per-session
name: Pages per Session
type: Metric
description: 'Pages per Session (PPS-WDA) addresses the engagement or satisfaction of the people involved
  and is a fixture of web & digital analytics standard measures reporting. The formula is Pageviews /
  Sessions - reported in ratio (x:1 or x). It is a standard measure in the Digital product sector. It
  is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should be
