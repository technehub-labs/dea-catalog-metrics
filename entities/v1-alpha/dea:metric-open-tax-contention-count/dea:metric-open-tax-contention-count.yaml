id: dea:metric-open-tax-contention-count
name: Open Tax Contention Count
type: Metric
description: Open Tax Contention Count (OTCC) captures exposure to adverse outcomes for organizations
  tracking tax & fiscal. Its calculation is Unresolved Tax Disputes with Authorities, measured in count
  (items per period). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
