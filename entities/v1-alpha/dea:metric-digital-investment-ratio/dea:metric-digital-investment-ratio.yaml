id: dea:metric-digital-investment-ratio
name: Digital Investment Ratio
type: Metric
description: 'Within Digital Transformation, Digital Investment Ratio (DIR) is used to gauge the economic
  value created or preserved. It is computed as Digital Initiative Spend / Total Change Spend, expressed
  in percent (%). It is applied across virtually every sector. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. Values outside the intended band, on
  either side, warrant investigation.'
