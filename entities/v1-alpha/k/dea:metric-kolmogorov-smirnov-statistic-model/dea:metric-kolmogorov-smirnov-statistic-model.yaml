id: dea:metric-kolmogorov-smirnov-statistic-model
name: Kolmogorov-Smirnov Statistic (Model)
type: Metric
description: 'Kolmogorov-Smirnov Statistic (Model) (KSM) captures the quality of outputs and outcomes
  for organizations tracking statistical model performance diagnostics. It is defined as Maximum Separation
  of Cumulative Event Distributions; the result is stated in percent (%). In Software, it is a recognized
  element of the standard performance toolkit. It is a working-level control: thresholds trigger immediate
  operational response. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: KSM
unit: percent
