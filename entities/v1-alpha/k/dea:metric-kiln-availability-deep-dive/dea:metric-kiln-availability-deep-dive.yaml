id: dea:metric-kiln-availability-deep-dive
name: Kiln Availability (Deep Dive)
type: Metric
description: Kiln Availability (Deep Dive) (KA-D) measures the utilization or availability of capacity
  in the Cement & Building Materials domain. It is defined as Kiln Operating Hours / Planned Hours; the
  result is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  In Manufacturing, it is a recognized element of the standard performance toolkit.
abbreviation: KA-D
unit: percent
version: 1.1.0
