id: dea:metric-kaizen-implementation-rate
name: Kaizen Implementation Rate
type: Metric
description: Within Process Excellence (Lean Six Sigma), Kaizen Implementation Rate (KIR) is used to gauge
  capability maturity or development. It is computed as Improvement Actions Implemented / Improvement
  Actions Identified, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: KIR
unit: percent
version: 1.1.0
lifecycle_status: candidate
