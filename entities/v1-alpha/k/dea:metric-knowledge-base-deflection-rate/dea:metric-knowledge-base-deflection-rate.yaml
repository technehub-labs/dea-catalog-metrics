id: dea:metric-knowledge-base-deflection-rate
name: Knowledge Base Deflection Rate
type: Metric
description: A Knowledge Management indicator, Knowledge Base Deflection Rate (KBDR) quantifies how efficiently
  resources are converted into outputs. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Issues Self-Resolved via Knowledge Base / Issues Seeking
  Help, expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: KBDR
unit: percent
version: 1.1.0
