id: dea:metric-knowledge-article-hit-rate
name: Knowledge Article Hit Rate
type: Metric
description: Knowledge Article Hit Rate (KAHR-CC) measures how efficiently resources are converted into
  outputs in the Contact Center Standard Measures (Deep Dive) domain. Its calculation is Contacts Resolved
  via Suggested Article / Article Suggestions Shown, measured in percent (%). It is applied across virtually
  every sector. It provides the day-to-day signal that a process is running as designed. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: KAHR-CC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- efficiency
scope_classification:
- organizational_unit
directionality: higher_is_better
