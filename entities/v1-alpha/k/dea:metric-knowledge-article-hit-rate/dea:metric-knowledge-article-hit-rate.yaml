source_credit: Public domain - no attribution required
calculation_definition: Contacts Resolved via Suggested Article / Article Suggestions Shown
formula_definition:
  formula_id: dea:formula-knowledge-article-hit-rate
  expression: KAHR-CC = Contacts Resolved via Suggested Article / Article Suggestions Shown
  inputs:
