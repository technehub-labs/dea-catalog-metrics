id: dea:metric-knowledge-capture-rate
name: Knowledge Capture Rate
type: Metric
description: Knowledge Capture Rate (KCR-K) measures capability maturity or development in the Knowledge
  Management domain. It is defined as Documented Solutions / Resolved Novel Issues; the result is stated
  in percent (%). It is applied across virtually every sector. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It should be maximized within the limits
  of cost and quality trade-offs.
abbreviation: KCR-K
unit: percent
version: 1.1.0
