id: dea:metric-average-handle-time
name: Average Handle Time
type: Metric
description: Average Handle Time (AHT) measures how efficiently resources are converted into outputs in
  the Contact Center domain. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Talk Time + Hold Time + After-Call Work Time / Calls
  Handled, expressed in minutes. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: AHT
unit: minute
