id: dea:metric-price-elasticity-of-demand
name: Price Elasticity of Demand
type: Metric
description: A Market Structure & Economics Standard Measures indicator, Price Elasticity of Demand (PED)
  quantifies the economic value created or preserved. It is defined as Percent Change in Quantity / Percent
  Change in Price; the result is stated in ratio (x:1 or x). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Values
  outside the intended band, on either side, warrant investigation.
