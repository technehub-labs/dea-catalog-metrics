id: dea:metric-earnings-per-share
name: Earnings per Share
type: Metric
description: Earnings per Share (EPS) measures the economic value created or preserved in the Finance
  & Accounting domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is (Net Income - Preferred Dividends) / Weighted Average Shares
  Outstanding, measured in currency value. Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
