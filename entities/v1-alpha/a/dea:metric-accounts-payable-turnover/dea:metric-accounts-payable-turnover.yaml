id: dea:metric-accounts-payable-turnover
name: Accounts Payable Turnover
type: Metric
description: Accounts Payable Turnover (APT) addresses how efficiently resources are converted into outputs
  and is a fixture of finance & accounting reporting. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Total Supply Purchases / Average Accounts Payable, measured
  in times per period. The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: APT
unit: times
