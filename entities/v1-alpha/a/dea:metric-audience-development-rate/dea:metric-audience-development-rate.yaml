id: dea:metric-audience-development-rate
name: Audience Development Rate
type: Metric
description: Within Arts & Culture, Audience Development Rate (ADR-A) is used to gauge growth over time.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Its calculation is First-Time Attendees / Total Attendance, measured in percent (%). Improvement
  means raising this figure toward best-in-class levels. It originates from and is most used in Arts &
  culture practice.
abbreviation: ADR-A
unit: percent
version: 1.1.0
