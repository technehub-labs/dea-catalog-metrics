id: dea:metric-app-size-delta-per-release
name: App Size Delta per Release
type: Metric
description: 'App Size Delta per Release (ASDR) captures how efficiently resources are converted into
  outputs for organizations tracking mobile & client development. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Change in Binary Size per Release; the result
  is stated in percent (%). It should be driven down, since lower readings signal healthier performance.
  In Software, it is a recognized element of the standard performance toolkit.'
