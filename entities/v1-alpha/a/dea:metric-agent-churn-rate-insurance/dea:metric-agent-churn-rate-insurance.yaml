id: dea:metric-agent-churn-rate-insurance
name: Agent Churn Rate (Insurance)
type: Metric
description: 'Agent Churn Rate (Insurance) (ACR-I) captures the retention of customers, users, or assets
  over time for organizations tracking insurance distribution & agency management. It is computed as Agents
  Terminating / Appointed Agents, expressed in percent (%). It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. Lower values are better; each reduction
  is an improvement. Its use is concentrated in Insurance.'
abbreviation: ACR-I
unit: percent
version: 1.1.0
lifecycle_status: candidate
