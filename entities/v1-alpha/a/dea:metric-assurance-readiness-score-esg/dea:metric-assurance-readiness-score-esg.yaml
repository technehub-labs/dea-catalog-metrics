id: dea:metric-assurance-readiness-score-esg
name: Assurance Readiness Score (ESG)
type: Metric
description: Assurance Readiness Score (ESG) (ARSS) measures conformance to standards, plans, or obligations
  in the Environmental, Social & Governance Reporting domain. Its calculation is Readiness Assessment
  for External Assurance, measured in score (points). It is applied across virtually every sector. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
