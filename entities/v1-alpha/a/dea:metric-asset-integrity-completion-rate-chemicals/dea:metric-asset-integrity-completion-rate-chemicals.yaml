id: dea:metric-asset-integrity-completion-rate-chemicals
name: Asset Integrity Completion Rate (Chemicals)
type: Metric
description: Within Chemicals & Specialty Materials, Asset Integrity Completion Rate (Chemicals) (AICR-C)
  is used to gauge exposure to adverse outcomes. Its calculation is Integrity Inspections Completed per
  Plan / Planned, measured in percent (%). It originates from and is most used in Chemicals practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: AICR-C
unit: percent
