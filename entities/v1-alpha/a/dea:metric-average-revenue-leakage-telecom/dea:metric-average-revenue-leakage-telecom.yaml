id: dea:metric-average-revenue-leakage-telecom
name: Average Revenue Leakage (Telecom)
type: Metric
description: A Telecom Customer Experience & Billing indicator, Average Revenue Leakage (Telecom) (ARLT)
  quantifies the economic value created or preserved. The formula is Billed Value Shortfalls / Total Billed
  Value - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Lower values are better; each reduction is an improvement. It is a standard
  measure in the Telecommunications sector.
abbreviation: ARLT
unit: percent
version: 1.1.0
