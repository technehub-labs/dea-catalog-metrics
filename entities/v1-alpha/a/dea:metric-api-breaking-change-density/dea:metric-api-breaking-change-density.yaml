id: dea:metric-api-breaking-change-density
name: API Breaking Change Density
type: Metric
description: 'Within Code Quality & Static Analysis, API Breaking Change Density (APBCD) is used to gauge
  exposure to adverse outcomes. The formula is Breaking Changes per Major Release - reported in ratio
  (x:1 or x). It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Lower values are better; each reduction is an improvement. It is a standard measure in the Software
  sector.'
