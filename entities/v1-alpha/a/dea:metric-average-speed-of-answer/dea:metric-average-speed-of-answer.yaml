id: dea:metric-average-speed-of-answer
name: Average Speed of Answer
type: Metric
description: 'A Contact Center indicator, Average Speed of Answer (ASA) quantifies how efficiently resources
  are converted into outputs. The formula is Total Answer Delay / Calls Answered - reported in seconds.
  It is applied across virtually every sector. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Reduction is the goal, and sustained decreases indicate successful
  intervention.'
abbreviation: ASA
unit: second
version: 1.1.0
