id: dea:metric-average-client-relationship-value
name: Average Client Relationship Value
type: Metric
description: A Wealth Management indicator, Average Client Relationship Value (ACRV) quantifies the economic
  value created or preserved. The formula is Assets under Management / Client Relationships - reported
  in currency value. It is a standard measure in the Wealth management sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: ACRV
unit: currency
