id: dea:metric-average-length-of-stay
name: Average Length of Stay
type: Metric
description: Average Length of Stay (ALOS) addresses how efficiently resources are converted into outputs
  and is a fixture of healthcare reporting. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Total Inpatient Days / Total Discharges - reported
  in days. It should be driven down, since lower readings signal healthier performance. It is a standard
  measure in the Healthcare sector.
abbreviation: ALOS
unit: day
version: 1.1.0
