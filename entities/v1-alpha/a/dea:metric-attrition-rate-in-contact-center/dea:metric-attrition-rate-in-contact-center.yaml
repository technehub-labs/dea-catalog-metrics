id: dea:metric-attrition-rate-in-contact-center
name: Attrition Rate in Contact Center
type: Metric
description: Attrition Rate in Contact Center (CTR-AR) captures exposure to adverse outcomes for organizations
  tracking contact center. It is defined as Agent Departures / Average Agent Headcount; the result is
  stated in percent (%). It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. Lower values are better; each reduction is an improvement. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CTR-AR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- risk
scope_classification:
