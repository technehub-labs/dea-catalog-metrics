id: dea:metric-airfield-safety-event-rate
name: Airfield Safety Event Rate
type: Metric
description: Airfield Safety Event Rate (ASER-A) addresses exposure to adverse outcomes and is a fixture
  of airport operations (deep dive) reporting. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Runway Incursions or Excursions per 100,000 Movements;
  the result is stated in events per thousand or million (scaled). It should be driven down, since lower
  readings signal healthier performance. In Aviation, it is a recognized element of the standard performance
  toolkit.
abbreviation: ASER-A
