id: dea:metric-api-consumer-onboarding-cycle-time
name: API Consumer Onboarding Cycle Time
type: Metric
description: 'Within API Lifecycle Management, API Consumer Onboarding Cycle Time (APIONB) is used to
  gauge how efficiently resources are converted into outputs. It is defined as Days from Key Request to
  Production Consumption; the result is stated in days. In Software, it is a recognized element of the
  standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: APIONB
unit: day
version: 1.1.0
lifecycle_status: candidate
