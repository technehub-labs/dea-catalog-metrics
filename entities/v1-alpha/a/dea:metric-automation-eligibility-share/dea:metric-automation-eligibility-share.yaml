quality:
  validation_rules:
  - Eligibility criteria version MUST be recorded with every reported value.
  - Items without a completed eligibility assessment MUST be excluded and reported separately as assessment coverage.
  known_limitations:
  - High eligibility is not high value or benefit; the measure says nothing about risk or outcomes.
  - Permissive criteria inflate the share; criteria versions are part of the provenance.
