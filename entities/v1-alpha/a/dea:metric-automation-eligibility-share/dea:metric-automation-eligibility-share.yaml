id: dea:metric-automation-eligibility-share
name: Automation Eligibility Share
type: Metric
description: Automation Eligibility Share (AES) quantifies the automatable base of a process - the
  share of assessed work items classified eligible for automation under documented, versioned
  criteria. The formula is Work Items Classified Eligible / Assessed Work Items - reported in percent
  (%). Eligibility judgments are assessor-dependent, so the criteria version and inter-assessor
  agreement are part of any reported value. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it supports automation scoping,
  eligibility assessment, and investment decisions.
abbreviation: AES
unit: percent
version: 1.0.0
lifecycle_status: candidate
subject_classification:
- business_architecture
purpose_classification:
- capability
scope_classification:
- process
directionality: higher_is_better
management_significance:
