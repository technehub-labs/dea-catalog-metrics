- managerial
measurable_entity_kind: dea:BusinessProcess
reputability_tier: framework_derived
unit_ref: dea:unit-ratio-percent
source_credit: MAMA (Measuring Automation & Measuring Autonomy) mama-metrics metric library v0.1.1 (CC-BY-4.0)
calculation_definition: AES = (Work Items Classified Eligible / Assessed Work Items) * 100
formula_definition:
  formula_id: dea:formula-automation-eligibility-share
  expression: AES = (Work Items Classified Eligible / Assessed Work Items) * 100
  inputs:
  - name: Work Items Classified Eligible
  - name: Assessed Work Items
  operators:
  - divide
  - multiply
  parameters: []
  unit_semantics:
    input_units: []
