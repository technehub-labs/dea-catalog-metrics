id: dea:metric-ad-fill-rate
name: Ad Fill Rate
type: Metric
description: 'Ad Fill Rate (AFR) measures the utilization or availability of capacity in the Media & Entertainment
  domain. It is a working-level control: thresholds trigger immediate operational response. It is defined
  as Ads Delivered / Ad Slots Available; the result is stated in percent (%). Improvement means raising
  this figure toward best-in-class levels. In Media & entertainment, it is a recognized element of the
  standard performance toolkit.'
abbreviation: AFR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
