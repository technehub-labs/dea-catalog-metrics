id: dea:metric-average-revenue-per-user-telecom
name: Average Revenue per User (Telecom)
type: Metric
description: Within Telecommunications, Average Revenue per User (Telecom) (ARPU-T) is used to gauge the
  economic value created or preserved. The formula is Service Revenue / Average Subscribers - reported
  in currency per unit. It is a standard measure in the Telecommunications sector. It carries weight in
  boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: ARPU-T
