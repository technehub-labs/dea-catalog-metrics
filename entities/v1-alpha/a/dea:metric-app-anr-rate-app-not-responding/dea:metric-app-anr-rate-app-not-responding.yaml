id: dea:metric-app-anr-rate-app-not-responding
name: App ANR Rate (App Not Responding)
type: Metric
description: App ANR Rate (App Not Responding) (ANRR) captures the quality of outputs and outcomes for
  organizations tracking mobile & client development. It is computed as ANR Events / Sessions, expressed
  in events per thousand or million (scaled). Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Software.
abbreviation: ANRR
