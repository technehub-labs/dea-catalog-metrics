id: dea:metric-alarm-storm-duration
name: Alarm Storm Duration
type: Metric
description: A Network Operations Center (Deep Dive) indicator, Alarm Storm Duration (ASD-NOC) quantifies
  exposure to adverse outcomes. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Minutes of Correlated Alert Flooding per Storm Event,
  expressed in minutes. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
