id: dea:metric-alpha-jensen-deep-dive
name: Alpha (Jensen) (Deep Dive)
type: Metric
description: Alpha (Jensen) (Deep Dive) (AJDD) measures the economic value created or preserved in the
  Investment Performance Measurement domain. The formula is Portfolio Return above CAPM-Predicted Return
  - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Investment management sector.
abbreviation: AJDD
unit: percent
version: 1.1.0
