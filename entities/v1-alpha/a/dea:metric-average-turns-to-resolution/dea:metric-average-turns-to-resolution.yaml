id: dea:metric-average-turns-to-resolution
name: Average Turns to Resolution
type: Metric
description: 'Average Turns to Resolution (ATTR) addresses how efficiently resources are converted into
  outputs and is a fixture of conversational ai & chatbots reporting. It is defined as Conversation Turns
  before Resolution / Resolved Conversations; the result is stated in ratio (x:1 or x). It is applied
  across virtually every sector. It is a working-level control: thresholds trigger immediate operational
  response. Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: ATTR
unit: ratio
version: 1.1.0
