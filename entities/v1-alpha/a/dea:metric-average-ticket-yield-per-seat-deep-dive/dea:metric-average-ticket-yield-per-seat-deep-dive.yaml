id: dea:metric-average-ticket-yield-per-seat-deep-dive
name: Average Ticket Yield per Seat (Deep Dive)
type: Metric
description: Within Sports Clubs & Leagues (Deep Dive), Average Ticket Yield per Seat (Deep Dive) (ATYS-D)
  is used to gauge the economic value created or preserved. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Ticket Revenue / Available
  Seats, measured in currency per unit. Improvement means raising this figure toward best-in-class levels.
  It originates from and is most used in Sports practice.
abbreviation: ATYS-D
