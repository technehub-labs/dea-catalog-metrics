id: dea:metric-application-abandonment-rate-lending
name: Application Abandonment Rate (Lending)
type: Metric
description: 'Application Abandonment Rate (Lending) (AAR-L) captures exposure to adverse outcomes for
  organizations tracking retail banking & lending. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Abandoned Applications / Started
  Applications - reported in percent (%). It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Banking sector.'
abbreviation: AAR-L
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
- risk
scope_classification:
- capability
directionality: lower_is_better
