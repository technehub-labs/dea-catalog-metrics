id: dea:metric-agency-audit-exception-rate
name: Agency Audit Exception Rate
type: Metric
description: Agency Audit Exception Rate (AAER) addresses conformance to standards, plans, or obligations
  and is a fixture of insurance distribution & agency management reporting. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Audit Exceptions / Audit Items
  Reviewed, measured in percent (%). It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Insurance practice.
abbreviation: AAER
unit: percent
version: 1.1.0
