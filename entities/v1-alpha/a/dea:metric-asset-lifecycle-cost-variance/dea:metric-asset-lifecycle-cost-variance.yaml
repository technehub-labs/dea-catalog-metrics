id: dea:metric-asset-lifecycle-cost-variance
name: Asset Lifecycle Cost Variance
type: Metric
description: 'Asset Lifecycle Cost Variance (ALCV) measures the economic value created or preserved in
  the Field Service & Asset Performance domain. It is computed as Actual Lifecycle Cost vs Plan / Plan,
  expressed in percent (%). It is applied across virtually every sector. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Values outside the intended band,
  on either side, warrant investigation.'
abbreviation: ALCV
unit: percent
version: 1.1.0
