id: dea:metric-addressable-spend-coverage
name: Addressable Spend Coverage
type: Metric
description: Within Strategic Sourcing & Supplier Performance (Deep Dive), Addressable Spend Coverage
  (ASC-SS) is used to gauge how efficiently resources are converted into outputs. It is defined as Spend
  under Sourcing Management / Total Third-Party Spend; the result is stated in percent (%). It is applied
  across virtually every sector. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: ASC-SS
unit: percent
version: 1.1.0
