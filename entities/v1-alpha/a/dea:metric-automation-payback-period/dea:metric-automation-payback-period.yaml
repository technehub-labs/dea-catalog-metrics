id: dea:metric-automation-payback-period
name: Automation Payback Period
type: Metric
description: Within Automation & Robotic Process Automation, Automation Payback Period (APP-A) is used
  to gauge the economic value created or preserved. The formula is Implementation Cost / Monthly Cost
  Avoidance - reported in days. It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
