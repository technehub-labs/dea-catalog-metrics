id: dea:metric-alpha
name: Alpha
type: Metric
description: 'Within Investment Management, Alpha (ALPHA) is used to gauge the economic value created
  or preserved. It is computed as Portfolio Return - Benchmark-Adjusted Expected Return, expressed in
  percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Asset management.'
abbreviation: ALPHA
unit: percent
