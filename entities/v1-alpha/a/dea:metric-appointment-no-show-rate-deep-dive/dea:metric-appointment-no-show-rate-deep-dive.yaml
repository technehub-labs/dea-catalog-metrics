id: dea:metric-appointment-no-show-rate-deep-dive
name: Appointment No-Show Rate (Deep Dive)
type: Metric
description: Appointment No-Show Rate (Deep Dive) (ANSR-D) measures how efficiently resources are converted
  into outputs in the Medical Practice & Clinical Operations domain. It provides the day-to-day signal
  that a process is running as designed. Its calculation is Missed Appointments without Cancellation /
  Scheduled, measured in percent (%). It should be driven down, since lower readings signal healthier
  performance. It originates from and is most used in Healthcare practice.
abbreviation: ANSR-D
unit: percent
