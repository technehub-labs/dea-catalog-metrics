id: dea:metric-actuarial-data-quality-score
name: Actuarial Data Quality Score
type: Metric
description: 'Actuarial Data Quality Score (ADQS) captures the quality of outputs and outcomes for organizations
  tracking actuarial & reserving. The formula is Weighted Data Quality Dimensions Score - reported in
  index (0-100 or normalized). It is a standard measure in the Insurance sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. It should be maximized
  within the limits of cost and quality trade-offs.'
