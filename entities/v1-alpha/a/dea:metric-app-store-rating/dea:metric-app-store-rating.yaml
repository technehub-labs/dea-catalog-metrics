id: dea:metric-app-store-rating
name: App Store Rating
type: Metric
description: App Store Rating (ASR-MOB) measures the economic value created or preserved in the Mobile
  & Client Development domain. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Average User Rating across App Stores - reported in score
  (points). Improvement means raising this figure toward best-in-class levels. It is a standard measure
  in the Software sector.
abbreviation: ASR-MOB
unit: score
