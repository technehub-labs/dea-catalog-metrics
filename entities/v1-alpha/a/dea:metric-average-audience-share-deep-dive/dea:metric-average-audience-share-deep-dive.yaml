id: dea:metric-average-audience-share-deep-dive
name: Average Audience Share (Deep Dive)
type: Metric
description: Average Audience Share (Deep Dive) (AAS-D) measures growth over time in the Broadcasting
  & Streaming Media domain. The formula is Viewers of Channel / Total Viewers - reported in percent (%).
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Higher values are better; gains are read as improvement and losses as deterioration. It is a standard
  measure in the Media & Entertainment sector.
abbreviation: AAS-D
unit: percent
version: 1.1.0
