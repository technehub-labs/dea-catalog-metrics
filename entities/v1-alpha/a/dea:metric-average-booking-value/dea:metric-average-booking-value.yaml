id: dea:metric-average-booking-value
name: Average Booking Value
type: Metric
description: 'Within Travel & Tourism, Average Booking Value (ABV-T) is used to gauge the economic value
  created or preserved. The formula is Total Booking Revenue / Bookings - reported in currency value.
  It is a standard measure in the Travel & tourism sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. It should be maximized within the limits
  of cost and quality trade-offs.'
