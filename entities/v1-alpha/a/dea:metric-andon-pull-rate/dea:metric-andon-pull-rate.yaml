id: dea:metric-andon-pull-rate
name: Andon Pull Rate
type: Metric
description: A Automotive Manufacturing (Deep Dive) indicator, Andon Pull Rate (APR-A) quantifies the
  quality of outputs and outcomes. Its calculation is Line Stops Triggered / Shifts, measured in count
  (items per period). It originates from and is most used in Automotive practice. It provides the day-to-day
  signal that a process is running as designed. Values outside the intended band, on either side, warrant
  investigation.
abbreviation: APR-A
unit: count
