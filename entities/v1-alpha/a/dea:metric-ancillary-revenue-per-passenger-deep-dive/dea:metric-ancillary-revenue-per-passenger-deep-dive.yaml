id: dea:metric-ancillary-revenue-per-passenger-deep-dive
name: Ancillary Revenue per Passenger (Deep Dive)
type: Metric
description: Ancillary Revenue per Passenger (Deep Dive) (ARPP-D) measures the economic value created
  or preserved in the Airline Operations (Deep Dive) domain. Its calculation is Ancillary Revenue / Passengers,
  measured in currency per unit. It originates from and is most used in Airlines practice. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
