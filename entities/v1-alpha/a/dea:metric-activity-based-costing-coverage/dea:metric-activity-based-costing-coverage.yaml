id: dea:metric-activity-based-costing-coverage
name: Activity-Based Costing Coverage
type: Metric
description: A Product Costing & Margin Management indicator, Activity-Based Costing Coverage (ABCC) quantifies
  capability maturity or development. It is computed as Products Costed via ABC Model / Products Costed,
  expressed in percent (%). It is applied across virtually every sector. It is reviewed at cadence by
  planning owners to correct course before issues become strategic. It should be maximized within the
  limits of cost and quality trade-offs.
abbreviation: ABCC
unit: percent
