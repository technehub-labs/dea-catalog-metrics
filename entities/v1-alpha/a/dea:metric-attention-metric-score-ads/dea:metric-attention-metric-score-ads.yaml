id: dea:metric-attention-metric-score-ads
name: Attention Metric Score (Ads)
type: Metric
description: Attention Metric Score (Ads) (AMS) addresses how effectively a process or entity achieves
  its intended outcome and is a fixture of advertising & media buying reporting. Its calculation is Composite
  Attention Measurement Score, measured in score (points). Its value drives prioritization and resource
  reallocation among competing initiatives. Higher values are better; gains are read as improvement and
  losses as deterioration. It originates from and is most used in Media & Entertainment practice.
abbreviation: AMS
