id: dea:metric-afferent-coupling-fan-in
name: Afferent Coupling (Fan-In)
type: Metric
description: Within Code Quality & Static Analysis, Afferent Coupling (Fan-In) (AFFC) is used to gauge
  the quality of outputs and outcomes. It is computed as Inbound Dependencies per Module, expressed in
  count (items per period). Its use is concentrated in Software. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. Values outside the intended band, on
  either side, warrant investigation.
