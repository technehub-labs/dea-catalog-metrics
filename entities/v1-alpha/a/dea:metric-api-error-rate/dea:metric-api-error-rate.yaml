id: dea:metric-api-error-rate
name: API Error Rate
type: Metric
description: Within Software Engineering, API Error Rate (APIER) is used to gauge the quality of outputs
  and outcomes. It is computed as Failed API Requests / Total API Requests, expressed in percent (%).
  It is applied across virtually every sector. Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: APIER
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- quality
scope_classification:
- capability
directionality: lower_is_better
management_significance:
- operational
measurable_entity_kind: dea:ApplicationComponent
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Failed API Requests / Total API Requests
formula_definition:
  formula_id: dea:formula-api-error-rate
  expression: APIER = Failed API Requests / Total API Requests
  inputs:
  - name: Failed API Requests
  - name: Total API Requests
