id: dea:metric-adverse-event-reporting-timeliness-deep-dive
name: Adverse Event Reporting Timeliness (Deep Dive)
type: Metric
description: Adverse Event Reporting Timeliness (Deep Dive) (AERT) measures conformance to standards,
  plans, or obligations in the Pharma R&D & Clinical Trials domain. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as AE Reports Filed within Regulatory
  Window / Reports; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. In Pharmaceuticals, it is a recognized element of the standard performance toolkit.
abbreviation: AERT
unit: percent
