id: dea:metric-average-revenue-per-streaming-subscriber
name: Average Revenue per Streaming Subscriber
type: Metric
description: A Broadcasting & Streaming Media indicator, Average Revenue per Streaming Subscriber (ARPS)
  quantifies the economic value created or preserved. It is defined as Subscription Revenue / Subscribers;
  the result is stated in currency per unit. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Higher values are better; gains are read as improvement and losses
  as deterioration. In Media & Entertainment, it is a recognized element of the standard performance toolkit.
abbreviation: ARPS
unit: currency
