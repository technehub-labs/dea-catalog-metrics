id: dea:metric-article-defect-rate
name: Article Defect Rate
type: Metric
description: Article Defect Rate (ADR-KM) measures the quality of outputs and outcomes in the Knowledge
  Management (Deep Dive) domain. Its calculation is Articles Flagged Incorrect / Articles, measured in
  events per thousand or million (scaled). It is applied across virtually every sector. It provides the
  day-to-day signal that a process is running as designed. Reduction is the goal, and sustained decreases
  indicate successful intervention.
