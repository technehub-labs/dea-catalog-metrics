id: dea:metric-audit-findings-recurrence
name: Audit Findings Recurrence
type: Metric
description: Audit Findings Recurrence (AFR) captures the quality of outputs and outcomes for organizations
  tracking risk & compliance. Its calculation is Repeat Findings / Total Findings, measured in percent
  (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: AFR
unit: percent
version: 1.1.0
lifecycle_status: candidate
