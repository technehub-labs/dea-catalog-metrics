id: dea:metric-average-attendance-per-performance
name: Average Attendance per Performance
type: Metric
description: Average Attendance per Performance (AAP) measures the utilization or availability of capacity
  in the Arts & Culture domain. It provides the day-to-day signal that a process is running as designed.
  Its calculation is Total Attendance / Performances, measured in count (items per period). Improvement
  means raising this figure toward best-in-class levels. It originates from and is most used in Arts &
  culture practice.
abbreviation: AAP
unit: count
version: 1.1.0
lifecycle_status: candidate
