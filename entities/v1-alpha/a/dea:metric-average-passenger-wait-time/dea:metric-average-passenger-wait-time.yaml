id: dea:metric-average-passenger-wait-time
name: Average Passenger Wait Time
type: Metric
description: 'Within Public Transit, Average Passenger Wait Time (APWT) is used to gauge the quality of
  outputs and outcomes. The formula is Observed Waiting Time at Stops, Averaged - reported in minutes.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. Lower values
  are better; each reduction is an improvement. It is a standard measure in the Public transit sector.'
