id: dea:metric-architecture-review-pass-rate
name: Architecture Review Pass Rate
type: Metric
description: A Enterprise Architecture indicator, Architecture Review Pass Rate (ARPR) quantifies the
  quality of outputs and outcomes. It is defined as Designs Approved at First Review / Designs Reviewed;
  the result is stated in percent (%). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: ARPR
unit: percent
