id: dea:metric-alternate-site-readiness-rate
name: Alternate Site Readiness Rate
type: Metric
description: Alternate Site Readiness Rate (ASRR) measures exposure to adverse outcomes in the Business
  Continuity & Disaster Recovery domain. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Its calculation is Recovery Sites Passing Readiness Check
  / Recovery Sites, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: ASRR
unit: percent
