id: dea:metric-ai-incident-escalation-compliance
name: AI Incident Escalation Compliance
type: Metric
description: A AI Governance & Model Risk Management indicator, AI Incident Escalation Compliance (AIIEC)
  quantifies conformance to standards, plans, or obligations. It is defined as AI Incidents Escalated
  per Policy / Incidents; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: AIIEC
unit: percent
