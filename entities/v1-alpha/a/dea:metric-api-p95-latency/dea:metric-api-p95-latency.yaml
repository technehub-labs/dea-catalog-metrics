id: dea:metric-api-p95-latency
name: API P95 Latency
type: Metric
description: 'A API Lifecycle Management indicator, API P95 Latency (APIP95) quantifies the quality of
  outputs and outcomes. It is defined as 95th Percentile Round-Trip Response Time; the result is stated
  in milliseconds (ms). It is a working-level control: thresholds trigger immediate operational response.
  Lower values are better; each reduction is an improvement. In Software, it is a recognized element of
  the standard performance toolkit.'
