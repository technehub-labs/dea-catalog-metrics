id: dea:metric-average-revenue-per-subscriber
name: Average Revenue per Subscriber
type: Metric
description: 'Average Revenue per Subscriber (ARPS) measures the economic value created or preserved in
  the Media & Entertainment domain. It is computed as Subscription Revenue / Average Subscribers, expressed
  in currency per unit. Its use is concentrated in Media & entertainment. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
abbreviation: ARPS
unit: currency
version: 1.1.0
lifecycle_status: candidate
