id: dea:metric-ai-regulatory-watch-item-closure-rate
name: AI Regulatory Watch Item Closure Rate
type: Metric
description: AI Regulatory Watch Item Closure Rate (AIRWIC) addresses conformance to standards, plans,
  or obligations and is a fixture of ai governance & model risk management reporting. Its value drives
  prioritization and resource reallocation among competing initiatives. Its calculation is Regulatory
  Watch Actions Closed by Date / Actions, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: AIRWIC
unit: percent
