id: dea:metric-api-security-test-coverage
name: API Security Test Coverage
type: Metric
description: API Security Test Coverage (APSTC) captures exposure to adverse outcomes for organizations
  tracking devsecops & application security engineering. It is defined as APIs with Security Test Suite
  / Exposed APIs; the result is stated in percent (%). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: APSTC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- risk
scope_classification:
- capability
directionality: higher_is_better
management_significance:
