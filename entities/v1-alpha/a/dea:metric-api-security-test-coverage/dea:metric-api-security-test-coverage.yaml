source_credit: Public domain - no attribution required
calculation_definition: APIs with Security Test Suite / Exposed APIs
formula_definition:
  formula_id: dea:formula-api-security-test-coverage
  expression: APSTC = APIs with Security Test Suite / Exposed APIs
  inputs:
  - name: APIs with Security Test Suite
  - name: Exposed APIs
