id: dea:metric-automation-assisted-change-rate
name: Automation-Assisted Change Rate
type: Metric
description: 'Automation-Assisted Change Rate (AACR) addresses how efficiently resources are converted
  into outputs and is a fixture of network change & configuration management reporting. It is computed
  as Changes Executed via Automation / Changes, expressed in percent (%). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
abbreviation: AACR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
