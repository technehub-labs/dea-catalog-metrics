id: dea:metric-auto-remediation-execution-rate
name: Auto-Remediation Execution Rate
type: Metric
description: Within Network Operations Center (Deep Dive), Auto-Remediation Execution Rate (ARER-NOC)
  is used to gauge how efficiently resources are converted into outputs. Its calculation is Alerts Auto-Remediated
  without Human Touch / Auto-Eligible Alerts, measured in percent (%). It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
abbreviation: ARER-NOC
unit: percent
