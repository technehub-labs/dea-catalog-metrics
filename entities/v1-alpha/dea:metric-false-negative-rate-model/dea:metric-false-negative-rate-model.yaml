id: dea:metric-false-negative-rate-model
name: False Negative Rate (Model)
type: Metric
description: A Statistical Model Performance Diagnostics indicator, False Negative Rate (Model) (FNRM)
  quantifies exposure to adverse outcomes. It is computed as False Negatives / Actual Positives, expressed
  in percent (%). Its use is concentrated in Software. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: FNRM
unit: percent
