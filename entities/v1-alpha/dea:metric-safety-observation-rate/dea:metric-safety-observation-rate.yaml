id: dea:metric-safety-observation-rate
name: Safety Observation Rate
type: Metric
description: Safety Observation Rate (SOR) addresses the engagement or satisfaction of the people involved
  and is a fixture of health & safety reporting. It is computed as Behavioral Safety Observations Completed
  per Employee, expressed in ratio (x:1 or x). It is applied across virtually every sector. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It should
  be maximized within the limits of cost and quality trade-offs.
