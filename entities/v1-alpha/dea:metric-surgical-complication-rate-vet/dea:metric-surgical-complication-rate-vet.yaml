id: dea:metric-surgical-complication-rate-vet
name: Surgical Complication Rate (Vet)
type: Metric
description: 'Surgical Complication Rate (Vet) (SCR-V) captures exposure to adverse outcomes for organizations
  tracking veterinary & animal health. It is computed as Complications / Surgical Procedures, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Lower values are better; each reduction is an improvement. Its use is concentrated in
  Healthcare.'
