id: dea:metric-gate-decision-cycle-time
name: Gate Decision Cycle Time
type: Metric
description: Gate Decision Cycle Time (GDCT) captures how efficiently resources are converted into outputs
  for organizations tracking pmo & portfolio governance. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Days from Gate Submission to Decision,
  expressed in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
