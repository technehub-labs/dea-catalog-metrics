id: dea:metric-clean-claim-rate
name: Clean Claim Rate
type: Metric
description: Clean Claim Rate (CCR-H) measures the quality of outputs and outcomes in the Healthcare Revenue
  Cycle domain. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Claims Accepted on First Submission / Claims Submitted - reported in percent
  (%). Improvement means raising this figure toward best-in-class levels. It is a standard measure in
  the Healthcare sector.
