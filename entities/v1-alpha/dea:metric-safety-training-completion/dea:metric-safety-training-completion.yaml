id: dea:metric-safety-training-completion
name: Safety Training Completion
type: Metric
description: 'Safety Training Completion (STC) measures conformance to standards, plans, or obligations
  in the Health & Safety domain. It is defined as Employees Completing Safety Training / Required; the
  result is stated in percent (%). It is a working-level control: thresholds trigger immediate operational
  response. Higher values are better; gains are read as improvement and losses as deterioration. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.'
