id: dea:metric-nursing-hours-per-patient-day
name: Nursing Hours per Patient Day
type: Metric
description: 'Nursing Hours per Patient Day (NHPPD) addresses the utilization or availability of capacity
  and is a fixture of medical practice & clinical operations reporting. The formula is Nursing Care Hours
  / Patient Days - reported in ratio (x:1 or x). It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. It is managed toward a defined target band rather than
  an extreme - both overshoot and undershoot can signal problems. It is a standard measure in the Healthcare
  sector.'
