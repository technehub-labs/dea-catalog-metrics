id: dea:metric-service-accessibility-standard-compliance-public
name: Service Accessibility Standard Compliance (Public)
type: Metric
description: Service Accessibility Standard Compliance (Public) (SASCP) measures conformance to standards,
  plans, or obligations in the Public Sector & Citizen Service Standard Measures (Deep Dive) domain. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. The
  formula is Services Meeting Accessibility Obligations / Services - reported in percent (%). Improvement
  means raising this figure toward best-in-class levels. It is a standard measure in the Public sector
  sector.
