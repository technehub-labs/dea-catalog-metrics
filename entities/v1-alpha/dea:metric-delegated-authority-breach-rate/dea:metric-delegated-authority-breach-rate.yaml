id: dea:metric-delegated-authority-breach-rate
name: Delegated Authority Breach Rate
type: Metric
description: Delegated Authority Breach Rate (DABR) captures conformance to standards, plans, or obligations
  for organizations tracking regulatory affairs & compliance operations. Its calculation is Decisions
  beyond Delegated Limits / Decisions Sampled, measured in events per thousand or million (scaled). It
  is applied across virtually every sector. Its value drives prioritization and resource reallocation
  among competing initiatives. Reduction is the goal, and sustained decreases indicate successful intervention.
