id: dea:metric-on-time-delivery-rate
name: On-Time Delivery Rate
type: Metric
description: 'Within Logistics & Transportation, On-Time Delivery Rate (ODR) is used to gauge the quality
  of outputs and outcomes. The formula is Deliveries On Time / Total Deliveries - reported in percent
  (%). It is a standard measure in the Logistics sector. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. It should be maximized within the limits of cost
  and quality trade-offs.'
abbreviation: ODR
unit: percent
