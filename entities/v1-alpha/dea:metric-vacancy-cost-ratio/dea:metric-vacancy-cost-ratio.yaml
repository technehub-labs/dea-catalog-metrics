id: dea:metric-vacancy-cost-ratio
name: Vacancy Cost Ratio
type: Metric
description: Within Real Estate Portfolio & Property Management, Vacancy Cost Ratio (VCR-E) is used to
  gauge exposure to adverse outcomes. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Lost Rent from Vacancy / Gross Potential Rent,
  measured in percent (%). It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Real Estate practice.
