id: dea:metric-accessibility-conformance-level
name: Accessibility Conformance Level
type: Metric
description: A UX & Design Systems indicator, Accessibility Conformance Level (ACL-UX) quantifies conformance
  to standards, plans, or obligations. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Interfaces Meeting WCAG 2.2 AA / Interfaces in
  Scope - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: ACL-UX
unit: percent
