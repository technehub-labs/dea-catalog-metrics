id: dea:metric-third-party-ai-risk-assessment-coverage
name: Third-Party AI Risk Assessment Coverage
type: Metric
description: Third-Party AI Risk Assessment Coverage (TAIRA) addresses exposure to adverse outcomes and
  is a fixture of ai governance & model risk management reporting. Its calculation is Vendor AI Tools
  Assessed / Tools in Use, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: TAIRA
unit: percent
version: 1.0.1
