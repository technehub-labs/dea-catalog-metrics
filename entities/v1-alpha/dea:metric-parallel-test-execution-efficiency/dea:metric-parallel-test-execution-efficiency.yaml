id: dea:metric-parallel-test-execution-efficiency
name: Parallel Test Execution Efficiency
type: Metric
description: Parallel Test Execution Efficiency (PTEE) addresses how efficiently resources are converted
  into outputs and is a fixture of continuous integration reporting. It is computed as Speedup from Parallelization
  / Theoretical Maximum, expressed in percent (%). Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: PTEE
unit: percent
