id: dea:metric-waste-intensity
name: Waste Intensity
type: Metric
description: Waste Intensity (WI) addresses environmental and social sustainability performance and is
  a fixture of manufacturing reporting. Its calculation is Waste Mass / Unit Produced, measured in ratio
  (x:1 or x). Its value drives prioritization and resource reallocation among competing initiatives. Lower
  values are better; each reduction is an improvement. It originates from and is most used in Manufacturing
  practice.
abbreviation: WI
