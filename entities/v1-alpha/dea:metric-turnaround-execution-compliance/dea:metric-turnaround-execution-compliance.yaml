id: dea:metric-turnaround-execution-compliance
name: Turnaround Execution Compliance
type: Metric
description: Turnaround Execution Compliance (TAEC) addresses conformance to standards, plans, or obligations
  and is a fixture of oil & gas reporting. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Turnarounds Completed on Schedule and Budget / Turnarounds,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. It originates
  from and is most used in Oil & gas practice.
