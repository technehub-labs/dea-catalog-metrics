id: dea:metric-mean-life-mttf-deep-dive
name: Mean Life (MTTF Deep Dive)
type: Metric
description: Mean Life (MTTF Deep Dive) (MLDD) addresses the quality of outputs and outcomes and is a
  fixture of reliability & maintainability engineering (deep dive) reporting. Its calculation is Total
  Operating Time to Failure / Failed Units, measured in hours. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: MLDD
unit: hour
