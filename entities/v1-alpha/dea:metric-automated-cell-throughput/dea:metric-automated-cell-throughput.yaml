id: dea:metric-automated-cell-throughput
name: Automated Cell Throughput
type: Metric
description: 'A Industrial Automation & Robotics indicator, Automated Cell Throughput (ACT) quantifies
  the utilization or availability of capacity. It is defined as Units Produced per Automated Cell per
  Shift; the result is stated in count (items per period). It is a working-level control: thresholds trigger
  immediate operational response. Higher values are better; gains are read as improvement and losses as
  deterioration. In Manufacturing, it is a recognized element of the standard performance toolkit.'
abbreviation: ACT
unit: count
