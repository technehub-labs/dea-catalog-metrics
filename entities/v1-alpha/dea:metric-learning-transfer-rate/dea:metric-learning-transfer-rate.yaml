id: dea:metric-learning-transfer-rate
name: Learning Transfer Rate
type: Metric
description: Learning Transfer Rate (LTR) measures how effectively a process or entity achieves its intended
  outcome in the Learning & Development domain. The formula is Learners Applying Skills on Job after Training
  / Learners Trained - reported in percent (%). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: LTR
unit: percent
