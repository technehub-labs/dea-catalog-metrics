name: NOC Quality Assurance Audit Score
type: Metric
description: 'Within Network Operations Center (Deep Dive), NOC Quality Assurance Audit Score (NQAS) is
  used to gauge the quality of outputs and outcomes. The formula is Composite Ticket and Process Audit
  Score - reported in score (points). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
