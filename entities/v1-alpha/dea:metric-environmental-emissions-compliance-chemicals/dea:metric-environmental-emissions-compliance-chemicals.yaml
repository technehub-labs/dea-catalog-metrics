id: dea:metric-environmental-emissions-compliance-chemicals
name: Environmental Emissions Compliance (Chemicals)
type: Metric
description: Environmental Emissions Compliance (Chemicals) (EECC) measures conformance to standards,
  plans, or obligations in the Chemicals & Specialty Materials domain. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Emission
  Tests within Permits / Tests, measured in percent (%). Improvement means raising this figure toward
  best-in-class levels. It originates from and is most used in Chemicals practice.
