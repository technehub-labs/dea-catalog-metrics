id: dea:metric-circular-material-use-rate
name: Circular Material Use Rate
type: Metric
description: Circular Material Use Rate (CMUR) addresses environmental and social sustainability performance
  and is a fixture of sustainability & esg reporting. Its calculation is Secondary Materials / Total Materials
  Used, measured in percent (%). It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: CMUR
unit: percent
