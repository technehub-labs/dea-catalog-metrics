id: dea:metric-fraud-detection-rate-enterprise
name: Fraud Detection Rate (Enterprise)
type: Metric
description: A Enterprise Fraud & Financial Crime Management indicator, Fraud Detection Rate (Enterprise)
  (FDER) quantifies exposure to adverse outcomes. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Fraud Detected before Loss Fully
  Incurred / Confirmed Fraud, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
