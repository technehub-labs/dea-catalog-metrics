type: Metric
description: 'Environment Refresh Cycle Compliance (ERCC) addresses conformance to standards, plans, or
  obligations and is a fixture of release management & environments reporting. The formula is Refreshes
  Completed per Policy Schedule / Due - reported in percent (%). It is applied across virtually every
  sector. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
