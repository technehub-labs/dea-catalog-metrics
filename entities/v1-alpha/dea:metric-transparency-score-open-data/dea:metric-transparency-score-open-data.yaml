id: dea:metric-transparency-score-open-data
name: Transparency Score (Open Data)
type: Metric
description: 'A Public Sector & Government indicator, Transparency Score (Open Data) (TSOD) quantifies
  conformance to standards, plans, or obligations. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Datasets Published in Open Format
  / Datasets Identified - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Public sector sector.'
abbreviation: TSOD
unit: percent
