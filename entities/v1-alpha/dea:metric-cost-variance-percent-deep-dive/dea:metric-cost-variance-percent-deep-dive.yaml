id: dea:metric-cost-variance-percent-deep-dive
name: Cost Variance Percent (Deep Dive)
type: Metric
description: 'Cost Variance Percent (Deep Dive) (CVP-D) captures conformance to standards, plans, or obligations
  for organizations tracking project management (deep dive). It is computed as (Actual Cost - Baseline
  Cost) / Baseline Cost, expressed in percent (%). It is applied across virtually every sector. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. Values
  outside the intended band, on either side, warrant investigation.'
