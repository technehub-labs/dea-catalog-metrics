id: dea:metric-return-rate
name: Return Rate
type: Metric
description: Return Rate (RTR) captures exposure to adverse outcomes for organizations tracking retail
  & e-commerce. It is defined as Returned Orders / Orders Shipped; the result is stated in percent (%).
  It bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  Lower values are better; each reduction is an improvement. In Retail, it is a recognized element of
  the standard performance toolkit.
abbreviation: RTR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
