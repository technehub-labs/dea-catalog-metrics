id: dea:metric-adverse-impact-analysis-currency
name: Adverse Impact Analysis Currency
type: Metric
description: Adverse Impact Analysis Currency (AIAC-E) captures conformance to standards, plans, or obligations
  for organizations tracking ai ethics, fairness & responsible ai. Its calculation is Analyses Completed
  within Required Cycle / Due, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
