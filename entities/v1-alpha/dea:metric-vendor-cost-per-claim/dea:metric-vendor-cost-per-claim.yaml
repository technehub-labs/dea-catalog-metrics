id: dea:metric-vendor-cost-per-claim
name: Vendor Cost per Claim
type: Metric
description: Vendor Cost per Claim (VCC) captures how efficiently resources are converted into outputs
  for organizations tracking insurance claims deep dive. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Third-Party Vendor Costs / Claims,
  expressed in currency value. It should be driven down, since lower readings signal healthier performance.
  Its use is concentrated in Insurance.
