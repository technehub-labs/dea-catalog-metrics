id: dea:metric-installation-rework-rate-telecom
name: Installation Rework Rate (Telecom)
type: Metric
description: 'Installation Rework Rate (Telecom) (IRRT) addresses the quality of outputs and outcomes
  and is a fixture of telecom field & installation reporting. It is defined as Jobs Requiring Return Visit
  / Jobs Completed; the result is stated in percent (%). In Telecommunications, it is a recognized element
  of the standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: IRRT
unit: percent
version: 1.1.0
