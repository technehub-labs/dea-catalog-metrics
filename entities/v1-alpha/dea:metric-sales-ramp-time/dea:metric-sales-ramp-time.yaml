id: dea:metric-sales-ramp-time
name: Sales Ramp Time
type: Metric
description: 'Sales Ramp Time (SRT) measures the utilization or availability of capacity in the Sales
  domain. It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. The formula is Months from Hire to Full Quota Attainment - reported in days. It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.'
