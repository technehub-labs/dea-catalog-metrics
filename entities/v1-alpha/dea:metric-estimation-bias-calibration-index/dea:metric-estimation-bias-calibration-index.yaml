id: dea:metric-estimation-bias-calibration-index
name: Estimation Bias Calibration Index
type: Metric
description: 'Within Project Management (Deep Dive), Estimation Bias Calibration Index (EBCI-PM) is used
  to gauge the quality of outputs and outcomes. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Systematic Bias in Historical Estimates,
  expressed in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
