id: dea:metric-security-champions-coverage
name: Security Champions Coverage
type: Metric
description: 'Security Champions Coverage (SECCO) addresses capability maturity or development and is
  a fixture of application security (appsec) reporting. It is computed as Teams with Designated Security
  Champion / Teams, expressed in percent (%). Its use is concentrated in Software. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
