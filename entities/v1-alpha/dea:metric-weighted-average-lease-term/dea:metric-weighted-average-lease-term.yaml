id: dea:metric-weighted-average-lease-term
name: Weighted Average Lease Term
type: Metric
description: 'Weighted Average Lease Term (WALT) measures exposure to adverse outcomes in the Real Estate
  & Mortgage Standard Measures domain. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Lease Years Remaining weighted by Rental Income, expressed
  in years. Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Real estate.'
