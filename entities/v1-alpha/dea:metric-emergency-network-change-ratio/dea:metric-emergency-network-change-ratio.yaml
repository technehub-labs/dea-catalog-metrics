id: dea:metric-emergency-network-change-ratio
name: Emergency Network Change Ratio
type: Metric
description: 'Emergency Network Change Ratio (ENCR) captures exposure to adverse outcomes for organizations
  tracking network change & configuration management. It is defined as Emergency Changes / Total Network
  Changes; the result is stated in percent (%). It is applied across virtually every sector. It is a working-level
  control: thresholds trigger immediate operational response. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
abbreviation: ENCR
unit: percent
