id: dea:metric-query-optimization-cycle-time
name: Query Optimization Cycle Time
type: Metric
description: A Database & Data Platform Operations indicator, Query Optimization Cycle Time (QOCT) quantifies
  how efficiently resources are converted into outputs. It is computed as Days from Slow Query Identified
  to Optimized, expressed in days. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Software.
