id: dea:metric-customer-health-index-coverage
name: Customer Health Index Coverage
type: Metric
description: Within Customer Success (B2B SaaS), Customer Health Index Coverage (CHIC) is used to gauge
  conformance to standards, plans, or obligations. It is defined as Accounts with Current Health Score
  / Total Accounts; the result is stated in percent (%). It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Higher values are better; gains are read as improvement
  and losses as deterioration. In Software & SaaS, it is a recognized element of the standard performance
  toolkit.
