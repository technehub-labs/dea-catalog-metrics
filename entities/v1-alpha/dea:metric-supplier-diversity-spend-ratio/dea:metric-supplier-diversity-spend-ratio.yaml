id: dea:metric-supplier-diversity-spend-ratio
name: Supplier Diversity Spend Ratio
type: Metric
description: 'Supplier Diversity Spend Ratio (SDSR) captures environmental and social sustainability performance
  for organizations tracking diversity, equity & inclusion (deep dive). It is computed as Spend with Diverse
  Suppliers / Total Spend, expressed in percent (%). It is applied across virtually every sector. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. It
  should be maximized within the limits of cost and quality trade-offs.'
