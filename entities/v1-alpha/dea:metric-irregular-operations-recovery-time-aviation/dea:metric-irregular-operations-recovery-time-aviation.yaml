id: dea:metric-irregular-operations-recovery-time-aviation
name: Irregular Operations Recovery Time (Aviation)
type: Metric
description: 'Irregular Operations Recovery Time (Aviation) (IROPSRT) measures exposure to adverse outcomes
  in the Airline & Transportation Standard Measures (Deep Dive) domain. The formula is Time to Restore
  Schedule after Disruption - reported in hours. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Lower values are better; each reduction is an improvement. It is a
  standard measure in the Airlines & Aviation sector.'
