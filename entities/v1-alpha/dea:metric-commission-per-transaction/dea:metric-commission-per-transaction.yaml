id: dea:metric-commission-per-transaction
name: Commission per Transaction
type: Metric
description: Within Real Estate Brokerage, Commission per Transaction (CPTX) is used to gauge the economic
  value created or preserved. It is computed as Total Commission Revenue / Closed Transactions, expressed
  in currency value. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Real estate.
