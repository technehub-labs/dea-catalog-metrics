id: dea:metric-channel-revenue-mix-balance
name: Channel Revenue Mix Balance
type: Metric
description: Channel Revenue Mix Balance (CRMB) addresses exposure to adverse outcomes and is a fixture
  of channel & distribution management reporting. The formula is Herfindahl-Based Concentration across
  Channels - reported in index (0-100 or normalized). It is applied across virtually every sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction
  is the goal, and sustained decreases indicate successful intervention.
