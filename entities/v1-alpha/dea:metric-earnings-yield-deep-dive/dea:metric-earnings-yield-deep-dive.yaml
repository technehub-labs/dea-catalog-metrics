id: dea:metric-earnings-yield-deep-dive
name: Earnings Yield (Deep Dive)
type: Metric
description: Earnings Yield (Deep Dive) (EYDD) measures the economic value created or preserved in the
  Valuation & Corporate Finance Standard Measures domain. The formula is Earnings per Share / Price per
  Share - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. It is managed toward a defined target band rather than an extreme - both
  overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
