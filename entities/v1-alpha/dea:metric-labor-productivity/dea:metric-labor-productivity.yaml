id: dea:metric-labor-productivity
name: Labor Productivity
type: Metric
description: Labor Productivity (LP) addresses how efficiently resources are converted into outputs and
  is a fixture of operations reporting. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Output Units / Labor Hour, expressed in ratio (x:1
  or x). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
