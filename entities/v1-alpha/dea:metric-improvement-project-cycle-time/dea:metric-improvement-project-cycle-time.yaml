id: dea:metric-improvement-project-cycle-time
name: Improvement Project Cycle Time
type: Metric
description: A Process Excellence (Lean Six Sigma) indicator, Improvement Project Cycle Time (IPCT) quantifies
  how efficiently resources are converted into outputs. It is defined as Days from Project Start to Control
  Phase Handover; the result is stated in days. It is applied across virtually every sector. It bridges
  daily operations and executive reporting, giving managers a lever to pull within a quarter. Reduction
  is the goal, and sustained decreases indicate successful intervention.
