id: dea:metric-source-system-registration-compliance
name: Source System Registration Compliance
type: Metric
description: Within Master Data Management, Source System Registration Compliance (SSRC-MD) is used to
  gauge conformance to standards, plans, or obligations. It is computed as Registered Sources of Master
  Data / Actual Sources, expressed in percent (%). It is applied across virtually every sector. It is
  reviewed at cadence by planning owners to correct course before issues become strategic. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: SSRC-MD
unit: percent
version: 1.1.0
lifecycle_status: candidate
