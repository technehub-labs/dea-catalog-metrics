id: dea:metric-schedule-adherence
name: Schedule Adherence
type: Metric
description: Schedule Adherence (SA) addresses conformance to standards, plans, or obligations and is
  a fixture of operations reporting. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Tasks Completed On Schedule / Tasks Scheduled; the
  result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
