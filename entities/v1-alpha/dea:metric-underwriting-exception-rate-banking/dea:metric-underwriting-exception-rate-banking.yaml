id: dea:metric-underwriting-exception-rate-banking
name: Underwriting Exception Rate (Banking)
type: Metric
description: Underwriting Exception Rate (Banking) (UER-B) measures exposure to adverse outcomes in the
  Banking Retail Lending (Deep Dive) domain. It is defined as Approved Loans beyond Policy / Approved
  Loans; the result is stated in percent (%). It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. Lower values are better; each reduction is an improvement.
  In Banking, it is a recognized element of the standard performance toolkit.
