id: dea:metric-file-size-distribution-outlier-rate
name: File Size Distribution Outlier Rate
type: Metric
description: File Size Distribution Outlier Rate (FSDOR) addresses the quality of outputs and outcomes
  and is a fixture of code quality & static analysis reporting. Its calculation is Files Exceeding Size
  Guideline / Files, measured in percent (%). It provides the day-to-day signal that a process is running
  as designed. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Software practice.
abbreviation: FSDOR
unit: percent
