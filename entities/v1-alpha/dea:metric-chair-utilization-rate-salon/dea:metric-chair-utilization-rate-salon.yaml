id: dea:metric-chair-utilization-rate-salon
name: Chair Utilization Rate (Salon)
type: Metric
description: Chair Utilization Rate (Salon) (CUR-S) measures the utilization or availability of capacity
  in the Beauty & Personal Care Services domain. It provides the day-to-day signal that a process is running
  as designed. Its calculation is Booked Stylist Hours / Available Chair Hours, measured in percent (%).
  Improvement means raising this figure toward best-in-class levels. It originates from and is most used
  in Personal Services practice.
abbreviation: CUR-S
unit: percent
