id: dea:metric-deep-clean-cycle-completion
name: Deep Clean Cycle Completion
type: Metric
description: Deep Clean Cycle Completion (DCCC) captures conformance to standards, plans, or obligations
  for organizations tracking cleaning & environmental services. Its calculation is Deep Clean Tasks on
  Schedule / Scheduled, measured in percent (%). It provides the day-to-day signal that a process is running
  as designed. Higher values are better; gains are read as improvement and losses as deterioration. It
  originates from and is most used in Facility Services practice.
abbreviation: DCCC
unit: percent
