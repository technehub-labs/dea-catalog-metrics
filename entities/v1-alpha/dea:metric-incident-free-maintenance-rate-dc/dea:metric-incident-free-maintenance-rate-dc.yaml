id: dea:metric-incident-free-maintenance-rate-dc
name: Incident-Free Maintenance Rate (DC)
type: Metric
description: 'Within Data Centers & Cloud Infrastructure, Incident-Free Maintenance Rate (DC) (IFMR) is
  used to gauge exposure to adverse outcomes. It is defined as Maintenance without Service Impact / Events;
  the result is stated in percent (%). It is a working-level control: thresholds trigger immediate operational
  response. Higher values are better; gains are read as improvement and losses as deterioration. In Technology,
  it is a recognized element of the standard performance toolkit.'
