id: dea:metric-customer-average-interruption-duration-index
name: Customer Average Interruption Duration Index
type: Metric
description: Customer Average Interruption Duration Index (CAIDI) addresses the quality of outputs and
  outcomes and is a fixture of energy & utilities reporting. It is defined as Total Interruption Minutes
  / Total Interruptions; the result is stated in minutes. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Lower values are better; each reduction is an improvement.
  In Energy & utilities, it is a recognized element of the standard performance toolkit.
