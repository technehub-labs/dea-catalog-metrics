id: dea:metric-headway-adherence-coefficient-deep-dive
name: Headway Adherence Coefficient (Deep Dive)
type: Metric
description: Headway Adherence Coefficient (Deep Dive) (HAC-D) captures the quality of outputs and outcomes
  for organizations tracking public transit (deep dive). It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Actual Headway Variance / Scheduled
  Headway, expressed in ratio (x:1 or x). It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Public Transit.
abbreviation: HAC-D
unit: ratio
