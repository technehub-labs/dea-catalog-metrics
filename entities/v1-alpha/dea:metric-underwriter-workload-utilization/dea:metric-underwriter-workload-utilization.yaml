id: dea:metric-underwriter-workload-utilization
name: Underwriter Workload Utilization
type: Metric
description: Underwriter Workload Utilization (UWU) captures the utilization or availability of capacity
  for organizations tracking insurance underwriting. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. It is computed as Active Underwriting Hours / Available
  Hours, expressed in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. Its use is concentrated in Insurance.
abbreviation: UWU
unit: percent
