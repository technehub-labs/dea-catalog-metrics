id: dea:metric-energy-per-train-kilometre
name: Energy per Train Kilometre
type: Metric
description: 'A Rail Transport indicator, Energy per Train Kilometre (EPKM) quantifies how efficiently
  resources are converted into outputs. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is Energy Consumed / Train Kilometres - reported
  in ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance. It
  is a standard measure in the Rail sector.'
