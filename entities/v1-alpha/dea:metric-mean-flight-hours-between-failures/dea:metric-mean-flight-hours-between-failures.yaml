id: dea:metric-mean-flight-hours-between-failures
name: Mean Flight Hours between Failures
type: Metric
description: Within Defense & Aerospace, Mean Flight Hours between Failures (MFHBF) is used to gauge exposure
  to adverse outcomes. The formula is Total Flight Hours / In-Flight Failures - reported in hours. It
  is a standard measure in the Defense & aerospace sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It should be maximized within the limits of
  cost and quality trade-offs.
