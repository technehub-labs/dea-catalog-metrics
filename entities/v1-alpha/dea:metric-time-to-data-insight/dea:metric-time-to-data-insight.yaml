id: dea:metric-time-to-data-insight
name: Time to Data Insight
type: Metric
description: Time to Data Insight (TTDI) captures how efficiently resources are converted into outputs
  for organizations tracking data management & analytics. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It is defined as Days from Question Raised to Analytical
  Answer Delivered; the result is stated in days. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: TTDI
unit: day
