id: dea:metric-ip-portfolio-grant-rate-deep-dive
name: IP Portfolio Grant Rate (Deep Dive)
type: Metric
description: 'IP Portfolio Grant Rate (Deep Dive) (IPGR) addresses the economic value created or preserved
  and is a fixture of legal operations reporting. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Granted Applications / Filed Applications,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
