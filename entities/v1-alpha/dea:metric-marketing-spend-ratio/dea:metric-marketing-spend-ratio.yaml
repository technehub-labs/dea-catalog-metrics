id: dea:metric-marketing-spend-ratio
name: Marketing Spend Ratio
type: Metric
description: Marketing Spend Ratio (MSR) measures how efficiently resources are converted into outputs
  in the Marketing domain. The formula is Marketing Spend / Revenue - reported in percent (%). It is applied
  across virtually every sector. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Values outside the intended band, on either side, warrant investigation.
