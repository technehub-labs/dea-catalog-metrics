id: dea:metric-forecast-accuracy-mape-deep-dive
name: Forecast Accuracy MAPE (Deep Dive)
type: Metric
description: Forecast Accuracy MAPE (Deep Dive) (MAPEDD) measures the quality of outputs and outcomes
  in the Supply Chain Standard Measures (Deep Dive) domain. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It is defined as Mean Absolute Percent
  Error of Demand Forecast; the result is stated in percent (%). It should be driven down, since lower
  readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
