id: dea:metric-strategic-agility-index
name: Strategic Agility Index
type: Metric
description: Within Strategy & Portfolio, Strategic Agility Index (SAI) is used to gauge capability maturity
  or development. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Weighted Index of Decision Cycle Time and Reallocation Speed - reported in
  index (0-100 or normalized). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
