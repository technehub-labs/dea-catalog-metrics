id: dea:metric-self-service-access-request-rate
name: Self-Service Access Request Rate
type: Metric
description: Self-Service Access Request Rate (SSARR) measures how efficiently resources are converted
  into outputs in the Identity & Access Management Operations domain. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Requests via Self-Service
  Workflow / Requests, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SSARR
unit: percent
