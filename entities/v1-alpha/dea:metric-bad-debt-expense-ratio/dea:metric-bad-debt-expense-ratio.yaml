id: dea:metric-bad-debt-expense-ratio
name: Bad Debt Expense Ratio
type: Metric
description: Bad Debt Expense Ratio (BDER) captures exposure to adverse outcomes for organizations tracking
  accounts payable & receivable operations (deep dive). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Bad Debt Write-Offs / Credit
  Sales, measured in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: BDER
unit: percent
