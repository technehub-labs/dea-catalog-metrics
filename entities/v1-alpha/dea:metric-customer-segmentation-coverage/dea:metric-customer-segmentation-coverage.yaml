id: dea:metric-customer-segmentation-coverage
name: Customer Segmentation Coverage
type: Metric
description: Within Customer Analytics & Insights, Customer Segmentation Coverage (CSC-A) is used to gauge
  capability maturity or development. It is defined as Customers with Active Segment Assignment / Customers;
  the result is stated in percent (%). It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
