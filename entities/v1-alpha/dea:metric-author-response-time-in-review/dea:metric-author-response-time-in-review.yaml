id: dea:metric-author-response-time-in-review
name: Author Response Time in Review
type: Metric
description: Author Response Time in Review (ART-PR) measures how efficiently resources are converted
  into outputs in the Code Review & Peer Quality domain. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Median Hours for Author to
  Address Comments, expressed in hours. It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Software.
abbreviation: ART-PR
unit: hour
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
