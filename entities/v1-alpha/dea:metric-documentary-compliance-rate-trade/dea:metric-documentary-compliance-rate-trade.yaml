id: dea:metric-documentary-compliance-rate-trade
name: Documentary Compliance Rate (Trade)
type: Metric
description: 'A International Trade & Customs indicator, Documentary Compliance Rate (Trade) (DCRT) quantifies
  conformance to standards, plans, or obligations. The formula is Shipments with Complete Trade Documentation
  / Shipments - reported in percent (%). It is a standard measure in the Logistics & Trade sector. It
  is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should be
  maximized within the limits of cost and quality trade-offs.'
