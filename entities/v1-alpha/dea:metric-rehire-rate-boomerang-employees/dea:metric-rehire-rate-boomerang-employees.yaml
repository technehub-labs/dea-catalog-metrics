id: dea:metric-rehire-rate-boomerang-employees
name: Rehire Rate (Boomerang Employees)
type: Metric
description: 'Rehire Rate (Boomerang Employees) (RRE) measures the retention of customers, users, or assets
  over time in the Culture & Employee Experience domain. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Former Employees Rehired within
  Period / Hires - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
