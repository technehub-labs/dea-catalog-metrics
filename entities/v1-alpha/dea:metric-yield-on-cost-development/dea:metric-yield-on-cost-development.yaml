id: dea:metric-yield-on-cost-development
name: Yield on Cost (Development)
type: Metric
description: Yield on Cost (Development) (YOC-RE) captures the economic value created or preserved for
  organizations tracking real estate & mortgage standard measures. Its calculation is Stabilized NOI /
  Total Development Cost, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. It originates from and is most used in Real estate practice.
abbreviation: YOC-RE
