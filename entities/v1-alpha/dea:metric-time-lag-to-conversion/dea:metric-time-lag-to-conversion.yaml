id: dea:metric-time-lag-to-conversion
name: Time Lag to Conversion
type: Metric
description: A Marketing Attribution & Analytics indicator, Time Lag to Conversion (TLTC) quantifies the
  engagement or satisfaction of the people involved. It is computed as Days from First Attribution Touch
  to Conversion, expressed in days. It is reviewed at cadence by planning owners to correct course before
  issues become strategic. It is managed toward a defined target band rather than an extreme - both overshoot
  and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
