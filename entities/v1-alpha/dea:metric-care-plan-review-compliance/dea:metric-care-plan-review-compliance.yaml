id: dea:metric-care-plan-review-compliance
name: Care Plan Review Compliance
type: Metric
description: 'Within Elder & Social Care, Care Plan Review Compliance (CPRC) is used to gauge conformance
  to standards, plans, or obligations. The formula is Care Plans Reviewed within Cycle / Care Plans -
  reported in percent (%). It is a standard measure in the Social care sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
