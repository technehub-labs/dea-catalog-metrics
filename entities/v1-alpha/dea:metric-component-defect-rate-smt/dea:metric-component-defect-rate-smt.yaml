id: dea:metric-component-defect-rate-smt
name: Component Defect Rate (SMT)
type: Metric
description: 'Component Defect Rate (SMT) (CDR-SMT) captures the quality of outputs and outcomes for organizations
  tracking semiconductor & electronics. The formula is Defective Placements per Million Components Placed
  - reported in events per thousand or million (scaled). It is a standard measure in the Electronics &
  semiconductors sector. It is monitored close to the work: teams act on it within a shift, sprint, or
  daily review. Reduction is the goal, and sustained decreases indicate successful intervention.'
