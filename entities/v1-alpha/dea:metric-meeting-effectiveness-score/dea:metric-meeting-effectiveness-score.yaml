id: dea:metric-meeting-effectiveness-score
name: Meeting Effectiveness Score
type: Metric
description: 'Meeting Effectiveness Score (MES) addresses the engagement or satisfaction of the people
  involved and is a fixture of operating model & decision effectiveness reporting. The formula is Average
  Post-Meeting Effectiveness Rating - reported in score (points). It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
