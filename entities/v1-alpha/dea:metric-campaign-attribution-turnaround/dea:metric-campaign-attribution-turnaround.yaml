id: dea:metric-campaign-attribution-turnaround
name: Campaign Attribution Turnaround
type: Metric
description: 'A Threat Intelligence & Red Team indicator, Campaign Attribution Turnaround (CAT) quantifies
  how efficiently resources are converted into outputs. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Days to Characterize Active Campaign
  - reported in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
