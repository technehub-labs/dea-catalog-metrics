id: dea:metric-standards-compliance-of-projects
name: Standards Compliance of Projects
type: Metric
description: Standards Compliance of Projects (SCP) measures conformance to standards, plans, or obligations
  in the Enterprise Architecture domain. It is defined as Projects Compliant with Architecture Standards
  / Projects Audited; the result is stated in percent (%). It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
