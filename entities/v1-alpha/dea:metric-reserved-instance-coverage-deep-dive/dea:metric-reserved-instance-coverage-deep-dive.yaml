id: dea:metric-reserved-instance-coverage-deep-dive
name: Reserved Instance Coverage (Deep Dive)
type: Metric
description: A Data Centers & Cloud Infrastructure indicator, Reserved Instance Coverage (Deep Dive) (RIC)
  quantifies how efficiently resources are converted into outputs. It is defined as Spend on Reserved
  Capacity / Eligible Spend; the result is stated in percent (%). It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Higher values are better; gains are read
  as improvement and losses as deterioration. In Technology, it is a recognized element of the standard
  performance toolkit.
abbreviation: RIC
unit: percent
