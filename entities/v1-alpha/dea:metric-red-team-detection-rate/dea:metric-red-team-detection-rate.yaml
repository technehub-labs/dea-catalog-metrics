id: dea:metric-red-team-detection-rate
name: Red Team Detection Rate
type: Metric
description: Red Team Detection Rate (RTDR) addresses exposure to adverse outcomes and is a fixture of
  threat intelligence & red team reporting. The formula is Simulated Attack Techniques Detected by Defenders
  / Techniques Executed - reported in percent (%). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: RTDR
unit: percent
