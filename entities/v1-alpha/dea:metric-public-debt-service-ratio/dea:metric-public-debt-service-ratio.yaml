id: dea:metric-public-debt-service-ratio
name: Public Debt Service Ratio
type: Metric
description: 'Public Debt Service Ratio (PDSR) captures exposure to adverse outcomes for organizations
  tracking public sector & government. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Debt Service Payments / Government Revenue, expressed
  in percent (%). It should be driven down, since lower readings signal healthier performance. Its use
  is concentrated in Public sector.'
