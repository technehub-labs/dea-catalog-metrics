id: dea:metric-number-of-security-incidents
name: Number of Security Incidents
type: Metric
description: Number of Security Incidents (NSI) addresses exposure to adverse outcomes and is a fixture
  of cybersecurity reporting. The formula is Confirmed Security Incidents per Period - reported in count
  (items per period). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
