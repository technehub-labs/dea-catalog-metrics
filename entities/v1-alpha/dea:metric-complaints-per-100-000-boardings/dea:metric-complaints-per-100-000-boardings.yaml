id: dea:metric-complaints-per-100-000-boardings
name: Complaints per 100,000 Boardings
type: Metric
description: A Public Transit indicator, Complaints per 100,000 Boardings (CPB) quantifies the quality
  of outputs and outcomes. Its calculation is Complaints / Boardings x 100,000, measured in events per
  thousand or million (scaled). Its value drives prioritization and resource reallocation among competing
  initiatives. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Public transit practice.
