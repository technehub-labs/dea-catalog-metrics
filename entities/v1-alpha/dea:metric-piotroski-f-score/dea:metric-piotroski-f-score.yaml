id: dea:metric-piotroski-f-score
name: Piotroski F-Score
type: Metric
description: Piotroski F-Score (PIOF) addresses the quality of outputs and outcomes and is a fixture of
  valuation & corporate finance standard measures reporting. Its calculation is Count of Nine Fundamental
  Strength Signals Met, measured in score (points). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
