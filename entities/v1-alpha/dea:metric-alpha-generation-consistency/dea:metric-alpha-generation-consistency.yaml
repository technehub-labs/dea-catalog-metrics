id: dea:metric-alpha-generation-consistency
name: Alpha Generation Consistency
type: Metric
description: 'A Asset & Wealth Management (Deep Dive) indicator, Alpha Generation Consistency (AGC-W)
  quantifies how effectively a process or entity achieves its intended outcome. It is computed as Periods
  with Positive Alpha / Periods, expressed in percent (%). Its use is concentrated in Financial Services.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
