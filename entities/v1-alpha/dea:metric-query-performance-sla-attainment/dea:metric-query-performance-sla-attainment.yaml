id: dea:metric-query-performance-sla-attainment
name: Query Performance SLA Attainment
type: Metric
description: 'Query Performance SLA Attainment (QPSLAA) captures the quality of outputs and outcomes for
  organizations tracking data science & analytics operations. The formula is Dashboards Meeting Query
  Latency SLA / Dashboards - reported in percent (%). It is applied across virtually every sector. It
  is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should be
  maximized within the limits of cost and quality trade-offs.'
