id: dea:metric-mean-time-to-recover-security-incident
name: Mean Time to Recover - Security Incident
type: Metric
description: 'Mean Time to Recover - Security Incident (MTTRSI) captures how efficiently resources are
  converted into outputs for organizations tracking secops & security operations center. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Hours from Containment to Full Recovery, expressed in hours. It should be driven down, since lower
  readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
