id: dea:metric-component-design-to-usage-lag
name: Component Design-to-Usage Lag
type: Metric
description: Component Design-to-Usage Lag (CDUL) measures how efficiently resources are converted into
  outputs in the UX & Design Systems domain. It provides the day-to-day signal that a process is running
  as designed. Its calculation is Median Days from Component Design to First Production Use, measured
  in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: CDUL
unit: days
