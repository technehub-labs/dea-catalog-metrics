id: dea:metric-ai-training-data-lineage-documentation-rate
name: AI Training Data Lineage Documentation Rate
type: Metric
description: AI Training Data Lineage Documentation Rate (AITDL) addresses the quality of outputs and
  outcomes and is a fixture of ai governance & model risk management reporting. The formula is Datasets
  with Documented Lineage / Datasets Used - reported in percent (%). It is applied across virtually every
  sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: AITDL
unit: percent
