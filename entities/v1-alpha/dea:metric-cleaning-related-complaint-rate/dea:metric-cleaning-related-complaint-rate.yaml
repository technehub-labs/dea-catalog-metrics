id: dea:metric-cleaning-related-complaint-rate
name: Cleaning-Related Complaint Rate
type: Metric
description: Cleaning-Related Complaint Rate (CRCR-C) measures the quality of outputs and outcomes in
  the Cleaning & Environmental Services domain. It is computed as Complaints / 1,000 Cleaning Visits,
  expressed in events per thousand or million (scaled). Its use is concentrated in Facility Services.
  Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  Reduction is the goal, and sustained decreases indicate successful intervention.
