id: dea:metric-procurement-compliance-in-public-tenders
name: Procurement Compliance in Public Tenders
type: Metric
description: 'Procurement Compliance in Public Tenders (PCPT) measures conformance to standards, plans,
  or obligations in the Public Sector & Government domain. It is computed as Tenders Meeting Procedure
  Requirements / Tenders Conducted, expressed in percent (%). It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is concentrated in Public sector.'
abbreviation: PCPT
unit: percent
version: 1.1.0
lifecycle_status: candidate
