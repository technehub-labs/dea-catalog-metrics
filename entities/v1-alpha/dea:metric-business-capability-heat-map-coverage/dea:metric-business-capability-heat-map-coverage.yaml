id: dea:metric-business-capability-heat-map-coverage
name: Business Capability Heat Map Coverage
type: Metric
description: Business Capability Heat Map Coverage (BCHMC) captures capability maturity or development
  for organizations tracking operating model monitoring & design effectiveness. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. It is defined as Capabilities
  with Performance and Health Ratings / Capabilities; the result is stated in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: BCHMC
unit: percent
