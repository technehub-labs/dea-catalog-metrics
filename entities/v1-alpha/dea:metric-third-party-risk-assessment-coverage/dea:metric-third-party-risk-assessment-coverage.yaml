id: dea:metric-third-party-risk-assessment-coverage
name: Third-Party Risk Assessment Coverage
type: Metric
description: Within Risk & Compliance, Third-Party Risk Assessment Coverage (TPRC) is used to gauge exposure
  to adverse outcomes. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is Critical Vendors Assessed / Critical Vendors, measured in
  percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: TPRC
unit: percent
