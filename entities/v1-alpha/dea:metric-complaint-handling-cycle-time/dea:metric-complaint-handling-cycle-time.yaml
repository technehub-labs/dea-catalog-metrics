id: dea:metric-complaint-handling-cycle-time
name: Complaint Handling Cycle Time
type: Metric
description: Complaint Handling Cycle Time (CHCT) measures conformance to standards, plans, or obligations
  in the Medical Devices domain. Its calculation is Days from Complaint Receipt to Closure, measured in
  days. Its value drives prioritization and resource reallocation among competing initiatives. Lower values
  are better; each reduction is an improvement. It originates from and is most used in Medical devices
  practice.
abbreviation: CHCT
unit: day
