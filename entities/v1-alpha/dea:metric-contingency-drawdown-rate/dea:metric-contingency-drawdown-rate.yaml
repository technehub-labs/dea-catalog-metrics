id: dea:metric-contingency-drawdown-rate
name: Contingency Drawdown Rate
type: Metric
description: Contingency Drawdown Rate (CDR-P) measures exposure to adverse outcomes in the Project Risk
  & Issue Management domain. Its calculation is Contingency Consumed / Contingency Budget, measured in
  percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It is managed toward a defined target band rather than an extreme - both overshoot
  and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: CDR-P
unit: percent
