id: dea:metric-post-diction-accuracy-rate
name: Post-Diction Accuracy Rate
type: Metric
description: Within Emerging Risk & Horizon Scanning, Post-Diction Accuracy Rate (PDAR) is used to gauge
  the quality of outputs and outcomes. It is defined as Emerging Risks That Materialized and Were Previously
  Flagged / Materialized; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
