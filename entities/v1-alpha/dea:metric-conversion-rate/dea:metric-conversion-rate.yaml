id: dea:metric-conversion-rate
name: Conversion Rate
type: Metric
description: Conversion Rate (CVR) addresses how effectively a process or entity achieves its intended
  outcome and is a fixture of marketing reporting. It is computed as Conversions / Total Sessions or Visitors,
  expressed in percent (%). It is applied across virtually every sector. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: CVR
unit: percent
