id: dea:metric-base-station-downtime-per-quarter
name: Base Station Downtime per Quarter
type: Metric
description: 'A Telecom Network Operations indicator, Base Station Downtime per Quarter (BSDT) quantifies
  the quality of outputs and outcomes. The formula is Total Site Unavailability Hours per Quarter - reported
  in hours. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Lower values are better; each reduction is an improvement. It is a standard measure in the Telecommunications
  sector.'
