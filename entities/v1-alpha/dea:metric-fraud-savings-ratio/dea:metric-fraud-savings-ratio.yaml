id: dea:metric-fraud-savings-ratio
name: Fraud Savings Ratio
type: Metric
description: Within Insurance Claims Deep Dive, Fraud Savings Ratio (FSR) is used to gauge the economic
  value created or preserved. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Fraud-Related Savings / Claims Spend; the result is stated in percent
  (%). Improvement means raising this figure toward best-in-class levels. In Insurance, it is a recognized
  element of the standard performance toolkit.
