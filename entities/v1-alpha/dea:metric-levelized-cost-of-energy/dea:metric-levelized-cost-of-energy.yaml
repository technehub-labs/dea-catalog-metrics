id: dea:metric-levelized-cost-of-energy
name: Levelized Cost of Energy
type: Metric
description: 'Within Energy Transition & Renewables, Levelized Cost of Energy (LCOE) is used to gauge
  the economic value created or preserved. It is computed as Lifetime Costs / Lifetime Energy Produced,
  expressed in currency per unit. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is
  concentrated in Renewable energy.'
