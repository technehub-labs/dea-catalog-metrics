description: 'Per-Match Operating Cost (PMOC) addresses how efficiently resources are converted into outputs
  and is a fixture of sports clubs & leagues (deep dive) reporting. The formula is Stadium Operating Costs
  / Matches - reported in currency value. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Lower values are better; each reduction is an improvement. It
  is a standard measure in the Sports sector.'
