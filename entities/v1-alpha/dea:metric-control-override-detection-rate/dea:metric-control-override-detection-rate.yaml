id: dea:metric-control-override-detection-rate
name: Control Override Detection Rate
type: Metric
description: A Internal Controls & Financial Reporting Integrity indicator, Control Override Detection
  Rate (CODR) quantifies exposure to adverse outcomes. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Overrides Detected by Monitoring / Overrides
  Occurring (Sampled); the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
