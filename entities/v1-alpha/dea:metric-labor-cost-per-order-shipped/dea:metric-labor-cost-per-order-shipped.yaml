id: dea:metric-labor-cost-per-order-shipped
name: Labor Cost per Order Shipped
type: Metric
description: 'A Warehousing indicator, Labor Cost per Order Shipped (LCPO) quantifies how efficiently
  resources are converted into outputs. The formula is Warehouse Labor Cost / Orders Shipped - reported
  in currency per unit. It guides mid-horizon planning: portfolio, program, and function owners act on
  it between review cycles. Lower values are better; each reduction is an improvement. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: LCPO
unit: currency
