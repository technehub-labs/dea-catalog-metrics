id: dea:metric-recovery-rate-charged-off-loans-deep-dive
name: Recovery Rate (Charged-Off Loans Deep Dive)
type: Metric
description: Recovery Rate (Charged-Off Loans Deep Dive) (RRCL-D) measures the economic value created
  or preserved in the Banking Retail Lending (Deep Dive) domain. The formula is Recovered Value / Charged-Off
  Value - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. It is a standard measure in the Banking sector.
