id: dea:metric-checkout-abandonment-rate-deep-dive
name: Checkout Abandonment Rate (Deep Dive)
type: Metric
description: 'Checkout Abandonment Rate (Deep Dive) (CARD) measures the retention of customers, users,
  or assets over time in the Web & Digital Analytics Standard Measures domain. It is a working-level control:
  thresholds trigger immediate operational response. It is defined as Carts Abandoned before Purchase
  / Carts Created; the result is stated in percent (%). It should be driven down, since lower readings
  signal healthier performance. In Digital product, it is a recognized element of the standard performance
  toolkit.'
