id: dea:metric-code-duplication-rate
name: Code Duplication Rate
type: Metric
description: Code Duplication Rate (CDR-SA) captures the quality of outputs and outcomes for organizations
  tracking software architecture & technical design. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Duplicated Lines / Total Lines, measured in percent (%).
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: CDR-SA
unit: percent
