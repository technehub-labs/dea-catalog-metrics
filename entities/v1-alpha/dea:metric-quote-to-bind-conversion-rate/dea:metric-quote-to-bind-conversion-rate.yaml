id: dea:metric-quote-to-bind-conversion-rate
name: Quote-to-Bind Conversion Rate
type: Metric
description: Quote-to-Bind Conversion Rate (QBR) addresses growth over time and is a fixture of insurance
  underwriting reporting. It is defined as Policies Bound / Quotes Issued; the result is stated in percent
  (%). It bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  Higher values are better; gains are read as improvement and losses as deterioration. In Insurance, it
  is a recognized element of the standard performance toolkit.
abbreviation: QBR
unit: percent
