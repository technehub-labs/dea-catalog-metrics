id: dea:metric-review-rework-cycle-count
name: Review Rework Cycle Count
type: Metric
description: Review Rework Cycle Count (RRC) captures how efficiently resources are converted into outputs
  for organizations tracking code review & peer quality. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Average Revision Cycles before Approval, measured in times
  per period. It should be driven down, since lower readings signal healthier performance. It originates
  from and is most used in Software practice.
