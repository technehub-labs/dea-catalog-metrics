id: dea:metric-golden-config-compliance
name: Golden Config Compliance
type: Metric
description: Golden Config Compliance (GCC-NW) addresses conformance to standards, plans, or obligations
  and is a fixture of network change & configuration management reporting. It is reviewed at cadence by
  planning owners to correct course before issues become strategic. It is computed as Devices Matching
  Golden Configuration / Devices in Scope, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
