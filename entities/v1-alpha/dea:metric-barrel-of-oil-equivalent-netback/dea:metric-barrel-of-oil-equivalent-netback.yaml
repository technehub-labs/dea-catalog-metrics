id: dea:metric-barrel-of-oil-equivalent-netback
name: Barrel of Oil Equivalent Netback
type: Metric
description: A Oil & Gas indicator, Barrel of Oil Equivalent Netback (BOEN) quantifies the economic value
  created or preserved. The formula is Revenue per Barrel - Lifting Cost - Transportation - Taxes - reported
  in currency value. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Oil & gas sector.
