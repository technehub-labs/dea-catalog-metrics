id: dea:metric-patient-fall-risk-assessment-coverage
name: Patient Fall Risk Assessment Coverage
type: Metric
description: 'Patient Fall Risk Assessment Coverage (PFRAC) captures exposure to adverse outcomes for
  organizations tracking healthcare quality & patient safety standard measures. The formula is Admissions
  Screened for Fall Risk within Policy Window / Admissions - reported in percent (%). It is a standard
  measure in the Healthcare sector. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. It should be maximized within the limits of cost and quality trade-offs.'
