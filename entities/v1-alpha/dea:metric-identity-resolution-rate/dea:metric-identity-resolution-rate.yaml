id: dea:metric-identity-resolution-rate
name: Identity Resolution Rate
type: Metric
description: A Marketing Attribution & Analytics indicator, Identity Resolution Rate (IRR-M) quantifies
  capability maturity or development. It is reviewed at cadence by planning owners to correct course before
  issues become strategic. It is computed as Touchpoints Resolved to Person / Total Touchpoints, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: IRR-M
unit: percent
