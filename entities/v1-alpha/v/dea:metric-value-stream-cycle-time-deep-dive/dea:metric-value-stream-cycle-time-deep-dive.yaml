id: dea:metric-value-stream-cycle-time-deep-dive
name: Value Stream Cycle Time (Deep Dive)
type: Metric
description: A Operating Model Monitoring & Design Effectiveness indicator, Value Stream Cycle Time (Deep
  Dive) (VSCT-D) quantifies how efficiently resources are converted into outputs. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Its calculation
  is End-to-End Time across Value Stream, measured in days. It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: VSCT-D
unit: day
