id: dea:metric-vendor-risk-incident-rate
name: Vendor Risk Incident Rate
type: Metric
description: Within Third-Party Risk Management, Vendor Risk Incident Rate (VRIR) is used to gauge exposure
  to adverse outcomes. Its calculation is Material Vendor-Caused Incidents / Vendor Engagements, measured
  in events per thousand or million (scaled). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: VRIR
