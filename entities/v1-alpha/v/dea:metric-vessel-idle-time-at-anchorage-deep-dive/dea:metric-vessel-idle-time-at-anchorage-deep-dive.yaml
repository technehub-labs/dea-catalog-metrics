id: dea:metric-vessel-idle-time-at-anchorage-deep-dive
name: Vessel Idle Time at Anchorage (Deep Dive)
type: Metric
description: Within Maritime Shipping (Deep Dive), Vessel Idle Time at Anchorage (Deep Dive) (VIT-D) is
  used to gauge the utilization or availability of capacity. The formula is Waiting Days / Total Vessel
  Days - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Lower values are better; each reduction is an improvement. It is a standard
  measure in the Maritime sector.
abbreviation: VIT-D
