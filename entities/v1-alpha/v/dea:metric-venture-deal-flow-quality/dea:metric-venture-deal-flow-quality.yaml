id: dea:metric-venture-deal-flow-quality
name: Venture Deal Flow Quality
type: Metric
description: Within Corporate Venturing & Partnerships, Venture Deal Flow Quality (VDFQ) is used to gauge
  how effectively a process or entity achieves its intended outcome. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Proposals Meeting Investment Thesis
  / Proposals Screened; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: VDFQ
unit: percent
