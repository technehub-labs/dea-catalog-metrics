id: dea:metric-vehicles-per-hour
name: Vehicles per Hour
type: Metric
description: 'Vehicles per Hour (VPH) measures the utilization or availability of capacity in the Automotive
  domain. It is a working-level control: thresholds trigger immediate operational response. It is defined
  as Vehicles Assembled / Production Hours; the result is stated in ratio (x:1 or x). Improvement means
  raising this figure toward best-in-class levels. In Automotive, it is a recognized element of the standard
  performance toolkit.'
abbreviation: VPH
unit: ratio
version: 1.1.0
