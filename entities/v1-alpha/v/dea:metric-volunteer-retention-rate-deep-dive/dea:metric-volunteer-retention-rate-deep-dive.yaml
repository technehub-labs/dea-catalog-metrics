id: dea:metric-volunteer-retention-rate-deep-dive
name: Volunteer Retention Rate (Deep Dive)
type: Metric
description: Volunteer Retention Rate (Deep Dive) (VRR-D) captures the retention of customers, users,
  or assets over time for organizations tracking nonprofit & donor operations (deep dive). Its calculation
  is Volunteers Returning / Prior Volunteers, measured in percent (%). It originates from and is most
  used in Nonprofit practice. Its value drives prioritization and resource reallocation among competing
  initiatives. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: VRR-D
unit: percent
version: 1.1.0
