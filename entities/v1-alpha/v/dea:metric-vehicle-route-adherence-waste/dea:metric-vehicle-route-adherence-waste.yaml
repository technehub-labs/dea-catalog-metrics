id: dea:metric-vehicle-route-adherence-waste
name: Vehicle Route Adherence (Waste)
type: Metric
description: A Cleaning & Environmental Services indicator, Vehicle Route Adherence (Waste) (VRA) quantifies
  how efficiently resources are converted into outputs. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Routes Completed to Plan / Routes, measured in percent (%).
  Improvement means raising this figure toward best-in-class levels. It originates from and is most used
  in Facility Services practice.
abbreviation: VRA
unit: percent
version: 1.1.0
