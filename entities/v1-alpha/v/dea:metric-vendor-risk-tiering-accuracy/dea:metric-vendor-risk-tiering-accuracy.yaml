id: dea:metric-vendor-risk-tiering-accuracy
name: Vendor Risk Tiering Accuracy
type: Metric
description: Vendor Risk Tiering Accuracy (VRTA) captures the quality of outputs and outcomes for organizations
  tracking third-party risk management. It is computed as Tier Assignments Confirmed at Review / Tier
  Assignments, expressed in percent (%). It is applied across virtually every sector. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: VRTA
unit: percent
version: 1.1.0
