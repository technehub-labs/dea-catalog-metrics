id: dea:metric-vintage-loss-curve-accuracy
name: Vintage Loss Curve Accuracy
type: Metric
description: Vintage Loss Curve Accuracy (VLCA) measures the quality of outputs and outcomes in the Banking
  Retail Lending (Deep Dive) domain. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Actual Vintage Losses vs Forecast / Forecast,
  measured in percent (%). It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Banking practice.
abbreviation: VLCA
unit: percent
