id: dea:metric-voice-of-customer-response-rate
name: Voice of Customer Response Rate
type: Metric
description: 'Within Balanced Scorecard - Customer Perspective, Voice of Customer Response Rate (VOCRR)
  is used to gauge the engagement or satisfaction of the people involved. It is defined as Survey Responses
  / Requests Sent; the result is stated in percent (%). It is a working-level control: thresholds trigger
  immediate operational response. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: VOCRR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- strategy
purpose_classification:
- engagement
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
