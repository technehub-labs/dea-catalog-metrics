id: dea:metric-supplier-material-quality-electronics
name: Supplier Material Quality (Electronics)
type: Metric
description: Supplier Material Quality (Electronics) (SMQ) addresses the quality of outputs and outcomes
  and is a fixture of semiconductor & electronics reporting. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It is defined as Incoming Lots Meeting
  Specification / Lots Received; the result is stated in percent (%). Improvement means raising this figure
  toward best-in-class levels. In Electronics & semiconductors, it is a recognized element of the standard
  performance toolkit.
