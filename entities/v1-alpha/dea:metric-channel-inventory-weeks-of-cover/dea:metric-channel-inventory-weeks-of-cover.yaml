id: dea:metric-channel-inventory-weeks-of-cover
name: Channel Inventory Weeks of Cover
type: Metric
description: Channel Inventory Weeks of Cover (CIWOC) addresses the utilization or availability of capacity
  and is a fixture of channel & distribution management reporting. It is defined as Partner Inventory
  on Hand / Weekly Sell-Through; the result is stated in weeks. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It is managed toward a defined target band
  rather than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
