id: dea:metric-board-meeting-attendance-rate
name: Board Meeting Attendance Rate
type: Metric
description: A Corporate Governance indicator, Board Meeting Attendance Rate (BMAR) quantifies conformance
  to standards, plans, or obligations. It is defined as Director Attendances / Seats on Meetings Held;
  the result is stated in percent (%). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
