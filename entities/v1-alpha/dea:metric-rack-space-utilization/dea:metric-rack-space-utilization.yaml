id: dea:metric-rack-space-utilization
name: Rack Space Utilization
type: Metric
description: 'Rack Space Utilization (RSU) addresses the utilization or availability of capacity and is
  a fixture of data center & cloud operations reporting. The formula is Occupied Rack Units / Total Rack
  Units - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. It is managed toward a defined target band rather than an extreme -
  both overshoot and undershoot can signal problems. It is a standard measure in the Technology & data
  centers sector.'
abbreviation: RSU
unit: percent
version: 1.1.0
