id: dea:metric-post-merge-revert-rate
name: Post-Merge Revert Rate
type: Metric
description: 'A Code Review & Peer Quality indicator, Post-Merge Revert Rate (PMRR) quantifies the quality
  of outputs and outcomes. The formula is Reverted Merges / Merged Changes - reported in percent (%).
  It is a standard measure in the Software sector. It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. Reduction is the goal, and sustained decreases indicate successful
  intervention.'
