id: dea:metric-deployment-lead-time-commit-to-production
name: Deployment Lead Time - Commit to Production
type: Metric
description: 'Deployment Lead Time - Commit to Production (DLTCP) measures how efficiently resources are
  converted into outputs in the Continuous Delivery & Deployment domain. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Median Days from
  Commit to Running in Production, expressed in days. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.'
