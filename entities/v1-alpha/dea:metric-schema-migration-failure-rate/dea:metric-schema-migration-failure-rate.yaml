id: dea:metric-schema-migration-failure-rate
name: Schema Migration Failure Rate
type: Metric
description: 'Schema Migration Failure Rate (SMFR) addresses the quality of outputs and outcomes and is
  a fixture of database & data platform operations reporting. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. The formula is Failed Migrations / Migration Attempts
  - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Software sector.'
