id: dea:metric-cash-return-on-capital-invested
name: Cash Return on Capital Invested
type: Metric
description: 'Within Valuation & Corporate Finance Standard Measures, Cash Return on Capital Invested
  (CROCI) is used to gauge the economic value created or preserved. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as After-Tax Pre-Financing
  Cash Flow / Gross Invested Capital, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
