id: dea:metric-fairness-metric-demographic-parity-gap
name: Fairness Metric - Demographic Parity Gap
type: Metric
description: A AI Ethics, Fairness & Responsible AI indicator, Fairness Metric - Demographic Parity Gap
  (FMDPG) quantifies the quality of outputs and outcomes. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Max Difference in Positive Outcome
  Rate across Groups; the result is stated in percent (%). It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
