id: dea:metric-loan-to-value-ratio
name: Loan-to-Value Ratio
type: Metric
description: 'Loan-to-Value Ratio (LTV) addresses exposure to adverse outcomes and is a fixture of banking
  & financial services reporting. The formula is Loan Amount / Collateral Value - reported in percent
  (%). It is a standard measure in the Financial services sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
