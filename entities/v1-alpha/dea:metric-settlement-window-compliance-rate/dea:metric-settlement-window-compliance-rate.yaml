id: dea:metric-settlement-window-compliance-rate
name: Settlement Window Compliance Rate
type: Metric
description: 'Settlement Window Compliance Rate (SWCR) addresses conformance to standards, plans, or obligations
  and is a fixture of payments & cards (deep dive) reporting. It is defined as Settlement Batches within
  Window / Batches; the result is stated in percent (%). In Payments, it is a recognized element of the
  standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. It should be maximized within the limits of cost and quality trade-offs.'
