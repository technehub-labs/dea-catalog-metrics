id: dea:metric-student-progression-rate-deep-dive
name: Student Progression Rate (Deep Dive)
type: Metric
description: Student Progression Rate (Deep Dive) (SPR-D) addresses how effectively a process or entity
  achieves its intended outcome and is a fixture of education & training (deep dive) reporting. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. The formula
  is Students Advancing to Next Level / Cohort - reported in percent (%). Improvement means raising this
  figure toward best-in-class levels. It is a standard measure in the Education sector.
abbreviation: SPR-D
unit: percent
