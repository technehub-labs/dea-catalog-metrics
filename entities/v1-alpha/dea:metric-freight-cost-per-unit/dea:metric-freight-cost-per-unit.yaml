id: dea:metric-freight-cost-per-unit
name: Freight Cost per Unit
type: Metric
description: Freight Cost per Unit (FCPU) addresses how efficiently resources are converted into outputs
  and is a fixture of supply chain reporting. Its calculation is Total Freight Cost / Units Shipped, measured
  in currency per unit. It is applied across virtually every sector. Its value drives prioritization and
  resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: FCPU
unit: currency
