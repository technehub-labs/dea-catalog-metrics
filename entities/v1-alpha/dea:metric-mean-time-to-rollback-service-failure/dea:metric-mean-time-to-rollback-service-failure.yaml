id: dea:metric-mean-time-to-rollback-service-failure
name: Mean Time to Rollback - Service Failure
type: Metric
description: A Observability & Site Reliability Engineering indicator, Mean Time to Rollback - Service
  Failure (MTRS-SF) quantifies how efficiently resources are converted into outputs. Its calculation is
  Minutes from Detected Failure to Rollback Complete, measured in minutes. It is applied across virtually
  every sector. It provides the day-to-day signal that a process is running as designed. Reduction is
  the goal, and sustained decreases indicate successful intervention.
