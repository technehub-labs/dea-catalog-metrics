id: dea:metric-financial-statement-close-cycle-time
name: Financial Statement Close Cycle Time
type: Metric
description: Financial Statement Close Cycle Time (FSCCT) captures how efficiently resources are converted
  into outputs for organizations tracking internal controls & financial reporting integrity. The formula
  is Days from Period End to Signed Financials - reported in days. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
