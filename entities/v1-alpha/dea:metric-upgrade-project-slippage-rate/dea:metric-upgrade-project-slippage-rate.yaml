id: dea:metric-upgrade-project-slippage-rate
name: Upgrade Project Slippage Rate
type: Metric
description: Upgrade Project Slippage Rate (UPSR) measures exposure to adverse outcomes in the ERP & Enterprise
  Application Operations domain. It is computed as Schedule Slippage / Planned Duration, expressed in
  percent (%). It is reviewed at cadence by planning owners to correct course before issues become strategic.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
abbreviation: UPSR
unit: percent
