id: dea:metric-production-incident-root-cause-test-gap-ratio
name: Production Incident Root Cause - Test Gap Ratio
type: Metric
description: A Software Testing & Quality Engineering indicator, Production Incident Root Cause - Test
  Gap Ratio (PIRC-TG) quantifies the quality of outputs and outcomes. It is defined as Incidents Attributed
  to Test Gaps / Incidents; the result is stated in percent (%). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: PIRC-TG
