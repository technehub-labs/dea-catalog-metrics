id: dea:metric-customer-lifetime-value
name: Customer Lifetime Value
type: Metric
description: A Customer indicator, Customer Lifetime Value (CLV) quantifies the economic value created
  or preserved. It is defined as Average Revenue per Customer x Gross Margin x Average Lifespan; the result
  is stated in currency value. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
