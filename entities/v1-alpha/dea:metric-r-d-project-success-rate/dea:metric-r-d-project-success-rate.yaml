id: dea:metric-r-d-project-success-rate
name: R&D Project Success Rate
type: Metric
description: R&D Project Success Rate (RPSR2) measures how effectively a process or entity achieves its
  intended outcome in the R&D and Innovation domain. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Projects Meeting Objectives / Projects Started;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: RPSR2
unit: percent
