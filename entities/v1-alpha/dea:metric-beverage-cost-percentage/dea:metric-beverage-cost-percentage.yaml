id: dea:metric-beverage-cost-percentage
name: Beverage Cost Percentage
type: Metric
description: Beverage Cost Percentage (BCP) addresses how efficiently resources are converted into outputs
  and is a fixture of hospitality & food service reporting. It is defined as Beverage Cost / Beverage
  Revenue; the result is stated in percent (%). In Hospitality, it is a recognized element of the standard
  performance toolkit. It bridges daily operations and executive reporting, giving managers a lever to
  pull within a quarter. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: BCP
unit: percent
