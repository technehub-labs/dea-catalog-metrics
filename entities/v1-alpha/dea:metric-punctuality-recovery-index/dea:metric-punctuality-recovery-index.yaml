id: dea:metric-punctuality-recovery-index
name: Punctuality Recovery Index
type: Metric
description: 'Within Airline & Transportation Standard Measures (Deep Dive), Punctuality Recovery Index
  (PRI-AT) is used to gauge capability maturity or development. The formula is Post-Disruption On-Time
  Share within 24 Hours - reported in percent (%). It is a standard measure in the Airlines & Aviation
  sector. It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. It should be maximized within the limits of cost and quality trade-offs.'
