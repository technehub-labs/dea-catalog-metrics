id: dea:metric-total-cost-of-ownership-per-application-deep-dive
name: Total Cost of Ownership per Application (Deep Dive)
type: Metric
description: Total Cost of Ownership per Application (Deep Dive) (TCOA-D) captures how efficiently resources
  are converted into outputs for organizations tracking it financial management & technology budgeting.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  The formula is Annual All-in Application Cost / Application - reported in currency value. It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
