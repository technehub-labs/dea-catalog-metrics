id: dea:metric-cost-per-square-meter-built
name: Cost per Square Meter Built
type: Metric
description: 'Cost per Square Meter Built (CSMB) addresses how efficiently resources are converted into
  outputs and is a fixture of construction & engineering reporting. It is computed as Total Construction
  Cost / Gross Floor Area, expressed in currency per unit. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. Lower values are better; each reduction
  is an improvement. Its use is concentrated in Construction & engineering.'
abbreviation: CSMB
unit: currency
