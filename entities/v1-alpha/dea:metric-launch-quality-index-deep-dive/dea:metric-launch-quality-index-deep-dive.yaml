id: dea:metric-launch-quality-index-deep-dive
name: Launch Quality Index (Deep Dive)
type: Metric
description: Launch Quality Index (Deep Dive) (LQI-D) captures the quality of outputs and outcomes for
  organizations tracking automotive manufacturing (deep dive). Its calculation is Composite New-Launch
  Defect Score, measured in index (0-100 or normalized). It originates from and is most used in Automotive
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: LQI-D
unit: index
