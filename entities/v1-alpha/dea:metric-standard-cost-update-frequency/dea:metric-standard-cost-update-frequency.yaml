name: Standard Cost Update Frequency
type: Metric
description: Standard Cost Update Frequency (SCUF) measures conformance to standards, plans, or obligations
  in the Product Costing & Margin Management domain. Its calculation is Days since Last Standard Cost
  Roll, measured in days. It is applied across virtually every sector. It provides the day-to-day signal
  that a process is running as designed. Reduction is the goal, and sustained decreases indicate successful
  intervention.
