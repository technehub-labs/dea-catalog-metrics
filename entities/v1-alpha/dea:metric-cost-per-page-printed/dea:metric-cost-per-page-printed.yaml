id: dea:metric-cost-per-page-printed
name: Cost per Page Printed
type: Metric
description: Cost per Page Printed (CPP) addresses how efficiently resources are converted into outputs
  and is a fixture of printing & publishing reporting. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Total Production Cost / Pages Printed, measured in currency
  per unit. It should be driven down, since lower readings signal healthier performance. It originates
  from and is most used in Printing & publishing practice.
abbreviation: CPP
unit: currency
version: 1.1.0
lifecycle_status: candidate
