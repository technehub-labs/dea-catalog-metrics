id: dea:metric-campaign-test-win-rate
name: Campaign Test Win Rate
type: Metric
description: Within Customer Analytics & Insights, Campaign Test Win Rate (CTWR) is used to gauge how
  effectively a process or entity achieves its intended outcome. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Tests Where Variant Beats
  Control / Tests Concluded, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CTWR
unit: percent
