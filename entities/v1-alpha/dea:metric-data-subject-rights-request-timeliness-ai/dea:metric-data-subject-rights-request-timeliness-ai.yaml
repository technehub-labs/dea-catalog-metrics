id: dea:metric-data-subject-rights-request-timeliness-ai
name: Data Subject Rights Request Timeliness - AI
type: Metric
description: 'Data Subject Rights Request Timeliness - AI (DSRTA) measures conformance to standards, plans,
  or obligations in the AI Ethics, Fairness & Responsible AI domain. It is computed as Rights Requests
  Answered within Statutory Window / Requests, expressed in percent (%). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
