id: dea:metric-site-rework-cost-ratio-deep-dive
name: Site Rework Cost Ratio (Deep Dive)
type: Metric
description: Site Rework Cost Ratio (Deep Dive) (SRCR-D) addresses how efficiently resources are converted
  into outputs and is a fixture of construction contracting (deep dive) reporting. It is defined as Rework
  Cost / Total Construction Cost; the result is stated in percent (%). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Lower values are better; each reduction
  is an improvement. In Construction, it is a recognized element of the standard performance toolkit.
abbreviation: SRCR-D
unit: percent
version: 1.1.0
