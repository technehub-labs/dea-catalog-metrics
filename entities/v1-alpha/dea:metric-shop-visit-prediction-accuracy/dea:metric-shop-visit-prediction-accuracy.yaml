id: dea:metric-shop-visit-prediction-accuracy
name: Shop Visit Prediction Accuracy
type: Metric
description: 'Shop Visit Prediction Accuracy (SVPA) captures the quality of outputs and outcomes for organizations
  tracking aviation maintenance repair & overhaul. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Actual Shop Visits Matched by Forecast
  / Actual Shop Visits - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Airlines & aviation sector.'
abbreviation: SVPA
unit: percent
version: 1.1.0
