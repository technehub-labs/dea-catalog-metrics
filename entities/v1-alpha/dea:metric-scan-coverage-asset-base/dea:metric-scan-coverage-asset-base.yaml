id: dea:metric-scan-coverage-asset-base
name: Scan Coverage - Asset Base
type: Metric
description: Scan Coverage - Asset Base (SCAB) captures capability maturity or development for organizations
  tracking vulnerability & exposure management. Its calculation is Assets Scanned in Cycle / In-Scope
  Assets, measured in percent (%). It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: SCAB
unit: percent
