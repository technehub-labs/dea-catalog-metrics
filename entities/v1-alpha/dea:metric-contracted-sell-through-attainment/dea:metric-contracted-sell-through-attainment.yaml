id: dea:metric-contracted-sell-through-attainment
name: Contracted Sell-Through Attainment
type: Metric
description: 'Contracted Sell-Through Attainment (CSTA) addresses the economic value created or preserved
  and is a fixture of channel & distribution management reporting. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Partner Sell-Through
  vs Commitment / Commitment, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: CSTA
unit: percent
