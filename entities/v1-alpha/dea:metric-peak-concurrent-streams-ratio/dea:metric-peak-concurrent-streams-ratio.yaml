id: dea:metric-peak-concurrent-streams-ratio
name: Peak Concurrent Streams Ratio
type: Metric
description: Peak Concurrent Streams Ratio (PCSR) captures the utilization or availability of capacity
  for organizations tracking broadcasting & streaming media. It is computed as Peak Concurrent Streams
  / Design Capacity, expressed in percent (%). Its use is concentrated in Media & Entertainment. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. Values outside
  the intended band, on either side, warrant investigation.
