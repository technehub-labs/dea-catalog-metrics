id: dea:metric-new-hire-90-day-retention
name: New Hire 90-Day Retention
type: Metric
description: New Hire 90-Day Retention (NH90) captures the quality of outputs and outcomes for organizations
  tracking human resources. It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. It is defined as Hires Retained at 90 Days / Total Hires; the result is stated
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: NH90
unit: percent
