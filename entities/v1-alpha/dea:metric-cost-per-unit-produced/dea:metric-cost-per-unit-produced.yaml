id: dea:metric-cost-per-unit-produced
name: Cost per Unit Produced
type: Metric
description: Cost per Unit Produced (CPU) addresses how efficiently resources are converted into outputs
  and is a fixture of operations reporting. It is computed as Total Production Cost / Units Produced,
  expressed in currency per unit. It is applied across virtually every sector. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. Reduction is the goal, and sustained
  decreases indicate successful intervention.
