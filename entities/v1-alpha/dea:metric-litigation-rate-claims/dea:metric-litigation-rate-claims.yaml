id: dea:metric-litigation-rate-claims
name: Litigation Rate (Claims)
type: Metric
description: 'A Claims Operations (Insurance) indicator, Litigation Rate (Claims) (LRC) quantifies exposure
  to adverse outcomes. It is computed as Claims Going to Litigation / Claims Settled, expressed in percent
  (%). Its use is concentrated in Insurance. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Reduction is the goal, and sustained decreases indicate successful
  intervention.'
