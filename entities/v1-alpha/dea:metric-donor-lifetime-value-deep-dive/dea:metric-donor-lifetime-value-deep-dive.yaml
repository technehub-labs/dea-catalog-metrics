id: dea:metric-donor-lifetime-value-deep-dive
name: Donor Lifetime Value (Deep Dive)
type: Metric
description: Donor Lifetime Value (Deep Dive) (DLTV-D) measures the economic value created or preserved
  in the Nonprofit & Donor Operations (Deep Dive) domain. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Average Lifetime Donations
  per Donor, measured in currency value. Improvement means raising this figure toward best-in-class levels.
  It originates from and is most used in Nonprofit practice.
