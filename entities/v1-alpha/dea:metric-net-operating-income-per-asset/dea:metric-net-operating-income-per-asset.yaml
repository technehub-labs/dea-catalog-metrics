id: dea:metric-net-operating-income-per-asset
name: Net Operating Income per Asset
type: Metric
description: Net Operating Income per Asset (NOIA) measures the economic value created or preserved in
  the Facilities & Real Estate domain. It is defined as Property Revenue - Property Operating Expenses;
  the result is stated in currency value. It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
