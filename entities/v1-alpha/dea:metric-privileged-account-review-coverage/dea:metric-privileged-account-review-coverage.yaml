id: dea:metric-privileged-account-review-coverage
name: Privileged Account Review Coverage
type: Metric
description: Privileged Account Review Coverage (PARC) measures conformance to standards, plans, or obligations
  in the Cybersecurity domain. It is defined as Privileged Accounts Reviewed / Privileged Accounts; the
  result is stated in percent (%). It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PARC
unit: percent
version: 1.1.0
