id: dea:metric-adverse-event-reporting-timeliness-devices
name: Adverse Event Reporting Timeliness (Devices)
type: Metric
description: Within Medical Devices, Adverse Event Reporting Timeliness (Devices) (AERT-D) is used to
  gauge conformance to standards, plans, or obligations. The formula is Reports Filed within Deadline
  / Reports Required - reported in percent (%). It is a standard measure in the Medical devices sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
