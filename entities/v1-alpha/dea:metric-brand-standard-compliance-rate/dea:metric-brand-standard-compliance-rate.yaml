id: dea:metric-brand-standard-compliance-rate
name: Brand Standard Compliance Rate
type: Metric
description: 'Brand Standard Compliance Rate (BSCR) measures conformance to standards, plans, or obligations
  in the Franchise & Multi-site domain. The formula is Audits Meeting Brand Standards / Audits Conducted
  - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. Higher values are better; gains are read as improvement and losses as deterioration.
  It is a standard measure in the Franchise & multi-site sector.'
