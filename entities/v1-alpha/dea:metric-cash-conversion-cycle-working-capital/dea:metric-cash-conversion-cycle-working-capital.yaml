id: dea:metric-cash-conversion-cycle-working-capital
name: Cash Conversion Cycle (Working Capital)
type: Metric
description: Cash Conversion Cycle (Working Capital) (CCC) measures how efficiently resources are converted
  into outputs in the Financial Statement Analysis Ratios (Deep Dive) domain. Its calculation is Days
  Inventory + Days Receivable - Days Payable, measured in days. It is applied across virtually every sector.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: CCC
unit: days
