id: dea:metric-startup-video-rebuffer-ratio
name: Startup Video Rebuffer Ratio
type: Metric
description: A Broadcasting & Streaming Media indicator, Startup Video Rebuffer Ratio (SVRR) quantifies
  the quality of outputs and outcomes. It is computed as Rebuffer Time / Play Time, expressed in percent
  (%). Its use is concentrated in Media & Entertainment. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: SVRR
unit: percent
