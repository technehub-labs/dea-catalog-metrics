id: dea:metric-predictive-maintenance-coverage
name: Predictive Maintenance Coverage
type: Metric
description: 'Predictive Maintenance Coverage (PDMC) captures capability maturity or development for organizations
  tracking reliability & maintainability engineering (deep dive). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Critical Assets
  with Condition Monitoring / Critical Assets, expressed in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
