id: dea:metric-forecast-bias-ratio
name: Forecast Bias Ratio
type: Metric
description: Forecast Bias Ratio (FBR-SC) captures the quality of outputs and outcomes for organizations
  tracking supply chain standard measures (deep dive). Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Cumulative Forecast Error / Cumulative Actual Demand,
  measured in percent (%). The objective is neither maximization nor minimization but staying within an
  agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: FBR-SC
