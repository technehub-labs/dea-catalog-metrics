id: dea:metric-dark-versus-lit-execution-mix
name: Dark versus Lit Execution Mix
type: Metric
description: 'Within Investment Research & Trading Operations, Dark versus Lit Execution Mix (DVLEM) is
  used to gauge conformance to standards, plans, or obligations. The formula is Dark Venue Volume / Total
  Volume - reported in percent (%). It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. It is managed toward a defined target band rather than an extreme - both overshoot
  and undershoot can signal problems. It is a standard measure in the Financial Services sector.'
