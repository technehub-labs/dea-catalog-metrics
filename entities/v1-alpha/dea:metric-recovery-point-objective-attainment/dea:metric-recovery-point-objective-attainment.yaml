id: dea:metric-recovery-point-objective-attainment
name: Recovery Point Objective Attainment
type: Metric
description: Recovery Point Objective Attainment (RPOA) addresses exposure to adverse outcomes and is
  a fixture of business resilience & continuity reporting. Its calculation is Recoveries within RPO /
  Recovery Validations, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: RPOA
unit: percent
