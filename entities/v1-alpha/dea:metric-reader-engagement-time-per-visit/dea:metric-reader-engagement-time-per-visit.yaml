measurable_entity_kind: dea:Service
reputability_tier: industry_standard
unit_ref: dea:unit-minute
source_credit: Public domain - no attribution required
calculation_definition: Total Time on Site / Visits
formula_definition:
  formula_id: dea:formula-reader-engagement-time-per-visit
  expression: RETV = Total Time on Site / Visits
  inputs:
  - name: Total Time on Site
  - name: Visits
