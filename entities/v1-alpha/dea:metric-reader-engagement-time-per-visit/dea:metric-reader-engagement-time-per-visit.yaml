id: dea:metric-reader-engagement-time-per-visit
name: Reader Engagement Time per Visit
type: Metric
description: Reader Engagement Time per Visit (RETV) addresses the engagement or satisfaction of the people
  involved and is a fixture of publishing & news media reporting. Its calculation is Total Time on Site
  / Visits, measured in minutes. Its value drives prioritization and resource reallocation among competing
  initiatives. Higher values are better; gains are read as improvement and losses as deterioration. It
  originates from and is most used in Media & Entertainment practice.
abbreviation: RETV
unit: minute
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
- engagement
scope_classification:
- capability
directionality: higher_is_better
management_significance:
