id: dea:metric-escalation-rate-contact-center-deep-dive
name: Escalation Rate (Contact Center) (Deep Dive)
type: Metric
description: Escalation Rate (Contact Center) (Deep Dive) (ESCDD) captures the quality of outputs and
  outcomes for organizations tracking contact center standard measures (deep dive). It is computed as
  Contacts Escalated to Tier 2+ / Contacts, expressed in percent (%). Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: ESCDD
unit: percent
