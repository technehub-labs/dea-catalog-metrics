id: dea:metric-lost-time-injury-rate
name: Lost Time Injury Rate
type: Metric
description: 'Lost Time Injury Rate (LTIR) captures exposure to adverse outcomes for organizations tracking
  health & safety. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It is computed as (Lost Time Injuries x 200,000) / Total Hours Worked, expressed in
  ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: LTIR
unit: ratio
version: 1.0.0
