id: dea:metric-customer-data-platform-coverage
name: Customer Data Platform Coverage
type: Metric
description: Within Customer Analytics & Insights, Customer Data Platform Coverage (CDPC) is used to gauge
  capability maturity or development. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Profiles Unified in CDP / Known Customer Profiles,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
