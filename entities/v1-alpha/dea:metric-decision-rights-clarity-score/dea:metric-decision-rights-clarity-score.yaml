id: dea:metric-decision-rights-clarity-score
name: Decision Rights Clarity Score
type: Metric
description: A Operating Model Monitoring & Design Effectiveness indicator, Decision Rights Clarity Score
  (DRCS-OM) quantifies capability maturity or development. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Decision Types with Assigned
  Owner / Decision Types, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
