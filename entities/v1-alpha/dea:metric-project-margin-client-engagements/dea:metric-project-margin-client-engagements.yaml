id: dea:metric-project-margin-client-engagements
name: Project Margin (Client Engagements)
type: Metric
description: Project Margin (Client Engagements) (PM-PS) addresses the economic value created or preserved
  and is a fixture of professional services reporting. Its calculation is (Fees - Delivery Costs) / Fees,
  measured in percent (%). It originates from and is most used in Professional services practice. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: PM-PS
unit: percent
