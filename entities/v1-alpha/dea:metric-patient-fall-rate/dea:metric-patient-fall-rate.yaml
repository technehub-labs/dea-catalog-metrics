id: dea:metric-patient-fall-rate
name: Patient Fall Rate
type: Metric
description: Patient Fall Rate (PFR) captures exposure to adverse outcomes for organizations tracking
  healthcare. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It is computed as Patient Falls / Patient Days x 1,000, expressed in events per thousand or million
  (scaled). It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Healthcare.
abbreviation: PFR
