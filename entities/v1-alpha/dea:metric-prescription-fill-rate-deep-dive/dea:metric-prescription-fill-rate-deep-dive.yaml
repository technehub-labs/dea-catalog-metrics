id: dea:metric-prescription-fill-rate-deep-dive
name: Prescription Fill Rate (Deep Dive)
type: Metric
description: 'Prescription Fill Rate (Deep Dive) (PFR-D) addresses how effectively a process or entity
  achieves its intended outcome and is a fixture of pharmacy retail reporting. It is defined as Prescriptions
  Filled / Prescriptions Received; the result is stated in percent (%). It is a working-level control:
  thresholds trigger immediate operational response. Higher values are better; gains are read as improvement
  and losses as deterioration. In Healthcare, it is a recognized element of the standard performance toolkit.'
abbreviation: PFR-D
unit: percent
