id: dea:metric-training-pipeline-success-rate
name: Training Pipeline Success Rate
type: Metric
description: Training Pipeline Success Rate (TPSR-M) captures the quality of outputs and outcomes for
  organizations tracking mlops & model lifecycle operations. Its calculation is Training Runs Completing
  without Failure / Runs, measured in percent (%). It provides the day-to-day signal that a process is
  running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: TPSR-M
