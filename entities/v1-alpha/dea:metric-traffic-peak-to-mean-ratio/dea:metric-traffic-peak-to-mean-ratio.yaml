id: dea:metric-traffic-peak-to-mean-ratio
name: Traffic Peak-to-Mean Ratio
type: Metric
description: 'Traffic Peak-to-Mean Ratio (TPMR) addresses the utilization or availability of capacity
  and is a fixture of network performance & capacity reporting. The formula is Peak Traffic / Average
  Traffic - reported in ratio (x:1 or x). It is applied across virtually every sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. Values outside the
  intended band, on either side, warrant investigation.'
