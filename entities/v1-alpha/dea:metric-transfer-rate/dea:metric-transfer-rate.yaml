id: dea:metric-transfer-rate
name: Transfer Rate
type: Metric
description: Transfer Rate (TRF) captures the quality of outputs and outcomes for organizations tracking
  contact center. Its calculation is Transferred Calls / Total Calls, measured in percent (%). It provides
  the day-to-day signal that a process is running as designed. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
