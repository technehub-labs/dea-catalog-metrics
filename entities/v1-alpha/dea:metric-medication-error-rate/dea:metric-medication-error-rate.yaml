id: dea:metric-medication-error-rate
name: Medication Error Rate
type: Metric
description: Within Healthcare, Medication Error Rate (MER) is used to gauge exposure to adverse outcomes.
  Its calculation is Medication Errors / Medication Administrations, measured in percent (%). It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Lower
  values are better; each reduction is an improvement. It originates from and is most used in Healthcare
  practice.
abbreviation: MER
unit: percent
