id: dea:metric-data-throughput-per-user
name: Data Throughput per User
type: Metric
description: Within Telecom Network Operations, Data Throughput per User (DTPU) is used to gauge the quality
  of outputs and outcomes. It is computed as Total Data Delivered / Active Users, expressed in ratio (x:1
  or x). Its use is concentrated in Telecommunications. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It should be maximized within the limits of cost
  and quality trade-offs.
abbreviation: DTPU
unit: ratio
