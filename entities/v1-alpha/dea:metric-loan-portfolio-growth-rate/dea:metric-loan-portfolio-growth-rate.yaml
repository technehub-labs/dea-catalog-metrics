id: dea:metric-loan-portfolio-growth-rate
name: Loan Portfolio Growth Rate
type: Metric
description: Loan Portfolio Growth Rate (LPGR) addresses growth over time and is a fixture of retail banking
  & lending reporting. Its calculation is (Loan Portfolio_current - Portfolio_prior) / Portfolio_prior,
  measured in percent (%). It originates from and is most used in Banking practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: LPGR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
