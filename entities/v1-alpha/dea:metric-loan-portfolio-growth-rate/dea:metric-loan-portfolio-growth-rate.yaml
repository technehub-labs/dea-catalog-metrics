calculation_definition: (Loan Portfolio_current - Portfolio_prior) / Portfolio_prior
formula_definition:
  formula_id: dea:formula-loan-portfolio-growth-rate
  expression: LPGR = (Loan Portfolio_current - Portfolio_prior) / Portfolio_prior
  inputs:
  - name: Loan Portfolio_current
  - name: Portfolio_prior
