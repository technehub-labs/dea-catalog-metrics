id: dea:metric-multi-factor-authentication-coverage
name: Multi-Factor Authentication Coverage
type: Metric
description: A Identity & Access Management Operations indicator, Multi-Factor Authentication Coverage
  (MFAC) quantifies exposure to adverse outcomes. The formula is Identities Enrolled in MFA / Eligible
  Identities - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: MFAC
unit: percent
