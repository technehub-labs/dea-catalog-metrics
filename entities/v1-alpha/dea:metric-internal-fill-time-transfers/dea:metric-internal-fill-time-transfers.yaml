id: dea:metric-internal-fill-time-transfers
name: Internal Fill Time (Transfers)
type: Metric
description: 'Within Workforce Planning & Productivity, Internal Fill Time (Transfers) (IFT-WF) is used
  to gauge how efficiently resources are converted into outputs. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Days to Fill Role via Internal Move; the result
  is stated in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
