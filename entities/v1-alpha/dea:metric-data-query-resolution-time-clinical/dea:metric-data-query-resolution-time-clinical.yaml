id: dea:metric-data-query-resolution-time-clinical
name: Data Query Resolution Time (Clinical)
type: Metric
description: 'Data Query Resolution Time (Clinical) (DQRT) measures how efficiently resources are converted
  into outputs in the Pharma R&D & Clinical Trials domain. The formula is Days to Resolve Data Queries
  - reported in days. It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Lower values are better; each reduction is an improvement. It is a standard measure in the Pharmaceuticals
  sector.'
