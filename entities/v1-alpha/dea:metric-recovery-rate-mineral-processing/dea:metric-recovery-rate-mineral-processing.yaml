id: dea:metric-recovery-rate-mineral-processing
name: Recovery Rate (Mineral Processing)
type: Metric
description: A Mining & Metals indicator, Recovery Rate (Mineral Processing) (RR-MP) quantifies how efficiently
  resources are converted into outputs. Its calculation is Recovered Metal / Metal in Feed Ore, measured
  in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Mining & metals practice.
