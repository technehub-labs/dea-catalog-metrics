id: dea:metric-recruiter-productivity
name: Recruiter Productivity
type: Metric
description: 'Recruiter Productivity (RPR-S) measures how efficiently resources are converted into outputs
  in the Staffing & Recruiting domain. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is Placements per Recruiter per Period - reported
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Staffing & recruiting sector.'
