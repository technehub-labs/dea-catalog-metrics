id: dea:metric-cash-flow-return-on-investment
name: Cash Flow Return on Investment
type: Metric
description: Cash Flow Return on Investment (CFROI) captures the economic value created or preserved for
  organizations tracking balanced scorecard - financial perspective. Its calculation is Cash Flow / Invested
  Capital, measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CFROI
