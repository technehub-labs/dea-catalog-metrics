id: dea:metric-average-transaction-value
name: Average Transaction Value
type: Metric
description: Within Retail & E-commerce, Average Transaction Value (ATV) is used to gauge the economic
  value created or preserved. It is defined as Total Revenue / Number of Transactions; the result is stated
  in currency value. It bridges daily operations and executive reporting, giving managers a lever to pull
  within a quarter. Higher values are better; gains are read as improvement and losses as deterioration.
  In Retail, it is a recognized element of the standard performance toolkit.
