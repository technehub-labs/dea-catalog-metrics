id: dea:metric-false-decline-rate-deep-dive
name: False Decline Rate (Deep Dive)
type: Metric
description: False Decline Rate (Deep Dive) (FDR-P) captures the economic value created or preserved for
  organizations tracking payments & cards (deep dive). Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Legitimate Transactions Declined / Declined;
  the result is stated in percent (%). It should be driven down, since lower readings signal healthier
  performance. In Payments, it is a recognized element of the standard performance toolkit.
abbreviation: FDR-P
unit: percent
