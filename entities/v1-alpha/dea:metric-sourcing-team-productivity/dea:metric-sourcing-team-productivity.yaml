id: dea:metric-sourcing-team-productivity
name: Sourcing Team Productivity
type: Metric
description: A Strategic Sourcing & Supplier Performance (Deep Dive) indicator, Sourcing Team Productivity
  (STP-SS) quantifies how efficiently resources are converted into outputs. Its calculation is RFx Events
  Completed per Sourcing FTE per Quarter, measured in events per thousand or million (scaled). Its value
  drives prioritization and resource reallocation among competing initiatives. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
