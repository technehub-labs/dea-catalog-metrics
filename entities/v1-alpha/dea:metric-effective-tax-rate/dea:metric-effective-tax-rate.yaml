id: dea:metric-effective-tax-rate
name: Effective Tax Rate
type: Metric
description: 'Effective Tax Rate (ETR) captures conformance to standards, plans, or obligations for organizations
  tracking tax & fiscal. It is computed as Total Tax Expense / Pre-Tax Accounting Income, expressed in
  percent (%). It is applied across virtually every sector. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. Values outside the intended band, on either
  side, warrant investigation.'
