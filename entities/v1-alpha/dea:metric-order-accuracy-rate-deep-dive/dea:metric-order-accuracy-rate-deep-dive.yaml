id: dea:metric-order-accuracy-rate-deep-dive
name: Order Accuracy Rate (Deep Dive)
type: Metric
description: Order Accuracy Rate (Deep Dive) (OAR-D) captures the quality of outputs and outcomes for
  organizations tracking restaurant operations (deep dive). Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. It is computed as Orders Correct on Delivery
  / Orders, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Its use is concentrated in Restaurants.
