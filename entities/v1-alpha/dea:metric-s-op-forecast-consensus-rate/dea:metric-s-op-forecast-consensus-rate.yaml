id: dea:metric-s-op-forecast-consensus-rate
name: S&OP Forecast Consensus Rate
type: Metric
description: S&OP Forecast Consensus Rate (SFCSR) measures the engagement or satisfaction of the people
  involved in the Supply Chain Standard Measures (Deep Dive) domain. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Consensus Reached without
  Escalation / Planning Cycles, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SFCSR
unit: percent
