id: dea:metric-workplace-availability-rate
name: Workplace Availability Rate
type: Metric
description: 'A Facilities & Real Estate indicator, Workplace Availability Rate (WAR) quantifies the utilization
  or availability of capacity. The formula is Functional Workstations / Total Workstations - reported
  in percent (%). It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Higher values are better; gains are read as improvement and losses as deterioration. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: WAR
unit: percent
version: 1.0.1
