id: dea:metric-net-promoter-score-contact-center
name: Net Promoter Score (Contact Center)
type: Metric
description: Net Promoter Score (Contact Center) (NPS-CC) captures the engagement or satisfaction of the
  people involved for organizations tracking contact center. Its calculation is % Promoters - % Detractors
  among Contact Center Customers, measured in score (points). It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: NPS-CC
