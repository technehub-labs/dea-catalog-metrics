id: dea:metric-preventive-screening-compliance-hedis-style
name: Preventive Screening Compliance (HEDIS-Style)
type: Metric
description: Within Healthcare Quality & Patient Safety Standard Measures, Preventive Screening Compliance
  (HEDIS-Style) (PSCH) is used to gauge the quality of outputs and outcomes. Its calculation is Members
  Receiving Age-Risk Appropriate Screenings / Eligible Members, measured in percent (%). It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Higher values are
  better; gains are read as improvement and losses as deterioration. It originates from and is most used
  in Healthcare practice.
abbreviation: PSCH
unit: percent
