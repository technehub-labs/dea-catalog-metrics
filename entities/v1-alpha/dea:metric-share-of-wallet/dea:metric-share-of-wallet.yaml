id: dea:metric-share-of-wallet
name: Share of Wallet
type: Metric
description: Share of Wallet (SOW) measures growth over time in the Banking & Financial Services domain.
  Its calculation is Organization Revenue from Customer / Customer Total Spend in Category, measured in
  percent (%). Its value drives prioritization and resource reallocation among competing initiatives.
  Higher values are better; gains are read as improvement and losses as deterioration. It originates from
  and is most used in Financial services practice.
abbreviation: SOW
unit: percent
