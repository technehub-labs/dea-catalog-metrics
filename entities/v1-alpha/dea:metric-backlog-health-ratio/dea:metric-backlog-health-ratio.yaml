id: dea:metric-backlog-health-ratio
name: Backlog Health Ratio
type: Metric
description: Backlog Health Ratio (BHR-S) measures how efficiently resources are converted into outputs
  in the Software Product Operations (Deep Dive) domain. It is computed as Active Items Completed per
  Sprint / Committed, expressed in percent (%). Its use is concentrated in Technology. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: BHR-S
unit: percent
