id: dea:metric-investigation-cycle-time-deep-dive
name: Investigation Cycle Time (Deep Dive)
type: Metric
description: A Insurance Fraud & Financial Crime indicator, Investigation Cycle Time (Deep Dive) (ICT-D)
  quantifies how efficiently resources are converted into outputs. It is computed as Days from Case Open
  to Disposition, expressed in days. Its use is concentrated in Financial Services. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. Reduction is the goal,
  and sustained decreases indicate successful intervention.
