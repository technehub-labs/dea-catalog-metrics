id: dea:metric-self-service-channel-adoption-utilities
name: Self-Service Channel Adoption (Utilities)
type: Metric
description: Self-Service Channel Adoption (Utilities) (SSA-U) captures how efficiently resources are
  converted into outputs for organizations tracking utilities customer operations. It is defined as Self-Service
  Transactions / Total Transactions; the result is stated in percent (%). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Higher values are better; gains are
  read as improvement and losses as deterioration. In Utilities, it is a recognized element of the standard
  performance toolkit.
abbreviation: SSA-U
unit: percent
