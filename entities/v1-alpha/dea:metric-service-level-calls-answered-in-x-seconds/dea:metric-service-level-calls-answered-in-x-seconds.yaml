id: dea:metric-service-level-calls-answered-in-x-seconds
name: Service Level (Calls Answered in X seconds)
type: Metric
description: A Contact Center indicator, Service Level (Calls Answered in X seconds) (SL-CC) quantifies
  conformance to standards, plans, or obligations. It is computed as Calls Answered within Threshold /
  Calls Offered, expressed in percent (%). It is applied across virtually every sector. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: SL-CC
unit: percent
version: 1.1.0
