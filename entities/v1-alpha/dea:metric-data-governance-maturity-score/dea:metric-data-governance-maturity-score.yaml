id: dea:metric-data-governance-maturity-score
name: Data Governance Maturity Score
type: Metric
description: Data Governance Maturity Score (DGMS-DG) measures capability maturity or development in the
  Data Governance & Stewardship domain. The formula is Assessed Maturity Level per DAMA-Style Framework
  - reported in score (points). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
