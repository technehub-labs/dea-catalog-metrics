id: dea:metric-password-policy-compliance-rate
name: Password Policy Compliance Rate
type: Metric
description: 'Password Policy Compliance Rate (PPCR-IAM) addresses conformance to standards, plans, or
  obligations and is a fixture of identity & access management operations reporting. It is defined as
  Accounts Meeting Password Standard / Accounts; the result is stated in percent (%). It is a working-level
  control: thresholds trigger immediate operational response. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
