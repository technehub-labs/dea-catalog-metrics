id: dea:metric-analytics-adoption-rate
name: Analytics Adoption Rate
type: Metric
description: Analytics Adoption Rate (AAR) addresses the economic value created or preserved and is a
  fixture of data management & analytics reporting. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as Active Analytics Users / Licensed Analytics
  Users, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: AAR
unit: percent
