id: dea:metric-time-to-regulatory-approval
name: Time to Regulatory Approval
type: Metric
description: Time to Regulatory Approval (TTRA) addresses how efficiently resources are converted into
  outputs and is a fixture of pharmaceuticals & life sciences reporting. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Days from
  Submission to Approval, measured in days. It should be driven down, since lower readings signal healthier
  performance. It originates from and is most used in Pharmaceuticals practice.
abbreviation: TTRA
unit: day
version: 1.1.0
