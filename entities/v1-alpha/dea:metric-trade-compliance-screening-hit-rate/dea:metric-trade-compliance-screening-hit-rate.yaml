id: dea:metric-trade-compliance-screening-hit-rate
name: Trade Compliance Screening Hit Rate
type: Metric
description: 'Trade Compliance Screening Hit Rate (TCSH) measures exposure to adverse outcomes in the
  International Trade & Customs domain. It is defined as Denied-Party Hits Confirmed / Screening Hits;
  the result is stated in percent (%). It is a working-level control: thresholds trigger immediate operational
  response. It is managed toward a defined target band rather than an extreme - both overshoot and undershoot
  can signal problems. In Logistics & Trade, it is a recognized element of the standard performance toolkit.'
abbreviation: TCSH
unit: percent
