id: dea:metric-patent-application-filing-rate
name: Patent Application Filing Rate
type: Metric
description: Patent Application Filing Rate (PAFR) captures growth over time for organizations tracking
  r&d and innovation. The formula is Patent Applications Filed per Period - reported in count (items per
  period). It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
