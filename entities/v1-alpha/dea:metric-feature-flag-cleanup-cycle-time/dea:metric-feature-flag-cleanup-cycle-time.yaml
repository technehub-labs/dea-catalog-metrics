id: dea:metric-feature-flag-cleanup-cycle-time
name: Feature Flag Cleanup Cycle Time
type: Metric
description: Feature Flag Cleanup Cycle Time (FFCCT) captures the quality of outputs and outcomes for
  organizations tracking continuous delivery & deployment. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Days from Flag Full Rollout to Removal, measured in days.
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
