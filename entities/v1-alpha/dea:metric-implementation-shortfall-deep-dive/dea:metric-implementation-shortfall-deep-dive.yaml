id: dea:metric-implementation-shortfall-deep-dive
name: Implementation Shortfall (Deep Dive)
type: Metric
description: 'Implementation Shortfall (Deep Dive) (ISF-D) captures how efficiently resources are converted
  into outputs for organizations tracking investment research & trading operations. It is computed as
  Realized versus Paper Portfolio Cost, expressed in percent (%). Its use is concentrated in Financial
  Services. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. Reduction is the goal, and sustained decreases indicate successful intervention.'
