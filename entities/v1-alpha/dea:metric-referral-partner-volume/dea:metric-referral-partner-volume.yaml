id: dea:metric-referral-partner-volume
name: Referral Partner Volume
type: Metric
description: Referral Partner Volume (RPV) captures growth over time for organizations tracking insurance
  distribution & brokerage. Its calculation is New Business from Referral Partners per Period, measured
  in count (items per period). It originates from and is most used in Insurance distribution practice.
  Its value drives prioritization and resource reallocation among competing initiatives. It should be
  maximized within the limits of cost and quality trade-offs.
