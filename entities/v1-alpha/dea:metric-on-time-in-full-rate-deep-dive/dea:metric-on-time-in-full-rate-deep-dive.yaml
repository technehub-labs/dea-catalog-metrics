id: dea:metric-on-time-in-full-rate-deep-dive
name: On-Time In-Full Rate (Deep Dive)
type: Metric
description: On-Time In-Full Rate (Deep Dive) (OTIFDD) addresses the quality of outputs and outcomes and
  is a fixture of supply chain standard measures (deep dive) reporting. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Order Lines On
  Time and Complete / Order Lines - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
