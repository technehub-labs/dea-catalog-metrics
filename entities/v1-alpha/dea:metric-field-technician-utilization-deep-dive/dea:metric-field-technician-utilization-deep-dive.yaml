id: dea:metric-field-technician-utilization-deep-dive
name: Field Technician Utilization (Deep Dive)
type: Metric
description: Within Field Maintenance & Technical Field Service (Deep Dive), Field Technician Utilization
  (Deep Dive) (FTU-D) is used to gauge the utilization or availability of capacity. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Billable or Job Hours / Paid
  Hours, measured in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.
