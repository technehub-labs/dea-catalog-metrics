id: dea:metric-levelized-cost-of-storage
name: Levelized Cost of Storage
type: Metric
description: Levelized Cost of Storage (LCOS) captures the economic value created or preserved for organizations
  tracking energy transition & renewables. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Lifetime Storage Costs / Energy
  Delivered from Storage, measured in currency per unit. It should be driven down, since lower readings
  signal healthier performance. It originates from and is most used in Renewable energy practice.
abbreviation: LCOS
unit: currency
