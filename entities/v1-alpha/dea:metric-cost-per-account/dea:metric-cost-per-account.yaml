id: dea:metric-cost-per-account
name: Cost per Account
type: Metric
description: 'Cost per Account (CPA) measures how efficiently resources are converted into outputs in
  the Banking & Financial Services domain. The formula is Total Account Servicing Cost / Active Accounts
  - reported in currency per unit. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Lower values are better; each reduction is an improvement. It is a standard
  measure in the Financial services sector.'
abbreviation: CPA
unit: currency
version: 1.1.0
lifecycle_status: candidate
