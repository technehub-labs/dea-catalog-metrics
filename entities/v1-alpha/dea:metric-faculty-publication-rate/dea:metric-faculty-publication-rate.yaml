id: dea:metric-faculty-publication-rate
name: Faculty Publication Rate
type: Metric
description: Faculty Publication Rate (FPR) captures growth over time for organizations tracking education.
  It is defined as Peer-Reviewed Publications per Faculty FTE; the result is stated in ratio (x:1 or x).
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Higher
  values are better; gains are read as improvement and losses as deterioration. In Education, it is a
  recognized element of the standard performance toolkit.
