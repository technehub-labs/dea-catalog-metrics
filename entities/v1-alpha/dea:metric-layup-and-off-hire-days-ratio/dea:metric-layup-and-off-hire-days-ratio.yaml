id: dea:metric-layup-and-off-hire-days-ratio
name: Layup and Off-hire Days Ratio
type: Metric
description: 'A Maritime Shipping (Deep Dive) indicator, Layup and Off-hire Days Ratio (LODR) quantifies
  exposure to adverse outcomes. It is computed as Off-hire Days / Total Vessel Days, expressed in percent
  (%). It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Lower values are better; each reduction is an improvement. Its use is concentrated in Maritime.'
