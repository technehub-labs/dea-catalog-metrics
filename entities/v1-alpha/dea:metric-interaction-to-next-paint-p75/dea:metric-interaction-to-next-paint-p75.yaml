id: dea:metric-interaction-to-next-paint-p75
name: Interaction to Next Paint (P75)
type: Metric
description: 'Interaction to Next Paint (P75) (INP75) addresses the quality of outputs and outcomes and
  is a fixture of web & digital analytics standard measures reporting. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is 75th Percentile Interaction
  Latency - reported in milliseconds (ms). It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Digital product sector.'
