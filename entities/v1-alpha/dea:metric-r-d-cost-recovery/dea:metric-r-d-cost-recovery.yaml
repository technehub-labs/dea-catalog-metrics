id: dea:metric-r-d-cost-recovery
name: R&D Cost Recovery
type: Metric
description: Within R&D and Innovation, R&D Cost Recovery (RDCC) is used to gauge the economic value created
  or preserved. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It is defined as Revenue from New Products / Cumulative R&D Investment; the result is stated
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: RDCC
unit: ratio
