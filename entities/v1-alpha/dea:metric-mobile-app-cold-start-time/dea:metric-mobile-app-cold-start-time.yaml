id: dea:metric-mobile-app-cold-start-time
name: Mobile App Cold Start Time
type: Metric
description: Mobile App Cold Start Time (MACST) captures the quality of outputs and outcomes for organizations
  tracking mobile & client development. It is computed as Median Time to First Usable Screen on Launch,
  expressed in seconds. Front-line and delivery teams watch it in real time, as small deviations demand
  immediate correction. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Software.
