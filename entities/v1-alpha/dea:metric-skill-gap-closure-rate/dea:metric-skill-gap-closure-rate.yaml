id: dea:metric-skill-gap-closure-rate
name: Skill Gap Closure Rate
type: Metric
description: 'A Learning & Development indicator, Skill Gap Closure Rate (SGCR) quantifies capability
  maturity or development. It is computed as Closed Skill Gaps / Identified Skill Gaps, expressed in percent
  (%). It is applied across virtually every sector. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It should be maximized within the limits of cost
  and quality trade-offs.'
abbreviation: SGCR
unit: percent
version: 1.1.0
