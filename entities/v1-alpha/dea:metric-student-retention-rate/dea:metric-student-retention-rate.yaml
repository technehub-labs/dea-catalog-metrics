id: dea:metric-student-retention-rate
name: Student Retention Rate
type: Metric
description: Student Retention Rate (SRR) captures the retention of customers, users, or assets over time
  for organizations tracking education. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Students Continuing / Students Enrolled at Start
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. It is
  a standard measure in the Education sector.
abbreviation: SRR
unit: percent
