id: dea:metric-emergency-work-order-rate
name: Emergency Work Order Rate
type: Metric
description: Emergency Work Order Rate (EWR) captures exposure to adverse outcomes for organizations tracking
  maintenance & reliability. It is computed as Emergency Work Orders / Total Work Orders, expressed in
  percent (%). It is reviewed at cadence by planning owners to correct course before issues become strategic.
  Lower values are better; each reduction is an improvement. Its use is concentrated in Manufacturing.
abbreviation: EWR
unit: percent
version: 1.0.1
