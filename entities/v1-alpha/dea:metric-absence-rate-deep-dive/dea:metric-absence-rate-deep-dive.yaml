id: dea:metric-absence-rate-deep-dive
name: Absence Rate (Deep Dive)
type: Metric
description: 'Within Workforce Planning & Productivity, Absence Rate (Deep Dive) (ARDD) is used to gauge
  the utilization or availability of capacity. It is defined as Absent Days / Scheduled Days; the result
  is stated in percent (%). It is a working-level control: thresholds trigger immediate operational response.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
