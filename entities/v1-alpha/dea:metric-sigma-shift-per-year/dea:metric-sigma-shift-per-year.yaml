id: dea:metric-sigma-shift-per-year
name: Sigma Shift per Year
type: Metric
description: Within Process Excellence (Lean Six Sigma), Sigma Shift per Year (SSPY) is used to gauge
  the quality of outputs and outcomes. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Change in Process Sigma Level Year over Year,
  measured in score (points). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
