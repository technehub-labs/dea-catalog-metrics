id: dea:metric-data-governance-policy-adoption-rate
name: Data Governance Policy Adoption Rate
type: Metric
description: 'Within Data Governance & Stewardship, Data Governance Policy Adoption Rate (DGPRA) is used
  to gauge conformance to standards, plans, or obligations. It is computed as Business Units with Adopted
  Charter / Business Units, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
