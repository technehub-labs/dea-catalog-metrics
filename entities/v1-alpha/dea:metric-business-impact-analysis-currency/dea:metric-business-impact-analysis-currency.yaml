id: dea:metric-business-impact-analysis-currency
name: Business Impact Analysis Currency
type: Metric
description: Business Impact Analysis Currency (BIAC) captures conformance to standards, plans, or obligations
  for organizations tracking business continuity & disaster recovery. The formula is BIAs Refreshed within
  Cycle / Critical Processes - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
