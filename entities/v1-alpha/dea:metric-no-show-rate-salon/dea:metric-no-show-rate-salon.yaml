id: dea:metric-no-show-rate-salon
name: No-Show Rate (Salon)
type: Metric
description: 'No-Show Rate (Salon) (NSR-S) captures how efficiently resources are converted into outputs
  for organizations tracking beauty & personal care services. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. The formula is Missed Appointments / Appointments
  - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Personal Services sector.'
abbreviation: NSR-S
unit: percent
version: 1.1.0
lifecycle_status: candidate
