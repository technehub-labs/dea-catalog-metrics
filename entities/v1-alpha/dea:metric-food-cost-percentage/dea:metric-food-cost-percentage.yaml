id: dea:metric-food-cost-percentage
name: Food Cost Percentage
type: Metric
description: 'A Hospitality & Food Service indicator, Food Cost Percentage (FCP) quantifies how efficiently
  resources are converted into outputs. The formula is Food Cost / Food Revenue - reported in percent
  (%). It is a standard measure in the Hospitality sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
