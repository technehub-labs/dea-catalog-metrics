id: dea:metric-penetration-test-finding-recurrence-rate
name: Penetration Test Finding Recurrence Rate
type: Metric
description: A DevSecOps & Application Security Engineering indicator, Penetration Test Finding Recurrence
  Rate (PTFRR) quantifies exposure to adverse outcomes. It is defined as Findings Recurring from Prior
  Test / Findings; the result is stated in percent (%). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: PTFRR
unit: percent
