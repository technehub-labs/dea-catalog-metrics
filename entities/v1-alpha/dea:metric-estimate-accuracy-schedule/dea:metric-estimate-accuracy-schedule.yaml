id: dea:metric-estimate-accuracy-schedule
name: Estimate Accuracy - Schedule
type: Metric
description: Estimate Accuracy - Schedule (EAS-PM) addresses the quality of outputs and outcomes and is
  a fixture of project management (deep dive) reporting. Its calculation is Actual Duration / Estimated
  Duration at Milestone, measured in ratio (x:1 or x). It is applied across virtually every sector. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  Values outside the intended band, on either side, warrant investigation.
abbreviation: EAS-PM
unit: ratio
