id: dea:metric-cctv-coverage-of-critical-areas
name: CCTV Coverage of Critical Areas
type: Metric
description: A Physical Security Operations indicator, CCTV Coverage of Critical Areas (CCVC) quantifies
  conformance to standards, plans, or obligations. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It is defined as Critical Areas under Surveillance
  / Critical Areas Identified; the result is stated in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CCVC
unit: percent
