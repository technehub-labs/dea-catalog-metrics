id: dea:metric-market-capture-ratio-refining
name: Market Capture Ratio (Refining)
type: Metric
description: 'A Oil & Gas Downstream & Refining indicator, Market Capture Ratio (Refining) (MCR-R) quantifies
  the economic value created or preserved. It is computed as Realized Crack Spread / Market Crack Spread,
  expressed in percent (%). Its use is concentrated in Oil & Gas. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It should be maximized within the
  limits of cost and quality trade-offs.'
abbreviation: MCR-R
unit: percent
