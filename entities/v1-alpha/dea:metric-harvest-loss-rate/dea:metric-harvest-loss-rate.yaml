id: dea:metric-harvest-loss-rate
name: Harvest Loss Rate
type: Metric
description: Harvest Loss Rate (HLR) addresses the quality of outputs and outcomes and is a fixture of
  agriculture & food processing reporting. It is computed as Post-Harvest Losses / Total Harvest, expressed
  in percent (%). Its use is concentrated in Agriculture & food. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: HLR
unit: percent
