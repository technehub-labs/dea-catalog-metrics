id: dea:metric-network-capacity-headroom-deep-dive
name: Network Capacity Headroom (Deep Dive)
type: Metric
description: Network Capacity Headroom (Deep Dive) (NCH-D) addresses the utilization or availability of
  capacity and is a fixture of telecom network operations (deep dive) reporting. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It is defined as Peak Utilization
  / Provisioned Capacity; the result is stated in percent (%). The objective is neither maximization nor
  minimization but staying within an agreed operating band. In Telecommunications, it is a recognized
  element of the standard performance toolkit.
abbreviation: NCH-D
unit: percent
