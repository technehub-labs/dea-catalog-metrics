id: dea:metric-dividend-payout-consistency
name: Dividend Payout Consistency
type: Metric
description: Dividend Payout Consistency (DPC-BSC) addresses conformance to standards, plans, or obligations
  and is a fixture of balanced scorecard - financial perspective reporting. The formula is Dividends Paid
  as Planned / Planned - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
