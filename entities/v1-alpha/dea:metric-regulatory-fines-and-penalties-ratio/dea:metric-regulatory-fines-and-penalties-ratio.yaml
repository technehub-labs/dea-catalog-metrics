id: dea:metric-regulatory-fines-and-penalties-ratio
name: Regulatory Fines and Penalties Ratio
type: Metric
description: 'Regulatory Fines and Penalties Ratio (RFPR) measures exposure to adverse outcomes in the
  Regulatory Affairs & Compliance Operations domain. It is computed as Total Penalties / Revenue, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
abbreviation: RFPR
unit: percent
