id: dea:metric-objective-to-action-traceability-rate
name: Objective-to-Action Traceability Rate
type: Metric
description: Objective-to-Action Traceability Rate (OTATR) measures conformance to standards, plans, or
  obligations in the Enterprise OKR & Performance Management domain. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Initiatives Traced
  to Objectives / Initiatives - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: OTATR
