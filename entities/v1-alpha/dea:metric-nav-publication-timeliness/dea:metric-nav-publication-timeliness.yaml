id: dea:metric-nav-publication-timeliness
name: NAV Publication Timeliness
type: Metric
description: 'A Investment Management - Portfolio Operations indicator, NAV Publication Timeliness (NAVPT)
  quantifies conformance to standards, plans, or obligations. It is computed as NAVs Published within
  Commitment / Publications, expressed in percent (%). Its use is concentrated in Financial Services.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
