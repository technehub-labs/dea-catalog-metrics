id: dea:metric-curriculum-review-currency-deep-dive
name: Curriculum Review Currency (Deep Dive)
type: Metric
description: Curriculum Review Currency (Deep Dive) (CRC-D) measures the quality of outputs and outcomes
  in the Education & Training (Deep Dive) domain. Its calculation is Courses Reviewed within Cycle / Courses,
  measured in percent (%). It originates from and is most used in Education practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
