id: dea:metric-client-compliance-with-prescribed-medication
name: Client Compliance with Prescribed Medication
type: Metric
description: A Veterinary & Animal Health indicator, Client Compliance with Prescribed Medication (CCPM)
  quantifies the quality of outputs and outcomes. It is computed as Refills Collected on Schedule / Prescribed,
  expressed in percent (%). Its use is concentrated in Healthcare. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It should be maximized within the limits of
  cost and quality trade-offs.
