id: dea:metric-conversion-rate-retail
name: Conversion Rate (Retail)
type: Metric
description: Conversion Rate (Retail) (CVR-R) captures how effectively a process or entity achieves its
  intended outcome for organizations tracking retail & e-commerce. It is defined as Purchasing Customers
  / Store Visitors; the result is stated in percent (%). It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Higher values are better; gains are read as improvement
  and losses as deterioration. In Retail, it is a recognized element of the standard performance toolkit.
abbreviation: CVR-R
