id: dea:metric-demand-intake-to-funding-cycle-time
name: Demand Intake to Funding Cycle Time
type: Metric
description: Within IT Financial Management & Technology Budgeting, Demand Intake to Funding Cycle Time
  (DITFCT) is used to gauge how efficiently resources are converted into outputs. It is defined as Days
  from Demand Submission to Approved Funding; the result is stated in days. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
