id: dea:metric-management-action-closure-rate
name: Management Action Closure Rate
type: Metric
description: A Internal Audit indicator, Management Action Closure Rate (MACR) quantifies conformance
  to standards, plans, or obligations. It is computed as Actions Closed by Due Date / Actions Due, expressed
  in percent (%). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: MACR
unit: percent
