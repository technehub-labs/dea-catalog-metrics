id: dea:metric-overlimit-rate
name: Overlimit Rate
type: Metric
description: Within Credit & Collections Risk (Enterprise), Overlimit Rate (OLR-CC) is used to gauge exposure
  to adverse outcomes. Its calculation is Accounts above Approved Limit / Accounts, measured in percent
  (%). It provides the day-to-day signal that a process is running as designed. Lower values are better;
  each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
