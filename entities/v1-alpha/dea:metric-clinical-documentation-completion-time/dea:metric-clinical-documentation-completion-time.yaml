id: dea:metric-clinical-documentation-completion-time
name: Clinical Documentation Completion Time
type: Metric
description: A Medical Practice & Clinical Operations indicator, Clinical Documentation Completion Time
  (CDCT) quantifies how efficiently resources are converted into outputs. It is computed as Hours from
  Encounter to Closed Note, expressed in hours. Its use is concentrated in Healthcare. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. Reduction is
  the goal, and sustained decreases indicate successful intervention.
abbreviation: CDCT
unit: hour
