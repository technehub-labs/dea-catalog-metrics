id: dea:metric-crowd-density-compliance-rate
name: Crowd Density Compliance Rate
type: Metric
description: Crowd Density Compliance Rate (CDCR-E) measures exposure to adverse outcomes in the Events
  & Exhibitions domain. It is computed as Times within Density Limits / Monitoring Periods, expressed
  in percent (%). Its use is concentrated in Media & Entertainment. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. It should be maximized within the
  limits of cost and quality trade-offs.
abbreviation: CDCR-E
unit: percent
version: 1.1.0
