id: dea:metric-system-average-interruption-frequency-index-deep-dive
name: System Average Interruption Frequency Index (Deep Dive)
type: Metric
description: System Average Interruption Frequency Index (Deep Dive) (SAIFI-D) captures the quality of
  outputs and outcomes for organizations tracking utilities field operations & grid. It is defined as
  Customer Interruptions / Customers Served; the result is stated in times per period. In Utilities, it
  is a recognized element of the standard performance toolkit. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: SAIFI-D
