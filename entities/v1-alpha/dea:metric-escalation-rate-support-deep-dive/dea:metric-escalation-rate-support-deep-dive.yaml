id: dea:metric-escalation-rate-support-deep-dive
name: Escalation Rate (Support Deep Dive)
type: Metric
description: Escalation Rate (Support Deep Dive) (ESCR-D) addresses the quality of outputs and outcomes
  and is a fixture of software product operations (deep dive) reporting. It provides the day-to-day signal
  that a process is running as designed. Its calculation is Escalated Tickets / Tickets, measured in percent
  (%). It should be driven down, since lower readings signal healthier performance. It originates from
  and is most used in Technology practice.
abbreviation: ESCR-D
unit: percent
