id: dea:metric-trading-error-rate
name: Trading Error Rate
type: Metric
description: 'Trading Error Rate (TER) addresses exposure to adverse outcomes and is a fixture of investment
  banking & capital markets reporting. The formula is Erroneous Trades / Total Trades - reported in percent
  (%). It is monitored close to the work: teams act on it within a shift, sprint, or daily review. Lower
  values are better; each reduction is an improvement. It is a standard measure in the Investment banking
  sector.'
abbreviation: TER
unit: percent
version: 1.1.0
lifecycle_status: candidate
