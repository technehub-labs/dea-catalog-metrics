id: dea:metric-model-owner-accountability-coverage
name: Model Owner Accountability Coverage
type: Metric
description: Model Owner Accountability Coverage (MOAC) measures governance in the AI Governance & Model
  Risk Management domain. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Models with Named Accountable Owner / Models - reported in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
