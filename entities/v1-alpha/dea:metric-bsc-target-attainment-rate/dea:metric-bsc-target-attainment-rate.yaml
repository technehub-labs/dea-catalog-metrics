id: dea:metric-bsc-target-attainment-rate
name: BSC Target Attainment Rate
type: Metric
description: BSC Target Attainment Rate (BTAR) addresses the economic value created or preserved and is
  a fixture of balanced scorecard implementation & review reporting. It is defined as Measures Meeting
  Target / Measures with Targets; the result is stated in percent (%). It is applied across virtually
  every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: BTAR
unit: percent
