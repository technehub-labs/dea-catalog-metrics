id: dea:metric-average-transaction-value-payments
name: Average Transaction Value (Payments)
type: Metric
description: A Payments & Fintech indicator, Average Transaction Value (Payments) (ATV-P) quantifies the
  economic value created or preserved. It is defined as Total Processed Value / Transaction Count; the
  result is stated in currency value. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. In Payments & fintech, it is a recognized element of the standard performance toolkit.
