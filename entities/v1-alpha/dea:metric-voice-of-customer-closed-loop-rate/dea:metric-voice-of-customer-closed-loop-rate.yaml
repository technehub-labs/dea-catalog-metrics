id: dea:metric-voice-of-customer-closed-loop-rate
name: Voice of Customer Closed-Loop Rate
type: Metric
description: Voice of Customer Closed-Loop Rate (VoCCL) measures the engagement or satisfaction of the
  people involved in the Customer Journey & Experience domain. It is computed as Survey Follow-ups Closed
  with Customer / Negative Surveys, expressed in percent (%). It is reviewed at cadence by planning owners
  to correct course before issues become strategic. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: VoCCL
unit: percent
version: 1.0.0
