id: dea:metric-budget-variance
name: Budget Variance
type: Metric
description: Budget Variance (BV) addresses conformance to standards, plans, or obligations and is a fixture
  of finance & accounting reporting. It is defined as (Actual Spend - Budgeted Spend) / Budgeted Spend;
  the result is stated in percent (%). It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. Lower values are better; each reduction is an improvement. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: BV
unit: percent
