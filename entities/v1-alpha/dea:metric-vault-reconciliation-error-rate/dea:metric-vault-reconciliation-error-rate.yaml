id: dea:metric-vault-reconciliation-error-rate
name: Vault Reconciliation Error Rate
type: Metric
description: 'Vault Reconciliation Error Rate (VRER) captures the quality of outputs and outcomes for
  organizations tracking retail banking branch network (deep dive). The formula is Vault Reconciliation
  Discrepancies / Reconciliations - reported in events per thousand or million (scaled). It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Lower values are better;
  each reduction is an improvement. It is a standard measure in the Banking sector.'
