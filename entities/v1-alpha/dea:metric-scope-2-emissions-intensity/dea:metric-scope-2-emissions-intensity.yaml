id: dea:metric-scope-2-emissions-intensity
name: Scope 2 Emissions Intensity
type: Metric
description: Scope 2 Emissions Intensity (S2EI) measures environmental and social sustainability performance
  in the Environmental, Social & Governance Reporting domain. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Its calculation is Scope 2 tCO2e
  / Revenue Unit, measured in tonnes CO2 equivalent (tCO2e). It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
