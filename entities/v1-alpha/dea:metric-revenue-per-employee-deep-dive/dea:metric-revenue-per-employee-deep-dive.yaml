id: dea:metric-revenue-per-employee-deep-dive
name: Revenue per Employee (Deep Dive)
type: Metric
description: 'Revenue per Employee (Deep Dive) (RPE-D) captures how efficiently resources are converted
  into outputs for organizations tracking balanced scorecard - financial perspective. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Revenue / Average Employees, expressed in currency per unit. Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: RPE-D
unit: currency
version: 1.1.0
lifecycle_status: candidate
