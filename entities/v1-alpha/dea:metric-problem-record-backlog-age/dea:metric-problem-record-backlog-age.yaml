id: dea:metric-problem-record-backlog-age
name: Problem Record Backlog Age
type: Metric
description: Problem Record Backlog Age (PRBA) captures how efficiently resources are converted into outputs
  for organizations tracking it incident & major problem management. It is computed as Open Problems beyond
  90 Days / Open Problems, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Lower values are better; each reduction is an improvement. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PRBA
unit: percent
