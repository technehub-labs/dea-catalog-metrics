id: dea:metric-markdown-rate-deep-dive
name: Markdown Rate (Deep Dive)
type: Metric
description: A Retail Standard Measures indicator, Markdown Rate (Deep Dive) (MKDD) quantifies the economic
  value created or preserved. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Markdown Value / Gross Sales, expressed in percent (%). It should
  be driven down, since lower readings signal healthier performance. Its use is concentrated in Retail
  & E-commerce.
abbreviation: MKDD
unit: percent
