id: dea:metric-average-deal-size
name: Average Deal Size
type: Metric
description: Average Deal Size (ADS) captures the economic value created or preserved for organizations
  tracking sales. It is computed as Total Closed Revenue / Closed Deals, expressed in currency value.
  It is reviewed at cadence by planning owners to correct course before issues become strategic. Higher
  values are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: ADS
unit: currency
