id: dea:metric-critical-findings-in-review-rate
name: Critical Findings in Review Rate
type: Metric
description: Within Code Review & Peer Quality, Critical Findings in Review Rate (CFRR) is used to gauge
  exposure to adverse outcomes. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Critical or Security Comments / Reviews, expressed in
  ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance. Its use
  is concentrated in Software.
abbreviation: CFRR
unit: ratio
version: 1.1.0
lifecycle_status: candidate
