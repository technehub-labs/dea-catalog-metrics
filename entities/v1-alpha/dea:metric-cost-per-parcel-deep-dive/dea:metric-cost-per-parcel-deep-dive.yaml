id: dea:metric-cost-per-parcel-deep-dive
name: Cost per Parcel (Deep Dive)
type: Metric
description: Cost per Parcel (Deep Dive) (CPP-D) captures how efficiently resources are converted into
  outputs for organizations tracking parcel & last-mile logistics (deep dive). Its trend is watched by
  senior leadership as an early signal of structural performance shifts. It is defined as Delivery Cost
  / Parcels Delivered; the result is stated in currency per unit. It should be driven down, since lower
  readings signal healthier performance. In Logistics & Trade, it is a recognized element of the standard
  performance toolkit.
abbreviation: CPP-D
