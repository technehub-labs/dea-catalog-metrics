id: dea:metric-energy-intensity-of-refining
name: Energy Intensity of Refining
type: Metric
description: A Oil & Gas indicator, Energy Intensity of Refining (EIR) quantifies how efficiently resources
  are converted into outputs. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Refinery Energy Consumed / Crude Throughput, expressed in ratio
  (x:1 or x). It should be driven down, since lower readings signal healthier performance. Its use is
  concentrated in Oil & gas.
abbreviation: EIR
unit: ratio
