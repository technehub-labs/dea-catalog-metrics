id: dea:metric-demand-response-program-delivery
name: Demand Response Program Delivery
type: Metric
description: 'Demand Response Program Delivery (DRPD) captures the utilization or availability of capacity
  for organizations tracking utilities field operations & grid. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. It is computed as Curtailed Load vs Committed
  / Committed, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Its use is concentrated in Utilities.'
