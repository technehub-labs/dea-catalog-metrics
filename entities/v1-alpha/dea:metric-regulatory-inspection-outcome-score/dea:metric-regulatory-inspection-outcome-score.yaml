id: dea:metric-regulatory-inspection-outcome-score
name: Regulatory Inspection Outcome Score
type: Metric
description: Regulatory Inspection Outcome Score (RIOS) captures conformance to standards, plans, or obligations
  for organizations tracking elder & social care. It is defined as Weighted Score from Care Regulator
  Inspection; the result is stated in score (points). Its trend is watched by senior leadership as an
  early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. In Social care, it is a recognized element of the standard performance
  toolkit.
