id: dea:metric-cavity-fill-balance-variance
name: Cavity Fill Balance Variance
type: Metric
description: 'Within Packaging & Plastics, Cavity Fill Balance Variance (CFBV) is used to gauge the quality
  of outputs and outcomes. It is defined as Part Weight Variation across Cavities; the result is stated
  in percent (%). In Manufacturing, it is a recognized element of the standard performance toolkit. It
  is a working-level control: thresholds trigger immediate operational response. Reduction is the goal,
  and sustained decreases indicate successful intervention.'
