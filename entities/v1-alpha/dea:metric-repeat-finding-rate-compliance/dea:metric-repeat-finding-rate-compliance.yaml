id: dea:metric-repeat-finding-rate-compliance
name: Repeat Finding Rate (Compliance)
type: Metric
description: Repeat Finding Rate (Compliance) (RFRC) measures the quality of outputs and outcomes in the
  Compliance Monitoring & Testing domain. It is computed as Findings Recurring from Prior Cycle / Findings,
  expressed in percent (%). It is reviewed at cadence by planning owners to correct course before issues
  become strategic. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: RFRC
unit: percent
