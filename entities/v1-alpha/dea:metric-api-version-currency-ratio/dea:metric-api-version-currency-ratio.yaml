id: dea:metric-api-version-currency-ratio
name: API Version Currency Ratio
type: Metric
description: API Version Currency Ratio (APIVC) addresses how efficiently resources are converted into
  outputs and is a fixture of api lifecycle management reporting. It is computed as Calls on Latest Major
  Version / Total Calls, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is concentrated in Software.
abbreviation: APIVC
unit: percent
