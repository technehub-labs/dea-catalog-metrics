id: dea:metric-damage-rate-courier
name: Damage Rate (Courier)
type: Metric
description: Within Postal & Courier, Damage Rate (Courier) (DMG) is used to gauge the quality of outputs
  and outcomes. Its calculation is Damaged Items / Items Handled, measured in percent (%). It provides
  the day-to-day signal that a process is running as designed. Lower values are better; each reduction
  is an improvement. It originates from and is most used in Postal & courier practice.
