id: dea:metric-downstream-impact-event-rate
name: Downstream Impact Event Rate
type: Metric
description: Within Data Quality Management, Downstream Impact Event Rate (DIER) is used to gauge exposure
  to adverse outcomes. It is computed as Quality Failures Reaching Downstream Consumers / Failures, expressed
  in percent (%). It is applied across virtually every sector. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: DIER
unit: percent
version: 1.1.0
