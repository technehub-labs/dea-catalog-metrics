id: dea:metric-yield-to-capacity-ratio
name: Yield-to-Capacity Ratio
type: Metric
description: Within Process Capability & Six Sigma (Deep Dive), Yield-to-Capacity Ratio (YCR-SS) is used
  to gauge how efficiently resources are converted into outputs. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Good Units Produced / Theoretical
  Maximum Capacity - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Manufacturing sector.
abbreviation: YCR-SS
unit: percent
