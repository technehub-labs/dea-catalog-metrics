id: dea:metric-gig-platform-dispute-rate
name: Gig Platform Dispute Rate
type: Metric
description: Gig Platform Dispute Rate (GPDR) addresses exposure to adverse outcomes and is a fixture
  of gig & contingent workforce reporting. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It is computed as Disputed Tasks / Tasks Completed, expressed
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: GPDR
unit: percent
version: 1.0.1
