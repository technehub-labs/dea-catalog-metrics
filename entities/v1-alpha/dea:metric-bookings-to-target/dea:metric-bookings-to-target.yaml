id: dea:metric-bookings-to-target
name: Bookings to Target
type: Metric
description: Bookings to Target (B2T) measures conformance to standards, plans, or obligations in the
  Sales domain. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It is defined as Total Bookings / Target Bookings; the result is stated in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
