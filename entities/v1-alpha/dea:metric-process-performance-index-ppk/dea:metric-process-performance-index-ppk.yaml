id: dea:metric-process-performance-index-ppk
name: Process Performance Index (Ppk)
type: Metric
description: 'Process Performance Index (Ppk) (PPKS) measures the quality of outputs and outcomes in the
  Process Capability & Six Sigma (Deep Dive) domain. The formula is Min Distance of Mean to Spec Limit
  / (3 x Total Std Dev) - reported in ratio (x:1 or x). It is monitored close to the work: teams act on
  it within a shift, sprint, or daily review. Higher values are better; gains are read as improvement
  and losses as deterioration. It is a standard measure in the Manufacturing sector.'
abbreviation: PPKS
unit: ratio
