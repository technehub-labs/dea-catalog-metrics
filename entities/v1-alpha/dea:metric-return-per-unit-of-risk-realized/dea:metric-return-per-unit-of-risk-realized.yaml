id: dea:metric-return-per-unit-of-risk-realized
name: Return per Unit of Risk Realized
type: Metric
description: A Investment Performance Measurement indicator, Return per Unit of Risk Realized (RPRUR)
  quantifies the economic value created or preserved. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Realized Return / Realized Volatility
  - reported in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. It
  is a standard measure in the Investment management sector.
