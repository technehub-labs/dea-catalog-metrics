id: dea:metric-fleet-availability-rail
name: Fleet Availability (Rail)
type: Metric
description: 'Within Rail Transport, Fleet Availability (Rail) (FAR) is used to gauge the utilization
  or availability of capacity. It is computed as Serviceable Trains / Total Fleet, expressed in percent
  (%). It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is concentrated
  in Rail.'
abbreviation: FAR
unit: percent
