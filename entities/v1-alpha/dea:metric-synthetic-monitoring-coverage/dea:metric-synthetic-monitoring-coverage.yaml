id: dea:metric-synthetic-monitoring-coverage
name: Synthetic Monitoring Coverage
type: Metric
description: Synthetic Monitoring Coverage (SYNMC) measures the quality of outputs and outcomes in the
  SRE & Observability Standard Measures domain. Its calculation is Critical User Journeys under Synthetic
  Test / Critical Journeys, measured in percent (%). It provides the day-to-day signal that a process
  is running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Software practice.
abbreviation: SYNMC
unit: percent
