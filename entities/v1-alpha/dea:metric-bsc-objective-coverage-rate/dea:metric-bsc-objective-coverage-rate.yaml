id: dea:metric-bsc-objective-coverage-rate
name: BSC Objective Coverage Rate
type: Metric
description: BSC Objective Coverage Rate (BSOC) addresses strategy and is a fixture of balanced scorecard
  implementation & review reporting. The formula is Strategy Map Objectives with Linked Measures / Objectives
  - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
