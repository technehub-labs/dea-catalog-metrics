id: dea:metric-forecast-accuracy-mape
name: Forecast Accuracy (MAPE)
type: Metric
description: Within Supply Chain, Forecast Accuracy (MAPE) (FA2) is used to gauge the quality of outputs
  and outcomes. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It is computed as Mean ABS(Actual - Forecast) / Actual, expressed in percent (%). It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: FA2
unit: percent
