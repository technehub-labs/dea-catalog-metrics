id: dea:metric-copper-to-fiber-migration-rate
name: Copper to Fiber Migration Rate
type: Metric
description: Copper to Fiber Migration Rate (CFMR) captures transformation for organizations tracking
  telecom field & installation. It is defined as Migrated Lines / Addressable Lines; the result is stated
  in percent (%). In Telecommunications, it is a recognized element of the standard performance toolkit.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: CFMR
unit: percent
