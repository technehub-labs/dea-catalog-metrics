id: dea:metric-audit-committee-meeting-frequency-compliance
name: Audit Committee Meeting Frequency Compliance
type: Metric
description: Within Corporate Governance, Audit Committee Meeting Frequency Compliance (ACMF) is used
  to gauge conformance to standards, plans, or obligations. It is defined as Audit Committee Meetings
  Held / Required Meetings; the result is stated in percent (%). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: ACMF
unit: percent
