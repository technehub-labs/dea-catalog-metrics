id: dea:metric-subscription-retention-rate-publishing
name: Subscription Retention Rate (Publishing)
type: Metric
description: Subscription Retention Rate (Publishing) (SRR-P) captures the retention of customers, users,
  or assets over time for organizations tracking printing & publishing. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Subscriptions
  Renewed / Subscriptions Expiring, measured in percent (%). Improvement means raising this figure toward
  best-in-class levels. It originates from and is most used in Printing & publishing practice.
abbreviation: SRR-P
unit: percent
