id: dea:metric-project-irr-realization-development
name: Project IRR Realization (Development)
type: Metric
description: 'Project IRR Realization (Development) (PIRR) measures the economic value created or preserved
  in the Real Estate & Mortgage Standard Measures domain. It is computed as Realized IRR vs Underwritten
  IRR / Underwritten IRR, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is concentrated in Real
  estate.'
