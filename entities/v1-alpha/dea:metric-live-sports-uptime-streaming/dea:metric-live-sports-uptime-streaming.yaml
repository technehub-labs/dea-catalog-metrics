id: dea:metric-live-sports-uptime-streaming
name: Live Sports Uptime (Streaming)
type: Metric
description: Live Sports Uptime (Streaming) (LSUS) measures the utilization or availability of capacity
  in the Broadcasting & Streaming Media domain. It is defined as Live Stream Uptime during Events / Event
  Hours; the result is stated in percent (%). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Higher values are better; gains are read as improvement and losses
  as deterioration. In Media & Entertainment, it is a recognized element of the standard performance toolkit.
abbreviation: LSUS
unit: percent
