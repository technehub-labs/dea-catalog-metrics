id: dea:metric-revenue-per-passenger-kilometre
name: Revenue per Passenger Kilometre
type: Metric
description: Within Rail Transport, Revenue per Passenger Kilometre (RPkM) is used to gauge the economic
  value created or preserved. Its calculation is Passenger Revenue / Passenger Kilometres, measured in
  currency per unit. It originates from and is most used in Rail practice. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
