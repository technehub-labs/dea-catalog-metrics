id: dea:metric-transition-milestone-adherence
name: Transition Milestone Adherence
type: Metric
description: 'A Outsourcing & Vendor Management indicator, Transition Milestone Adherence (TMA) quantifies
  conformance to standards, plans, or obligations. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Outsourcing Transition Milestones
  Met on Time / Milestones, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
