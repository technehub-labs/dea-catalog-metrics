id: dea:metric-mdm-platform-availability
name: MDM Platform Availability
type: Metric
description: A Master Data Management indicator, MDM Platform Availability (MDMPA) quantifies the quality
  of outputs and outcomes. It is computed as Uptime of MDM Hub Services, expressed in percent (%). It
  is applied across virtually every sector. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It should be maximized within the limits of cost and quality
  trade-offs.
