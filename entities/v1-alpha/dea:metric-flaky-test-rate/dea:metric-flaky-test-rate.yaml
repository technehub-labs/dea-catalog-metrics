id: dea:metric-flaky-test-rate
name: Flaky Test Rate
type: Metric
description: 'Within Continuous Integration, Flaky Test Rate (FTR-CI) is used to gauge the quality of
  outputs and outcomes. It is monitored close to the work: teams act on it within a shift, sprint, or
  daily review. The formula is Tests Failing without Code Change / Test Runs - reported in percent (%).
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
abbreviation: FTR-CI
unit: percent
