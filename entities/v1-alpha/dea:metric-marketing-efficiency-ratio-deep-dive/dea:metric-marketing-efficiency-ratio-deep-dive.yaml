id: dea:metric-marketing-efficiency-ratio-deep-dive
name: Marketing Efficiency Ratio (Deep Dive)
type: Metric
description: Within Marketing & Advertising Standard Measures (Deep Dive), Marketing Efficiency Ratio
  (Deep Dive) (MERDD) is used to gauge how efficiently resources are converted into outputs. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. The formula
  is Total Revenue / Total Marketing Spend - reported in ratio (x:1 or x). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
