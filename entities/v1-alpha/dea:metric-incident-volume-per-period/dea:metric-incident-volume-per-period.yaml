id: dea:metric-incident-volume-per-period
name: Incident Volume per Period
type: Metric
description: Within IT Incident & Major Problem Management, Incident Volume per Period (IVPP-IT) is used
  to gauge exposure to adverse outcomes. It is defined as Incidents Logged per Month; the result is stated
  in count (items per period). It is applied across virtually every sector. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Reduction is the goal, and sustained
  decreases indicate successful intervention.
