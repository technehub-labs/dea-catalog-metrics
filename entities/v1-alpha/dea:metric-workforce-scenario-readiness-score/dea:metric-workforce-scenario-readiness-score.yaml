id: dea:metric-workforce-scenario-readiness-score
name: Workforce Scenario Readiness Score
type: Metric
description: 'Within Workforce Planning & Productivity, Workforce Scenario Readiness Score (WSRS) is used
  to gauge exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Rubric of Modeled Scenarios for Workforce
  Shifts, expressed in score (points). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
