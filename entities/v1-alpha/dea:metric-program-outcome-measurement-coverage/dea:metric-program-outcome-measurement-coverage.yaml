id: dea:metric-program-outcome-measurement-coverage
name: Program Outcome Measurement Coverage
type: Metric
description: 'Program Outcome Measurement Coverage (POMC) addresses how effectively a process or entity
  achieves its intended outcome and is a fixture of nonprofit & donor operations (deep dive) reporting.
  It is computed as Programs with Measured Outcomes / Programs, expressed in percent (%). It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is concentrated in Nonprofit.'
abbreviation: POMC
unit: percent
