id: dea:metric-trade-decision-to-order-latency
name: Trade Decision-to-Order Latency
type: Metric
description: 'Within Investment Research & Trading Operations, Trade Decision-to-Order Latency (TDOL-T)
  is used to gauge how efficiently resources are converted into outputs. The formula is Minutes from Decision
  to Order Placement - reported in minutes. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Lower values are better; each reduction is an improvement. It is a
  standard measure in the Financial Services sector.'
