id: dea:metric-app-store-rating-insurance-app
name: App Store Rating (Insurance App)
type: Metric
description: A Insurance Distribution - Direct & Digital indicator, App Store Rating (Insurance App) (ASR-I)
  quantifies the engagement or satisfaction of the people involved. Its calculation is Average App Rating,
  measured in score (points). It originates from and is most used in Insurance practice. Its value drives
  prioritization and resource reallocation among competing initiatives. It should be maximized within
  the limits of cost and quality trade-offs.
