id: dea:metric-cure-rate-delinquent-loans
name: Cure Rate (Delinquent Loans)
type: Metric
description: A Banking Retail Lending (Deep Dive) indicator, Cure Rate (Delinquent Loans) (CRDL) quantifies
  the economic value created or preserved. It is defined as Accounts Returning to Current / Delinquent
  Accounts; the result is stated in percent (%). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. Higher values are better; gains are read as improvement and
  losses as deterioration. In Banking, it is a recognized element of the standard performance toolkit.
