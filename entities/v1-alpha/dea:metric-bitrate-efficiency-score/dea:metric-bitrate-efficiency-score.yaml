id: dea:metric-bitrate-efficiency-score
name: Bitrate Efficiency Score
type: Metric
description: Within Broadcasting & Streaming Media, Bitrate Efficiency Score (BES) is used to gauge the
  quality of outputs and outcomes. It is computed as Perceived Quality per Bitrate Delivered, expressed
  in index (0-100 or normalized). Its use is concentrated in Media & Entertainment. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It should be maximized
  within the limits of cost and quality trade-offs.
