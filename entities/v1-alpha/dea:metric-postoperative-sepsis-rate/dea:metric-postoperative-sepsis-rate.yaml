id: dea:metric-postoperative-sepsis-rate
name: Postoperative Sepsis Rate
type: Metric
description: Postoperative Sepsis Rate (POSR) addresses the quality of outputs and outcomes and is a fixture
  of healthcare reporting. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Post-Surgical Sepsis Cases / Surgeries; the result is stated in
  percent (%). It should be driven down, since lower readings signal healthier performance. In Healthcare,
  it is a recognized element of the standard performance toolkit.
abbreviation: POSR
unit: percent
