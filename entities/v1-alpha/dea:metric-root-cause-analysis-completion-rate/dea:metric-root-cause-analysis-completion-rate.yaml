id: dea:metric-root-cause-analysis-completion-rate
name: Root Cause Analysis Completion Rate
type: Metric
description: A IT Incident & Major Problem Management indicator, Root Cause Analysis Completion Rate (RCACR)
  quantifies conformance to standards, plans, or obligations. Its calculation is RCAs Completed within
  Target for Major Incidents / Major Incidents, measured in percent (%). It is applied across virtually
  every sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
