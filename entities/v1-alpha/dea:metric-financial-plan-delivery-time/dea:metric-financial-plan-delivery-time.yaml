id: dea:metric-financial-plan-delivery-time
name: Financial Plan Delivery Time
type: Metric
description: Within Asset & Wealth Management (Deep Dive), Financial Plan Delivery Time (FPDT) is used
  to gauge how efficiently resources are converted into outputs. Its calculation is Days from Data Gathering
  to Plan Presentation, measured in days. It originates from and is most used in Financial Services practice.
  Its value drives prioritization and resource reallocation among competing initiatives. Reduction is
  the goal, and sustained decreases indicate successful intervention.
