id: dea:metric-marketing-qualified-lead-to-sales-accepted-ratio
name: Marketing Qualified Lead to Sales Accepted Ratio
type: Metric
description: A Marketing & Advertising Standard Measures (Deep Dive) indicator, Marketing Qualified Lead
  to Sales Accepted Ratio (MQSAR) quantifies the quality of outputs and outcomes. Its calculation is SALs
  / MQLs, measured in percent (%). Its value drives prioritization and resource reallocation among competing
  initiatives. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: MQSAR
unit: percent
