id: dea:metric-sast-findings-per-1-000-lines-of-code
name: SAST Findings per 1,000 Lines of Code
type: Metric
description: Within DevSecOps & Application Security Engineering, SAST Findings per 1,000 Lines of Code
  (SAST1K) is used to gauge exposure to adverse outcomes. It is computed as Static Application Security
  Findings per KLOC, expressed in events per thousand or million (scaled). It is applied across virtually
  every sector. Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Reduction is the goal, and sustained decreases indicate successful intervention.
