id: dea:metric-first-year-retention-rate-new-hires
name: First-Year Retention Rate (New Hires)
type: Metric
description: 'First-Year Retention Rate (New Hires) (FYRR) addresses the retention of customers, users,
  or assets over time and is a fixture of talent acquisition deep dive reporting. It is computed as Hires
  Retained at 12 Months / Hires, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
