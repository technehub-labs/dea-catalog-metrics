id: dea:metric-post-deployment-verification-coverage
name: Post-Deployment Verification Coverage
type: Metric
description: 'A Continuous Delivery & Deployment indicator, Post-Deployment Verification Coverage (PDVC)
  quantifies the quality of outputs and outcomes. The formula is Deployments with Automated Smoke Verification
  / Deployments - reported in percent (%). It is monitored close to the work: teams act on it within a
  shift, sprint, or daily review. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
