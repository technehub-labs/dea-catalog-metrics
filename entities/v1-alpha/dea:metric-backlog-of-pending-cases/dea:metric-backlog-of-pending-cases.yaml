id: dea:metric-backlog-of-pending-cases
name: Backlog of Pending Cases
type: Metric
description: Within Public Sector & Government, Backlog of Pending Cases (BPC) is used to gauge the utilization
  or availability of capacity. It is defined as Open Cases Aged beyond Service Standard; the result is
  stated in count (items per period). In Public sector, it is a recognized element of the standard performance
  toolkit. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. Reduction is the goal, and sustained decreases indicate successful intervention.
