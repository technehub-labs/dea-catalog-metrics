id: dea:metric-earnings-loss-from-absence
name: Earnings Loss from Absence
type: Metric
description: A Employee Wellbeing indicator, Earnings Loss from Absence (ELA) quantifies exposure to adverse
  outcomes. Its calculation is Absence Days x Average Daily Output Value, measured in currency value.
  It is applied across virtually every sector. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Reduction is the goal, and sustained decreases indicate
  successful intervention.
