id: dea:metric-weekly-retention-cohort-curve
name: Weekly Retention Cohort Curve
type: Metric
description: Weekly Retention Cohort Curve (WRCC) addresses the retention of customers, users, or assets
  over time and is a fixture of web & digital analytics standard measures reporting. Its calculation is
  Active Users in Week N / Cohort Size, measured in percent (%). It originates from and is most used in
  Digital product practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: WRCC
unit: percent
