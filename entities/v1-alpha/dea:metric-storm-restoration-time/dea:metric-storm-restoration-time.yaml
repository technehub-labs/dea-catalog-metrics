id: dea:metric-storm-restoration-time
name: Storm Restoration Time
type: Metric
description: 'A Utilities Field Operations & Grid indicator, Storm Restoration Time (SRT) quantifies how
  effectively a process or entity achieves its intended outcome. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Hours from Storm
  End to Full Restoration, expressed in hours. It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Utilities.'
