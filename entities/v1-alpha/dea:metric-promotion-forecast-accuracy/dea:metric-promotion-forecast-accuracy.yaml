id: dea:metric-promotion-forecast-accuracy
name: Promotion Forecast Accuracy
type: Metric
description: Promotion Forecast Accuracy (PFA) addresses the quality of outputs and outcomes and is a
  fixture of sales & operations planning reporting. Its calculation is 1 - ABS(Promotional Forecast -
  Actual) / Actual, measured in percent (%). It is applied across virtually every sector. Its value drives
  prioritization and resource reallocation among competing initiatives. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: PFA
unit: percent
