id: dea:metric-share-of-voice-deep-dive
name: Share of Voice (Deep Dive)
type: Metric
description: Share of Voice (Deep Dive) (SOV-D) addresses growth over time and is a fixture of advertising
  & media buying reporting. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Brand Impressions / Total Category Impressions - reported in percent (%).
  Improvement means raising this figure toward best-in-class levels. It is a standard measure in the Media
  & Entertainment sector.
