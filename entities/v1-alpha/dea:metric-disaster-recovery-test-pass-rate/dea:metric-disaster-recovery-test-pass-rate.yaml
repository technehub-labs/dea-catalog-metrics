id: dea:metric-disaster-recovery-test-pass-rate
name: Disaster Recovery Test Pass Rate
type: Metric
description: Disaster Recovery Test Pass Rate (DRTPR) captures exposure to adverse outcomes for organizations
  tracking business continuity & disaster recovery. Its calculation is Successful DR Tests / DR Tests
  Executed, measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DRTPR
unit: percent
