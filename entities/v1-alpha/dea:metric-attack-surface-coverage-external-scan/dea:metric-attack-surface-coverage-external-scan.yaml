id: dea:metric-attack-surface-coverage-external-scan
name: Attack Surface Coverage - External Scan
type: Metric
description: 'Attack Surface Coverage - External Scan (ASCES) addresses exposure to adverse outcomes and
  is a fixture of vulnerability & exposure management reporting. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as External Assets
  Covered by Continuous Scan / Discovered, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: ASCES
unit: percent
