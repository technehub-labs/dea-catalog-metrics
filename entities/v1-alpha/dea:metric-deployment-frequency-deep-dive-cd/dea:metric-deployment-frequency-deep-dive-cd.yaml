id: dea:metric-deployment-frequency-deep-dive-cd
name: Deployment Frequency (Deep Dive - CD)
type: Metric
description: Deployment Frequency (Deep Dive - CD) (DFCD-D) measures how efficiently resources are converted
  into outputs in the Continuous Delivery & Deployment domain. It is defined as Production Deployments
  per Week per Team; the result is stated in times per period. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
