id: dea:metric-wafer-fab-cycle-time-deep-dive
name: Wafer Fab Cycle Time (Deep Dive)
type: Metric
description: Wafer Fab Cycle Time (Deep Dive) (WFCT-D) addresses how efficiently resources are converted
  into outputs and is a fixture of semiconductor manufacturing (deep dive) reporting. It is defined as
  Days from Wafer Start to Wafer Out; the result is stated in days. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  In Semiconductors, it is a recognized element of the standard performance toolkit.
