id: dea:metric-whistleblower-report-volume
name: Whistleblower Report Volume
type: Metric
description: 'Whistleblower Report Volume (WRV) captures conformance to standards, plans, or obligations
  for organizations tracking corporate governance. The formula is Reports Received per Period per 1,000
  Employees - reported in events per thousand or million (scaled). It is applied across virtually every
  sector. It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. Values outside the intended band, on either side, warrant investigation.'
