id: dea:metric-first-in-human-success-rate
name: First-in-Human Success Rate
type: Metric
description: First-in-Human Success Rate (FIHS) captures how effectively a process or entity achieves
  its intended outcome for organizations tracking pharma r&d & clinical trials. The formula is Compounds
  Progressing past First-in-Human / Compounds Entering - reported in percent (%). It is a standard measure
  in the Pharmaceuticals sector. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: FIHS
unit: percent
