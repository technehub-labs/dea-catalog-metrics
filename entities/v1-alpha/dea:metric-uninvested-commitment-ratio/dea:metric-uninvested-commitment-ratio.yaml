id: dea:metric-uninvested-commitment-ratio
name: Uninvested Commitment Ratio
type: Metric
description: Uninvested Commitment Ratio (UCR-IM2) measures the utilization or availability of capacity
  in the Investment Management - Portfolio Operations domain. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Uncalled Capital / Total Commitments
  (Private) - reported in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. It is a standard measure in the Financial Services sector.
abbreviation: UCR-IM2
unit: percent
