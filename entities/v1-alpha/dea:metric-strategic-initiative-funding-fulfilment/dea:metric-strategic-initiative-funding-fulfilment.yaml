id: dea:metric-strategic-initiative-funding-fulfilment
name: Strategic Initiative Funding Fulfilment
type: Metric
description: Within Program & Portfolio Management, Strategic Initiative Funding Fulfilment (SIFF) is
  used to gauge the economic value created or preserved. Its calculation is Initiatives Funded as Planned
  / Planned Initiatives, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: SIFF
unit: percent
