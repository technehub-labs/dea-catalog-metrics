id: dea:metric-market-share-growth
name: Market Share Growth
type: Metric
description: A Strategy & Portfolio indicator, Market Share Growth (MSG) quantifies growth over time.
  It is defined as (Market Share_current - Market Share_prior) / Market Share_prior; the result is stated
  in percent (%). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Higher values are better; gains are read as improvement and losses as deterioration. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: MSG
unit: percent
