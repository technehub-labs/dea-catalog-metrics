id: dea:metric-at-risk-learner-intervention-rate
name: At-Risk Learner Intervention Rate
type: Metric
description: 'At-Risk Learner Intervention Rate (ALIR) measures the quality of outputs and outcomes in
  the Education & Training (Deep Dive) domain. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. The formula is At-Risk Learners Receiving Support /
  Identified - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  It is a standard measure in the Education sector.'
