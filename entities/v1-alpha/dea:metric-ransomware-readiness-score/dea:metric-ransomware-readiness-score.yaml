id: dea:metric-ransomware-readiness-score
name: Ransomware Readiness Score
type: Metric
description: Ransomware Readiness Score (RRS-TI) measures exposure to adverse outcomes in the Threat Intelligence
  & Red Team domain. The formula is Composite Score across Tabletop, Recovery and Detection Tests - reported
  in score (points). It is applied across virtually every sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It should be maximized within the limits of
  cost and quality trade-offs.
