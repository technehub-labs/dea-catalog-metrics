id: dea:metric-llm-token-cost-per-resolution
name: LLM Token Cost per Resolution
type: Metric
description: A Generative AI & LLM Operations indicator, LLM Token Cost per Resolution (LLMTCR) quantifies
  how efficiently resources are converted into outputs. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Token and Inference Cost / Resolved
  Interactions; the result is stated in currency per unit. It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
