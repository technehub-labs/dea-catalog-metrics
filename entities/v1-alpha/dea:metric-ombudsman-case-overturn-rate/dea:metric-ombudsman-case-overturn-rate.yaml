id: dea:metric-ombudsman-case-overturn-rate
name: Ombudsman Case Overturn Rate
type: Metric
description: Ombudsman Case Overturn Rate (OCOR) addresses the quality of outputs and outcomes and is
  a fixture of government & public administration reporting. Its calculation is Decisions Overturned on
  Review / Decisions Reviewed, measured in percent (%). It originates from and is most used in Public
  Sector practice. Its value drives prioritization and resource reallocation among competing initiatives.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: OCOR
unit: percent
version: 1.1.0
