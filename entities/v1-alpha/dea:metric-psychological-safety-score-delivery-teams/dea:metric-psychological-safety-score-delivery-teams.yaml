id: dea:metric-psychological-safety-score-delivery-teams
name: Psychological Safety Score - Delivery Teams
type: Metric
description: 'Psychological Safety Score - Delivery Teams (PSS-DT) captures the engagement or satisfaction
  of the people involved for organizations tracking agile delivery & team effectiveness. It is computed
  as Survey-Based Psychological Safety Score, expressed in score (points). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
