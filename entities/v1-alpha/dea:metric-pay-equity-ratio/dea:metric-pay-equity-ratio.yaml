id: dea:metric-pay-equity-ratio
name: Pay Equity Ratio
type: Metric
description: Pay Equity Ratio (PEQ) captures conformance to standards, plans, or obligations for organizations
  tracking diversity, equity & inclusion. It is defined as Median Pay of Comparison Group / Median Pay
  of Reference Group; the result is stated in ratio (x:1 or x). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
