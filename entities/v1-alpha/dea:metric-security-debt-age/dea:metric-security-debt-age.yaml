id: dea:metric-security-debt-age
name: Security Debt Age
type: Metric
description: Within Application Security (AppSec), Security Debt Age (SDA-AS) is used to gauge exposure
  to adverse outcomes. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is computed as Average Age of Open Security Backlog Items, expressed in days. It should
  be driven down, since lower readings signal healthier performance. Its use is concentrated in Software.
