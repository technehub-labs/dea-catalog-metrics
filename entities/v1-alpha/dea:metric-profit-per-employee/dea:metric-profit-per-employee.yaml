id: dea:metric-profit-per-employee
name: Profit per Employee
type: Metric
description: A Human Resources indicator, Profit per Employee (PPE) quantifies the economic value created
  or preserved. Its calculation is Operating Profit / Average Headcount, measured in currency value. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PPE
unit: currency
