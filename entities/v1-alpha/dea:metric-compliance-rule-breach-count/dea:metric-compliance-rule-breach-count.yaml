id: dea:metric-compliance-rule-breach-count
name: Compliance Rule Breach Count
type: Metric
description: Compliance Rule Breach Count (CRBC-IR) captures conformance to standards, plans, or obligations
  for organizations tracking investment risk & middle office operations. The formula is Mandate Rule Breaches
  in Period - reported in count (items per period). It is a standard measure in the Investment management
  sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Reduction is the goal, and sustained decreases indicate successful intervention.
