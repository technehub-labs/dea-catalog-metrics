id: dea:metric-rolling-throughput-yield
name: Rolling Throughput Yield
type: Metric
description: Rolling Throughput Yield (RTY) addresses the quality of outputs and outcomes and is a fixture
  of manufacturing reporting. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Product of First Pass Yield across All Process Steps, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Manufacturing.
abbreviation: RTY
unit: percent
