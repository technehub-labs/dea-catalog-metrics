id: dea:metric-syndication-revenue-share
name: Syndication Revenue Share
type: Metric
description: 'Syndication Revenue Share (SRS-B) addresses the economic value created or preserved and
  is a fixture of broadcasting & streaming media reporting. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as Syndication Revenue /
  Total Revenue, expressed in percent (%). The objective is neither maximization nor minimization but
  staying within an agreed operating band. Its use is concentrated in Media & Entertainment.'
abbreviation: SRS-B
unit: percent
