id: dea:metric-card-fraud-rate-basis-points
name: Card Fraud Rate Basis Points
type: Metric
description: Within Payments & Cards (Deep Dive), Card Fraud Rate Basis Points (CFRB) is used to gauge
  exposure to adverse outcomes. Its calculation is Fraud Value / Transaction Value, measured in events
  per thousand or million (scaled). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Lower values are better; each reduction is an improvement. It originates
  from and is most used in Payments practice.
