id: dea:metric-service-level-objective-attainment-deep-dive
name: Service Level Objective Attainment (Deep Dive)
type: Metric
description: 'Service Level Objective Attainment (Deep Dive) (SLOA) captures the quality of outputs and
  outcomes for organizations tracking sre & observability standard measures. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Windows
  Meeting SLO / Total Windows, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Software.'
abbreviation: SLOA
unit: percent
