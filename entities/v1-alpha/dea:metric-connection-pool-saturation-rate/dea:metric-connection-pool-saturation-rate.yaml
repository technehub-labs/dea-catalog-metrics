id: dea:metric-connection-pool-saturation-rate
name: Connection Pool Saturation Rate
type: Metric
description: 'Connection Pool Saturation Rate (CPSR) addresses the utilization or availability of capacity
  and is a fixture of database & data platform operations reporting. It is defined as Peak Connections
  / Pool Capacity; the result is stated in percent (%). In Software, it is a recognized element of the
  standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. Reduction is the goal, and sustained decreases indicate successful intervention.'
