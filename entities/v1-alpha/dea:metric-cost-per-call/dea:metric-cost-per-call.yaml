id: dea:metric-cost-per-call
name: Cost per Call
type: Metric
description: A Contact Center indicator, Cost per Call (CPC-CC) quantifies how efficiently resources are
  converted into outputs. It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. It is defined as Total Contact Center Cost / Calls Handled; the result is
  stated in currency per unit. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
