id: dea:metric-mandate-transparency-score
name: Mandate Transparency Score
type: Metric
description: 'Within PMO & Portfolio Governance, Mandate Transparency Score (MTS) is used to gauge the
  engagement or satisfaction of the people involved. It is computed as Stakeholder Clarity Rating of Portfolio
  Priorities, expressed in score (points). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
