id: dea:metric-abandonment-rate-contact-center-deep-dive
name: Abandonment Rate (Contact Center Deep Dive)
type: Metric
description: 'Abandonment Rate (Contact Center Deep Dive) (ABDD) addresses the quality of outputs and
  outcomes and is a fixture of contact center standard measures (deep dive) reporting. It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. The formula is Callers Abandoning
  before Answer / Calls Offered - reported in percent (%). It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
