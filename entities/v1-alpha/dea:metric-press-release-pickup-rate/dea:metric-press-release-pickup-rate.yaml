id: dea:metric-press-release-pickup-rate
name: Press Release Pickup Rate
type: Metric
description: Press Release Pickup Rate (PRPR) measures how effectively a process or entity achieves its
  intended outcome in the Corporate Communications & PR domain. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Outlets Publishing Release
  / Outlets Targeted, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PRPR
unit: percent
