id: dea:metric-placement-retention-at-90-days
name: Placement Retention at 90 Days
type: Metric
description: Placement Retention at 90 Days (PR90) measures the quality of outputs and outcomes in the
  Staffing & Recruiting domain. It is defined as Placements Retained at 90 Days / Placements Made; the
  result is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  In Staffing & recruiting, it is a recognized element of the standard performance toolkit.
