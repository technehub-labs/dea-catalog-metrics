id: dea:metric-power-usage-effectiveness
name: Power Usage Effectiveness
type: Metric
description: Power Usage Effectiveness (PUE) captures how efficiently resources are converted into outputs
  for organizations tracking data center & cloud operations. It is defined as Total Facility Power / IT
  Equipment Power; the result is stated in ratio (x:1 or x). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  In Technology & data centers, it is a recognized element of the standard performance toolkit.
abbreviation: PUE
