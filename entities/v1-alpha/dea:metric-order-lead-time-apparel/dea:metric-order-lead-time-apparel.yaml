id: dea:metric-order-lead-time-apparel
name: Order Lead Time (Apparel)
type: Metric
description: A Textile & Apparel indicator, Order Lead Time (Apparel) (OLT-A) quantifies how efficiently
  resources are converted into outputs. The formula is Days from Order Confirmation to Shipment - reported
  in days. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Lower values are better; each reduction is an improvement. It is a standard measure in the Textile &
  apparel sector.
