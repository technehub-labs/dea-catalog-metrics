id: dea:metric-robot-mean-time-between-failures
name: Robot Mean Time between Failures
type: Metric
description: 'Within Industrial Automation & Robotics, Robot Mean Time between Failures (RMTBF) is used
  to gauge exposure to adverse outcomes. The formula is Robot Operating Time / Robot Failures - reported
  in hours. It guides mid-horizon planning: portfolio, program, and function owners act on it between
  review cycles. Higher values are better; gains are read as improvement and losses as deterioration.
  It is a standard measure in the Manufacturing sector.'
