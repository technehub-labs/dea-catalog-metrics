id: dea:metric-claims-expense-ratio
name: Claims Expense Ratio
type: Metric
description: 'Within Insurance Claims Deep Dive, Claims Expense Ratio (CER) is used to gauge how efficiently
  resources are converted into outputs. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Claims Handling Expenses / Earned Premium,
  expressed in percent (%). It should be driven down, since lower readings signal healthier performance.
  Its use is concentrated in Insurance.'
