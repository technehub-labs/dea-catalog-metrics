id: dea:metric-technical-dispatch-reliability
name: Technical Dispatch Reliability
type: Metric
description: 'Technical Dispatch Reliability (TDR) captures the quality of outputs and outcomes for organizations
  tracking airlines & aviation. The formula is Departures without Technical Delay or Cancellation / Total
  Departures - reported in percent (%). It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Higher values are better; gains are read as improvement and losses as deterioration.
  It is a standard measure in the Airlines & aviation sector.'
