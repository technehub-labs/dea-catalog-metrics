id: dea:metric-internal-rate-of-return-fund-level-deep-dive
name: Internal Rate of Return - Fund Level (Deep Dive)
type: Metric
description: Internal Rate of Return - Fund Level (Deep Dive) (FIRR-D) captures the economic value created
  or preserved for organizations tracking investment management - portfolio operations. Its calculation
  is Fund Cash Flow IRR, measured in percent (%). It originates from and is most used in Financial Services
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
