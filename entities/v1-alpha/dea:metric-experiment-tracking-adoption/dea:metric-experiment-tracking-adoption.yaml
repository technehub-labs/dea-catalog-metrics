id: dea:metric-experiment-tracking-adoption
name: Experiment Tracking Adoption
type: Metric
description: Experiment Tracking Adoption (ETA-M) captures the quality of outputs and outcomes for organizations
  tracking mlops & model lifecycle operations. Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. It is computed as Experiments Logged in Tracking System
  / Experiments, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: ETA-M
unit: percent
