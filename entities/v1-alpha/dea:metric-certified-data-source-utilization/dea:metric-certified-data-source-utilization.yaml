id: dea:metric-certified-data-source-utilization
name: Certified Data Source Utilization
type: Metric
description: 'Within Data Science & Analytics Operations, Certified Data Source Utilization (CDSU) is
  used to gauge the quality of outputs and outcomes. It is computed as Analyses Using Certified Sources
  / Analyses, expressed in percent (%). It is applied across virtually every sector. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
