id: dea:metric-data-access-request-fulfilment-time
name: Data Access Request Fulfilment Time
type: Metric
description: 'Data Access Request Fulfilment Time (DARFT) measures how efficiently resources are converted
  into outputs in the Data Governance & Stewardship domain. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Days to Fulfil Approved Data Access Request;
  the result is stated in days. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
abbreviation: DARFT
unit: day
