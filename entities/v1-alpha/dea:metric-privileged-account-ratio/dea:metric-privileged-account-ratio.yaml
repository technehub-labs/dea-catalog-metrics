id: dea:metric-privileged-account-ratio
name: Privileged Account Ratio
type: Metric
description: A Identity & Access Management Operations indicator, Privileged Account Ratio (PAR-IAM) quantifies
  exposure to adverse outcomes. The formula is Privileged Accounts / Total Accounts - reported in percent
  (%). It is applied across virtually every sector. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases indicate
  successful intervention.
