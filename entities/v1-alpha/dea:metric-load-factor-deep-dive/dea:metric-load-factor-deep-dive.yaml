calculation_definition: Revenue Passenger Kilometres / Available Seat Kilometres
formula_definition:
  formula_id: dea:formula-load-factor-deep-dive
  expression: LF-D = Revenue Passenger Kilometres / Available Seat Kilometres
  inputs:
