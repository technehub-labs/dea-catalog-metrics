id: dea:metric-load-factor-deep-dive
name: Load Factor (Deep Dive)
type: Metric
description: 'Load Factor (Deep Dive) (LF-D) captures the utilization or availability of capacity for
  organizations tracking airline operations (deep dive). It is computed as Revenue Passenger Kilometres
  / Available Seat Kilometres, expressed in percent (%). Its use is concentrated in Airlines. It is a
  headline indicator: movement in it prompts leadership questions about strategy and resourcing. It should
  be maximized within the limits of cost and quality trade-offs.'
abbreviation: LF-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
