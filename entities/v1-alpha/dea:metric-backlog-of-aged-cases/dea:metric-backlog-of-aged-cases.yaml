id: dea:metric-backlog-of-aged-cases
name: Backlog of Aged Cases
type: Metric
description: Backlog of Aged Cases (BAC) measures the utilization or availability of capacity in the Customer
  domain. Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  It is computed as Open Cases Older than Threshold Age, expressed in count (items per period). It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
