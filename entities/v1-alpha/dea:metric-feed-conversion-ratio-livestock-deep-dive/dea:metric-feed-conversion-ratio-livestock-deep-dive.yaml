id: dea:metric-feed-conversion-ratio-livestock-deep-dive
name: Feed Conversion Ratio - Livestock (Deep Dive)
type: Metric
description: Feed Conversion Ratio - Livestock (Deep Dive) (FCR-D) captures how efficiently resources
  are converted into outputs for organizations tracking agriculture & agronomy (deep dive). It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. The formula
  is Feed Consumed / Weight Gain - reported in ratio (x:1 or x). It should be driven down, since lower
  readings signal healthier performance. It is a standard measure in the Agriculture sector.
