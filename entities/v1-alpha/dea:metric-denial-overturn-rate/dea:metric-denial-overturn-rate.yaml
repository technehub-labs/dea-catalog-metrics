id: dea:metric-denial-overturn-rate
name: Denial Overturn Rate
type: Metric
description: Denial Overturn Rate (DOR) addresses how effectively a process or entity achieves its intended
  outcome and is a fixture of healthcare revenue cycle reporting. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Denials Reversed on Appeal
  / Denials Appealed, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Healthcare.
abbreviation: DOR
unit: percent
