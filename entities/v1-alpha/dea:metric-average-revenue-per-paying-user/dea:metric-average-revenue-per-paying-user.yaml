id: dea:metric-average-revenue-per-paying-user
name: Average Revenue per Paying User
type: Metric
description: Within Gaming, Average Revenue per Paying User (ARPPU) is used to gauge the economic value
  created or preserved. The formula is Revenue / Paying Users - reported in currency per unit. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Higher values
  are better; gains are read as improvement and losses as deterioration. It is a standard measure in the
  Gaming sector.
