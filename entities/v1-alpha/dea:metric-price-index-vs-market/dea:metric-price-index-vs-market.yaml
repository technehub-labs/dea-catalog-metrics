id: dea:metric-price-index-vs-market
name: Price Index vs Market
type: Metric
description: Price Index vs Market (PIM) addresses the economic value created or preserved and is a fixture
  of retail & e-commerce reporting. It is computed as Average Selling Price / Market Average Price, expressed
  in ratio (x:1 or x). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is managed toward a defined target band rather than an extreme - both overshoot and undershoot
  can signal problems. Its use is concentrated in Retail.
abbreviation: PIM
unit: ratio
