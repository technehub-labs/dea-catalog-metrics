id: dea:metric-ore-grade
name: Ore Grade
type: Metric
description: Ore Grade (OG) measures the quality of outputs and outcomes in the Mining & Metals domain.
  Its calculation is Metal Content / Ore Extracted, measured in percent (%). It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Higher values are better;
  gains are read as improvement and losses as deterioration. It originates from and is most used in Mining
  & metals practice.
