id: dea:metric-code-review-turnaround
name: Code Review Turnaround
type: Metric
description: 'Code Review Turnaround (CRT) captures how efficiently resources are converted into outputs
  for organizations tracking software engineering. The formula is Median Time from Pull Request to Review
  Completion - reported in hours. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
