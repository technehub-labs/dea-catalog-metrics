id: dea:metric-accessibility-conformance-wcag
name: Accessibility Conformance (WCAG)
type: Metric
description: Accessibility Conformance (WCAG) (ACW) addresses conformance to standards, plans, or obligations
  and is a fixture of digital product & web operations reporting. It is defined as Criteria Passed / Applicable
  WCAG Criteria; the result is stated in percent (%). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
