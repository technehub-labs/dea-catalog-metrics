id: dea:metric-client-repeat-engagement-rate
name: Client Repeat Engagement Rate
type: Metric
description: A Staffing & Recruiting indicator, Client Repeat Engagement Rate (CRER) quantifies the retention
  of customers, users, or assets over time. Its calculation is Clients with Repeat Mandates / Clients
  Served, measured in percent (%). It originates from and is most used in Staffing & recruiting practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CRER
unit: percent
