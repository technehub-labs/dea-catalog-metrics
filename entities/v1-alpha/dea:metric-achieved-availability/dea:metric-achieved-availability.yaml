id: dea:metric-achieved-availability
name: Achieved Availability
type: Metric
description: Achieved Availability (ACAVL) addresses the quality of outputs and outcomes and is a fixture
  of reliability & maintainability engineering (deep dive) reporting. It is defined as MTBMA / (MTBMA
  + MMTRS); the result is stated in percent (%). It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: ACAVL
unit: percent
