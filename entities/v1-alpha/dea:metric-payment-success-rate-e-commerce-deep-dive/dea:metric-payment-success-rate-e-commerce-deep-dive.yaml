id: dea:metric-payment-success-rate-e-commerce-deep-dive
name: Payment Success Rate (E-commerce Deep Dive)
type: Metric
description: Payment Success Rate (E-commerce Deep Dive) (PSR-D) measures the quality of outputs and outcomes
  in the Payments & Cards (Deep Dive) domain. The formula is Settled Payments / Initiated Payments - reported
  in percent (%). It is a standard measure in the Payments sector. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. It should be maximized within the
  limits of cost and quality trade-offs.
