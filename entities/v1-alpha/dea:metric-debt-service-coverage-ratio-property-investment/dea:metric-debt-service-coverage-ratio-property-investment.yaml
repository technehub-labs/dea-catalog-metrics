id: dea:metric-debt-service-coverage-ratio-property-investment
name: Debt Service Coverage Ratio (Property Investment)
type: Metric
description: 'Debt Service Coverage Ratio (Property Investment) (DSCRPR) captures exposure to adverse
  outcomes for organizations tracking real estate & mortgage standard measures. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Net Operating
  Income / Annual Debt Service, expressed in ratio (x:1 or x). Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Real estate.'
