id: dea:metric-reactant-conversion-rate
name: Reactant Conversion Rate
type: Metric
description: Reactant Conversion Rate (RCTR) measures how efficiently resources are converted into outputs
  in the Chemicals domain. It is computed as Reactant Converted to Product / Reactant Fed, expressed in
  percent (%). Its use is concentrated in Chemicals. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. It should be maximized within the limits of cost and
  quality trade-offs.
abbreviation: RCTR
unit: percent
