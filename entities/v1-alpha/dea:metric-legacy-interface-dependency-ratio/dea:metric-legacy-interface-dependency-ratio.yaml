id: dea:metric-legacy-interface-dependency-ratio
name: Legacy Interface Dependency Ratio
type: Metric
description: Legacy Interface Dependency Ratio (LIDR-SA) measures exposure to adverse outcomes in the
  Software Architecture & Technical Design domain. It is defined as Calls to Legacy Systems / Total External
  Calls; the result is stated in percent (%). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Lower values are better; each reduction is an improvement. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: LIDR-SA
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
