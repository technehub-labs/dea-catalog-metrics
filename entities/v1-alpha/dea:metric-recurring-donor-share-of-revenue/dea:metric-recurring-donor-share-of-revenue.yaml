id: dea:metric-recurring-donor-share-of-revenue
name: Recurring Donor Share of Revenue
type: Metric
description: Recurring Donor Share of Revenue (RDSR-N) measures the economic value created or preserved
  in the Nonprofit & Donor Operations (Deep Dive) domain. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Recurring Gift Revenue
  / Total Donations, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Nonprofit practice.
abbreviation: RDSR-N
unit: percent
version: 1.1.0
