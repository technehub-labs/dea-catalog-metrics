id: dea:metric-assumed-breach-success-rate
name: Assumed Breach Success Rate
type: Metric
description: Assumed Breach Success Rate (ABSR) addresses exposure to adverse outcomes and is a fixture
  of threat intelligence & red team reporting. It is defined as Objectives Achieved by Red Team / Objectives;
  the result is stated in percent (%). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Reduction is the goal, and
  sustained decreases indicate successful intervention.
