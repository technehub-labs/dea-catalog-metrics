id: dea:metric-cost-reduction-program-realization
name: Cost Reduction Program Realization
type: Metric
description: 'A Product Costing & Margin Management indicator, Cost Reduction Program Realization (CRPR)
  quantifies the economic value created or preserved. It is computed as Realized Cost Reductions / Committed
  Reductions, expressed in percent (%). It is applied across virtually every sector. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
