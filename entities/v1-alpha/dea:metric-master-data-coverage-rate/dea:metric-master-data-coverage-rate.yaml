id: dea:metric-master-data-coverage-rate
name: Master Data Coverage Rate
type: Metric
description: A Master Data Management indicator, Master Data Coverage Rate (MDCR) quantifies capability
  maturity or development. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Entities Managed under MDM / Identified Master Entities; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
