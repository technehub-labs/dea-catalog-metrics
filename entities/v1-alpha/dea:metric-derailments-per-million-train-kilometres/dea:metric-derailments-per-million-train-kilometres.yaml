id: dea:metric-derailments-per-million-train-kilometres
name: Derailments per Million Train Kilometres
type: Metric
description: 'A Rail Transport indicator, Derailments per Million Train Kilometres (DPMT) quantifies exposure
  to adverse outcomes. It is computed as Derailments / Train Kilometres x 1,000,000, expressed in events
  per thousand or million (scaled). Its use is concentrated in Rail. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
