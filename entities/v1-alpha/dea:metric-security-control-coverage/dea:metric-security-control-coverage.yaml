id: dea:metric-security-control-coverage
name: Security Control Coverage
type: Metric
description: Security Control Coverage (SCC) measures conformance to standards, plans, or obligations
  in the Cybersecurity domain. The formula is Implemented Controls / Required Controls per Framework -
  reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
