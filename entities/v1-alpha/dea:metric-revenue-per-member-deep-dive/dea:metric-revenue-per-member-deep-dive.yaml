id: dea:metric-revenue-per-member-deep-dive
name: Revenue per Member (Deep Dive)
type: Metric
description: 'Within Fitness & Wellness (Deep Dive), Revenue per Member (Deep Dive) (RPM-D) is used to
  gauge the economic value created or preserved. It is computed as Total Revenue / Active Members, expressed
  in currency per unit. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Health & Fitness.'
