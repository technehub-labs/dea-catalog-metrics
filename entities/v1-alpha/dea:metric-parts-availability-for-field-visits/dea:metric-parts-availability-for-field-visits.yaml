id: dea:metric-parts-availability-for-field-visits
name: Parts Availability for Field Visits
type: Metric
description: Within Field Maintenance & Technical Field Service (Deep Dive), Parts Availability for Field
  Visits (PAFFV) is used to gauge the utilization or availability of capacity. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It is computed as Jobs
  Completed without Parts Stockout / Jobs, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PAFFV
unit: percent
