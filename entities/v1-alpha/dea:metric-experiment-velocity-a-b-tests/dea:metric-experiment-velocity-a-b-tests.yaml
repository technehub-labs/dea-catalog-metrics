id: dea:metric-experiment-velocity-a-b-tests
name: Experiment Velocity (A/B Tests)
type: Metric
description: Experiment Velocity (A/B Tests) (EXV) captures capability maturity or development for organizations
  tracking digital product & web operations. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. It is defined as Experiments Concluded with Decision per
  Period; the result is stated in count (items per period). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
