id: dea:metric-resilience-stress-test-pass-rate
name: Resilience Stress Test Pass Rate
type: Metric
description: 'A Business Resilience & Continuity indicator, Resilience Stress Test Pass Rate (RSTP) quantifies
  exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Stress Scenarios Passed / Scenarios Executed, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.'
abbreviation: RSTP
unit: percent
version: 1.1.0
lifecycle_status: candidate
