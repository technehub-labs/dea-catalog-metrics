id: dea:metric-free-trade-agreement-utilization
name: Free Trade Agreement Utilization
type: Metric
description: Free Trade Agreement Utilization (FTAU) addresses the economic value created or preserved
  and is a fixture of international trade & customs reporting. It is defined as Preferential Entries Claimed
  / Eligible Entries; the result is stated in percent (%). In Logistics & Trade, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: FTAU
unit: percent
