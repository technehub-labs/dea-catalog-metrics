id: dea:metric-model-documentation-sufficiency-score
name: Model Documentation Sufficiency Score
type: Metric
description: Model Documentation Sufficiency Score (MDSS) addresses the quality of outputs and outcomes
  and is a fixture of ai governance & model risk management reporting. Its calculation is Documentation
  Items Complete / Required per Policy, measured in percent (%). It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: MDSS
unit: percent
