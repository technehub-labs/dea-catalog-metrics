id: dea:metric-recurring-incident-ratio
name: Recurring Incident Ratio
type: Metric
description: A IT Incident & Major Problem Management indicator, Recurring Incident Ratio (RIR-IT) quantifies
  the quality of outputs and outcomes. It is defined as Incidents Repeating within 30 Days / Incidents;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Lower values are better; each reduction is an improvement. Its use is
  not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: RIR-IT
