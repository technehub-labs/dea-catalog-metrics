id: dea:metric-service-activation-time
name: Service Activation Time
type: Metric
description: A Telecommunications indicator, Service Activation Time (SAT) quantifies how efficiently
  resources are converted into outputs. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Days from Order to Service Activation; the result
  is stated in days. It should be driven down, since lower readings signal healthier performance. In Telecommunications,
  it is a recognized element of the standard performance toolkit.
