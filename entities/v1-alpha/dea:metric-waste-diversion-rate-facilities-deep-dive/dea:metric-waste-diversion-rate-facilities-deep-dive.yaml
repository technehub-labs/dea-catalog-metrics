description: A Facility Management & Workplace (Deep Dive) indicator, Waste Diversion Rate (Facilities
  Deep Dive) (WDR-D) quantifies environmental and social sustainability performance. Its calculation is
  Diverted Waste / Total Waste, measured in percent (%). It is applied across virtually every sector.
  Its value drives prioritization and resource reallocation among competing initiatives. It should be
  maximized within the limits of cost and quality trade-offs.
