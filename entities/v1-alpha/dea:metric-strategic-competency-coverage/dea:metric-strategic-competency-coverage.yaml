id: dea:metric-strategic-competency-coverage
name: Strategic Competency Coverage
type: Metric
description: Strategic Competency Coverage (SCC-BSC) addresses capability maturity or development and
  is a fixture of balanced scorecard - learning & growth perspective reporting. The formula is Roles with
  Required Competencies Filled / Strategic Roles - reported in percent (%). It is applied across virtually
  every sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: SCC-BSC
unit: percent
