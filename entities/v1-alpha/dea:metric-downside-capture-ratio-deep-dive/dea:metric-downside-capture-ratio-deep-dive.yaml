id: dea:metric-downside-capture-ratio-deep-dive
name: Downside Capture Ratio (Deep Dive)
type: Metric
description: Downside Capture Ratio (Deep Dive) (DCR-IM) measures exposure to adverse outcomes in the
  Investment Management - Portfolio Operations domain. The formula is Fund Downside Return / Benchmark
  Downside Return - reported in ratio (x:1 or x). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Financial Services sector.
