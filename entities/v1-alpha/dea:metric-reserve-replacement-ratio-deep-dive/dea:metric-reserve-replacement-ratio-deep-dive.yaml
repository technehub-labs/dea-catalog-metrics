name: Reserve Replacement Ratio (Deep Dive)
type: Metric
description: 'Reserve Replacement Ratio (Deep Dive) (RRR-M) measures growth over time in the Metals &
  Mining Operations (Deep Dive) domain. It is computed as New Reserves Added / Reserves Depleted, expressed
  in ratio (x:1 or x). Its use is concentrated in Metals & Mining. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It should be maximized within the
  limits of cost and quality trade-offs.'
