id: dea:metric-mdm-cost-per-million-records
name: MDM Cost per Million Records
type: Metric
description: MDM Cost per Million Records (MDMCPR) measures how efficiently resources are converted into
  outputs in the Master Data Management domain. It is computed as Annual MDM Spend / Records in Millions,
  expressed in currency per unit. It is applied across virtually every sector. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: MDMCPR
