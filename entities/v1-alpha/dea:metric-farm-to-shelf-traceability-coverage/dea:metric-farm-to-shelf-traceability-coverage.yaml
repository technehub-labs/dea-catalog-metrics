id: dea:metric-farm-to-shelf-traceability-coverage
name: Farm-to-Shelf Traceability Coverage
type: Metric
description: 'Within Agriculture & Food Processing, Farm-to-Shelf Traceability Coverage (FSTC) is used
  to gauge conformance to standards, plans, or obligations. It is computed as Batches with Full Traceability
  Records / Batches, expressed in percent (%). Its use is concentrated in Agriculture & food. It is a
  headline indicator: movement in it prompts leadership questions about strategy and resourcing. It should
  be maximized within the limits of cost and quality trade-offs.'
