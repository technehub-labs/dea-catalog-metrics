id: dea:metric-semantic-layer-coverage
name: Semantic Layer Coverage
type: Metric
description: Semantic Layer Coverage (SLC-DS) addresses capability maturity or development and is a fixture
  of data science & analytics operations reporting. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Metrics Defined in Semantic
  Layer / Total Governed Metrics, measured in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
