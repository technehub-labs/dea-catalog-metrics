id: dea:metric-supplier-ppm-automotive-deep-dive
name: Supplier PPM - Automotive (Deep Dive)
type: Metric
description: Supplier PPM - Automotive (Deep Dive) (SPPM-D) captures the quality of outputs and outcomes
  for organizations tracking automotive manufacturing (deep dive). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Defective Parts per Million Received;
  the result is stated in events per thousand or million (scaled). It should be driven down, since lower
  readings signal healthier performance. In Automotive, it is a recognized element of the standard performance
  toolkit.
