id: dea:metric-vessel-emissions-efficiency
name: Vessel Emissions Efficiency
type: Metric
description: Vessel Emissions Efficiency (VEE) measures environmental and social sustainability performance
  in the Maritime & Shipping domain. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is CO2e Emitted / Tonne-Nautical Mile - reported in ratio
  (x:1 or x). It should be driven down, since lower readings signal healthier performance. It is a standard
  measure in the Maritime & shipping sector.
