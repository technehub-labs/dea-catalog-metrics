id: dea:metric-architecture-decision-record-coverage
name: Architecture Decision Record Coverage
type: Metric
description: Architecture Decision Record Coverage (ADRC) captures conformance to standards, plans, or
  obligations for organizations tracking software architecture & technical design. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Material
  Decisions with ADRs / Material Decisions; the result is stated in percent (%). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
