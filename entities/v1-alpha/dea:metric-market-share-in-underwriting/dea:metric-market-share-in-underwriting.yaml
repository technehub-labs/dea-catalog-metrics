id: dea:metric-market-share-in-underwriting
name: Market Share in Underwriting
type: Metric
description: 'Market Share in Underwriting (MSU) captures growth over time for organizations tracking
  investment banking & capital markets. It is computed as Firm Underwritten Volume / Total Market Volume,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Investment banking.'
abbreviation: MSU
unit: percent
