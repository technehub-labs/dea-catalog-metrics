id: dea:metric-dependency-freshness-ratio
name: Dependency Freshness Ratio
type: Metric
description: 'Dependency Freshness Ratio (DFR-CQ) captures exposure to adverse outcomes for organizations
  tracking code quality & static analysis. It is monitored close to the work: teams act on it within a
  shift, sprint, or daily review. The formula is Dependencies within One Major of Latest / Dependencies
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. It is
  a standard measure in the Software sector.'
