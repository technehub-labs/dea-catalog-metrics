name: Catastrophe Claims Response Time
type: Metric
description: A Claims Operations (Insurance) indicator, Catastrophe Claims Response Time (CCRT) quantifies
  conformance to standards, plans, or obligations. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Days from Catastrophe Event to First
  Claim Payment - reported in days. It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Insurance sector.
