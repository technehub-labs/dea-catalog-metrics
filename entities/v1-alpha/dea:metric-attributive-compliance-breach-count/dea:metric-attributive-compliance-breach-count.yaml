id: dea:metric-attributive-compliance-breach-count
name: Attributive Compliance Breach Count
type: Metric
description: Attributive Compliance Breach Count (ACBC) measures exposure to adverse outcomes in the Compliance
  Monitoring & Testing domain. It is defined as Notifiable Breaches in Period; the result is stated in
  count (items per period). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
