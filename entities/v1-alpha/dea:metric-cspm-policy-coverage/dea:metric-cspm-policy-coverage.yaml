id: dea:metric-cspm-policy-coverage
name: CSPM Policy Coverage
type: Metric
description: CSPM Policy Coverage (CSPMC) addresses conformance to standards, plans, or obligations and
  is a fixture of cloud security posture management reporting. The formula is Enforced Policies / Framework-Mapped
  Policies - reported in percent (%). It is applied across virtually every sector. It carries weight in
  boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: CSPMC
unit: percent
