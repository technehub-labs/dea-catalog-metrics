id: dea:metric-irregular-operations-recovery-time
name: Irregular Operations Recovery Time
type: Metric
description: Irregular Operations Recovery Time (IROPR) captures how efficiently resources are converted
  into outputs for organizations tracking airline operations (deep dive). Its calculation is Minutes to
  Restore Schedule after Disruption, measured in minutes. Its value drives prioritization and resource
  reallocation among competing initiatives. Lower values are better; each reduction is an improvement.
  It originates from and is most used in Airlines practice.
