id: dea:metric-line-yield-deep-dive
name: Line Yield (Deep Dive)
type: Metric
description: 'A Semiconductor Manufacturing (Deep Dive) indicator, Line Yield (Deep Dive) (LYL-D) quantifies
  the quality of outputs and outcomes. It is computed as Wafers Completed / Wafers Started, expressed
  in percent (%). Its use is concentrated in Semiconductors. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It should be maximized within the limits
  of cost and quality trade-offs.'
abbreviation: LYL-D
unit: percent
