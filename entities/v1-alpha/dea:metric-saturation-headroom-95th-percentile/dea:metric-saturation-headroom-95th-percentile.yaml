name: Saturation Headroom - 95th Percentile
type: Metric
description: 'Saturation Headroom - 95th Percentile (SH95) captures the utilization or availability of
  capacity for organizations tracking observability & site reliability engineering. It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. The formula is 95th Percentile
  Resource Utilization - reported in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
