id: dea:metric-recovery-rate-fraud-losses
name: Recovery Rate (Fraud Losses)
type: Metric
description: Recovery Rate (Fraud Losses) (RRFL) measures the economic value created or preserved in the
  Enterprise Fraud & Financial Crime Management domain. Its calculation is Fraud Losses Recovered / Total
  Fraud Losses, measured in percent (%). It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: RRFL
unit: percent
