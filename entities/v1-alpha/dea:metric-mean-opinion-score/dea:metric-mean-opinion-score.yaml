id: dea:metric-mean-opinion-score
name: Mean Opinion Score
type: Metric
description: Mean Opinion Score (MOS) captures the quality of outputs and outcomes for organizations tracking
  telecommunications. Its calculation is Average Subjective Voice or Video Quality Rating, measured in
  score (points). It originates from and is most used in Telecommunications practice. Its value drives
  prioritization and resource reallocation among competing initiatives. It should be maximized within
  the limits of cost and quality trade-offs.
