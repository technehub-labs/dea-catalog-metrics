id: dea:metric-capacity-decision-cycle-time
name: Capacity Decision Cycle Time
type: Metric
description: Capacity Decision Cycle Time (CDCT-S) addresses how efficiently resources are converted into
  outputs and is a fixture of sales & operations planning reporting. Its calculation is Days to Resolve
  Identified Capacity Gap, measured in days. It is applied across virtually every sector. Its value drives
  prioritization and resource reallocation among competing initiatives. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: CDCT-S
