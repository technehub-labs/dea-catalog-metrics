id: dea:metric-kilo-of-product-per-labor-hour
name: Kilo of Product per Labor Hour
type: Metric
description: A Food & Beverage Manufacturing indicator, Kilo of Product per Labor Hour (KPPLH) quantifies
  how efficiently resources are converted into outputs. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It is computed as Output Kilograms / Labor Hours, expressed
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Food & Beverage.
