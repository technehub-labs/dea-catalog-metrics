id: dea:metric-red-team-containment-time
name: Red Team Containment Time
type: Metric
description: Within Threat Intelligence & Red Team, Red Team Containment Time (RTCT) is used to gauge
  exposure to adverse outcomes. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Time for Defenders to Contain Simulated Intrusion - reported
  in hours. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
