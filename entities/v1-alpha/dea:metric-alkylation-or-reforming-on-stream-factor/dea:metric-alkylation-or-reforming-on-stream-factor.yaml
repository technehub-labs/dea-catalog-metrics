id: dea:metric-alkylation-or-reforming-on-stream-factor
name: Alkylation or Reforming On-Stream Factor
type: Metric
description: Alkylation or Reforming On-Stream Factor (AOSF) captures the utilization or availability
  of capacity for organizations tracking oil & gas downstream & refining. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Unit Operating Time / Calendar
  Time, measured in percent (%). Improvement means raising this figure toward best-in-class levels. It
  originates from and is most used in Oil & Gas practice.
