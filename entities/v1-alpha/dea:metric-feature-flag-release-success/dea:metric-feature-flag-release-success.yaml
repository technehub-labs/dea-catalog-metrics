id: dea:metric-feature-flag-release-success
name: Feature Flag Release Success
type: Metric
description: 'Feature Flag Release Success (FFRS) addresses the quality of outputs and outcomes and is
  a fixture of digital product & web operations reporting. It is defined as Features Released without
  Rollback / Features Released; the result is stated in percent (%). It is a working-level control: thresholds
  trigger immediate operational response. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
