id: dea:metric-community-grievance-resolution-time
name: Community Grievance Resolution Time
type: Metric
description: Community Grievance Resolution Time (CGRT) captures conformance to standards, plans, or obligations
  for organizations tracking mining & metals. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. It is defined as Days from Grievance Filed to Resolution;
  the result is stated in days. It should be driven down, since lower readings signal healthier performance.
  In Mining & metals, it is a recognized element of the standard performance toolkit.
abbreviation: CGRT
unit: day
