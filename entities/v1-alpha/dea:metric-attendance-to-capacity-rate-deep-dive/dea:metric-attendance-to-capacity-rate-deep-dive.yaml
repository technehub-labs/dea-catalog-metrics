id: dea:metric-attendance-to-capacity-rate-deep-dive
name: Attendance-to-Capacity Rate (Deep Dive)
type: Metric
description: Attendance-to-Capacity Rate (Deep Dive) (ATC-D) captures the utilization or availability
  of capacity for organizations tracking sports clubs & leagues (deep dive). It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Tickets
  Sold / Stadium Capacity, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Sports practice.
abbreviation: ATC-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
