id: dea:metric-youth-academy-progression-rate
name: Youth Academy Progression Rate
type: Metric
description: 'Youth Academy Progression Rate (YAPR) addresses capability maturity or development and is
  a fixture of sports clubs & leagues (deep dive) reporting. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as Academy Players to First
  Team / Intake Cohort, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Sports.'
abbreviation: YAPR
unit: percent
