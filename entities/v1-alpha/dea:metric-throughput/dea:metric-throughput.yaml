id: dea:metric-throughput
name: Throughput
type: Metric
description: Within Operations, Throughput (THR) is used to gauge the utilization or availability of capacity.
  It is computed as Units Produced or Served per Period, expressed in count (items per period). It is
  applied across virtually every sector. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It should be maximized within the limits of cost and quality
  trade-offs.
