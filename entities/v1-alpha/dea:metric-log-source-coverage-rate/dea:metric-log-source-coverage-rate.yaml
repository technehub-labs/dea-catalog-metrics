id: dea:metric-log-source-coverage-rate
name: Log Source Coverage Rate
type: Metric
description: Log Source Coverage Rate (LSCR-SOC) captures capability maturity or development for organizations
  tracking secops & security operations center. The formula is Required Log Sources Onboarded / Required
  - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. Its
