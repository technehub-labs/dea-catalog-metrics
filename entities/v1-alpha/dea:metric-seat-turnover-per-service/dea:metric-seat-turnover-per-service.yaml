id: dea:metric-seat-turnover-per-service
name: Seat Turnover per Service
type: Metric
description: A Restaurants indicator, Seat Turnover per Service (STPS) quantifies the utilization or availability
  of capacity. Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. It is computed as Guests Served / Seats per Service Period, expressed in ratio (x:1 or x).
  Improvement means raising this figure toward best-in-class levels. Its use is concentrated in Restaurants.
abbreviation: STPS
unit: ratio
