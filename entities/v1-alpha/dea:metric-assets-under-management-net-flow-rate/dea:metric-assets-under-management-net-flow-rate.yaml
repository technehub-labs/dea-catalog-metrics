id: dea:metric-assets-under-management-net-flow-rate
name: Assets Under Management Net Flow Rate
type: Metric
description: Assets Under Management Net Flow Rate (AUMNF) addresses growth over time and is a fixture
  of asset & wealth management (deep dive) reporting. The formula is Net New Flows / Opening AUM - reported
  in percent (%). It is a standard measure in the Financial Services sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: AUMNF
unit: percent
