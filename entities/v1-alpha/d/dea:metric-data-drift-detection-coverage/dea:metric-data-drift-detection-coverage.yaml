id: dea:metric-data-drift-detection-coverage
name: Data Drift Detection Coverage
type: Metric
description: Data Drift Detection Coverage (DDDC) measures exposure to adverse outcomes in the MLOps &
  Model Lifecycle Operations domain. It is defined as Monitored Features with Drift Checks / Features;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DDDC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- risk
scope_classification:
