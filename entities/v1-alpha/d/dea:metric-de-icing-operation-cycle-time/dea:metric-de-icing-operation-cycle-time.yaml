id: dea:metric-de-icing-operation-cycle-time
name: De-Icing Operation Cycle Time
type: Metric
description: 'A Airport Operations indicator, De-Icing Operation Cycle Time (DIO) quantifies how efficiently
  resources are converted into outputs. It is a working-level control: thresholds trigger immediate operational
  response. It is defined as Minutes to De-Ice Aircraft; the result is stated in minutes. It should be
  driven down, since lower readings signal healthier performance. In Airports, it is a recognized element
  of the standard performance toolkit.'
abbreviation: DIO
unit: minute
