id: dea:metric-daily-cash-forecast-accuracy-deep-dive
name: Daily Cash Forecast Accuracy (Deep Dive)
type: Metric
description: Daily Cash Forecast Accuracy (Deep Dive) (DCFA-D) addresses the quality of outputs and outcomes
  and is a fixture of corporate treasury (deep dive) reporting. Its calculation is 1 - Absolute Forecast
  Error / Actual Cash, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: DCFA-D
unit: percent
