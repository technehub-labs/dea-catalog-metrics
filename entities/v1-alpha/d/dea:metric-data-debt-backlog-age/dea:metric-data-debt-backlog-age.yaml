id: dea:metric-data-debt-backlog-age
name: Data Debt Backlog Age
type: Metric
description: Data Debt Backlog Age (DDBA) captures how efficiently resources are converted into outputs
  for organizations tracking data governance & stewardship. Its value drives prioritization and resource
  reallocation among competing initiatives. Its calculation is Average Age of Open Data Governance Backlog
  Items, measured in days. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
