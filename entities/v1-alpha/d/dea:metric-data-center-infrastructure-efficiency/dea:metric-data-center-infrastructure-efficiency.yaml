id: dea:metric-data-center-infrastructure-efficiency
name: Data Center Infrastructure Efficiency
type: Metric
description: Data Center Infrastructure Efficiency (DCIE) captures how efficiently resources are converted
  into outputs for organizations tracking data center & cloud operations. Its calculation is IT Equipment
  Power / Total Facility Power, measured in percent (%). It originates from and is most used in Technology
  & data centers practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DCIE
unit: percent
