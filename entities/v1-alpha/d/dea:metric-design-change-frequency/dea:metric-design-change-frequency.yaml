id: dea:metric-design-change-frequency
name: Design Change Frequency
type: Metric
description: A Construction & Engineering indicator, Design Change Frequency (DCF) quantifies exposure
  to adverse outcomes. It is computed as Design Changes Issued / Drawing Packages Released, expressed
  in ratio (x:1 or x). Its use is concentrated in Construction & engineering. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: DCF
unit: ratio
