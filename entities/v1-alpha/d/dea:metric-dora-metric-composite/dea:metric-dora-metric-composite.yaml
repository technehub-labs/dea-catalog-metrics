id: dea:metric-dora-metric-composite
name: DORA Metric Composite
type: Metric
description: Within Software Engineering, DORA Metric Composite (DORA) is used to gauge how effectively
  a process or entity achieves its intended outcome. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Index of Deployment Frequency,
  Lead Time, Change Failure, MTTRS, measured in index (0-100 or normalized). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
