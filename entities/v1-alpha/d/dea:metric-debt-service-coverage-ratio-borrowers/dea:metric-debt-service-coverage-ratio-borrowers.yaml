id: dea:metric-debt-service-coverage-ratio-borrowers
name: Debt Service Coverage Ratio (Borrowers)
type: Metric
description: 'A Retail Banking & Lending indicator, Debt Service Coverage Ratio (Borrowers) (DSCR) quantifies
  exposure to adverse outcomes. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. The formula is Net Operating Income / Debt Service Obligations - reported
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Banking sector.'
abbreviation: DSCR
unit: ratio
