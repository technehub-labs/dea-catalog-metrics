id: dea:metric-delegated-decision-utilization
name: Delegated Decision Utilization
type: Metric
description: Delegated Decision Utilization (DDU) addresses capability maturity or development and is
  a fixture of operating model & decision effectiveness reporting. The formula is Decisions Taken at Delegated
  Level / Decisions Eligible - reported in percent (%). It is applied across virtually every sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: DDU
unit: percent
