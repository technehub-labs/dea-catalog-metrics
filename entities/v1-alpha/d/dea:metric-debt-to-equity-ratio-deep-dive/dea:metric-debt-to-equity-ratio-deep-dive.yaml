id: dea:metric-debt-to-equity-ratio-deep-dive
name: Debt-to-Equity Ratio (Deep Dive)
type: Metric
description: Debt-to-Equity Ratio (Deep Dive) (DERDD) captures exposure to adverse outcomes for organizations
  tracking financial statement analysis ratios (deep dive). Its calculation is Total Debt / Total Equity,
  measured in ratio (x:1 or x). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Values outside the intended
  band, on either side, warrant investigation.
