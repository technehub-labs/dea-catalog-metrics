id: dea:metric-discrimination-complaint-resolution-time
name: Discrimination Complaint Resolution Time
type: Metric
description: 'Discrimination Complaint Resolution Time (DCRT) addresses conformance to standards, plans,
  or obligations and is a fixture of diversity, equity & inclusion reporting. The formula is Days from
  Complaint Filed to Case Closure - reported in days. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
