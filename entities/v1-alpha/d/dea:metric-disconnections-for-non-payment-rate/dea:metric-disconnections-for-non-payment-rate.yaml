id: dea:metric-disconnections-for-non-payment-rate
name: Disconnections for Non-Payment Rate
type: Metric
description: Disconnections for Non-Payment Rate (DNP) captures exposure to adverse outcomes for organizations
  tracking utilities customer operations. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Disconnections / Customer Accounts, expressed in percent
  (%). It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Utilities.
abbreviation: DNP
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
