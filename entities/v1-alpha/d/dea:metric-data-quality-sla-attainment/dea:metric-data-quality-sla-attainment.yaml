id: dea:metric-data-quality-sla-attainment
name: Data Quality SLA Attainment
type: Metric
description: Data Quality SLA Attainment (DQSLA) captures the quality of outputs and outcomes for organizations
  tracking data quality management. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Datasets Meeting Quality SLA / Datasets Monitored, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: DQSLA
unit: percent
version: 1.1.0
