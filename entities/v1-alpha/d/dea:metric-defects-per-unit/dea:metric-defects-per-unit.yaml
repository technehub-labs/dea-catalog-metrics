id: dea:metric-defects-per-unit
name: Defects per Unit
type: Metric
description: Defects per Unit (DPU) addresses the quality of outputs and outcomes and is a fixture of
  quality management reporting. It provides the day-to-day signal that a process is running as designed.
  Its calculation is Total Defects / Total Units, measured in ratio (x:1 or x). It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.
abbreviation: DPU
unit: ratio
