id: dea:metric-direct-channel-loss-ratio
name: Direct Channel Loss Ratio
type: Metric
description: 'Direct Channel Loss Ratio (DCLR) addresses exposure to adverse outcomes and is a fixture
  of insurance distribution - direct & digital reporting. It is computed as Direct Channel Claims / Direct
  Premium, expressed in percent (%). Its use is concentrated in Insurance. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Values outside the intended
  band, on either side, warrant investigation.'
abbreviation: DCLR
unit: percent
