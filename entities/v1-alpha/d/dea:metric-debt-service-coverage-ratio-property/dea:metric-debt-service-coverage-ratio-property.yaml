id: dea:metric-debt-service-coverage-ratio-property
name: Debt Service Coverage Ratio (Property)
type: Metric
description: A Real Estate Portfolio & Property Management indicator, Debt Service Coverage Ratio (Property)
  (DSCR-P) quantifies exposure to adverse outcomes. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Net Operating Income /
  Debt Service, measured in ratio (x:1 or x). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Real Estate practice.
abbreviation: DSCR-P
unit: ratio
