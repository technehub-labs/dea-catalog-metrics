id: dea:metric-defect-rate-per-hundred-garments
name: Defect Rate per Hundred Garments
type: Metric
description: 'Defect Rate per Hundred Garments (DRHG) captures the quality of outputs and outcomes for
  organizations tracking textile & apparel. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Defects Found / Garments Inspected x 100 - reported
  in ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance. It
  is a standard measure in the Textile & apparel sector.'
abbreviation: DRHG
unit: ratio
version: 1.1.0
