id: dea:metric-delinquency-rate-30-days
name: Delinquency Rate (30+ Days)
type: Metric
description: Delinquency Rate (30+ Days) (DEL30) measures exposure to adverse outcomes in the Retail Banking
  & Lending domain. The formula is Loans 30+ Days Past Due / Gross Loans - reported in percent (%). It
  is a standard measure in the Banking sector. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases indicate successful
  intervention.
abbreviation: DEL30
unit: percent
