id: dea:metric-decision-right-first-time-rate
name: Decision Right First Time Rate
type: Metric
description: Within Enterprise Decision Effectiveness & Governance Monitoring, Decision Right First Time
  Rate (DRFT) is used to gauge the quality of outputs and outcomes. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Decisions Not Revisited
  or Reversed within Year / Decisions - reported in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: DRFT
unit: percent
