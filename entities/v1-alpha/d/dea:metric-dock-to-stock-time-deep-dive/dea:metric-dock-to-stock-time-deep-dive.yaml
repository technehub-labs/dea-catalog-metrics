id: dea:metric-dock-to-stock-time-deep-dive
name: Dock-to-Stock Time (Deep Dive)
type: Metric
description: 'Dock-to-Stock Time (Deep Dive) (D2ST) measures how efficiently resources are converted into
  outputs in the Supply Chain Standard Measures (Deep Dive) domain. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Hours from Receipt to Saleable Inventory; the
  result is stated in hours. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
abbreviation: D2ST
unit: hour
