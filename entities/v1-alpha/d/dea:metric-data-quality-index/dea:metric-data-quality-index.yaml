id: dea:metric-data-quality-index
name: Data Quality Index
type: Metric
description: Data Quality Index (DQI) measures the quality of outputs and outcomes in the Data Management
  & Analytics domain. The formula is Weighted Index of Completeness, Accuracy, Timeliness, Consistency
  - reported in index (0-100 or normalized). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
