id: dea:metric-dormant-account-closure-rate
name: Dormant Account Closure Rate
type: Metric
description: 'Dormant Account Closure Rate (DACR-IAM) measures exposure to adverse outcomes in the Identity
  & Access Management Operations domain. The formula is Dormant Accounts Disabled per Policy / Detected
  - reported in percent (%). It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: DACR-IAM
