id: dea:metric-device-survival-rate
name: Device Survival Rate
type: Metric
description: Device Survival Rate (DSR) captures the quality of outputs and outcomes for organizations
  tracking medical devices. It is defined as Devices Functioning at Time Point / Devices Implanted; the
  result is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  In Medical devices, it is a recognized element of the standard performance toolkit.
abbreviation: DSR
unit: percent
