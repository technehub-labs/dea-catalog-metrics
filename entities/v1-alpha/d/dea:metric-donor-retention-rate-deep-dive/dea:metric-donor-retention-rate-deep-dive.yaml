id: dea:metric-donor-retention-rate-deep-dive
name: Donor Retention Rate (Deep Dive)
type: Metric
description: Within Nonprofit & Donor Operations (Deep Dive), Donor Retention Rate (Deep Dive) (DRR-D)
  is used to gauge the retention of customers, users, or assets over time. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Donors
  Giving Again / Prior Donors, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Nonprofit practice.
abbreviation: DRR-D
unit: percent
