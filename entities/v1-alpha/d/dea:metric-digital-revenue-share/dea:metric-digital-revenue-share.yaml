id: dea:metric-digital-revenue-share
name: Digital Revenue Share
type: Metric
description: A Digital Transformation indicator, Digital Revenue Share (DRS) quantifies growth over time.
  The formula is Digitally Originated Revenue / Total Revenue - reported in percent (%). It is applied
  across virtually every sector. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DRS
unit: percent
