id: dea:metric-delegation-of-authority-compliance-clm
name: Delegation of Authority Compliance (CLM)
type: Metric
description: 'A Contract Lifecycle Management indicator, Delegation of Authority Compliance (CLM) (DOAC-CL)
  quantifies conformance to standards, plans, or obligations. It is computed as Contracts Signed per Authority
  Matrix / Contracts Sampled, expressed in percent (%). It is applied across virtually every sector. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: DOAC-CL
unit: percent
