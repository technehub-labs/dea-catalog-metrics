id: dea:metric-donor-lifetime-value
name: Donor Lifetime Value
type: Metric
description: A Nonprofit & NGO indicator, Donor Lifetime Value (DLTV) quantifies the economic value created
  or preserved. It is defined as Average Donation x Average Donor Lifespan x Margin; the result is stated
  in currency value. In Nonprofit & NGO, it is a recognized element of the standard performance toolkit.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: DLTV
unit: currency
