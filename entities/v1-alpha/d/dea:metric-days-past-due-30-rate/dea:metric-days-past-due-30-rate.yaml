id: dea:metric-days-past-due-30-rate
name: Days Past Due 30+ Rate
type: Metric
description: 'Days Past Due 30+ Rate (DPD30) captures exposure to adverse outcomes for organizations tracking
  credit & collections risk (enterprise). The formula is Accounts 30+ Days Past Due / Active Accounts
  - reported in percent (%). It is applied across virtually every sector. It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
abbreviation: DPD30
unit: percent
