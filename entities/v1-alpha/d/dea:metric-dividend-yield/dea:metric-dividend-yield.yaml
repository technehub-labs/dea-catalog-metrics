id: dea:metric-dividend-yield
name: Dividend Yield
type: Metric
description: Dividend Yield (DIVY) captures the economic value created or preserved for organizations
  tracking investor relations & capital markets. It is defined as Annual Dividend per Share / Share Price;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It is managed toward a defined target band rather than an extreme - both
  overshoot and undershoot can signal problems. In Listed companies, it is a recognized element of the
  standard performance toolkit.
abbreviation: DIVY
unit: percent
version: 1.1.0
lifecycle_status: candidate
