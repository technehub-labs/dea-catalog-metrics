id: dea:metric-data-retention-policy-compliance
name: Data Retention Policy Compliance
type: Metric
description: Within Database & Data Platform Operations, Data Retention Policy Compliance (DRPC) is used
  to gauge conformance to standards, plans, or obligations. Its calculation is Stores Compliant with Retention
  Schedule / Stores, measured in percent (%). Its value drives prioritization and resource reallocation
  among competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Software practice.
abbreviation: DRPC
unit: percent
