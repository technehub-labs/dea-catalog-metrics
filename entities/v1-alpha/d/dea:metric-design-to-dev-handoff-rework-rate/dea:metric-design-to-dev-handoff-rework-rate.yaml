id: dea:metric-design-to-dev-handoff-rework-rate
name: Design-to-Dev Handoff Rework Rate
type: Metric
description: Design-to-Dev Handoff Rework Rate (DHR-UX) addresses the quality of outputs and outcomes
  and is a fixture of ux & design systems reporting. It is computed as Handoffs Requiring Redesign / Handoffs,
  expressed in percent (%). It is applied across virtually every sector. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: DHR-UX
unit: percent
