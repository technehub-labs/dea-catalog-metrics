id: dea:metric-digital-identity-adoption-rate
name: Digital Identity Adoption Rate
type: Metric
description: 'Digital Identity Adoption Rate (DIA) addresses capability maturity or development and is
  a fixture of government & public administration reporting. It is computed as Citizens Using National
  Digital Identity / Eligible Citizens, expressed in percent (%). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is concentrated in Public Sector.'
abbreviation: DIA
unit: percent
version: 1.1.0
