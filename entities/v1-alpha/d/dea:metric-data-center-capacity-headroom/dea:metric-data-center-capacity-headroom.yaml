id: dea:metric-data-center-capacity-headroom
name: Data Center Capacity Headroom
type: Metric
description: Data Center Capacity Headroom (DCCH) captures the utilization or availability of capacity
  for organizations tracking data center & cloud operations. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as (Design Capacity - Peak Load)
  / Design Capacity; the result is stated in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. In Technology & data centers, it is a recognized element
  of the standard performance toolkit.
abbreviation: DCCH
unit: percent
