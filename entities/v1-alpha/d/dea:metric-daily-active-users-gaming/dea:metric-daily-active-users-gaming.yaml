id: dea:metric-daily-active-users-gaming
name: Daily Active Users (Gaming)
type: Metric
description: Daily Active Users (Gaming) (DAU-G) captures the engagement or satisfaction of the people
  involved for organizations tracking gaming. Its calculation is Unique Players Active per Day, measured
  in count (items per period). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. It originates from and is most used in Gaming practice.
abbreviation: DAU-G
