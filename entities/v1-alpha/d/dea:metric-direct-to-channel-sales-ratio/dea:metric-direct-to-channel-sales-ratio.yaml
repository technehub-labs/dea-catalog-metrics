id: dea:metric-direct-to-channel-sales-ratio
name: Direct-to-Channel Sales Ratio
type: Metric
description: A Channel & Distribution Management indicator, Direct-to-Channel Sales Ratio (DCSR) quantifies
  strategy. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It is defined as Direct Sales / Channel Sales; the result is stated in ratio (x:1 or x). The objective
  is neither maximization nor minimization but staying within an agreed operating band. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: DCSR
