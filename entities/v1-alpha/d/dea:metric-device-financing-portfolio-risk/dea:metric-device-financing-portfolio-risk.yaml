id: dea:metric-device-financing-portfolio-risk
name: Device Financing Portfolio Risk
type: Metric
description: 'Within Telecom Product & Bundle Management, Device Financing Portfolio Risk (DFPR) is used
  to gauge exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Financing Balances Past Due / Total Financing
  Balances, expressed in percent (%). It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Telecommunications.'
abbreviation: DFPR
unit: percent
