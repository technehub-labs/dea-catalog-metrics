id: dea:metric-deployment-automation-rate
name: Deployment Automation Rate
type: Metric
description: 'Deployment Automation Rate (DAR-CD) measures capability maturity or development in the Continuous
  Delivery & Deployment domain. It is computed as Deployments Executed Fully Automatically / Deployments,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: DAR-CD
unit: percent
