id: dea:metric-data-restoration-success-rate
name: Data Restoration Success Rate
type: Metric
description: Within Business Continuity & Disaster Recovery, Data Restoration Success Rate (DRSR) is used
  to gauge exposure to adverse outcomes. Its calculation is Restores Verified Complete and Correct / Restore
  Attempts, measured in percent (%). It is applied across virtually every sector. It provides the day-to-day
  signal that a process is running as designed. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: DRSR
unit: percent
