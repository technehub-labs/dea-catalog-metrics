id: dea:metric-deal-closure-cycle-time
name: Deal Closure Cycle Time
type: Metric
description: Deal Closure Cycle Time (DCCT) addresses how efficiently resources are converted into outputs
  and is a fixture of investment banking & capital markets reporting. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Days from Mandate to Completion;
  the result is stated in days. It should be driven down, since lower readings signal healthier performance.
  In Investment banking, it is a recognized element of the standard performance toolkit.
abbreviation: DCCT
unit: day
