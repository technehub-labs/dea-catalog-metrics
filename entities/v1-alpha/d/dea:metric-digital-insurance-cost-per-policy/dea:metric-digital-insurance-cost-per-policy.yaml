id: dea:metric-digital-insurance-cost-per-policy
name: Digital Insurance Cost per Policy
type: Metric
description: 'Digital Insurance Cost per Policy (DICPP) addresses how efficiently resources are converted
  into outputs and is a fixture of insurance distribution - direct & digital reporting. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Digital Channel Cost / Policies, expressed in currency value. It should be driven down, since lower
  readings signal healthier performance. Its use is concentrated in Insurance.'
