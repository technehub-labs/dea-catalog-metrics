id: dea:metric-debt-to-equity-deep-dive
name: Debt to Equity (Deep Dive)
type: Metric
description: 'A Balanced Scorecard - Financial Perspective indicator, Debt to Equity (Deep Dive) (DTE-D)
  quantifies exposure to adverse outcomes. It is computed as Total Debt / Total Equity, expressed in ratio
  (x:1 or x). It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. It is managed toward a defined target band rather than an extreme - both overshoot and undershoot
  can signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: DTE-D
unit: ratio
