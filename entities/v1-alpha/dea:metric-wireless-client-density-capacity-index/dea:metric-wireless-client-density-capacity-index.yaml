id: dea:metric-wireless-client-density-capacity-index
name: Wireless Client Density Capacity Index
type: Metric
description: 'Wireless Client Density Capacity Index (WCDI) measures the utilization or availability of
  capacity in the Network Performance & Capacity domain. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. The formula is Concurrent Clients per AP vs Design Threshold
  - reported in index (0-100 or normalized). The objective is neither maximization nor minimization but
  staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
