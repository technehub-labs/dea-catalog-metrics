id: dea:metric-operational-disruption-loss-value
name: Operational Disruption Loss Value
type: Metric
description: Operational Disruption Loss Value (ODLV) measures exposure to adverse outcomes in the Business
  Resilience & Continuity domain. The formula is Financial Impact of Disruptions per Period - reported
  in currency value. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
