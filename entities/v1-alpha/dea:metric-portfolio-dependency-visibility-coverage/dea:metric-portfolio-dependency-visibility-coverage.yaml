id: dea:metric-portfolio-dependency-visibility-coverage
name: Portfolio Dependency Visibility Coverage
type: Metric
description: Within Program & Portfolio Management, Portfolio Dependency Visibility Coverage (PDVC) is
  used to gauge exposure to adverse outcomes. Its calculation is Initiatives with Mapped Dependencies
  / Initiatives, measured in percent (%). It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
