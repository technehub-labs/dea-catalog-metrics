id: dea:metric-planned-maintenance-percentage
name: Planned Maintenance Percentage
type: Metric
description: A Maintenance & Reliability indicator, Planned Maintenance Percentage (PMP) quantifies exposure
  to adverse outcomes. The formula is Planned Maintenance Hours / Total Maintenance Hours - reported in
  percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Manufacturing sector.
abbreviation: PMP
unit: percent
