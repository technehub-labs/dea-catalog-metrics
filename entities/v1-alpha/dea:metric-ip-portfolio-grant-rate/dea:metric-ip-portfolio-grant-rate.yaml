id: dea:metric-ip-portfolio-grant-rate
name: IP Portfolio Grant Rate
type: Metric
description: A Legal indicator, IP Portfolio Grant Rate (IPGR) quantifies how effectively a process or
  entity achieves its intended outcome. Its calculation is Granted IP Applications / Applications Filed,
  measured in percent (%). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
