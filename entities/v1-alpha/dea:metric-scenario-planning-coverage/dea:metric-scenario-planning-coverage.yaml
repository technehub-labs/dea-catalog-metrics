  & Operations Planning domain. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. The formula is Plans with Documented Demand Scenarios / Plans - reported
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.'
