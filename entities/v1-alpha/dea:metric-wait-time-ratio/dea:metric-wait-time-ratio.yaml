id: dea:metric-wait-time-ratio
name: Wait Time Ratio
type: Metric
description: 'Wait Time Ratio (WTR) addresses how efficiently resources are converted into outputs and
  is a fixture of process excellence (lean six sigma) reporting. The formula is Waiting Time / Total Process
  Lead Time - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Lower values are better; each reduction is an improvement. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: WTR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
