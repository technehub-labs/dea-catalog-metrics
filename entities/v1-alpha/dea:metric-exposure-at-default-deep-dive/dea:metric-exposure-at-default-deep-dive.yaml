id: dea:metric-exposure-at-default-deep-dive
name: Exposure at Default (Deep Dive)
type: Metric
description: 'Exposure at Default (Deep Dive) (EADDD) measures exposure to adverse outcomes in the Credit
  & Collections Risk (Enterprise) domain. It is computed as Outstanding Balance plus Undrawn Commitment
  at Default, expressed in currency value. It is applied across virtually every sector. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Reduction is the
  goal, and sustained decreases indicate successful intervention.'
