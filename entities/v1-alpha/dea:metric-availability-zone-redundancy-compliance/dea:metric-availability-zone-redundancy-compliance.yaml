id: dea:metric-availability-zone-redundancy-compliance
name: Availability Zone Redundancy Compliance
type: Metric
description: Availability Zone Redundancy Compliance (AZRC) measures exposure to adverse outcomes in the
  Observability & Site Reliability Engineering domain. The formula is Services Meeting Redundancy Standard
  / Services - reported in percent (%). It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
