id: dea:metric-employee-engagement-score-trend-deep-dive
name: Employee Engagement Score Trend (Deep Dive)
type: Metric
description: Employee Engagement Score Trend (Deep Dive) (EEST-D) measures the engagement or satisfaction
  of the people involved in the Balanced Scorecard - Learning & Growth Perspective domain. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Its
  calculation is Change in Engagement Score between Periods, measured in score (points). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: EEST-D
