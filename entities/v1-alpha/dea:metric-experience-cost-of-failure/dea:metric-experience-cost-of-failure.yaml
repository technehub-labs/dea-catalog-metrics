id: dea:metric-experience-cost-of-failure
name: Experience Cost of Failure
type: Metric
description: Within Customer Journey & Experience, Experience Cost of Failure (ECF) is used to gauge the
  economic value created or preserved. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Cost of Rework, Credits, and Recovery per Failed Experience,
  expressed in currency per unit. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: ECF
unit: currency
