id: dea:metric-support-ticket-volume-per-100-users
name: Support Ticket Volume per 100 Users
type: Metric
description: 'Within Software Product Operations (Deep Dive), Support Ticket Volume per 100 Users (STV100)
  is used to gauge the quality of outputs and outcomes. The formula is Tickets / 100 Active Users - reported
  in events per thousand or million (scaled). It is a standard measure in the Technology sector. It is
  monitored close to the work: teams act on it within a shift, sprint, or daily review. Reduction is the
  goal, and sustained decreases indicate successful intervention.'
