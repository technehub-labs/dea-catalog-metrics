id: dea:metric-representative-data-coverage
name: Representative Data Coverage
type: Metric
description: A AI Ethics, Fairness & Responsible AI indicator, Representative Data Coverage (RDC-AI) quantifies
  the quality of outputs and outcomes. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Population Segments Adequately Represented in
  Data / Segments - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: RDC-AI
