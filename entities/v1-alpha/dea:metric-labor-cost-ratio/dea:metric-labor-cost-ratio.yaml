id: dea:metric-labor-cost-ratio
name: Labor Cost Ratio
type: Metric
description: Within Human Resources, Labor Cost Ratio (LCR) is used to gauge how efficiently resources
  are converted into outputs. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Total Labor Cost / Revenue; the result is stated in percent (%).
  The objective is neither maximization nor minimization but staying within an agreed operating band.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: LCR
unit: percent
