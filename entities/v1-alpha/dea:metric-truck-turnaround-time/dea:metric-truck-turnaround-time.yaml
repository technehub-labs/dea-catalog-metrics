id: dea:metric-truck-turnaround-time
name: Truck Turnaround Time
type: Metric
description: Truck Turnaround Time (TTT) measures how efficiently resources are converted into outputs
  in the Logistics & Transportation domain. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It is computed as Hours from Arrival to Departure at Facility,
  expressed in hours. It should be driven down, since lower readings signal healthier performance. Its
  use is concentrated in Logistics.
