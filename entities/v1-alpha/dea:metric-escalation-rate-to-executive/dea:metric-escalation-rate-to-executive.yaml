id: dea:metric-escalation-rate-to-executive
name: Escalation Rate to Executive
type: Metric
description: Escalation Rate to Executive (ERE) measures how efficiently resources are converted into
  outputs in the Operating Model & Decision Effectiveness domain. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It is defined as Decisions Escalated to
  Executive Level / Decisions Raised; the result is stated in percent (%). It should be driven down, since
  lower readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: ERE
unit: percent
version: 1.1.0
lifecycle_status: candidate
