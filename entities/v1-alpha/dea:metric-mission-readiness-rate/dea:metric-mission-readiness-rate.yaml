id: dea:metric-mission-readiness-rate
name: Mission Readiness Rate
type: Metric
description: 'Mission Readiness Rate (MRR) addresses the utilization or availability of capacity and is
  a fixture of aerospace & defense program management reporting. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Assets Ready for
  Mission / Assigned Assets, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Aerospace & Defense.'
abbreviation: MRR
unit: percent
