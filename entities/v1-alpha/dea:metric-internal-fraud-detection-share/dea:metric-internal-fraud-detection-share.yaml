id: dea:metric-internal-fraud-detection-share
name: Internal Fraud Detection Share
type: Metric
description: A Enterprise Fraud & Financial Crime Management indicator, Internal Fraud Detection Share
  (IFDS) quantifies exposure to adverse outcomes. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Frauds Detected via Internal Controls
  / All Detected Frauds, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: IFDS
unit: percent
