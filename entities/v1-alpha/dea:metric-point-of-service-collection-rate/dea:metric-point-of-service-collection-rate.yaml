id: dea:metric-point-of-service-collection-rate
name: Point-of-Service Collection Rate
type: Metric
description: Within Healthcare Revenue Cycle, Point-of-Service Collection Rate (POSC) is used to gauge
  the economic value created or preserved. It is computed as Patient Payments Collected at Service / Patient
  Payments Due, expressed in percent (%). Its use is concentrated in Healthcare. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. It should be maximized within the
  limits of cost and quality trade-offs.
