id: dea:metric-workforce-diversity-representation-by-level
name: Workforce Diversity Representation by Level
type: Metric
description: Workforce Diversity Representation by Level (WDRL) captures conformance to standards, plans,
  or obligations for organizations tracking diversity, equity & inclusion. Its calculation is Underrepresented
  Group Members at Level / Total at Level, measured in percent (%). It is applied across virtually every
  sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: WDRL
unit: percent
version: 1.1.0
