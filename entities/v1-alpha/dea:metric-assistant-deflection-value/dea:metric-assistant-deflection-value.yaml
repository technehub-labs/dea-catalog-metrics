id: dea:metric-assistant-deflection-value
name: Assistant Deflection Value
type: Metric
description: Assistant Deflection Value (ADV-LLM) measures the economic value created or preserved in
  the Generative AI & LLM Operations domain. It is defined as Human Contact Cost Avoided by AI Resolution;
  the result is stated in currency value. It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
