id: dea:metric-invoice-touchless-processing-rate
name: Invoice Touchless Processing Rate
type: Metric
description: Invoice Touchless Processing Rate (ITPR) captures how efficiently resources are converted
  into outputs for organizations tracking accounts payable & receivable operations (deep dive). It is
  computed as Invoices Processed without Manual Intervention / Invoices, expressed in percent (%). It
  is applied across virtually every sector. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: ITPR
unit: percent
