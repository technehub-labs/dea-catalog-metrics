id: dea:metric-biodiversity-impact-index
name: Biodiversity Impact Index
type: Metric
description: Within Sustainability & ESG, Biodiversity Impact Index (BII) is used to gauge environmental
  and social sustainability performance. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Measured Land or Habitat Impact per Operations
  - reported in index (0-100 or normalized). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
