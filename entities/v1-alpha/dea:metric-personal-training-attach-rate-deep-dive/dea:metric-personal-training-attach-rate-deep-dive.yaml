id: dea:metric-personal-training-attach-rate-deep-dive
name: Personal Training Attach Rate (Deep Dive)
type: Metric
description: Personal Training Attach Rate (Deep Dive) (PTAR-D) captures growth over time for organizations
  tracking fitness & wellness (deep dive). It is computed as Members with PT Sessions / Members, expressed
  in percent (%). Its use is concentrated in Health & Fitness. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It should be maximized within the limits of cost and
  quality trade-offs.
abbreviation: PTAR-D
unit: percent
