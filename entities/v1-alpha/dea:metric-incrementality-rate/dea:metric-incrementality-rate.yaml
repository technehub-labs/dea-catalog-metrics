id: dea:metric-incrementality-rate
name: Incrementality Rate
type: Metric
description: Within Marketing Attribution & Analytics, Incrementality Rate (INCR) is used to gauge the
  economic value created or preserved. It is defined as Incremental Conversions from Test vs Control /
  Test Conversions; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: INCR
unit: percent
version: 1.1.0
