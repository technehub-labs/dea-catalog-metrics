id: dea:metric-calibration-slope
name: Calibration Slope
type: Metric
description: Calibration Slope (CALS) captures the quality of outputs and outcomes for organizations tracking
  statistical model performance diagnostics. Its calculation is Slope of Observed vs Predicted Probability
  Fit, measured in ratio (x:1 or x). It provides the day-to-day signal that a process is running as designed.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. It originates from and is most used in Software practice.
