id: dea:metric-customer-lifetime-value-trend-deep-dive
name: Customer Lifetime Value Trend (Deep Dive)
type: Metric
description: 'Customer Lifetime Value Trend (Deep Dive) (CLVT-D) measures the economic value created or
  preserved in the Balanced Scorecard - Customer Perspective domain. It is computed as Change in CLV between
  Periods, expressed in currency value. It is applied across virtually every sector. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
