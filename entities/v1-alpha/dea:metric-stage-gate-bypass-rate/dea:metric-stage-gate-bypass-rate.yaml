id: dea:metric-stage-gate-bypass-rate
name: Stage Gate Bypass Rate
type: Metric
description: Within Program & Portfolio Management, Stage Gate Bypass Rate (SGBR-PPM) is used to gauge
  conformance to standards, plans, or obligations. Its calculation is Gates Approved with Exceptions or
  Waivers / Gates, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
