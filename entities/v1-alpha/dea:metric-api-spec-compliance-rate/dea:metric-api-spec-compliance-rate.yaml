id: dea:metric-api-spec-compliance-rate
name: API Spec Compliance Rate
type: Metric
description: API Spec Compliance Rate (APISC) captures conformance to standards, plans, or obligations
  for organizations tracking api lifecycle management. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Implementations Matching Published
  Spec / Endpoints Tested, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Software.
abbreviation: APISC
unit: percent
