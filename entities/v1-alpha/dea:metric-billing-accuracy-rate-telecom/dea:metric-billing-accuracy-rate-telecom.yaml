id: dea:metric-billing-accuracy-rate-telecom
name: Billing Accuracy Rate (Telecom)
type: Metric
description: A Telecom Customer Experience & Billing indicator, Billing Accuracy Rate (Telecom) (BART)
  quantifies the quality of outputs and outcomes. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Bills Issued without Dispute or Correction
  / Bills Issued; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Telecommunications, it is a recognized element of the standard performance toolkit.
