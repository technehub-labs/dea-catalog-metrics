id: dea:metric-returns-processing-time
name: Returns Processing Time
type: Metric
description: Returns Processing Time (RPT) captures how efficiently resources are converted into outputs
  for organizations tracking warehousing. Its calculation is Days from Return Receipt to Restock or Disposition,
  measured in days. It provides the day-to-day signal that a process is running as designed. Lower values
  are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
