type: Metric
description: Model Validation Currency (Investment) (MVCI) addresses conformance to standards, plans,
  or obligations and is a fixture of investment risk & middle office operations reporting. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Its
  calculation is Pricing and Risk Models Validated within Cycle / Due, measured in percent (%). Improvement
  means raising this figure toward best-in-class levels. It originates from and is most used in Investment
  management practice.
