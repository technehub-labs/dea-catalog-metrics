id: dea:metric-non-revenue-water
name: Non-Revenue Water
type: Metric
description: Non-Revenue Water (NRW) measures how efficiently resources are converted into outputs in
  the Energy & Utilities domain. The formula is Water Lost / Water Supplied - reported in percent (%).
  It is a standard measure in the Energy & utilities sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: NRW
unit: percent
