id: dea:metric-alternate-site-readiness
name: Alternate Site Readiness
type: Metric
description: 'Alternate Site Readiness (ASR-B) measures conformance to standards, plans, or obligations
  in the Business Resilience & Continuity domain. The formula is Alternate Sites Ready and Tested / Required
  Alternate Sites - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
