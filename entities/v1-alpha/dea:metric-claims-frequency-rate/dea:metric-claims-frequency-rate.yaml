id: dea:metric-claims-frequency-rate
name: Claims Frequency Rate
type: Metric
description: Claims Frequency Rate (CFR-C) measures exposure to adverse outcomes in the Claims Operations
  (Insurance) domain. Its calculation is Claims Filed / Policies In Force, measured in ratio (x:1 or x).
  It originates from and is most used in Insurance practice. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and sustained
  decreases indicate successful intervention.
