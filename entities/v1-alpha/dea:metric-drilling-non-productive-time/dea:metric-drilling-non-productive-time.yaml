id: dea:metric-drilling-non-productive-time
name: Drilling Non-Productive Time
type: Metric
description: 'A Oil & Gas indicator, Drilling Non-Productive Time (NPT) quantifies how efficiently resources
  are converted into outputs. The formula is Non-Productive Drilling Hours / Total Drilling Hours - reported
  in percent (%). It is a standard measure in the Oil & gas sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
abbreviation: NPT
unit: percent
