id: dea:metric-app-battery-consumption-index
name: App Battery Consumption Index
type: Metric
description: 'App Battery Consumption Index (ABCI) captures the quality of outputs and outcomes for organizations
  tracking mobile & client development. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Battery Drain per Hour of Active Use vs Category Benchmark -
  reported in index (0-100 or normalized). It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Software sector.'
