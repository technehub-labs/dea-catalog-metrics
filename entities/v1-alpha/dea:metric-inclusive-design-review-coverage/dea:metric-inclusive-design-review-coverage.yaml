id: dea:metric-inclusive-design-review-coverage
name: Inclusive Design Review Coverage
type: Metric
description: Inclusive Design Review Coverage (IDRC) addresses conformance to standards, plans, or obligations
  and is a fixture of ux & design systems reporting. It is computed as Features Passing Inclusive Design
  Review / Features, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: IDRC
unit: percent
