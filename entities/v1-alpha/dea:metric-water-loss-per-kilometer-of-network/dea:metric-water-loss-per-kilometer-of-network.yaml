id: dea:metric-water-loss-per-kilometer-of-network
name: Water Loss per Kilometer of Network
type: Metric
description: Water Loss per Kilometer of Network (WLK) addresses how efficiently resources are converted
  into outputs and is a fixture of energy & utilities reporting. It is defined as Volume of Water Lost
  / Network Length; the result is stated in ratio (x:1 or x). It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Lower values are better; each reduction
  is an improvement. In Energy & utilities, it is a recognized element of the standard performance toolkit.
abbreviation: WLK
