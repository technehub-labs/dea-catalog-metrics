id: dea:metric-privacy-training-completion-rate
name: Privacy Training Completion Rate
type: Metric
description: Privacy Training Completion Rate (PTCR) captures conformance to standards, plans, or obligations
  for organizations tracking data privacy & protection. It is computed as Staff Completing Privacy Training
  by Due Date / Staff, expressed in percent (%). It is applied across virtually every sector. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: PTCR
unit: percent
