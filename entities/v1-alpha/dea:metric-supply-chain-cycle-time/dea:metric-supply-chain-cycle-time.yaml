id: dea:metric-supply-chain-cycle-time
name: Supply Chain Cycle Time
type: Metric
description: Supply Chain Cycle Time (SCCT) captures how efficiently resources are converted into outputs
  for organizations tracking supply chain. The formula is Days to Fulfill Order with Zero Inventory -
  reported in days. It is applied across virtually every sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases
  indicate successful intervention.
