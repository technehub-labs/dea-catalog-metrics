id: dea:metric-independent-model-validation-coverage
name: Independent Model Validation Coverage
type: Metric
description: 'Within AI Governance & Model Risk Management, Independent Model Validation Coverage (IMVC-AI)
  is used to gauge exposure to adverse outcomes. It is computed as Material Models Independently Validated
  / Material Models, expressed in percent (%). It is applied across virtually every sector. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
abbreviation: IMVC-AI
unit: percent
version: 1.1.0
