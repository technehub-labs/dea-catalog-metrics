id: dea:metric-release-frequency
name: Release Frequency
type: Metric
description: Release Frequency (RLF) captures the utilization or availability of capacity for organizations
  tracking software engineering. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Releases per Period - reported in times per period. Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
