id: dea:metric-serviceable-spares-availability
name: Serviceable Spares Availability
type: Metric
description: Serviceable Spares Availability (SSPA) measures the utilization or availability of capacity
  in the Aviation Maintenance Repair & Overhaul domain. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It is computed as Serviceable Parts Available at Need
  / Parts Demands, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Airlines & aviation.
abbreviation: SSPA
unit: percent
version: 1.1.0
