id: dea:metric-mis-sort-rate
name: Mis-sort Rate
type: Metric
description: 'Within Postal & Courier, Mis-sort Rate (MSR-P) is used to gauge the quality of outputs and
  outcomes. It is defined as Incorrectly Sorted Items / Items Sorted; the result is stated in percent
  (%). It is a working-level control: thresholds trigger immediate operational response. Lower values
  are better; each reduction is an improvement. In Postal & courier, it is a recognized element of the
  standard performance toolkit.'
