id: dea:metric-billable-utilization-rate
name: Billable Utilization Rate
type: Metric
description: Billable Utilization Rate (BUR) measures the utilization or availability of capacity in the
  Professional Services domain. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Billable Hours / Available Hours, measured in
  percent (%). Improvement means raising this figure toward best-in-class levels. It originates from and
  is most used in Professional services practice.
abbreviation: BUR
unit: percent
