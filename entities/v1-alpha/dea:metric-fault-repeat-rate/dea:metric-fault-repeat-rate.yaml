id: dea:metric-fault-repeat-rate
name: Fault Repeat Rate
type: Metric
description: 'Fault Repeat Rate (FRR-N) measures the quality of outputs and outcomes in the Telecom Network
  Operations domain. It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. The formula is Faults Reoccurring within 30 Days / Faults Repaired - reported in percent (%).
  It should be driven down, since lower readings signal healthier performance. It is a standard measure
  in the Telecommunications sector.'
abbreviation: FRR-N
unit: percent
