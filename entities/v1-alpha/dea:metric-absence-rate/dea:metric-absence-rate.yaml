id: dea:metric-absence-rate
name: Absence Rate
type: Metric
description: 'Absence Rate (AR) measures the utilization or availability of capacity in the Human Resources
  domain. It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. The formula is Absent Days / Scheduled Work Days - reported in percent (%). It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.'
abbreviation: AR
unit: percent
