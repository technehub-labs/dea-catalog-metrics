id: dea:metric-ci-pipeline-success-rate
name: CI Pipeline Success Rate
type: Metric
description: CI Pipeline Success Rate (CIPSR) addresses the quality of outputs and outcomes and is a fixture
  of continuous integration reporting. Its calculation is Green Pipeline Runs / Total Runs, measured in
  percent (%). It is applied across virtually every sector. It provides the day-to-day signal that a process
  is running as designed. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CIPSR
unit: percent
version: 1.1.0
