id: dea:metric-board-esg-oversight-coverage
name: Board ESG Oversight Coverage
type: Metric
description: Board ESG Oversight Coverage (BEOC) measures governance in the Environmental, Social & Governance
  Reporting domain. It is defined as ESG Topics Reviewed by Board / Required Topics; the result is stated
  in percent (%). It is applied across virtually every sector. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It should be maximized within the limits of cost
  and quality trade-offs.
