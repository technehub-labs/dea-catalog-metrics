id: dea:metric-assets-under-management-growth
name: Assets Under Management Growth
type: Metric
description: Assets Under Management Growth (AUMG) captures growth over time for organizations tracking
  banking & financial services. The formula is (AUM_current - AUM_prior) / AUM_prior - reported in percent
  (%). It is a standard measure in the Financial services sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It should be maximized within the limits of
  cost and quality trade-offs.
abbreviation: AUMG
unit: percent
