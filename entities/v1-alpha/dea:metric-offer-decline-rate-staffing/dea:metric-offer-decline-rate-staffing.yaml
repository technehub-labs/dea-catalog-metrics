id: dea:metric-offer-decline-rate-staffing
name: Offer Decline Rate (Staffing)
type: Metric
description: Within Staffing & Recruiting, Offer Decline Rate (Staffing) (ODR-S) is used to gauge exposure
  to adverse outcomes. Its calculation is Declined Offers / Offers Extended, measured in percent (%).
  It originates from and is most used in Staffing & recruiting practice. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: ODR-S
unit: percent
