id: dea:metric-assortment-depth-compliance
name: Assortment Depth Compliance
type: Metric
description: Within Retail Standard Measures, Assortment Depth Compliance (ADC-RT) is used to gauge conformance
  to standards, plans, or obligations. It is computed as Stores Holding Core Assortment / Stores, expressed
  in percent (%). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Retail & E-commerce.
abbreviation: ADC-RT
unit: percent
