type: Metric
description: A Chemicals & Specialty Materials indicator, Occupational Exposure Limit Compliance (OELC)
  quantifies exposure to adverse outcomes. The formula is Monitoring Results below OEL / Results - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Chemicals sector.
