id: dea:metric-instability-ratio-architecture
name: Instability Ratio (Architecture)
type: Metric
description: 'Instability Ratio (Architecture) (INSTA) measures the quality of outputs and outcomes in
  the Code Quality & Static Analysis domain. The formula is Efferent / (Efferent + Afferent Coupling)
  - reported in ratio (x:1 or x). It is a standard measure in the Software sector. It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. Values outside the intended band,
  on either side, warrant investigation.'
