id: dea:metric-marketing-mix-model-validation-accuracy
name: Marketing Mix Model Validation Accuracy
type: Metric
description: Marketing Mix Model Validation Accuracy (MMMVA) addresses the quality of outputs and outcomes
  and is a fixture of marketing & advertising standard measures (deep dive) reporting. The formula is
  Holdout Predicted vs Actual Revenue Variance - reported in percent (%). It is applied across virtually
  every sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: MMMVA
unit: percent
