id: dea:metric-passive-candidate-conversion-rate
name: Passive Candidate Conversion Rate
type: Metric
description: Passive Candidate Conversion Rate (PCCR) addresses how efficiently resources are converted
  into outputs and is a fixture of talent acquisition deep dive reporting. It is defined as Sourced Passive
  Candidates Entering Process / Contacted; the result is stated in percent (%). It is applied across virtually
  every sector. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: PCCR
unit: percent
version: 1.1.0
