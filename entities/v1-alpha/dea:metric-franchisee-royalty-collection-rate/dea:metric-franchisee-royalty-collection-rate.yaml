id: dea:metric-franchisee-royalty-collection-rate
name: Franchisee Royalty Collection Rate
type: Metric
description: 'Franchisee Royalty Collection Rate (FRCR-D) captures conformance to standards, plans, or
  obligations for organizations tracking franchise operations (deep dive). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Royalties
  Collected / Royalties Due, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
