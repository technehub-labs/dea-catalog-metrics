id: dea:metric-return-on-equity
name: Return on Equity
type: Metric
description: 'Return on Equity (ROE) captures the economic value created or preserved for organizations
  tracking finance & accounting. It is computed as Net Income / Shareholders'' Equity, expressed in percent
  (%). It is applied across virtually every sector. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It should be maximized within the limits of cost
  and quality trade-offs.'
