id: dea:metric-flaring-intensity
name: Flaring Intensity
type: Metric
description: 'Flaring Intensity (FLRI) measures environmental and social sustainability performance in
  the Oil & Gas domain. It is computed as Volume Flared / Volume Produced, expressed in percent (%). Its
  use is concentrated in Oil & gas. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Reduction is the goal, and sustained decreases indicate successful intervention.'
