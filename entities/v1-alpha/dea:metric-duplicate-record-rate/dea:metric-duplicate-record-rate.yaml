id: dea:metric-duplicate-record-rate
name: Duplicate Record Rate
type: Metric
description: Duplicate Record Rate (DRR) captures the quality of outputs and outcomes for organizations
  tracking data management & analytics. It is computed as Duplicate Records / Total Records, expressed
  in percent (%). It is applied across virtually every sector. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: DRR
unit: percent
version: 1.1.0
