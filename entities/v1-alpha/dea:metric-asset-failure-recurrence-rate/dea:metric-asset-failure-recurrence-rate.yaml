id: dea:metric-asset-failure-recurrence-rate
name: Asset Failure Recurrence Rate
type: Metric
description: Within Maintenance & Reliability, Asset Failure Recurrence Rate (AFR) is used to gauge the
  quality of outputs and outcomes. It is computed as Repeat Failures within Warranty of Repair / Total
  Failures, expressed in percent (%). Its use is concentrated in Manufacturing. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: AFR
unit: percent
