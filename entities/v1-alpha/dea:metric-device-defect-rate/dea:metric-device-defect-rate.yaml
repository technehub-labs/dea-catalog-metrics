id: dea:metric-device-defect-rate
name: Device Defect Rate
type: Metric
description: Within Medical Devices, Device Defect Rate (DDR-MD) is used to gauge exposure to adverse
  outcomes. Its calculation is Reported Device Defects / Devices Shipped, measured in percent (%). It
  originates from and is most used in Medical devices practice. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: DDR-MD
unit: percent
