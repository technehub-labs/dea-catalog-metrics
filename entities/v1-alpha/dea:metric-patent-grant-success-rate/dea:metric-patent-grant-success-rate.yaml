id: dea:metric-patent-grant-success-rate
name: Patent Grant Success Rate
type: Metric
description: Patent Grant Success Rate (PGSR) addresses the quality of outputs and outcomes and is a fixture
  of intellectual property & licensing reporting. Its calculation is Patents Granted / Applications Prosecuted,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PGSR
unit: percent
