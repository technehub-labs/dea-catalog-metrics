id: dea:metric-safety-instrumented-system-test-compliance
name: Safety Instrumented System Test Compliance
type: Metric
description: Safety Instrumented System Test Compliance (SISTC) addresses conformance to standards, plans,
  or obligations and is a fixture of oil & gas downstream & refining reporting. It is defined as SIS Function
  Tests on Schedule / Required; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. In Oil & Gas, it is a recognized element of the standard performance toolkit.
abbreviation: SISTC
unit: percent
