id: dea:metric-herfindahl-hirschman-index-market
name: Herfindahl-Hirschman Index (Market)
type: Metric
description: 'A Market Structure & Economics Standard Measures indicator, Herfindahl-Hirschman Index (Market)
  (HHI) quantifies exposure to adverse outcomes. It is computed as Sum of Squared Market Shares of Competitors,
  expressed in index (0-100 or normalized). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
