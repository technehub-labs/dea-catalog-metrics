id: dea:metric-water-use-per-tonne-of-product
name: Water Use per Tonne of Product
type: Metric
description: Water Use per Tonne of Product (WUTP) captures environmental and social sustainability performance
  for organizations tracking food & beverage manufacturing. Its calculation is Water Consumed / Production
  Tonnes, measured in ratio (x:1 or x). It originates from and is most used in Food & Beverage practice.
  Its value drives prioritization and resource reallocation among competing initiatives. Reduction is
  the goal, and sustained decreases indicate successful intervention.
