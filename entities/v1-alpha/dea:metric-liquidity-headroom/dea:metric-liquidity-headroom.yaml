id: dea:metric-liquidity-headroom
name: Liquidity Headroom
type: Metric
description: Liquidity Headroom (LHR) captures exposure to adverse outcomes for organizations tracking
  treasury & cash management. Its calculation is (Available Liquidity - Projected Outflows) / Projected
  Outflows, measured in ratio (x:1 or x). It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: LHR
unit: ratio
