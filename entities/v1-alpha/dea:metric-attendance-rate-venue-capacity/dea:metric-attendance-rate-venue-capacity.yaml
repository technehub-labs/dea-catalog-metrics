id: dea:metric-attendance-rate-venue-capacity
name: Attendance Rate (Venue Capacity)
type: Metric
description: Attendance Rate (Venue Capacity) (ARVC) measures the utilization or availability of capacity
  in the Sports & Events domain. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Attendees / Venue Capacity - reported in percent (%).
  Improvement means raising this figure toward best-in-class levels. It is a standard measure in the Sports
  & events sector.
abbreviation: ARVC
unit: percent
version: 1.1.0
