id: dea:metric-whale-share-of-revenue-gaming
name: Whale Share of Revenue (Gaming)
type: Metric
description: Whale Share of Revenue (Gaming) (WSR-G) captures exposure to adverse outcomes for organizations
  tracking gaming development & live operations. The formula is Top Spender Cohort Revenue / Total Revenue
  - reported in percent (%). It is a standard measure in the Gaming sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Values outside the intended band,
  on either side, warrant investigation.
