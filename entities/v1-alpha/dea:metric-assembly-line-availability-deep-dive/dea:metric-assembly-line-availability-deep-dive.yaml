id: dea:metric-assembly-line-availability-deep-dive
name: Assembly Line Availability (Deep Dive)
type: Metric
description: Assembly Line Availability (Deep Dive) (ALA-D) measures the utilization or availability of
  capacity in the Automotive Manufacturing (Deep Dive) domain. It is computed as Uptime / Scheduled Production
  Time, expressed in percent (%). Its use is concentrated in Automotive. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: ALA-D
unit: percent
