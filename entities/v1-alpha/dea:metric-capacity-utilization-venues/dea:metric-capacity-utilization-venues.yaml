id: dea:metric-capacity-utilization-venues
name: Capacity Utilization (Venues)
type: Metric
description: Capacity Utilization (Venues) (CUV) addresses the utilization or availability of capacity
  and is a fixture of entertainment venues & attractions reporting. Its calculation is Tickets Sold /
  Ticketable Capacity, measured in percent (%). It originates from and is most used in Media & Entertainment
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
