id: dea:metric-franchisee-satisfaction-index-deep-dive
name: Franchisee Satisfaction Index (Deep Dive)
type: Metric
description: Franchisee Satisfaction Index (Deep Dive) (FSI-D) addresses the engagement or satisfaction
  of the people involved and is a fixture of franchise operations (deep dive) reporting. The formula is
  Franchisee Survey Composite Score - reported in index (0-100 or normalized). It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
