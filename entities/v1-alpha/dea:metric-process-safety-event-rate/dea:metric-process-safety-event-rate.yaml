id: dea:metric-process-safety-event-rate
name: Process Safety Event Rate
type: Metric
description: A Oil & Gas indicator, Process Safety Event Rate (PSER) quantifies exposure to adverse outcomes.
  The formula is Process Safety Events / Total Hours Worked x 1,000,000 - reported in events per thousand
  or million (scaled). It is a standard measure in the Oil & gas sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
