id: dea:metric-stakeholder-satisfaction-project-deep-dive
name: Stakeholder Satisfaction - Project (Deep Dive)
type: Metric
description: Stakeholder Satisfaction - Project (Deep Dive) (SSP-D) captures the engagement or satisfaction
  of the people involved for organizations tracking project management (deep dive). Its calculation is
  Stakeholder Survey Score per Stage, measured in score (points). It is applied across virtually every
  sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. It should be maximized within the limits of cost and quality trade-offs.
