id: dea:metric-application-perceived-network-score
name: Application-Perceived Network Score
type: Metric
description: Application-Perceived Network Score (APNS) captures the quality of outputs and outcomes for
  organizations tracking network performance & capacity. It is computed as Composite of Latency, Loss,
  Jitter against App Thresholds, expressed in score (points). Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
