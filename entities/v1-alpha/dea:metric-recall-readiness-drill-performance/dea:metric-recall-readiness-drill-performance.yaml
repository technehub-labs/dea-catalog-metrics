id: dea:metric-recall-readiness-drill-performance
name: Recall Readiness Drill Performance
type: Metric
description: 'Within Food & Beverage Manufacturing, Recall Readiness Drill Performance (RRDP) is used
  to gauge exposure to adverse outcomes. It is computed as Mock Recall Time and Traceability Completeness
  Score, expressed in score (points). Its use is concentrated in Food & Beverage. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
