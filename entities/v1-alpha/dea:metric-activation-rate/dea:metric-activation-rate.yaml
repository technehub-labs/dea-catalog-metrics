id: dea:metric-activation-rate
name: Activation Rate
type: Metric
description: Activation Rate (ACT) captures how effectively a process or entity achieves its intended
  outcome for organizations tracking product management. It is computed as Users Reaching Activation Milestone
  / New Users, expressed in percent (%). It is applied across virtually every sector. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: ACT
unit: percent
