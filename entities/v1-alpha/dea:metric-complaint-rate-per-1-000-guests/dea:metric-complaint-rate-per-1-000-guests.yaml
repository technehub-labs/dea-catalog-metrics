id: dea:metric-complaint-rate-per-1-000-guests
name: Complaint Rate per 1,000 Guests
type: Metric
description: A Travel & Tourism indicator, Complaint Rate per 1,000 Guests (CRPG) quantifies the quality
  of outputs and outcomes. It is defined as Complaints / Guests x 1,000; the result is stated in events
  per thousand or million (scaled). In Travel & tourism, it is a recognized element of the standard performance
  toolkit. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. Reduction is the goal, and sustained decreases indicate successful intervention.
