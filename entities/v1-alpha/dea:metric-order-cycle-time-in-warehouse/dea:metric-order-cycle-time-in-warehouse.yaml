id: dea:metric-order-cycle-time-in-warehouse
name: Order Cycle Time in Warehouse
type: Metric
description: 'Order Cycle Time in Warehouse (OCT) addresses how efficiently resources are converted into
  outputs and is a fixture of warehousing reporting. The formula is Hours from Order Release to Shipment
  - reported in hours. It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Lower values are better; each reduction is an improvement. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.'
