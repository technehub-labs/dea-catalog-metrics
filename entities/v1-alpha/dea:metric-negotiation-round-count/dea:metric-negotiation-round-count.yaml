id: dea:metric-negotiation-round-count
name: Negotiation Round Count
type: Metric
description: Negotiation Round Count (NRC-CL) addresses how efficiently resources are converted into outputs
  and is a fixture of contract lifecycle management reporting. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. It is computed as Average Redline Cycles
  before Execution, expressed in times per period. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
