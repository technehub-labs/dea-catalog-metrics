id: dea:metric-facility-utilization-venue-hours
name: Facility Utilization (Venue Hours)
type: Metric
description: Within Arts & Culture, Facility Utilization (Venue Hours) (FUH) is used to gauge the utilization
  or availability of capacity. It is defined as Used Venue Hours / Available Venue Hours; the result is
  stated in percent (%). It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. Higher values are better; gains are read as improvement and losses as deterioration.
  In Arts & culture, it is a recognized element of the standard performance toolkit.
