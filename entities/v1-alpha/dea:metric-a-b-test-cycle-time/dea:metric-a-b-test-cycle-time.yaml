id: dea:metric-a-b-test-cycle-time
name: A-B Test Cycle Time
type: Metric
description: 'A-B Test Cycle Time (ABTCT) measures how efficiently resources are converted into outputs
  in the Data Science & Analytics Operations domain. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Days from Hypothesis to Decision
  - reported in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
