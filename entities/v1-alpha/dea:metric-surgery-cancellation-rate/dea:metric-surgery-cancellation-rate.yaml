id: dea:metric-surgery-cancellation-rate
name: Surgery Cancellation Rate
type: Metric
description: Surgery Cancellation Rate (SCR2) captures how efficiently resources are converted into outputs
  for organizations tracking healthcare. It is computed as Cancelled Surgeries / Scheduled Surgeries,
  expressed in percent (%). It is reviewed at cadence by planning owners to correct course before issues
  become strategic. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Healthcare.
abbreviation: SCR2
unit: percent
