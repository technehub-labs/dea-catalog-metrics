id: dea:metric-on-time-departure-rate-airport
name: On-Time Departure Rate (Airport)
type: Metric
description: Within Airport Operations, On-Time Departure Rate (Airport) (OTDA) is used to gauge the quality
  of outputs and outcomes. The formula is Flights Departing within Threshold / Scheduled Departures -
  reported in percent (%). It is a standard measure in the Airports sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: OTDA
unit: percent
