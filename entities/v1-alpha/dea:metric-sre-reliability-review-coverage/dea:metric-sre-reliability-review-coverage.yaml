id: dea:metric-sre-reliability-review-coverage
name: SRE Reliability Review Coverage
type: Metric
description: Within Observability & Site Reliability Engineering, SRE Reliability Review Coverage (SRRC)
  is used to gauge capability maturity or development. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Critical Services Reviewed per Quarter
  / Critical Services; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
