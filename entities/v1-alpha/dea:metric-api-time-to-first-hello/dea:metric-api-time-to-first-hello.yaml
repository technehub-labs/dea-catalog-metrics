id: dea:metric-api-time-to-first-hello
name: API Time to First Hello
type: Metric
description: API Time to First Hello (TTFH) addresses how efficiently resources are converted into outputs
  and is a fixture of api lifecycle management reporting. It is computed as Median Minutes for New Consumer
  to Make Successful Call, expressed in minutes. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Software.
