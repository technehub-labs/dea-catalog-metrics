id: dea:metric-on-time-performance-a15-deep-dive
name: On-Time Performance - A15 (Deep Dive)
type: Metric
description: 'On-Time Performance - A15 (Deep Dive) (OTP-A15) addresses the quality of outputs and outcomes
  and is a fixture of airline operations (deep dive) reporting. It is computed as Arrivals within 15 Minutes
  / Arrivals, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is concentrated in Airlines.'
abbreviation: OTP-A15
unit: percent
