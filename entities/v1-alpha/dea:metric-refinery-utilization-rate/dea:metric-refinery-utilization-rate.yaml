id: dea:metric-refinery-utilization-rate
name: Refinery Utilization Rate
type: Metric
description: 'Refinery Utilization Rate (RUR) captures the utilization or availability of capacity for
  organizations tracking oil & gas. It is computed as Crude Processed / Refinery Capacity, expressed in
  percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Oil & gas.'
