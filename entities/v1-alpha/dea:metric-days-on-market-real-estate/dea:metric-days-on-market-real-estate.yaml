id: dea:metric-days-on-market-real-estate
name: Days on Market (Real Estate)
type: Metric
description: 'Days on Market (Real Estate) (DOM-RE) addresses how efficiently resources are converted
  into outputs and is a fixture of real estate & mortgage standard measures reporting. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. The formula is Average
  Days from Listing to Contract - reported in days. It should be driven down, since lower readings signal
  healthier performance. It is a standard measure in the Real estate sector.'
