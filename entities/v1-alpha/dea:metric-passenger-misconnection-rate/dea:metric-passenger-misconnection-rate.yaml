id: dea:metric-passenger-misconnection-rate
name: Passenger Misconnection Rate
type: Metric
description: Within Airline & Transportation Standard Measures (Deep Dive), Passenger Misconnection Rate
  (PMR-AT) is used to gauge the quality of outputs and outcomes. It provides the day-to-day signal that
  a process is running as designed. Its calculation is Passengers Missing Connections due to Own Airline
  Delay / Connecting Passengers, measured in events per thousand or million (scaled). It should be driven
  down, since lower readings signal healthier performance. It originates from and is most used in Airlines
  & Aviation practice.
