id: dea:metric-supplier-innovation-contribution-rate
name: Supplier Innovation Contribution Rate
type: Metric
description: Supplier Innovation Contribution Rate (SICR) captures the economic value created or preserved
  for organizations tracking strategic sourcing & supplier performance (deep dive). It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Its calculation
  is Accepted Supplier-Initiated Innovations / Sourcing Cycle, measured in count (items per period). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: SICR
unit: count
