id: dea:metric-disparate-impact-ratio
name: Disparate Impact Ratio
type: Metric
description: 'Disparate Impact Ratio (DIR-AI) measures exposure to adverse outcomes in the AI Ethics,
  Fairness & Responsible AI domain. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Selection Rate of Protected Group / Reference Group,
  expressed in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: DIR-AI
unit: ratio
