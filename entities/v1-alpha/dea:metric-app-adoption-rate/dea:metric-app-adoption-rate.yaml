id: dea:metric-app-adoption-rate
name: App Adoption Rate
type: Metric
description: App Adoption Rate (AAR-MOB) addresses the engagement or satisfaction of the people involved
  and is a fixture of mobile & client development reporting. Its calculation is Active App Users / Eligible
  Users, measured in percent (%). Its value drives prioritization and resource reallocation among competing
  initiatives. Higher values are better; gains are read as improvement and losses as deterioration. It
  originates from and is most used in Software practice.
abbreviation: AAR-MOB
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- engagement
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
