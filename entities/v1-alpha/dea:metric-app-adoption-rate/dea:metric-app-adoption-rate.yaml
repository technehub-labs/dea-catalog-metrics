source_credit: Public domain - no attribution required
calculation_definition: Active App Users / Eligible Users
formula_definition:
  formula_id: dea:formula-app-adoption-rate
  expression: AAR-MOB = Active App Users / Eligible Users
  inputs:
  - name: Active App Users
  - name: Eligible Users
