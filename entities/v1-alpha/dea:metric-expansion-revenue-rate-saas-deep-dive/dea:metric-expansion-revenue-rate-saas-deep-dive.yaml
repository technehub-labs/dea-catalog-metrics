id: dea:metric-expansion-revenue-rate-saas-deep-dive
name: Expansion Revenue Rate (SaaS Deep Dive)
type: Metric
description: Expansion Revenue Rate (SaaS Deep Dive) (ERR-D) addresses growth over time and is a fixture
  of software product operations (deep dive) reporting. It is defined as Expansion MRR / Starting MRR;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. In Technology, it is a recognized element of the standard performance toolkit.
