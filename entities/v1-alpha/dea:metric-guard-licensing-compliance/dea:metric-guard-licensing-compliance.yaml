id: dea:metric-guard-licensing-compliance
name: Guard Licensing Compliance
type: Metric
description: Guard Licensing Compliance (GLC-S) captures conformance to standards, plans, or obligations
  for organizations tracking security services & guarding. It is defined as Guards with Valid Licenses
  / Deployed Guards; the result is stated in percent (%). Its trend is watched by senior leadership as
  an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. In Security, it is a recognized element of the standard performance toolkit.
abbreviation: GLC-S
unit: percent
version: 1.1.0
lifecycle_status: candidate
