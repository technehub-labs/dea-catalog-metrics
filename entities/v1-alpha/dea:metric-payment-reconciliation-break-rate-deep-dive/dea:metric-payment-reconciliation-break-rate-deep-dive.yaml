id: dea:metric-payment-reconciliation-break-rate-deep-dive
name: Payment Reconciliation Break Rate (Deep Dive)
type: Metric
description: Within Payments & Cards (Deep Dive), Payment Reconciliation Break Rate (Deep Dive) (PRBR)
  is used to gauge the quality of outputs and outcomes. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Unmatched Items / Reconciled Items, measured in percent (%).
  It should be driven down, since lower readings signal healthier performance. It originates from and
  is most used in Payments practice.
abbreviation: PRBR
unit: percent
