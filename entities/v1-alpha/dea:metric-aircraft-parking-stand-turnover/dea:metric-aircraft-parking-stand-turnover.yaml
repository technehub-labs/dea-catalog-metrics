id: dea:metric-aircraft-parking-stand-turnover
name: Aircraft Parking Stand Turnover
type: Metric
description: A Airport Operations (Deep Dive) indicator, Aircraft Parking Stand Turnover (APST) quantifies
  the utilization or availability of capacity. Its calculation is Stand Occupancy Hours / Stand Hours
  Available, measured in percent (%). It originates from and is most used in Aviation practice. Its value
  drives prioritization and resource reallocation among competing initiatives. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: APST
unit: percent
