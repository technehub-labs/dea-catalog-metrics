id: dea:metric-hard-services-downtime-deep-dive
name: Hard Services Downtime (Deep Dive)
type: Metric
description: Hard Services Downtime (Deep Dive) (HSD-D) addresses exposure to adverse outcomes and is
  a fixture of facility management & workplace (deep dive) reporting. Its calculation is Hours of Critical
  System Downtime per Month, measured in hours. Its value drives prioritization and resource reallocation
  among competing initiatives. Lower values are better; each reduction is an improvement. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
