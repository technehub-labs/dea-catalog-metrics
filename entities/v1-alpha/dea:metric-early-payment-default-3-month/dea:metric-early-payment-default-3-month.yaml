id: dea:metric-early-payment-default-3-month
name: Early Payment Default - 3 Month
type: Metric
description: 'Early Payment Default - 3 Month (EPD3) captures exposure to adverse outcomes for organizations
  tracking banking retail lending (deep dive). It is computed as Defaults within 3 Months / Disbursed
  Loans, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is
  concentrated in Banking.'
