id: dea:metric-safety-audit-compliance-score
name: Safety Audit Compliance Score
type: Metric
description: Safety Audit Compliance Score (SACS) addresses conformance to standards, plans, or obligations
  and is a fixture of health & safety reporting. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It is defined as Weighted Audit Score of Site Safety
  Conditions; the result is stated in score (points). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
