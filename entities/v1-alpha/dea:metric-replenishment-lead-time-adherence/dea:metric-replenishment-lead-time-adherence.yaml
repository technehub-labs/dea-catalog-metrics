id: dea:metric-replenishment-lead-time-adherence
name: Replenishment Lead Time Adherence
type: Metric
description: Within Sales & Operations Planning, Replenishment Lead Time Adherence (RLTA) is used to gauge
  conformance to standards, plans, or obligations. It is computed as Replenishments within Planned Lead
  Time / Replenishments, expressed in percent (%). Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
