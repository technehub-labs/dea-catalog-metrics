id: dea:metric-collections-right-party-contact-rate
name: Collections Right-Party Contact Rate
type: Metric
description: A Banking Retail Lending (Deep Dive) indicator, Collections Right-Party Contact Rate (RPCR)
  quantifies how effectively a process or entity achieves its intended outcome. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It is computed as Contacts
  with Customer / Contact Attempts, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Banking.
