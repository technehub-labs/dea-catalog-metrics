id: dea:metric-tailings-dam-inspection-compliance
name: Tailings Dam Inspection Compliance
type: Metric
description: Tailings Dam Inspection Compliance (TDIC) measures exposure to adverse outcomes in the Metals
  & Mining Operations (Deep Dive) domain. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Inspections per SMP Schedule / Required; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. In Metals
  & Mining, it is a recognized element of the standard performance toolkit.
abbreviation: TDIC
unit: percent
