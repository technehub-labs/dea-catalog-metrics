id: dea:metric-incoterms-risk-exposure-mix
name: Incoterms Risk Exposure Mix
type: Metric
description: Incoterms Risk Exposure Mix (IREM) addresses exposure to adverse outcomes and is a fixture
  of international trade & customs reporting. It is computed as Shipment Value by Incoterms Risk-Transfer
  Point, expressed in percent (%). Its use is concentrated in Logistics & Trade. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. Values outside the intended band,
  on either side, warrant investigation.
