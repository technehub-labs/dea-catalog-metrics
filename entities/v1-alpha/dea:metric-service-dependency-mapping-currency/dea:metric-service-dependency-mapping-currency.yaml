id: dea:metric-service-dependency-mapping-currency
name: Service Dependency Mapping Currency
type: Metric
description: Service Dependency Mapping Currency (SDMC) addresses the quality of outputs and outcomes
  and is a fixture of sre & observability standard measures reporting. Its calculation is Dependencies
  Verified in Last Quarter / Mapped Dependencies, measured in percent (%). It originates from and is most
  used in Software practice. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: SDMC
unit: percent
