id: dea:metric-product-recyclability-rate
name: Product Recyclability Rate
type: Metric
description: Product Recyclability Rate (PRR2) captures environmental and social sustainability performance
  for organizations tracking sustainability & esg. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Recyclable Product Mass
  / Total Product Mass, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PRR2
unit: percent
