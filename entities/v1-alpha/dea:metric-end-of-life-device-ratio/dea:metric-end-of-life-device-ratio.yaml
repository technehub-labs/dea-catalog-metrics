id: dea:metric-end-of-life-device-ratio
name: End-of-Life Device Ratio
type: Metric
description: End-of-Life Device Ratio (EOLDR) measures exposure to adverse outcomes in the Network Change
  & Configuration Management domain. Its calculation is Devices Past Vendor EOL / Devices, measured in
  percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: EOLDR
unit: percent
