id: dea:metric-outbound-license-revenue-yield
name: Outbound License Revenue Yield
type: Metric
description: 'Within Intellectual Property & Licensing, Outbound License Revenue Yield (OLRY) is used
  to gauge the economic value created or preserved. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Licensing Revenue vs Portfolio
  Potential, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
