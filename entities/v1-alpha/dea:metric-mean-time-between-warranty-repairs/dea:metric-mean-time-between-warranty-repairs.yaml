id: dea:metric-mean-time-between-warranty-repairs
name: Mean Time between Warranty Repairs
type: Metric
description: 'Mean Time between Warranty Repairs (MTBWR) measures the quality of outputs and outcomes
  in the Automotive domain. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. It is computed as Vehicle Operating Time / Warranty Repair Events, expressed
  in hours. Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Automotive.'
