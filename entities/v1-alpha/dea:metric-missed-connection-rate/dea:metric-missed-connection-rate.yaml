id: dea:metric-missed-connection-rate
name: Missed Connection Rate
type: Metric
description: Missed Connection Rate (MCR-A) addresses the quality of outputs and outcomes and is a fixture
  of airline operations (deep dive) reporting. Its calculation is Passengers Missing Connections / Connecting
  Passengers, measured in percent (%). It originates from and is most used in Airlines practice. Its value
  drives prioritization and resource reallocation among competing initiatives. Reduction is the goal,
  and sustained decreases indicate successful intervention.
abbreviation: MCR-A
unit: percent
