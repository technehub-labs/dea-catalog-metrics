id: dea:metric-locker-or-pickup-point-utilization
name: Locker or Pickup Point Utilization
type: Metric
description: 'Locker or Pickup Point Utilization (LPPU) measures the utilization or availability of capacity
  in the Parcel & Last-Mile Logistics (Deep Dive) domain. The formula is Locker Transactions / Locker
  Capacity - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Logistics & Trade sector.'
abbreviation: LPPU
unit: percent
