id: dea:metric-data-quality-cost-of-poor-quality
name: Data Quality Cost of Poor Quality
type: Metric
description: 'Data Quality Cost of Poor Quality (DQPQ) addresses the economic value created or preserved
  and is a fixture of data quality management reporting. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Estimated Rework and Error Cost
  per Quarter, expressed in currency value. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
