id: dea:metric-incident-communication-cadence-compliance
name: Incident Communication Cadence Compliance
type: Metric
description: Incident Communication Cadence Compliance (ICCC-IT) measures conformance to standards, plans,
  or obligations in the IT Incident & Major Problem Management domain. It is computed as Major Incidents
  with Timely Stakeholder Updates / Major Incidents, expressed in percent (%). It is applied across virtually
  every sector. Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: ICCC-IT
unit: percent
version: 1.1.0
