id: dea:metric-notification-to-first-payment-lag
name: Notification to First Payment Lag
type: Metric
description: Notification to First Payment Lag (NFPL) captures how efficiently resources are converted
  into outputs for organizations tracking insurance claims deep dive. It bridges daily operations and
  executive reporting, giving managers a lever to pull within a quarter. It is defined as Days from Claim
  Notification to First Payment; the result is stated in days. It should be driven down, since lower readings
  signal healthier performance. In Insurance, it is a recognized element of the standard performance toolkit.
