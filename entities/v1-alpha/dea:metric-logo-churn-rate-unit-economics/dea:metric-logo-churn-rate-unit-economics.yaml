id: dea:metric-logo-churn-rate-unit-economics
name: Logo Churn Rate (Unit Economics)
type: Metric
description: 'Logo Churn Rate (Unit Economics) (LCRDD) addresses the retention of customers, users, or
  assets over time and is a fixture of unit economics & growth (deep dive) reporting. It is computed as
  Customers Lost / Customers at Start, expressed in percent (%). Its use is concentrated in Software.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
