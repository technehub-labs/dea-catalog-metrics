id: dea:metric-savings-realization-rate-sourcing
name: Savings Realization Rate (Sourcing)
type: Metric
description: Savings Realization Rate (Sourcing) (SRR-SS) captures the economic value created or preserved
  for organizations tracking strategic sourcing & supplier performance (deep dive). It is defined as Realized
  vs Identified Savings / Identified Savings; the result is stated in percent (%). It is applied across
  virtually every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
