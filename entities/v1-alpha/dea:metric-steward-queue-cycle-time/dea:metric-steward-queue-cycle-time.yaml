id: dea:metric-steward-queue-cycle-time
name: Steward Queue Cycle Time
type: Metric
description: Steward Queue Cycle Time (SQCT) measures how efficiently resources are converted into outputs
  in the Master Data Management domain. It is computed as Days for Steward to Resolve Data Curation Queue
  Items, expressed in days. It is applied across virtually every sector. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
