id: dea:metric-soc-staffing-coverage-ratio
name: SOC Staffing Coverage Ratio
type: Metric
description: 'SOC Staffing Coverage Ratio (SSCR-SOC) addresses the utilization or availability of capacity
  and is a fixture of secops & security operations center reporting. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as 24x7 Shifts Fully Staffed / Shifts; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: SSCR-SOC
unit: percent
