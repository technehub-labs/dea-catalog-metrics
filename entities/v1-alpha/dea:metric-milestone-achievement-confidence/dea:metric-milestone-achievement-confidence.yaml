id: dea:metric-milestone-achievement-confidence
name: Milestone Achievement Confidence
type: Metric
description: Milestone Achievement Confidence (MAC) measures exposure to adverse outcomes in the Aerospace
  & Defense Program Management domain. The formula is Program Milestones at Green Confidence / Milestones
  - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Aerospace & Defense sector.
