id: dea:metric-database-lock-cycle-time
name: Database Lock Cycle Time
type: Metric
description: Database Lock Cycle Time (DBLC) addresses how efficiently resources are converted into outputs
  and is a fixture of pharma r&d & clinical trials reporting. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Days from Last Patient Visit
  to Database Lock - reported in days. It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Pharmaceuticals sector.
