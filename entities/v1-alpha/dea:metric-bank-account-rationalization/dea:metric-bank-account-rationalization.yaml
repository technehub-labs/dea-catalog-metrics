id: dea:metric-bank-account-rationalization
name: Bank Account Rationalization
type: Metric
description: 'A Treasury & Cash Management indicator, Bank Account Rationalization (BAR) quantifies how
  efficiently resources are converted into outputs. The formula is Active Bank Accounts / Total Bank Accounts
  Held - reported in percent (%). It is applied across virtually every sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
