id: dea:metric-storage-cost-per-terabyte-records
name: Storage Cost per Terabyte (Records)
type: Metric
description: Storage Cost per Terabyte (Records) (SCPT) captures how efficiently resources are converted
  into outputs for organizations tracking records & information management. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It is defined as Records
  Storage Spend / Terabytes Stored; the result is stated in currency per unit. It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.
abbreviation: SCPT
unit: currency
