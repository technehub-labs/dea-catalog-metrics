id: dea:metric-write-off-rate-retail-loans
name: Write-Off Rate (Retail Loans)
type: Metric
description: Within Retail Banking & Lending, Write-Off Rate (Retail Loans) (WORL) is used to gauge exposure
  to adverse outcomes. It is defined as Written-Off Loans / Average Gross Loans; the result is stated
  in percent (%). In Banking, it is a recognized element of the standard performance toolkit. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Reduction is the
  goal, and sustained decreases indicate successful intervention.
abbreviation: WORL
unit: percent
