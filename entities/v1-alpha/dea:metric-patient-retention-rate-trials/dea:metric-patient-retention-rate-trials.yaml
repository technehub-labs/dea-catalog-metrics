id: dea:metric-patient-retention-rate-trials
name: Patient Retention Rate (Trials)
type: Metric
description: 'Patient Retention Rate (Trials) (PRR-T) addresses the retention of customers, users, or
  assets over time and is a fixture of pharma r&d & clinical trials reporting. The formula is Subjects
  Completing Study / Subjects Enrolled - reported in percent (%). It is a standard measure in the Pharmaceuticals
  sector. It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: PRR-T
unit: percent
