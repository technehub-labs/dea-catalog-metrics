id: dea:metric-insurance-rejection-rate-pharmacy
name: Insurance Rejection Rate (Pharmacy)
type: Metric
description: Insurance Rejection Rate (Pharmacy) (IRR-Ph) captures how efficiently resources are converted
  into outputs for organizations tracking pharmacy retail. Its calculation is Rejected Claims / Claims
  Submitted, measured in percent (%). It provides the day-to-day signal that a process is running as designed.
  Lower values are better; each reduction is an improvement. It originates from and is most used in Healthcare
  practice.
