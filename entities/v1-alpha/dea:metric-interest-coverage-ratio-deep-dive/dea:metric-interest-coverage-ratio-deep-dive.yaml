id: dea:metric-interest-coverage-ratio-deep-dive
name: Interest Coverage Ratio (Deep Dive)
type: Metric
description: 'Interest Coverage Ratio (Deep Dive) (ICR-D) addresses exposure to adverse outcomes and is
  a fixture of balanced scorecard - financial perspective reporting. It is computed as EBIT / Interest
  Expense, expressed in ratio (x:1 or x). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
