id: dea:metric-alert-noise-ratio
name: Alert Noise Ratio
type: Metric
description: A SRE & Observability Standard Measures indicator, Alert Noise Ratio (ALNR) quantifies the
  quality of outputs and outcomes. Its calculation is Non-Actionable Alerts / Total Alerts, measured in
  percent (%). It provides the day-to-day signal that a process is running as designed. Lower values are
  better; each reduction is an improvement. It originates from and is most used in Software practice.
abbreviation: ALNR
unit: percent
