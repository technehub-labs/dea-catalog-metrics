id: dea:metric-high-performer-retention-rate
name: High-Performer Retention Rate
type: Metric
description: High-Performer Retention Rate (HPRR) measures the retention of customers, users, or assets
  over time in the Employee Engagement & Culture (Deep Dive) domain. The formula is Top Quartile Performers
  Retained / Top Quartile - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: HPRR
unit: percent
