id: dea:metric-equipment-availability-cleaning-fleet
name: Equipment Availability (Cleaning Fleet)
type: Metric
description: Equipment Availability (Cleaning Fleet) (EAF-C) addresses the utilization or availability
  of capacity and is a fixture of cleaning & environmental services reporting. Its calculation is Available
  Equipment Hours / Scheduled Hours, measured in percent (%). It originates from and is most used in Facility
  Services practice. It provides the day-to-day signal that a process is running as designed. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: EAF-C
unit: percent
