id: dea:metric-knowledge-contribution-rate
name: Knowledge Contribution Rate
type: Metric
description: A Knowledge Management indicator, Knowledge Contribution Rate (KCR-E) quantifies the engagement
  or satisfaction of the people involved. It is computed as Employees Contributing Knowledge per Period
  / Employees, expressed in percent (%). It is applied across virtually every sector. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: KCR-E
unit: percent
