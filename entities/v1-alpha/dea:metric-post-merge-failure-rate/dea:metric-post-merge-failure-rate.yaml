id: dea:metric-post-merge-failure-rate
name: Post-Merge Failure Rate
type: Metric
description: 'Post-Merge Failure Rate (PMFR-CI) captures the quality of outputs and outcomes for organizations
  tracking continuous integration. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Failures on Main Branch / Runs on Main - reported in percent
  (%). It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
abbreviation: PMFR-CI
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
