id: dea:metric-niche-role-search-success-rate
name: Niche Role Search Success Rate
type: Metric
description: 'Niche Role Search Success Rate (NRSSR) captures the utilization or availability of capacity
  for organizations tracking talent acquisition deep dive. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as Hard-to-Fill Roles Closed
  within Target / Hard-to-Fill Roles, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
