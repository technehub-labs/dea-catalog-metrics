id: dea:metric-mean-time-to-failure
name: Mean Time to Failure
type: Metric
description: Within Maintenance & Reliability, Mean Time to Failure (MTTF) is used to gauge exposure to
  adverse outcomes. Its calculation is Total Operating Time / Number of Failures, measured in hours. It
  originates from and is most used in Manufacturing practice. It provides the day-to-day signal that a
  process is running as designed. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: MTTF
unit: hour
