id: dea:metric-feedback-conversation-frequency
name: Feedback Conversation Frequency
type: Metric
description: Feedback Conversation Frequency (FCF) addresses the engagement or satisfaction of the people
  involved and is a fixture of culture & employee experience reporting. It is computed as Documented Feedback
  Conversations per Employee per Period, expressed in ratio (x:1 or x). Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
