id: dea:metric-saturation-alert-lead-time
name: Saturation Alert Lead Time
type: Metric
description: 'Within SRE & Observability Standard Measures, Saturation Alert Lead Time (SALT) is used
  to gauge the quality of outputs and outcomes. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Time between Saturation Alert and Actual Saturation
  - reported in hours. Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Software sector.'
