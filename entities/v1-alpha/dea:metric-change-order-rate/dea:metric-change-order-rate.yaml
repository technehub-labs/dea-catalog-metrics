id: dea:metric-change-order-rate
name: Change Order Rate
type: Metric
description: Change Order Rate (COR-C) captures exposure to adverse outcomes for organizations tracking
  construction & engineering. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Change Order Value / Original Contract Value, expressed in percent
  (%). It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Construction & engineering.
abbreviation: COR-C
unit: percent
