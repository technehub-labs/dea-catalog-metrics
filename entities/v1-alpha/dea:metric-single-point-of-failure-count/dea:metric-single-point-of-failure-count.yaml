id: dea:metric-single-point-of-failure-count
name: Single Point of Failure Count
type: Metric
description: Single Point of Failure Count (SPOF) measures exposure to adverse outcomes in the Business
  Resilience & Continuity domain. It is defined as Identified Unremediated Single Points of Failure; the
  result is stated in count (items per period). It is applied across virtually every sector. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Reduction is the
  goal, and sustained decreases indicate successful intervention.
abbreviation: SPOF
unit: count
