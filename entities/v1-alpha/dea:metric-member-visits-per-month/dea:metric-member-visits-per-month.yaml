id: dea:metric-member-visits-per-month
name: Member Visits per Month
type: Metric
description: 'Member Visits per Month (MVM) measures the engagement or satisfaction of the people involved
  in the Fitness & Wellness domain. The formula is Total Visits / Average Members - reported in ratio
  (x:1 or x). It is a standard measure in the Fitness & wellness sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
