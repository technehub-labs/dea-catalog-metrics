id: dea:metric-query-p95-latency
name: Query P95 Latency
type: Metric
description: Query P95 Latency (QPS95) captures the quality of outputs and outcomes for organizations
  tracking database & data platform operations. It is computed as 95th Percentile Database Query Execution
  Time, expressed in milliseconds (ms). Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. Lower values are better; each reduction is an improvement. Its
  use is concentrated in Software.
