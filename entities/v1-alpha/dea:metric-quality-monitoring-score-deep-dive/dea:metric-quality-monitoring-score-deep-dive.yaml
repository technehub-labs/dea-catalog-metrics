id: dea:metric-quality-monitoring-score-deep-dive
name: Quality Monitoring Score (Deep Dive)
type: Metric
description: Quality Monitoring Score (Deep Dive) (QMS-D) addresses the quality of outputs and outcomes
  and is a fixture of contact center operations (deep dive) reporting. It is defined as Average QA Evaluation
  Score; the result is stated in score (points). It is applied across virtually every sector. It bridges
  daily operations and executive reporting, giving managers a lever to pull within a quarter. It should
  be maximized within the limits of cost and quality trade-offs.
