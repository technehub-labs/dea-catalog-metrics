id: dea:metric-crisis-response-activation-time
name: Crisis Response Activation Time
type: Metric
description: A Business Resilience & Continuity indicator, Crisis Response Activation Time (CRAT) quantifies
  exposure to adverse outcomes. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Minutes from Trigger to Crisis Team Activated,
  measured in minutes. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: CRAT
unit: minute
