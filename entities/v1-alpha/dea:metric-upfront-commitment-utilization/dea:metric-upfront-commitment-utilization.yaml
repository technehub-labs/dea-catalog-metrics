id: dea:metric-upfront-commitment-utilization
name: Upfront Commitment Utilization
type: Metric
description: Upfront Commitment Utilization (UCU-A) addresses conformance to standards, plans, or obligations
  and is a fixture of advertising & media buying reporting. Its calculation is Upfront Inventory Delivered
  / Committed, measured in percent (%). Its value drives prioritization and resource reallocation among
  competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Media & Entertainment practice.
abbreviation: UCU-A
unit: percent
version: 1.1.0
lifecycle_status: candidate
