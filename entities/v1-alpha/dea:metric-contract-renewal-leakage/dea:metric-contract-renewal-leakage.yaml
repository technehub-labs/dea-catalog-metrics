id: dea:metric-contract-renewal-leakage
name: Contract Renewal Leakage
type: Metric
description: Contract Renewal Leakage (CRL) measures exposure to adverse outcomes in the Legal domain.
  It is reviewed at cadence by planning owners to correct course before issues become strategic. It is
  computed as Auto-Renewed Contracts without Review / Contracts Renewed, expressed in percent (%). It
  should be driven down, since lower readings signal healthier performance. Practitioners in nearly any
  industry can adopt it directly.
abbreviation: CRL
unit: percent
