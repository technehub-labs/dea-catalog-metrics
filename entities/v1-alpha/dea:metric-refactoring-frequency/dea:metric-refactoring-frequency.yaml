id: dea:metric-refactoring-frequency
name: Refactoring Frequency
type: Metric
description: Refactoring Frequency (REFF) addresses the quality of outputs and outcomes and is a fixture
  of software development - coding & engineering practices reporting. It bridges daily operations and
  executive reporting, giving managers a lever to pull within a quarter. It is defined as Refactoring
  Commits per 100 Commits; the result is stated in events per thousand or million (scaled). The objective
  is neither maximization nor minimization but staying within an agreed operating band. Practitioners
  in nearly any industry can adopt it directly.
