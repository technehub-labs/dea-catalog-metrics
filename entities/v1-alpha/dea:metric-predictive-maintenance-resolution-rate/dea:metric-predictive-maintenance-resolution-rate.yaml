id: dea:metric-predictive-maintenance-resolution-rate
name: Predictive Maintenance Resolution Rate
type: Metric
description: Predictive Maintenance Resolution Rate (PMRR) captures the quality of outputs and outcomes
  for organizations tracking telecom network operations. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Issues Resolved before Failure via
  Prediction / Predicted Issues, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Telecommunications.
abbreviation: PMRR
unit: percent
version: 1.1.0
