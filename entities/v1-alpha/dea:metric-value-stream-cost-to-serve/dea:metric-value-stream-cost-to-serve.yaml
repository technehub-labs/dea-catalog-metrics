id: dea:metric-value-stream-cost-to-serve
name: Value Stream Cost-to-Serve
type: Metric
description: Value Stream Cost-to-Serve (VSCTS) captures how efficiently resources are converted into
  outputs for organizations tracking operating model monitoring & design effectiveness. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Total Cost
  / Served Units across Stream; the result is stated in currency per unit. It should be driven down, since
  lower readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
