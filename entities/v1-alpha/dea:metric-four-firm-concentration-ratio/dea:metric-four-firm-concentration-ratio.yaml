id: dea:metric-four-firm-concentration-ratio
name: Four-Firm Concentration Ratio
type: Metric
description: Within Market Structure & Economics Standard Measures, Four-Firm Concentration Ratio (FFCR)
  is used to gauge exposure to adverse outcomes. Its calculation is Combined Share of Top Four Competitors,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: FFCR
unit: percent
