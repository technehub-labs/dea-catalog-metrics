id: dea:metric-chargeback-ratio-enterprise
name: Chargeback Ratio (Enterprise)
type: Metric
description: Chargeback Ratio (Enterprise) (CBR-EF) measures the quality of outputs and outcomes in the
  Enterprise Fraud & Financial Crime Management domain. It is computed as Chargebacks / Total Card Transactions,
  expressed in percent (%). It is applied across virtually every sector. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: CBR-EF
unit: percent
version: 1.1.0
