id: dea:metric-automation-potential-realized-rate
name: Automation Potential Realized Rate
type: Metric
description: Automation Potential Realized Rate (APRR) captures how efficiently resources are converted
  into outputs for organizations tracking operating model & process health deep dive. The formula is Automated
  Task Share of Automatable Tasks / Automatable - reported in percent (%). It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
