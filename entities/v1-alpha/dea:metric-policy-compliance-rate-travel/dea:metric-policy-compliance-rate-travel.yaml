id: dea:metric-policy-compliance-rate-travel
name: Policy Compliance Rate (Travel)
type: Metric
description: A Corporate Travel Management indicator, Policy Compliance Rate (Travel) (PCR-T) quantifies
  conformance to standards, plans, or obligations. It is defined as Bookings within Travel Policy / Total
  Bookings; the result is stated in percent (%). It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: PCR-T
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
