id: dea:metric-model-governance-handoff-cycle-time
name: Model Governance Handoff Cycle Time
type: Metric
description: Within MLOps & Model Lifecycle Operations, Model Governance Handoff Cycle Time (MGHCT) is
  used to gauge how efficiently resources are converted into outputs. It is computed as Days from Model
  Sign-off to Deployment Readiness, expressed in days. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: MGHCT
