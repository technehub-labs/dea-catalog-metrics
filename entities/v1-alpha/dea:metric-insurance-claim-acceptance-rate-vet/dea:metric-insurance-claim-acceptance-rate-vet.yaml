id: dea:metric-insurance-claim-acceptance-rate-vet
name: Insurance Claim Acceptance Rate (Vet)
type: Metric
description: 'Insurance Claim Acceptance Rate (Vet) (ICAR) measures the quality of outputs and outcomes
  in the Veterinary & Animal Health domain. The formula is Claims Accepted by Pet Insurers / Claims Submitted
  - reported in percent (%). It is a standard measure in the Healthcare sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. It should be maximized
  within the limits of cost and quality trade-offs.'
abbreviation: ICAR
unit: percent
