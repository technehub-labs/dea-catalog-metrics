id: dea:metric-coaching-program-effectiveness-score
name: Coaching Program Effectiveness Score
type: Metric
description: Coaching Program Effectiveness Score (CPES) measures the economic value created or preserved
  in the Learning & Development Effectiveness (Deep Dive) domain. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Measured Goal Attainment of Coached
  Cohort vs Baseline; the result is stated in score (points). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
