id: dea:metric-disaster-recovery-test-frequency-compliance
name: Disaster Recovery Test Frequency Compliance
type: Metric
description: A Business Resilience & Continuity indicator, Disaster Recovery Test Frequency Compliance
  (DRTF) quantifies conformance to standards, plans, or obligations. Its calculation is DR Tests per Standard
  / DR Tests Required, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
