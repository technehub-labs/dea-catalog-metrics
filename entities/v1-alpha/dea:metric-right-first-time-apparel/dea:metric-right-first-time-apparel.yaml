id: dea:metric-right-first-time-apparel
name: Right First Time (Apparel)
type: Metric
description: Right First Time (Apparel) (RFT-A) captures the quality of outputs and outcomes for organizations
  tracking textile & apparel. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is Garments Passing Inspection First Time / Garments Produced, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. It originates from
  and is most used in Textile & apparel practice.
abbreviation: RFT-A
unit: percent
