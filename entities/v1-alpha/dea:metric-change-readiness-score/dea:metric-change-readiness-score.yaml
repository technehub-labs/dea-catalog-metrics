id: dea:metric-change-readiness-score
name: Change Readiness Score
type: Metric
description: Change Readiness Score (CRS-C) measures exposure to adverse outcomes in the Change Management
  domain. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It is defined as Weighted Index of Awareness, Sponsorship, and Capacity Items; the result is stated
  in index (0-100 or normalized). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
