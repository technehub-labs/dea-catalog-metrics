id: dea:metric-net-new-assets-growth
name: Net New Assets Growth
type: Metric
description: Within Wealth Management, Net New Assets Growth (NNAG) is used to gauge growth over time.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Its calculation is Net New Client Assets / Assets under Management at Start, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. It originates from and is most
  used in Wealth management practice.
