id: dea:metric-cost-per-citizen-served
name: Cost per Citizen Served
type: Metric
description: Within Public Sector & Government, Cost per Citizen Served (CPCS) is used to gauge how efficiently
  resources are converted into outputs. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Total Service Delivery Cost / Citizens Served
  - reported in currency per unit. It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Public sector sector.
