id: dea:metric-loyalty-member-stay-share-deep-dive
name: Loyalty Member Stay Share (Deep Dive)
type: Metric
description: Loyalty Member Stay Share (Deep Dive) (LMSS-D) measures the retention of customers, users,
  or assets over time in the Hotel & Resort Operations (Deep Dive) domain. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Loyalty
  Room Nights / Total Room Nights, measured in percent (%). Improvement means raising this figure toward
  best-in-class levels. It originates from and is most used in Hospitality practice.
