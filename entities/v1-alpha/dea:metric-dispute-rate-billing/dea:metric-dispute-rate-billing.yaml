id: dea:metric-dispute-rate-billing
name: Dispute Rate (Billing)
type: Metric
description: Dispute Rate (Billing) (DRB) measures exposure to adverse outcomes in the Telecom Customer
  Experience & Billing domain. It is computed as Disputed Charges / Total Billed Amount Events, expressed
  in percent (%). Its use is concentrated in Telecommunications. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: DRB
unit: percent
