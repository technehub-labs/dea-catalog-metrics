id: dea:metric-formaldehyde-emission-compliance
name: Formaldehyde Emission Compliance
type: Metric
description: 'Formaldehyde Emission Compliance (FEC) measures conformance to standards, plans, or obligations
  in the Furniture & Wood Products domain. It is computed as Batches Meeting E1 or Equivalent / Batches
  Tested, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is concentrated in Manufacturing.'
