id: dea:metric-defect-rate
name: Defect Rate
type: Metric
description: 'Defect Rate (DR) addresses the quality of outputs and outcomes and is a fixture of quality
  management reporting. The formula is Defective Units / Total Units - reported in percent (%). It is
  applied across virtually every sector. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Reduction is the goal, and sustained decreases indicate successful intervention.'
