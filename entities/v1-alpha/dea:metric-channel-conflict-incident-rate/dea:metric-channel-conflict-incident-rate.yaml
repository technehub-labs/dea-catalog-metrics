id: dea:metric-channel-conflict-incident-rate
name: Channel Conflict Incident Rate
type: Metric
description: A Channel & Distribution Management indicator, Channel Conflict Incident Rate (CCIR) quantifies
  exposure to adverse outcomes. Its calculation is Formal Channel Conflict Cases per Period, measured
  in count (items per period). It is applied across virtually every sector. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: CCIR
unit: count
