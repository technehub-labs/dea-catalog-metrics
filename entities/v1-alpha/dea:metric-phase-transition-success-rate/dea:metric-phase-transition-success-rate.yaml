id: dea:metric-phase-transition-success-rate
name: Phase Transition Success Rate
type: Metric
description: A Pharma R&D & Clinical Trials indicator, Phase Transition Success Rate (PTSR) quantifies
  how effectively a process or entity achieves its intended outcome. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Compounds Advancing
  to Next Phase / Compounds in Phase - reported in percent (%). Improvement means raising this figure
  toward best-in-class levels. It is a standard measure in the Pharmaceuticals sector.
abbreviation: PTSR
unit: percent
