id: dea:metric-aircraft-utilization
name: Aircraft Utilization
type: Metric
description: A Airlines & Aviation indicator, Aircraft Utilization (ACU) quantifies the utilization or
  availability of capacity. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Block Hours Flown / Aircraft Days Available; the result is stated
  in hours. Improvement means raising this figure toward best-in-class levels. In Airlines & aviation,
  it is a recognized element of the standard performance toolkit.
abbreviation: ACU
unit: hour
