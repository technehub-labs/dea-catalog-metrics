id: dea:metric-customer-delivery-window-compliance
name: Customer Delivery Window Compliance
type: Metric
description: Within Parcel & Last-Mile Logistics (Deep Dive), Customer Delivery Window Compliance (CDWC)
  is used to gauge the quality of outputs and outcomes. Its calculation is Deliveries within Promised
  Window / Deliveries, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Logistics & Trade practice.
