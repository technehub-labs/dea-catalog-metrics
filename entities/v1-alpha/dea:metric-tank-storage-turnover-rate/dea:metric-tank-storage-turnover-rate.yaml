id: dea:metric-tank-storage-turnover-rate
name: Tank Storage Turnover Rate
type: Metric
description: A Oil & Gas Downstream & Refining indicator, Tank Storage Turnover Rate (TSTR) quantifies
  the utilization or availability of capacity. It is defined as Annual Throughput / Average Tank Inventory;
  the result is stated in times per period. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. Higher values are better; gains are read as improvement and
  losses as deterioration. In Oil & Gas, it is a recognized element of the standard performance toolkit.
