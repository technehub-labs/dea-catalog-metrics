id: dea:metric-escaped-defect-rate-per-sprint
name: Escaped Defect Rate per Sprint
type: Metric
description: Escaped Defect Rate per Sprint (EDR-AG) measures the quality of outputs and outcomes in the
  Agile Delivery & Team Effectiveness domain. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Production Defects Attributed to Sprint / Sprint
  Deliverables - reported in events per thousand or million (scaled). It should be driven down, since
  lower readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
