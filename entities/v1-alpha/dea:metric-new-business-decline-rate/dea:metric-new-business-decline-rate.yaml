id: dea:metric-new-business-decline-rate
name: New Business Decline Rate
type: Metric
description: Within Insurance Underwriting, New Business Decline Rate (NBDR) is used to gauge exposure
  to adverse outcomes. It is computed as Risks Declined / Risks Submitted, expressed in percent (%). Its
  use is concentrated in Insurance. It is reviewed at cadence by planning owners to correct course before
  issues become strategic. Values outside the intended band, on either side, warrant investigation.
