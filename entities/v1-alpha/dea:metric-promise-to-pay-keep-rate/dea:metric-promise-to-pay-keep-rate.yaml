id: dea:metric-promise-to-pay-keep-rate
name: Promise-to-Pay Keep Rate
type: Metric
description: 'A Accounts Payable & Receivable Operations (Deep Dive) indicator, Promise-to-Pay Keep Rate
  (PTPKR) quantifies the quality of outputs and outcomes. The formula is Kept Payment Promises / Promises
  Made - reported in percent (%). It is applied across virtually every sector. It is monitored close to
  the work: teams act on it within a shift, sprint, or daily review. It should be maximized within the
  limits of cost and quality trade-offs.'
