id: dea:metric-search-success-rate-knowledge
name: Search Success Rate (Knowledge)
type: Metric
description: 'Search Success Rate (Knowledge) (SSRK) measures how efficiently resources are converted
  into outputs in the Knowledge Management (Deep Dive) domain. It is defined as Sessions Resolved without
  Human Help / Search Sessions; the result is stated in percent (%). It is a working-level control: thresholds
  trigger immediate operational response. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
