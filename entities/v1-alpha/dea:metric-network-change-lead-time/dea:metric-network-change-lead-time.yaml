id: dea:metric-network-change-lead-time
name: Network Change Lead Time
type: Metric
description: 'Network Change Lead Time (NCLT) measures how efficiently resources are converted into outputs
  in the Network Change & Configuration Management domain. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. The formula is Days from Change Request to Implementation
  - reported in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
