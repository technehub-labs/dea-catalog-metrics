id: dea:metric-blind-spot-review-frequency
name: Blind Spot Review Frequency
type: Metric
description: A Emerging Risk & Horizon Scanning indicator, Blind Spot Review Frequency (BSRF) quantifies
  governance. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Formal Unknown-Risk Reviews per Year - reported in count (items per period).
  The objective is neither maximization nor minimization but staying within an agreed operating band.
  Practitioners in nearly any industry can adopt it directly.
