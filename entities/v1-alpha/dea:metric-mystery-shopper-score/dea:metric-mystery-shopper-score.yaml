id: dea:metric-mystery-shopper-score
name: Mystery Shopper Score
type: Metric
description: Mystery Shopper Score (MSS) captures the quality of outputs and outcomes for organizations
  tracking customer. It is defined as Average Audit Score across Mystery Shopper Evaluations; the result
  is stated in score (points). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
