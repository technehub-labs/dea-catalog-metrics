id: dea:metric-occupancy-rate-cruise
name: Occupancy Rate (Cruise)
type: Metric
description: Occupancy Rate (Cruise) (ORC-S) addresses the utilization or availability of capacity and
  is a fixture of cruise & passenger shipping reporting. Its calculation is Passengers / Double Occupancy
  Berths, measured in percent (%). It originates from and is most used in Hospitality practice. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: ORC-S
unit: percent
