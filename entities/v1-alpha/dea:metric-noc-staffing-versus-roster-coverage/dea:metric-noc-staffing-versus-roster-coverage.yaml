id: dea:metric-noc-staffing-versus-roster-coverage
name: NOC Staffing versus Roster Coverage
type: Metric
description: 'NOC Staffing versus Roster Coverage (NSVRC) measures the utilization or availability of
  capacity in the Network Operations Center (Deep Dive) domain. The formula is Shifts Fully Covered /
  Shifts Scheduled - reported in percent (%). It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
