id: dea:metric-internet-facing-critical-exposure-time
name: Internet-Facing Critical Exposure Time
type: Metric
description: Internet-Facing Critical Exposure Time (IFCET) measures exposure to adverse outcomes in the
  Vulnerability & Exposure Management domain. The formula is Hours Critical Vulnerability Remains Internet-Exposed
  - reported in hours. It is applied across virtually every sector. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
