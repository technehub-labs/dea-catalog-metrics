calculation_definition: Risks with Assigned Owner and Appetite / Total Risks
formula_definition:
  formula_id: dea:formula-enterprise-risk-coverage
  expression: ERC = Risks with Assigned Owner and Appetite / Total Risks
  inputs:
  - name: Risks with Assigned Owner and Appetite
  - name: Total Risks
