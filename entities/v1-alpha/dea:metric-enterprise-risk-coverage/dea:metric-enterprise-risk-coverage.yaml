id: dea:metric-enterprise-risk-coverage
name: Enterprise Risk Coverage
type: Metric
description: 'A Risk & Compliance indicator, Enterprise Risk Coverage (ERC) quantifies conformance to
  standards, plans, or obligations. It is computed as Risks with Assigned Owner and Appetite / Total Risks,
  expressed in percent (%). It is applied across virtually every sector. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It should be maximized within the
  limits of cost and quality trade-offs.'
abbreviation: ERC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- governance
purpose_classification:
- compliance
scope_classification:
