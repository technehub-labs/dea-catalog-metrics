id: dea:metric-speaker-and-session-evaluation-score
name: Speaker and Session Evaluation Score
type: Metric
description: Within Events & Exhibitions, Speaker and Session Evaluation Score (SSES) is used to gauge
  the quality of outputs and outcomes. It is computed as Average Session Rating, expressed in score (points).
  Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is concentrated
  in Media & Entertainment.
