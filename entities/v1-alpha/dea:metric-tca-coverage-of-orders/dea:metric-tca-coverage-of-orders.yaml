id: dea:metric-tca-coverage-of-orders
name: TCA Coverage of Orders
type: Metric
description: Within Investment Research & Trading Operations, TCA Coverage of Orders (TCACO) is used to
  gauge capability maturity or development. It is defined as Orders with Transaction Cost Analysis / Orders;
  the result is stated in percent (%). In Financial Services, it is a recognized element of the standard
  performance toolkit. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
