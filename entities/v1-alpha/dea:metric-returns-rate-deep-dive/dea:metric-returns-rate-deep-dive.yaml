id: dea:metric-returns-rate-deep-dive
name: Returns Rate (Deep Dive)
type: Metric
description: Returns Rate (Deep Dive) (RETDD) addresses the quality of outputs and outcomes and is a fixture
  of retail standard measures reporting. It is computed as Returned Value / Gross Sales, expressed in
  percent (%). Its use is concentrated in Retail & E-commerce. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: RETDD
unit: percent
