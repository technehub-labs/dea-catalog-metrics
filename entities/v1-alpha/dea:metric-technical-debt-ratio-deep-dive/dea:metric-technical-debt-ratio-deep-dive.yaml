id: dea:metric-technical-debt-ratio-deep-dive
name: Technical Debt Ratio (Deep Dive)
type: Metric
description: 'Technical Debt Ratio (Deep Dive) (TDR-SA) captures exposure to adverse outcomes for organizations
  tracking software architecture & technical design. It is computed as Remediation Cost / Development
  Cost, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is
  not sector-specific; it appears in cross-industry performance frameworks.'
