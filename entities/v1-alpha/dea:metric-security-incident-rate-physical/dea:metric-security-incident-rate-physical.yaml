id: dea:metric-security-incident-rate-physical
name: Security Incident Rate (Physical)
type: Metric
description: Within Physical Security Operations, Security Incident Rate (Physical) (SIRP) is used to
  gauge exposure to adverse outcomes. It is defined as Security Incidents per Site per Period; the result
  is stated in ratio (x:1 or x). It is applied across virtually every sector. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. Reduction is the goal, and sustained
  decreases indicate successful intervention.
