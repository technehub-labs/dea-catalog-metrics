id: dea:metric-gym-utilization-at-peak-deep-dive
name: Gym Utilization at Peak (Deep Dive)
type: Metric
description: Within Fitness & Wellness (Deep Dive), Gym Utilization at Peak (Deep Dive) (GUP-D) is used
  to gauge the utilization or availability of capacity. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Peak Attendees / Usable Capacity,
  expressed in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Its use is concentrated in Health & Fitness.
abbreviation: GUP-D
