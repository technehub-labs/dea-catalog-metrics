id: dea:metric-makeready-time
name: Makeready Time
type: Metric
description: 'Within Printing & Publishing, Makeready Time (MKT) is used to gauge how efficiently resources
  are converted into outputs. It is a working-level control: thresholds trigger immediate operational
  response. It is defined as Minutes to Set Up Job to Approved Standard; the result is stated in minutes.
  It should be driven down, since lower readings signal healthier performance. In Printing & publishing,
  it is a recognized element of the standard performance toolkit.'
abbreviation: MKT
unit: minute
