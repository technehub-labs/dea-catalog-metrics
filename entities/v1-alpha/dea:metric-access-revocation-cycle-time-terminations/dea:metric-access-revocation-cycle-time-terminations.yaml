id: dea:metric-access-revocation-cycle-time-terminations
name: Access Revocation Cycle Time - Terminations
type: Metric
description: Within Identity & Access Management Operations, Access Revocation Cycle Time - Terminations
  (ARCTT) is used to gauge exposure to adverse outcomes. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Hours from Termination
  to Access Revoked, measured in hours. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
