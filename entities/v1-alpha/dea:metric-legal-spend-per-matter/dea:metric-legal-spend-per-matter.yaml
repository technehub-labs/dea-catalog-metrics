id: dea:metric-legal-spend-per-matter
name: Legal Spend per Matter
type: Metric
description: Within Legal, Legal Spend per Matter (LSPM) is used to gauge how efficiently resources are
  converted into outputs. Its value drives prioritization and resource reallocation among competing initiatives.
  Its calculation is Total Legal Cost / Matters Handled, measured in currency per unit. It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: LSPM
unit: currency
