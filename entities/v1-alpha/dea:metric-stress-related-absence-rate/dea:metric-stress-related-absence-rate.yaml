id: dea:metric-stress-related-absence-rate
name: Stress-Related Absence Rate
type: Metric
description: Stress-Related Absence Rate (SAR-E) measures exposure to adverse outcomes in the Employee
  Wellbeing domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is Stress-Related Absence Days / Total Absence Days, measured
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: SAR-E
unit: percent
