id: dea:metric-cost-per-transaction-shared-services
name: Cost per Transaction (Shared Services)
type: Metric
description: Cost per Transaction (Shared Services) (CPT-G) addresses how efficiently resources are converted
  into outputs and is a fixture of shared services & global business services reporting. It is defined
  as Total Service Cost / Transactions Processed; the result is stated in currency per unit. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Lower values are
  better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: CPT-G
