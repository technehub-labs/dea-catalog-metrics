id: dea:metric-decision-cycle-time-deep-dive
name: Decision Cycle Time (Deep Dive)
type: Metric
description: Decision Cycle Time (Deep Dive) (DCTDD) addresses how efficiently resources are converted
  into outputs and is a fixture of operating model & process health deep dive reporting. It is defined
  as Days from Decision Request to Decision Made; the result is stated in days. It is applied across virtually
  every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: DCTDD
