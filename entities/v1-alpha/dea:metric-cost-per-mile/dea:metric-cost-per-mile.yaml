id: dea:metric-cost-per-mile
name: Cost per Mile
type: Metric
description: 'Cost per Mile (CPM) addresses how efficiently resources are converted into outputs and is
  a fixture of logistics & transportation reporting. The formula is Total Transport Cost / Total Miles
  - reported in currency per unit. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. Lower values are better; each reduction is an improvement. It is a
  standard measure in the Logistics sector.'
