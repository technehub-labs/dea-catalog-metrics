id: dea:metric-design-qa-defect-density
name: Design QA Defect Density
type: Metric
description: 'Design QA Defect Density (DQDD) captures the quality of outputs and outcomes for organizations
  tracking ux & design systems. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. The formula is Design QA Issues Found per Screen Delivered - reported in ratio (x:1
  or x). It should be driven down, since lower readings signal healthier performance. Practitioners in
  nearly any industry can adopt it directly.'
