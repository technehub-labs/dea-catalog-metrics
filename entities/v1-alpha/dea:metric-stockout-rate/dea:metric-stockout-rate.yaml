id: dea:metric-stockout-rate
name: Stockout Rate
type: Metric
description: A Supply Chain indicator, Stockout Rate (SOR) quantifies exposure to adverse outcomes. It
  is defined as Stockout Events / Total Demand Events; the result is stated in percent (%). It bridges
  daily operations and executive reporting, giving managers a lever to pull within a quarter. Lower values
  are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: SOR
unit: percent
