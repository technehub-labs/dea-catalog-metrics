id: dea:metric-payables-turnover-ratio-deep-dive
name: Payables Turnover Ratio (Deep Dive)
type: Metric
description: 'Payables Turnover Ratio (Deep Dive) (PTRDD) captures how efficiently resources are converted
  into outputs for organizations tracking financial statement analysis ratios (deep dive). It is a working-level
  control: thresholds trigger immediate operational response. It is defined as Cost of Sales / Average
  Payables; the result is stated in ratio (x:1 or x). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: PTRDD
