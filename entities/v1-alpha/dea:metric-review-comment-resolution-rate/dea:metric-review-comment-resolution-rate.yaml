id: dea:metric-review-comment-resolution-rate
name: Review Comment Resolution Rate
type: Metric
description: 'Review Comment Resolution Rate (RCR-PR) addresses the quality of outputs and outcomes and
  is a fixture of code review & peer quality reporting. The formula is Comments Resolved before Merge
  / Comments Raised - reported in percent (%). It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Higher values are better; gains are read as improvement and losses
  as deterioration. It is a standard measure in the Software sector.'
abbreviation: RCR-PR
unit: percent
