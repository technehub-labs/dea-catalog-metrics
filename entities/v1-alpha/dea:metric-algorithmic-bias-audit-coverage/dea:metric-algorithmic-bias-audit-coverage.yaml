id: dea:metric-algorithmic-bias-audit-coverage
name: Algorithmic Bias Audit Coverage
type: Metric
description: A AI Ethics, Fairness & Responsible AI indicator, Algorithmic Bias Audit Coverage (ABAC)
  quantifies exposure to adverse outcomes. Its calculation is High-Risk Models Audited for Bias / High-Risk
  Models, measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
