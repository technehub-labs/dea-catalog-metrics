measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Negative Articles / Total Articles Monitored
formula_definition:
  formula_id: dea:formula-share-of-negative-coverage
  expression: SNC = Negative Articles / Total Articles Monitored
  inputs:
  - name: Negative Articles
  - name: Total Articles Monitored
