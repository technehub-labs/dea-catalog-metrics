id: dea:metric-share-of-negative-coverage
name: Share of Negative Coverage
type: Metric
description: 'Share of Negative Coverage (SNC) addresses exposure to adverse outcomes and is a fixture
  of corporate communications & pr reporting. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. The formula is Negative Articles / Total Articles Monitored
  - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
abbreviation: SNC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
