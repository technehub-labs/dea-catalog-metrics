id: dea:metric-roaming-revenue-per-user
name: Roaming Revenue per User
type: Metric
description: Roaming Revenue per User (RRPU) captures the economic value created or preserved for organizations
  tracking telecom product & bundle management. Its calculation is Roaming Revenue / Roaming-Eligible
  Subscribers, measured in currency per unit. Its value drives prioritization and resource reallocation
  among competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Telecommunications practice.
