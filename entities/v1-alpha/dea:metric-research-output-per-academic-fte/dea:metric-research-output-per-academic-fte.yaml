id: dea:metric-research-output-per-academic-fte
name: Research Output per Academic FTE
type: Metric
description: A Education & Training Outcome Standard Measures indicator, Research Output per Academic
  FTE (ROAF) quantifies capability maturity or development. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Peer-Reviewed Outputs / Academic
  FTE - reported in events per thousand or million (scaled). The objective is neither maximization nor
  minimization but staying within an agreed operating band. It is a standard measure in the Education
  sector.
