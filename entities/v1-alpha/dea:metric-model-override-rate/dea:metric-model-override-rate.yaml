id: dea:metric-model-override-rate
name: Model Override Rate
type: Metric
description: A AI Governance & Model Risk Management indicator, Model Override Rate (MOR-AI) quantifies
  exposure to adverse outcomes. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is Human Overrides of Model Output / Model Decisions, measured in percent
  (%). The objective is neither maximization nor minimization but staying within an agreed operating band.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: MOR-AI
unit: percent
