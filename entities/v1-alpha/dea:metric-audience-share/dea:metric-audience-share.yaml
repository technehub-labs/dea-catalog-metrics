id: dea:metric-audience-share
name: Audience Share
type: Metric
description: Audience Share (ASH) measures growth over time in the Media & Entertainment domain. The formula
  is Audience for Property / Total Category Audience - reported in percent (%). It is a standard measure
  in the Media & entertainment sector. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. It should be maximized within the limits of cost and quality
  trade-offs.
