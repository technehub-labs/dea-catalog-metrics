id: dea:metric-cost-per-content-hour-gaming
name: Cost per Content Hour (Gaming)
type: Metric
description: Cost per Content Hour (Gaming) (CPCH) addresses how efficiently resources are converted into
  outputs and is a fixture of gaming development & live operations reporting. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Its calculation
  is Development Cost / Playable Hours Delivered, measured in currency per unit. It should be driven down,
  since lower readings signal healthier performance. It originates from and is most used in Gaming practice.
abbreviation: CPCH
unit: currency
