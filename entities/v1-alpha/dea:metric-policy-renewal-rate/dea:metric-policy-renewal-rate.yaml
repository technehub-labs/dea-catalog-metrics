id: dea:metric-policy-renewal-rate
name: Policy Renewal Rate
type: Metric
description: Policy Renewal Rate (PoRR) addresses the retention of customers, users, or assets over time
  and is a fixture of insurance reporting. It is computed as Policies Renewed / Policies Due for Renewal,
  expressed in percent (%). Its use is concentrated in Insurance. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It should be maximized within the limits of
  cost and quality trade-offs.
abbreviation: PoRR
unit: percent
