id: dea:metric-dei-representation-trend-deep-dive
name: DEI Representation Trend (Deep Dive)
type: Metric
description: DEI Representation Trend (Deep Dive) (DEIRT-D) captures the engagement or satisfaction of
  the people involved for organizations tracking balanced scorecard - learning & growth perspective. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. The
  formula is Change in Representation Metrics between Periods - reported in percent (%). The objective
  is neither maximization nor minimization but staying within an agreed operating band. Practitioners
  in nearly any industry can adopt it directly.
