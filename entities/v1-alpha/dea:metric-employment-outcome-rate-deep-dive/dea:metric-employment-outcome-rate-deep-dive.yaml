id: dea:metric-employment-outcome-rate-deep-dive
name: Employment Outcome Rate (Deep Dive)
type: Metric
description: A Education & Training (Deep Dive) indicator, Employment Outcome Rate (Deep Dive) (EOR-D)
  quantifies how effectively a process or entity achieves its intended outcome. The formula is Graduates
  Employed in Field / Graduates - reported in percent (%). It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Higher values are better; gains are read as
  improvement and losses as deterioration. It is a standard measure in the Education sector.
