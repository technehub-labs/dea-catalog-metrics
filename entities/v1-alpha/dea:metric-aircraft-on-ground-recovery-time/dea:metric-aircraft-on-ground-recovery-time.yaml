id: dea:metric-aircraft-on-ground-recovery-time
name: Aircraft on Ground Recovery Time
type: Metric
description: 'Aircraft on Ground Recovery Time (AOGRT) addresses how efficiently resources are converted
  into outputs and is a fixture of aviation maintenance repair & overhaul reporting. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Hours from AOG Event to Release to Service, expressed in hours. It should be driven down, since lower
  readings signal healthier performance. Its use is concentrated in Airlines & aviation.'
abbreviation: AOGRT
unit: hour
version: 1.1.0
