id: dea:metric-service-level-calls-answered-in-threshold-seconds
name: Service Level - Calls Answered in Threshold Seconds
type: Metric
description: Service Level - Calls Answered in Threshold Seconds (SLDD) measures conformance to standards,
  plans, or obligations in the Contact Center Standard Measures (Deep Dive) domain. Its calculation is
  Calls Answered within Threshold / Calls Offered, measured in percent (%). It is applied across virtually
  every sector. It provides the day-to-day signal that a process is running as designed. It should be
  maximized within the limits of cost and quality trade-offs.
