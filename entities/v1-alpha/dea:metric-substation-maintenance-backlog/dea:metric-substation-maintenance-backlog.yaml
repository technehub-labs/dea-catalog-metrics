id: dea:metric-substation-maintenance-backlog
name: Substation Maintenance Backlog
type: Metric
description: Substation Maintenance Backlog (SMB) addresses exposure to adverse outcomes and is a fixture
  of utilities field operations & grid reporting. It is defined as Overdue Maintenance Tasks / Total Tasks;
  the result is stated in percent (%). In Utilities, it is a recognized element of the standard performance
  toolkit. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. Reduction is the goal, and sustained decreases indicate successful intervention.
