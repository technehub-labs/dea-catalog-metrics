id: dea:metric-payment-exception-rate
name: Payment Exception Rate
type: Metric
description: 'Payment Exception Rate (PER-AP) addresses the quality of outputs and outcomes and is a fixture
  of accounts payable & receivable operations (deep dive) reporting. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Payments Requiring Manual Exception
  Handling / Payments - reported in percent (%). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.'
