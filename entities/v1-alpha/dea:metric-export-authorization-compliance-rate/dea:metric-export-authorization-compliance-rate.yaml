id: dea:metric-export-authorization-compliance-rate
name: Export Authorization Compliance Rate
type: Metric
description: 'Export Authorization Compliance Rate (EACR) measures conformance to standards, plans, or
  obligations in the Aerospace & Defense Program Management domain. It is computed as Transfers with Valid
  Authorization / Transfers, expressed in percent (%). Its use is concentrated in Aerospace & Defense.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
