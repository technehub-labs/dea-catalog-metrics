id: dea:metric-project-handover-on-time-rate
name: Project Handover On-Time Rate
type: Metric
description: Project Handover On-Time Rate (PHOT) captures conformance to standards, plans, or obligations
  for organizations tracking construction & engineering. The formula is Projects Handed Over on Schedule
  / Projects Completed - reported in percent (%). It is a standard measure in the Construction & engineering
  sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
