id: dea:metric-altman-z-score
name: Altman Z-Score
type: Metric
description: Within Valuation & Corporate Finance Standard Measures, Altman Z-Score (ALTZ) is used to
  gauge exposure to adverse outcomes. It is defined as Composite Discriminant of Liquidity, Profitability,
  Leverage Ratios; the result is stated in score (points). Its trend is watched by senior leadership as
  an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
