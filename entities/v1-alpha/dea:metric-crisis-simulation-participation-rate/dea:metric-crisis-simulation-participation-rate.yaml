id: dea:metric-crisis-simulation-participation-rate
name: Crisis Simulation Participation Rate
type: Metric
description: 'Crisis Simulation Participation Rate (CSPR-BC) addresses capability maturity or development
  and is a fixture of business continuity & disaster recovery reporting. The formula is Teams Participating
  in Annual Simulation / Teams in Scope - reported in percent (%). It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
