id: dea:metric-click-and-collect-on-time-ready-rate
name: Click-and-Collect On-Time Ready Rate
type: Metric
description: 'Click-and-Collect On-Time Ready Rate (CCTR) addresses the quality of outputs and outcomes
  and is a fixture of retail standard measures reporting. The formula is Orders Ready by Promised Time
  / Orders - reported in percent (%). It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Higher values are better; gains are read as improvement and losses as deterioration.
  It is a standard measure in the Retail & E-commerce sector.'
