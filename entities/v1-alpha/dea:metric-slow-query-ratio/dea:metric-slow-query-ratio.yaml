id: dea:metric-slow-query-ratio
name: Slow Query Ratio
type: Metric
description: 'Within Database & Data Platform Operations, Slow Query Ratio (SQR-DB) is used to gauge the
  quality of outputs and outcomes. It is defined as Queries Exceeding Latency Budget / Total Queries;
  the result is stated in percent (%). It is a working-level control: thresholds trigger immediate operational
  response. Lower values are better; each reduction is an improvement. In Software, it is a recognized
  element of the standard performance toolkit.'
