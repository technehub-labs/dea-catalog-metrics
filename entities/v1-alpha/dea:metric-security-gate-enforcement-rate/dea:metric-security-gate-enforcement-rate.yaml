id: dea:metric-security-gate-enforcement-rate
name: Security Gate Enforcement Rate
type: Metric
description: Within DevSecOps & Application Security Engineering, Security Gate Enforcement Rate (SGER)
  is used to gauge conformance to standards, plans, or obligations. Its calculation is Releases Blocked
  by Security Gate when Threshold Exceeded / Threshold Events, measured in percent (%). It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Higher values are
  better; gains are read as improvement and losses as deterioration. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.
