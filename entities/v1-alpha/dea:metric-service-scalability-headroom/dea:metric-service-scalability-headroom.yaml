id: dea:metric-service-scalability-headroom
name: Service Scalability Headroom
type: Metric
description: A Software Architecture & Technical Design indicator, Service Scalability Headroom (SSH-SA)
  quantifies the utilization or availability of capacity. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Peak Load / Designed Capacity
  - reported in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: SSH-SA
unit: percent
