id: dea:metric-haccp-compliance-rate
name: HACCP Compliance Rate
type: Metric
description: Within Food & Beverage Manufacturing, HACCP Compliance Rate (HCR) is used to gauge conformance
  to standards, plans, or obligations. It is defined as HACCP Checks Passed / Checks Performed; the result
  is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  In Food & Beverage, it is a recognized element of the standard performance toolkit.
