id: dea:metric-takeout-and-delivery-mix-deep-dive
name: Takeout and Delivery Mix (Deep Dive)
type: Metric
description: Takeout and Delivery Mix (Deep Dive) (TDM-D) captures growth over time for organizations
  tracking restaurant operations (deep dive). The formula is Off-Premise Revenue / Total Revenue - reported
  in percent (%). It is a standard measure in the Restaurants sector. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. Values outside the intended band,
  on either side, warrant investigation.
