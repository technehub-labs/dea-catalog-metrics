id: dea:metric-service-level-attainment
name: Service Level Attainment
type: Metric
description: A IT Service Management indicator, Service Level Attainment (SLA-T) quantifies conformance
  to standards, plans, or obligations. It is computed as Incidents Resolved within SLA / Total Incidents,
  expressed in percent (%). It is reviewed at cadence by planning owners to correct course before issues
  become strategic. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SLA-T
unit: percent
