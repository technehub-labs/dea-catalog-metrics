id: dea:metric-threat-intel-feed-actionability-rate
name: Threat Intel Feed Actionability Rate
type: Metric
description: A Threat Intelligence & Red Team indicator, Threat Intel Feed Actionability Rate (TIFAR)
  quantifies the economic value created or preserved. It is computed as Intel Items Triggering Defensive
  Action / Items Consumed, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: TIFAR
