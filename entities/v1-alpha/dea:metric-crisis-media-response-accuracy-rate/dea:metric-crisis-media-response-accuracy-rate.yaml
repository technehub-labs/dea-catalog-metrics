id: dea:metric-crisis-media-response-accuracy-rate
name: Crisis Media Response Accuracy Rate
type: Metric
description: Within Crisis Management & Emergency Response, Crisis Media Response Accuracy Rate (CMRAR)
  is used to gauge the quality of outputs and outcomes. Its calculation is Public Statements Requiring
  Correction / Statements, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Reduction
  is the goal, and sustained decreases indicate successful intervention.
