id: dea:metric-equipment-availability-mining
name: Equipment Availability (Mining)
type: Metric
description: Within Mining & Metals, Equipment Availability (Mining) (EA-M) is used to gauge the utilization
  or availability of capacity. It bridges daily operations and executive reporting, giving managers a
  lever to pull within a quarter. It is defined as Available Equipment Hours / Scheduled Hours; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. In Mining
  & metals, it is a recognized element of the standard performance toolkit.
abbreviation: EA-M
