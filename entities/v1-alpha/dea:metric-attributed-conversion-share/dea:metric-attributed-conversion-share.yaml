id: dea:metric-attributed-conversion-share
name: Attributed Conversion Share
type: Metric
description: Attributed Conversion Share (ACS) measures the quality of outputs and outcomes in the Marketing
  Attribution & Analytics domain. Its calculation is Conversions with Attribution Confidence / Total Conversions,
  measured in percent (%). Its value drives prioritization and resource reallocation among competing initiatives.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: ACS
unit: percent
