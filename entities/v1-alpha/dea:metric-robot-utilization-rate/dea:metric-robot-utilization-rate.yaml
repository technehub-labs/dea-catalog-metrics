id: dea:metric-robot-utilization-rate
name: Robot Utilization Rate
type: Metric
description: Robot Utilization Rate (RUR-I) captures the utilization or availability of capacity for organizations
  tracking industrial automation & robotics. It is defined as Robot Productive Hours / Robot Available
  Hours; the result is stated in percent (%). It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. Higher values are better; gains are read as improvement and
  losses as deterioration. In Manufacturing, it is a recognized element of the standard performance toolkit.
abbreviation: RUR-I
unit: percent
