id: dea:metric-toil-to-work-ratio
name: Toil-to-Work Ratio
type: Metric
description: Within Observability & Site Reliability Engineering, Toil-to-Work Ratio (T2WR) is used to
  gauge how efficiently resources are converted into outputs. The formula is Toil Hours / Total Engineering
  Hours - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Lower values are better; each reduction is an improvement. Its use is
  not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: T2WR
unit: percent
