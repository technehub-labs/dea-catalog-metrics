id: dea:metric-api-breaking-change-rate
name: API Breaking Change Rate
type: Metric
description: API Breaking Change Rate (APBCR) captures exposure to adverse outcomes for organizations
  tracking software architecture & technical design. Its calculation is Breaking Changes per API Version,
  measured in count (items per period). It is applied across virtually every sector. Its value drives
  prioritization and resource reallocation among competing initiatives. Reduction is the goal, and sustained
  decreases indicate successful intervention.
