id: dea:metric-schedule-performance-index-programs
name: Schedule Performance Index (Programs)
type: Metric
description: Schedule Performance Index (Programs) (SPI-P) addresses how efficiently resources are converted
  into outputs and is a fixture of aerospace & defense program management reporting. Its calculation is
  EV / PV, measured in ratio (x:1 or x). It originates from and is most used in Aerospace & Defense practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
