id: dea:metric-empty-miles-rate
name: Empty Miles Rate
type: Metric
description: Empty Miles Rate (EMR) measures how efficiently resources are converted into outputs in the
  Logistics & Transportation domain. Its calculation is Empty Miles / Total Miles, measured in percent
  (%). Its value drives prioritization and resource reallocation among competing initiatives. Lower values
  are better; each reduction is an improvement. It originates from and is most used in Logistics practice.
abbreviation: EMR
unit: percent
version: 1.1.0
lifecycle_status: candidate
