id: dea:metric-medication-adherence-proportion-of-days-covered
name: Medication Adherence - Proportion of Days Covered
type: Metric
description: Medication Adherence - Proportion of Days Covered (PDC) measures the quality of outputs and
  outcomes in the Medical Practice & Clinical Operations domain. The formula is Days Covered by Dispensed
  Medication / Observation Days - reported in percent (%). It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Higher values are better; gains are read as
  improvement and losses as deterioration. It is a standard measure in the Healthcare sector.
