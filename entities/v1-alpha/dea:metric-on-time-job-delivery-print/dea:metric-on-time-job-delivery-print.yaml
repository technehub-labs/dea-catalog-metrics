id: dea:metric-on-time-job-delivery-print
name: On-Time Job Delivery (Print)
type: Metric
description: Within Printing & Publishing, On-Time Job Delivery (Print) (OTJD) is used to gauge the quality
  of outputs and outcomes. It is defined as Jobs Delivered by Promised Date / Jobs; the result is stated
  in percent (%). In Printing & publishing, it is a recognized element of the standard performance toolkit.
  It bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  It should be maximized within the limits of cost and quality trade-offs.
