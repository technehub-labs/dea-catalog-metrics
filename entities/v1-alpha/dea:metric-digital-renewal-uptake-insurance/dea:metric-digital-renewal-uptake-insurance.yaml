id: dea:metric-digital-renewal-uptake-insurance
name: Digital Renewal Uptake (Insurance)
type: Metric
description: Within Insurance Distribution - Direct & Digital, Digital Renewal Uptake (Insurance) (DRU-I)
  is used to gauge how efficiently resources are converted into outputs. Its calculation is Renewals Completed
  Digitally / Renewals, measured in percent (%). Its value drives prioritization and resource reallocation
  among competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Insurance practice.
