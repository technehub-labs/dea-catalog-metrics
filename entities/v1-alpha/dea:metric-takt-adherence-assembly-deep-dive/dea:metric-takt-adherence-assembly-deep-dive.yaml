id: dea:metric-takt-adherence-assembly-deep-dive
name: Takt Adherence (Assembly Deep Dive)
type: Metric
description: 'Within Automotive Manufacturing (Deep Dive), Takt Adherence (Assembly Deep Dive) (TA-D)
  is used to gauge how efficiently resources are converted into outputs. It is defined as Stations Completing
  within Takt / Stations; the result is stated in percent (%). It is a working-level control: thresholds
  trigger immediate operational response. Higher values are better; gains are read as improvement and
  losses as deterioration. In Automotive, it is a recognized element of the standard performance toolkit.'
