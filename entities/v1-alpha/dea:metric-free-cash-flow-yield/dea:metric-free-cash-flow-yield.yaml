id: dea:metric-free-cash-flow-yield
name: Free Cash Flow Yield
type: Metric
description: Free Cash Flow Yield (FCFY) captures the economic value created or preserved for organizations
  tracking valuation & corporate finance standard measures. It is defined as Free Cash Flow / Enterprise
  Value; the result is stated in percent (%). It is applied across virtually every sector. Its trend is
  watched by senior leadership as an early signal of structural performance shifts. It should be maximized
  within the limits of cost and quality trade-offs.
