id: dea:metric-average-revenue-per-user
name: Average Revenue per User
type: Metric
description: Average Revenue per User (ARPU) addresses the economic value created or preserved and is
  a fixture of banking & financial services reporting. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Total Revenue / Average
  Active Users, measured in currency per unit. Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Financial services practice.
abbreviation: ARPU
unit: currency
