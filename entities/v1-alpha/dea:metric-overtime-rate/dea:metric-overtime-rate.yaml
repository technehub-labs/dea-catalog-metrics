id: dea:metric-overtime-rate
name: Overtime Rate
type: Metric
description: 'A Human Resources indicator, Overtime Rate (OTR) quantifies the utilization or availability
  of capacity. The formula is Overtime Hours / Total Paid Hours - reported in percent (%). It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Lower values are better;
  each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: OTR
unit: percent
