id: dea:metric-fan-engagement-rate-digital-sports
name: Fan Engagement Rate (Digital Sports)
type: Metric
description: Fan Engagement Rate (Digital Sports) (FER-S) measures the engagement or satisfaction of the
  people involved in the Sports Clubs & Leagues (Deep Dive) domain. It is computed as Engaged Digital
  Fans / Follower Base, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is concentrated in Sports.
abbreviation: FER-S
unit: percent
