id: dea:metric-fund-inflow-rate
name: Fund Inflow Rate
type: Metric
description: 'Fund Inflow Rate (FIR) addresses growth over time and is a fixture of investment management
  reporting. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. It is computed as Net New Investor Flows / Assets under Management, expressed in percent
  (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated in Asset
  management.'
abbreviation: FIR
unit: percent
