id: dea:metric-api-error-rate-deep-dive
name: API Error Rate (Deep Dive)
type: Metric
description: 'API Error Rate (Deep Dive) (APIER) addresses the quality of outputs and outcomes and is
  a fixture of api lifecycle management reporting. It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. The formula is 4xx+5xx Responses / Total API Responses - reported
  in percent (%). It should be driven down, since lower readings signal healthier performance. It is a
  standard measure in the Software sector.'
abbreviation: APIER
unit: percent
version: 1.0.1
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- quality
scope_classification:
- organizational_unit
directionality: lower_is_better
