source_credit: Public domain - no attribution required
calculation_definition: 4xx+5xx Responses / Total API Responses
formula_definition:
  formula_id: dea:formula-api-error-rate-deep-dive
  expression: 4xx+5xx Responses / Total API Responses
  inputs:
