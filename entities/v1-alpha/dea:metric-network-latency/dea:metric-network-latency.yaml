id: dea:metric-network-latency
name: Network Latency
type: Metric
description: 'A Telecommunications indicator, Network Latency (NL) quantifies the quality of outputs and
  outcomes. It is a working-level control: thresholds trigger immediate operational response. It is defined
  as Median Round-Trip Delay of Packets; the result is stated in seconds. It should be driven down, since
  lower readings signal healthier performance. In Telecommunications, it is a recognized element of the
  standard performance toolkit.'
abbreviation: NL
unit: second
