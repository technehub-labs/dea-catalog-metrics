id: dea:metric-customer-average-interruption-duration-index-deep-dive
name: Customer Average Interruption Duration Index (Deep Dive)
type: Metric
description: Customer Average Interruption Duration Index (Deep Dive) (CAIDI) captures the quality of
  outputs and outcomes for organizations tracking utilities field operations & grid. Its value drives
  prioritization and resource reallocation among competing initiatives. Its calculation is SAIDI / SAIFI,
  measured in minutes. It should be driven down, since lower readings signal healthier performance. It
  originates from and is most used in Utilities practice.
