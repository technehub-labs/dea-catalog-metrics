id: dea:metric-tariff-complexity-complaint-rate
name: Tariff Complexity Complaint Rate
type: Metric
description: 'Tariff Complexity Complaint Rate (TCCR) measures the quality of outputs and outcomes in
  the Telecom Product & Bundle Management domain. The formula is Pricing Complaints / 1,000 Customers
  - reported in events per thousand or million (scaled). It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Telecommunications sector.'
