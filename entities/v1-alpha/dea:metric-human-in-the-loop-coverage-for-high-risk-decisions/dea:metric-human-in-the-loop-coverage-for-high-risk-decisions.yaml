id: dea:metric-human-in-the-loop-coverage-for-high-risk-decisions
name: Human-in-the-Loop Coverage for High-Risk Decisions
type: Metric
description: 'Human-in-the-Loop Coverage for High-Risk Decisions (HITC) addresses exposure to adverse
  outcomes and is a fixture of ai governance & model risk management reporting. It is computed as High-Risk
  Decision Points with Human Review / High-Risk Points, expressed in percent (%). It is applied across
  virtually every sector. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: HITC
unit: percent
version: 1.1.0
