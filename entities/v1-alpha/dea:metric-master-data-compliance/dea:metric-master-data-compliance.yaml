calculation_definition: Records Meeting Governance Standards / Total Records
formula_definition:
  formula_id: dea:formula-master-data-compliance
  expression: MDC = Records Meeting Governance Standards / Total Records
  inputs:
  - name: Records Meeting Governance Standards
  - name: Total Records
