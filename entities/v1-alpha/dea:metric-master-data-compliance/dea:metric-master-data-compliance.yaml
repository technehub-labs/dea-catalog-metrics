id: dea:metric-master-data-compliance
name: Master Data Compliance
type: Metric
description: 'Master Data Compliance (MDC) captures conformance to standards, plans, or obligations for
  organizations tracking data management & analytics. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Records Meeting Governance Standards
  / Total Records - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: MDC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- information_architecture
purpose_classification:
