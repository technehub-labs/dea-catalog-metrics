id: dea:metric-cycle-time-line-yield
name: Cycle Time Line Yield
type: Metric
description: Cycle Time Line Yield (CTLY) addresses the quality of outputs and outcomes and is a fixture
  of semiconductor & electronics reporting. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Units Completing All Process Steps / Units Started,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Its use
  is concentrated in Electronics & semiconductors.
