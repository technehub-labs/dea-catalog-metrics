id: dea:metric-warehouse-capacity-utilization
name: Warehouse Capacity Utilization
type: Metric
description: A Warehousing indicator, Warehouse Capacity Utilization (WCU) quantifies the utilization
  or availability of capacity. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is Occupied Storage Space / Total Storage Space, measured in percent (%).
  The objective is neither maximization nor minimization but staying within an agreed operating band.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: WCU
unit: percent
