id: dea:metric-email-open-rate
name: Email Open Rate
type: Metric
description: Email Open Rate (EOR) captures the engagement or satisfaction of the people involved for
  organizations tracking marketing. It is computed as Email Opens / Emails Delivered, expressed in percent
  (%). Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: EOR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- engagement
scope_classification:
- capability
directionality: higher_is_better
management_significance:
- operational
measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Email Opens / Emails Delivered
formula_definition:
  formula_id: dea:formula-email-open-rate
  expression: EOR = Email Opens / Emails Delivered
  inputs:
  - name: Email Opens
  - name: Emails Delivered
