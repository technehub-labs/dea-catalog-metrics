id: dea:metric-perfect-order-rate-deep-dive
name: Perfect Order Rate (Deep Dive)
type: Metric
description: 'Perfect Order Rate (Deep Dive) (PORD) measures the quality of outputs and outcomes in the
  Supply Chain Standard Measures (Deep Dive) domain. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Orders Perfect on Time, Quality,
  Quantity, Documentation / Orders, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: PORD
unit: percent
version: 1.1.0
