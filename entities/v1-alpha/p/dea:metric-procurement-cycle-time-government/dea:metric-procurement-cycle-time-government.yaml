id: dea:metric-procurement-cycle-time-government
name: Procurement Cycle Time (Government)
type: Metric
description: Within Government & Public Administration, Procurement Cycle Time (Government) (PCT-G) is
  used to gauge how efficiently resources are converted into outputs. Its calculation is Days from Requisition
  to Contract Award, measured in days. It originates from and is most used in Public Sector practice.
  Its value drives prioritization and resource reallocation among competing initiatives. Reduction is
  the goal, and sustained decreases indicate successful intervention.
abbreviation: PCT-G
unit: day
