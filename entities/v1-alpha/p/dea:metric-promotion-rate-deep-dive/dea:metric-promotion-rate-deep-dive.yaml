id: dea:metric-promotion-rate-deep-dive
name: Promotion Rate (Deep Dive)
type: Metric
description: 'A Standard Workforce & Pay Metrics indicator, Promotion Rate (Deep Dive) (PRDD) quantifies
  capability maturity or development. It is computed as Promotions / Average Headcount, expressed in percent
  (%). It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: PRDD
unit: percent
version: 1.1.0
lifecycle_status: candidate
