id: dea:metric-partnership-revenue-share
name: Partnership Revenue Share
type: Metric
description: Partnership Revenue Share (PRS) measures growth over time in the Corporate Venturing & Partnerships
  domain. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  The formula is Partner-Attributed Revenue / Total Revenue - reported in percent (%). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PRS
unit: percent
