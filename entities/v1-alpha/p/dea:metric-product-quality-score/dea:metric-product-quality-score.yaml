id: dea:metric-product-quality-score
name: Product-Quality Score
type: Metric
description: Product-Quality Score (PQS) addresses the quality of outputs and outcomes and is a fixture
  of product management reporting. The formula is Weighted Index of Defects, Performance, Satisfaction
  - reported in index (0-100 or normalized). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PQS
