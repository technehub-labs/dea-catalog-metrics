id: dea:metric-promotion-parity-ratio
name: Promotion Parity Ratio
type: Metric
description: Within Diversity, Equity & Inclusion, Promotion Parity Ratio (PPR) is used to gauge conformance
  to standards, plans, or obligations. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Promotion Rate of Underrepresented Group / Promotion
  Rate Overall, measured in ratio (x:1 or x). The objective is neither maximization nor minimization but
  staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: PPR
unit: ratio
