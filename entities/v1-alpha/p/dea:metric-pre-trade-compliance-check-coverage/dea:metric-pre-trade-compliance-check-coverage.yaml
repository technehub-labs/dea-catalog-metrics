description: 'Within Investment Risk & Middle Office Operations, Pre-Trade Compliance Check Coverage (PTCCC)
  is used to gauge conformance to standards, plans, or obligations. The formula is Orders Screened Pre-Trade
  / Orders - reported in percent (%). It is a standard measure in the Investment management sector. It
  is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should be
  maximized within the limits of cost and quality trade-offs.'
