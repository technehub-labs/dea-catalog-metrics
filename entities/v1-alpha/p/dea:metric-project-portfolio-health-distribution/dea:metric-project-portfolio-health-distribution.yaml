id: dea:metric-project-portfolio-health-distribution
name: Project Portfolio Health Distribution
type: Metric
description: A Project Management (Deep Dive) indicator, Project Portfolio Health Distribution (PPHD)
  quantifies exposure to adverse outcomes. Its calculation is Green Projects / Total Projects, measured
  in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PPHD
unit: percent
