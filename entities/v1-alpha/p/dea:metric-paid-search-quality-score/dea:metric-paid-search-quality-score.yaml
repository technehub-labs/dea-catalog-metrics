id: dea:metric-paid-search-quality-score
name: Paid Search Quality Score
type: Metric
description: Paid Search Quality Score (QS) captures the quality of outputs and outcomes for organizations
  tracking marketing. Its calculation is Average Ad Relevance and Landing Page Quality Rating, measured
  in score (points). It provides the day-to-day signal that a process is running as designed. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
