id: dea:metric-protocol-deviation-rate
name: Protocol Deviation Rate
type: Metric
description: 'Protocol Deviation Rate (PDR-P) measures conformance to standards, plans, or obligations
  in the Pharma R&D & Clinical Trials domain. The formula is Deviations / Subjects Enrolled - reported
  in percent (%). It guides mid-horizon planning: portfolio, program, and function owners act on it between
  review cycles. Lower values are better; each reduction is an improvement. It is a standard measure in
  the Pharmaceuticals sector.'
abbreviation: PDR-P
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
- compliance
scope_classification:
- capability
directionality: lower_is_better
management_significance:
- managerial
measurable_entity_kind: dea:OrganizationalUnit
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Deviations / Subjects Enrolled
formula_definition:
  formula_id: dea:formula-protocol-deviation-rate
  expression: PDR-P = Deviations / Subjects Enrolled
  inputs:
  - name: Deviations
  - name: Subjects Enrolled
