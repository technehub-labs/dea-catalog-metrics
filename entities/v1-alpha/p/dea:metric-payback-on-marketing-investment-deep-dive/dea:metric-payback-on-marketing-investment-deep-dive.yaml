id: dea:metric-payback-on-marketing-investment-deep-dive
name: Payback on Marketing Investment (Deep Dive)
type: Metric
description: Payback on Marketing Investment (Deep Dive) (PROMID) captures the economic value created
  or preserved for organizations tracking unit economics & growth (deep dive). It is computed as Attributed
  Gross Profit / Marketing Spend, expressed in ratio (x:1 or x). Its use is concentrated in Software.
  It is reviewed at cadence by planning owners to correct course before issues become strategic. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: PROMID
unit: ratio
version: 1.1.0
