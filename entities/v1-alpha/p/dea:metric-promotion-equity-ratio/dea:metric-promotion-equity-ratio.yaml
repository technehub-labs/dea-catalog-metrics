id: dea:metric-promotion-equity-ratio
name: Promotion Equity Ratio
type: Metric
description: Promotion Equity Ratio (PER-DEI) measures capability maturity or development in the Diversity,
  Equity & Inclusion (Deep Dive) domain. Its calculation is Promotion Rates of Underrepresented vs Overall
  Population, measured in ratio (x:1 or x). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
