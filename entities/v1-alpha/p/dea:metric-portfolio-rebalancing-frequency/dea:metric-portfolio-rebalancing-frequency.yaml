id: dea:metric-portfolio-rebalancing-frequency
name: Portfolio Rebalancing Frequency
type: Metric
description: 'Portfolio Rebalancing Frequency (PRF-PPM) captures conformance to standards, plans, or obligations
  for organizations tracking program & portfolio management. It is computed as Quarterly Rebalance Decisions
  Executed / Required, expressed in times per period. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
abbreviation: PRF-PPM
