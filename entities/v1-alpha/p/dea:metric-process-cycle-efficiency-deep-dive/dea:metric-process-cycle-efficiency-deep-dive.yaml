id: dea:metric-process-cycle-efficiency-deep-dive
name: Process Cycle Efficiency (Deep Dive)
type: Metric
description: Process Cycle Efficiency (Deep Dive) (PCED) captures how efficiently resources are converted
  into outputs for organizations tracking operating model & process health deep dive. Its calculation
  is Value-Added Time / Total Lead Time, measured in percent (%). It provides the day-to-day signal that
  a process is running as designed. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PCED
unit: percent
version: 1.1.0
lifecycle_status: candidate
