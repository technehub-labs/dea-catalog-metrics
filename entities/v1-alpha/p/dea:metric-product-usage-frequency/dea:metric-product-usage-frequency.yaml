id: dea:metric-product-usage-frequency
name: Product Usage Frequency
type: Metric
description: A Customer Success (B2B SaaS) indicator, Product Usage Frequency (PUF) quantifies the engagement
  or satisfaction of the people involved. It is defined as Active Usage Days / Eligible Days per Account;
  the result is stated in percent (%). In Software & SaaS, it is a recognized element of the standard
  performance toolkit. It bridges daily operations and executive reporting, giving managers a lever to
  pull within a quarter. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: PUF
unit: percent
version: 1.1.0
lifecycle_status: candidate
