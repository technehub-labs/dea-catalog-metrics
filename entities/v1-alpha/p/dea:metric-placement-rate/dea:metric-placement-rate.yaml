id: dea:metric-placement-rate
name: Placement Rate
type: Metric
description: Placement Rate (PLR) measures how effectively a process or entity achieves its intended outcome
  in the Staffing & Recruiting domain. The formula is Placements / Open Mandates - reported in percent
  (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Higher values are better; gains are read as improvement and losses as deterioration. It is a standard
  measure in the Staffing & recruiting sector.
abbreviation: PLR
unit: percent
version: 1.1.0
lifecycle_status: candidate
