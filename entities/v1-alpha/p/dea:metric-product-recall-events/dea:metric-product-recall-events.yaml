id: dea:metric-product-recall-events
name: Product Recall Events
type: Metric
description: A Agriculture & Food Processing indicator, Product Recall Events (PRE) quantifies exposure
  to adverse outcomes. The formula is Food Product Recalls per Period - reported in count (items per period).
  It is a standard measure in the Agriculture & food sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases
  indicate successful intervention.
