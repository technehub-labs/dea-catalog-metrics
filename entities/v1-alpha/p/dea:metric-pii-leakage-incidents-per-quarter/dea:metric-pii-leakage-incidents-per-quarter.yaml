id: dea:metric-pii-leakage-incidents-per-quarter
name: PII Leakage Incidents per Quarter
type: Metric
description: 'A Generative AI & LLM Operations indicator, PII Leakage Incidents per Quarter (PIILQ) quantifies
  exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Incidents of Personal Data in Prompts or Outputs, expressed
  in count (items per period). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
