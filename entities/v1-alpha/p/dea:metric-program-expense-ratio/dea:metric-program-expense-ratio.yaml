id: dea:metric-program-expense-ratio
name: Program Expense Ratio
type: Metric
description: A Nonprofit & NGO indicator, Program Expense Ratio (PER-N) quantifies conformance to standards,
  plans, or obligations. The formula is Program Service Expenses / Total Expenses - reported in percent
  (%). It is a standard measure in the Nonprofit & NGO sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It should be maximized within the limits of
  cost and quality trade-offs.
abbreviation: PER-N
unit: percent
