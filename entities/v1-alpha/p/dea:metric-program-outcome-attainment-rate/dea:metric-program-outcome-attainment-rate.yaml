id: dea:metric-program-outcome-attainment-rate
name: Program Outcome Attainment Rate
type: Metric
description: Within Government & Public Administration, Program Outcome Attainment Rate (POAR) is used
  to gauge how effectively a process or entity achieves its intended outcome. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Programs Meeting
  Outcome Targets / Programs - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Public Sector sector.
abbreviation: POAR
unit: percent
version: 1.1.0
