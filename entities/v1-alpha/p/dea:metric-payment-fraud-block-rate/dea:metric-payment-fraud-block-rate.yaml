id: dea:metric-payment-fraud-block-rate
name: Payment Fraud Block Rate
type: Metric
description: Payment Fraud Block Rate (PFBR) addresses exposure to adverse outcomes and is a fixture of
  enterprise fraud & financial crime management reporting. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Fraudulent Payment Attempts Blocked / Attempts Detected,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: PFBR
unit: percent
