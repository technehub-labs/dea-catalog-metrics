id: dea:metric-port-dwell-time
name: Port Dwell Time
type: Metric
description: Port Dwell Time (PDT) measures how efficiently resources are converted into outputs in the
  Maritime & Shipping domain. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Days from Vessel Arrival to Departure, expressed in days.
  It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Maritime & shipping.
abbreviation: PDT
unit: day
