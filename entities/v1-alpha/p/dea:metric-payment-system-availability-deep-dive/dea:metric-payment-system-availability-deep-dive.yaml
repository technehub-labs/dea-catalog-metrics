id: dea:metric-payment-system-availability-deep-dive
name: Payment System Availability (Deep Dive)
type: Metric
description: Within Payments & Cards (Deep Dive), Payment System Availability (Deep Dive) (PSA-D) is used
  to gauge the utilization or availability of capacity. The formula is Available Minutes / Required Minutes
  - reported in percent (%). It is a standard measure in the Payments sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: PSA-D
unit: percent
version: 1.1.0
