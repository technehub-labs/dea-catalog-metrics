id: dea:metric-proactive-fault-detection-ratio
name: Proactive Fault Detection Ratio
type: Metric
description: Within Telecom Network Operations (Deep Dive), Proactive Fault Detection Ratio (PFDR-N) is
  used to gauge capability maturity or development. Its calculation is Faults Detected Proactively / Total
  Faults, measured in percent (%). It originates from and is most used in Telecommunications practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: PFDR-N
unit: percent
