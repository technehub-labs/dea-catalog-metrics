id: dea:metric-process-maturity-score-deep-dive
name: Process Maturity Score (Deep Dive)
type: Metric
description: Process Maturity Score (Deep Dive) (PMSD) measures capability maturity or development in
  the Operating Model & Process Health Deep Dive domain. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is CMMI-Style Maturity Rating
  across Core Processes, measured in score (points). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PMSD
