id: dea:metric-pulse-survey-trend-stability
name: Pulse Survey Trend Stability
type: Metric
description: 'Within Employee Engagement & Culture (Deep Dive), Pulse Survey Trend Stability (PSTS) is
  used to gauge the quality of outputs and outcomes. The formula is Variance of Pulse Scores across Periods
  - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. It is managed toward a defined target band rather than an extreme - both
  overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
