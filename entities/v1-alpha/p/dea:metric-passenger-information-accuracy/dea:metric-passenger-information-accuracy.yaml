id: dea:metric-passenger-information-accuracy
name: Passenger Information Accuracy
type: Metric
description: 'Passenger Information Accuracy (PIA-T) measures the quality of outputs and outcomes in the
  Public Transit (Deep Dive) domain. The formula is Real-Time Predictions within Tolerance / Predictions
  - reported in percent (%). It is a standard measure in the Public Transit sector. It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. It should be maximized within
  the limits of cost and quality trade-offs.'
abbreviation: PIA-T
unit: percent
