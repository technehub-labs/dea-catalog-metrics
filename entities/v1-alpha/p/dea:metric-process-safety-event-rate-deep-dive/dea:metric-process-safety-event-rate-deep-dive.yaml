id: dea:metric-process-safety-event-rate-deep-dive
name: Process Safety Event Rate (Deep Dive)
type: Metric
description: Process Safety Event Rate (Deep Dive) (PSER-D) captures exposure to adverse outcomes for
  organizations tracking chemicals & specialty materials. It is defined as Tier 1 and 2 Process Safety
  Events per 200,000 Hours; the result is stated in events per thousand or million (scaled). In Chemicals,
  it is a recognized element of the standard performance toolkit. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Reduction is the goal, and sustained decreases
  indicate successful intervention.
