id: dea:metric-passenger-throughput-per-gate
name: Passenger Throughput per Gate
type: Metric
description: Passenger Throughput per Gate (PTPG) measures the utilization or availability of capacity
  in the Airport Operations domain. It is computed as Passengers Processed / Gates per Period, expressed
  in ratio (x:1 or x). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Airports.
abbreviation: PTPG
unit: ratio
