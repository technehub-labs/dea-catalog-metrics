id: dea:metric-post-implementation-review-coverage
name: Post-Implementation Review Coverage
type: Metric
description: Post-Implementation Review Coverage (PIRC) addresses the economic value created or preserved
  and is a fixture of pmo & portfolio governance reporting. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Closed Initiatives with PIR
  / Closed Initiatives - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PIRC
unit: percent
