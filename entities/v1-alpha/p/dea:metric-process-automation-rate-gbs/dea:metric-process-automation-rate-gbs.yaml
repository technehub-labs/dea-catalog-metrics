source_credit: Public domain - no attribution required
calculation_definition: Automated Process Steps / Total Process Steps
formula_definition:
  formula_id: dea:formula-process-automation-rate-gbs
  expression: PAR-G = Automated Process Steps / Total Process Steps
  inputs:
  - name: Automated Process Steps
  - name: Total Process Steps
