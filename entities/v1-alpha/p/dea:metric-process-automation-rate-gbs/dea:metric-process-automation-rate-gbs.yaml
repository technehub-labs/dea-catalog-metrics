id: dea:metric-process-automation-rate-gbs
name: Process Automation Rate (GBS)
type: Metric
description: Process Automation Rate (GBS) (PAR-G) captures capability maturity or development for organizations
  tracking shared services & global business services. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Automated Process Steps
  / Total Process Steps, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PAR-G
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- business_architecture
purpose_classification:
