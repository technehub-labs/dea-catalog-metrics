id: dea:metric-patch-compliance-rate
name: Patch Compliance Rate
type: Metric
description: Patch Compliance Rate (PCR-VM) measures conformance to standards, plans, or obligations in
  the Vulnerability & Exposure Management domain. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Assets Fully Patched per Policy
  / Assets, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: PCR-VM
unit: percent
