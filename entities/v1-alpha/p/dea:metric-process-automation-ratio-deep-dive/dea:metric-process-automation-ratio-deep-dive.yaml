id: dea:metric-process-automation-ratio-deep-dive
name: Process Automation Ratio (Deep Dive)
type: Metric
description: Process Automation Ratio (Deep Dive) (PAR-D) addresses how efficiently resources are converted
  into outputs and is a fixture of balanced scorecard - internal process perspective reporting. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. It is defined as
  Automated Steps / Total Process Steps; the result is stated in percent (%). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PAR-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
