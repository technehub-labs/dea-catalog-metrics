id: dea:metric-portfolio-value-delivery-rate
name: Portfolio Value Delivery Rate
type: Metric
description: Portfolio Value Delivery Rate (PVDR) measures the economic value created or preserved in
  the Program & Portfolio Management domain. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Value Realized / Portfolio Investment,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: PVDR
unit: percent
version: 1.1.0
