id: dea:metric-plan-to-actual-bridge-granularity-score
name: Plan-to-Actual Bridge Granularity Score
type: Metric
description: Within Financial Planning & Analysis, Plan-to-Actual Bridge Granularity Score (PBGRS) is
  used to gauge the quality of outputs and outcomes. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Rubric of Variance Explanatory Detail, measured in score
  (points). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly
  any industry can adopt it directly.
