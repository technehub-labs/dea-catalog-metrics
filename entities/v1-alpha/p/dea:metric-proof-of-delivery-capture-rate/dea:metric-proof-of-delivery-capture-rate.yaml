id: dea:metric-proof-of-delivery-capture-rate
name: Proof of Delivery Capture Rate
type: Metric
description: Within Parcel & Last-Mile Logistics (Deep Dive), Proof of Delivery Capture Rate (PODR) is
  used to gauge conformance to standards, plans, or obligations. Its calculation is Deliveries with Electronic
  POD / Deliveries, measured in percent (%). It provides the day-to-day signal that a process is running
  as designed. Higher values are better; gains are read as improvement and losses as deterioration. It
  originates from and is most used in Logistics & Trade practice.
abbreviation: PODR
unit: percent
