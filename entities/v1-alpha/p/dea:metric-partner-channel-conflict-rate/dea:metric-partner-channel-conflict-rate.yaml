id: dea:metric-partner-channel-conflict-rate
name: Partner Channel Conflict Rate
type: Metric
description: A Corporate Venturing & Partnerships indicator, Partner Channel Conflict Rate (PCCR) quantifies
  exposure to adverse outcomes. Its calculation is Disputed Partner Transactions / Partner Transactions,
  measured in percent (%). It is applied across virtually every sector. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: PCCR
unit: percent
