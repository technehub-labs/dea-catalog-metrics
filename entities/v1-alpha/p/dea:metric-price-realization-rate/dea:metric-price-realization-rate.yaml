id: dea:metric-price-realization-rate
name: Price Realization Rate
type: Metric
description: Price Realization Rate (PRR-P) measures the economic value created or preserved in the Pricing
  & Revenue Management domain. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Actual Average Selling Price / List or Target
  Price, measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: PRR-P
unit: percent
version: 1.1.0
