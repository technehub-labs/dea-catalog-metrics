id: dea:metric-patent-portfolio-growth-rate
name: Patent Portfolio Growth Rate
type: Metric
description: Patent Portfolio Growth Rate (PPGR) captures growth over time for organizations tracking
  intellectual property & licensing. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Net New Patents Filed per Period, measured in
  percent (%). The objective is neither maximization nor minimization but staying within an agreed operating
  band. Practitioners in nearly any industry can adopt it directly.
abbreviation: PPGR
unit: percent
version: 1.1.0
