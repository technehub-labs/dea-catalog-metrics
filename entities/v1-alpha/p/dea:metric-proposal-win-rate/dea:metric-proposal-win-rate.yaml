id: dea:metric-proposal-win-rate
name: Proposal Win Rate
type: Metric
description: 'Within Professional Services, Proposal Win Rate (PWR) is used to gauge growth over time.
  It is computed as Proposals Won / Proposals Submitted, expressed in percent (%). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is concentrated in Professional services.'
abbreviation: PWR
unit: percent
version: 1.1.0
lifecycle_status: candidate
