id: dea:metric-procurement-cycle-time
name: Procurement Cycle Time
type: Metric
description: 'Procurement Cycle Time (PCT-P) measures how efficiently resources are converted into outputs
  in the Procurement domain. The formula is Days from Requisition to Purchase Order Issue - reported in
  days. It is monitored close to the work: teams act on it within a shift, sprint, or daily review. Lower
  values are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: PCT-P
unit: day
version: 1.1.0
