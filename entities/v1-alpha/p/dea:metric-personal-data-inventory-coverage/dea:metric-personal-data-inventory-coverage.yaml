id: dea:metric-personal-data-inventory-coverage
name: Personal Data Inventory Coverage
type: Metric
description: 'Personal Data Inventory Coverage (PDIC) addresses conformance to standards, plans, or obligations
  and is a fixture of data privacy & protection reporting. It is computed as Processing Activities Documented
  in ROPA / Identified Activities, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: PDIC
unit: percent
version: 1.1.0
lifecycle_status: candidate
