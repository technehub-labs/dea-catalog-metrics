id: dea:metric-phishing-click-rate
name: Phishing Click Rate
type: Metric
description: Phishing Click Rate (PCR) captures exposure to adverse outcomes for organizations tracking
  cybersecurity. It is defined as Users Clicking Simulated Phish / Users Targeted; the result is stated
  in percent (%). It is applied across virtually every sector. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: PCR
unit: percent
