id: dea:metric-panel-size-per-provider
name: Panel Size per Provider
type: Metric
description: 'Panel Size per Provider (PSP) addresses the utilization or availability of capacity and
  is a fixture of medical practice & clinical operations reporting. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. The formula is Active Patients / Full-Time
  Provider - reported in count (items per period). The objective is neither maximization nor minimization
  but staying within an agreed operating band. It is a standard measure in the Healthcare sector.'
abbreviation: PSP
unit: count
version: 1.1.0
lifecycle_status: candidate
