id: dea:metric-preferred-supplier-share-travel
name: Preferred Supplier Share (Travel)
type: Metric
description: Within Corporate Travel Management, Preferred Supplier Share (Travel) (PSS) is used to gauge
  the economic value created or preserved. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Bookings with Preferred Suppliers / Total Bookings, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: PSS
unit: percent
version: 1.1.0
