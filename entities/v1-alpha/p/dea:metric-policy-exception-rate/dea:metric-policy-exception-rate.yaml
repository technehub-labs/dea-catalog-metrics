source_credit: Public domain - no attribution required
calculation_definition: Policy Exceptions Granted / Policy Applications
formula_definition:
  formula_id: dea:formula-policy-exception-rate
  expression: PER-O = Policy Exceptions Granted / Policy Applications
  inputs:
  - name: Policy Exceptions Granted
  - name: Policy Applications
