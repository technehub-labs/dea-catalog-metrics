id: dea:metric-policy-exception-rate
name: Policy Exception Rate
type: Metric
description: 'Policy Exception Rate (PER-O) captures conformance to standards, plans, or obligations for
  organizations tracking operating model & decision effectiveness. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. The formula is Policy Exceptions Granted
  / Policy Applications - reported in percent (%). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: PER-O
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
- compliance
scope_classification:
- organizational_unit
directionality: lower_is_better
management_significance:
