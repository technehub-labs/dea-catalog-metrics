id: dea:metric-packaging-reduction-rate
name: Packaging Reduction Rate
type: Metric
description: Packaging Reduction Rate (PKR) captures environmental and social sustainability performance
  for organizations tracking sustainability & esg. It is computed as (Packaging_prior - Packaging_current)
  / Packaging_prior, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PKR
unit: percent
version: 1.1.0
lifecycle_status: candidate
