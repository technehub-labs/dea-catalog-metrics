id: dea:metric-process-capability-index-cpk
name: Process Capability Index (Cpk)
type: Metric
description: A Process Capability & Six Sigma (Deep Dive) indicator, Process Capability Index (Cpk) (CPKS)
  quantifies the quality of outputs and outcomes. It is computed as Min Distance of Mean to Spec Limit
  / (3 x Std Dev), expressed in ratio (x:1 or x). Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is concentrated in Manufacturing.
abbreviation: CPKS
