id: dea:metric-patch-to-deploy-lag-dependencies
name: Patch-to-Deploy Lag (Dependencies)
type: Metric
description: Patch-to-Deploy Lag (Dependencies) (PTDL) addresses exposure to adverse outcomes and is a
  fixture of application security (appsec) reporting. It is computed as Days from Patch Release to Dependency
  Deployed, expressed in days. Its use is concentrated in Software. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: PTDL
unit: day
