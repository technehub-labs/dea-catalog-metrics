id: dea:metric-program-risk-exposure-index
name: Program Risk Exposure Index
type: Metric
description: 'Within Aerospace & Defense Program Management, Program Risk Exposure Index (PREI) is used
  to gauge exposure to adverse outcomes. It is computed as Weighted Risk Exposure Score, expressed in
  index (0-100 or normalized). Its use is concentrated in Aerospace & Defense. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
