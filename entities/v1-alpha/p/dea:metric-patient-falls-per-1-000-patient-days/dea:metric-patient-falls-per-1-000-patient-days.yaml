id: dea:metric-patient-falls-per-1-000-patient-days
name: Patient Falls per 1,000 Patient Days
type: Metric
description: 'Within Medical Practice & Clinical Operations, Patient Falls per 1,000 Patient Days (PF1K)
  is used to gauge exposure to adverse outcomes. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. The formula is Reported Falls / Patient Days x 1,000
  - reported in events per thousand or million (scaled). It should be driven down, since lower readings
  signal healthier performance. It is a standard measure in the Healthcare sector.'
abbreviation: PF1K
unit: event
