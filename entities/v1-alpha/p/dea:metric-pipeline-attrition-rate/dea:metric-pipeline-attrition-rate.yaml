id: dea:metric-pipeline-attrition-rate
name: Pipeline Attrition Rate
type: Metric
description: 'Within Pharma R&D & Clinical Trials, Pipeline Attrition Rate (PAR-P) is used to gauge exposure
  to adverse outcomes. It is computed as Candidates Discontinued / Candidates in Development, expressed
  in percent (%). Its use is concentrated in Pharmaceuticals. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
abbreviation: PAR-P
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
- risk
scope_classification:
- capability
directionality: lower_is_better
management_significance:
- strategic
measurable_entity_kind: dea:OrganizationalUnit
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Candidates Discontinued / Candidates in Development
formula_definition:
  formula_id: dea:formula-pipeline-attrition-rate
  expression: PAR-P = Candidates Discontinued / Candidates in Development
  inputs:
  - name: Candidates Discontinued
  - name: Candidates in Development
