id: dea:metric-monthly-member-churn
name: Monthly Member Churn
type: Metric
description: Monthly Member Churn (MMC-F) measures exposure to adverse outcomes in the Fitness & Wellness
  domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. Its calculation is Members Cancelling in Month / Members at Start, measured in percent
  (%). It should be driven down, since lower readings signal healthier performance. It originates from
  and is most used in Fitness & wellness practice.
