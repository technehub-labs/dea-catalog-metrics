id: dea:metric-saas-quick-ratio-deep-dive
name: SaaS Quick Ratio (Deep Dive)
type: Metric
description: SaaS Quick Ratio (Deep Dive) (SAQRD) captures growth over time for organizations tracking
  unit economics & growth (deep dive). Its calculation is (New + Expansion MRR) / (Churned + Contraction
  MRR), measured in ratio (x:1 or x). It originates from and is most used in Software practice. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: SAQRD
unit: ratio
