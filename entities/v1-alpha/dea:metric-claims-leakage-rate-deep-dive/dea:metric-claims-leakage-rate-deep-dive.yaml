id: dea:metric-claims-leakage-rate-deep-dive
name: Claims Leakage Rate (Deep Dive)
type: Metric
description: 'A Insurance Claims Deep Dive indicator, Claims Leakage Rate (Deep Dive) (CLR-D) quantifies
  the economic value created or preserved. It is computed as Avoidable Claim Costs / Total Claim Costs,
  expressed in percent (%). Its use is concentrated in Insurance. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
