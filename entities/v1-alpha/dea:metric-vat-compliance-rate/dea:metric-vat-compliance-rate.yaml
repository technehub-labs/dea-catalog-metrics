id: dea:metric-vat-compliance-rate
name: VAT Compliance Rate
type: Metric
description: VAT Compliance Rate (VATR) measures conformance to standards, plans, or obligations in the
  Tax & Fiscal domain. It is computed as VAT Returns and Payments On Time / VAT Periods, expressed in
  percent (%). It is applied across virtually every sector. Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. It should be maximized within the limits
  of cost and quality trade-offs.
