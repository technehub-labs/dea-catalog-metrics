id: dea:metric-report-refresh-latency
name: Report Refresh Latency
type: Metric
description: A Data Management & Analytics indicator, Report Refresh Latency (RRL) quantifies how efficiently
  resources are converted into outputs. Its calculation is Time from Source Update to Dashboard Availability,
  measured in hours. It is applied across virtually every sector. It provides the day-to-day signal that
  a process is running as designed. Reduction is the goal, and sustained decreases indicate successful
  intervention.
