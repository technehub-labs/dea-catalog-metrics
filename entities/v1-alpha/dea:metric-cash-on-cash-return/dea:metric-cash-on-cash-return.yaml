id: dea:metric-cash-on-cash-return
name: Cash-on-Cash Return
type: Metric
description: Cash-on-Cash Return (COCR-RE) measures the economic value created or preserved in the Real
  Estate & Mortgage Standard Measures domain. Its calculation is Pre-Tax Cash Flow / Cash Invested, measured
  in percent (%). It originates from and is most used in Real estate practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
