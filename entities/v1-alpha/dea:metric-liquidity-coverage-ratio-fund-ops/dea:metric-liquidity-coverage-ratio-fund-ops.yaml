id: dea:metric-liquidity-coverage-ratio-fund-ops
name: Liquidity Coverage Ratio (Fund Ops)
type: Metric
description: Liquidity Coverage Ratio (Fund Ops) (LCRFO) captures exposure to adverse outcomes for organizations
  tracking investment risk & middle office operations. Its calculation is Liquid Assets within Days /
  Projected Redemptions, measured in ratio (x:1 or x). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. It originates from and is most used in Investment management
  practice.
