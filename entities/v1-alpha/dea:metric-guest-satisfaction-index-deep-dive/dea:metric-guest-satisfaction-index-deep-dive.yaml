id: dea:metric-guest-satisfaction-index-deep-dive
name: Guest Satisfaction Index (Deep Dive)
type: Metric
description: Guest Satisfaction Index (Deep Dive) (GSI-D) addresses the engagement or satisfaction of
  the people involved and is a fixture of hotel & resort operations (deep dive) reporting. The formula
  is Composite Guest Survey Score - reported in index (0-100 or normalized). It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Higher values are better; gains
  are read as improvement and losses as deterioration. It is a standard measure in the Hospitality sector.
