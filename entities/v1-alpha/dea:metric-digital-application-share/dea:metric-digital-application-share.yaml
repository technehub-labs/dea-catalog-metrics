id: dea:metric-digital-application-share
name: Digital Application Share
type: Metric
description: Within Insurance Distribution & Brokerage, Digital Application Share (DAS) is used to gauge
  how efficiently resources are converted into outputs. The formula is Applications Submitted Digitally
  / Total Applications - reported in percent (%). It is a standard measure in the Insurance distribution
  sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
