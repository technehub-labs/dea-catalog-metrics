id: dea:metric-body-in-white-geometry-compliance
name: Body-in-White Geometry Compliance
type: Metric
description: Body-in-White Geometry Compliance (BWGC) captures the quality of outputs and outcomes for
  organizations tracking automotive manufacturing (deep dive). Its calculation is Dimensional Measurements
  in Tolerance / Measurements, measured in percent (%). It originates from and is most used in Automotive
  practice. It provides the day-to-day signal that a process is running as designed. It should be maximized
  within the limits of cost and quality trade-offs.
