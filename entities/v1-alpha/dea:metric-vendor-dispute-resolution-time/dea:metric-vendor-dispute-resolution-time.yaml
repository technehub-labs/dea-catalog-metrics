id: dea:metric-vendor-dispute-resolution-time
name: Vendor Dispute Resolution Time
type: Metric
description: Vendor Dispute Resolution Time (VDRT) addresses how efficiently resources are converted into
  outputs and is a fixture of outsourcing & vendor management reporting. Its calculation is Days from
  Dispute Raised to Resolution, measured in days. It is applied across virtually every sector. Its value
  drives prioritization and resource reallocation among competing initiatives. Reduction is the goal,
  and sustained decreases indicate successful intervention.
