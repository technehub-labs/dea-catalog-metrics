id: dea:metric-average-delivery-lead-time
name: Average Delivery Lead Time
type: Metric
description: Average Delivery Lead Time (ADLT) measures how efficiently resources are converted into outputs
  in the Logistics & Transportation domain. It is defined as Days from Dispatch to Delivery; the result
  is stated in days. In Logistics, it is a recognized element of the standard performance toolkit. It
  bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  Reduction is the goal, and sustained decreases indicate successful intervention.
