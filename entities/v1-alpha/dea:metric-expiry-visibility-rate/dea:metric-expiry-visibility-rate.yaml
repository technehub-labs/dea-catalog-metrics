id: dea:metric-expiry-visibility-rate
name: Expiry Visibility Rate
type: Metric
description: Expiry Visibility Rate (EVR-CL) measures exposure to adverse outcomes in the Contract Lifecycle
  Management domain. It provides the day-to-day signal that a process is running as designed. Its calculation
  is Contracts with Expiry Alerts Configured / Expiring Contracts, measured in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
