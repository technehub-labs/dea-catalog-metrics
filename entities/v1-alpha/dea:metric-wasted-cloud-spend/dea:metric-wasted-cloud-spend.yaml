id: dea:metric-wasted-cloud-spend
name: Wasted Cloud Spend
type: Metric
description: Wasted Cloud Spend (WCS) addresses how efficiently resources are converted into outputs and
  is a fixture of data center & cloud operations reporting. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Unattached or Under-Used
  Resource Spend / Total Cloud Spend, measured in percent (%). It should be driven down, since lower readings
  signal healthier performance. It originates from and is most used in Technology & data centers practice.
abbreviation: WCS
unit: percent
