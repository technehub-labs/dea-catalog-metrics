id: dea:metric-out-of-window-change-detection-rate
name: Out-of-Window Change Detection Rate
type: Metric
description: Out-of-Window Change Detection Rate (OWCDR) addresses conformance to standards, plans, or
  obligations and is a fixture of network change & configuration management reporting. It is computed
  as Unauthorized Changes Detected / Total Changes Audited, expressed in percent (%). It is applied across
  virtually every sector. Front-line and delivery teams watch it in real time, as small deviations demand
  immediate correction. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: OWCDR
unit: percent
