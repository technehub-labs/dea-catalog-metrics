id: dea:metric-concentration-by-counterparty-deep-dive
name: Concentration by Counterparty (Deep Dive)
type: Metric
description: Concentration by Counterparty (Deep Dive) (CBCDD) addresses exposure to adverse outcomes
  and is a fixture of credit & collections risk (enterprise) reporting. Its calculation is Largest Exposure
  / Total Credit Exposure, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Reduction
  is the goal, and sustained decreases indicate successful intervention.
