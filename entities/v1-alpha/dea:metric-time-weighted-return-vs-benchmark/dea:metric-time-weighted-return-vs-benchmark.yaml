id: dea:metric-time-weighted-return-vs-benchmark
name: Time-Weighted Return vs Benchmark
type: Metric
description: Time-Weighted Return vs Benchmark (TWRB) captures the economic value created or preserved
  for organizations tracking investment performance measurement. Its calculation is TWR minus Benchmark
  Return in Period, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Investment management practice.
