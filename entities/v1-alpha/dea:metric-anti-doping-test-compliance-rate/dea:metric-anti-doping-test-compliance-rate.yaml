id: dea:metric-anti-doping-test-compliance-rate
name: Anti-Doping Test Compliance Rate
type: Metric
description: Within Sports Clubs & Leagues (Deep Dive), Anti-Doping Test Compliance Rate (ADTC) is used
  to gauge conformance to standards, plans, or obligations. The formula is Tests Completed per Testing
  Plan / Planned - reported in percent (%). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Sports sector.
