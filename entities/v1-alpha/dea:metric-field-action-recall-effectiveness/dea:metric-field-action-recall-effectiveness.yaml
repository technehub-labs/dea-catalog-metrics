id: dea:metric-field-action-recall-effectiveness
name: Field Action Recall Effectiveness
type: Metric
description: Field Action Recall Effectiveness (FARE) measures exposure to adverse outcomes in the Medical
  Devices domain. The formula is Devices Corrected or Removed / Devices Subject to Field Action - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Medical devices sector.
abbreviation: FARE
unit: percent
version: 1.1.0
