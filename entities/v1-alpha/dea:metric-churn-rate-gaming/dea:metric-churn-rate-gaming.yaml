id: dea:metric-churn-rate-gaming
name: Churn Rate (Gaming)
type: Metric
description: 'Churn Rate (Gaming) (CHR-G) addresses exposure to adverse outcomes and is a fixture of gaming
  reporting. It is computed as Players Lost during Period / Players at Start, expressed in percent (%).
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Lower values are better; each reduction is an improvement. Its use is concentrated in Gaming.'
