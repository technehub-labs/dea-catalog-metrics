id: dea:metric-application-overlap-index
name: Application Overlap Index
type: Metric
description: Within Enterprise Architecture, Application Overlap Index (AOI) is used to gauge the economic
  value created or preserved. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Applications with Duplicated Functionality /
  Total Applications, measured in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: AOI
unit: percent
