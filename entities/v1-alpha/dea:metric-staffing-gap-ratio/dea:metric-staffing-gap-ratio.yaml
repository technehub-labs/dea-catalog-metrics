id: dea:metric-staffing-gap-ratio
name: Staffing Gap Ratio
type: Metric
description: Staffing Gap Ratio (SGR-W) addresses the utilization or availability of capacity and is a
  fixture of workforce planning & analytics reporting. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is (Required Staff - Actual Staff) / Required
  Staff - reported in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: SGR-W
unit: percent
