id: dea:metric-fairness-metric-equal-opportunity-gap
name: Fairness Metric - Equal Opportunity Gap
type: Metric
description: Fairness Metric - Equal Opportunity Gap (FMEOG) measures the quality of outputs and outcomes
  in the AI Ethics, Fairness & Responsible AI domain. The formula is Difference in True Positive Rates
  across Groups - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction is the
  goal, and sustained decreases indicate successful intervention.
