id: dea:metric-asset-wear-out-onset-detection-rate
name: Asset Wear-Out Onset Detection Rate
type: Metric
description: Asset Wear-Out Onset Detection Rate (AWODR) captures exposure to adverse outcomes for organizations
  tracking reliability & maintainability engineering (deep dive). It is defined as Wear-Out Phase Detected
  before Failure / Wear-Out Cases; the result is stated in percent (%). It is applied across virtually
  every sector. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: AWODR
unit: percent
