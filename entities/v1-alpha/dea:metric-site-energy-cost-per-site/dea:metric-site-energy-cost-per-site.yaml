id: dea:metric-site-energy-cost-per-site
name: Site Energy Cost per Site
type: Metric
description: A Telecom Network Operations indicator, Site Energy Cost per Site (SECS) quantifies how efficiently
  resources are converted into outputs. It is computed as Total Network Site Energy Cost / Sites, expressed
  in currency per unit. Its use is concentrated in Telecommunications. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. Reduction is the goal, and sustained decreases
  indicate successful intervention.
