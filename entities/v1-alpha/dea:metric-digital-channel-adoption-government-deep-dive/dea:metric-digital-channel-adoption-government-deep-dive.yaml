id: dea:metric-digital-channel-adoption-government-deep-dive
name: Digital Channel Adoption (Government) (Deep Dive)
type: Metric
description: A Public Sector & Citizen Service Standard Measures (Deep Dive) indicator, Digital Channel
  Adoption (Government) (Deep Dive) (DCADD) quantifies how efficiently resources are converted into outputs.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It is
  defined as Digital Service Transactions / Total Transactions; the result is stated in percent (%). Improvement
  means raising this figure toward best-in-class levels. In Public sector, it is a recognized element
  of the standard performance toolkit.
