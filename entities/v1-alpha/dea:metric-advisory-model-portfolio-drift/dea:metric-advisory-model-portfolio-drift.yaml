id: dea:metric-advisory-model-portfolio-drift
name: Advisory Model Portfolio Drift
type: Metric
description: 'Advisory Model Portfolio Drift (AMPD) addresses conformance to standards, plans, or obligations
  and is a fixture of wealth management reporting. The formula is Client Allocations Deviating beyond
  Tolerance / Client Allocations - reported in percent (%). It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Wealth management sector.'
abbreviation: AMPD
