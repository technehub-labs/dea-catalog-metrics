id: dea:metric-attack-surface-reduction-rate
name: Attack Surface Reduction Rate
type: Metric
description: A DevSecOps & Application Security Engineering indicator, Attack Surface Reduction Rate (ASRR-DSO)
  quantifies exposure to adverse outcomes. It is defined as Deprecated or Exposed Endpoints Removed per
  Quarter; the result is stated in count (items per period). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
