id: dea:metric-windshield-time-ratio
name: Windshield Time Ratio
type: Metric
description: 'Within Field Maintenance & Technical Field Service (Deep Dive), Windshield Time Ratio (WSTR-F)
  is used to gauge how efficiently resources are converted into outputs. The formula is Travel Hours /
  Total Field Hours - reported in percent (%). It is applied across virtually every sector. It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
