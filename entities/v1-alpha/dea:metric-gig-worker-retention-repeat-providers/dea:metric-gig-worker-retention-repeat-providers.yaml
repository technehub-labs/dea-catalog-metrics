id: dea:metric-gig-worker-retention-repeat-providers
name: Gig Worker Retention (Repeat Providers)
type: Metric
description: Within Gig & Contingent Workforce, Gig Worker Retention (Repeat Providers) (GWR) is used
  to gauge the retention of customers, users, or assets over time. Its calculation is Workers Completing
  Repeat Tasks / Workers Onboarded, measured in percent (%). Its value drives prioritization and resource
  reallocation among competing initiatives. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: GWR
unit: percent
