id: dea:metric-dividend-payout-ratio-deep-dive
name: Dividend Payout Ratio (Deep Dive)
type: Metric
description: Dividend Payout Ratio (Deep Dive) (DPRDD) measures the economic value created or preserved
  in the Valuation & Corporate Finance Standard Measures domain. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Dividends / Net Income - reported
  in percent (%). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.
