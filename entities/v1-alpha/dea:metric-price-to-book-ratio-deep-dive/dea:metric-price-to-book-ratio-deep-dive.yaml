id: dea:metric-price-to-book-ratio-deep-dive
name: Price-to-Book Ratio (Deep Dive)
type: Metric
description: Price-to-Book Ratio (Deep Dive) (PTBDD) measures the economic value created or preserved
  in the Valuation & Corporate Finance Standard Measures domain. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Market Price / Book Value per
  Share - reported in ratio (x:1 or x). The objective is neither maximization nor minimization but staying
  within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
