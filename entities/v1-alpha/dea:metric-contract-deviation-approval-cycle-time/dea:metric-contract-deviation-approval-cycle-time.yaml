id: dea:metric-contract-deviation-approval-cycle-time
name: Contract Deviation Approval Cycle Time
type: Metric
description: 'Contract Deviation Approval Cycle Time (CDAT) measures how efficiently resources are converted
  into outputs in the Legal Operations domain. The formula is Days to Approve Non-Standard Clauses - reported
  in days. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
