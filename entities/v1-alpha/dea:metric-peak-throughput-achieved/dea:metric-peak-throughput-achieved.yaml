id: dea:metric-peak-throughput-achieved
name: Peak Throughput Achieved
type: Metric
description: Peak Throughput Achieved (PTA) measures the utilization or availability of capacity in the
  Postal & Courier domain. It is defined as Peak Daily Items Processed / Design Capacity; the result is
  stated in percent (%). It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. Higher values are better; gains are read as improvement and losses as deterioration.
  In Postal & courier, it is a recognized element of the standard performance toolkit.
