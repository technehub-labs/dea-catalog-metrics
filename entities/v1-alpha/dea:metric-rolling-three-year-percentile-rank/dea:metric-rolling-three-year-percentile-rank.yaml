id: dea:metric-rolling-three-year-percentile-rank
name: Rolling Three-Year Percentile Rank
type: Metric
description: 'Rolling Three-Year Percentile Rank (RTYPR) measures the economic value created or preserved
  in the Investment Performance Measurement domain. It is computed as Peer Percentile of Rolling 3-Year
  Return, expressed in percent (%). Its use is concentrated in Investment management. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
abbreviation: RTYPR
unit: percent
