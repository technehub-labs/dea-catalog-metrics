id: dea:metric-ip-infringement-detection-lead-time
name: IP Infringement Detection Lead Time
type: Metric
description: IP Infringement Detection Lead Time (IIDLT) addresses exposure to adverse outcomes and is
  a fixture of intellectual property & licensing reporting. Its calculation is Days from Third-Party Infringement
  to Detection, measured in days. It is applied across virtually every sector. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
