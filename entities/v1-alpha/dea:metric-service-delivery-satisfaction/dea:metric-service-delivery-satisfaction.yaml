id: dea:metric-service-delivery-satisfaction
name: Service Delivery Satisfaction
type: Metric
description: Service Delivery Satisfaction (SDS) addresses the engagement or satisfaction of the people
  involved and is a fixture of public sector & government reporting. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Satisfied
  Citizen Survey Responses / Responses, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. It originates from and is most used in Public sector practice.
abbreviation: SDS
unit: percent
