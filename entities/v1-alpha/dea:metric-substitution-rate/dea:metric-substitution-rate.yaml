id: dea:metric-substitution-rate
name: Substitution Rate
type: Metric
description: A Market Structure & Economics Standard Measures indicator, Substitution Rate (SUBR) quantifies
  exposure to adverse outcomes. The formula is Customers Switching to Alternatives / Customer Base - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
