id: dea:metric-working-capital-efficiency
name: Working Capital Efficiency
type: Metric
description: Within Treasury & Cash Management, Working Capital Efficiency (WCE) is used to gauge how
  efficiently resources are converted into outputs. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Revenue / (Current Assets - Current Liabilities);
  the result is stated in ratio (x:1 or x). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: WCE
unit: ratio
