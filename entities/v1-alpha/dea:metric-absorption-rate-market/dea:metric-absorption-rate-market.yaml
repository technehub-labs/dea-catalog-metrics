id: dea:metric-absorption-rate-market
name: Absorption Rate (Market)
type: Metric
description: Absorption Rate (Market) (ABSR-RE) measures growth over time in the Real Estate & Mortgage
  Standard Measures domain. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Units Leased or Sold per Period / Total Available Units; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. In Real
  estate, it is a recognized element of the standard performance toolkit.
