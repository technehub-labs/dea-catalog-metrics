id: dea:metric-budget-overrun-rate
name: Budget Overrun Rate
type: Metric
description: Budget Overrun Rate (BOR) addresses exposure to adverse outcomes and is a fixture of project
  management reporting. It is defined as Projects Exceeding Budget / Projects Completed; the result is
  stated in percent (%). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Lower values are better; each reduction is an improvement. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.
abbreviation: BOR
unit: percent
