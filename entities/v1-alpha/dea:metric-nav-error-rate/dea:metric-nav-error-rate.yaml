id: dea:metric-nav-error-rate
name: NAV Error Rate
type: Metric
description: A Investment Risk & Middle Office Operations indicator, NAV Error Rate (NAVER) quantifies
  the quality of outputs and outcomes. It provides the day-to-day signal that a process is running as
  designed. Its calculation is NAV Calculations with Error / NAVs Calculated, measured in events per thousand
  or million (scaled). It should be driven down, since lower readings signal healthier performance. It
  originates from and is most used in Investment management practice.
