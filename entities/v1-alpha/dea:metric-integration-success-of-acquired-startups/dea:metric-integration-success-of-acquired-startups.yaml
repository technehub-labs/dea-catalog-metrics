id: dea:metric-integration-success-of-acquired-startups
name: Integration Success of Acquired Startups
type: Metric
description: Within Corporate Venturing & Partnerships, Integration Success of Acquired Startups (ISAS)
  is used to gauge exposure to adverse outcomes. It is defined as Acquisitions Retaining Founders and
  Targets at 24 Months / Acquisitions; the result is stated in percent (%). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
