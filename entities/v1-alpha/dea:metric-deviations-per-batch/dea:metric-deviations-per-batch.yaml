id: dea:metric-deviations-per-batch
name: Deviations per Batch
type: Metric
description: Within Pharmaceuticals & Life Sciences, Deviations per Batch (DPB) is used to gauge the quality
  of outputs and outcomes. Its calculation is Quality Deviations / Batches Produced, measured in ratio
  (x:1 or x). It provides the day-to-day signal that a process is running as designed. Lower values are
  better; each reduction is an improvement. It originates from and is most used in Pharmaceuticals practice.
