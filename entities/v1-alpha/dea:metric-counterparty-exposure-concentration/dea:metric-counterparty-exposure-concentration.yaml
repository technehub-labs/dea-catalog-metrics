id: dea:metric-counterparty-exposure-concentration
name: Counterparty Exposure Concentration
type: Metric
description: 'Counterparty Exposure Concentration (CPEC) captures exposure to adverse outcomes for organizations
  tracking investment risk & middle office operations. It is computed as Largest Counterparty Exposure
  / Total Exposure, expressed in percent (%). Its use is concentrated in Investment management. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
abbreviation: CPEC
unit: percent
