id: dea:metric-board-gender-diversity
name: Board Gender Diversity
type: Metric
description: Within Sustainability & ESG, Board Gender Diversity (BGD) is used to gauge conformance to
  standards, plans, or obligations. It is defined as Women on Board / Total Board Members; the result
  is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: BGD
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
