id: dea:metric-claim-estimate-accuracy
name: Claim Estimate Accuracy
type: Metric
description: A Claims Operations (Insurance) indicator, Claim Estimate Accuracy (CEA) quantifies the quality
  of outputs and outcomes. Its calculation is 1 - ABS(Initial Reserve - Final Settlement) / Final Settlement,
  measured in percent (%). It originates from and is most used in Insurance practice. Its value drives
  prioritization and resource reallocation among competing initiatives. It should be maximized within
  the limits of cost and quality trade-offs.
