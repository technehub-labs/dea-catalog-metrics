id: dea:metric-capability-maturity-assessment-currency
name: Capability Maturity Assessment Currency
type: Metric
description: Within Operating Model Monitoring & Design Effectiveness, Capability Maturity Assessment
  Currency (CMAC-OM) is used to gauge capability maturity or development. It is defined as Capabilities
  Assessed within Two Years / Capabilities; the result is stated in percent (%). Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
