id: dea:metric-aircraft-turnaround-time
name: Aircraft Turnaround Time
type: Metric
description: Within Airlines & Aviation, Aircraft Turnaround Time (ATT) is used to gauge how efficiently
  resources are converted into outputs. It provides the day-to-day signal that a process is running as
  designed. Its calculation is Minutes from Arrival to Next Departure at Gate, measured in minutes. It
  should be driven down, since lower readings signal healthier performance. It originates from and is
  most used in Airlines & aviation practice.
