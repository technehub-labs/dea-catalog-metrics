id: dea:metric-injury-burden-rate-deep-dive
name: Injury Burden Rate (Deep Dive)
type: Metric
description: 'Within Sports Clubs & Leagues (Deep Dive), Injury Burden Rate (Deep Dive) (IBR-D) is used
  to gauge exposure to adverse outcomes. It is computed as Days Lost to Injury / Squad Player Days, expressed
  in percent (%). Its use is concentrated in Sports. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
