id: dea:metric-fraud-rate-transaction-value
name: Fraud Rate (Transaction Value)
type: Metric
description: 'Fraud Rate (Transaction Value) (FRTV) captures exposure to adverse outcomes for organizations
  tracking payments & fintech. It is computed as Fraudulent Transaction Value / Total Transaction Value,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Payments & fintech.'
abbreviation: FRTV
unit: percent
