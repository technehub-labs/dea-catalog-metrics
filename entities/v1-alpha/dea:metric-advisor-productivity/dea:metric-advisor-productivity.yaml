id: dea:metric-advisor-productivity
name: Advisor Productivity
type: Metric
description: 'Advisor Productivity (ADPR) measures how efficiently resources are converted into outputs
  in the Wealth Management domain. It is computed as Revenue per Financial Advisor per Period, expressed
  in currency value. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Wealth management.'
