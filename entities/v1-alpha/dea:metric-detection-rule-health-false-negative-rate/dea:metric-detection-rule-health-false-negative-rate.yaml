id: dea:metric-detection-rule-health-false-negative-rate
name: Detection Rule Health - False Negative Rate
type: Metric
description: Detection Rule Health - False Negative Rate (DRHFN) measures exposure to adverse outcomes
  in the SecOps & Security Operations Center domain. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Valid Threats Missed by Rules / Valid Threats
  in Test; the result is stated in percent (%). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: DRHFN
unit: percent
