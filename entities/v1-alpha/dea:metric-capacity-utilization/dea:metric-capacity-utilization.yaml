id: dea:metric-capacity-utilization
name: Capacity Utilization
type: Metric
description: Within Operations, Capacity Utilization (CU) is used to gauge the utilization or availability
  of capacity. It is defined as Actual Output / Maximum Possible Output; the result is stated in percent
  (%). It is applied across virtually every sector. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: CU
unit: percent
