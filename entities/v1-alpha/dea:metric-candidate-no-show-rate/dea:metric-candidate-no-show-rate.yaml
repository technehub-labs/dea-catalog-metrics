id: dea:metric-candidate-no-show-rate
name: Candidate No-Show Rate
type: Metric
description: 'Candidate No-Show Rate (CNSR) captures exposure to adverse outcomes for organizations tracking
  staffing & recruiting. It is defined as Candidate Interview No-Shows / Scheduled Interviews; the result
  is stated in percent (%). It is a working-level control: thresholds trigger immediate operational response.
  Lower values are better; each reduction is an improvement. In Staffing & recruiting, it is a recognized
  element of the standard performance toolkit.'
abbreviation: CNSR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
- risk
scope_classification:
- capability
directionality: lower_is_better
management_significance:
- operational
