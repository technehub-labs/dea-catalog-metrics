id: dea:metric-total-recordable-incident-rate
name: Total Recordable Incident Rate
type: Metric
description: Within Health & Safety, Total Recordable Incident Rate (TRIR) is used to gauge exposure to
  adverse outcomes. Its calculation is (Recordable Injuries x 200,000) / Total Hours Worked, measured
  in ratio (x:1 or x). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and
  sustained decreases indicate successful intervention.
abbreviation: TRIR
unit: ratio
version: 1.0.1
lifecycle_status: candidate
subject_classification:
- governance
purpose_classification:
- risk
scope_classification:
- organizational_unit
directionality: lower_is_better
management_significance:
