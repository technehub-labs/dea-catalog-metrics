id: dea:metric-data-asset-reuse-rate
name: Data Asset Reuse Rate
type: Metric
description: 'Data Asset Reuse Rate (DARR-DS) measures how efficiently resources are converted into outputs
  in the Data Science & Analytics Operations domain. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Reusable Data Assets Reused /
  Published Assets, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: DARR-DS
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
