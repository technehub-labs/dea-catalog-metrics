id: dea:metric-bunker-consumption-variance-deep-dive
name: Bunker Consumption Variance (Deep Dive)
type: Metric
description: Bunker Consumption Variance (Deep Dive) (BCV-D) addresses how efficiently resources are converted
  into outputs and is a fixture of maritime shipping (deep dive) reporting. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. It is computed as Actual - Planned
  Consumption / Plan, expressed in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Its use is concentrated in Maritime.
abbreviation: BCV-D
unit: percent
