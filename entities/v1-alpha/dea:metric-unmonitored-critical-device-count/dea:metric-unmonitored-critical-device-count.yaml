id: dea:metric-unmonitored-critical-device-count
name: Unmonitored Critical Device Count
type: Metric
description: 'Within Network Operations Center (Deep Dive), Unmonitored Critical Device Count (UCDC) is
  used to gauge exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Critical Devices without Monitoring, expressed
  in count (items per period). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
