id: dea:metric-insider-trading-policy-breaches
name: Insider Trading Policy Breaches
type: Metric
description: Insider Trading Policy Breaches (ITPB) addresses exposure to adverse outcomes and is a fixture
  of corporate governance reporting. It is defined as Detected Insider Dealing Breaches per Period; the
  result is stated in count (items per period). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
