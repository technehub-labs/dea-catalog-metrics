id: dea:metric-technical-debt-ratio
name: Technical Debt Ratio
type: Metric
description: Within Software Engineering, Technical Debt Ratio (TDR) is used to gauge exposure to adverse
  outcomes. Its calculation is Remediation Cost / Development Cost to Rebuild, measured in percent (%).
  It is applied across virtually every sector. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: TDR
unit: percent
