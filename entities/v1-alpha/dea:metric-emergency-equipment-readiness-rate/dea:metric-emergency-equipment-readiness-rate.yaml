id: dea:metric-emergency-equipment-readiness-rate
name: Emergency Equipment Readiness Rate
type: Metric
description: 'Within Crisis Management & Emergency Response, Emergency Equipment Readiness Rate (EERR)
  is used to gauge exposure to adverse outcomes. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Emergency Equipment Passing Inspection / Equipment
  Items - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
