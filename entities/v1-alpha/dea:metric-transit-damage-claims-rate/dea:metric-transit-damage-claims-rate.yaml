id: dea:metric-transit-damage-claims-rate
name: Transit Damage Claims Rate
type: Metric
description: A Logistics & Transportation indicator, Transit Damage Claims Rate (TDC) quantifies the quality
  of outputs and outcomes. Its calculation is Claims Value / Freight Value Shipped, measured in percent
  (%). It originates from and is most used in Logistics practice. Its value drives prioritization and
  resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: TDC
unit: percent
