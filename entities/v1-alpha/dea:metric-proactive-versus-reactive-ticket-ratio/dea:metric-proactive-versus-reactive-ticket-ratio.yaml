id: dea:metric-proactive-versus-reactive-ticket-ratio
name: Proactive versus Reactive Ticket Ratio
type: Metric
description: Proactive versus Reactive Ticket Ratio (PVRTR) captures capability maturity or development
  for organizations tracking network operations center (deep dive). It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Proactive
  Tickets / Total Tickets, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PVRTR
unit: percent
