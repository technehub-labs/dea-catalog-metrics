id: dea:metric-log-retention-compliance-rate
name: Log Retention Compliance Rate
type: Metric
description: A SecOps & Security Operations Center indicator, Log Retention Compliance Rate (LRCR-SOC)
  quantifies conformance to standards, plans, or obligations. The formula is Sources Meeting Retention
  Policy / Sources - reported in percent (%). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
