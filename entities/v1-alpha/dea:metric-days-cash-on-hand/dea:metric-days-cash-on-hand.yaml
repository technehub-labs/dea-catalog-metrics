id: dea:metric-days-cash-on-hand
name: Days Cash on Hand
type: Metric
description: Days Cash on Hand (DCOH) captures exposure to adverse outcomes for organizations tracking
  treasury & cash management. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Cash and Equivalents / Average Daily Operating Expenses; the result
  is stated in days. Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
