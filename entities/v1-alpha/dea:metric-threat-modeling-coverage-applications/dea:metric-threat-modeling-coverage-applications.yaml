id: dea:metric-threat-modeling-coverage-applications
name: Threat Modeling Coverage (Applications)
type: Metric
description: Within Application Security (AppSec), Threat Modeling Coverage (Applications) (TMCA) is used
  to gauge exposure to adverse outcomes. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Its calculation is High-Risk Apps with Threat Model /
  High-Risk Apps, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Software practice.
abbreviation: TMCA
unit: percent
version: 1.0.0
