id: dea:metric-gross-margin-stability-index
name: Gross Margin Stability Index
type: Metric
description: Gross Margin Stability Index (GMSI) captures exposure to adverse outcomes for organizations
  tracking balanced scorecard - financial perspective. Its calculation is Variance of Gross Margin around
  Trend, measured in percent (%). It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Reduction is the
  goal, and sustained decreases indicate successful intervention.
abbreviation: GMSI
unit: percent
version: 1.1.0
