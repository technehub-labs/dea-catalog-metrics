id: dea:metric-sell-through-rate-books
name: Sell-Through Rate (Books)
type: Metric
description: A Publishing & News Media indicator, Sell-Through Rate (Books) (STRB) quantifies growth over
  time. Its value drives prioritization and resource reallocation among competing initiatives. Its calculation
  is Retail Sales / Copies Distributed, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. It originates from and is most used in Media & Entertainment practice.
abbreviation: STRB
unit: percent
