id: dea:metric-process-standardization-ratio-deep-dive
name: Process Standardization Ratio (Deep Dive)
type: Metric
description: 'Within Balanced Scorecard - Internal Process Perspective, Process Standardization Ratio
  (Deep Dive) (PSR-D) is used to gauge capability maturity or development. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Processes
  Following Global Standard / Processes, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: PSR-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
