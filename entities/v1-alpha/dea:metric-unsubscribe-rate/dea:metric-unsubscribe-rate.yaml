id: dea:metric-unsubscribe-rate
name: Unsubscribe Rate
type: Metric
description: 'Within Marketing, Unsubscribe Rate (USR) is used to gauge exposure to adverse outcomes.
  The formula is Unsubscribes / Emails Delivered - reported in percent (%). It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: USR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- risk
scope_classification:
- capability
directionality: lower_is_better
management_significance:
