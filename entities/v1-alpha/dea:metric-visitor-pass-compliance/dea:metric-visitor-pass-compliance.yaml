id: dea:metric-visitor-pass-compliance
name: Visitor Pass Compliance
type: Metric
description: 'Within Physical Security Operations, Visitor Pass Compliance (VPC) is used to gauge conformance
  to standards, plans, or obligations. It is defined as Visitors Properly Registered / Visitor Entries
  Audited; the result is stated in percent (%). It is a working-level control: thresholds trigger immediate
  operational response. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
