id: dea:metric-customer-churn-rate
name: Customer Churn Rate
type: Metric
description: 'Customer Churn Rate (CCR) addresses exposure to adverse outcomes and is a fixture of customer
  reporting. It is computed as Customers Lost during Period / Customers at Start, expressed in percent
  (%). It is applied across virtually every sector. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
abbreviation: CCR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- risk
scope_classification:
- organizational_unit
directionality: lower_is_better
management_significance:
