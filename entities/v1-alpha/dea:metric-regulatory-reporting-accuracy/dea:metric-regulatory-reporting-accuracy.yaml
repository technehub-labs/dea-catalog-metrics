id: dea:metric-regulatory-reporting-accuracy
name: Regulatory Reporting Accuracy
type: Metric
description: Within Regulatory Affairs & Compliance Operations, Regulatory Reporting Accuracy (RRA-R)
  is used to gauge the quality of outputs and outcomes. The formula is Reports Accepted without Amendment
  / Reports Filed - reported in percent (%). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
