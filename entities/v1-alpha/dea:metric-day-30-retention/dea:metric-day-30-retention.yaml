id: dea:metric-day-30-retention
name: Day 30 Retention
type: Metric
description: A Gaming indicator, Day 30 Retention (D30R) quantifies the retention of customers, users,
  or assets over time. The formula is Players Returning on Day 30 / New Player Cohort - reported in percent
  (%). It is a standard measure in the Gaming sector. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. It should be maximized within the limits of cost and
  quality trade-offs.
