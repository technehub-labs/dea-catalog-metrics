id: dea:metric-exhibitor-net-promoter-score
name: Exhibitor Net Promoter Score
type: Metric
description: Exhibitor Net Promoter Score (XNPS) addresses the engagement or satisfaction of the people
  involved and is a fixture of events & exhibitions reporting. The formula is Exhibitor NPS Survey Result
  - reported in score (points). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. It is a standard measure in the Media & Entertainment sector.
