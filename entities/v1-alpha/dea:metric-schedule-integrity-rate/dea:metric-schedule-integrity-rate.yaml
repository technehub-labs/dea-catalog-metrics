id: dea:metric-schedule-integrity-rate
name: Schedule Integrity Rate
type: Metric
description: 'Schedule Integrity Rate (SIR-AT) measures the quality of outputs and outcomes in the Airline
  & Transportation Standard Measures (Deep Dive) domain. It is defined as Flights Departing as Scheduled
  without Swap or Cancel / Flights; the result is stated in percent (%). It is a working-level control:
  thresholds trigger immediate operational response. Higher values are better; gains are read as improvement
  and losses as deterioration. In Airlines & Aviation, it is a recognized element of the standard performance
  toolkit.'
