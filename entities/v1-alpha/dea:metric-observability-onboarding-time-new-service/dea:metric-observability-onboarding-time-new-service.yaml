id: dea:metric-observability-onboarding-time-new-service
name: Observability Onboarding Time (New Service)
type: Metric
description: 'Observability Onboarding Time (New Service) (OONT) measures how efficiently resources are
  converted into outputs in the SRE & Observability Standard Measures domain. The formula is Days from
  Service Launch to Full Instrumentation - reported in days. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Software sector.'
