id: dea:metric-web-availability
name: Web Availability
type: Metric
description: Web Availability (WA) measures the quality of outputs and outcomes in the Digital Product
  & Web Operations domain. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Successful Requests or Uptime / Total Monitoring Window - reported in percent
  (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
