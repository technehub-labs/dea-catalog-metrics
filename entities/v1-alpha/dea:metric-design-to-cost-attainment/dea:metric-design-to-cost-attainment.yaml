id: dea:metric-design-to-cost-attainment
name: Design-to-Cost Attainment
type: Metric
description: Design-to-Cost Attainment (DCA) addresses the economic value created or preserved and is
  a fixture of engineering & design reporting. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Designs Meeting Cost Targets / Designs - reported
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: DCA
unit: percent
