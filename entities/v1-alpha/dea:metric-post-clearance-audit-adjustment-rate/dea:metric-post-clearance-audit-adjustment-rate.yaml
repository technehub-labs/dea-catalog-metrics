id: dea:metric-post-clearance-audit-adjustment-rate
name: Post-Clearance Audit Adjustment Rate
type: Metric
description: A International Trade & Customs indicator, Post-Clearance Audit Adjustment Rate (PCAAR) quantifies
  exposure to adverse outcomes. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Audits with Duty Adjustment / Audits, measured
  in percent (%). It should be driven down, since lower readings signal healthier performance. It originates
  from and is most used in Logistics & Trade practice.
abbreviation: PCAAR
unit: percent
