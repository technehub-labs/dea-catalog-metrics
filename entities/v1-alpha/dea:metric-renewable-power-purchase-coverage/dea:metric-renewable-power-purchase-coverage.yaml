id: dea:metric-renewable-power-purchase-coverage
name: Renewable Power Purchase Coverage
type: Metric
description: A Operations Energy Management indicator, Renewable Power Purchase Coverage (RPPC) quantifies
  environmental and social sustainability performance. The formula is Consumption under Renewable Contracts
  / Total Consumption - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
