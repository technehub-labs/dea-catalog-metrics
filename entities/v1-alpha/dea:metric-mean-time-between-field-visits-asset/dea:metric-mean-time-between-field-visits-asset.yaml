name: Mean Time between Field Visits - Asset
type: Metric
description: 'A Field Maintenance & Technical Field Service (Deep Dive) indicator, Mean Time between Field
  Visits - Asset (MTBFV) quantifies the quality of outputs and outcomes. The formula is Days between Corrective
  Visits per Asset - reported in days. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
