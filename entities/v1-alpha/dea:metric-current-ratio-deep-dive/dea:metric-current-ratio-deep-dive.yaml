id: dea:metric-current-ratio-deep-dive
name: Current Ratio (Deep Dive)
type: Metric
description: Current Ratio (Deep Dive) (CRDD) addresses exposure to adverse outcomes and is a fixture
  of financial statement analysis ratios (deep dive) reporting. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Current Assets
  / Current Liabilities, measured in ratio (x:1 or x). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
