id: dea:metric-fee-revenue-per-deal
name: Fee Revenue per Deal
type: Metric
description: Fee Revenue per Deal (FRPD) captures the economic value created or preserved for organizations
  tracking investment banking & capital markets. Its calculation is Total Advisory and Underwriting Fees
  / Deals Closed, measured in currency value. It originates from and is most used in Investment banking
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
