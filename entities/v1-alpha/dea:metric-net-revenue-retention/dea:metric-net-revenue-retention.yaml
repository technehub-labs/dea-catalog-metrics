id: dea:metric-net-revenue-retention
name: Net Revenue Retention
type: Metric
description: A Customer indicator, Net Revenue Retention (NRR) quantifies the retention of customers,
  users, or assets over time. The formula is (MRR_start + Expansion MRR - Contraction MRR - Churned MRR)
  / MRR_start - reported in percent (%). It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: NRR
unit: percent
version: 1.0.0
