id: dea:metric-daily-commits-per-developer
name: Daily Commits per Developer
type: Metric
description: 'Daily Commits per Developer (DCPD) addresses how efficiently resources are converted into
  outputs and is a fixture of continuous integration reporting. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Commits Merged per Developer per Day; the result
  is stated in count (items per period). The objective is neither maximization nor minimization but staying
  within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
