description: Governance Layer Efficiency Ratio (GLER-OM) addresses conformance to standards, plans, or
  obligations and is a fixture of operating model monitoring & design effectiveness reporting. Its calculation
  is Governance Bodies with Active Charters and Reviews / Bodies, measured in percent (%). It is applied
  across virtually every sector. It informs long-horizon decisions and is typically tracked on enterprise
