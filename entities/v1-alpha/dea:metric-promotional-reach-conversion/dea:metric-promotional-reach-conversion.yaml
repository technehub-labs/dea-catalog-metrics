id: dea:metric-promotional-reach-conversion
name: Promotional Reach Conversion
type: Metric
description: Promotional Reach Conversion (PRC) addresses how effectively a process or entity achieves
  its intended outcome and is a fixture of media & entertainment reporting. Its calculation is Trial Starts
  from Campaign / Campaign Reach, measured in percent (%). It originates from and is most used in Media
  & entertainment practice. Its value drives prioritization and resource reallocation among competing
  initiatives. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: PRC
unit: percent
version: 1.1.0
