id: dea:metric-fabric-utilization-efficiency
name: Fabric Utilization Efficiency
type: Metric
description: Fabric Utilization Efficiency (FUE) captures how efficiently resources are converted into
  outputs for organizations tracking textile & apparel. It is computed as Fabric Used in Garments / Fabric
  Issued, expressed in percent (%). It is reviewed at cadence by planning owners to correct course before
  issues become strategic. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Textile & apparel.
abbreviation: FUE
unit: percent
