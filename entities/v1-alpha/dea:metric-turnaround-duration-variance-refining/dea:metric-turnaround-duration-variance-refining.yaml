id: dea:metric-turnaround-duration-variance-refining
name: Turnaround Duration Variance (Refining)
type: Metric
description: A Oil & Gas Downstream & Refining indicator, Turnaround Duration Variance (Refining) (TDVR)
  quantifies how efficiently resources are converted into outputs. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Actual Turnaround Days - Planned
  / Planned; the result is stated in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. In Oil & Gas, it is a recognized element of the standard
  performance toolkit.
abbreviation: TDVR
unit: percent
