id: dea:metric-customer-advocacy-rate
name: Customer Advocacy Rate
type: Metric
description: Customer Advocacy Rate (CAR) addresses the engagement or satisfaction of the people involved
  and is a fixture of customer reporting. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Customers Providing Referrals or Public Advocacy /
  Total Customers, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CAR
unit: percent
