id: dea:metric-idle-time-ratio-contact-center
name: Idle Time Ratio (Contact Center)
type: Metric
description: 'Idle Time Ratio (Contact Center) (ITR-CC) addresses how efficiently resources are converted
  into outputs and is a fixture of contact center standard measures (deep dive) reporting. It is a working-level
  control: thresholds trigger immediate operational response. It is defined as Unproductive Waiting Time
  / Paid Time; the result is stated in percent (%). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: ITR-CC
unit: percent
version: 1.1.0
lifecycle_status: candidate
