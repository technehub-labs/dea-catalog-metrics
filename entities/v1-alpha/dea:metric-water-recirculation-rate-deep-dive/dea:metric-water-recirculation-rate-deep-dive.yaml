description: 'A Metals & Mining Operations (Deep Dive) indicator, Water Recirculation Rate (Deep Dive)
  (WRR-M) quantifies environmental and social sustainability performance. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Recirculated
  Water / Total Water Used, expressed in percent (%). Improvement means raising this figure toward best-in-class
