id: dea:metric-production-line-availability
name: Production Line Availability
type: Metric
description: 'Production Line Availability (PLA) addresses the utilization or availability of capacity
  and is a fixture of automotive reporting. It is defined as Line Uptime / Scheduled Line Time; the result
  is stated in percent (%). In Automotive, it is a recognized element of the standard performance toolkit.
  It is a working-level control: thresholds trigger immediate operational response. It should be maximized
  within the limits of cost and quality trade-offs.'
