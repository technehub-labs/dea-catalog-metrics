description: 'Franchisee Training Completion (Deep Dive) (FTCD) captures conformance to standards, plans,
  or obligations for organizations tracking franchise operations (deep dive). The formula is Franchisees
  Completing Mandatory Training / Franchisees - reported in percent (%). It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
