id: dea:metric-decision-quality-audit-score
name: Decision Quality Audit Score
type: Metric
description: Decision Quality Audit Score (DQAS-GOV) measures the quality of outputs and outcomes in the
  Enterprise Decision Effectiveness & Governance Monitoring domain. It is defined as Composite Evidence,
  Options, and Outcome Score; the result is stated in score (points). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DQAS-GOV
