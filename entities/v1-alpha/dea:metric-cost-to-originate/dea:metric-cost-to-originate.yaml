id: dea:metric-cost-to-originate
name: Cost to Originate
type: Metric
description: 'Cost to Originate (CTO) measures how efficiently resources are converted into outputs in
  the Retail Banking & Lending domain. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Total Origination Cost / Loans Originated, expressed
  in currency per unit. It should be driven down, since lower readings signal healthier performance. Its
  use is concentrated in Banking.'
