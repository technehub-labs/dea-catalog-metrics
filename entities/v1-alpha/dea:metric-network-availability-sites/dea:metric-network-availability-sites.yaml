id: dea:metric-network-availability-sites
name: Network Availability (Sites)
type: Metric
description: A Network Performance & Capacity indicator, Network Availability (Sites) (NAS) quantifies
  the quality of outputs and outcomes. It is computed as Site Uptime Minutes / Planned Uptime Minutes,
  expressed in percent (%). It is applied across virtually every sector. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
