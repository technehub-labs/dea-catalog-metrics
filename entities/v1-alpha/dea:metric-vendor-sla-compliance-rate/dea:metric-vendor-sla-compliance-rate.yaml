id: dea:metric-vendor-sla-compliance-rate
name: Vendor SLA Compliance Rate
type: Metric
description: A Outsourcing & Vendor Management indicator, Vendor SLA Compliance Rate (VSCR) quantifies
  conformance to standards, plans, or obligations. Its calculation is Vendor Deliveries Meeting SLA /
  Vendor Deliveries Measured, measured in percent (%). Its value drives prioritization and resource reallocation
  among competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: VSCR
unit: percent
