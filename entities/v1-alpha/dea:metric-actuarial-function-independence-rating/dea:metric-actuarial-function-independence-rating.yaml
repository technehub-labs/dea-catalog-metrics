id: dea:metric-actuarial-function-independence-rating
name: Actuarial Function Independence Rating
type: Metric
description: A Actuarial & Reserving indicator, Actuarial Function Independence Rating (AFIR) quantifies
  conformance to standards, plans, or obligations. Its calculation is Regulatory Independence Assessment
  Score, measured in index (0-100 or normalized). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Insurance practice.
