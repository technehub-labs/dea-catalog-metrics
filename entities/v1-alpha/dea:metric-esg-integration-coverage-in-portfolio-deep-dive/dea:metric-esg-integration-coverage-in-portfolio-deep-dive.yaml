id: dea:metric-esg-integration-coverage-in-portfolio-deep-dive
name: ESG Integration Coverage in Portfolio (Deep Dive)
type: Metric
description: A Investment Management - Portfolio Operations indicator, ESG Integration Coverage in Portfolio
  (Deep Dive) (ESGIC-D) quantifies environmental and social sustainability performance. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. The formula is Holdings
  ESG-Assessed / Total Holdings - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. It is a standard measure in the Financial Services sector.
abbreviation: ESGIC-D
