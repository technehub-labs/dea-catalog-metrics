id: dea:metric-api-consumer-satisfaction-score
name: API Consumer Satisfaction Score
type: Metric
description: API Consumer Satisfaction Score (APICSAT) measures the economic value created or preserved
  in the API Lifecycle Management domain. It is computed as Consumer Survey Score for API Usability, expressed
  in score (points). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Software.
