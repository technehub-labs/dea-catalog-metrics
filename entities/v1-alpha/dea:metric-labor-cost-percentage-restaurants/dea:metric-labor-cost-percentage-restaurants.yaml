id: dea:metric-labor-cost-percentage-restaurants
name: Labor Cost Percentage (Restaurants)
type: Metric
description: Labor Cost Percentage (Restaurants) (LCPR) captures how efficiently resources are converted
  into outputs for organizations tracking restaurants. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Labor Cost / Food and Beverage Revenue;
  the result is stated in percent (%). It should be driven down, since lower readings signal healthier
  performance. In Restaurants, it is a recognized element of the standard performance toolkit.
abbreviation: LCPR
unit: percent
