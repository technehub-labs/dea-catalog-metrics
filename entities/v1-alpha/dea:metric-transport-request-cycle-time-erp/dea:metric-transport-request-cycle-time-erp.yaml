id: dea:metric-transport-request-cycle-time-erp
name: Transport Request Cycle Time (ERP)
type: Metric
description: A ERP & Enterprise Application Operations indicator, Transport Request Cycle Time (ERP) (TRCT)
  quantifies how efficiently resources are converted into outputs. It provides the day-to-day signal that
  a process is running as designed. Its calculation is Days from Development to Production Transport,
  measured in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: TRCT
unit: day
