id: dea:metric-drift-detection-rate
name: Drift Detection Rate
type: Metric
description: Drift Detection Rate (DDR-CS) measures exposure to adverse outcomes in the Cloud Security
  Posture Management domain. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Config Drift Events Detected before Change Window / Drift
  Events, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: DDR-CS
unit: percent
