id: dea:metric-strategic-alignment-score-initiatives
name: Strategic Alignment Score - Initiatives
type: Metric
description: Strategic Alignment Score - Initiatives (SASI-PPM) measures strategy in the Program & Portfolio
  Management domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is Initiatives Mapped to Strategic Objectives / Initiatives,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: SASI-PPM
