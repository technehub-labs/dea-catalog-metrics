id: dea:metric-grant-proposal-success-rate-deep-dive
name: Grant Proposal Success Rate (Deep Dive)
type: Metric
description: Grant Proposal Success Rate (Deep Dive) (GPSR-D) addresses growth over time and is a fixture
  of nonprofit & donor operations (deep dive) reporting. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Grants Awarded / Proposals Submitted;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  In Nonprofit, it is a recognized element of the standard performance toolkit.
abbreviation: GPSR-D
