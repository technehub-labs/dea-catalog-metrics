id: dea:metric-service-recovery-effectiveness
name: Service Recovery Effectiveness
type: Metric
description: Service Recovery Effectiveness (SRE) addresses the quality of outputs and outcomes and is
  a fixture of customer journey & experience reporting. It is computed as Recovered Customers after Service
  Failure / Service Failure Cases, expressed in percent (%). It is applied across virtually every sector.
  It is reviewed at cadence by planning owners to correct course before issues become strategic. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: SRE
unit: percent
