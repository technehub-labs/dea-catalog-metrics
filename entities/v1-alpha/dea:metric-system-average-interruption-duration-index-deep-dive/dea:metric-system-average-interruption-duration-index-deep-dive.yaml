reputability_tier: industry_standard
unit_ref: dea:unit-minute
source_credit: IEEE Std 1366 reliability indices
calculation_definition: Customer-Minutes Interrupted / Customers Served
formula_definition:
  formula_id: dea:formula-system-average-interruption-duration-index-deep-dive
  expression: SAIDI-D = Customer-Minutes Interrupted / Customers Served
  inputs:
