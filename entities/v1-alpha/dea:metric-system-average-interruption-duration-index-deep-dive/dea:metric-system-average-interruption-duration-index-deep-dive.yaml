id: dea:metric-system-average-interruption-duration-index-deep-dive
name: System Average Interruption Duration Index (Deep Dive)
type: Metric
description: 'System Average Interruption Duration Index (Deep Dive) (SAIDI-D) addresses the quality of
  outputs and outcomes and is a fixture of utilities field operations & grid reporting. It is computed
  as Customer-Minutes Interrupted / Customers Served, expressed in minutes. Its use is concentrated in
  Utilities. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: SAIDI-D
unit: minute
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
