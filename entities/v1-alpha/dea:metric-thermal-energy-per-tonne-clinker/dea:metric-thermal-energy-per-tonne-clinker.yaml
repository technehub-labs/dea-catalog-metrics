id: dea:metric-thermal-energy-per-tonne-clinker
name: Thermal Energy per Tonne Clinker
type: Metric
description: 'A Cement & Building Materials indicator, Thermal Energy per Tonne Clinker (TETC) quantifies
  how efficiently resources are converted into outputs. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Heat Consumed / Clinker Tonnes,
  expressed in ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance.
  Its use is concentrated in Manufacturing.'
abbreviation: TETC
unit: ratio
