id: dea:metric-operating-expense-ratio-property
name: Operating Expense Ratio (Property)
type: Metric
description: Operating Expense Ratio (Property) (OER-P) captures how efficiently resources are converted
  into outputs for organizations tracking real estate portfolio & property management. It is defined as
  Operating Expenses / Effective Gross Income; the result is stated in percent (%). In Real Estate, it
  is a recognized element of the standard performance toolkit. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: OER-P
unit: percent
