id: dea:metric-mortgage-early-payment-default-rate-deep-dive
name: Mortgage Early Payment Default Rate (Deep Dive)
type: Metric
description: Mortgage Early Payment Default Rate (Deep Dive) (MEPDR) measures exposure to adverse outcomes
  in the Real Estate & Mortgage Standard Measures domain. The formula is Defaults within 24 Months of
  Origination / Loans Originated - reported in percent (%). It is a standard measure in the Real estate
  sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Reduction is the goal, and sustained decreases indicate successful intervention.
