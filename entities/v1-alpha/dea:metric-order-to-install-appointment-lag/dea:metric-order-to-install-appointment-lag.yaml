id: dea:metric-order-to-install-appointment-lag
name: Order-to-Install Appointment Lag
type: Metric
description: Order-to-Install Appointment Lag (OIAL) measures how efficiently resources are converted
  into outputs in the Telecom Field & Installation domain. Its value drives prioritization and resource
  reallocation among competing initiatives. Its calculation is Days between Order and First Available
  Appointment Slot, measured in days. It should be driven down, since lower readings signal healthier
  performance. It originates from and is most used in Telecommunications practice.
abbreviation: OIAL
unit: day
version: 1.1.0
