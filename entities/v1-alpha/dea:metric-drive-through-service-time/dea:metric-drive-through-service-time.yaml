id: dea:metric-drive-through-service-time
name: Drive-Through Service Time
type: Metric
description: Drive-Through Service Time (DSTS) addresses how efficiently resources are converted into
  outputs and is a fixture of restaurants reporting. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. It is computed as Minutes from Order Point to Handoff,
  expressed in minutes. It should be driven down, since lower readings signal healthier performance. Its
  use is concentrated in Restaurants.
