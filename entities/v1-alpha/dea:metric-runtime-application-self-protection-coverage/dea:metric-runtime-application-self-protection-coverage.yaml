id: dea:metric-runtime-application-self-protection-coverage
name: Runtime Application Self-Protection Coverage
type: Metric
description: A DevSecOps & Application Security Engineering indicator, Runtime Application Self-Protection
  Coverage (RASPC) quantifies exposure to adverse outcomes. It is computed as Critical Services with RASP
  or Runtime Protection / Critical Services, expressed in percent (%). It is reviewed at cadence by planning
  owners to correct course before issues become strategic. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: RASPC
unit: percent
version: 1.1.0
lifecycle_status: candidate
