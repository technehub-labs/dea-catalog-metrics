id: dea:metric-delivery-lead-time-factory-to-dc-deep-dive
name: Delivery Lead Time - Factory to DC (Deep Dive)
type: Metric
description: A Textile & Apparel (Deep Dive) indicator, Delivery Lead Time - Factory to DC (Deep Dive)
  (DLT-D) quantifies how efficiently resources are converted into outputs. Its calculation is Days from
  Ex-Factory to DC Receipt, measured in days. Its value drives prioritization and resource reallocation
  among competing initiatives. Lower values are better; each reduction is an improvement. It originates
  from and is most used in Textiles & Apparel practice.
