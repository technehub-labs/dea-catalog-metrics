id: dea:metric-complaints-per-1-000-passengers
name: Complaints per 1,000 Passengers
type: Metric
description: 'A Airlines & Aviation indicator, Complaints per 1,000 Passengers (CPP) quantifies the quality
  of outputs and outcomes. It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. The formula is Complaints / Passengers x 1,000 - reported in events per
  thousand or million (scaled). It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Airlines & aviation sector.'
