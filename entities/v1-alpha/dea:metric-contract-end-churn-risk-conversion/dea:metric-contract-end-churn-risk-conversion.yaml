id: dea:metric-contract-end-churn-risk-conversion
name: Contract End Churn Risk Conversion
type: Metric
description: A Telecom Customer Experience & Billing indicator, Contract End Churn Risk Conversion (CERC)
  quantifies the retention of customers, users, or assets over time. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as At-Risk Customers Retained at
  Contract End / At-Risk Customers; the result is stated in percent (%). Improvement means raising this
  figure toward best-in-class levels. In Telecommunications, it is a recognized element of the standard
  performance toolkit.
abbreviation: CERC
unit: percent
version: 1.1.0
lifecycle_status: candidate
