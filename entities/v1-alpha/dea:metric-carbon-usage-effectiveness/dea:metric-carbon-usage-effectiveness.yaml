id: dea:metric-carbon-usage-effectiveness
name: Carbon Usage Effectiveness
type: Metric
description: Carbon Usage Effectiveness (CUE) captures environmental and social sustainability performance
  for organizations tracking data center & cloud operations. It is defined as CO2e from Facility Energy
  / IT Equipment Energy; the result is stated in ratio (x:1 or x). In Technology & data centers, it is
  a recognized element of the standard performance toolkit. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: CUE
unit: ratio
