id: dea:metric-purchase-price-allocation-variance
name: Purchase Price Allocation Variance
type: Metric
description: 'Purchase Price Allocation Variance (PPAV) captures the quality of outputs and outcomes for
  organizations tracking mergers & acquisitions. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. The formula is Final PPA vs Preliminary Estimate Variance
  - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
