id: dea:metric-mortgage-offer-fall-through-rate
name: Mortgage Offer Fall-Through Rate
type: Metric
description: Mortgage Offer Fall-Through Rate (MOFTR) measures exposure to adverse outcomes in the Banking
  Retail Lending (Deep Dive) domain. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is Offers Not Proceeding to Completion / Offers, measured in percent (%).
  It should be driven down, since lower readings signal healthier performance. It originates from and
  is most used in Banking practice.
abbreviation: MOFTR
unit: percent
