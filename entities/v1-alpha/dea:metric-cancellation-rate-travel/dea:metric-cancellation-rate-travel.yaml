id: dea:metric-cancellation-rate-travel
name: Cancellation Rate (Travel)
type: Metric
description: Within Travel & Tourism, Cancellation Rate (Travel) (CNL) is used to gauge exposure to adverse
  outcomes. It is computed as Cancelled Bookings / Total Bookings, expressed in percent (%). It is reviewed
  at cadence by planning owners to correct course before issues become strategic. Lower values are better;
  each reduction is an improvement. Its use is concentrated in Travel & tourism.
