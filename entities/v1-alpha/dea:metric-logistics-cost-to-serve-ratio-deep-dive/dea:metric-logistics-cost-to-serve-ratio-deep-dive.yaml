id: dea:metric-logistics-cost-to-serve-ratio-deep-dive
name: Logistics Cost-to-Serve Ratio (Deep Dive)
type: Metric
description: Logistics Cost-to-Serve Ratio (Deep Dive) (LCTSDD) measures how efficiently resources are
  converted into outputs in the Supply Chain Standard Measures (Deep Dive) domain. It is defined as Total
  Logistics Cost / Revenue; the result is stated in percent (%). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: LCTSDD
unit: percent
