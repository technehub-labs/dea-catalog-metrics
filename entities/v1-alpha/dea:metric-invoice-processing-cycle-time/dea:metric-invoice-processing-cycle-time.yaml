id: dea:metric-invoice-processing-cycle-time
name: Invoice Processing Cycle Time
type: Metric
description: Invoice Processing Cycle Time (IPCT) measures how efficiently resources are converted into
  outputs in the Accounts Payable & Receivable Operations (Deep Dive) domain. Its calculation is Days
  from Receipt to Posted, measured in days. It is applied across virtually every sector. It provides the
  day-to-day signal that a process is running as designed. Reduction is the goal, and sustained decreases
  indicate successful intervention.
