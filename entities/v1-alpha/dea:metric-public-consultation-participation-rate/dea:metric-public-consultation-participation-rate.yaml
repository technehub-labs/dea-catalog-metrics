id: dea:metric-public-consultation-participation-rate
name: Public Consultation Participation Rate
type: Metric
description: 'A Public Sector & Citizen Service Standard Measures (Deep Dive) indicator, Public Consultation
  Participation Rate (PCPR-PS) quantifies the engagement or satisfaction of the people involved. It guides
  mid-horizon planning: portfolio, program, and function owners act on it between review cycles. The formula
  is Respondents to Consultation / Notified Population Sample - reported in percent (%). Improvement means
  raising this figure toward best-in-class levels. It is a standard measure in the Public sector sector.'
abbreviation: PCPR-PS
unit: percent
version: 1.1.0
