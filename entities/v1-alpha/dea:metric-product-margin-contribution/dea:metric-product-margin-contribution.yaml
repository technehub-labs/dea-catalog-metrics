id: dea:metric-product-margin-contribution
name: Product Margin Contribution
type: Metric
description: Within Product Management, Product Margin Contribution (PMC) is used to gauge the economic
  value created or preserved. Its calculation is (Product Revenue - Product Cost) / Product Revenue, measured
  in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PMC
unit: percent
