id: dea:metric-handover-success-rate
name: Handover Success Rate
type: Metric
description: Handover Success Rate (HOSR) addresses the quality of outputs and outcomes and is a fixture
  of telecom network operations reporting. It is computed as Successful Handovers / Handover Attempts,
  expressed in percent (%). Its use is concentrated in Telecommunications. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: HOSR
unit: percent
