id: dea:metric-logistics-delay-time
name: Logistics Delay Time
type: Metric
description: 'Logistics Delay Time (LGT) captures how efficiently resources are converted into outputs
  for organizations tracking reliability & maintainability engineering (deep dive). It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. The formula is Waiting Time for
  Parts and Resources / Repair Cycle - reported in hours. It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
