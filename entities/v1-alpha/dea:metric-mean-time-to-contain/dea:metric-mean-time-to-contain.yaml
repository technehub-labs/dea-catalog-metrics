id: dea:metric-mean-time-to-contain
name: Mean Time to Contain
type: Metric
description: Mean Time to Contain (MTTC) measures exposure to adverse outcomes in the Cybersecurity domain.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  The formula is Total Containment Time / Security Incidents - reported in hours. It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: MTTC
unit: hour
