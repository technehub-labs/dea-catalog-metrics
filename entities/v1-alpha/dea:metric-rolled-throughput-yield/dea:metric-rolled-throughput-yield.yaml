id: dea:metric-rolled-throughput-yield
name: Rolled Throughput Yield
type: Metric
description: 'Rolled Throughput Yield (RTYS) addresses the quality of outputs and outcomes and is a fixture
  of process capability & six sigma (deep dive) reporting. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. The formula is Product of Step Yields across Process
  Chain - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  It is a standard measure in the Manufacturing sector.'
