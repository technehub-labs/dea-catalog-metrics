id: dea:metric-safety-incidents-in-automated-cells
name: Safety Incidents in Automated Cells
type: Metric
description: Safety Incidents in Automated Cells (SIAC) captures exposure to adverse outcomes for organizations
  tracking industrial automation & robotics. The formula is Recordable Incidents in Automated Areas /
  Period - reported in count (items per period). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Manufacturing sector.
