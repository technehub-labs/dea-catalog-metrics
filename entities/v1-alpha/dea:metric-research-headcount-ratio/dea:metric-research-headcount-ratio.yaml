id: dea:metric-research-headcount-ratio
name: Research Headcount Ratio
type: Metric
description: Research Headcount Ratio (RHR) captures capability maturity or development for organizations
  tracking r&d and innovation. Its calculation is R&D Personnel / Total Personnel, measured in percent
  (%). It is applied across virtually every sector. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Values outside the intended band, on either
  side, warrant investigation.
abbreviation: RHR
unit: percent
