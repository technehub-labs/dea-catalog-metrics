id: dea:metric-transit-security-incident-rate
name: Transit Security Incident Rate
type: Metric
description: 'Transit Security Incident Rate (TSIR) captures exposure to adverse outcomes for organizations
  tracking public transit (deep dive). The formula is Incidents per 100,000 Journeys - reported in events
  per thousand or million (scaled). It is a standard measure in the Public Transit sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. Reduction is the
  goal, and sustained decreases indicate successful intervention.'
