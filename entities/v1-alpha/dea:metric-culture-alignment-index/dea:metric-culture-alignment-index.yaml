id: dea:metric-culture-alignment-index
name: Culture Alignment Index
type: Metric
description: Culture Alignment Index (CAI) measures the engagement or satisfaction of the people involved
  in the Culture & Employee Experience domain. The formula is Weighted Index of Values Alignment Survey
  Items - reported in index (0-100 or normalized). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
