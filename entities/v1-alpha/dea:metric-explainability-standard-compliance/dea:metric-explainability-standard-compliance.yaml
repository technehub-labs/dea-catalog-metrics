id: dea:metric-explainability-standard-compliance
name: Explainability Standard Compliance
type: Metric
description: Explainability Standard Compliance (EXSC) captures conformance to standards, plans, or obligations
  for organizations tracking ai governance & model risk management. Its calculation is Models Meeting
  Explainability Requirement / In-Scope Models, measured in percent (%). It is applied across virtually
  every sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
