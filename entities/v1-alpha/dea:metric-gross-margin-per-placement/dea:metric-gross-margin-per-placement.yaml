id: dea:metric-gross-margin-per-placement
name: Gross Margin per Placement
type: Metric
description: Gross Margin per Placement (GMP) addresses the economic value created or preserved and is
  a fixture of staffing & recruiting reporting. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as (Placement Revenue - Payroll and Statutory
  Costs) / Placement Revenue; the result is stated in percent (%). Improvement means raising this figure
  toward best-in-class levels. In Staffing & recruiting, it is a recognized element of the standard performance
  toolkit.
abbreviation: GMP
unit: percent
