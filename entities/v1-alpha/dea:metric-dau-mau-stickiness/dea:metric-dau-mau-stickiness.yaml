id: dea:metric-dau-mau-stickiness
name: DAU/MAU Stickiness
type: Metric
description: 'A Product Management indicator, DAU/MAU Stickiness (STICK) quantifies the engagement or
  satisfaction of the people involved. It is computed as Daily Active Users / Monthly Active Users, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: STICK
unit: percent
