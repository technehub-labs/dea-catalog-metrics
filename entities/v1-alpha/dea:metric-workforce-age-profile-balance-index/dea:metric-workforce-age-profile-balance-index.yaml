id: dea:metric-workforce-age-profile-balance-index
name: Workforce Age Profile Balance Index
type: Metric
description: A Standard Workforce & Pay Metrics indicator, Workforce Age Profile Balance Index (WAPBI)
  quantifies exposure to adverse outcomes. It is defined as Distribution Evenness across Age Bands; the
  result is stated in index (0-100 or normalized). It is applied across virtually every sector. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Values outside
  the intended band, on either side, warrant investigation.
