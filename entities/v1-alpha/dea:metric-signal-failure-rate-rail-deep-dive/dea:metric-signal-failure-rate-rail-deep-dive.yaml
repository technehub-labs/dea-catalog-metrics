id: dea:metric-signal-failure-rate-rail-deep-dive
name: Signal Failure Rate (Rail Deep Dive)
type: Metric
description: A Rail Freight (Deep Dive) indicator, Signal Failure Rate (Rail Deep Dive) (SFR-D) quantifies
  exposure to adverse outcomes. Its calculation is Failures per 1,000 Signals, measured in events per
  thousand or million (scaled). It originates from and is most used in Rail practice. Its value drives
  prioritization and resource reallocation among competing initiatives. Reduction is the goal, and sustained
  decreases indicate successful intervention.
