id: dea:metric-average-journey-cycle-time
name: Average Journey Cycle Time
type: Metric
description: A Customer Journey & Experience indicator, Average Journey Cycle Time (AJCT) quantifies how
  efficiently resources are converted into outputs. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as Total Time across Journey Stages / Completed
  Journeys, expressed in days. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: AJCT
unit: day
