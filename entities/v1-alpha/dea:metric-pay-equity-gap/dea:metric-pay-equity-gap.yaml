id: dea:metric-pay-equity-gap
name: Pay Equity Gap
type: Metric
description: Pay Equity Gap (PEG-DEI) addresses conformance to standards, plans, or obligations and is
  a fixture of diversity, equity & inclusion (deep dive) reporting. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Adjusted Pay Gap for
  Equivalent Roles - reported in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
