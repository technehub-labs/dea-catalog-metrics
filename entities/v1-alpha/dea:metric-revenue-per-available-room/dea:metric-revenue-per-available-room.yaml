id: dea:metric-revenue-per-available-room
name: Revenue per Available Room
type: Metric
description: A Hospitality & Food Service indicator, Revenue per Available Room (RevPAR) quantifies the
  economic value created or preserved. Its calculation is Room Revenue / Rooms Available, measured in
  currency value. It originates from and is most used in Hospitality practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: RevPAR
unit: currency
