id: dea:metric-cross-sell-ratio-products-per-customer
name: Cross-Sell Ratio (Products per Customer)
type: Metric
description: Cross-Sell Ratio (Products per Customer) (XSR-B) addresses growth over time and is a fixture
  of retail banking & lending reporting. It is computed as Products Held / Customer Relationships, expressed
  in ratio (x:1 or x). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Banking.
