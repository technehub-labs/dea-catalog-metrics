id: dea:metric-expected-shortfall-estimate-stability
name: Expected Shortfall Estimate Stability
type: Metric
description: 'Expected Shortfall Estimate Stability (ESES) measures exposure to adverse outcomes in the
  Investment Risk & Middle Office Operations domain. It is computed as Period Change in ES Estimate at
  97.5% / Prior ES, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. Its use is concentrated in Investment management.'
abbreviation: ESES
unit: percent
