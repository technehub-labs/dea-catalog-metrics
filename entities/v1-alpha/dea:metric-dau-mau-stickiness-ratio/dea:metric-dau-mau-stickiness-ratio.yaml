id: dea:metric-dau-mau-stickiness-ratio
name: DAU/MAU Stickiness Ratio
type: Metric
description: DAU/MAU Stickiness Ratio (DAUMAU) measures the engagement or satisfaction of the people involved
  in the Web & Digital Analytics Standard Measures domain. Its calculation is Daily Active Users / Monthly
  Active Users, measured in percent (%). It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Digital product practice.
abbreviation: DAUMAU
unit: percent
version: 1.1.0
