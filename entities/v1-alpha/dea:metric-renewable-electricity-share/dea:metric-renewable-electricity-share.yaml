id: dea:metric-renewable-electricity-share
name: Renewable Electricity Share
type: Metric
description: Within Environmental, Social & Governance Reporting, Renewable Electricity Share (RES-E)
  is used to gauge environmental and social sustainability performance. The formula is Renewable Electricity
  / Total Electricity - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
