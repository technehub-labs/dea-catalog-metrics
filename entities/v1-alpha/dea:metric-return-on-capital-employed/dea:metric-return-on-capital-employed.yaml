id: dea:metric-return-on-capital-employed
name: Return on Capital Employed
type: Metric
description: 'Return on Capital Employed (ROCE) captures the economic value created or preserved for organizations
  tracking finance & accounting. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as EBIT / (Total Assets - Current Liabilities), expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.'
abbreviation: ROCE
unit: percent
