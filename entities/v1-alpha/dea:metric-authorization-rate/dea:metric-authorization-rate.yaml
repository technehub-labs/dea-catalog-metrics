id: dea:metric-authorization-rate
name: Authorization Rate
type: Metric
description: Authorization Rate (AUTH) measures the quality of outputs and outcomes in the Payments &
  Fintech domain. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Approved Transactions / Authorization Attempts - reported in percent (%).
  Improvement means raising this figure toward best-in-class levels. It is a standard measure in the Payments
  & fintech sector.
