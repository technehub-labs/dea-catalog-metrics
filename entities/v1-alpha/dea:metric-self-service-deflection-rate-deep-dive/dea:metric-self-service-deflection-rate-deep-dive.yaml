id: dea:metric-self-service-deflection-rate-deep-dive
name: Self-Service Deflection Rate (Deep Dive)
type: Metric
description: 'Self-Service Deflection Rate (Deep Dive) (SSDRDD) measures how efficiently resources are
  converted into outputs in the Contact Center Standard Measures (Deep Dive) domain. It is defined as
  Contacts Deflected by Self-Service / Total Demand; the result is stated in percent (%). It is applied
  across virtually every sector. It is a working-level control: thresholds trigger immediate operational
  response. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: SSDRDD
unit: percent
