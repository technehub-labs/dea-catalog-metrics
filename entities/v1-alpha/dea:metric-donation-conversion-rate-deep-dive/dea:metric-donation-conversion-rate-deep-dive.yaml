id: dea:metric-donation-conversion-rate-deep-dive
name: Donation Conversion Rate (Deep Dive)
type: Metric
description: Donation Conversion Rate (Deep Dive) (DCR-D) measures growth over time in the Nonprofit &
  Donor Operations (Deep Dive) domain. Its calculation is Completed Donations / Donation Page Visits,
  measured in percent (%). It originates from and is most used in Nonprofit practice. Its value drives
  prioritization and resource reallocation among competing initiatives. It should be maximized within
  the limits of cost and quality trade-offs.
