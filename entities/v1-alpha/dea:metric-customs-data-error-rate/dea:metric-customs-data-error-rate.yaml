id: dea:metric-customs-data-error-rate
name: Customs Data Error Rate
type: Metric
description: 'Customs Data Error Rate (CDER) captures the quality of outputs and outcomes for organizations
  tracking international trade & customs. It is defined as Entry Data Errors Found / Entry Lines; the
  result is stated in events per thousand or million (scaled). In Logistics & Trade, it is a recognized
  element of the standard performance toolkit. It is a working-level control: thresholds trigger immediate
  operational response. Reduction is the goal, and sustained decreases indicate successful intervention.'
