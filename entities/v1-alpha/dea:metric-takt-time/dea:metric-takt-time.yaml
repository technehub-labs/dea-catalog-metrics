id: dea:metric-takt-time
name: Takt Time
type: Metric
description: 'Within Process Excellence (Lean Six Sigma), Takt Time (TAKT) is used to gauge the utilization
  or availability of capacity. The formula is Available Production Time / Customer Demand Units - reported
  in seconds. It is applied across virtually every sector. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. Values outside the intended band, on either side, warrant
  investigation.'
abbreviation: TAKT
unit: second
