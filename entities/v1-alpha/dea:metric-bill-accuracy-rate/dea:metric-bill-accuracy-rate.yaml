id: dea:metric-bill-accuracy-rate
name: Bill Accuracy Rate
type: Metric
description: 'Within Utilities Customer Operations, Bill Accuracy Rate (BAR-U) is used to gauge the quality
  of outputs and outcomes. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. It is computed as Bills Issued without Correction / Bills Issued, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Utilities.'
