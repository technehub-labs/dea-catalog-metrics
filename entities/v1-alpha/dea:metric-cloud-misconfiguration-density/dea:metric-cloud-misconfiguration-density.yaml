id: dea:metric-cloud-misconfiguration-density
name: Cloud Misconfiguration Density
type: Metric
description: A Cloud Security Posture Management indicator, Cloud Misconfiguration Density (CMDEN) quantifies
  exposure to adverse outcomes. It is computed as Open Misconfigurations per 100 Cloud Resources, expressed
  in events per thousand or million (scaled). Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
