id: dea:metric-tech-debt-remediation-effort-ratio
name: Tech Debt Remediation Effort Ratio
type: Metric
description: Tech Debt Remediation Effort Ratio (TDREM) addresses how efficiently resources are converted
  into outputs and is a fixture of code quality & static analysis reporting. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Estimated
  Remediation Hours / Development Hours, measured in percent (%). It should be driven down, since lower
  readings signal healthier performance. It originates from and is most used in Software practice.
abbreviation: TDREM
unit: percent
