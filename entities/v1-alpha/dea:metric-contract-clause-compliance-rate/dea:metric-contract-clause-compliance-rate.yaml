id: dea:metric-contract-clause-compliance-rate
name: Contract Clause Compliance Rate
type: Metric
description: Contract Clause Compliance Rate (CCCR) addresses conformance to standards, plans, or obligations
  and is a fixture of legal reporting. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Contracts Containing All Required Clauses / Contracts
  Executed, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: CCCR
unit: percent
