id: dea:metric-lifetime-value-per-player
name: Lifetime Value per Player
type: Metric
description: 'Within Gaming, Lifetime Value per Player (LTV-G) is used to gauge the economic value created
  or preserved. It is computed as Average Lifetime Revenue per Player, expressed in currency value. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is concentrated
  in Gaming.'
