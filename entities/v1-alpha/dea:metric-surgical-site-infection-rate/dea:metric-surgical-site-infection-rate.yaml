id: dea:metric-surgical-site-infection-rate
name: Surgical Site Infection Rate
type: Metric
description: 'Surgical Site Infection Rate (SSIR-HC) measures exposure to adverse outcomes in the Healthcare
  Quality & Patient Safety Standard Measures domain. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as SSI Events / Surgical Procedures,
  expressed in percent (%). It should be driven down, since lower readings signal healthier performance.
  Its use is concentrated in Healthcare.'
