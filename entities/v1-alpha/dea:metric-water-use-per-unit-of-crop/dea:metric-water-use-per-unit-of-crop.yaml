id: dea:metric-water-use-per-unit-of-crop
name: Water Use per Unit of Crop
type: Metric
description: Water Use per Unit of Crop (WUC) addresses environmental and social sustainability performance
  and is a fixture of agriculture & food processing reporting. It is computed as Irrigation Water / Crop
  Mass Produced, expressed in ratio (x:1 or x). Its use is concentrated in Agriculture & food. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. Reduction is the goal,
  and sustained decreases indicate successful intervention.
