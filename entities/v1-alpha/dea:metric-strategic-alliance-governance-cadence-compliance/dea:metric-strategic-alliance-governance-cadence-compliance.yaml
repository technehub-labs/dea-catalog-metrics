id: dea:metric-strategic-alliance-governance-cadence-compliance
name: Strategic Alliance Governance Cadence Compliance
type: Metric
description: Strategic Alliance Governance Cadence Compliance (SAGCC) captures conformance to standards,
  plans, or obligations for organizations tracking alliances & partnerships management. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. The formula is Joint
  Steering Meetings Held per Charter / Scheduled - reported in percent (%). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
