id: dea:metric-on-time-performance-transit
name: On-Time Performance (Transit)
type: Metric
description: On-Time Performance (Transit) (OTP-T) addresses the quality of outputs and outcomes and is
  a fixture of public transit reporting. Its calculation is Trips Departing Key Stops within Threshold
  / Trips, measured in percent (%). It originates from and is most used in Public transit practice. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
