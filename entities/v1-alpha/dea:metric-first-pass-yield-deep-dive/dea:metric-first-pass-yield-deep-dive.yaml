id: dea:metric-first-pass-yield-deep-dive
name: First Pass Yield (Deep Dive)
type: Metric
description: 'First Pass Yield (Deep Dive) (FPYDD) addresses the quality of outputs and outcomes and is
  a fixture of process capability & six sigma (deep dive) reporting. The formula is Units Passing All
  Steps without Rework / Units Started - reported in percent (%). It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. Higher values are better; gains are read as improvement
  and losses as deterioration. It is a standard measure in the Manufacturing sector.'
abbreviation: FPYDD
unit: percent
