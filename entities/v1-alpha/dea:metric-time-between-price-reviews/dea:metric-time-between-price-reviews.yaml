id: dea:metric-time-between-price-reviews
name: Time between Price Reviews
type: Metric
description: Time between Price Reviews (TBPR) measures conformance to standards, plans, or obligations
  in the Pricing & Revenue Management domain. Its calculation is Days since Last Documented Price Review
  per Segment, measured in days. Its value drives prioritization and resource reallocation among competing
  initiatives. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
