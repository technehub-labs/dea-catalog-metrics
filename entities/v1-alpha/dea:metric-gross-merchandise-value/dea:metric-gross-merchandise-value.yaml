id: dea:metric-gross-merchandise-value
name: Gross Merchandise Value
type: Metric
description: Gross Merchandise Value (GMV) captures growth over time for organizations tracking retail
  & e-commerce. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It is defined as Total Value of Goods Transacted via Platform; the result is stated in currency
  value. Improvement means raising this figure toward best-in-class levels. In Retail, it is a recognized
  element of the standard performance toolkit.
