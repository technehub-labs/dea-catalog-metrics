id: dea:metric-waste-as-percent-of-food-purchased-deep-dive
name: Waste as Percent of Food Purchased (Deep Dive)
type: Metric
description: Waste as Percent of Food Purchased (Deep Dive) (WPF-D) captures how efficiently resources
  are converted into outputs for organizations tracking restaurant operations (deep dive). It is defined
  as Food Wasted / Food Purchased; the result is stated in percent (%). In Restaurants, it is a recognized
  element of the standard performance toolkit. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. Reduction is the goal, and sustained decreases indicate successful
  intervention.
abbreviation: WPF-D
