id: dea:metric-employee-self-service-adoption
name: Employee Self-Service Adoption
type: Metric
description: 'Employee Self-Service Adoption (ESSA) captures how efficiently resources are converted into
  outputs for organizations tracking shared services & global business services. It is computed as Transactions
  Completed by Employees via Self-Service / Total Transactions, expressed in percent (%). It is applied
  across virtually every sector. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: ESSA
unit: percent
