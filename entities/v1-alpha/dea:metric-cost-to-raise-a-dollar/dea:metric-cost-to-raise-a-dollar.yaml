id: dea:metric-cost-to-raise-a-dollar
name: Cost to Raise a Dollar
type: Metric
description: Cost to Raise a Dollar (CTR) measures how efficiently resources are converted into outputs
  in the Nonprofit & NGO domain. Its calculation is Fundraising Cost / Funds Raised, measured in ratio
  (x:1 or x). It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Lower values are better; each reduction is an improvement. It originates from and
  is most used in Nonprofit & NGO practice.
