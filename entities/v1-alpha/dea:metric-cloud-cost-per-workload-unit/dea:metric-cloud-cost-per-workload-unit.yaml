id: dea:metric-cloud-cost-per-workload-unit
name: Cloud Cost per Workload Unit
type: Metric
description: Within Data Centers & Cloud Infrastructure, Cloud Cost per Workload Unit (CCPW) is used to
  gauge how efficiently resources are converted into outputs. It is computed as Cloud Spend / Workload
  Units, expressed in currency per unit. Its use is concentrated in Technology. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: CCPW
