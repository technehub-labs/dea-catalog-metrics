id: dea:metric-reserving-cycle-time
name: Reserving Cycle Time
type: Metric
description: Reserving Cycle Time (RCT) captures how efficiently resources are converted into outputs
  for organizations tracking actuarial & reserving. It is computed as Days to Complete Reserving Valuation,
  expressed in days. Its use is concentrated in Insurance. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. Reduction is the goal, and sustained decreases
  indicate successful intervention.
