id: dea:metric-daily-active-users
name: Daily Active Users
type: Metric
description: Daily Active Users (DAU) captures the engagement or satisfaction of the people involved for
  organizations tracking product management. Its calculation is Unique Active Users per Day, measured
  in count (items per period). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
