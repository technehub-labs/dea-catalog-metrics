id: dea:metric-response-time-to-online-reviews
name: Response Time to Online Reviews
type: Metric
description: 'A Hotel & Resort Operations (Deep Dive) indicator, Response Time to Online Reviews (RTOR)
  quantifies the engagement or satisfaction of the people involved. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Hours to Respond to Guest Review
  - reported in hours. It should be driven down, since lower readings signal healthier performance. It
  is a standard measure in the Hospitality sector.'
