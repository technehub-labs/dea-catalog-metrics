id: dea:metric-return-on-invested-capital-deep-dive
name: Return on Invested Capital (Deep Dive)
type: Metric
description: 'Return on Invested Capital (Deep Dive) (ROICDD) measures the economic value created or preserved
  in the Financial Statement Analysis Ratios (Deep Dive) domain. It is computed as NOPAT / Invested Capital,
  expressed in percent (%). It is applied across virtually every sector. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It should be maximized within the
  limits of cost and quality trade-offs.'
abbreviation: ROICDD
unit: percent
