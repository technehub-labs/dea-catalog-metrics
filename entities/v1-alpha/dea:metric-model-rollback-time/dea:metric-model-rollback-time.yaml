id: dea:metric-model-rollback-time
name: Model Rollback Time
type: Metric
description: Model Rollback Time (MRBT) captures how efficiently resources are converted into outputs
  for organizations tracking mlops & model lifecycle operations. It is computed as Minutes to Roll Back
  to Prior Model Version, expressed in minutes. It is applied across virtually every sector. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. Reduction
  is the goal, and sustained decreases indicate successful intervention.
