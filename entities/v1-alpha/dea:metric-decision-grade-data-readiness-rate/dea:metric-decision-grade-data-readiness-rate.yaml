id: dea:metric-decision-grade-data-readiness-rate
name: Decision-Grade Data Readiness Rate
type: Metric
description: 'Decision-Grade Data Readiness Rate (DGDRA) addresses the quality of outputs and outcomes
  and is a fixture of data governance & stewardship reporting. It is computed as Enterprise Reports Sourced
  from Governed Data / Reports, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
