id: dea:metric-portfolio-vacancy-rate
name: Portfolio Vacancy Rate
type: Metric
description: Portfolio Vacancy Rate (PVR) measures the utilization or availability of capacity in the
  Facilities & Real Estate domain. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Vacant Leasable Area / Total Leasable Area, measured
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: PVR
unit: percent
