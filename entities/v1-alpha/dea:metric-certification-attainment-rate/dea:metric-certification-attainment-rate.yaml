  Learning & Development domain. The formula is Employees Earning Certifications / Employees Enrolled
  - reported in percent (%). It is applied across virtually every sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
