id: dea:metric-community-sentiment-score-gaming
name: Community Sentiment Score (Gaming)
type: Metric
description: Community Sentiment Score (Gaming) (CSS-G) measures the engagement or satisfaction of the
  people involved in the Gaming Development & Live Operations domain. It is defined as Composite Player
  Sentiment Score; the result is stated in score (points). It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Higher values are better; gains are read as improvement
  and losses as deterioration. In Gaming, it is a recognized element of the standard performance toolkit.
