id: dea:metric-days-payable-outstanding-deep-dive
name: Days Payable Outstanding (Deep Dive)
type: Metric
description: Days Payable Outstanding (Deep Dive) (DPODD) measures how efficiently resources are converted
  into outputs in the Accounts Payable & Receivable Operations (Deep Dive) domain. It is defined as Average
  Days from Invoice to Payment; the result is stated in days. It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Values
  outside the intended band, on either side, warrant investigation.
