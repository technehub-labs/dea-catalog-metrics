id: dea:metric-time-to-treatment-for-stroke
name: Time to Treatment for Stroke
type: Metric
description: Time to Treatment for Stroke (TTTS) addresses the quality of outputs and outcomes and is
  a fixture of healthcare reporting. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Minutes from Arrival to Thrombolysis, measured
  in minutes. It should be driven down, since lower readings signal healthier performance. It originates
  from and is most used in Healthcare practice.
abbreviation: TTTS
unit: minute
