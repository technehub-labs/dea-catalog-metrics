id: dea:metric-executive-compensation-pay-for-performance-alignment
name: Executive Compensation Pay-for-Performance Alignment
type: Metric
description: Within Corporate Governance, Executive Compensation Pay-for-Performance Alignment (ECPA)
  is used to gauge the economic value created or preserved. It is defined as Executives Above Target Pay
  / Executives Above Target Performance; the result is stated in ratio (x:1 or x). It is applied across
  virtually every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Values outside the intended band, on either side, warrant investigation.
abbreviation: ECPA
