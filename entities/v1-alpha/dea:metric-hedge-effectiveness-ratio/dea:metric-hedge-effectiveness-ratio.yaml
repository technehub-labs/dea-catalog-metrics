id: dea:metric-hedge-effectiveness-ratio
name: Hedge Effectiveness Ratio
type: Metric
description: Hedge Effectiveness Ratio (HER) captures exposure to adverse outcomes for organizations tracking
  treasury & cash management. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Change in Hedge Fair Value / Change in Hedged Exposure Value, expressed
  in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: HER
unit: ratio
