id: dea:metric-excess-return-consistency-rate
name: Excess Return Consistency Rate
type: Metric
description: Excess Return Consistency Rate (ERCR) addresses the economic value created or preserved and
  is a fixture of investment performance measurement reporting. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Periods Beating
  Benchmark / Periods in Window, measured in percent (%). Improvement means raising this figure toward
  best-in-class levels. It originates from and is most used in Investment management practice.
