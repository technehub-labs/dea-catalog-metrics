id: dea:metric-survivorship-rule-consistency-rate
name: Survivorship Rule Consistency Rate
type: Metric
description: A Master Data Management indicator, Survivorship Rule Consistency Rate (SRCS) quantifies
  the quality of outputs and outcomes. It is computed as Golden Records Built per Survivorship Rules /
  Golden Records, expressed in percent (%). It is applied across virtually every sector. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. It should be
  maximized within the limits of cost and quality trade-offs.
