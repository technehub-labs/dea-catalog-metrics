id: dea:metric-merge-conflict-rate
name: Merge Conflict Rate
type: Metric
description: Merge Conflict Rate (MCR-SD) captures how efficiently resources are converted into outputs
  for organizations tracking software development - coding & engineering practices. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It is computed as Merges
  Requiring Conflict Resolution / Merges, expressed in percent (%). It should be driven down, since lower
  readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: MCR-SD
unit: percent
