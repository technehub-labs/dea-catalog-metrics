id: dea:metric-fuel-efficiency
name: Fuel Efficiency
type: Metric
description: 'Fuel Efficiency (FUE) measures how efficiently resources are converted into outputs in the
  Logistics & Transportation domain. The formula is Distance Traveled / Fuel Consumed - reported in ratio
  (x:1 or x). It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Higher values are better; gains are read as improvement and losses as deterioration. It is a standard
  measure in the Logistics sector.'
abbreviation: FUE
unit: ratio
