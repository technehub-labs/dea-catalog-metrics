id: dea:metric-tenant-retention-rate-real-estate
name: Tenant Retention Rate (Real Estate)
type: Metric
description: A Real Estate & Mortgage Standard Measures indicator, Tenant Retention Rate (Real Estate)
  (TRR-RE) quantifies the retention of customers, users, or assets over time. The formula is Leases Renewed
  / Leases Expiring - reported in percent (%). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Real estate sector.
