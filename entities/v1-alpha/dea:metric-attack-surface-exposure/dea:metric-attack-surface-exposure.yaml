id: dea:metric-attack-surface-exposure
name: Attack Surface Exposure
type: Metric
description: Attack Surface Exposure (ASE) addresses exposure to adverse outcomes and is a fixture of
  cybersecurity reporting. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Internet-Exposed Assets Requiring Remediation, expressed in count
  (items per period). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: ASE
unit: count
