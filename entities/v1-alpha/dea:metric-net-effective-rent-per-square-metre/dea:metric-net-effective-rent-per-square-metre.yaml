id: dea:metric-net-effective-rent-per-square-metre
name: Net Effective Rent per Square Metre
type: Metric
description: 'Net Effective Rent per Square Metre (NER) addresses the economic value created or preserved
  and is a fixture of real estate portfolio & property management reporting. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Net Rent
  Net of Concessions / Lettable Area, expressed in currency per unit. Improvement means raising this figure
  toward best-in-class levels. Its use is concentrated in Real Estate.'
