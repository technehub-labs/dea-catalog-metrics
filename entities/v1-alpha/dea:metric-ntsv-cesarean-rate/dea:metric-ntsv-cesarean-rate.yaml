id: dea:metric-ntsv-cesarean-rate
name: NTSV Cesarean Rate
type: Metric
description: Within Healthcare Quality & Patient Safety Standard Measures, NTSV Cesarean Rate (NTSV) is
  used to gauge the quality of outputs and outcomes. Its calculation is Cesarean Deliveries among Low-Risk
  First Births / Such Births, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Lower values are better; each reduction is
  an improvement. It originates from and is most used in Healthcare practice.
abbreviation: NTSV
unit: percent
