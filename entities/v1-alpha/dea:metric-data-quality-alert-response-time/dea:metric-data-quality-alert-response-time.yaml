id: dea:metric-data-quality-alert-response-time
name: Data Quality Alert Response Time
type: Metric
description: A Data Quality Management indicator, Data Quality Alert Response Time (DQART) quantifies
  how efficiently resources are converted into outputs. Its calculation is Hours from Quality Alert to
  Triage Decision, measured in hours. It provides the day-to-day signal that a process is running as designed.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
abbreviation: DQART
