id: dea:metric-audit-cycle-coverage
name: Audit Cycle Coverage
type: Metric
description: A Internal Audit indicator, Audit Cycle Coverage (ACC) quantifies conformance to standards,
  plans, or obligations. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Auditable Entities Audited within Cycle / Auditable Universe - reported in
  percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: ACC
unit: percent
