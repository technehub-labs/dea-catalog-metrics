id: dea:metric-claim-reserve-accuracy-initial
name: Claim Reserve Accuracy (Initial)
type: Metric
description: Within Insurance Claims Deep Dive, Claim Reserve Accuracy (Initial) (CRAI) is used to gauge
  the quality of outputs and outcomes. It is computed as Ultimate Claim Cost / Initial Reserve, expressed
  in ratio (x:1 or x). Its use is concentrated in Insurance. Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. Values outside the intended band, on either
  side, warrant investigation.
