id: dea:metric-supplier-ppm-automotive
name: Supplier PPM (Automotive)
type: Metric
description: 'Supplier PPM (Automotive) (SPPM) captures the quality of outputs and outcomes for organizations
  tracking automotive. It guides mid-horizon planning: portfolio, program, and function owners act on
  it between review cycles. The formula is Defective Supplier Parts per Million Parts Received - reported
  in events per thousand or million (scaled). It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Automotive sector.'
