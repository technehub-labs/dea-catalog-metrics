id: dea:metric-catastrophe-exposure-concentration
name: Catastrophe Exposure Concentration
type: Metric
description: Catastrophe Exposure Concentration (CEC) captures exposure to adverse outcomes for organizations
  tracking insurance underwriting. It is defined as Catastrophe-Exposed Sum Insured / Total Sum Insured;
  the result is stated in percent (%). In Insurance, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  Values outside the intended band, on either side, warrant investigation.
abbreviation: CEC
unit: percent
version: 1.1.0
