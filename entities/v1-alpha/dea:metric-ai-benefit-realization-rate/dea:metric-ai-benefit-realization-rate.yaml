id: dea:metric-ai-benefit-realization-rate
name: AI Benefit Realization Rate
type: Metric
description: AI Benefit Realization Rate (AIBRR) addresses the economic value created or preserved and
  is a fixture of ai governance & model risk management reporting. The formula is Realized Benefits vs
  Business Case / Business Case - reported in percent (%). It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
