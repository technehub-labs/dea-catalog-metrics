id: dea:metric-truck-loading-cycle-time-cement
name: Truck Loading Cycle Time (Cement)
type: Metric
description: Truck Loading Cycle Time (Cement) (TLCT) measures how efficiently resources are converted
  into outputs in the Cement & Building Materials domain. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Minutes to Load and Dispatch Truck, measured in minutes.
  It should be driven down, since lower readings signal healthier performance. It originates from and
  is most used in Manufacturing practice.
