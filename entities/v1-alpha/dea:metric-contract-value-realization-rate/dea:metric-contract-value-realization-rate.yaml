id: dea:metric-contract-value-realization-rate
name: Contract Value Realization Rate
type: Metric
description: Contract Value Realization Rate (CVRR) captures the economic value created or preserved for
  organizations tracking contract lifecycle management. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Realized Value vs Contracted Entitlements
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
