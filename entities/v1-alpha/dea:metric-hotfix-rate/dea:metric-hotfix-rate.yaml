id: dea:metric-hotfix-rate
name: Hotfix Rate
type: Metric
description: A Continuous Delivery & Deployment indicator, Hotfix Rate (HFR-CD) quantifies exposure to
  adverse outcomes. It is defined as Hotfixes / Total Deployments; the result is stated in percent (%).
  It is applied across virtually every sector. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. Reduction is the goal, and sustained decreases indicate successful
  intervention.
abbreviation: HFR-CD
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- risk
scope_classification:
- capability
directionality: lower_is_better
management_significance:
