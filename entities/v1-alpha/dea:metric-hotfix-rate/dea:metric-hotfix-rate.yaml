source_credit: Public domain - no attribution required
calculation_definition: Hotfixes / Total Deployments
formula_definition:
  formula_id: dea:formula-hotfix-rate
  expression: HFR-CD = Hotfixes / Total Deployments
  inputs:
  - name: Hotfixes
  - name: Total Deployments
