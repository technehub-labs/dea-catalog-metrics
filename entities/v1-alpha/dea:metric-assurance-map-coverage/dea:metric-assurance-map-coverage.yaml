id: dea:metric-assurance-map-coverage
name: Assurance Map Coverage
type: Metric
description: Assurance Map Coverage (AMC-GOV) measures exposure to adverse outcomes in the Enterprise
  Decision Effectiveness & Governance Monitoring domain. The formula is Risks with Mapped Assurance Activities
  / Key Risks - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
