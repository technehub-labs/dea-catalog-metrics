id: dea:metric-threat-intelligence-integration-coverage
name: Threat Intelligence Integration Coverage
type: Metric
description: Threat Intelligence Integration Coverage (TIIC) addresses capability maturity or development
  and is a fixture of secops & security operations center reporting. The formula is Detection Sources
