id: dea:metric-cost-per-invoice-processed-ap
name: Cost per Invoice Processed (AP)
type: Metric
description: Cost per Invoice Processed (AP) (CPIP) addresses how efficiently resources are converted
  into outputs and is a fixture of accounts payable & receivable operations (deep dive) reporting. Its
  calculation is AP Cost / Invoices Processed, measured in currency per unit. It is applied across virtually
  every sector. Its value drives prioritization and resource reallocation among competing initiatives.
  Reduction is the goal, and sustained decreases indicate successful intervention.
