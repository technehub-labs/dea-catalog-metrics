id: dea:metric-leadership-pipeline-strength-index
name: Leadership Pipeline Strength Index
type: Metric
description: 'Leadership Pipeline Strength Index (LPSI-BSC) addresses capability maturity or development
  and is a fixture of balanced scorecard - learning & growth perspective reporting. It is computed as
  Ready-Now Leaders per Critical Leadership Role, expressed in ratio (x:1 or x). It is applied across
  virtually every sector. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: LPSI-BSC
unit: ratio
