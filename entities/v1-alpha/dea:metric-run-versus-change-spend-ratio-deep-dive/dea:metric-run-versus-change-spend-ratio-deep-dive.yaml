id: dea:metric-run-versus-change-spend-ratio-deep-dive
name: Run versus Change Spend Ratio (Deep Dive)
type: Metric
description: Within IT Financial Management & Technology Budgeting, Run versus Change Spend Ratio (Deep
  Dive) (RVCS-D) is used to gauge how efficiently resources are converted into outputs. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. The formula is Run-the-Business
  Spend / Total IT Spend - reported in percent (%). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: RVCS-D
