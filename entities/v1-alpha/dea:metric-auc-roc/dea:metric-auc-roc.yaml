id: dea:metric-auc-roc
name: AUC-ROC
type: Metric
description: 'Within Statistical Model Performance Diagnostics, AUC-ROC (AUCROC) is used to gauge the
  quality of outputs and outcomes. It is defined as Area under Receiver Operating Characteristic Curve;
  the result is stated in score (points). In Software, it is a recognized element of the standard performance
  toolkit. It is a working-level control: thresholds trigger immediate operational response. It should
  be maximized within the limits of cost and quality trade-offs.'
