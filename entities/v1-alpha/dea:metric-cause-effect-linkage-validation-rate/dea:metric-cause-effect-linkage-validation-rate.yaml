id: dea:metric-cause-effect-linkage-validation-rate
name: Cause-Effect Linkage Validation Rate
type: Metric
description: Within Balanced Scorecard Implementation & Review, Cause-Effect Linkage Validation Rate (CELV)
  is used to gauge the quality of outputs and outcomes. Its calculation is Hypothesized Linkages Supported
  by Correlation / Linkages, measured in percent (%). It is applied across virtually every sector. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
