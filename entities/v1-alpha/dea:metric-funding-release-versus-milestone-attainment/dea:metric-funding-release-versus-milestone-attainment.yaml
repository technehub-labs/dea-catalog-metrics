id: dea:metric-funding-release-versus-milestone-attainment
name: Funding Release versus Milestone Attainment
type: Metric
description: Funding Release versus Milestone Attainment (FRVMA) measures conformance to standards, plans,
  or obligations in the Program & Portfolio Management domain. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Its calculation is Funding Tranches
  Released on Milestone Achievement / Tranches, measured in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
