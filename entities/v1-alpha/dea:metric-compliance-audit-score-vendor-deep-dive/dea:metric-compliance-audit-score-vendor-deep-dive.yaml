id: dea:metric-compliance-audit-score-vendor-deep-dive
name: Compliance Audit Score - Vendor (Deep Dive)
type: Metric
description: Compliance Audit Score - Vendor (Deep Dive) (CASV-D) measures conformance to standards, plans,
  or obligations in the Textile & Apparel (Deep Dive) domain. It is defined as Social and Quality Audit
  Composite Score; the result is stated in score (points). In Textiles & Apparel, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
