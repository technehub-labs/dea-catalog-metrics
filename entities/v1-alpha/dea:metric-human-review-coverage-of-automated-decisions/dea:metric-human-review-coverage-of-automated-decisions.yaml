id: dea:metric-human-review-coverage-of-automated-decisions
name: Human Review Coverage of Automated Decisions
type: Metric
description: Human Review Coverage of Automated Decisions (HRCAD) addresses exposure to adverse outcomes
  and is a fixture of ai ethics, fairness & responsible ai reporting. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Automated
  Decisions Subject to Human Review / Eligible Decisions, measured in percent (%). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
