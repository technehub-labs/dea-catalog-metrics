id: dea:metric-landfill-rate
name: Landfill Rate
type: Metric
description: Landfill Rate (LFR) measures environmental and social sustainability performance in the Sustainability
  & ESG domain. It is computed as Landfilled Waste / Total Waste, expressed in percent (%). It is applied
  across virtually every sector. It is reviewed at cadence by planning owners to correct course before
  issues become strategic. Reduction is the goal, and sustained decreases indicate successful intervention.
