id: dea:metric-grant-disbursement-timeliness-deep-dive
name: Grant Disbursement Timeliness (Deep Dive)
type: Metric
description: Grant Disbursement Timeliness (Deep Dive) (GDT) measures conformance to standards, plans,
  or obligations in the Government & Public Administration domain. Its calculation is Grants Disbursed
  by Deadline / Grants Approved, measured in percent (%). It originates from and is most used in Public
  Sector practice. Its value drives prioritization and resource reallocation among competing initiatives.
  It should be maximized within the limits of cost and quality trade-offs.
