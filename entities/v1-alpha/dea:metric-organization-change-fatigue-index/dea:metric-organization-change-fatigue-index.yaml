id: dea:metric-organization-change-fatigue-index
name: Organization Change Fatigue Index
type: Metric
description: Organization Change Fatigue Index (OCFI-OM) captures exposure to adverse outcomes for organizations
  tracking operating model monitoring & design effectiveness. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Concurrent Major Changes per Unit,
  expressed in count (items per period). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: OCFI-OM
unit: count
version: 1.1.0
lifecycle_status: candidate
