id: dea:metric-change-driven-productivity-dip-duration
name: Change-Driven Productivity Dip Duration
type: Metric
description: A Change Management indicator, Change-Driven Productivity Dip Duration (CPDD) quantifies
  exposure to adverse outcomes. It is defined as Days below Baseline Productivity after Change Go-Live;
  the result is stated in days. It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. Reduction is the goal, and
  sustained decreases indicate successful intervention.
