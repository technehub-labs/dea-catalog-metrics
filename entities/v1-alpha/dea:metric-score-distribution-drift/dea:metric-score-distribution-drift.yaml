id: dea:metric-score-distribution-drift
name: Score Distribution Drift
type: Metric
description: 'Score Distribution Drift (SDDM) captures exposure to adverse outcomes for organizations
  tracking statistical model performance diagnostics. The formula is Period Change in Score Population
  Moments vs Baseline - reported in percent (%). It is a standard measure in the Software sector. It is
  monitored close to the work: teams act on it within a shift, sprint, or daily review. Reduction is the
  goal, and sustained decreases indicate successful intervention.'
