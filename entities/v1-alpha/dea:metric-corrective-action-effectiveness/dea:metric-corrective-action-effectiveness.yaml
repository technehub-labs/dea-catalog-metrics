id: dea:metric-corrective-action-effectiveness
name: Corrective Action Effectiveness
type: Metric
description: Within Quality Management, Corrective Action Effectiveness (CAE) is used to gauge the quality
  of outputs and outcomes. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Actions Verified Effective / Actions Implemented, expressed in percent
  (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
abbreviation: CAE
unit: percent
version: 1.0.0
