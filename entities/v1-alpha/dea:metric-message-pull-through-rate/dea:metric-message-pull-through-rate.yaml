id: dea:metric-message-pull-through-rate
name: Message Pull-Through Rate
type: Metric
description: 'A Corporate Communications & PR indicator, Message Pull-Through Rate (MPTR) quantifies how
  effectively a process or entity achieves its intended outcome. It is computed as Coverage Containing
  Key Messages / Total Coverage, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: MPTR
unit: percent
