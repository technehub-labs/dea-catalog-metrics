id: dea:metric-learning-transfer-rate-deep-dive
name: Learning Transfer Rate (Deep Dive)
type: Metric
description: Learning Transfer Rate (Deep Dive) (LTR-BSC) captures how effectively a process or entity
  achieves its intended outcome for organizations tracking balanced scorecard - learning & growth perspective.
  It is defined as Learned Skills Applied on Job within 90 Days / Skills Taught; the result is stated
  in percent (%). It is applied across virtually every sector. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It should be maximized within the limits of cost
  and quality trade-offs.
abbreviation: LTR-BSC
unit: percent
