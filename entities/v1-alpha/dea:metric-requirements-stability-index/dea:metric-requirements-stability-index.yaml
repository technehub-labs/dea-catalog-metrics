id: dea:metric-requirements-stability-index
name: Requirements Stability Index
type: Metric
description: 'A Requirements Engineering & Product Discovery indicator, Requirements Stability Index (RSI-RE)
  quantifies exposure to adverse outcomes. The formula is Unchanged Requirements after Baseline / Baseline
  - reported in percent (%). It is applied across virtually every sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
