id: dea:metric-average-lease-term-remaining
name: Average Lease Term Remaining
type: Metric
description: Average Lease Term Remaining (ALTR) measures exposure to adverse outcomes in the Real Estate
  Portfolio & Property Management domain. The formula is Weighted Years Unexpired across Leases - reported
  in ratio (x:1 or x). It is a standard measure in the Real Estate sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Values outside the intended band,
  on either side, warrant investigation.
