id: dea:metric-over-privileged-role-ratio
name: Over-Privileged Role Ratio
type: Metric
description: Within Cloud Security Posture Management, Over-Privileged Role Ratio (OPRR) is used to gauge
  exposure to adverse outcomes. Its calculation is Roles Exceeding Required Permissions / Roles, measured
  in percent (%). It provides the day-to-day signal that a process is running as designed. Lower values
  are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
