id: dea:metric-strategic-initiative-alignment-score
name: Strategic Initiative Alignment Score
type: Metric
description: A PMO & Portfolio Governance indicator, Strategic Initiative Alignment Score (SIAS) quantifies
  strategy. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Its calculation is Weighted Alignment of Portfolio to Strategy Objectives, measured
  in score (points). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
