id: dea:metric-voice-of-customer-coverage
name: Voice of Customer Coverage
type: Metric
description: Voice of Customer Coverage (VOCC) captures how effectively a process or entity achieves its
  intended outcome for organizations tracking requirements engineering & product discovery. The formula
  is Features Informed by VOC Evidence / Features Delivered - reported in percent (%). It is applied across
  virtually every sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: VOCC
unit: percent
version: 1.1.0
