id: dea:metric-forecast-bias
name: Forecast Bias
type: Metric
description: Forecast Bias (FB) addresses the quality of outputs and outcomes and is a fixture of supply
  chain reporting. It is computed as Sum of Forecast Errors / Sum of Actual Demand, expressed in percent
  (%). It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: FB
unit: percent
