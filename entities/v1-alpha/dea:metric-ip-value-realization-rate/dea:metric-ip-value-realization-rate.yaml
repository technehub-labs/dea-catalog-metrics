id: dea:metric-ip-value-realization-rate
name: IP Value Realization Rate
type: Metric
description: 'IP Value Realization Rate (IPVRR) addresses the economic value created or preserved and
  is a fixture of intellectual property & licensing reporting. It is computed as Products Launched Using
  Owned IP / Portfolio Assets, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Values outside the intended band, on either side, warrant investigation.'
