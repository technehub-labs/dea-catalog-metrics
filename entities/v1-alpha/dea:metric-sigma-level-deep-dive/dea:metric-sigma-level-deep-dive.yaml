id: dea:metric-sigma-level-deep-dive
name: Sigma Level (Deep Dive)
type: Metric
description: 'A Process Capability & Six Sigma (Deep Dive) indicator, Sigma Level (Deep Dive) (SIGDD)
  quantifies the quality of outputs and outcomes. It is computed as Defects per Million Opportunities
  converted to Sigma Scale, expressed in score (points). Its use is concentrated in Manufacturing. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
