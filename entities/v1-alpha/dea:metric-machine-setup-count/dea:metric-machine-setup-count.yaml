id: dea:metric-machine-setup-count
name: Machine Setup Count
type: Metric
description: 'Machine Setup Count (MSC) captures how efficiently resources are converted into outputs
  for organizations tracking manufacturing. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Number of Setups per Period - reported in count (items
  per period). The objective is neither maximization nor minimization but staying within an agreed operating
  band. It is a standard measure in the Manufacturing sector.'
