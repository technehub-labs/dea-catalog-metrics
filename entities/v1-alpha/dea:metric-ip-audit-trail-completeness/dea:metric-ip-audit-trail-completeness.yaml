id: dea:metric-ip-audit-trail-completeness
name: IP Audit Trail Completeness
type: Metric
description: IP Audit Trail Completeness (IATC) measures conformance to standards, plans, or obligations
  in the Intellectual Property & Licensing domain. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as IP Assets with Chain-of-Title Documentation
  / Assets; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: IATC
