id: dea:metric-interest-expense-ratio
name: Interest Expense Ratio
type: Metric
description: Interest Expense Ratio (IER) captures how efficiently resources are converted into outputs
  for organizations tracking treasury & cash management. Its calculation is Interest Expense / Total Debt,
  measured in percent (%). It is applied across virtually every sector. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
