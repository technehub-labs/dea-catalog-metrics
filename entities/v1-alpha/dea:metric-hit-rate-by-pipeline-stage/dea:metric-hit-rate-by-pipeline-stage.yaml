id: dea:metric-hit-rate-by-pipeline-stage
name: Hit Rate by Pipeline Stage
type: Metric
description: Hit Rate by Pipeline Stage (HRS) measures how effectively a process or entity achieves its
  intended outcome in the Sales domain. It is computed as Deals Advancing from Stage / Deals Entering
  Stage, expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: HRS
unit: percent
version: 1.1.0
