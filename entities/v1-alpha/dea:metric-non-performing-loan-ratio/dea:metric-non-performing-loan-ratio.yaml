id: dea:metric-non-performing-loan-ratio
name: Non-Performing Loan Ratio
type: Metric
description: 'Non-Performing Loan Ratio (NPL) captures exposure to adverse outcomes for organizations
  tracking banking & financial services. It is computed as Non-Performing Loans / Gross Loans, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Lower values are better; each reduction is an improvement. Its use is concentrated in
  Financial services.'
