id: dea:metric-average-revenue-per-daily-active-user
name: Average Revenue per Daily Active User
type: Metric
description: A Gaming indicator, Average Revenue per Daily Active User (ARPDAU) quantifies the economic
  value created or preserved. It is defined as Daily Revenue / Daily Active Users; the result is stated
  in currency per unit. In Gaming, it is a recognized element of the standard performance toolkit. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: ARPDAU
unit: currency
