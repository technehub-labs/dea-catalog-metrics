id: dea:metric-information-ratio
name: Information Ratio
type: Metric
description: Within Investment Management, Information Ratio (IR) is used to gauge the economic value
  created or preserved. The formula is Active Return / Tracking Error - reported in ratio (x:1 or x).
  It is a standard measure in the Asset management sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It should be maximized within the limits of
  cost and quality trade-offs.
