id: dea:metric-incident-investigation-closure-time
name: Incident Investigation Closure Time
type: Metric
description: Incident Investigation Closure Time (IICT) captures conformance to standards, plans, or obligations
  for organizations tracking health & safety. It is computed as Days from Incident to Investigation Closure,
  expressed in days. Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
