id: dea:metric-internal-fill-rate
name: Internal Fill Rate
type: Metric
description: A Human Resources indicator, Internal Fill Rate (IFR) quantifies capability maturity or development.
  It is reviewed at cadence by planning owners to correct course before issues become strategic. It is
  computed as Positions Filled Internally / Total Positions Filled, expressed in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: IFR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
- capability
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
