measurable_entity_kind: dea:OrganizationalUnit
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Positions Filled Internally / Total Positions Filled
formula_definition:
  formula_id: dea:formula-internal-fill-rate
  expression: IFR = Positions Filled Internally / Total Positions Filled
  inputs:
  - name: Positions Filled Internally
  - name: Total Positions Filled
