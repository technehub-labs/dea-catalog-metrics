id: dea:metric-ibnr-accuracy-ratio
name: IBNR Accuracy Ratio
type: Metric
description: IBNR Accuracy Ratio (IBNR-AR) captures the quality of outputs and outcomes for organizations
  tracking actuarial & reserving. The formula is Actual IBNR / Estimated IBNR - reported in ratio (x:1
  or x). It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. It is a standard measure in the Insurance sector.
abbreviation: IBNR-AR
