calculation_definition: Incidents with Completed Post-Mortem / Major Incidents
formula_definition:
  formula_id: dea:formula-incident-post-mortem-completion-rate
  expression: IPMCR = Incidents with Completed Post-Mortem / Major Incidents
  inputs:
  - name: Incidents with Completed Post
