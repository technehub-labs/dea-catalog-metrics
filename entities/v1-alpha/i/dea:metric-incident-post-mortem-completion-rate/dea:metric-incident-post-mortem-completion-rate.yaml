id: dea:metric-incident-post-mortem-completion-rate
name: Incident Post-Mortem Completion Rate
type: Metric
description: Incident Post-Mortem Completion Rate (IPMCR) measures conformance to standards, plans, or
  obligations in the SecOps & Security Operations Center domain. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Incidents with Completed Post-Mortem
  / Major Incidents - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: IPMCR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
