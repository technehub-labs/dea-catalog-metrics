id: dea:metric-iac-policy-gate-pass-rate
name: IaC Policy Gate Pass Rate
type: Metric
description: 'Within Cloud Security Posture Management, IaC Policy Gate Pass Rate (IACPG) is used to gauge
  conformance to standards, plans, or obligations. It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. The formula is Pipeline Runs Passing Policy-as-Code / Runs
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: IACPG
unit: percent
