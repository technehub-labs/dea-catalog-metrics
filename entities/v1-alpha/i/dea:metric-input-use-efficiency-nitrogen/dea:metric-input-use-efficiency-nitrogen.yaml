id: dea:metric-input-use-efficiency-nitrogen
name: Input Use Efficiency - Nitrogen
type: Metric
description: Within Agriculture & Agronomy (Deep Dive), Input Use Efficiency - Nitrogen (NUE) is used
  to gauge environmental and social sustainability performance. Its calculation is Crop Nitrogen Uptake
  / Applied Nitrogen, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Agriculture practice.
abbreviation: NUE
