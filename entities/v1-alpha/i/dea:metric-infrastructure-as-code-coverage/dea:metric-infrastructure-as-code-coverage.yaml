calculation_definition: Infrastructure Managed as Code / Total Infrastructure
formula_definition:
  formula_id: dea:formula-infrastructure-as-code-coverage
  expression: IaCC = Infrastructure Managed as Code / Total Infrastructure
  inputs:
  - name: Infrastructure Managed as Code
  - name: Total Infrastructure
