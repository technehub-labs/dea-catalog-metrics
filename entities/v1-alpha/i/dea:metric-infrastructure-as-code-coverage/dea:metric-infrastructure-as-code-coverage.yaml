id: dea:metric-infrastructure-as-code-coverage
name: Infrastructure-as-Code Coverage
type: Metric
description: 'A Continuous Delivery & Deployment indicator, Infrastructure-as-Code Coverage (IaCC) quantifies
  capability maturity or development. It is computed as Infrastructure Managed as Code / Total Infrastructure,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: IaCC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- capability
scope_classification:
- capability
directionality: higher_is_better
management_significance:
