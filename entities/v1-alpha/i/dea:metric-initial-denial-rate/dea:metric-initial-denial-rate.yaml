id: dea:metric-initial-denial-rate
name: Initial Denial Rate
type: Metric
description: Within Healthcare Revenue Cycle, Initial Denial Rate (IDR) is used to gauge exposure to adverse
  outcomes. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Its calculation is Claims Denied on First Pass / Claims Submitted, measured in percent
  (%). It should be driven down, since lower readings signal healthier performance. It originates from
  and is most used in Healthcare practice.
abbreviation: IDR
unit: percent
