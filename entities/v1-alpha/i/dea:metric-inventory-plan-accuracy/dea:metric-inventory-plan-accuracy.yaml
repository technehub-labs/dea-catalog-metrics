id: dea:metric-inventory-plan-accuracy
name: Inventory Plan Accuracy
type: Metric
description: Inventory Plan Accuracy (IPA-S) addresses the quality of outputs and outcomes and is a fixture
  of sales & operations planning reporting. It is defined as Inventory per Plan / Actual Inventory; the
  result is stated in percent (%). It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: IPA-S
unit: percent
