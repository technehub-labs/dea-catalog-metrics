id: dea:metric-investment-performance-vs-benchmark-deep-dive
name: Investment Performance vs Benchmark (Deep Dive)
type: Metric
description: Investment Performance vs Benchmark (Deep Dive) (IPVB-D) measures how effectively a process
  or entity achieves its intended outcome in the Asset & Wealth Management (Deep Dive) domain. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. It is defined as
  Portfolio Return - Benchmark Return; the result is stated in percent (%). The objective is neither maximization
  nor minimization but staying within an agreed operating band. In Financial Services, it is a recognized
  element of the standard performance toolkit.
abbreviation: IPVB-D
unit: percent
