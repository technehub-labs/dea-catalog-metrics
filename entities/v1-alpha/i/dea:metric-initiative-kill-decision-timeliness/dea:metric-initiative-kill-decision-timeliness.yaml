id: dea:metric-initiative-kill-decision-timeliness
name: Initiative Kill Decision Timeliness
type: Metric
description: Within Program & Portfolio Management, Initiative Kill Decision Timeliness (IKDT) is used
  to gauge how efficiently resources are converted into outputs. The formula is Failing Initiatives Stopped
  at Defined Checkpoints / Failing - reported in percent (%). It is applied across virtually every sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: IKDT
unit: percent
