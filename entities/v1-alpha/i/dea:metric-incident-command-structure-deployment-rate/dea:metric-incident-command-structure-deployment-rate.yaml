id: dea:metric-incident-command-structure-deployment-rate
name: Incident Command Structure Deployment Rate
type: Metric
description: Incident Command Structure Deployment Rate (ICSDR) measures conformance to standards, plans,
  or obligations in the Crisis Management & Emergency Response domain. The formula is Events Managed under
  Formal Command Structure / Events - reported in percent (%). It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: ICSDR
unit: percent
