id: dea:metric-incident-rate-environmental
name: Incident Rate (Environmental)
type: Metric
description: A Waste & Environmental Services indicator, Incident Rate (Environmental) (IRE) quantifies
  exposure to adverse outcomes. Its calculation is Reportable Environmental Incidents / Sites per Period,
  measured in ratio (x:1 or x). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Lower values are better; each reduction is an improvement. It originates
  from and is most used in Environmental services practice.
abbreviation: IRE
unit: ratio
