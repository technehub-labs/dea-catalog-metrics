id: dea:metric-institutional-ownership-share
name: Institutional Ownership Share
type: Metric
description: Institutional Ownership Share (IOS) captures the economic value created or preserved for
  organizations tracking investor relations & capital markets. Its calculation is Institutionally Held
  Shares / Shares Outstanding, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. It is managed toward a defined target band
  rather than an extreme - both overshoot and undershoot can signal problems. It originates from and is
  most used in Listed companies practice.
abbreviation: IOS
unit: percent
