id: dea:metric-data-classification-coverage
name: Data Classification Coverage
type: Metric
description: A Data Governance & Stewardship indicator, Data Classification Coverage (DCC-DG) quantifies
  exposure to adverse outcomes. It is defined as Data Assets Classified per Policy / Data Assets; the
  result is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
