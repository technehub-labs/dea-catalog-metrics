id: dea:metric-transformer-overload-events
name: Transformer Overload Events
type: Metric
description: Within Utilities Field Operations & Grid, Transformer Overload Events (TOE) is used to gauge
  exposure to adverse outcomes. It is defined as Hours above Emergency Rating per Transformer; the result
  is stated in hours. In Utilities, it is a recognized element of the standard performance toolkit. It
  bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  Reduction is the goal, and sustained decreases indicate successful intervention.
