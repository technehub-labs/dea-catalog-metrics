description: 'Configuration Backup Compliance (CBC-NW) captures exposure to adverse outcomes for organizations
  tracking network change & configuration management. The formula is Devices with Daily Config Backup
  / Devices - reported in percent (%). It is applied across virtually every sector. It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. It should be maximized within
