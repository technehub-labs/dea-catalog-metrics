id: dea:metric-analytics-request-cycle-time
name: Analytics Request Cycle Time
type: Metric
description: Within Data Science & Analytics Operations, Analytics Request Cycle Time (ARCT-D) is used
  to gauge how efficiently resources are converted into outputs. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Days from Analytics Request
  to Delivered Insight, expressed in days. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
