id: dea:metric-time-to-first-key-action
name: Time to First Key Action
type: Metric
description: A Product Management indicator, Time to First Key Action (TTKA) quantifies how efficiently
  resources are converted into outputs. Its calculation is Time from Onboarding to First Key User Action,
  measured in minutes. It is applied across virtually every sector. It provides the day-to-day signal
  that a process is running as designed. Reduction is the goal, and sustained decreases indicate successful
  intervention.
