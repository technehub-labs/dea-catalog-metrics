id: dea:metric-in-app-feedback-response-rate
name: In-App Feedback Response Rate
type: Metric
description: 'In-App Feedback Response Rate (IFRR-S) captures the engagement or satisfaction of the people
  involved for organizations tracking software product operations (deep dive). The formula is Feedback
  Prompts Answered / Prompts Shown - reported in percent (%). It is a standard measure in the Technology
  sector. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: IFRR-S
unit: percent
version: 1.1.0
