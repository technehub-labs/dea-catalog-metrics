id: dea:metric-curtailment-rate
name: Curtailment Rate
type: Metric
description: A Energy Transition & Renewables indicator, Curtailment Rate (CR-E) quantifies the utilization
  or availability of capacity. It is computed as Generation Curtailed / Generation Available, expressed
  in percent (%). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Lower values are better; each reduction is an improvement. Its use is concentrated in Renewable
  energy.
abbreviation: CR-E
unit: percent
