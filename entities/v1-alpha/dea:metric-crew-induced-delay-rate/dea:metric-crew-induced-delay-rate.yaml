id: dea:metric-crew-induced-delay-rate
name: Crew-Induced Delay Rate
type: Metric
description: Crew-Induced Delay Rate (CIDR-AT) addresses exposure to adverse outcomes and is a fixture
  of airline & transportation standard measures (deep dive) reporting. It provides the day-to-day signal
  that a process is running as designed. Its calculation is Delays Attributed to Crew Availability / Departure
  Delays, measured in percent (%). It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Airlines & Aviation practice.
abbreviation: CIDR-AT
unit: percent
