id: dea:metric-process-capability-index-cp
name: Process Capability Index (Cp)
type: Metric
description: Process Capability Index (Cp) (CPSIX) measures the quality of outputs and outcomes in the
  Process Capability & Six Sigma (Deep Dive) domain. Its calculation is (Upper Spec - Lower Spec) / (6
  x Within-Group Std Dev), measured in ratio (x:1 or x). It provides the day-to-day signal that a process
  is running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Manufacturing practice.
abbreviation: CPSIX
unit: ratio
