id: dea:metric-model-recall-sensitivity
name: Model Recall (Sensitivity)
type: Metric
description: Within Statistical Model Performance Diagnostics, Model Recall (Sensitivity) (MREC) is used
  to gauge the quality of outputs and outcomes. It is computed as True Positives / (True Positives + False
  Negatives), expressed in percent (%). Its use is concentrated in Software. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: MREC
unit: percent
version: 1.1.0
