id: dea:metric-master-data-completeness-index
name: Master Data Completeness Index
type: Metric
description: 'A Master Data Management indicator, Master Data Completeness Index (MDCI) quantifies the
  quality of outputs and outcomes. It is computed as Composite Completeness of Golden Records, expressed
  in index (0-100 or normalized). It is applied across virtually every sector. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
