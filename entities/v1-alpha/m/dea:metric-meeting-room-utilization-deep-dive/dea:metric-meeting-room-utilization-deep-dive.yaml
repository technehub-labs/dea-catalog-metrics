id: dea:metric-meeting-room-utilization-deep-dive
name: Meeting Room Utilization (Deep Dive)
type: Metric
description: 'Meeting Room Utilization (Deep Dive) (MRU-D) addresses the utilization or availability of
  capacity and is a fixture of facility management & workplace (deep dive) reporting. The formula is Booked
  Room Hours / Available Room Hours - reported in percent (%). It is applied across virtually every sector.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. Values outside
  the intended band, on either side, warrant investigation.'
abbreviation: MRU-D
unit: percent
