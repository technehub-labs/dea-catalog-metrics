id: dea:metric-mean-time-to-restore-model-service
name: Mean Time to Restore Model Service
type: Metric
description: 'Within MLOps & Model Lifecycle Operations, Mean Time to Restore Model Service (MTRS-M) is
  used to gauge how efficiently resources are converted into outputs. The formula is Hours from Model
  Failure to Restored Service - reported in hours. It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
