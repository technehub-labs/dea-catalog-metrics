id: dea:metric-mold-changeover-time-plastics
name: Mold Changeover Time (Plastics)
type: Metric
description: 'A Packaging & Plastics indicator, Mold Changeover Time (Plastics) (MCT-P) quantifies how
  efficiently resources are converted into outputs. The formula is Minutes from Last Good Part to Next
  Good Part - reported in minutes. It is a standard measure in the Manufacturing sector. It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
