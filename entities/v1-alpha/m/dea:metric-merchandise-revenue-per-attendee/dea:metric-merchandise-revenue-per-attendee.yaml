id: dea:metric-merchandise-revenue-per-attendee
name: Merchandise Revenue per Attendee
type: Metric
description: Merchandise Revenue per Attendee (MRPA) measures the economic value created or preserved
  in the Sports & Events domain. It is computed as Merchandise Revenue / Attendance, expressed in currency
  per unit. Its use is concentrated in Sports & events. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It should be maximized within the limits of cost and
  quality trade-offs.
abbreviation: MRPA
unit: currency
