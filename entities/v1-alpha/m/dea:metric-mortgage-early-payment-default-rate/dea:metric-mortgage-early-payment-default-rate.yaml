id: dea:metric-mortgage-early-payment-default-rate
name: Mortgage Early Payment Default Rate
type: Metric
description: 'Within Retail Banking & Lending, Mortgage Early Payment Default Rate (EPD) is used to gauge
  exposure to adverse outcomes. It is computed as Defaults within First Year / Loans Disbursed, expressed
  in percent (%). Its use is concentrated in Banking. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
abbreviation: EPD
unit: percent
