id: dea:metric-market-data-uptime-for-trading-systems
name: Market Data Uptime for Trading Systems
type: Metric
description: Market Data Uptime for Trading Systems (MDUT-T) measures the utilization or availability
  of capacity in the Investment Research & Trading Operations domain. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Feed Available Time / Required
  Time; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Financial Services, it is a recognized element of the standard performance toolkit.
abbreviation: MDUT-T
unit: percent
version: 1.1.0
