id: dea:metric-model-drift-alert-response-time
name: Model Drift Alert Response Time
type: Metric
description: A AI Governance & Model Risk Management indicator, Model Drift Alert Response Time (MDART)
  quantifies how efficiently resources are converted into outputs. It is computed as Hours from Drift
  Alert to Acknowledged Action, expressed in hours. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: MDART
