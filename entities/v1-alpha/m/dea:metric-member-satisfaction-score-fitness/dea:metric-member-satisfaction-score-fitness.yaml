id: dea:metric-member-satisfaction-score-fitness
name: Member Satisfaction Score (Fitness)
type: Metric
description: A Fitness & Wellness indicator, Member Satisfaction Score (Fitness) (MSS-F) quantifies the
  engagement or satisfaction of the people involved. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Satisfied Member Survey Responses / Responses, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. It originates from
  and is most used in Fitness & wellness practice.
abbreviation: MSS-F
unit: percent
