id: dea:metric-medication-administration-accuracy-care
name: Medication Administration Accuracy (Care)
type: Metric
description: 'Within Elder & Social Care, Medication Administration Accuracy (Care) (MAAC) is used to
  gauge the quality of outputs and outcomes. It is computed as Correct Administrations Observed / Administrations
  Observed, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is concentrated in Social care.'
abbreviation: MAAC
unit: percent
