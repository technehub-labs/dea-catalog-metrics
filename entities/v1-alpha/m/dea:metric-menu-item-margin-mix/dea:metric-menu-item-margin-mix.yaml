id: dea:metric-menu-item-margin-mix
name: Menu Item Margin Mix
type: Metric
description: Menu Item Margin Mix (MIM) addresses the economic value created or preserved and is a fixture
  of restaurants reporting. It is computed as Contribution Margin of Items Sold / Total Menu Margin Potential,
  expressed in percent (%). Its use is concentrated in Restaurants. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It should be maximized within the limits of
  cost and quality trade-offs.
abbreviation: MIM
unit: percent
