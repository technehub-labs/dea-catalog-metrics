id: dea:metric-medication-reconciliation-completion-rate
name: Medication Reconciliation Completion Rate
type: Metric
description: 'Medication Reconciliation Completion Rate (MRCHR) captures exposure to adverse outcomes
  for organizations tracking healthcare quality & patient safety standard measures. It is a working-level
  control: thresholds trigger immediate operational response. It is defined as Admissions with Reconciliation
  Completed / Admissions; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. In Healthcare, it is a recognized element of the standard performance toolkit.'
abbreviation: MRCHR
unit: percent
version: 1.1.0
lifecycle_status: candidate
