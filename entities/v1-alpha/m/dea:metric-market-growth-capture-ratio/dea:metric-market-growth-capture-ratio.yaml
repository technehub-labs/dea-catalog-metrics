id: dea:metric-market-growth-capture-ratio
name: Market Growth Capture Ratio
type: Metric
description: Market Growth Capture Ratio (MGCR) measures growth over time in the Market Structure & Economics
  Standard Measures domain. It is defined as Entity Growth Rate / Market Growth Rate; the result is stated
  in ratio (x:1 or x). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Higher values are better; gains are read as improvement and losses as deterioration. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: MGCR
