id: dea:metric-mean-time-to-detect-model-failure
name: Mean Time to Detect Model Failure
type: Metric
description: 'Mean Time to Detect Model Failure (MTTD-M) measures the quality of outputs and outcomes
  in the MLOps & Model Lifecycle Operations domain. The formula is Hours from Model Failure to Detection
  - reported in hours. It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Lower values are better; each reduction is an improvement. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.'
