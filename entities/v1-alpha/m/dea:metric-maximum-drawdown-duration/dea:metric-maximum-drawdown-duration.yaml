id: dea:metric-maximum-drawdown-duration
name: Maximum Drawdown Duration
type: Metric
description: 'A Investment Performance Measurement indicator, Maximum Drawdown Duration (MDDD) quantifies
  exposure to adverse outcomes. It is computed as Days from Peak to Recovery of Prior High, expressed
  in days. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. Lower values are better; each reduction is an improvement. Its use is concentrated in Investment
  management.'
