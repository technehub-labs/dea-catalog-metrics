id: dea:metric-misanswer-rate-chatbot
name: Misanswer Rate (Chatbot)
type: Metric
description: Misanswer Rate (Chatbot) (MAR-CB) measures exposure to adverse outcomes in the Conversational
  AI & Chatbots domain. It provides the day-to-day signal that a process is running as designed. Its calculation
  is Incorrect Answers on Sampled QA / Sampled Answers, measured in percent (%). It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.
abbreviation: MAR-CB
unit: percent
version: 1.1.0
lifecycle_status: candidate
