id: dea:metric-mutation-testing-kill-score
name: Mutation Testing Kill Score
type: Metric
description: Mutation Testing Kill Score (MTKS) captures the quality of outputs and outcomes for organizations
  tracking software testing & quality engineering. The formula is Mutants Killed by Test Suite / Mutants
  Introduced - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: MTKS
unit: percent
