id: dea:metric-margin-call-response-time
name: Margin Call Response Time
type: Metric
description: 'Margin Call Response Time (MCRT) measures exposure to adverse outcomes in the Investment
  Risk & Middle Office Operations domain. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Time from Call to Funded Response; the result is stated in hours.
  It should be driven down, since lower readings signal healthier performance. In Investment management,
  it is a recognized element of the standard performance toolkit.'
abbreviation: MCRT
unit: hour
