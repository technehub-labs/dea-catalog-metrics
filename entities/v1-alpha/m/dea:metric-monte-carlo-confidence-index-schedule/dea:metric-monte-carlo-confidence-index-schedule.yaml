id: dea:metric-monte-carlo-confidence-index-schedule
name: Monte Carlo Confidence Index (Schedule)
type: Metric
description: Monte Carlo Confidence Index (Schedule) (MCCIS) captures exposure to adverse outcomes for
  organizations tracking project risk & issue management. It is computed as Probability of Achieving Committed
  Date per Simulation, expressed in percent (%). It is applied across virtually every sector. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: MCCIS
unit: percent
version: 1.1.0
