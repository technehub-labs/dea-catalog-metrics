id: dea:metric-model-approval-gate-compliance
name: Model Approval Gate Compliance
type: Metric
description: 'A AI Governance & Model Risk Management indicator, Model Approval Gate Compliance (MAGC)
  quantifies conformance to standards, plans, or obligations. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. It is computed as Models Passing All
  Governance Gates before Deployment / Deployed, expressed in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
