id: dea:metric-mean-time-to-detect
name: Mean Time to Detect
type: Metric
description: Mean Time to Detect (MTTD) addresses exposure to adverse outcomes and is a fixture of cybersecurity
  reporting. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It is defined as Total Detection Time / Security Incidents; the result is stated in hours. It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
abbreviation: MTTD
unit: hour
version: 1.1.0
lifecycle_status: candidate
