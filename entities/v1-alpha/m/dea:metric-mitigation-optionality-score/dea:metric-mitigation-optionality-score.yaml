id: dea:metric-mitigation-optionality-score
name: Mitigation Optionality Score
type: Metric
description: Mitigation Optionality Score (MOS-ER) measures exposure to adverse outcomes in the Emerging
  Risk & Horizon Scanning domain. The formula is Rubric of Prepared Mitigation Options per Emerging Risk
  - reported in score (points). It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
