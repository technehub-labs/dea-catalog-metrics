id: dea:metric-master-data-sync-latency
name: Master Data Sync Latency
type: Metric
description: Master Data Sync Latency (MDSL) captures the quality of outputs and outcomes for organizations
  tracking master data management. It provides the day-to-day signal that a process is running as designed.
  Its calculation is Propagation Delay from Master Update to Subscribing Systems, measured in minutes.
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: MDSL
unit: minute
