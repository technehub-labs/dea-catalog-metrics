id: dea:metric-management-override-review-completion
name: Management Override Review Completion
type: Metric
description: Within Internal Controls & Financial Reporting Integrity, Management Override Review Completion
  (MORC) is used to gauge conformance to standards, plans, or obligations. Its calculation is Required
  Override Reviews Performed / Required Reviews, measured in percent (%). Its value drives prioritization
  and resource reallocation among competing initiatives. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: MORC
unit: percent
