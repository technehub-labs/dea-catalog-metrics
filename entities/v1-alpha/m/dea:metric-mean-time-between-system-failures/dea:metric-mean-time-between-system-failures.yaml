id: dea:metric-mean-time-between-system-failures
name: Mean Time Between System Failures
type: Metric
description: A Software Engineering indicator, Mean Time Between System Failures (MTBSF) quantifies exposure
  to adverse outcomes. It is computed as Total Uptime / Number of System Failures, expressed in hours.
  It is applied across virtually every sector. Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: MTBSF
unit: hour
