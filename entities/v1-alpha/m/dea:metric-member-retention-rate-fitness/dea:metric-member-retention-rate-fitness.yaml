id: dea:metric-member-retention-rate-fitness
name: Member Retention Rate (Fitness)
type: Metric
description: A Fitness & Wellness indicator, Member Retention Rate (Fitness) (MRR-F) quantifies the retention
  of customers, users, or assets over time. Its calculation is Members Retained at Year End / Members
  at Start, measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. It originates from and is most used in Fitness & wellness practice.
abbreviation: MRR-F
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
