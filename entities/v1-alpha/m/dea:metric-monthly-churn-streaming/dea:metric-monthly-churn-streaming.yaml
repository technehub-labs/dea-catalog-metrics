id: dea:metric-monthly-churn-streaming
name: Monthly Churn (Streaming)
type: Metric
description: A Media & Entertainment indicator, Monthly Churn (Streaming) (MCH) quantifies exposure to
  adverse outcomes. It is defined as Cancelled Subscriptions / Subscribers at Start of Month; the result
  is stated in percent (%). In Media & entertainment, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: MCH
unit: percent
version: 1.1.0
