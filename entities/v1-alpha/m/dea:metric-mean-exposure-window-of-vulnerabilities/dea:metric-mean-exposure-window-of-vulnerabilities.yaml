id: dea:metric-mean-exposure-window-of-vulnerabilities
name: Mean Exposure Window of Vulnerabilities
type: Metric
description: 'Mean Exposure Window of Vulnerabilities (MEV) addresses exposure to adverse outcomes and
  is a fixture of cybersecurity reporting. The formula is Mean Days Critical Vulnerabilities Remain Unpatched
  - reported in days. It is applied across virtually every sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
