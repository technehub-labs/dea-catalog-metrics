name: Merchandise Revenue per Attendee (Deep Dive)
type: Metric
description: 'Within Sports Clubs & Leagues (Deep Dive), Merchandise Revenue per Attendee (Deep Dive)
  (MRPA-D) is used to gauge the economic value created or preserved. The formula is Merchandise Revenue
  / Attendance - reported in currency per unit. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. It is a standard measure in the Sports sector.'
