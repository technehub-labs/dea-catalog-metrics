id: dea:metric-model-serving-latency-95th-percentile
name: Model Serving Latency - 95th Percentile
type: Metric
description: Model Serving Latency - 95th Percentile (MSL95) addresses the quality of outputs and outcomes
  and is a fixture of mlops & model lifecycle operations reporting. Its calculation is 95th Percentile
  Prediction Latency, measured in milliseconds (ms). It provides the day-to-day signal that a process
  is running as designed. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
