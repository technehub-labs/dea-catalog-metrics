id: dea:metric-member-visits-per-month-deep-dive
name: Member Visits per Month (Deep Dive)
type: Metric
description: Member Visits per Month (Deep Dive) (MVM-D) captures the engagement or satisfaction of the
  people involved for organizations tracking fitness & wellness (deep dive). It is defined as Total Check-ins
  / Active Members; the result is stated in times per period. In Health & Fitness, it is a recognized
  element of the standard performance toolkit. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: MVM-D
unit: times
