id: dea:metric-measurement-system-bias
name: Measurement System Bias
type: Metric
description: Measurement System Bias (MSB-SS) addresses the quality of outputs and outcomes and is a fixture
  of process capability & six sigma (deep dive) reporting. It is computed as Average Measurement Deviation
  from Reference Standard, expressed in percent (%). Its use is concentrated in Manufacturing. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: MSB-SS
unit: percent
version: 1.1.0
