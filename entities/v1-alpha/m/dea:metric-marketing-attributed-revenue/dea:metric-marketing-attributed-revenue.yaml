id: dea:metric-marketing-attributed-revenue
name: Marketing Attributed Revenue
type: Metric
description: 'Within Marketing, Marketing Attributed Revenue (MAR) is used to gauge the economic value
  created or preserved. It is computed as Revenue from Marketing-Touched Conversions, expressed in currency
  value. It is applied across virtually every sector. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It should be maximized within the limits of cost
  and quality trade-offs.'
