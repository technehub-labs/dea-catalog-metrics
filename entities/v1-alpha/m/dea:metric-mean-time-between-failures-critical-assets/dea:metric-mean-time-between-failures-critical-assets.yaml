id: dea:metric-mean-time-between-failures-critical-assets
name: Mean Time Between Failures (Critical Assets)
type: Metric
description: 'Mean Time Between Failures (Critical Assets) (MTBFCA) addresses the quality of outputs and
  outcomes and is a fixture of field service & asset performance reporting. It is computed as Operating
  Hours / Failures for Critical Assets, expressed in hours. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: MTBFCA
