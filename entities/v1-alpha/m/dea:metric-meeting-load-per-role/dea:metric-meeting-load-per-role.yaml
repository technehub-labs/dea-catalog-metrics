id: dea:metric-meeting-load-per-role
name: Meeting Load per Role
type: Metric
description: Meeting Load per Role (MLPR) measures how efficiently resources are converted into outputs
  in the Operating Model & Process Health Deep Dive domain. It is computed as Meeting Hours per Role per
  Week, expressed in hours. It is applied across virtually every sector. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
