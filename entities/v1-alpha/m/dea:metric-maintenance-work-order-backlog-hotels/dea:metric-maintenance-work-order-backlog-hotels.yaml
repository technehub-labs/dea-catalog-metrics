id: dea:metric-maintenance-work-order-backlog-hotels
name: Maintenance Work Order Backlog (Hotels)
type: Metric
description: Maintenance Work Order Backlog (Hotels) (MWOB) captures exposure to adverse outcomes for
  organizations tracking hotel & resort operations (deep dive). Its calculation is Open Work Orders /
  Rooms, measured in ratio (x:1 or x). It originates from and is most used in Hospitality practice. It
  provides the day-to-day signal that a process is running as designed. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: MWOB
unit: ratio
version: 1.1.0
