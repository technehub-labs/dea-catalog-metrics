id: dea:metric-master-data-quality-score-deep-dive
name: Master Data Quality Score (Deep Dive)
type: Metric
description: 'Within ERP & Enterprise Application Operations, Master Data Quality Score (Deep Dive) (MDQ-D)
  is used to gauge the quality of outputs and outcomes. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Composite Master Data Quality
  Score, expressed in index (0-100 or normalized). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
