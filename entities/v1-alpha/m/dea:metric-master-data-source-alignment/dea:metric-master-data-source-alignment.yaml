id: dea:metric-master-data-source-alignment
name: Master Data Source Alignment
type: Metric
description: 'Master Data Source Alignment (MDSA) addresses conformance to standards, plans, or obligations
  and is a fixture of enterprise architecture reporting. It is computed as Domains with Single Authoritative
  Source / Data Domains, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: MDSA
unit: percent
