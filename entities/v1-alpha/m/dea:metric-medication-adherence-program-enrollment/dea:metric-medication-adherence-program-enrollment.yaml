id: dea:metric-medication-adherence-program-enrollment
name: Medication Adherence Program Enrollment
type: Metric
description: Within Pharmacy Retail, Medication Adherence Program Enrollment (MAPE) is used to gauge growth
  over time. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It is defined as Enrolled Patients / Eligible Patients; the result is stated in percent (%).
  Improvement means raising this figure toward best-in-class levels. In Healthcare, it is a recognized
  element of the standard performance toolkit.
abbreviation: MAPE
unit: percent
version: 1.1.0
