id: dea:metric-meeting-effectiveness-index
name: Meeting Effectiveness Index
type: Metric
description: 'Meeting Effectiveness Index (MEI-GOV) measures how efficiently resources are converted into
  outputs in the Enterprise Decision Effectiveness & Governance Monitoring domain. The formula is Composite
  Meeting Value Survey Score - reported in index (0-100 or normalized). It is applied across virtually
  every sector. It guides mid-horizon planning: portfolio, program, and function owners act on it between
  review cycles. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: MEI-GOV
unit: index
