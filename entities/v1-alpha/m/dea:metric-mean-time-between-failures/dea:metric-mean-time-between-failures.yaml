id: dea:metric-mean-time-between-failures
name: Mean Time Between Failures
type: Metric
description: A Operations indicator, Mean Time Between Failures (MTBF) quantifies exposure to adverse
  outcomes. Its calculation is Total Operating Time / Number of Failures, measured in hours. It is applied
  across virtually every sector. It provides the day-to-day signal that a process is running as designed.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: MTBF
unit: hour
version: 1.1.0
