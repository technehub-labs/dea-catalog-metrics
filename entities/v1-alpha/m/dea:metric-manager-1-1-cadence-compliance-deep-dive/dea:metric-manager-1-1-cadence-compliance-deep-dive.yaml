id: dea:metric-manager-1-1-cadence-compliance-deep-dive
name: Manager 1:1 Cadence Compliance (Deep Dive)
type: Metric
description: Within Employee Engagement & Culture (Deep Dive), Manager 1:1 Cadence Compliance (Deep Dive)
  (MO1CC) is used to gauge the engagement or satisfaction of the people involved. It is computed as Reports
  Requiring Regular 1:1s Receiving Them / Reports, expressed in percent (%). Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
