id: dea:metric-media-sentiment-score
name: Media Sentiment Score
type: Metric
description: A Corporate Communications & PR indicator, Media Sentiment Score (MSS-C) quantifies the engagement
  or satisfaction of the people involved. Its calculation is Weighted Average of Positive and Negative
  Tone across Coverage, measured in score (points). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
