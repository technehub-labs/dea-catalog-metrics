id: dea:metric-medevac-or-illness-disembarkation-rate
name: Medevac or Illness Disembarkation Rate
type: Metric
description: Within Cruise & Passenger Shipping, Medevac or Illness Disembarkation Rate (MIDR) is used
  to gauge exposure to adverse outcomes. Its calculation is Medical Disembarkations / Passengers, measured
  in events per thousand or million (scaled). It provides the day-to-day signal that a process is running
  as designed. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Hospitality practice.
