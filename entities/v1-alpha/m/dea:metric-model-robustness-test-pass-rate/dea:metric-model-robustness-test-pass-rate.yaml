id: dea:metric-model-robustness-test-pass-rate
name: Model Robustness Test Pass Rate
type: Metric
description: 'Model Robustness Test Pass Rate (MRTPR) captures exposure to adverse outcomes for organizations
  tracking ai ethics, fairness & responsible ai. It is computed as Adversarial and Edge Case Tests Passed
  / Tests, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: MRTPR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- governance
purpose_classification:
- risk
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
