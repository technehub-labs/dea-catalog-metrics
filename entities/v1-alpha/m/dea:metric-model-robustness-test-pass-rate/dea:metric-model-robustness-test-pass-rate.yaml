calculation_definition: Adversarial and Edge Case Tests Passed / Tests
formula_definition:
  formula_id: dea:formula-model-robustness-test-pass-rate
  expression: MRTPR = Adversarial and Edge Case Tests Passed / Tests
  inputs:
