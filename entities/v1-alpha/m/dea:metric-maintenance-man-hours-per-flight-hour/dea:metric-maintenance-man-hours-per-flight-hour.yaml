id: dea:metric-maintenance-man-hours-per-flight-hour
name: Maintenance Man-Hours per Flight Hour
type: Metric
description: Maintenance Man-Hours per Flight Hour (MMHF) addresses how efficiently resources are converted
  into outputs and is a fixture of defense & aerospace reporting. It is defined as Maintenance Hours /
  Flight Hours; the result is stated in ratio (x:1 or x). In Defense & aerospace, it is a recognized element
  of the standard performance toolkit. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. Reduction is the goal, and sustained decreases indicate successful
  intervention.
abbreviation: MMHF
