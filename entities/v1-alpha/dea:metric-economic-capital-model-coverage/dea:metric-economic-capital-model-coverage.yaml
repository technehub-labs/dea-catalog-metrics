id: dea:metric-economic-capital-model-coverage
name: Economic Capital Model Coverage
type: Metric
description: 'Economic Capital Model Coverage (ECMC) captures capability maturity or development for organizations
  tracking actuarial & reserving. It is computed as Risks Covered by Capital Model / Total Risks, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Insurance.'
