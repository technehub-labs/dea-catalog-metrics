id: dea:metric-defect-density
name: Defect Density
type: Metric
description: Defect Density (DD) measures the quality of outputs and outcomes in the Software Engineering
  domain. Its calculation is Defects per 1,000 Lines of Code or Function Point, measured in ratio (x:1
  or x). Its value drives prioritization and resource reallocation among competing initiatives. Lower
  values are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
