id: dea:metric-monthly-viewing-hours-per-subscriber
name: Monthly Viewing Hours per Subscriber
type: Metric
description: 'Monthly Viewing Hours per Subscriber (MVHS) captures the engagement or satisfaction of the
  people involved for organizations tracking broadcasting & streaming media. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Hours Streamed
  / Subscribers, expressed in hours. Improvement means raising this figure toward best-in-class levels.
  Its use is concentrated in Media & Entertainment.'
