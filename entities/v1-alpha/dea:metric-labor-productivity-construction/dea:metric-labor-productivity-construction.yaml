id: dea:metric-labor-productivity-construction
name: Labor Productivity (Construction)
type: Metric
description: Labor Productivity (Construction) (LPC) measures how efficiently resources are converted
  into outputs in the Construction & Engineering domain. It is computed as Installed Quantity / Labor
  Hours, expressed in ratio (x:1 or x). Its use is concentrated in Construction & engineering. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It should
  be maximized within the limits of cost and quality trade-offs.
