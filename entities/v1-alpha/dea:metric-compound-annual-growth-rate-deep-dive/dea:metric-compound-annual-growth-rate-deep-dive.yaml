id: dea:metric-compound-annual-growth-rate-deep-dive
name: Compound Annual Growth Rate (Deep Dive)
type: Metric
description: 'Compound Annual Growth Rate (Deep Dive) (CAGRDD) captures growth over time for organizations
  tracking market structure & economics standard measures. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as (Ending Value / Beginning
  Value)^(1/Years) - 1, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: CAGRDD
