id: dea:metric-spend-concentration-by-vendor
name: Spend Concentration by Vendor
type: Metric
description: Spend Concentration by Vendor (SCV) measures exposure to adverse outcomes in the Outsourcing
  & Vendor Management domain. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Largest Vendor Spend / Total Outsourced Spend; the result is stated
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: SCV
unit: percent
version: 1.1.0
