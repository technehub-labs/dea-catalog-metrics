id: dea:metric-author-advance-earnout-rate
name: Author Advance Earnout Rate
type: Metric
description: Author Advance Earnout Rate (AAER-P) addresses the economic value created or preserved and
  is a fixture of publishing & news media reporting. Its calculation is Titles Earning out Advances /
  Titles with Advances, measured in percent (%). It originates from and is most used in Media & Entertainment
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: AAER-P
