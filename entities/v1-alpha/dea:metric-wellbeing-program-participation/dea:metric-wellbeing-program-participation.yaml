id: dea:metric-wellbeing-program-participation
name: Wellbeing Program Participation
type: Metric
description: Within Employee Wellbeing, Wellbeing Program Participation (WPP) is used to gauge the engagement
  or satisfaction of the people involved. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Employees Participating in Wellbeing Programs / Eligible
  Employees, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: WPP
unit: percent
