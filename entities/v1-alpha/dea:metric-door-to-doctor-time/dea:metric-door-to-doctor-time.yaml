id: dea:metric-door-to-doctor-time
name: Door-to-Doctor Time
type: Metric
description: 'Door-to-Doctor Time (D2D) measures how efficiently resources are converted into outputs
  in the Healthcare domain. The formula is Minutes from ED Arrival to Clinician Assessment - reported
  in minutes. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Lower values are better; each reduction is an improvement. It is a standard measure in the Healthcare
  sector.'
