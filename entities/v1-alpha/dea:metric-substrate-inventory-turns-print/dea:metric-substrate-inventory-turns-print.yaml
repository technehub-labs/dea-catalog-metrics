id: dea:metric-substrate-inventory-turns-print
name: Substrate Inventory Turns (Print)
type: Metric
description: 'A Printing & Publishing indicator, Substrate Inventory Turns (Print) (SIT) quantifies how
  efficiently resources are converted into outputs. The formula is Substrate Consumed / Average Substrate
  Inventory - reported in times per period. It is a standard measure in the Printing & publishing sector.
  It guides mid-horizon planning: portfolio, program, and function owners act on it between review cycles.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: SIT
unit: times
