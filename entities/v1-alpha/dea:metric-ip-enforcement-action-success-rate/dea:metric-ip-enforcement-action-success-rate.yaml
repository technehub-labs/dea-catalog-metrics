id: dea:metric-ip-enforcement-action-success-rate
name: IP Enforcement Action Success Rate
type: Metric
description: 'IP Enforcement Action Success Rate (IEASR) addresses exposure to adverse outcomes and is
  a fixture of intellectual property & licensing reporting. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as Enforcement Actions with
  Favorable Outcome / Actions, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
