name: Medical Staffing Compliance Rate (Deep Dive)
type: Metric
description: Within Sports Clubs & Leagues (Deep Dive), Medical Staffing Compliance Rate (Deep Dive) (MSCR-D)
  is used to gauge conformance to standards, plans, or obligations. The formula is Events with Full Medical
  Coverage / Events - reported in percent (%). It is a standard measure in the Sports sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
