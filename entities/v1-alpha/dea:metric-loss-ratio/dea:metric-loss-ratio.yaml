id: dea:metric-loss-ratio
name: Loss Ratio
type: Metric
description: 'Loss Ratio (LR) measures exposure to adverse outcomes in the Insurance domain. It is computed
  as Incurred Losses / Earned Premiums, expressed in percent (%). Its use is concentrated in Insurance.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
