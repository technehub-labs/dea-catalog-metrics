id: dea:metric-energy-consumption
name: Energy Consumption
type: Metric
description: Within Sustainability & ESG, Energy Consumption (EC) is used to gauge environmental and social
  sustainability performance. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Total Energy Consumed per Period - reported in megawatt-hours (MWh). It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
