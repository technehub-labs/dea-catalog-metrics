id: dea:metric-merchant-churn-rate
name: Merchant Churn Rate
type: Metric
description: Merchant Churn Rate (MCR) addresses exposure to adverse outcomes and is a fixture of payments
  & fintech reporting. It is defined as Merchants Lost / Merchants at Start of Period; the result is stated
  in percent (%). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Lower values are better; each reduction is an improvement. In Payments & fintech, it is a recognized
  element of the standard performance toolkit.
abbreviation: MCR
unit: percent
