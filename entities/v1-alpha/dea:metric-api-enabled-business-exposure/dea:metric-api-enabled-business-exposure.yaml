id: dea:metric-api-enabled-business-exposure
name: API-Enabled Business Exposure
type: Metric
description: API-Enabled Business Exposure (AEBE) addresses capability maturity or development and is
  a fixture of digital transformation reporting. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Services Exposed via APIs / Addressable
  Services, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
