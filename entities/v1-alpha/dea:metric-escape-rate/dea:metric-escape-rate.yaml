id: dea:metric-escape-rate
name: Escape Rate
type: Metric
description: 'Within Quality Management, Escape Rate (ER) is used to gauge the quality of outputs and
  outcomes. The formula is Defects Found Downstream / Defects Present at Stage - reported in percent (%).
  It is applied across virtually every sector. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Reduction is the goal, and sustained decreases indicate successful
  intervention.'
abbreviation: ER
unit: percent
