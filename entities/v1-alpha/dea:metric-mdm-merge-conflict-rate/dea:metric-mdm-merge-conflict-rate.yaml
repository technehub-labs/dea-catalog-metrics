id: dea:metric-mdm-merge-conflict-rate
name: MDM Merge Conflict Rate
type: Metric
description: 'MDM Merge Conflict Rate (MDCR-MD) captures the quality of outputs and outcomes for organizations
  tracking master data management. It is defined as Manual Merge Interventions / Merge Attempts; the result
  is stated in percent (%). It is applied across virtually every sector. It is a working-level control:
  thresholds trigger immediate operational response. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
abbreviation: MDCR-MD
unit: percent
