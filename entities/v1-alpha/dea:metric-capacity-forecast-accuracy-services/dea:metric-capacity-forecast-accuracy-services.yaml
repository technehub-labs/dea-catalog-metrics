id: dea:metric-capacity-forecast-accuracy-services
name: Capacity Forecast Accuracy - Services
type: Metric
description: Capacity Forecast Accuracy - Services (CFAS) addresses the quality of outputs and outcomes
  and is a fixture of observability & site reliability engineering reporting. Its calculation is 1 - Absolute
  Forecast Error / Actual, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
