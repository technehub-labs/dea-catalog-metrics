id: dea:metric-maximum-drawdown
name: Maximum Drawdown
type: Metric
description: 'Maximum Drawdown (MDD) measures exposure to adverse outcomes in the Investment Management
  domain. It is computed as (Peak Value - Trough Value) / Peak Value, expressed in percent (%). Its use
  is concentrated in Asset management. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: MDD
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
- risk
scope_classification:
- capability
directionality: lower_is_better
management_significance:
