id: dea:metric-randomization-speed-trials
name: Randomization Speed (Trials)
type: Metric
description: 'A Pharma R&D & Clinical Trials indicator, Randomization Speed (Trials) (RST) quantifies
  how efficiently resources are converted into outputs. It is a working-level control: thresholds trigger
  immediate operational response. It is defined as Hours from Eligibility Confirmation to Randomization;
  the result is stated in hours. It should be driven down, since lower readings signal healthier performance.
  In Pharmaceuticals, it is a recognized element of the standard performance toolkit.'
