id: dea:metric-first-year-retention-rate-cohort
name: First-Year Retention Rate (Cohort)
type: Metric
description: First-Year Retention Rate (Cohort) (FYRR-ED) captures the retention of customers, users,
  or assets over time for organizations tracking education & training outcome standard measures. It is
  defined as Students Enrolled Year 2 / Entering Cohort; the result is stated in percent (%). Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Higher values are
  better; gains are read as improvement and losses as deterioration. In Education, it is a recognized
  element of the standard performance toolkit.
