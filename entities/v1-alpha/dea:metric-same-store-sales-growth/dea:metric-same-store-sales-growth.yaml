id: dea:metric-same-store-sales-growth
name: Same-Store Sales Growth
type: Metric
description: Same-Store Sales Growth (SSSG) measures growth over time in the Franchise & Multi-site domain.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Its calculation is (Comparable Store Sales_current - Sales_prior) / Sales_prior, measured in
  percent (%). Improvement means raising this figure toward best-in-class levels. It originates from and
  is most used in Franchise & multi-site practice.
abbreviation: SSSG
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- business_architecture
purpose_classification:
- growth
scope_classification:
- organizational_unit
directionality: higher_is_better
