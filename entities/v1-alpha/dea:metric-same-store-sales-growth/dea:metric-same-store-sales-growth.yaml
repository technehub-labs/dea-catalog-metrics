source_credit: Public domain - no attribution required
calculation_definition: (Comparable Store Sales_current - Sales_prior) / Sales_prior
formula_definition:
  formula_id: dea:formula-same-store-sales-growth
  expression: SSSG = (Comparable Store Sales_current - Sales_prior) / Sales_prior
  inputs:
  - name: Comparable Store Sales_current
  - name: Sales_prior
