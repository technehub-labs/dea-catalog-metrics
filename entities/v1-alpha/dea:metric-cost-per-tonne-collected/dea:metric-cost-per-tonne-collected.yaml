id: dea:metric-cost-per-tonne-collected
name: Cost per Tonne Collected
type: Metric
description: Cost per Tonne Collected (CPTC) captures how efficiently resources are converted into outputs
  for organizations tracking waste & environmental services. Its calculation is Total Service Cost / Tonnes
  Collected, measured in currency per unit. It originates from and is most used in Environmental services
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: CPTC
