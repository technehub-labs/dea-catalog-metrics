id: dea:metric-continuity-training-participation
name: Continuity Training Participation
type: Metric
description: 'Within Business Resilience & Continuity, Continuity Training Participation (CTP-B) is used
  to gauge conformance to standards, plans, or obligations. The formula is Staff Completing Continuity
  Roles Training / Assigned Staff - reported in percent (%). It is applied across virtually every sector.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should
  be maximized within the limits of cost and quality trade-offs.'
