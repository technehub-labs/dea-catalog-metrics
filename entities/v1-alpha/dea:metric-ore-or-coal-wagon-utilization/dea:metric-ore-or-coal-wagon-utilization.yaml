id: dea:metric-ore-or-coal-wagon-utilization
name: Ore or Coal Wagon Utilization
type: Metric
description: Within Rail Freight (Deep Dive), Ore or Coal Wagon Utilization (OWU) is used to gauge the
  utilization or availability of capacity. It is defined as Loaded Wagon Days / Total Wagon Days; the
  result is stated in percent (%). It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. Higher values are better; gains are read as improvement and losses
  as deterioration. In Rail, it is a recognized element of the standard performance toolkit.
abbreviation: OWU
