id: dea:metric-global-process-standardization-rate
name: Global Process Standardization Rate
type: Metric
description: Global Process Standardization Rate (GPSR) captures capability maturity or development for
  organizations tracking shared services & global business services. The formula is Entities Using Standard
  Process / Total Entities Served - reported in percent (%). It is applied across virtually every sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
