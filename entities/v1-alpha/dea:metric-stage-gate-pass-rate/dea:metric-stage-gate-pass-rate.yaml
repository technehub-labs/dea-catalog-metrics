id: dea:metric-stage-gate-pass-rate
name: Stage-Gate Pass Rate
type: Metric
description: A R&D and Innovation indicator, Stage-Gate Pass Rate (SGPR) quantifies the quality of outputs
  and outcomes. Its calculation is Concepts Passing Gate / Concepts Reviewed, measured in percent (%).
  It is applied across virtually every sector. Its value drives prioritization and resource reallocation
  among competing initiatives. It should be maximized within the limits of cost and quality trade-offs.
