id: dea:metric-redundant-path-availability
name: Redundant Path Availability
type: Metric
description: A Network Performance & Capacity indicator, Redundant Path Availability (RPA-NW) quantifies
  exposure to adverse outcomes. The formula is Sites with Diverse Redundant Paths / Sites - reported in
  percent (%). It is applied across virtually every sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It should be maximized within the limits of
  cost and quality trade-offs.
