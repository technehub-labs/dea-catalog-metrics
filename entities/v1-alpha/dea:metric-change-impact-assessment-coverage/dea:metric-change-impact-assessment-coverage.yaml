id: dea:metric-change-impact-assessment-coverage
name: Change Impact Assessment Coverage
type: Metric
description: Change Impact Assessment Coverage (CIAC) measures conformance to standards, plans, or obligations
  in the Change Management domain. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Changes with Documented Impact Assessment / Changes
  Approved; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
