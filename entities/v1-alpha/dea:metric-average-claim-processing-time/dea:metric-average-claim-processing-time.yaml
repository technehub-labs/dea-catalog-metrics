id: dea:metric-average-claim-processing-time
name: Average Claim Processing Time
type: Metric
description: 'A Insurance indicator, Average Claim Processing Time (ACPT) quantifies how efficiently resources
  are converted into outputs. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. The formula is Total Claims Processing Days / Claims Settled - reported in days. It
  should be driven down, since lower readings signal healthier performance. It is a standard measure in
  the Insurance sector.'
