id: dea:metric-workarea-recovery-capacity-ratio
name: Workarea Recovery Capacity Ratio
type: Metric
description: 'Within Business Continuity & Disaster Recovery, Workarea Recovery Capacity Ratio (WRCR-BC)
  is used to gauge the utilization or availability of capacity. It is computed as Recovery Workstations
  Available / Required for Critical Teams, expressed in ratio (x:1 or x). It is applied across virtually
  every sector. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Values outside the intended band, on either side, warrant investigation.'
