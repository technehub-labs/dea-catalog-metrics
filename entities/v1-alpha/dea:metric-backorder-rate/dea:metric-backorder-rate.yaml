id: dea:metric-backorder-rate
name: Backorder Rate
type: Metric
description: A Operations indicator, Backorder Rate (BOR) quantifies exposure to adverse outcomes. Its
  calculation is Backordered Lines / Total Order Lines, measured in percent (%). It is applied across
  virtually every sector. Its value drives prioritization and resource reallocation among competing initiatives.
  Reduction is the goal, and sustained decreases indicate successful intervention.
