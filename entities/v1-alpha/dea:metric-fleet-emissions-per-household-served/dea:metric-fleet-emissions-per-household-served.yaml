id: dea:metric-fleet-emissions-per-household-served
name: Fleet Emissions per Household Served
type: Metric
description: 'Fleet Emissions per Household Served (FEHS) measures environmental and social sustainability
  performance in the Waste & Environmental Services domain. The formula is Fleet CO2e / Households Served
  - reported in ratio (x:1 or x). It is a standard measure in the Environmental services sector. It guides
  mid-horizon planning: portfolio, program, and function owners act on it between review cycles. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
