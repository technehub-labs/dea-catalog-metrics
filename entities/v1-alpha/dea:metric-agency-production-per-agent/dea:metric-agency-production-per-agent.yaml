id: dea:metric-agency-production-per-agent
name: Agency Production per Agent
type: Metric
description: Agency Production per Agent (APA-I) captures how efficiently resources are converted into
  outputs for organizations tracking insurance distribution & agency management. It is computed as Written
  Premium / Active Agents, expressed in currency value. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is concentrated in Insurance.
