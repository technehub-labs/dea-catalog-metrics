id: dea:metric-recognition-program-reach
name: Recognition Program Reach
type: Metric
description: Recognition Program Reach (RPR-EE) captures the engagement or satisfaction of the people
  involved for organizations tracking employee engagement & culture (deep dive). It is reviewed at cadence
  by planning owners to correct course before issues become strategic. It is computed as Employees Recognized
  in Period / Employees, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
