id: dea:metric-creative-fatigue-onset-rate
name: Creative Fatigue Onset Rate
type: Metric
description: 'Within Marketing & Advertising Standard Measures (Deep Dive), Creative Fatigue Onset Rate
  (CFOR) is used to gauge the quality of outputs and outcomes. The formula is Creatives Depreciating below
  Threshold before Refresh / Creatives - reported in percent (%). It is applied across virtually every
  sector. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
