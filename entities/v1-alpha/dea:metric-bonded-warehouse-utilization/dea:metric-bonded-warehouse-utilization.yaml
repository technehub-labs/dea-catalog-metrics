id: dea:metric-bonded-warehouse-utilization
name: Bonded Warehouse Utilization
type: Metric
description: 'Bonded Warehouse Utilization (BWU) addresses the utilization or availability of capacity
  and is a fixture of international trade & customs reporting. The formula is Bonded Storage Used / Capacity
  - reported in percent (%). It is a standard measure in the Logistics & Trade sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. Values outside the
  intended band, on either side, warrant investigation.'
