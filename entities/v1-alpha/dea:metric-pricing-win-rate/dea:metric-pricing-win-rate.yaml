id: dea:metric-pricing-win-rate
name: Pricing Win Rate
type: Metric
description: Pricing Win Rate (PWR-P) captures the economic value created or preserved for organizations
  tracking pricing & revenue management. It is computed as Deals Won at Target Price / Deals Won, expressed
  in percent (%). It is applied across virtually every sector. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It should be maximized within the limits of cost and
  quality trade-offs.
