id: dea:metric-well-completion-cycle-time
name: Well Completion Cycle Time
type: Metric
description: Well Completion Cycle Time (WCCT) measures how efficiently resources are converted into outputs
  in the Oil & Gas domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is Days from Spud to Production Start, measured in days. It
  should be driven down, since lower readings signal healthier performance. It originates from and is
  most used in Oil & gas practice.
abbreviation: WCCT
unit: day
