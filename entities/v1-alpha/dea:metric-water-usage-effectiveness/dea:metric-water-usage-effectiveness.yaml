id: dea:metric-water-usage-effectiveness
name: Water Usage Effectiveness
type: Metric
description: 'Water Usage Effectiveness (WUE-DC) addresses environmental and social sustainability performance
  and is a fixture of data centers & cloud infrastructure reporting. It is computed as Water Used / IT
  Energy, expressed in ratio (x:1 or x). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Technology.'
