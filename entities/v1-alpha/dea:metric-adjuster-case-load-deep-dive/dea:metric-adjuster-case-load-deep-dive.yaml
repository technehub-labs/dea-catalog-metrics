id: dea:metric-adjuster-case-load-deep-dive
name: Adjuster Case Load (Deep Dive)
type: Metric
description: 'Within Insurance Claims Deep Dive, Adjuster Case Load (Deep Dive) (ACL-D) is used to gauge
  the utilization or availability of capacity. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Open Claims per Adjuster - reported in count (items
  per period). The objective is neither maximization nor minimization but staying within an agreed operating
  band. It is a standard measure in the Insurance sector.'
