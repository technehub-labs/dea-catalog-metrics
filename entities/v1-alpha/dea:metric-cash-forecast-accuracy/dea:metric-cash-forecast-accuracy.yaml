id: dea:metric-cash-forecast-accuracy
name: Cash Forecast Accuracy
type: Metric
description: Cash Forecast Accuracy (CFA) measures the quality of outputs and outcomes in the Treasury
  & Cash Management domain. Its calculation is 1 - ABS(Actual Cash - Forecast Cash) / Actual Cash, measured
  in percent (%). Its value drives prioritization and resource reallocation among competing initiatives.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CFA
unit: percent
