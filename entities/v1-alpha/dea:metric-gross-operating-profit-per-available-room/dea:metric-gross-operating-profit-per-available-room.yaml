id: dea:metric-gross-operating-profit-per-available-room
name: Gross Operating Profit per Available Room
type: Metric
description: 'Gross Operating Profit per Available Room (GOPPAR) captures the economic value created or
  preserved for organizations tracking hospitality & food service. It is computed as Gross Operating Profit
  / Rooms Available, expressed in currency value. Its use is concentrated in Hospitality. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
abbreviation: GOPPAR
unit: currency
