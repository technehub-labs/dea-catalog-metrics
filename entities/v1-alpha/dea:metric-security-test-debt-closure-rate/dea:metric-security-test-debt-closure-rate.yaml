id: dea:metric-security-test-debt-closure-rate
name: Security Test Debt Closure Rate
type: Metric
description: Within DevSecOps & Application Security Engineering, Security Test Debt Closure Rate (STDCR)
  is used to gauge conformance to standards, plans, or obligations. It is defined as Security Findings
  Remediated per SLA / Findings; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
