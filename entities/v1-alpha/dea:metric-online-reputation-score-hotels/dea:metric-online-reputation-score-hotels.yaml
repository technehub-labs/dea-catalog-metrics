id: dea:metric-online-reputation-score-hotels
name: Online Reputation Score (Hotels)
type: Metric
description: 'Online Reputation Score (Hotels) (ORS-H) captures the engagement or satisfaction of the
  people involved for organizations tracking hotel & resort operations (deep dive). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Weighted
  Average of Review Platform Scores, expressed in score (points). Improvement means raising this figure
  toward best-in-class levels. Its use is concentrated in Hospitality.'
