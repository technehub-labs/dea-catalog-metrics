id: dea:metric-free-cash-flow
name: Free Cash Flow
type: Metric
description: Free Cash Flow (FCF) captures the economic value created or preserved for organizations tracking
  finance & accounting. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Operating Cash Flow - Capital Expenditure - reported in currency value. Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
