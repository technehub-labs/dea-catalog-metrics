id: dea:metric-cost-per-hire
name: Cost per Hire
type: Metric
description: Cost per Hire (CPH) measures how efficiently resources are converted into outputs in the
  Human Resources domain. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Total Recruiting Cost / Hires, expressed in currency per unit. It
  should be driven down, since lower readings signal healthier performance. Practitioners in nearly any
  industry can adopt it directly.
abbreviation: CPH
unit: currency
version: 1.0.1
lifecycle_status: candidate
