id: dea:metric-patient-medication-review-completion
name: Patient Medication Review Completion
type: Metric
description: Patient Medication Review Completion (PMRC) addresses the quality of outputs and outcomes
  and is a fixture of pharmacy retail reporting. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as Completed Medication Reviews / Due, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Healthcare.
