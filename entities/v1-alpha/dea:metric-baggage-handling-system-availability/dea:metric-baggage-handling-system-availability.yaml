id: dea:metric-baggage-handling-system-availability
name: Baggage Handling System Availability
type: Metric
description: Baggage Handling System Availability (BHSA) addresses the quality of outputs and outcomes
  and is a fixture of airport operations reporting. It provides the day-to-day signal that a process is
  running as designed. Its calculation is System Uptime / Scheduled Operating Time, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. It originates from and is most
  used in Airports practice.
abbreviation: BHSA
unit: percent
