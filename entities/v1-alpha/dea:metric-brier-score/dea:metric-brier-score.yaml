id: dea:metric-brier-score
name: Brier Score
type: Metric
description: 'A Statistical Model Performance Diagnostics indicator, Brier Score (BRIER) quantifies the
  quality of outputs and outcomes. It is a working-level control: thresholds trigger immediate operational
  response. It is defined as Mean Squared Error of Probabilistic Predictions; the result is stated in
  score (points). It should be driven down, since lower readings signal healthier performance. In Software,
  it is a recognized element of the standard performance toolkit.'
