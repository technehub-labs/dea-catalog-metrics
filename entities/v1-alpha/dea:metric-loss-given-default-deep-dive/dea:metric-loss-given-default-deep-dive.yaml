id: dea:metric-loss-given-default-deep-dive
name: Loss Given Default (Deep Dive)
type: Metric
description: 'Loss Given Default (Deep Dive) (LGDDD) addresses exposure to adverse outcomes and is a fixture
  of credit & collections risk (enterprise) reporting. It is computed as Expected Loss after Recovery
  / Exposure at Default, expressed in percent (%). It is applied across virtually every sector. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
abbreviation: LGDDD
unit: percent
version: 1.1.0
lifecycle_status: candidate
