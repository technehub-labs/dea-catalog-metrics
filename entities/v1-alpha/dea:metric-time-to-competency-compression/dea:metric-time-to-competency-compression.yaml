id: dea:metric-time-to-competency-compression
name: Time-to-Competency Compression
type: Metric
description: Time-to-Competency Compression (TTCC) measures how efficiently resources are converted into
  outputs in the Learning & Development Effectiveness (Deep Dive) domain. Its calculation is Reduction
  in Ramp Days vs Baseline / Baseline, measured in percent (%). It is applied across virtually every sector.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: TTCC
unit: percent
