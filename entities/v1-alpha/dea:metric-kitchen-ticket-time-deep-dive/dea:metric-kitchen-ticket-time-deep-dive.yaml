id: dea:metric-kitchen-ticket-time-deep-dive
name: Kitchen Ticket Time (Deep Dive)
type: Metric
description: Kitchen Ticket Time (Deep Dive) (KTT-D) captures how efficiently resources are converted
  into outputs for organizations tracking restaurant operations (deep dive). Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It is computed as Minutes from
  Order Fire to Plate, expressed in minutes. It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Restaurants.
