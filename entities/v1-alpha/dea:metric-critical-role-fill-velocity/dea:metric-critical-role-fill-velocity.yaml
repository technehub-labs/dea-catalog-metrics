id: dea:metric-critical-role-fill-velocity
name: Critical Role Fill Velocity
type: Metric
description: Critical Role Fill Velocity (CRFV) addresses how efficiently resources are converted into
  outputs and is a fixture of workforce planning & analytics reporting. Its calculation is Days to Fill
  Critical Role from Approval, measured in days. It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Reduction
  is the goal, and sustained decreases indicate successful intervention.
