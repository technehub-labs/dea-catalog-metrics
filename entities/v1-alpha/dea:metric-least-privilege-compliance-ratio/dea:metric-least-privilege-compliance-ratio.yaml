id: dea:metric-least-privilege-compliance-ratio
name: Least Privilege Compliance Ratio
type: Metric
description: Least Privilege Compliance Ratio (LPCR-IAM) captures exposure to adverse outcomes for organizations
  tracking identity & access management operations. It is defined as Accounts with Only Required Entitlements
  / Sampled; the result is stated in percent (%). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: LPCR-IAM
