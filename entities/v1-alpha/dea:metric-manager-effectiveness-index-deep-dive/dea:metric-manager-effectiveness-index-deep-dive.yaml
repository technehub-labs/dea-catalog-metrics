id: dea:metric-manager-effectiveness-index-deep-dive
name: Manager Effectiveness Index (Deep Dive)
type: Metric
description: 'Manager Effectiveness Index (Deep Dive) (MEIDD) addresses the quality of outputs and outcomes
  and is a fixture of employee engagement & culture (deep dive) reporting. It is computed as Upward Feedback
  Composite for People Managers, expressed in index (0-100 or normalized). It is applied across virtually
  every sector. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It should be maximized within the limits of cost and quality trade-offs.'
