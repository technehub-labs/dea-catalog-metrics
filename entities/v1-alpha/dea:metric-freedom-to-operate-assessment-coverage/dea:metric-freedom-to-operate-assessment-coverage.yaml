id: dea:metric-freedom-to-operate-assessment-coverage
name: Freedom-to-Operate Assessment Coverage
type: Metric
description: Freedom-to-Operate Assessment Coverage (FTOC) captures exposure to adverse outcomes for organizations
  tracking intellectual property & licensing. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Product Launches with FTO Clearance / Launches
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
