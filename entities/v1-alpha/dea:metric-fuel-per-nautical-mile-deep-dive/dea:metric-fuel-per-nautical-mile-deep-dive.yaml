id: dea:metric-fuel-per-nautical-mile-deep-dive
name: Fuel per Nautical Mile (Deep Dive)
type: Metric
description: 'Fuel per Nautical Mile (Deep Dive) (FPM-D) addresses how efficiently resources are converted
  into outputs and is a fixture of cruise & passenger shipping reporting. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Fuel Consumed
  / Nautical Miles Sailed, expressed in ratio (x:1 or x). It should be driven down, since lower readings
  signal healthier performance. Its use is concentrated in Hospitality.'
abbreviation: FPM-D
unit: ratio
