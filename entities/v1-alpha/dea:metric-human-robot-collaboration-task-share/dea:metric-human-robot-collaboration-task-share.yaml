id: dea:metric-human-robot-collaboration-task-share
name: Human-Robot Collaboration Task Share
type: Metric
description: Human-Robot Collaboration Task Share (HRTS) measures capability maturity or development in
  the Industrial Automation & Robotics domain. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Tasks Performed Collaboratively / Automatable Tasks,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. It originates
  from and is most used in Manufacturing practice.
abbreviation: HRTS
unit: percent
