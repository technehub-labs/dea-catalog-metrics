id: dea:metric-space-utilization-rate-deep-dive
name: Space Utilization Rate (Deep Dive)
type: Metric
description: Space Utilization Rate (Deep Dive) (SUR-D) addresses the utilization or availability of capacity
  and is a fixture of facility management & workplace (deep dive) reporting. Its calculation is Occupied
  or Booked Space / Total Space, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: SUR-D
unit: percent
