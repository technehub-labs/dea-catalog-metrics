id: dea:metric-mean-time-to-provision-infrastructure
name: Mean Time to Provision (Infrastructure)
type: Metric
description: Mean Time to Provision (Infrastructure) (MTTP-I) measures how efficiently resources are converted
  into outputs in the Data Centers & Cloud Infrastructure domain. It is computed as Days from Request
  to Provisioned Resource, expressed in days. Its use is concentrated in Technology. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. Reduction is the goal,
  and sustained decreases indicate successful intervention.
