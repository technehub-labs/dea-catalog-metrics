id: dea:metric-review-depth-score
name: Review Depth Score
type: Metric
description: Within Code Review & Peer Quality, Review Depth Score (RDS-PR) is used to gauge the quality
  of outputs and outcomes. Its calculation is Composite of Comment Quality, Coverage and Depth Rubric,
  measured in score (points). It provides the day-to-day signal that a process is running as designed.
  Higher values are better; gains are read as improvement and losses as deterioration. It originates from
  and is most used in Software practice.
