id: dea:metric-time-to-find-information
name: Time to Find Information
type: Metric
description: 'Within Knowledge Management, Time to Find Information (TTFI) is used to gauge how efficiently
  resources are converted into outputs. The formula is Average Minutes to Locate Needed Information -
  reported in minutes. It is applied across virtually every sector. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
