id: dea:metric-stage-gate-approval-cycle-time
name: Stage Gate Approval Cycle Time
type: Metric
description: Stage Gate Approval Cycle Time (SGACT) addresses how efficiently resources are converted
  into outputs and is a fixture of project management (deep dive) reporting. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Days to Complete Stage Gate
  Review, measured in days. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
