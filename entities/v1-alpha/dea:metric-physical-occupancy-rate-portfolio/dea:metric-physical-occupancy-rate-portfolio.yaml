id: dea:metric-physical-occupancy-rate-portfolio
name: Physical Occupancy Rate (Portfolio)
type: Metric
description: A Real Estate Portfolio & Property Management indicator, Physical Occupancy Rate (Portfolio)
  (POR-P) quantifies the utilization or availability of capacity. Its calculation is Occupied Units or
  Area / Total Units or Area, measured in percent (%). It originates from and is most used in Real Estate
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: POR-P
unit: percent
