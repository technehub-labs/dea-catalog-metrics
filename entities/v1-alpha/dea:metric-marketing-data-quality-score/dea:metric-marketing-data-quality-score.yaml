id: dea:metric-marketing-data-quality-score
name: Marketing Data Quality Score
type: Metric
description: A Marketing Attribution & Analytics indicator, Marketing Data Quality Score (MDQS) quantifies
  the quality of outputs and outcomes. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Weighted Index of Tracking Completeness and Consistency, measured
  in index (0-100 or normalized). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
