id: dea:metric-contractor-incident-rate
name: Contractor Incident Rate
type: Metric
description: 'Contractor Incident Rate (CIR) captures exposure to adverse outcomes for organizations tracking
  health & safety. The formula is (Contractor Recordable Incidents x 200,000) / Contractor Hours - reported
  in ratio (x:1 or x). It is applied across virtually every sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
