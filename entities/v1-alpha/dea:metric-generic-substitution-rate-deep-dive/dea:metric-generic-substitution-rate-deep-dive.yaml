id: dea:metric-generic-substitution-rate-deep-dive
name: Generic Substitution Rate (Deep Dive)
type: Metric
description: Within Pharmacy Retail, Generic Substitution Rate (Deep Dive) (GSR-D) is used to gauge the
  economic value created or preserved. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Generic Fills / Fillable Prescriptions - reported
  in percent (%). Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Healthcare sector.
abbreviation: GSR-D
unit: percent
