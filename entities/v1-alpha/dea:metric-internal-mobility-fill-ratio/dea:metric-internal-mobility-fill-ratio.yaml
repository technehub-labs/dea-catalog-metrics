id: dea:metric-internal-mobility-fill-ratio
name: Internal Mobility Fill Ratio
type: Metric
description: Internal Mobility Fill Ratio (IMFR) addresses the retention of customers, users, or assets
  over time and is a fixture of talent acquisition deep dive reporting. It is defined as Roles Filled
  Internally / Roles Filled; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: IMFR
unit: percent
