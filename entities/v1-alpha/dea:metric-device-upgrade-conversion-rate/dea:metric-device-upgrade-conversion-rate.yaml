id: dea:metric-device-upgrade-conversion-rate
name: Device Upgrade Conversion Rate
type: Metric
description: Device Upgrade Conversion Rate (DUCR) captures growth over time for organizations tracking
  telecom customer experience & billing. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Upgrades Completed / Upgrade-Eligible Customers;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  In Telecommunications, it is a recognized element of the standard performance toolkit.
abbreviation: DUCR
unit: percent
