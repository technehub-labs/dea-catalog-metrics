id: dea:metric-gig-task-completion-time
name: Gig Task Completion Time
type: Metric
description: Gig Task Completion Time (GTCT) captures how efficiently resources are converted into outputs
  for organizations tracking gig & contingent workforce. Its calculation is Time from Acceptance to Task
  Completion, measured in hours. It is applied across virtually every sector. It provides the day-to-day
  signal that a process is running as designed. Reduction is the goal, and sustained decreases indicate
  successful intervention.
