id: dea:metric-data-consistency-rate
name: Data Consistency Rate
type: Metric
description: Data Consistency Rate (DCONR) addresses the quality of outputs and outcomes and is a fixture
  of data quality management reporting. It is computed as Values Consistent across Systems / Cross-System
  Pairs Sampled, expressed in percent (%). Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DCONR
unit: percent
