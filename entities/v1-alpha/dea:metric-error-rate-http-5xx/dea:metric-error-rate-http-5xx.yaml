id: dea:metric-error-rate-http-5xx
name: Error Rate (HTTP 5xx)
type: Metric
description: 'Error Rate (HTTP 5xx) (ERR5) measures the quality of outputs and outcomes in the Digital
  Product & Web Operations domain. It is a working-level control: thresholds trigger immediate operational
  response. It is defined as Server Error Responses / Total Responses; the result is stated in percent
  (%). It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
