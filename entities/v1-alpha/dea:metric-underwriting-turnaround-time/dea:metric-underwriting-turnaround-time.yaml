id: dea:metric-underwriting-turnaround-time
name: Underwriting Turnaround Time
type: Metric
description: 'Underwriting Turnaround Time (UWTAT) captures how efficiently resources are converted into
  outputs for organizations tracking insurance underwriting. The formula is Days from Complete Submission
  to Decision - reported in days. It is a standard measure in the Insurance sector. It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
