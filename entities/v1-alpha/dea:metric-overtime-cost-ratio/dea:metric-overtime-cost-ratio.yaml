id: dea:metric-overtime-cost-ratio
name: Overtime Cost Ratio
type: Metric
description: 'A Standard Workforce & Pay Metrics indicator, Overtime Cost Ratio (OCR-PAY) quantifies how
  efficiently resources are converted into outputs. The formula is Overtime Pay / Total Labor Cost - reported
  in percent (%). It is applied across virtually every sector. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
abbreviation: OCR-PAY
unit: percent
