id: dea:metric-content-production-cycle-time
name: Content Production Cycle Time
type: Metric
description: Content Production Cycle Time (CPCT) captures how efficiently resources are converted into
  outputs for organizations tracking media & entertainment. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Days from Greenlight to Release
  - reported in days. It should be driven down, since lower readings signal healthier performance. It
  is a standard measure in the Media & entertainment sector.
