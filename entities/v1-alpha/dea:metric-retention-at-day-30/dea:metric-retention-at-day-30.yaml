id: dea:metric-retention-at-day-30
name: Retention at Day 30
type: Metric
description: Within Product Management, Retention at Day 30 (R30) is used to gauge the retention of customers,
  users, or assets over time. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Users Active on Day 30 / Users in Cohort; the result is stated
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: R30
unit: percent
