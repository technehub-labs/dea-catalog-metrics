id: dea:metric-service-desk-cost-per-ticket
name: Service Desk Cost per Ticket
type: Metric
description: Service Desk Cost per Ticket (SDCT) addresses how efficiently resources are converted into
  outputs and is a fixture of it service management reporting. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. It is computed as Service Desk Cost /
  Tickets Handled, expressed in currency per unit. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
