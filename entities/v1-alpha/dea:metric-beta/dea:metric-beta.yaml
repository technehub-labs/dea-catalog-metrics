id: dea:metric-beta
name: Beta
type: Metric
description: Beta (BETA) measures exposure to adverse outcomes in the Investment Management domain. It
  is defined as Covariance of Portfolio and Market Returns / Market Variance; the result is stated in
  ratio (x:1 or x). In Asset management, it is a recognized element of the standard performance toolkit.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Values
  outside the intended band, on either side, warrant investigation.
