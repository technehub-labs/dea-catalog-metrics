id: dea:metric-on-time-delivery-rate-courier
name: On-Time Delivery Rate (Courier)
type: Metric
description: A Postal & Courier indicator, On-Time Delivery Rate (Courier) (ODR-C) quantifies the quality
  of outputs and outcomes. The formula is Items Delivered within Service Standard / Items Dispatched -
  reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Postal & courier sector.
