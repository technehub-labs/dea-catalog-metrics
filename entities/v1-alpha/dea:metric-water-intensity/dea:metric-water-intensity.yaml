id: dea:metric-water-intensity
name: Water Intensity
type: Metric
description: Within Sustainability & ESG, Water Intensity (WI2) is used to gauge environmental and social
  sustainability performance. It is computed as Water Withdrawn / Unit of Output, expressed in ratio (x:1
  or x). It is applied across virtually every sector. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. Reduction is the goal, and sustained decreases indicate
  successful intervention.
