id: dea:metric-missort-rate-deep-dive
name: Missort Rate (Deep Dive)
type: Metric
description: 'A Parcel & Last-Mile Logistics (Deep Dive) indicator, Missort Rate (Deep Dive) (MSR-D) quantifies
  the quality of outputs and outcomes. It is defined as Misrouted Parcels / Parcels Sorted; the result
  is stated in events per thousand or million (scaled). It is a working-level control: thresholds trigger
  immediate operational response. Lower values are better; each reduction is an improvement. In Logistics
  & Trade, it is a recognized element of the standard performance toolkit.'
