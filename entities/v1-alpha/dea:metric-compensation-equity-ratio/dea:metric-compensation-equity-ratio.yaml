id: dea:metric-compensation-equity-ratio
name: Compensation Equity Ratio
type: Metric
description: Compensation Equity Ratio (CER-PAY) measures conformance to standards, plans, or obligations
  in the Standard Workforce & Pay Metrics domain. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as Top Quartile Pay / Bottom Quartile Pay within
  Grade, expressed in ratio (x:1 or x). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: CER-PAY
