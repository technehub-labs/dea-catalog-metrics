id: dea:metric-value-leakage-from-missed-renewals
name: Value Leakage from Missed Renewals
type: Metric
description: Value Leakage from Missed Renewals (VLMR) measures the economic value created or preserved
  in the Contract Lifecycle Management domain. Its calculation is Spend on Unwanted Auto-Renewals in Period,
  measured in currency value. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Lower values are better; each reduction is an improvement. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
