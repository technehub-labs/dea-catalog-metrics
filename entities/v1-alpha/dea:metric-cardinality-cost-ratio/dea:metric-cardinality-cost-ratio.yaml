id: dea:metric-cardinality-cost-ratio
name: Cardinality Cost Ratio
type: Metric
description: Within SRE & Observability Standard Measures, Cardinality Cost Ratio (CARDR) is used to gauge
  how efficiently resources are converted into outputs. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It is computed as Observability Spend / Revenue Streamed
  through Platform, expressed in percent (%). It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Software.
abbreviation: CARDR
unit: percent
