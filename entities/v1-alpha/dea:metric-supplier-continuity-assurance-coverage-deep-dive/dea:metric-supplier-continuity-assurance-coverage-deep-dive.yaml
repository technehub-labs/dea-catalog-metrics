id: dea:metric-supplier-continuity-assurance-coverage-deep-dive
name: Supplier Continuity Assurance Coverage (Deep Dive)
type: Metric
description: Within Business Continuity & Disaster Recovery, Supplier Continuity Assurance Coverage (Deep
  Dive) (SCAC) is used to gauge exposure to adverse outcomes. It is defined as Critical Suppliers with
  Verified Continuity Plans / Critical Suppliers; the result is stated in percent (%). Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
