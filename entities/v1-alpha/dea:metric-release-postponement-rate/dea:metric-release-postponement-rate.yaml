id: dea:metric-release-postponement-rate
name: Release Postponement Rate
type: Metric
description: 'A Release Management & Environments indicator, Release Postponement Rate (RPR-RM) quantifies
  exposure to adverse outcomes. The formula is Releases Deferred after Announcement / Releases - reported
  in percent (%). It guides mid-horizon planning: portfolio, program, and function owners act on it between
  review cycles. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
