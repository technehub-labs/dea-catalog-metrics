calculation_definition: Turbine Available Hours / Total Hours
formula_definition:
  formula_id: dea:formula-wind-turbine-availability
  expression: WTA = Turbine Available Hours / Total Hours
  inputs:
  - name: Turbine Available Hours
  - name: Total Hours
