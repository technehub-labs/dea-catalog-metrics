id: dea:metric-wind-turbine-availability
name: Wind Turbine Availability
type: Metric
description: Wind Turbine Availability (WTA) measures the utilization or availability of capacity in the
  Energy Transition & Renewables domain. It is defined as Turbine Available Hours / Total Hours; the result
  is stated in percent (%). In Renewable energy, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: WTA
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
