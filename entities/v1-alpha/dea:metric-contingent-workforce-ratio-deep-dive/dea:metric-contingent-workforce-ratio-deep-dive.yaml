id: dea:metric-contingent-workforce-ratio-deep-dive
name: Contingent Workforce Ratio (Deep Dive)
type: Metric
description: A Workforce Planning & Productivity indicator, Contingent Workforce Ratio (Deep Dive) (CWR-WF)
  quantifies the utilization or availability of capacity. Its calculation is Contingent Workers / Total
  Workforce, measured in percent (%). It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Values outside
  the intended band, on either side, warrant investigation.
abbreviation: CWR-WF
unit: percent
