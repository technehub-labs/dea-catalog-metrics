id: dea:metric-cost-variance-to-standard
name: Cost Variance to Standard
type: Metric
description: Cost Variance to Standard (CVS) measures conformance to standards, plans, or obligations
  in the Product Costing & Margin Management domain. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as (Actual Cost - Standard Cost) / Standard Cost,
  expressed in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: CVS
unit: percent
version: 1.0.1
lifecycle_status: candidate
