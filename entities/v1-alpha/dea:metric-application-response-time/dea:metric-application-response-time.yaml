id: dea:metric-application-response-time
name: Application Response Time
type: Metric
description: 'Application Response Time (ART2) captures the quality of outputs and outcomes for organizations
  tracking it service management. It is a working-level control: thresholds trigger immediate operational
  response. It is defined as Median End-User Response Time; the result is stated in seconds. It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.'
