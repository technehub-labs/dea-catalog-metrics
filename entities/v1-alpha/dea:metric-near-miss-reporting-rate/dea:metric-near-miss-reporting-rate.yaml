id: dea:metric-near-miss-reporting-rate
name: Near Miss Reporting Rate
type: Metric
description: Within Health & Safety, Near Miss Reporting Rate (NMRR) is used to gauge exposure to adverse
  outcomes. It is computed as Near Misses Reported per 100 Employees, expressed in ratio (x:1 or x). It
  is reviewed at cadence by planning owners to correct course before issues become strategic. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
