id: dea:metric-peak-season-capacity-flex-ratio
name: Peak Season Capacity Flex Ratio
type: Metric
description: 'A Parcel & Last-Mile Logistics (Deep Dive) indicator, Peak Season Capacity Flex Ratio (PSCF)
  quantifies the utilization or availability of capacity. It is computed as Peak Volume Handled / Baseline
  Capacity, expressed in ratio (x:1 or x). Its use is concentrated in Logistics & Trade. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Values outside
  the intended band, on either side, warrant investigation.'
