id: dea:metric-appraisal-contingency-fall-through-rate
name: Appraisal Contingency Fall-Through Rate
type: Metric
description: Appraisal Contingency Fall-Through Rate (ACFR) addresses exposure to adverse outcomes and
  is a fixture of real estate brokerage reporting. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Contracts Falling through on Appraisal / Contracts,
  measured in percent (%). It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Real estate practice.
abbreviation: ACFR
unit: percent
version: 1.1.0
lifecycle_status: candidate
