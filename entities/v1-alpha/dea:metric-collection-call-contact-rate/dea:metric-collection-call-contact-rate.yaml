id: dea:metric-collection-call-contact-rate
name: Collection Call Contact Rate
type: Metric
description: 'Within Accounts Payable & Receivable Operations (Deep Dive), Collection Call Contact Rate
  (CCCR) is used to gauge how efficiently resources are converted into outputs. It is defined as Debtors
  Contacted per Dunning Schedule / Debtors Due; the result is stated in percent (%). It is a working-level
  control: thresholds trigger immediate operational response. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
