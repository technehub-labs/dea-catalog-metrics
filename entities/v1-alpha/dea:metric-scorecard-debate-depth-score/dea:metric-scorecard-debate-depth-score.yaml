id: dea:metric-scorecard-debate-depth-score
name: Scorecard Debate Depth Score
type: Metric
description: Scorecard Debate Depth Score (SDDS) captures the engagement or satisfaction of the people
  involved for organizations tracking balanced scorecard implementation & review. It is defined as Rubric
  Score of Challenge Quality in BSC Reviews; the result is stated in score (points). It is applied across
  virtually every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
