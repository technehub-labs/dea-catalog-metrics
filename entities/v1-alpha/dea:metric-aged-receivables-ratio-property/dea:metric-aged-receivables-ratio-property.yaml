id: dea:metric-aged-receivables-ratio-property
name: Aged Receivables Ratio (Property)
type: Metric
description: Aged Receivables Ratio (Property) (ARR-P) addresses exposure to adverse outcomes and is a
  fixture of real estate portfolio & property management reporting. Its calculation is Rent Over 60 Days
  / Total Rent Receivable, measured in percent (%). It provides the day-to-day signal that a process is
  running as designed. Lower values are better; each reduction is an improvement. It originates from and
  is most used in Real Estate practice.
