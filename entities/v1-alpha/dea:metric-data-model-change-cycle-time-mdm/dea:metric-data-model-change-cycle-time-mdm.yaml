id: dea:metric-data-model-change-cycle-time-mdm
name: Data Model Change Cycle Time (MDM)
type: Metric
description: Data Model Change Cycle Time (MDM) (DMCCT) captures how efficiently resources are converted
  into outputs for organizations tracking master data management. Its calculation is Days from Model Change
  Request to Production, measured in days. Its value drives prioritization and resource reallocation among
  competing initiatives. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: DMCCT
