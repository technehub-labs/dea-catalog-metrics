id: dea:metric-mql-to-sql-conversion
name: MQL to SQL Conversion
type: Metric
description: Within Marketing, MQL to SQL Conversion (MQL2SQL) is used to gauge how effectively a process
  or entity achieves its intended outcome. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Sales Qualified Leads / Marketing Qualified Leads, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
