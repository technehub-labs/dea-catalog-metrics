id: dea:metric-failed-settlement-rate-investments
name: Failed Settlement Rate (Investments)
type: Metric
description: Failed Settlement Rate (Investments) (FSRI) addresses the quality of outputs and outcomes
  and is a fixture of investment risk & middle office operations reporting. Its calculation is Settlements
  Failed on Settlement Date / Settlements, measured in percent (%). It originates from and is most used
  in Investment management practice. It provides the day-to-day signal that a process is running as designed.
  Reduction is the goal, and sustained decreases indicate successful intervention.
