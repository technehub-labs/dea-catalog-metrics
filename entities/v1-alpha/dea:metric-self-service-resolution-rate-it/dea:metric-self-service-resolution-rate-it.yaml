id: dea:metric-self-service-resolution-rate-it
name: Self-Service Resolution Rate - IT
type: Metric
description: 'Self-Service Resolution Rate - IT (SSRR-IT) captures how efficiently resources are converted
  into outputs for organizations tracking it incident & major problem management. It is computed as Resolutions
  via Self-Service / Resolutions, expressed in percent (%). It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: SSRR-IT
unit: percent
