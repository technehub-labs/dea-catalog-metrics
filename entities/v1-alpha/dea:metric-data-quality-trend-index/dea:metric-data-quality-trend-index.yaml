id: dea:metric-data-quality-trend-index
name: Data Quality Trend Index
type: Metric
description: A Data Quality Management indicator, Data Quality Trend Index (DQTI) quantifies the quality
  of outputs and outcomes. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Period-over-Period Composite Quality Score Change; the result is
  stated in index (0-100 or normalized). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
