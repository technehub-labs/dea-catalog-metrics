id: dea:metric-claim-decision-automation-rate
name: Claim Decision Automation Rate
type: Metric
description: Within Insurance Claims Deep Dive, Claim Decision Automation Rate (CDAR) is used to gauge
  how efficiently resources are converted into outputs. Its calculation is Decisions Made by Rules or
  Models / Decisions, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Insurance practice.
