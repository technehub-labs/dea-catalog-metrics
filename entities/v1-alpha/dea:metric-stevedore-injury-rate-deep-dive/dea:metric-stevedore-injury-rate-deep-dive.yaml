id: dea:metric-stevedore-injury-rate-deep-dive
name: Stevedore Injury Rate (Deep Dive)
type: Metric
description: A Maritime Shipping (Deep Dive) indicator, Stevedore Injury Rate (Deep Dive) (SIR-D) quantifies
  exposure to adverse outcomes. The formula is Injuries per 200,000 Hours - reported in events per thousand
  or million (scaled). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. It is a standard measure in the
  Maritime sector.
