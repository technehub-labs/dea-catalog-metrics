id: dea:metric-model-update-cycle-compliance
name: Model Update Cycle Compliance
type: Metric
description: Model Update Cycle Compliance (MUCC-RS) captures the quality of outputs and outcomes for
  organizations tracking investment research & trading operations. Its calculation is Coverage Models
  Refreshed per Schedule / Due, measured in percent (%). It originates from and is most used in Financial
  Services practice. Its value drives prioritization and resource reallocation among competing initiatives.
  It should be maximized within the limits of cost and quality trade-offs.
