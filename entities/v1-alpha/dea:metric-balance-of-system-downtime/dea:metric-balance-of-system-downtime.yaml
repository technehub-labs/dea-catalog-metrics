id: dea:metric-balance-of-system-downtime
name: Balance of System Downtime
type: Metric
description: 'A Energy Transition & Renewables indicator, Balance of System Downtime (BOSD) quantifies
  exposure to adverse outcomes. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. The formula is Grid or Inverter Downtime Hours / Total Hours - reported in percent
  (%). It should be driven down, since lower readings signal healthier performance. It is a standard measure
  in the Renewable energy sector.'
abbreviation: BOSD
unit: percent
version: 1.1.0
