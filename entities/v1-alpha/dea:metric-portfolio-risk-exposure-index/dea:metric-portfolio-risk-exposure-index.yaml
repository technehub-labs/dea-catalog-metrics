id: dea:metric-portfolio-risk-exposure-index
name: Portfolio Risk Exposure Index
type: Metric
description: 'Within PMO & Portfolio Governance, Portfolio Risk Exposure Index (PREI) is used to gauge
  exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Weighted Open Portfolio Risks vs Tolerance, expressed
  in index (0-100 or normalized). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
