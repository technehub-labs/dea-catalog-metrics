name: Slippage versus Arrival Price (Deep Dive)
type: Metric
description: Slippage versus Arrival Price (Deep Dive) (SAP-D) measures the quality of outputs and outcomes
  in the Investment Research & Trading Operations domain. It is computed as Execution Price vs Arrival
  Price Difference, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Lower values are better; each reduction is an improvement. Its
  use is concentrated in Financial Services.
