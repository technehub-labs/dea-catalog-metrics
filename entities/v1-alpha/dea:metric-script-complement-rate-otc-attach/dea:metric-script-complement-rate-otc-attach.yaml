id: dea:metric-script-complement-rate-otc-attach
name: Script Complement Rate - OTC Attach
type: Metric
description: A Pharmacy Retail indicator, Script Complement Rate - OTC Attach (SCR-O) quantifies growth
  over time. It provides the day-to-day signal that a process is running as designed. Its calculation
  is OTC Recommendations Accepted / Offered, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. It originates from and is most used in Healthcare practice.
abbreviation: SCR-O
