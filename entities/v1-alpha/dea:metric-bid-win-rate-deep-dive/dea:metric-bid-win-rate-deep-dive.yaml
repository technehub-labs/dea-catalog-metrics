id: dea:metric-bid-win-rate-deep-dive
name: Bid Win Rate (Deep Dive)
type: Metric
description: Within Market Structure & Economics Standard Measures, Bid Win Rate (Deep Dive) (BWRDD) is
  used to gauge growth over time. It is defined as Deals Won / Deals Bid; the result is stated in percent
  (%). It is applied across virtually every sector. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It should be maximized within the limits of cost and
  quality trade-offs.
abbreviation: BWRDD
unit: percent
version: 1.1.0
