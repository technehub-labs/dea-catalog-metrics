id: dea:metric-employee-net-promoter-score
name: Employee Net Promoter Score
type: Metric
description: A Human Resources indicator, Employee Net Promoter Score (eNPS) quantifies the engagement
  or satisfaction of the people involved. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Its calculation is % Employee Promoters - % Employee
  Detractors, measured in score (points). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: eNPS
unit: score
version: 1.0.0
lifecycle_status: candidate
