measurable_entity_kind: dea:OrganizationalUnit
reputability_tier: industry_standard
unit_ref: dea:unit-score
source_credit: Adapted from Fred Reichheld's NPS methodology
calculation_definition: '% Employee Promoters - % Employee Detractors'
formula_definition:
