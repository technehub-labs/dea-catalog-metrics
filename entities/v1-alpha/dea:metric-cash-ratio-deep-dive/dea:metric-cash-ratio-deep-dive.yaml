id: dea:metric-cash-ratio-deep-dive
name: Cash Ratio (Deep Dive)
type: Metric
description: Cash Ratio (Deep Dive) (CashRD) measures exposure to adverse outcomes in the Financial Statement
  Analysis Ratios (Deep Dive) domain. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Cash and Equivalents / Current Liabilities - reported
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
