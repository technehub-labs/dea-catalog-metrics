id: dea:metric-risk-exposure-trend-index-projects
name: Risk Exposure Trend Index (Projects)
type: Metric
description: Risk Exposure Trend Index (Projects) (RETI) addresses exposure to adverse outcomes and is
  a fixture of project risk & issue management reporting. It is defined as Period-over-Period Change in
  Aggregate Risk Exposure; the result is stated in index (0-100 or normalized). Its trend is watched by
  senior leadership as an early signal of structural performance shifts. Lower values are better; each
  reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: RETI
