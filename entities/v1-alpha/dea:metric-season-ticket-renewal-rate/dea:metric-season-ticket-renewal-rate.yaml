id: dea:metric-season-ticket-renewal-rate
name: Season Ticket Renewal Rate
type: Metric
description: Season Ticket Renewal Rate (STRR) measures the retention of customers, users, or assets over
  time in the Sports & Events domain. The formula is Season Tickets Renewed / Season Tickets Expiring
  - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Sports & events sector.
