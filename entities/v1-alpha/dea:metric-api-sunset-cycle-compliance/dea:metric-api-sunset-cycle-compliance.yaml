id: dea:metric-api-sunset-cycle-compliance
name: API Sunset Cycle Compliance
type: Metric
description: API Sunset Cycle Compliance (APISCC) measures conformance to standards, plans, or obligations
  in the API Lifecycle Management domain. Its calculation is Versions Retired per Published Sunset Plan
  / Planned, measured in percent (%). Its value drives prioritization and resource reallocation among
  competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Software practice.
