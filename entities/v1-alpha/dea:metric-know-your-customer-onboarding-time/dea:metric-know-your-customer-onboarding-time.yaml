id: dea:metric-know-your-customer-onboarding-time
name: Know-Your-Customer Onboarding Time
type: Metric
description: Know-Your-Customer Onboarding Time (KYCT) measures how efficiently resources are converted
  into outputs in the Payments & Fintech domain. It is defined as Days from Application to Approval; the
  result is stated in days. In Payments & fintech, it is a recognized element of the standard performance
  toolkit. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: KYCT
