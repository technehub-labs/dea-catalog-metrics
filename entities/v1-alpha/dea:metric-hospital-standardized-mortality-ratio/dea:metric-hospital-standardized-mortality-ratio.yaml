id: dea:metric-hospital-standardized-mortality-ratio
name: Hospital Standardized Mortality Ratio
type: Metric
description: A Healthcare Quality & Patient Safety Standard Measures indicator, Hospital Standardized
  Mortality Ratio (HSMR) quantifies the quality of outputs and outcomes. Its calculation is Observed Deaths
  / Risk-Adjusted Expected Deaths, measured in ratio (x:1 or x). It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Lower values are better; each
  reduction is an improvement. It originates from and is most used in Healthcare practice.
