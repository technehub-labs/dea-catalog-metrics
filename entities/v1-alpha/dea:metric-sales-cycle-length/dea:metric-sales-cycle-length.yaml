id: dea:metric-sales-cycle-length
name: Sales Cycle Length
type: Metric
description: Sales Cycle Length (SCL) addresses how efficiently resources are converted into outputs and
  is a fixture of sales reporting. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Days from First Contact to Close, Averaged; the result
  is stated in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
