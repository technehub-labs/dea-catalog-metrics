id: dea:metric-review-sla-compliance
name: Review SLA Compliance
type: Metric
description: 'Review SLA Compliance (RSLA-PR) captures conformance to standards, plans, or obligations
  for organizations tracking code review & peer quality. The formula is Reviews Responded to within SLA
  / Review Requests - reported in percent (%). It is a standard measure in the Software sector. It is
  monitored close to the work: teams act on it within a shift, sprint, or daily review. It should be maximized
  within the limits of cost and quality trade-offs.'
