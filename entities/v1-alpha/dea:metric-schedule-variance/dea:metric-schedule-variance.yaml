id: dea:metric-schedule-variance
name: Schedule Variance
type: Metric
description: Schedule Variance (SV) addresses conformance to standards, plans, or obligations and is a
  fixture of project management reporting. It is computed as Earned Value - Planned Value, expressed in
  currency value. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SV
unit: currency
