id: dea:metric-inclusive-meeting-practices-score
name: Inclusive Meeting Practices Score
type: Metric
description: Inclusive Meeting Practices Score (IMPS) measures the engagement or satisfaction of the people
  involved in the Diversity, Equity & Inclusion (Deep Dive) domain. Its calculation is Observed Rubric
  Score of Meeting Inclusivity, measured in score (points). It is applied across virtually every sector.
  It provides the day-to-day signal that a process is running as designed. It should be maximized within
  the limits of cost and quality trade-offs.
