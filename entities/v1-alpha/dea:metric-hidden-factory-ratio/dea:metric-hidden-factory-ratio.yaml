id: dea:metric-hidden-factory-ratio
name: Hidden Factory Ratio
type: Metric
description: Hidden Factory Ratio (HFR-SS) captures how efficiently resources are converted into outputs
  for organizations tracking process capability & six sigma (deep dive). The formula is Capacity Consumed
  by Rework and Repair / Total Capacity - reported in percent (%). It is a standard measure in the Manufacturing
  sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: HFR-SS
unit: percent
