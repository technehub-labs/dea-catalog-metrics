id: dea:metric-dispute-resolution-time
name: Dispute Resolution Time
type: Metric
description: A Payments & Fintech indicator, Dispute Resolution Time (DRT-P) quantifies how efficiently
  resources are converted into outputs. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Days from Dispute Raised to Resolution, measured in days.
  It should be driven down, since lower readings signal healthier performance. It originates from and
  is most used in Payments & fintech practice.
abbreviation: DRT-P
