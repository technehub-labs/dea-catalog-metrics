id: dea:metric-standard-clause-adoption-rate
name: Standard Clause Adoption Rate
type: Metric
description: Standard Clause Adoption Rate (SCAR) measures how efficiently resources are converted into
  outputs in the Legal domain. It is computed as Contracts Using Approved Playbook / Contracts Drafted,
  expressed in percent (%). It is reviewed at cadence by planning owners to correct course before issues
  become strategic. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SCAR
unit: percent
