id: dea:metric-parcels-per-route-per-day
name: Parcels per Route per Day
type: Metric
description: Parcels per Route per Day (PPRD) addresses the utilization or availability of capacity and
  is a fixture of postal & courier reporting. Its calculation is Parcels Delivered / Route Days, measured
  in ratio (x:1 or x). It originates from and is most used in Postal & courier practice. It provides the
  day-to-day signal that a process is running as designed. It should be maximized within the limits of
  cost and quality trade-offs.
abbreviation: PPRD
unit: ratio
