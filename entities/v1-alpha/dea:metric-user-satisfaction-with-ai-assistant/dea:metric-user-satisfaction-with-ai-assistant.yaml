id: dea:metric-user-satisfaction-with-ai-assistant
name: User Satisfaction with AI Assistant
type: Metric
description: User Satisfaction with AI Assistant (USA-AI) addresses the engagement or satisfaction of
  the people involved and is a fixture of generative ai & llm operations reporting. Its calculation is
  Average CSAT for AI-Assisted Interactions, measured in score (points). It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
