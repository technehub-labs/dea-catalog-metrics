id: dea:metric-peak-demand-staffing-compliance
name: Peak Demand Staffing Compliance
type: Metric
description: A Workforce Planning & Productivity indicator, Peak Demand Staffing Compliance (PDSC) quantifies
  the utilization or availability of capacity. Its calculation is Peak Periods Staffed to Model / Peak
  Periods, measured in percent (%). It provides the day-to-day signal that a process is running as designed.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
