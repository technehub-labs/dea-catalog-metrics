id: dea:metric-recipe-yield-variance
name: Recipe Yield Variance
type: Metric
description: Recipe Yield Variance (RYV) addresses how efficiently resources are converted into outputs
  and is a fixture of food & beverage manufacturing reporting. It is computed as Actual Yield - Standard
  Yield / Standard Yield, expressed in percent (%). Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. It is managed toward a defined target band rather than
  an extreme - both overshoot and undershoot can signal problems. Its use is concentrated in Food & Beverage.
abbreviation: RYV
unit: percent
version: 1.1.0
