id: dea:metric-methane-emissions-intensity
name: Methane Emissions Intensity
type: Metric
description: Methane Emissions Intensity (MEI) captures environmental and social sustainability performance
  for organizations tracking oil & gas. The formula is Methane Emitted / Hydrocarbons Produced - reported
  in ratio (x:1 or x). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. It is a standard measure in the
  Oil & gas sector.
