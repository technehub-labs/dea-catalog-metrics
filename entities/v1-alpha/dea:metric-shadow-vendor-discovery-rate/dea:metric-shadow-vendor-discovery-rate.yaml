id: dea:metric-shadow-vendor-discovery-rate
name: Shadow Vendor Discovery Rate
type: Metric
description: Shadow Vendor Discovery Rate (SVDR) measures exposure to adverse outcomes in the Third-Party
  Risk Management domain. It is defined as Unapproved Engagements Found per Review; the result is stated
  in count (items per period). It bridges daily operations and executive reporting, giving managers a
  lever to pull within a quarter. Lower values are better; each reduction is an improvement. Its use is
  not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SVDR
