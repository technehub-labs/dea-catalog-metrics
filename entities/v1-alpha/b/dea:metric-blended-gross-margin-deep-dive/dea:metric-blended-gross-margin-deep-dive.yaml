id: dea:metric-blended-gross-margin-deep-dive
name: Blended Gross Margin (Deep Dive)
type: Metric
description: Blended Gross Margin (Deep Dive) (BGMD) addresses the economic value created or preserved
  and is a fixture of unit economics & growth (deep dive) reporting. The formula is Gross Profit including
  Services / Total Revenue - reported in percent (%). It is a standard measure in the Software sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: BGMD
unit: percent
