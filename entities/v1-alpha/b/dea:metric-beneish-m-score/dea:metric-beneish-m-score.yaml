id: dea:metric-beneish-m-score
name: Beneish M-Score
type: Metric
description: 'A Valuation & Corporate Finance Standard Measures indicator, Beneish M-Score (BENM) quantifies
  exposure to adverse outcomes. It is computed as Composite of Eight Manipulation-Signal Ratios, expressed
  in score (points). It is applied across virtually every sector. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
abbreviation: BENM
unit: score
