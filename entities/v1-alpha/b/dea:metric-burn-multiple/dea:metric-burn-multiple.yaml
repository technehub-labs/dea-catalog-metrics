id: dea:metric-burn-multiple
name: Burn Multiple
type: Metric
description: A Startup & Venture-Backed Business indicator, Burn Multiple (BM-S) quantifies how efficiently
  resources are converted into outputs. Its calculation is Net Burn / Net New ARR, measured in ratio (x:1
  or x). It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: BM-S
unit: ratio
