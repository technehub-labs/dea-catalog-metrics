id: dea:metric-broker-submission-to-quote-ratio
name: Broker Submission-to-Quote Ratio
type: Metric
description: 'Broker Submission-to-Quote Ratio (BSQR) captures how efficiently resources are converted
  into outputs for organizations tracking insurance underwriting. The formula is Quotes Issued / Broker
  Submissions - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Insurance sector.'
abbreviation: BSQR
unit: percent
