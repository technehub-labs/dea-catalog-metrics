id: dea:metric-brand-awareness
name: Brand Awareness
type: Metric
description: Brand Awareness (BRA) addresses growth over time and is a fixture of marketing reporting.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It is
  defined as Respondents Recognizing Brand / Surveyed Population; the result is stated in percent (%).
  Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any industry
  can adopt it directly.
abbreviation: BRA
unit: percent
version: 1.1.0
