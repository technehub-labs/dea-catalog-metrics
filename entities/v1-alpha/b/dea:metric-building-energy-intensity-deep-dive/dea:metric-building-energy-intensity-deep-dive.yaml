id: dea:metric-building-energy-intensity-deep-dive
name: Building Energy Intensity (Deep Dive)
type: Metric
description: Building Energy Intensity (Deep Dive) (BEI-D) captures environmental and social sustainability
  performance for organizations tracking facility management & workplace (deep dive). Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Energy /
  Floor Area; the result is stated in ratio (x:1 or x). It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: BEI-D
unit: ratio
