id: dea:metric-bandwidth-utilization
name: Bandwidth Utilization
type: Metric
description: 'Bandwidth Utilization (BU-T) captures the utilization or availability of capacity for organizations
  tracking telecommunications. The formula is Used Capacity / Provisioned Capacity - reported in percent
  (%). It is monitored close to the work: teams act on it within a shift, sprint, or daily review. It
  is managed toward a defined target band rather than an extreme - both overshoot and undershoot can signal
  problems. It is a standard measure in the Telecommunications sector.'
abbreviation: BU-T
unit: percent
version: 1.1.0
lifecycle_status: candidate
