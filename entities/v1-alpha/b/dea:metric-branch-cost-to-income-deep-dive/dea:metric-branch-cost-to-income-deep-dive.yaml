id: dea:metric-branch-cost-to-income-deep-dive
name: Branch Cost-to-Income (Deep Dive)
type: Metric
description: 'A Retail Banking Branch Network (Deep Dive) indicator, Branch Cost-to-Income (Deep Dive)
  (BCI-D) quantifies how efficiently resources are converted into outputs. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Branch
  Operating Costs / Branch Income, expressed in percent (%). It should be driven down, since lower readings
  signal healthier performance. Its use is concentrated in Banking.'
abbreviation: BCI-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
