id: dea:metric-bot-containment-rate-chatbot
name: Bot Containment Rate (Chatbot)
type: Metric
description: Bot Containment Rate (Chatbot) (BCR-CB) captures how efficiently resources are converted
  into outputs for organizations tracking conversational ai & chatbots. Its calculation is Conversations
  Resolved without Human Agent / Conversations, measured in percent (%). It is applied across virtually
  every sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: BCR-CB
unit: percent
version: 1.1.0
