id: dea:metric-branch-audit-compliance-score-deep-dive
name: Branch Audit Compliance Score (Deep Dive)
type: Metric
description: Branch Audit Compliance Score (Deep Dive) (BACS-D) measures conformance to standards, plans,
  or obligations in the Retail Banking Branch Network (Deep Dive) domain. Its calculation is Composite
  Branch Audit Score, measured in score (points). Its value drives prioritization and resource reallocation
  among competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Banking practice.
