id: dea:metric-bill-shock-complaint-rate
name: Bill Shock Complaint Rate
type: Metric
description: Bill Shock Complaint Rate (BSCR) addresses exposure to adverse outcomes and is a fixture
  of telecom customer experience & billing reporting. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It is defined as Bill Shock Complaints / Customers
  x 1,000; the result is stated in events per thousand or million (scaled). It should be driven down,
  since lower readings signal healthier performance. In Telecommunications, it is a recognized element
  of the standard performance toolkit.
abbreviation: BSCR
unit: event
