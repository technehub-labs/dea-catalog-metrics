id: dea:metric-branch-security-incident-rate
name: Branch Security Incident Rate
type: Metric
description: Branch Security Incident Rate (BSIR) measures exposure to adverse outcomes in the Retail
  Banking Branch Network (Deep Dive) domain. It is defined as Security Incidents per Branch per Period;
  the result is stated in count (items per period). In Banking, it is a recognized element of the standard
  performance toolkit. It bridges daily operations and executive reporting, giving managers a lever to
  pull within a quarter. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: BSIR
unit: count
