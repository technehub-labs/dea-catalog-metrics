id: dea:metric-blue-green-or-canary-adoption-rate
name: Blue-Green or Canary Adoption Rate
type: Metric
description: Blue-Green or Canary Adoption Rate (BGCA) captures capability maturity or development for
  organizations tracking continuous delivery & deployment. Its calculation is Services Using Progressive
  Delivery / Services, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: BGCA
unit: percent
version: 1.1.0
