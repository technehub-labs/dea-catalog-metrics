id: dea:metric-business-case-quality-score
name: Business Case Quality Score
type: Metric
description: Business Case Quality Score (BCQS) captures the quality of outputs and outcomes for organizations
  tracking pmo & portfolio governance. Its calculation is Rubric-Based Completeness and Rigor of Business
  Cases, measured in score (points). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: BCQS
