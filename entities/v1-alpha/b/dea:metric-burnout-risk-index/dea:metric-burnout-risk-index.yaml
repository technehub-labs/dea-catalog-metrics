id: dea:metric-burnout-risk-index
name: Burnout Risk Index
type: Metric
description: 'Burnout Risk Index (BRI-EE) captures exposure to adverse outcomes for organizations tracking
  employee engagement & culture (deep dive). It is computed as Composite of Workload, Recovery and Exhaustion
  Indicators, expressed in index (0-100 or normalized). It is applied across virtually every sector. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: BRI-EE
unit: index
