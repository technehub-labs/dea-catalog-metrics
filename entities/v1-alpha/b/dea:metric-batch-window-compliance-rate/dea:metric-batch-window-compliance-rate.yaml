id: dea:metric-batch-window-compliance-rate
name: Batch Window Compliance Rate
type: Metric
description: 'Batch Window Compliance Rate (BWCR) addresses conformance to standards, plans, or obligations
  and is a fixture of erp & enterprise application operations reporting. It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. The formula is Batches Completed within
  Window / Batches - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
