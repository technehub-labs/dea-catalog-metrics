id: dea:metric-build-cache-hit-rate
name: Build Cache Hit Rate
type: Metric
description: A Continuous Integration indicator, Build Cache Hit Rate (BCHR) quantifies how efficiently
  resources are converted into outputs. Its calculation is Builds Using Cached Artifacts / Builds, measured
  in percent (%). It provides the day-to-day signal that a process is running as designed. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: BCHR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
