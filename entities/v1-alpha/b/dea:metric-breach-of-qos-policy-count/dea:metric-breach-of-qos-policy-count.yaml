id: dea:metric-breach-of-qos-policy-count
name: Breach of QoS Policy Count
type: Metric
description: Breach of QoS Policy Count (BQPC) addresses the quality of outputs and outcomes and is a
  fixture of network performance & capacity reporting. It is computed as QoS Policy Violations in Period,
  expressed in count (items per period). It is applied across virtually every sector. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. Reduction is the goal,
  and sustained decreases indicate successful intervention.
