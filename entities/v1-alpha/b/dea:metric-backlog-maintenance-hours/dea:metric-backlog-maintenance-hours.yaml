id: dea:metric-backlog-maintenance-hours
name: Backlog Maintenance Hours
type: Metric
description: 'Backlog Maintenance Hours (BMH) addresses the utilization or availability of capacity and
  is a fixture of maintenance & reliability reporting. The formula is Outstanding Maintenance Work Hours
  - reported in hours. It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Lower values are better; each reduction is an improvement. It is a standard measure in the Manufacturing
  sector.'
abbreviation: BMH
unit: hour
