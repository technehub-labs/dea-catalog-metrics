id: dea:metric-blast-fragmentation-index
name: Blast Fragmentation Index
type: Metric
description: 'Blast Fragmentation Index (BFI) captures the quality of outputs and outcomes for organizations
  tracking metals & mining operations (deep dive). The formula is Fragment Size Distribution Match to
  Target - reported in index (0-100 or normalized). It is a standard measure in the Metals & Mining sector.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should
  be maximized within the limits of cost and quality trade-offs.'
