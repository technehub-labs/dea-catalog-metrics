id: dea:metric-ballast-water-compliance-rate
name: Ballast Water Compliance Rate
type: Metric
description: 'Ballast Water Compliance Rate (BWCR) addresses conformance to standards, plans, or obligations
  and is a fixture of maritime & shipping reporting. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Ballast Operations Meeting Convention
  Standards / Operations - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Maritime & shipping sector.'
