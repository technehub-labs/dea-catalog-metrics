id: dea:metric-lessons-learned-reuse-rate
name: Lessons Learned Reuse Rate
type: Metric
description: 'Lessons Learned Reuse Rate (LLRR-PM) addresses capability maturity or development and is
  a fixture of project management (deep dive) reporting. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Projects Citing Prior Lessons
  / New Projects, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: LLRR-PM
unit: percent
