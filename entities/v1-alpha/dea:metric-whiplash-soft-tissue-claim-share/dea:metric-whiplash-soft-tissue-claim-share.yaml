id: dea:metric-whiplash-soft-tissue-claim-share
name: Whiplash / Soft Tissue Claim Share
type: Metric
description: 'Whiplash / Soft Tissue Claim Share (WSTS) addresses exposure to adverse outcomes and is
  a fixture of insurance claims deep dive reporting. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Soft Tissue Claims / Bodily Injury
  Claims - reported in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. It is a standard measure in the Insurance sector.'
abbreviation: WSTS
unit: percent
