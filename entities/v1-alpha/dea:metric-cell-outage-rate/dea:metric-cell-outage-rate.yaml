source_credit: Public domain - no attribution required
calculation_definition: Cell Sites Out of Service / Total Cell Sites
formula_definition:
  formula_id: dea:formula-cell-outage-rate
  expression: COR-N = Cell Sites Out of Service / Total Cell Sites
  inputs:
  - name: Cell Sites Out of Service
  - name: Total Cell Sites
