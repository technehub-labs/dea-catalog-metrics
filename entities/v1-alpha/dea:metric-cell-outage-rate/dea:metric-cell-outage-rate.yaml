id: dea:metric-cell-outage-rate
name: Cell Outage Rate
type: Metric
description: A Telecom Network Operations indicator, Cell Outage Rate (COR-N) quantifies exposure to adverse
  outcomes. It provides the day-to-day signal that a process is running as designed. Its calculation is
  Cell Sites Out of Service / Total Cell Sites, measured in percent (%). It should be driven down, since
  lower readings signal healthier performance. It originates from and is most used in Telecommunications
  practice.
abbreviation: COR-N
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- risk
scope_classification:
- capability
directionality: lower_is_better
management_significance:
