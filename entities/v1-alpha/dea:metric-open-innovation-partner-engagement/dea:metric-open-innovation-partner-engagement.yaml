id: dea:metric-open-innovation-partner-engagement
name: Open Innovation Partner Engagement
type: Metric
description: A R&D and Innovation indicator, Open Innovation Partner Engagement (OIP) quantifies capability
  maturity or development. It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. It is defined as Active External Collaboration Projects / Total Innovation
  Projects; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: OIP
unit: percent
version: 1.1.0
lifecycle_status: candidate
