id: dea:metric-collection-effectiveness-index
name: Collection Effectiveness Index
type: Metric
description: Within Professional Services, Collection Effectiveness Index (CEI) is used to gauge how efficiently
  resources are converted into outputs. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Collected Receivables / Receivables Due, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Professional services.
abbreviation: CEI
unit: percent
