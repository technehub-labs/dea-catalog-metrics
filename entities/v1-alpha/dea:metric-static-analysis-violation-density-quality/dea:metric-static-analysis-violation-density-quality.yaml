id: dea:metric-static-analysis-violation-density-quality
name: Static Analysis Violation Density (Quality)
type: Metric
description: A Code Quality & Static Analysis indicator, Static Analysis Violation Density (Quality) (SAVD)
  quantifies the quality of outputs and outcomes. Its calculation is Violations per 1,000 Lines of Code,
  measured in events per thousand or million (scaled). It provides the day-to-day signal that a process
  is running as designed. Lower values are better; each reduction is an improvement. It originates from
  and is most used in Software practice.
