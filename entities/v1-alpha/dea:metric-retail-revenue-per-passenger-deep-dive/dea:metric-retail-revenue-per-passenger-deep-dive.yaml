id: dea:metric-retail-revenue-per-passenger-deep-dive
name: Retail Revenue per Passenger (Deep Dive)
type: Metric
description: A Airport Operations (Deep Dive) indicator, Retail Revenue per Passenger (Deep Dive) (RRPP-D)
  quantifies the economic value created or preserved. The formula is Concession Revenue / Passengers -
  reported in currency per unit. It is a standard measure in the Aviation sector. It carries weight in
  boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
