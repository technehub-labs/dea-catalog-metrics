id: dea:metric-generation-availability-factor
name: Generation Availability Factor
type: Metric
description: A Energy & Utilities indicator, Generation Availability Factor (GAF) quantifies the utilization
  or availability of capacity. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Available Generation Hours / Calendar Hours; the result is stated
  in percent (%). Improvement means raising this figure toward best-in-class levels. In Energy & utilities,
  it is a recognized element of the standard performance toolkit.
abbreviation: GAF
unit: percent
