id: dea:metric-planned-to-reactive-maintenance-ratio-deep-dive
name: Planned-to-Reactive Maintenance Ratio (Deep Dive)
type: Metric
description: Planned-to-Reactive Maintenance Ratio (Deep Dive) (PRMR-D) captures how efficiently resources
  are converted into outputs for organizations tracking facility management & workplace (deep dive). It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  Its calculation is Planned Maintenance Hours / Reactive Hours, measured in ratio (x:1 or x). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: PRMR-D
