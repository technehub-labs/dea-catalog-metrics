id: dea:metric-3-d-secure-pass-rate
name: 3-D Secure Pass Rate
type: Metric
description: A Payments & Cards (Deep Dive) indicator, 3-D Secure Pass Rate (3DSP) quantifies exposure
  to adverse outcomes. It is defined as 3DS Authenticated Successfully / 3DS Challenges; the result is
  stated in percent (%). It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. Higher values are better; gains are read as improvement and losses as deterioration.
  In Payments, it is a recognized element of the standard performance toolkit.
abbreviation: 3DSP
unit: percent
