id: dea:metric-manager-span-of-control-deep-dive
name: Manager Span of Control (Deep Dive)
type: Metric
description: A Standard Workforce & Pay Metrics indicator, Manager Span of Control (Deep Dive) (SOCDD)
  quantifies how efficiently resources are converted into outputs. It is defined as Direct Reports per
  Manager; the result is stated in ratio (x:1 or x). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. Values outside
  the intended band, on either side, warrant investigation.
