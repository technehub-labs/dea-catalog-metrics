id: dea:metric-release-scope-adherence
name: Release Scope Adherence
type: Metric
description: Release Scope Adherence (RSA-RM) addresses conformance to standards, plans, or obligations
  and is a fixture of release management & environments reporting. It is defined as Delivered Scope vs
  Committed Scope / Committed; the result is stated in percent (%). It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: RSA-RM
unit: percent
version: 1.1.0
