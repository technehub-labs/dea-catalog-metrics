id: dea:metric-track-maintenance-compliance
name: Track Maintenance Compliance
type: Metric
description: Track Maintenance Compliance (TMC) captures conformance to standards, plans, or obligations
  for organizations tracking rail transport. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Maintenance Tasks Completed on Schedule / Tasks Planned,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. It originates
  from and is most used in Rail practice.
