id: dea:metric-event-net-promoter-score-attendees
name: Event Net Promoter Score (Attendees)
type: Metric
description: Event Net Promoter Score (Attendees) (ENPS-A) captures the engagement or satisfaction of
  the people involved for organizations tracking events & exhibitions. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Attendee
  NPS Survey Result, measured in score (points). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Media & Entertainment practice.
