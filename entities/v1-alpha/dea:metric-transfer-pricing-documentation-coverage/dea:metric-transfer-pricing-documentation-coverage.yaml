id: dea:metric-transfer-pricing-documentation-coverage
name: Transfer Pricing Documentation Coverage
type: Metric
description: Transfer Pricing Documentation Coverage (TPDC) captures conformance to standards, plans,
  or obligations for organizations tracking tax & fiscal. Its calculation is Intercompany Flows with Documentation
  / Total Intercompany Flows, measured in percent (%). It is applied across virtually every sector. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
