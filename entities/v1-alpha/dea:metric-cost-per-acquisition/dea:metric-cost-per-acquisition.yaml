id: dea:metric-cost-per-acquisition
name: Cost per Acquisition
type: Metric
description: 'Cost per Acquisition (CPA) addresses how efficiently resources are converted into outputs
  and is a fixture of marketing reporting. The formula is Total Campaign Cost / Acquisitions - reported
  in currency per unit. It is applied across virtually every sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
abbreviation: CPA
unit: currency
