id: dea:metric-feature-store-coverage-ratio
name: Feature Store Coverage Ratio
type: Metric
description: A MLOps & Model Lifecycle Operations indicator, Feature Store Coverage Ratio (FSCR-M) quantifies
  how efficiently resources are converted into outputs. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Features Served from Feature Store /
  Total Features Used; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: FSCR-M
unit: percent
