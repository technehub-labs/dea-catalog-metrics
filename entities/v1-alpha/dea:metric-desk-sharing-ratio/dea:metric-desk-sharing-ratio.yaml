id: dea:metric-desk-sharing-ratio
name: Desk Sharing Ratio
type: Metric
description: Desk Sharing Ratio (DSR) measures the utilization or availability of capacity in the Facilities
  & Real Estate domain. It is defined as Employees / Workstations; the result is stated in ratio (x:1
  or x). It is applied across virtually every sector. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. Values outside the intended band, on either side, warrant
  investigation.
