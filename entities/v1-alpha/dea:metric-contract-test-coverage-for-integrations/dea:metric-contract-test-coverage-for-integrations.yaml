id: dea:metric-contract-test-coverage-for-integrations
name: Contract Test Coverage for Integrations
type: Metric
description: Within Software Testing & Quality Engineering, Contract Test Coverage for Integrations (CTCI-QA)
  is used to gauge the quality of outputs and outcomes. It is computed as Integrations with Contract Tests
  / Integrations, expressed in percent (%). It is applied across virtually every sector. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. It should be
  maximized within the limits of cost and quality trade-offs.
