id: dea:metric-usability-defect-escape-rate
name: Usability Defect Escape Rate
type: Metric
description: 'Usability Defect Escape Rate (UDER-UX) captures the quality of outputs and outcomes for
  organizations tracking ux & design systems. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Usability Issues Found Post-Release / All Usability Issues; the
  result is stated in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
abbreviation: UDER-UX
unit: percent
version: 1.1.0
lifecycle_status: candidate
