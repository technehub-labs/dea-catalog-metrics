id: dea:metric-unplanned-database-outage-count
name: Unplanned Database Outage Count
type: Metric
description: 'A Database & Data Platform Operations indicator, Unplanned Database Outage Count (UDO-CT)
  quantifies the quality of outputs and outcomes. It is defined as Unplanned Database Outages in Period;
  the result is stated in count (items per period). It is a working-level control: thresholds trigger
  immediate operational response. Lower values are better; each reduction is an improvement. In Software,
  it is a recognized element of the standard performance toolkit.'
