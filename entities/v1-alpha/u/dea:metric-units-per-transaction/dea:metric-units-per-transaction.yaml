id: dea:metric-units-per-transaction
name: Units per Transaction
type: Metric
description: Units per Transaction (UPT) measures the economic value created or preserved in the Retail
  & E-commerce domain. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is computed as Units Sold / Number of Transactions, expressed in ratio (x:1 or x). Improvement
  means raising this figure toward best-in-class levels. Its use is concentrated in Retail.
abbreviation: UPT
unit: ratio
version: 1.1.0
