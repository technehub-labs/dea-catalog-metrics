id: dea:metric-use-of-force-incident-rate
name: Use-of-Force Incident Rate
type: Metric
description: Use-of-Force Incident Rate (UOFIR) captures exposure to adverse outcomes for organizations
  tracking security services & guarding. Its calculation is Use-of-Force Reports / 1,000 Shifts, measured
  in events per thousand or million (scaled). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Lower values are better; each reduction is an improvement.
  It originates from and is most used in Security practice.
abbreviation: UOFIR
