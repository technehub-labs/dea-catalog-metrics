id: dea:metric-use-of-data-analytics-in-audit
name: Use of Data Analytics in Audit
type: Metric
description: Use of Data Analytics in Audit (UDAA) captures capability maturity or development for organizations
  tracking internal audit. It is defined as Audits Using Continuous Auditing or Analytics / Total Audits;
  the result is stated in percent (%). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: UDAA
unit: percent
version: 1.1.0
