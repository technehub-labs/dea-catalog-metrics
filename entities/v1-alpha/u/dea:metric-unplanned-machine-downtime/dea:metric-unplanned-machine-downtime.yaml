id: dea:metric-unplanned-machine-downtime
name: Unplanned Machine Downtime
type: Metric
description: Unplanned Machine Downtime (UMD) addresses exposure to adverse outcomes and is a fixture
  of manufacturing reporting. It provides the day-to-day signal that a process is running as designed.
  Its calculation is Unplanned Downtime Events or Hours per Period, measured in hours. It should be driven
  down, since lower readings signal healthier performance. It originates from and is most used in Manufacturing
  practice.
abbreviation: UMD
unit: hour
