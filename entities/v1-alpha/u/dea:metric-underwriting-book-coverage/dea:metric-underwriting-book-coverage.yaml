id: dea:metric-underwriting-book-coverage
name: Underwriting Book Coverage
type: Metric
description: 'A Investment Banking & Capital Markets indicator, Underwriting Book Coverage (UBC) quantifies
  exposure to adverse outcomes. The formula is Order Book Value / Offering Value - reported in ratio (x:1
  or x). It is a standard measure in the Investment banking sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. It should be maximized within the limits
  of cost and quality trade-offs.'
