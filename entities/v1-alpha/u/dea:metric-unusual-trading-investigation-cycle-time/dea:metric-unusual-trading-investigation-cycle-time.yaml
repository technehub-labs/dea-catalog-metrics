id: dea:metric-unusual-trading-investigation-cycle-time
name: Unusual Trading Investigation Cycle Time
type: Metric
description: 'Unusual Trading Investigation Cycle Time (UTICT) measures exposure to adverse outcomes in
  the Investment Research & Trading Operations domain. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Days from Alert to Surveillance
  Case Close - reported in days. It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Financial Services sector.'
