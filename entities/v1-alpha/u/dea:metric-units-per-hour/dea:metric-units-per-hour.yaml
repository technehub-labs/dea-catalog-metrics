id: dea:metric-units-per-hour
name: Units per Hour
type: Metric
description: 'Within Manufacturing, Units per Hour (UPH) is used to gauge the utilization or availability
  of capacity. It is a working-level control: thresholds trigger immediate operational response. It is
  defined as Units Produced / Production Hours; the result is stated in ratio (x:1 or x). Improvement
  means raising this figure toward best-in-class levels. In Manufacturing, it is a recognized element
  of the standard performance toolkit.'
abbreviation: UPH
unit: ratio
