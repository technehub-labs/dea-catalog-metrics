id: dea:metric-recycling-recovery-rate
name: Recycling Recovery Rate
type: Metric
description: Recycling Recovery Rate (RCR-E) addresses environmental and social sustainability performance
  and is a fixture of waste & environmental services reporting. The formula is Materials Recovered for
  Recycling / Recyclable Materials Received - reported in percent (%). It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Higher values are better; gains
  are read as improvement and losses as deterioration. It is a standard measure in the Environmental services
  sector.
