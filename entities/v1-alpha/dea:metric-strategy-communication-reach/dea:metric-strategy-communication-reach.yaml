id: dea:metric-strategy-communication-reach
name: Strategy Communication Reach
type: Metric
description: Strategy Communication Reach (SCHR) addresses the engagement or satisfaction of the people
  involved and is a fixture of balanced scorecard implementation & review reporting. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Employees
  Aware of Strategic Objectives / Employees; the result is stated in percent (%). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
