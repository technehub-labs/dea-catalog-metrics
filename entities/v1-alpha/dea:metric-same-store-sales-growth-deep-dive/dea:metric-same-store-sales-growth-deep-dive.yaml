id: dea:metric-same-store-sales-growth-deep-dive
name: Same-Store Sales Growth (Deep Dive)
type: Metric
description: 'A Retail Standard Measures indicator, Same-Store Sales Growth (Deep Dive) (SSSGDD) quantifies
  growth over time. It is computed as Comparable Store Revenue Change Year-over-Year, expressed in percent
  (%). It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is concentrated
  in Retail & E-commerce.'
