id: dea:metric-jitter-rate
name: Jitter Rate
type: Metric
description: 'Jitter Rate (JTR) measures the quality of outputs and outcomes in the Network Performance
  & Capacity domain. It is defined as Packet Delay Variation Exceeding Threshold / Samples; the result
  is stated in percent (%). It is applied across virtually every sector. It is a working-level control:
  thresholds trigger immediate operational response. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
