id: dea:metric-surgical-case-cancellation-rate-deep-dive
name: Surgical Case Cancellation Rate (Deep Dive)
type: Metric
description: Surgical Case Cancellation Rate (Deep Dive) (SCCR-D) addresses how efficiently resources
  are converted into outputs and is a fixture of medical practice & clinical operations reporting. It
  is computed as Cases Cancelled Day of Surgery / Cases Scheduled, expressed in percent (%). Its use is
  concentrated in Healthcare. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: SCCR-D
unit: percent
