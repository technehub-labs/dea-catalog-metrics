id: dea:metric-land-use-per-megawatt
name: Land Use per Megawatt
type: Metric
description: Land Use per Megawatt (LUMW) addresses environmental and social sustainability performance
  and is a fixture of energy transition & renewables reporting. Its value drives prioritization and resource
  reallocation among competing initiatives. Its calculation is Land Area Occupied / Installed Capacity,
  measured in ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Renewable energy practice.
abbreviation: LUMW
unit: ratio
version: 1.1.0
