id: dea:metric-customer-repeat-rate-within-90-days
name: Customer Repeat Rate within 90 Days
type: Metric
description: Within Retail & E-commerce, Customer Repeat Rate within 90 Days (CRR90) is used to gauge
  the retention of customers, users, or assets over time. It is defined as Customers Purchasing Again
  within 90 Days / Customers; the result is stated in percent (%). It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Higher values are better; gains are read
  as improvement and losses as deterioration. In Retail, it is a recognized element of the standard performance
  toolkit.
