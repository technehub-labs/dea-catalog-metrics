id: dea:metric-ad-trafficking-error-rate
name: Ad Trafficking Error Rate
type: Metric
description: Ad Trafficking Error Rate (ATER) addresses the quality of outputs and outcomes and is a fixture
  of advertising & media buying reporting. Its calculation is Campaigns Launched with Errors / Campaigns,
  measured in percent (%). It originates from and is most used in Media & Entertainment practice. It provides
  the day-to-day signal that a process is running as designed. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: ATER
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- quality
scope_classification:
- capability
directionality: lower_is_better
management_significance:
