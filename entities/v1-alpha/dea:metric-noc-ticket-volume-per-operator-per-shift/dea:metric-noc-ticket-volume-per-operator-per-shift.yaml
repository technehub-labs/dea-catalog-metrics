id: dea:metric-noc-ticket-volume-per-operator-per-shift
name: NOC Ticket Volume per Operator per Shift
type: Metric
description: A Network Operations Center (Deep Dive) indicator, NOC Ticket Volume per Operator per Shift
  (NOC-TVS) quantifies the utilization or availability of capacity. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. It is computed as Tickets Handled
  / Operator Shift, expressed in count (items per period). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: NOC-TVS
