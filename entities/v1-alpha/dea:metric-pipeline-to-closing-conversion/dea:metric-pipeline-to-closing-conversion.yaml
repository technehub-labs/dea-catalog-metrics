id: dea:metric-pipeline-to-closing-conversion
name: Pipeline-to-Closing Conversion
type: Metric
description: Pipeline-to-Closing Conversion (P2CC) addresses how effectively a process or entity achieves
  its intended outcome and is a fixture of real estate brokerage reporting. It is defined as Closings
  / Active Pipeline Opportunities; the result is stated in percent (%). It bridges daily operations and
  executive reporting, giving managers a lever to pull within a quarter. Higher values are better; gains
  are read as improvement and losses as deterioration. In Real estate, it is a recognized element of the
  standard performance toolkit.
