id: dea:metric-netting-center-settlement-efficiency
name: Netting Center Settlement Efficiency
type: Metric
description: A Corporate Treasury (Deep Dive) indicator, Netting Center Settlement Efficiency (NCSE) quantifies
  how efficiently resources are converted into outputs. It is computed as Netted Intercompany Flows /
  Gross Flows, expressed in percent (%). It is reviewed at cadence by planning owners to correct course
  before issues become strategic. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: NCSE
unit: percent
