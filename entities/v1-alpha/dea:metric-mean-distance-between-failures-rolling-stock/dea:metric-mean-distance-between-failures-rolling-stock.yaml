id: dea:metric-mean-distance-between-failures-rolling-stock
name: Mean Distance between Failures (Rolling Stock)
type: Metric
description: Mean Distance between Failures (Rolling Stock) (MDBF) measures exposure to adverse outcomes
  in the Rail Transport domain. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Distance Operated / Service-Affecting Failures - reported
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Rail sector.
abbreviation: MDBF
unit: ratio
