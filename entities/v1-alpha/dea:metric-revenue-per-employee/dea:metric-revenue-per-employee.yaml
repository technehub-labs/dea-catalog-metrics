id: dea:metric-revenue-per-employee
name: Revenue per Employee
type: Metric
description: A Human Resources indicator, Revenue per Employee (RPE) quantifies the economic value created
  or preserved. Its calculation is Revenue / Average Headcount, measured in currency value. It is applied
  across virtually every sector. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
