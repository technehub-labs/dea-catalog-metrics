id: dea:metric-project-cycle-time
name: Project Cycle Time
type: Metric
description: 'Project Cycle Time (PCyT) addresses how efficiently resources are converted into outputs
  and is a fixture of project management reporting. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Days from Project Start to Closure,
  expressed in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
