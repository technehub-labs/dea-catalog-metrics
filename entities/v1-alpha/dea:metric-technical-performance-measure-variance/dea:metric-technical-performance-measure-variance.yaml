id: dea:metric-technical-performance-measure-variance
name: Technical Performance Measure Variance
type: Metric
description: 'Technical Performance Measure Variance (TPMV) addresses the quality of outputs and outcomes
  and is a fixture of aerospace & defense program management reporting. It is computed as Actual TPM -
  Threshold TPM / Threshold, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is concentrated in Aerospace
  & Defense.'
abbreviation: TPMV
unit: percent
version: 1.1.0
