id: dea:metric-design-cycle-time
name: Design Cycle Time
type: Metric
description: A R&D and Innovation indicator, Design Cycle Time (DCT) quantifies how efficiently resources
  are converted into outputs. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is Days from Design Brief to Design Freeze, measured in days. It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
abbreviation: DCT
unit: day
