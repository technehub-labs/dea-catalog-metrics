id: dea:metric-match-rule-precision
name: Match Rule Precision
type: Metric
description: Within Master Data Management, Match Rule Precision (MRP-MD) is used to gauge the quality
  of outputs and outcomes. Its calculation is True Matches / Total Auto-Matches, measured in percent (%).
  It is applied across virtually every sector. It provides the day-to-day signal that a process is running
  as designed. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: MRP-MD
unit: percent
