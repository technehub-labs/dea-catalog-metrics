id: dea:metric-overhead-ratio
name: Overhead Ratio
type: Metric
description: Overhead Ratio (OHR) captures how efficiently resources are converted into outputs for organizations
  tracking banking & financial services. The formula is Non-Interest Expense / Average Assets - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. It is a standard measure in the
  Financial services sector.
