id: dea:metric-false-alarm-rate
name: False Alarm Rate
type: Metric
description: 'Within Physical Security Operations, False Alarm Rate (FAR-S) is used to gauge the quality
  of outputs and outcomes. It is defined as False Alarms / Total Alarms; the result is stated in percent
