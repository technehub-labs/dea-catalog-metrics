id: dea:metric-volunteering-hours-per-employee
name: Volunteering Hours per Employee
type: Metric
description: Within Sustainability & ESG, Volunteering Hours per Employee (VHPE) is used to gauge the
  engagement or satisfaction of the people involved. It is computed as Volunteering Hours / Average Headcount,
  expressed in hours. It is applied across virtually every sector. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It should be maximized within the limits of
  cost and quality trade-offs.
