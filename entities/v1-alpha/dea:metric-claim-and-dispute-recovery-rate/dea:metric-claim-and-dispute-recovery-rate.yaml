id: dea:metric-claim-and-dispute-recovery-rate
name: Claim and Dispute Recovery Rate
type: Metric
description: 'A Construction Contracting (Deep Dive) indicator, Claim and Dispute Recovery Rate (CDRR)
  quantifies the economic value created or preserved. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Claims Recovered / Claims Filed,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Its use
  is concentrated in Construction.'
