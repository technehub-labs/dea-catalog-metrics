id: dea:metric-operational-loss-event-rate
name: Operational Loss Event Rate
type: Metric
description: A Investment Risk & Middle Office Operations indicator, Operational Loss Event Rate (OLER)
  quantifies exposure to adverse outcomes. It provides the day-to-day signal that a process is running
  as designed. Its calculation is Operational Loss Events per 1,000 Trades, measured in events per thousand
  or million (scaled). It should be driven down, since lower readings signal healthier performance. It
  originates from and is most used in Investment management practice.
