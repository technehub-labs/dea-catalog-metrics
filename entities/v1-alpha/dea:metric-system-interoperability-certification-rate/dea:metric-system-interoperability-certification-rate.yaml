id: dea:metric-system-interoperability-certification-rate
name: System Interoperability Certification Rate
type: Metric
description: System Interoperability Certification Rate (SICR) captures conformance to standards, plans,
  or obligations for organizations tracking defense & aerospace. Its value drives prioritization and resource
  reallocation among competing initiatives. Its calculation is Systems Certified Interoperable / Systems
  Requiring Certification, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Defense & aerospace practice.
abbreviation: SICR
unit: percent
