id: dea:metric-test-and-evaluation-point-success-rate
name: Test and Evaluation Point Success Rate
type: Metric
description: Test and Evaluation Point Success Rate (TEPS) addresses the quality of outputs and outcomes
  and is a fixture of defense & aerospace reporting. It is computed as Test Points Passed / Test Points
  Executed, expressed in percent (%). Its use is concentrated in Defense & aerospace. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: TEPS
unit: percent
