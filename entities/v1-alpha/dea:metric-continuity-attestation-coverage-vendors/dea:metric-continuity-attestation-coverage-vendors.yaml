id: dea:metric-continuity-attestation-coverage-vendors
name: Continuity Attestation Coverage (Vendors)
type: Metric
description: 'Within Third-Party Risk Management, Continuity Attestation Coverage (Vendors) (CACV) is
  used to gauge exposure to adverse outcomes. It is computed as Critical Vendors Attesting BCP / Critical
  Vendors, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
