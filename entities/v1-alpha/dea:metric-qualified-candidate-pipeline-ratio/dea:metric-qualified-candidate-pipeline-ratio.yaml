id: dea:metric-qualified-candidate-pipeline-ratio
name: Qualified Candidate Pipeline Ratio
type: Metric
description: Qualified Candidate Pipeline Ratio (QCPR) addresses the utilization or availability of capacity
  and is a fixture of talent acquisition deep dive reporting. Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. It is computed as Qualified Candidates per
  Open Requisition, expressed in ratio (x:1 or x). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
