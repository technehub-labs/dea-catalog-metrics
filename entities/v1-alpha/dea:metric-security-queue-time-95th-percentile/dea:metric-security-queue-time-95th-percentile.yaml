id: dea:metric-security-queue-time-95th-percentile
name: Security Queue Time - 95th Percentile
type: Metric
description: Security Queue Time - 95th Percentile (SQT95) captures the quality of outputs and outcomes
  for organizations tracking airport operations (deep dive). Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. It is computed as Minutes waited by 95th
  percentile passenger, expressed in minutes. It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Aviation.
