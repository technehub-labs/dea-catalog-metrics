id: dea:metric-tracking-event-timeliness
name: Tracking Event Timeliness
type: Metric
description: 'A Postal & Courier indicator, Tracking Event Timeliness (TET) quantifies the quality of
  outputs and outcomes. It is defined as Scan Events Posted within Threshold / Events Generated; the result
  is stated in percent (%). In Postal & courier, it is a recognized element of the standard performance
  toolkit. It is a working-level control: thresholds trigger immediate operational response. It should
  be maximized within the limits of cost and quality trade-offs.'
abbreviation: TET
unit: percent
version: 1.1.0
