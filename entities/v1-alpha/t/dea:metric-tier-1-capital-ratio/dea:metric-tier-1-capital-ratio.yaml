id: dea:metric-tier-1-capital-ratio
name: Tier 1 Capital Ratio
type: Metric
description: 'A Banking & Financial Services indicator, Tier 1 Capital Ratio (T1CR) quantifies exposure
  to adverse outcomes. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It is computed as Tier 1 Capital / Risk-Weighted Assets, expressed in percent (%). Improvement
  means raising this figure toward best-in-class levels. Its use is concentrated in Financial services.'
abbreviation: T1CR
unit: percent
