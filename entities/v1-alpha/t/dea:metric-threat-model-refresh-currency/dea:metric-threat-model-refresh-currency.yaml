id: dea:metric-threat-model-refresh-currency
name: Threat Model Refresh Currency
type: Metric
description: 'A Threat Intelligence & Red Team indicator, Threat Model Refresh Currency (TMFC) quantifies
  conformance to standards, plans, or obligations. The formula is Threat Models Refreshed within 12 Months
  / In-Scope Systems - reported in percent (%). It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
