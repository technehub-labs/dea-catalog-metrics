id: dea:metric-time-to-fill-deep-dive
name: Time to Fill (Deep Dive)
type: Metric
description: Time to Fill (Deep Dive) (TTFDD) addresses how efficiently resources are converted into outputs
  and is a fixture of talent acquisition deep dive reporting. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Days from Requisition Open to Accepted
  Offer, expressed in days. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: TTFDD
unit: day
