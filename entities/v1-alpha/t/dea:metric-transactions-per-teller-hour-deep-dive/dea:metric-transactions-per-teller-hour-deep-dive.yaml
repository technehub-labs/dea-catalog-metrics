id: dea:metric-transactions-per-teller-hour-deep-dive
name: Transactions per Teller Hour (Deep Dive)
type: Metric
description: Transactions per Teller Hour (Deep Dive) (TPTH-D) measures how efficiently resources are
  converted into outputs in the Retail Banking Branch Network (Deep Dive) domain. Its calculation is Teller
  Transactions / Teller Hours, measured in count (items per period). It provides the day-to-day signal
  that a process is running as designed. Higher values are better; gains are read as improvement and losses
  as deterioration. It originates from and is most used in Banking practice.
abbreviation: TPTH-D
unit: count
