id: dea:metric-turnaround-time-deep-dive
name: Turnaround Time (Deep Dive)
type: Metric
description: 'Turnaround Time (Deep Dive) (TAT-D) addresses how efficiently resources are converted into
  outputs and is a fixture of airline operations (deep dive) reporting. It is defined as Minutes from
  On-Blocks to Off-Blocks; the result is stated in minutes. In Airlines, it is a recognized element of
  the standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: TAT-D
unit: minute
version: 1.1.0
lifecycle_status: candidate
