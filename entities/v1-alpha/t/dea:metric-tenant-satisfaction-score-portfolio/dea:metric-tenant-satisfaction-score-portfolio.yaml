id: dea:metric-tenant-satisfaction-score-portfolio
name: Tenant Satisfaction Score (Portfolio)
type: Metric
description: Tenant Satisfaction Score (Portfolio) (TSS-P) measures the engagement or satisfaction of
  the people involved in the Real Estate Portfolio & Property Management domain. Its calculation is Average
  Tenant Survey Score, measured in score (points). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. It originates from and is most used in Real Estate practice.
abbreviation: TSS-P
unit: score
