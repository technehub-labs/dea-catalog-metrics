id: dea:metric-third-party-compliance-attestation-rate
name: Third-Party Compliance Attestation Rate
type: Metric
description: Third-Party Compliance Attestation Rate (TPCAR) addresses conformance to standards, plans,
  or obligations and is a fixture of compliance monitoring & testing reporting. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Vendors Submitting Compliance
  Attestations / Vendors in Scope, measured in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: TPCAR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- governance
purpose_classification:
- compliance
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
