source_credit: Public domain - no attribution required
calculation_definition: Vendors Submitting Compliance Attestations / Vendors in Scope
formula_definition:
  formula_id: dea:formula-third-party-compliance-attestation-rate
  expression: TPCAR = Vendors Submitting Compliance Attestations / Vendors in Scope
  inputs:
  - name: Vendors Submitting Compliance Attestations
  - name: Vendors in Scope
