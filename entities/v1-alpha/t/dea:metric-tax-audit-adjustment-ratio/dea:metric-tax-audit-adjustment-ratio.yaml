id: dea:metric-tax-audit-adjustment-ratio
name: Tax Audit Adjustment Ratio
type: Metric
description: Tax Audit Adjustment Ratio (TAAR) captures exposure to adverse outcomes for organizations
  tracking tax & fiscal. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Tax Audit Adjustments / Taxes Originally Declared, expressed in
  percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: TAAR
unit: percent
version: 1.1.0
lifecycle_status: candidate
