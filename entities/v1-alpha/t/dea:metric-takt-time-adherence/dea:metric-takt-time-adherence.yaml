id: dea:metric-takt-time-adherence
name: Takt Time Adherence
type: Metric
description: 'Takt Time Adherence (TTA) captures how efficiently resources are converted into outputs
  for organizations tracking manufacturing. It is defined as Cycle Time / Takt Time; the result is stated
  in ratio (x:1 or x). In Manufacturing, it is a recognized element of the standard performance toolkit.
  It is a working-level control: thresholds trigger immediate operational response. Values outside the
  intended band, on either side, warrant investigation.'
abbreviation: TTA
unit: ratio
