id: dea:metric-trial-to-membership-conversion
name: Trial to Membership Conversion
type: Metric
description: Trial to Membership Conversion (T2M) measures how effectively a process or entity achieves
  its intended outcome in the Fitness & Wellness domain. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Trials Converting to Membership
  / Trials, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  It originates from and is most used in Fitness & wellness practice.
abbreviation: T2M
unit: percent
