id: dea:metric-tangible-book-value-coverage
name: Tangible Book Value Coverage
type: Metric
description: 'Tangible Book Value Coverage (TBVC) measures exposure to adverse outcomes in the Valuation
  & Corporate Finance Standard Measures domain. It is computed as Tangible Book Value / Total Debt, expressed
  in ratio (x:1 or x). It is applied across virtually every sector. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It should be maximized within the
  limits of cost and quality trade-offs.'
abbreviation: TBVC
unit: ratio
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
- risk
scope_classification:
- organizational_unit
directionality: higher_is_better
