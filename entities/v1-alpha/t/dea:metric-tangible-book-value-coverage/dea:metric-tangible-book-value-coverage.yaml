source_credit: Public domain - no attribution required
calculation_definition: Tangible Book Value / Total Debt
formula_definition:
  formula_id: dea:formula-tangible-book-value-coverage
  expression: TBVC = Tangible Book Value / Total Debt
  inputs:
  - name: Tangible Book Value
  - name: Total Debt
