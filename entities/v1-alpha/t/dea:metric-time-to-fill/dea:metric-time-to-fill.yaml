id: dea:metric-time-to-fill
name: Time to Fill
type: Metric
description: Time to Fill (TTF) measures how efficiently resources are converted into outputs in the Human
  Resources domain. Its calculation is Days from Job Requisition to Offer Acceptance, measured in days.
  Its value drives prioritization and resource reallocation among competing initiatives. Lower values
  are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: TTF
unit: day
version: 1.1.0
