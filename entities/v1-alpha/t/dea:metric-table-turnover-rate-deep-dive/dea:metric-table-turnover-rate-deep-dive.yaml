id: dea:metric-table-turnover-rate-deep-dive
name: Table Turnover Rate (Deep Dive)
type: Metric
description: Within Restaurant Operations (Deep Dive), Table Turnover Rate (Deep Dive) (TTR-D) is used
  to gauge the utilization or availability of capacity. It is computed as Party Turns per Table per Service,
  expressed in times per period. Its use is concentrated in Restaurants. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: TTR-D
