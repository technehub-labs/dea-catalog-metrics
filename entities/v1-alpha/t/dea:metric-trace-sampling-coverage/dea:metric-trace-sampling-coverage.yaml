id: dea:metric-trace-sampling-coverage
name: Trace Sampling Coverage
type: Metric
description: A Observability & Site Reliability Engineering indicator, Trace Sampling Coverage (TSC) quantifies
  capability maturity or development. It is computed as Transactions with Distributed Tracing / Transactions,
  expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations demand
  immediate correction. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: TSC
unit: percent
