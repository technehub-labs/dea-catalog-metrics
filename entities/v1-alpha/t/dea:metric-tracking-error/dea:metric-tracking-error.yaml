id: dea:metric-tracking-error
name: Tracking Error
type: Metric
description: Within Investment Management, Tracking Error (TE) is used to gauge exposure to adverse outcomes.
  The formula is Standard Deviation of Portfolio Return minus Benchmark Return - reported in percent (%).
  It is a standard measure in the Asset management sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Values outside the intended band, on either
  side, warrant investigation.
abbreviation: TE
unit: percent
