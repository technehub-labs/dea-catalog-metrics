id: dea:metric-technology-asset-disposal-compliance
name: Technology Asset Disposal Compliance
type: Metric
description: A IT Financial Management & Technology Budgeting indicator, Technology Asset Disposal Compliance
  (TADC-ITFM) quantifies conformance to standards, plans, or obligations. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It is computed as Assets Disposed
  per Policy / Disposals, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: TADC-ITFM
