id: dea:metric-threshold-alert-rate
name: Threshold Alert Rate
type: Metric
description: Threshold Alert Rate (THAR) captures how efficiently resources are converted into outputs
  for organizations tracking statistical model performance diagnostics. It provides the day-to-day signal
  that a process is running as designed. Its calculation is Scored Cases Requiring Manual Review at Threshold
  / Cases, measured in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. It originates from and is most used in Software practice.
abbreviation: THAR
unit: percent
version: 1.1.0
