id: dea:metric-territory-cannibalization-rate
name: Territory Cannibalization Rate
type: Metric
description: A Franchise Operations (Deep Dive) indicator, Territory Cannibalization Rate (TCR-F) quantifies
  exposure to adverse outcomes. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Same-Brand Sales Decline after New Opening / Baseline; the result
  is stated in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: TCR-F
unit: percent
version: 1.1.0
