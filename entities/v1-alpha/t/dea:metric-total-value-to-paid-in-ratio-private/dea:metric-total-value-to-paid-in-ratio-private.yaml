id: dea:metric-total-value-to-paid-in-ratio-private
name: Total Value to Paid-In Ratio (Private)
type: Metric
description: Total Value to Paid-In Ratio (Private) (TVPI) addresses the economic value created or preserved
  and is a fixture of investment management - portfolio operations reporting. Its calculation is (Distributions
  + Residual Value) / Paid-In Capital, measured in ratio (x:1 or x). It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Higher values are better;
  gains are read as improvement and losses as deterioration. It originates from and is most used in Financial
  Services practice.
abbreviation: TVPI
unit: ratio
