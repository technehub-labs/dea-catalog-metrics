id: dea:metric-total-cost-of-ownership
name: Total Cost of Ownership
type: Metric
description: A Finance & Accounting indicator, Total Cost of Ownership (TCO) quantifies the economic value
  created or preserved. Its value drives prioritization and resource reallocation among competing initiatives.
  Its calculation is Purchase Price + Operating Costs + Maintenance Costs - Residual Value, measured in
  currency value. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: TCO
unit: currency
