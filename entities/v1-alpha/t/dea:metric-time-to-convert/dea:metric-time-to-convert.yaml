id: dea:metric-time-to-convert
name: Time to Convert
type: Metric
description: Time to Convert (TTC) addresses how efficiently resources are converted into outputs and
  is a fixture of marketing reporting. Its calculation is Average Days from First Touch to Conversion,
  measured in days. It is applied across virtually every sector. Its value drives prioritization and resource
  reallocation among competing initiatives. Reduction is the goal, and sustained decreases indicate successful
  intervention.
abbreviation: TTC
unit: day
