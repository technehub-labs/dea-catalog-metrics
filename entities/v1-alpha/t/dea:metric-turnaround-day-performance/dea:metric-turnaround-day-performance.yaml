id: dea:metric-turnaround-day-performance
name: Turnaround Day Performance
type: Metric
description: Turnaround Day Performance (TDP) addresses how efficiently resources are converted into outputs
  and is a fixture of cruise & passenger shipping reporting. It is computed as Minutes from Last Debarkation
  to First Embarkation Readiness, expressed in minutes. Its use is concentrated in Hospitality. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. Reduction
  is the goal, and sustained decreases indicate successful intervention.
