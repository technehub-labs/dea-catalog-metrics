id: dea:metric-territory-coverage-density
name: Territory Coverage Density
type: Metric
description: 'Territory Coverage Density (TCD) measures the utilization or availability of capacity in
  the Insurance Distribution & Agency Management domain. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Active Appointed Producers / Designated
  Territory, expressed in count (items per period). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Its use is concentrated in Insurance.'
abbreviation: TCD
unit: count
version: 1.1.0
lifecycle_status: candidate
subject_classification:
