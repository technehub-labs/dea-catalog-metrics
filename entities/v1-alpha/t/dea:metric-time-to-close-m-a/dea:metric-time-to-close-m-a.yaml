id: dea:metric-time-to-close-m-a
name: Time to Close (M&A)
type: Metric
description: Time to Close (M&A) (TTC-M) addresses how efficiently resources are converted into outputs
  and is a fixture of mergers & acquisitions reporting. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Days from Term Sheet to Deal Close -
  reported in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
