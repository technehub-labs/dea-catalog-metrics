id: dea:metric-testability-of-requirements-rate
name: Testability of Requirements Rate
type: Metric
description: 'A Requirements Engineering & Product Discovery indicator, Testability of Requirements Rate
  (TORR-RE) quantifies the quality of outputs and outcomes. The formula is Requirements Written as Testable
  Statements / Requirements - reported in percent (%). It is applied across virtually every sector. It
  is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should be
  maximized within the limits of cost and quality trade-offs.'
abbreviation: TORR-RE
unit: percent
version: 1.1.0
