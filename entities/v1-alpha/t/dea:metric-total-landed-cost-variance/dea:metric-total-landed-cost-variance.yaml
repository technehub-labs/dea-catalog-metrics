id: dea:metric-total-landed-cost-variance
name: Total Landed Cost Variance
type: Metric
description: 'Within Supply Chain Standard Measures (Deep Dive), Total Landed Cost Variance (TLCV) is
  used to gauge the economic value created or preserved. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Actual vs Planned Landed Cost
  / Planned, expressed in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: TLCV
unit: percent
version: 1.1.0
