id: dea:metric-time-to-degree-median
name: Time-to-Degree (Median)
type: Metric
description: Time-to-Degree (Median) (TTD) addresses how efficiently resources are converted into outputs
  and is a fixture of education & training outcome standard measures reporting. Its calculation is Median
  Years from Entry to Award, measured in years. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Lower values are better; each reduction is an improvement.
  It originates from and is most used in Education practice.
