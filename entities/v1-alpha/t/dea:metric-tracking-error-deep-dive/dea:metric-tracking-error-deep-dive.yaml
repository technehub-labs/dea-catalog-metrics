id: dea:metric-tracking-error-deep-dive
name: Tracking Error (Deep Dive)
type: Metric
description: A Investment Management - Portfolio Operations indicator, Tracking Error (Deep Dive) (TE-D)
  quantifies exposure to adverse outcomes. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Standard Deviation of Active Returns; the result
  is stated in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. In Financial Services, it is a recognized element of the standard performance
  toolkit.
abbreviation: TE-D
unit: percent
