id: dea:metric-technology-currency-index
name: Technology Currency Index
type: Metric
description: Technology Currency Index (TCI-SA) addresses exposure to adverse outcomes and is a fixture
  of software architecture & technical design reporting. The formula is Components on Supported Versions
  / Components - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: TCI-SA
unit: percent
