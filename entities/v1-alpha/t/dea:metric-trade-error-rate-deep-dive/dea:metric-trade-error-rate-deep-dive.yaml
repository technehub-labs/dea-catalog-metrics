id: dea:metric-trade-error-rate-deep-dive
name: Trade Error Rate (Deep Dive)
type: Metric
description: Within Investment Management - Portfolio Operations, Trade Error Rate (Deep Dive) (TER-D)
  is used to gauge the quality of outputs and outcomes. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Trade Errors / Trades, measured in events per thousand or
  million (scaled). It should be driven down, since lower readings signal healthier performance. It originates
  from and is most used in Financial Services practice.
abbreviation: TER-D
unit: event
