id: dea:metric-tolerance-compliance-yield
name: Tolerance Compliance Yield
type: Metric
description: 'Within Engineering & Design, Tolerance Compliance Yield (TCY) is used to gauge the quality
  of outputs and outcomes. The formula is Dimensions within Tolerance / Dimensions Measured - reported
  in percent (%). It is applied across virtually every sector. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. It should be maximized within the limits of cost
  and quality trade-offs.'
abbreviation: TCY
unit: percent
