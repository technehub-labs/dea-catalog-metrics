id: dea:metric-target-operating-model-realization-rate
name: Target Operating Model Realization Rate
type: Metric
description: Target Operating Model Realization Rate (TOMRR) addresses how effectively a process or entity
  achieves its intended outcome and is a fixture of operating model monitoring & design effectiveness
  reporting. The formula is Implemented TOM Components / Designed Components - reported in percent (%).
  It is applied across virtually every sector. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: TOMRR
unit: percent
version: 1.1.0
lifecycle_status: candidate
