id: dea:metric-tracking-error-volatility
name: Tracking Error Volatility
type: Metric
description: 'Tracking Error Volatility (TEV) addresses exposure to adverse outcomes and is a fixture
  of investment performance measurement reporting. It is computed as Standard Deviation of Portfolio vs
  Benchmark Returns, expressed in percent (%). Its use is concentrated in Investment management. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. Values
  outside the intended band, on either side, warrant investigation.'
abbreviation: TEV
unit: percent
