id: dea:metric-toil-reduction-rate
name: Toil Reduction Rate
type: Metric
description: Toil Reduction Rate (TRR-SRE) captures how efficiently resources are converted into outputs
  for organizations tracking observability & site reliability engineering. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Reduction in Manual
  Operational Work Hours per Quarter - reported in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
