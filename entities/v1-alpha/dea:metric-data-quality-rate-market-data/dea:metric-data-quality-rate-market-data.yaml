id: dea:metric-data-quality-rate-market-data
name: Data Quality Rate (Market Data)
type: Metric
description: Data Quality Rate (Market Data) (DQRMD) measures the quality of outputs and outcomes in the
  Investment Risk & Middle Office Operations domain. It is computed as Market Data Fields Passing Checks
  / Fields, expressed in percent (%). Its use is concentrated in Investment management. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. It should be
  maximized within the limits of cost and quality trade-offs.
