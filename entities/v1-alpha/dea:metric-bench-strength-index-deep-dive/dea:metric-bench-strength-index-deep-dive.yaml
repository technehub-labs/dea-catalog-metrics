id: dea:metric-bench-strength-index-deep-dive
name: Bench Strength Index (Deep Dive)
type: Metric
description: Bench Strength Index (Deep Dive) (BSIDD) addresses exposure to adverse outcomes and is a
  fixture of learning & development effectiveness (deep dive) reporting. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Successors Ready Now
  for Critical Roles / Critical Roles; the result is stated in index (0-100 or normalized). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
