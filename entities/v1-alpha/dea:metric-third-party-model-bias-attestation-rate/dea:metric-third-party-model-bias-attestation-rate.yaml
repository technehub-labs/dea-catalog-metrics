id: dea:metric-third-party-model-bias-attestation-rate
name: Third-Party Model Bias Attestation Rate
type: Metric
description: Within AI Ethics, Fairness & Responsible AI, Third-Party Model Bias Attestation Rate (TMBAR)
  is used to gauge exposure to adverse outcomes. It is defined as Vendor Models with Bias Attestation
  / Vendor Models; the result is stated in percent (%). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
