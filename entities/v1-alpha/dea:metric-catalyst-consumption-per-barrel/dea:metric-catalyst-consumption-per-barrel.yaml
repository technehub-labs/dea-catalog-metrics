id: dea:metric-catalyst-consumption-per-barrel
name: Catalyst Consumption per Barrel
type: Metric
description: Catalyst Consumption per Barrel (CCPB) captures how efficiently resources are converted into
  outputs for organizations tracking oil & gas downstream & refining. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Catalyst Cost / Barrels Processed,
  measured in currency per unit. It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Oil & Gas practice.
