id: dea:metric-claims-leakage-rate
name: Claims Leakage Rate
type: Metric
description: Claims Leakage Rate (CLR) captures the economic value created or preserved for organizations
  tracking claims operations (insurance). Its calculation is Claims Overpayment Value / Total Claims Paid,
  measured in percent (%). It originates from and is most used in Insurance practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Reduction is the
  goal, and sustained decreases indicate successful intervention.
abbreviation: CLR
unit: percent
version: 1.1.0
lifecycle_status: candidate
