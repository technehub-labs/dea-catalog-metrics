id: dea:metric-plant-operating-rate
name: Plant Operating Rate
type: Metric
description: A Chemicals indicator, Plant Operating Rate (POR-C) quantifies the utilization or availability
  of capacity. It is defined as Actual Production / Nameplate Capacity; the result is stated in percent
  (%). In Chemicals, it is a recognized element of the standard performance toolkit. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: POR-C
unit: percent
