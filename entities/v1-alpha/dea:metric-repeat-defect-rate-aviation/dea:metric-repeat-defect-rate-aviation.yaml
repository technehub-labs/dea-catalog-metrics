id: dea:metric-repeat-defect-rate-aviation
name: Repeat Defect Rate (Aviation)
type: Metric
description: Repeat Defect Rate (Aviation) (RDR-A) measures the quality of outputs and outcomes in the
  Aviation Maintenance Repair & Overhaul domain. It is computed as Defects Recurring after Repair / Repairs
  Performed, expressed in percent (%). It is reviewed at cadence by planning owners to correct course
  before issues become strategic. Lower values are better; each reduction is an improvement. Its use is
  concentrated in Airlines & aviation.
abbreviation: RDR-A
unit: percent
