id: dea:metric-churn-prediction-coverage
name: Churn Prediction Coverage
type: Metric
description: Churn Prediction Coverage (CPC-S) addresses exposure to adverse outcomes and is a fixture
  of customer success (b2b saas) reporting. Its calculation is At-Risk Accounts with Active Save Plan
  / At-Risk Accounts, measured in percent (%). It originates from and is most used in Software & SaaS
  practice. Its value drives prioritization and resource reallocation among competing initiatives. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: CPC-S
unit: percent
