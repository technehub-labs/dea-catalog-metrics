id: dea:metric-critical-data-element-governance-coverage
name: Critical Data Element Governance Coverage
type: Metric
description: Within Data Governance & Stewardship, Critical Data Element Governance Coverage (CDEGC) is
  used to gauge the quality of outputs and outcomes. Its calculation is Critical Data Elements with Defined
  Standard / CDEs, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
