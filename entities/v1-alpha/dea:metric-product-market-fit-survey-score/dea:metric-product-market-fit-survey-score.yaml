id: dea:metric-product-market-fit-survey-score
name: Product-Market Fit Survey Score
type: Metric
description: Within Startup & Venture-Backed Business, Product-Market Fit Survey Score (PMFS) is used
  to gauge the engagement or satisfaction of the people involved. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Percent of
  Users Very Disappointed if Product Removed, measured in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
