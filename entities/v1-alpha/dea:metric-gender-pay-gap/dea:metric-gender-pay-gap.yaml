id: dea:metric-gender-pay-gap
name: Gender Pay Gap
type: Metric
description: A Human Resources indicator, Gender Pay Gap (GPG) quantifies conformance to standards, plans,
  or obligations. The formula is (Median Male Pay - Median Female Pay) / Median Male Pay - reported in
  percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: GPG
unit: percent
