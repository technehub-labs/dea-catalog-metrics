id: dea:metric-collection-route-efficiency
name: Collection Route Efficiency
type: Metric
description: Collection Route Efficiency (CRE) measures how efficiently resources are converted into outputs
  in the Waste & Environmental Services domain. It is computed as Households Served per Route Hour, expressed
  in ratio (x:1 or x). Its use is concentrated in Environmental services. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: CRE
unit: ratio
