id: dea:metric-safety-incident-frequency-construction
name: Safety Incident Frequency (Construction)
type: Metric
description: A Construction & Engineering indicator, Safety Incident Frequency (Construction) (SIFC) quantifies
  exposure to adverse outcomes. It is defined as (Recordable Incidents x 200,000) / Total Hours Worked;
  the result is stated in ratio (x:1 or x). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Lower values are better; each reduction is an improvement. In Construction
  & engineering, it is a recognized element of the standard performance toolkit.
abbreviation: SIFC
