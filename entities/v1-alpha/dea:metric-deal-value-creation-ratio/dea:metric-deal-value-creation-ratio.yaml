id: dea:metric-deal-value-creation-ratio
name: Deal Value Creation Ratio
type: Metric
description: Within Mergers & Acquisitions, Deal Value Creation Ratio (DVCR) is used to gauge the economic
  value created or preserved. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Acquired Enterprise Value Change / Purchase Price,
  measured in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
