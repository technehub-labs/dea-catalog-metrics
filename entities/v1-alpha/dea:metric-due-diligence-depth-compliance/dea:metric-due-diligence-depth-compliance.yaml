id: dea:metric-due-diligence-depth-compliance
name: Due Diligence Depth Compliance
type: Metric
description: Due Diligence Depth Compliance (DDDC) captures conformance to standards, plans, or obligations
  for organizations tracking third-party risk management. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Vendors Receiving Tier-Appropriate
  Diligence / Vendors; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: DDDC
unit: percent
