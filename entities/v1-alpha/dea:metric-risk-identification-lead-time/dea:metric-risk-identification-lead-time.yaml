id: dea:metric-risk-identification-lead-time
name: Risk Identification Lead Time
type: Metric
description: Risk Identification Lead Time (RILT) addresses exposure to adverse outcomes and is a fixture
  of project risk & issue management reporting. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. It is defined as Days Risk Identified before Impact vs Realized;
  the result is stated in days. Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
