id: dea:metric-monthly-recurring-revenue-per-account
name: Monthly Recurring Revenue per Account
type: Metric
description: Monthly Recurring Revenue per Account (MRRA) addresses the economic value created or preserved
  and is a fixture of customer success (b2b saas) reporting. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as MRR / Active Accounts; the result
  is stated in currency per unit. Improvement means raising this figure toward best-in-class levels. In
  Software & SaaS, it is a recognized element of the standard performance toolkit.
