id: dea:metric-guaranteed-service-level-payments
name: Guaranteed Service Level Payments
type: Metric
description: Within Utilities Customer Operations, Guaranteed Service Level Payments (GSLP) is used to
  gauge conformance to standards, plans, or obligations. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It is defined as Service Standard Payments Issued
  / Customers; the result is stated in ratio (x:1 or x). It should be driven down, since lower readings
  signal healthier performance. In Utilities, it is a recognized element of the standard performance toolkit.
abbreviation: GSLP
unit: ratio
