id: dea:metric-non-value-added-cost-ratio
name: Non-Value-Added Cost Ratio
type: Metric
description: Non-Value-Added Cost Ratio (NVAC) captures how efficiently resources are converted into outputs
  for organizations tracking process excellence (lean six sigma). It is defined as Non-Value-Added Cost
  / Total Process Cost; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: NVAC
unit: percent
