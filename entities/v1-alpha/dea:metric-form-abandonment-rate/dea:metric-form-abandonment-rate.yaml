id: dea:metric-form-abandonment-rate
name: Form Abandonment Rate
type: Metric
description: Form Abandonment Rate (FAR) measures exposure to adverse outcomes in the Digital Product
  & Web Operations domain. It provides the day-to-day signal that a process is running as designed. Its
  calculation is Forms Started but Not Submitted / Forms Started, measured in percent (%). It should be
  driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
abbreviation: FAR
unit: percent
