id: dea:metric-return-to-work-rate-after-long-absence
name: Return to Work Rate after Long Absence
type: Metric
description: 'Return to Work Rate after Long Absence (RTW) addresses the utilization or availability of
  capacity and is a fixture of employee wellbeing reporting. The formula is Employees Returned to Work
  / Long-Absence Cases Closed - reported in percent (%). It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: RTW
unit: percent
