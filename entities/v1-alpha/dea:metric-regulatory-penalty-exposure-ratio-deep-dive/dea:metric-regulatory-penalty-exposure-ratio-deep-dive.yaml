id: dea:metric-regulatory-penalty-exposure-ratio-deep-dive
name: Regulatory Penalty Exposure Ratio (Deep Dive)
type: Metric
description: 'A Compliance Monitoring & Testing indicator, Regulatory Penalty Exposure Ratio (Deep Dive)
  (RPER) quantifies exposure to adverse outcomes. It is computed as Penalties Paid and Accrued / Revenue,
  expressed in percent (%). It is applied across virtually every sector. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
abbreviation: RPER
unit: percent
