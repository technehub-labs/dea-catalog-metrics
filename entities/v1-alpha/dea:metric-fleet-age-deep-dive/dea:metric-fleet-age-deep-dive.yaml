id: dea:metric-fleet-age-deep-dive
name: Fleet Age (Deep Dive)
type: Metric
description: 'Fleet Age (Deep Dive) (FA-D) measures capability maturity or development in the Airline
  Operations (Deep Dive) domain. It is computed as Average Years Since Manufacture, expressed in years.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. Its use is concentrated in Airlines.'
