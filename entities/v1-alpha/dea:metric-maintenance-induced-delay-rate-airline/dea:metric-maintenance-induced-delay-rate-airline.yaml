id: dea:metric-maintenance-induced-delay-rate-airline
name: Maintenance-Induced Delay Rate (Airline)
type: Metric
description: Maintenance-Induced Delay Rate (Airline) (MIDRA) addresses exposure to adverse outcomes and
  is a fixture of airline & transportation standard measures (deep dive) reporting. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It is computed as Delays
  Attributed to Maintenance / Departure Delays, expressed in percent (%). It should be driven down, since
  lower readings signal healthier performance. Its use is concentrated in Airlines & Aviation.
abbreviation: MIDRA
unit: percent
