id: dea:metric-okr-coverage-cascading-ratio
name: OKR Coverage - Cascading Ratio
type: Metric
description: OKR Coverage - Cascading Ratio (OKRCR) measures conformance to standards, plans, or obligations
  in the Enterprise OKR & Performance Management domain. The formula is Departmental OKRs Linked to Enterprise
  Objectives / Objectives - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
