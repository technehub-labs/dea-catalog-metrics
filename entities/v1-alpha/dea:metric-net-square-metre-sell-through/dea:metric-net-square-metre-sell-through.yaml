id: dea:metric-net-square-metre-sell-through
name: Net Square Metre Sell-Through
type: Metric
description: Net Square Metre Sell-Through (NSMS) measures the economic value created or preserved in
  the Events & Exhibitions domain. The formula is Sold Exhibition Area / Sellable Area - reported in percent
  (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Higher values are better; gains are read as improvement and losses as deterioration. It is a standard
  measure in the Media & Entertainment sector.
