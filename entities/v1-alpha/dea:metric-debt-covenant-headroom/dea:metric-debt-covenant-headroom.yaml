id: dea:metric-debt-covenant-headroom
name: Debt Covenant Headroom
type: Metric
description: 'Debt Covenant Headroom (DCH-T) captures exposure to adverse outcomes for organizations tracking
  corporate treasury (deep dive). It is computed as Distance to Tightest Covenant / Covenant Level, expressed
  in percent (%). It is applied across virtually every sector. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. It should be maximized within the limits
  of cost and quality trade-offs.'
abbreviation: DCH-T
unit: percent
version: 1.1.0
