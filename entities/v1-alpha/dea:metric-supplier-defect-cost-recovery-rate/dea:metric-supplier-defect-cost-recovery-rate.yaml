id: dea:metric-supplier-defect-cost-recovery-rate
name: Supplier Defect Cost Recovery Rate
type: Metric
description: 'Supplier Defect Cost Recovery Rate (SDCRR) addresses the economic value created or preserved
  and is a fixture of strategic sourcing & supplier performance (deep dive) reporting. The formula is
  Quality Costs Recovered from Suppliers / Recoverable Costs - reported in percent (%). It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
