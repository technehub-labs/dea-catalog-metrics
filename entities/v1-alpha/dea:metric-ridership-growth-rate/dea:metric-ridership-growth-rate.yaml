id: dea:metric-ridership-growth-rate
name: Ridership Growth Rate
type: Metric
description: Within Public Transit, Ridership Growth Rate (RGR-T) is used to gauge growth over time. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. The
  formula is (Ridership_current - Ridership_prior) / Ridership_prior - reported in percent (%). Improvement
  means raising this figure toward best-in-class levels. It is a standard measure in the Public transit
  sector.
abbreviation: RGR-T
unit: percent
