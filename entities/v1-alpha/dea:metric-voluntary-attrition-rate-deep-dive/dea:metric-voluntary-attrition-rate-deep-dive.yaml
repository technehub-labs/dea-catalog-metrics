id: dea:metric-voluntary-attrition-rate-deep-dive
name: Voluntary Attrition Rate (Deep Dive)
type: Metric
description: Voluntary Attrition Rate (Deep Dive) (VARRDD) addresses the retention of customers, users,
  or assets over time and is a fixture of employee engagement & culture (deep dive) reporting. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Its
  calculation is Voluntary Leavers / Average Headcount, measured in percent (%). It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.
abbreviation: VARRDD
unit: percent
version: 1.0.0
