id: dea:metric-r-d-intensity
name: R&D Intensity
type: Metric
description: R&D Intensity (RDI) captures capability maturity or development for organizations tracking
  r&d and innovation. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is R&D Expenditure / Revenue - reported in percent (%). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
