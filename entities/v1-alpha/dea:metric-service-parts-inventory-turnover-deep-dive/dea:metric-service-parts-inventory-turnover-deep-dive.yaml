id: dea:metric-service-parts-inventory-turnover-deep-dive
name: Service Parts Inventory Turnover (Deep Dive)
type: Metric
description: Service Parts Inventory Turnover (Deep Dive) (SPIT-D) measures the utilization or availability
  of capacity in the Field Maintenance & Technical Field Service (Deep Dive) domain. Its value drives
  prioritization and resource reallocation among competing initiatives. Its calculation is Annual Parts
  Issued / Average Parts Stock, measured in times per period. Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SPIT-D
unit: times
