id: dea:metric-treatment-plan-compliance-rate-vet
name: Treatment Plan Compliance Rate (Vet)
type: Metric
description: A Veterinary & Animal Health indicator, Treatment Plan Compliance Rate (Vet) (TPCR-V) quantifies
  the quality of outputs and outcomes. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Completed Plans / Prescribed Plans, expressed in percent
  (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated in Healthcare.
