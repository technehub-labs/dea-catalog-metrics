id: dea:metric-api-mock-availability-rate
name: API Mock Availability Rate
type: Metric
description: A API Lifecycle Management indicator, API Mock Availability Rate (APIMK) quantifies how efficiently
  resources are converted into outputs. Its calculation is Endpoints with Runnable Mocks / Endpoints,
  measured in percent (%). It originates from and is most used in Software practice. It provides the day-to-day
  signal that a process is running as designed. It should be maximized within the limits of cost and quality
  trade-offs.
