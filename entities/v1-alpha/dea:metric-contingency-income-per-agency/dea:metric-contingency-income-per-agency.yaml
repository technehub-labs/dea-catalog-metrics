id: dea:metric-contingency-income-per-agency
name: Contingency Income per Agency
type: Metric
description: A Insurance Distribution & Agency Management indicator, Contingency Income per Agency (CIPA)
  quantifies the economic value created or preserved. It is computed as Profit-Sharing Earned / Appointed
  Agencies, expressed in currency value. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is managed toward a defined target band rather than an extreme -
  both overshoot and undershoot can signal problems. Its use is concentrated in Insurance.
