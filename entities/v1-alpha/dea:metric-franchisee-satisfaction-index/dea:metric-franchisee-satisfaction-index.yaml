id: dea:metric-franchisee-satisfaction-index
name: Franchisee Satisfaction Index
type: Metric
description: Franchisee Satisfaction Index (FSI) captures the engagement or satisfaction of the people
  involved for organizations tracking franchise & multi-site. It is computed as Weighted Franchisee Survey
  Score, expressed in index (0-100 or normalized). Its use is concentrated in Franchise & multi-site.
  It is reviewed at cadence by planning owners to correct course before issues become strategic. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: FSI
unit: index
