id: dea:metric-economic-occupancy-rate
name: Economic Occupancy Rate
type: Metric
description: 'Economic Occupancy Rate (EOR-E) addresses the economic value created or preserved and is
  a fixture of real estate portfolio & property management reporting. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Collected Rent /
  Gross Potential Rent, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Real Estate.'
abbreviation: EOR-E
unit: percent
