id: dea:metric-claims-cycle-time-deep-dive
name: Claims Cycle Time (Deep Dive)
type: Metric
description: Claims Cycle Time (Deep Dive) (CCT-D) captures how efficiently resources are converted into
  outputs for organizations tracking insurance claims deep dive. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Days from
  First Notification to Claim Closure, measured in days. It should be driven down, since lower readings
  signal healthier performance. It originates from and is most used in Insurance practice.
