id: dea:metric-esg-rating-score
name: ESG Rating Score
type: Metric
description: 'ESG Rating Score (ESGR) measures conformance to standards, plans, or obligations in the
  Sustainability & ESG domain. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Composite Rating from Recognized ESG Rater, expressed
  in score (points). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
