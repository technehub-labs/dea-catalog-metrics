id: dea:metric-collateral-revaluation-currency
name: Collateral Revaluation Currency
type: Metric
description: A Banking Retail Lending (Deep Dive) indicator, Collateral Revaluation Currency (CRC-B) quantifies
  conformance to standards, plans, or obligations. It is defined as Collateral Valuations within Policy
  Cycle / Portfolio; the result is stated in percent (%). Its trend is watched by senior leadership as
  an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. In Banking, it is a recognized element of the standard performance toolkit.
