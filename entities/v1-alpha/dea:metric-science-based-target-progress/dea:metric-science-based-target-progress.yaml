id: dea:metric-science-based-target-progress
name: Science-Based Target Progress
type: Metric
description: 'Science-Based Target Progress (SBTP) captures environmental and social sustainability performance
  for organizations tracking environmental, social & governance reporting. It is computed as Emissions
  Reduction Achieved / Committed Pathway, expressed in percent (%). It is applied across virtually every
  sector. It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
