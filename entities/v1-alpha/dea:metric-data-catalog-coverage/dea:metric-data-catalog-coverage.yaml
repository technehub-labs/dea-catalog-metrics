id: dea:metric-data-catalog-coverage
name: Data Catalog Coverage
type: Metric
description: Data Catalog Coverage (DCC) addresses capability maturity or development and is a fixture
  of data management & analytics reporting. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Documented Datasets / Total Datasets, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
abbreviation: DCC
unit: percent
version: 1.1.0
lifecycle_status: candidate
