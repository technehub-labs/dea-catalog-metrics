id: dea:metric-trade-allocation-error-rate
name: Trade Allocation Error Rate
type: Metric
description: 'Within Investment Research & Trading Operations, Trade Allocation Error Rate (TAER-T) is
  used to gauge the quality of outputs and outcomes. It is a working-level control: thresholds trigger
  immediate operational response. It is defined as Allocation Errors / Allocations; the result is stated
  in events per thousand or million (scaled). It should be driven down, since lower readings signal healthier
  performance. In Financial Services, it is a recognized element of the standard performance toolkit.'
