id: dea:metric-occupancy-rate-deep-dive
name: Occupancy Rate (Deep Dive)
type: Metric
description: 'Occupancy Rate (Deep Dive) (OCC-D) measures the utilization or availability of capacity
  in the Contact Center Operations (Deep Dive) domain. It is a working-level control: thresholds trigger
  immediate operational response. It is defined as Handle Time / Scheduled Time; the result is stated
  in percent (%). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: OCC-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
