id: dea:metric-uptime-percentage
name: Uptime Percentage
type: Metric
description: 'Uptime Percentage (UP) captures the quality of outputs and outcomes for organizations tracking
  it service management. It is computed as Available Time / Total Time, expressed in percent (%). It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. Higher
  values are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
abbreviation: UP
unit: percent
