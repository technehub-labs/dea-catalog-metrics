id: dea:metric-e-o-error-rate-underwriting
name: E&O Error Rate (Underwriting)
type: Metric
description: 'A Insurance Underwriting indicator, E&O Error Rate (Underwriting) (EOR-U) quantifies exposure
  to adverse outcomes. The formula is Errors and Omissions Incidents / Policies Processed - reported in
  events per thousand or million (scaled). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Lower values are better; each reduction is an improvement. It
  is a standard measure in the Insurance sector.'
