id: dea:metric-supplier-defect-rate
name: Supplier Defect Rate
type: Metric
description: 'Within Supply Chain, Supplier Defect Rate (SDR) is used to gauge the quality of outputs
  and outcomes. The formula is Defective Units from Supplier / Units Received - reported in percent (%).
  It is applied across virtually every sector. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
abbreviation: SDR
unit: percent
