id: dea:metric-maximum-tolerable-downtime-headroom
name: Maximum Tolerable Downtime Headroom
type: Metric
description: Maximum Tolerable Downtime Headroom (MTDH) addresses exposure to adverse outcomes and is
  a fixture of business continuity & disaster recovery reporting. It is defined as Demonstrated Recovery
  Time vs Maximum Tolerable Downtime; the result is stated in ratio (x:1 or x). It is applied across virtually
  every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Values outside the intended band, on either side, warrant investigation.
abbreviation: MTDH
unit: ratio
