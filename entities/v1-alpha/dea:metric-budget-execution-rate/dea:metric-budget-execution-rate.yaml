id: dea:metric-budget-execution-rate
name: Budget Execution Rate
type: Metric
description: Within Public Sector & Government, Budget Execution Rate (BER) is used to gauge conformance
  to standards, plans, or obligations. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Actual Spend / Approved Budget - reported in percent
  (%). The objective is neither maximization nor minimization but staying within an agreed operating band.
  It is a standard measure in the Public sector sector.
