id: dea:metric-training-to-serving-skew-incidents
name: Training-to-Serving Skew Incidents
type: Metric
description: 'Training-to-Serving Skew Incidents (TSSI) captures the quality of outputs and outcomes for
  organizations tracking mlops & model lifecycle operations. It is computed as Skew Incidents Requiring
  Rollback per Quarter, expressed in count (items per period). It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
