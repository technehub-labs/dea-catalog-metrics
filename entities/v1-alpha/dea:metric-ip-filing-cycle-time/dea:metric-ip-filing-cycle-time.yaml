id: dea:metric-ip-filing-cycle-time
name: IP Filing Cycle Time
type: Metric
description: Within Intellectual Property & Licensing, IP Filing Cycle Time (IPFCT) is used to gauge how
  efficiently resources are converted into outputs. Its calculation is Days from Disclosure to Filed Application,
  measured in days. Its value drives prioritization and resource reallocation among competing initiatives.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
