id: dea:metric-innovation-climate-score
name: Innovation Climate Score
type: Metric
description: Innovation Climate Score (ICS-BSC) captures the engagement or satisfaction of the people
  involved for organizations tracking balanced scorecard - learning & growth perspective. Its trend is
  watched by senior leadership as an early signal of structural performance shifts. It is defined as Survey-Based
  Innovation Culture Score; the result is stated in score (points). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: ICS-BSC
