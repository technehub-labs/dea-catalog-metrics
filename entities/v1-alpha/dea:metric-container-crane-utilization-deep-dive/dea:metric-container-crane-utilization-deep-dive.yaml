id: dea:metric-container-crane-utilization-deep-dive
name: Container Crane Utilization (Deep Dive)
type: Metric
description: Container Crane Utilization (Deep Dive) (CCU-D) addresses the utilization or availability
  of capacity and is a fixture of maritime shipping (deep dive) reporting. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Crane Working Time / Available
  Time, measured in percent (%). Improvement means raising this figure toward best-in-class levels. It
  originates from and is most used in Maritime practice.
abbreviation: CCU-D
unit: percent
