id: dea:metric-machine-vision-first-pass-inspection-rate
name: Machine Vision First-Pass Inspection Rate
type: Metric
description: A Industrial Automation & Robotics indicator, Machine Vision First-Pass Inspection Rate (MVFI)
  quantifies the quality of outputs and outcomes. Its calculation is Inspections Correctly Classified
  First Time / Inspections, measured in percent (%). It provides the day-to-day signal that a process
  is running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Manufacturing practice.
abbreviation: MVFI
unit: percent
