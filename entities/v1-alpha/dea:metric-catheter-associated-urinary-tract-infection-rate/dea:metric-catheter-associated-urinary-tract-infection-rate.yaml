id: dea:metric-catheter-associated-urinary-tract-infection-rate
name: Catheter-Associated Urinary Tract Infection Rate
type: Metric
description: 'Catheter-Associated Urinary Tract Infection Rate (CAUTI) addresses exposure to adverse outcomes
  and is a fixture of healthcare quality & patient safety standard measures reporting. It is computed
  as CAUTI Events / 1,000 Catheter Days, expressed in events per thousand or million (scaled). Its use
  is concentrated in Healthcare. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Reduction is the goal, and sustained decreases indicate successful intervention.'
