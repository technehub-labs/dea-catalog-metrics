id: dea:metric-corrective-and-preventive-action-closure-rate
name: Corrective and Preventive Action Closure Rate
type: Metric
description: Within Medical Devices, Corrective and Preventive Action Closure Rate (CAPA) is used to gauge
  conformance to standards, plans, or obligations. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as CAPAs Closed on Time / CAPAs Opened, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Medical devices.
