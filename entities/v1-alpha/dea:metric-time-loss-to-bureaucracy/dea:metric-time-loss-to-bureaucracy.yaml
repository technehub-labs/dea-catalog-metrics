id: dea:metric-time-loss-to-bureaucracy
name: Time Loss to Bureaucracy
type: Metric
description: Time Loss to Bureaucracy (TLB) measures how efficiently resources are converted into outputs
  in the Culture & Employee Experience domain. The formula is Hours Spent on Approvals and Coordination
  per Employee per Week - reported in hours. It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction is the
  goal, and sustained decreases indicate successful intervention.
