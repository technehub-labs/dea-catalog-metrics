id: dea:metric-maverick-spend-rate
name: Maverick Spend Rate
type: Metric
description: Maverick Spend Rate (MSR-P) measures conformance to standards, plans, or obligations in the
  Procurement domain. It is defined as Off-Contract Spend / Total Spend; the result is stated in percent
  (%). It is applied across virtually every sector. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: MSR-P
unit: percent
