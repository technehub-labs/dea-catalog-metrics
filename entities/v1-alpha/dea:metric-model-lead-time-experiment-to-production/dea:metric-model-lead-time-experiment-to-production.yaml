id: dea:metric-model-lead-time-experiment-to-production
name: Model Lead Time - Experiment to Production
type: Metric
description: Model Lead Time - Experiment to Production (MLTEP) measures how efficiently resources are
  converted into outputs in the MLOps & Model Lifecycle Operations domain. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Days from Candidate
  Model to Production Deployment; the result is stated in days. It should be driven down, since lower
  readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
