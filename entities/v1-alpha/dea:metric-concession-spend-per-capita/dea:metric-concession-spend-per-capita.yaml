id: dea:metric-concession-spend-per-capita
name: Concession Spend per Capita
type: Metric
description: Within Sports & Events, Concession Spend per Capita (CSPC) is used to gauge the economic
  value created or preserved. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is Concession Revenue / Attendance, measured in currency per unit. Improvement
  means raising this figure toward best-in-class levels. It originates from and is most used in Sports
  & events practice.
abbreviation: CSPC
unit: currency
