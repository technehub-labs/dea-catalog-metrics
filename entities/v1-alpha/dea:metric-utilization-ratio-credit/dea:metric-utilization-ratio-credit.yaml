id: dea:metric-utilization-ratio-credit
name: Utilization Ratio (Credit)
type: Metric
description: 'Within Credit & Collections Risk (Enterprise), Utilization Ratio (Credit) (URC-CC) is used
  to gauge exposure to adverse outcomes. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Drawn Balance / Approved Limit - reported in percent (%). The
  objective is neither maximization nor minimization but staying within an agreed operating band. Practitioners
  in nearly any industry can adopt it directly.'
