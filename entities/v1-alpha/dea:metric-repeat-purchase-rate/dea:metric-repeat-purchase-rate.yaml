id: dea:metric-repeat-purchase-rate
name: Repeat Purchase Rate
type: Metric
description: Repeat Purchase Rate (RPR) measures the retention of customers, users, or assets over time
  in the Customer domain. It is computed as Customers with >1 Purchase / Total Customers, expressed in
  percent (%). It is reviewed at cadence by planning owners to correct course before issues become strategic.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: RPR
unit: percent
version: 1.0.0
