id: dea:metric-fleet-downtime-percentage
name: Fleet Downtime Percentage
type: Metric
description: Fleet Downtime Percentage (FDP) addresses the utilization or availability of capacity and
  is a fixture of logistics & transportation reporting. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Vehicle Downtime Days / Fleet Available Days, measured
  in percent (%). It should be driven down, since lower readings signal healthier performance. It originates
  from and is most used in Logistics practice.
abbreviation: FDP
unit: percent
