id: dea:metric-asset-downtime-cost-per-incident
name: Asset Downtime Cost per Incident
type: Metric
description: Asset Downtime Cost per Incident (ADCI) measures exposure to adverse outcomes in the Field
  Service & Asset Performance domain. The formula is Total Downtime Cost / Downtime Incidents - reported
  in currency per unit. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
