name: Paint Shop First-Pass Rate (Deep Dive)
type: Metric
description: 'Paint Shop First-Pass Rate (Deep Dive) (PSFP-D) addresses the quality of outputs and outcomes
  and is a fixture of automotive manufacturing (deep dive) reporting. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Bodies Passing Paint Inspection
  / Bodies - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  It is a standard measure in the Automotive sector.'
