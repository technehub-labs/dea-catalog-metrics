id: dea:metric-prompt-injection-block-rate
name: Prompt Injection Block Rate
type: Metric
description: Prompt Injection Block Rate (PIBR) measures exposure to adverse outcomes in the Generative
  AI & LLM Operations domain. It is defined as Malicious Prompts Blocked by Guardrails / Malicious Prompts
  Detected; the result is stated in percent (%). It is applied across virtually every sector. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. It should be maximized
  within the limits of cost and quality trade-offs.
