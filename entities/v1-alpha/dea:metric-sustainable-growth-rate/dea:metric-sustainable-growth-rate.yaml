id: dea:metric-sustainable-growth-rate
name: Sustainable Growth Rate
type: Metric
description: 'Sustainable Growth Rate (SGR-VCF) addresses growth over time and is a fixture of valuation
  & corporate finance standard measures reporting. It is computed as ROE x Retention Ratio, expressed
  in percent (%). It is applied across virtually every sector. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. Values outside the intended band, on
  either side, warrant investigation.'
