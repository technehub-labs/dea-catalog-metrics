id: dea:metric-board-reporting-cadence-compliance
name: Board Reporting Cadence Compliance
type: Metric
description: Board Reporting Cadence Compliance (BRCC-S) measures governance in the Startup & Venture-Backed
  Business domain. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is computed as Board Packs Delivered on Schedule / Board Cycles, expressed in percent
  (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
