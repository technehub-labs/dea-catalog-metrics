id: dea:metric-certificate-of-analysis-turnaround
name: Certificate of Analysis Turnaround
type: Metric
description: A Chemicals & Specialty Materials indicator, Certificate of Analysis Turnaround (COAT) quantifies
  how efficiently resources are converted into outputs. It is computed as Hours from Batch Completion
  to Issued CoA, expressed in hours. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Chemicals.
