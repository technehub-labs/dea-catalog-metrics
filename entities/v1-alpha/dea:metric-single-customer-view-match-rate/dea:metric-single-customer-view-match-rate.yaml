id: dea:metric-single-customer-view-match-rate
name: Single Customer View Match Rate
type: Metric
description: Within Customer Analytics & Insights, Single Customer View Match Rate (SCVM) is used to gauge
  the quality of outputs and outcomes. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Profiles Matched across Sources / Profiles Processed;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
