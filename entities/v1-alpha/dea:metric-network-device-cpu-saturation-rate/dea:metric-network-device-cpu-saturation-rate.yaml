id: dea:metric-network-device-cpu-saturation-rate
name: Network Device CPU Saturation Rate
type: Metric
description: Network Device CPU Saturation Rate (NDCPU) captures the utilization or availability of capacity
  for organizations tracking network performance & capacity. It is computed as Devices above CPU Threshold
  / Devices, expressed in percent (%). It is applied across virtually every sector. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. Reduction is the goal,
  and sustained decreases indicate successful intervention.
