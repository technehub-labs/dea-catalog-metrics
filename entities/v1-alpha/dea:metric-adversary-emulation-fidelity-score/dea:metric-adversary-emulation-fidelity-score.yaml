id: dea:metric-adversary-emulation-fidelity-score
name: Adversary Emulation Fidelity Score
type: Metric
description: A Threat Intelligence & Red Team indicator, Adversary Emulation Fidelity Score (AEFS) quantifies
  the quality of outputs and outcomes. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Exercise Fidelity to Real Adversary TTPs per Rubric, measured
  in score (points). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
