id: dea:metric-order-accuracy-restaurants
name: Order Accuracy (Restaurants)
type: Metric
description: Order Accuracy (Restaurants) (OAR) addresses the quality of outputs and outcomes and is a
  fixture of restaurants reporting. It is computed as Orders Delivered as Placed / Orders, expressed in
  percent (%). Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Restaurants.
