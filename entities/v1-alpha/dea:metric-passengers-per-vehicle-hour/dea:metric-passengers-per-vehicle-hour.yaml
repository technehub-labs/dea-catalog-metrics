id: dea:metric-passengers-per-vehicle-hour
name: Passengers per Vehicle Hour
type: Metric
description: 'Passengers per Vehicle Hour (PPVH) measures how efficiently resources are converted into
  outputs in the Public Transit domain. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Boardings / Vehicle Revenue Hours, expressed
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Public transit.'
