id: dea:metric-model-specificity
name: Model Specificity
type: Metric
description: Model Specificity (MSPEC) addresses the quality of outputs and outcomes and is a fixture
  of statistical model performance diagnostics reporting. It provides the day-to-day signal that a process
  is running as designed. Its calculation is True Negatives / (True Negatives + False Positives), measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. It originates from
  and is most used in Software practice.
abbreviation: MSPEC
unit: percent
