id: dea:metric-expansion-revenue-rate-deep-dive
name: Expansion Revenue Rate (Deep Dive)
type: Metric
description: 'A Unit Economics & Growth (Deep Dive) indicator, Expansion Revenue Rate (Deep Dive) (EXPRD)
  quantifies growth over time. It is computed as Expansion MRR / Total Prior MRR, expressed in percent
  (%). It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is concentrated
  in Software.'
