id: dea:metric-co-innovation-output-rate
name: Co-Innovation Output Rate
type: Metric
description: Co-Innovation Output Rate (CIOR) addresses growth over time and is a fixture of alliances
  & partnerships management reporting. Its calculation is Jointly Launched Innovations per Year, measured
  in count (items per period). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: CIOR
