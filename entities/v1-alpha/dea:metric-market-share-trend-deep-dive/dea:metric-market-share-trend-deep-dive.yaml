id: dea:metric-market-share-trend-deep-dive
name: Market Share Trend (Deep Dive)
type: Metric
description: Market Share Trend (Deep Dive) (MST-D) captures growth over time for organizations tracking
  balanced scorecard - customer perspective. Its calculation is Change in Market Share between Periods,
  measured in percent (%). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: MST-D
unit: percent
