id: dea:metric-allergen-control-compliance
name: Allergen Control Compliance
type: Metric
description: Allergen Control Compliance (ACC) measures exposure to adverse outcomes in the Food & Beverage
  Manufacturing domain. It is defined as Allergen Control Checks Passed / Checks; the result is stated
  in percent (%). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Higher values are better; gains are read as improvement and losses as deterioration. In Food
  & Beverage, it is a recognized element of the standard performance toolkit.
