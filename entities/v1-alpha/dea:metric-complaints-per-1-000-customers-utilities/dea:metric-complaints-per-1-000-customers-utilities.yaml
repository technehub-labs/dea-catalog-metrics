id: dea:metric-complaints-per-1-000-customers-utilities
name: Complaints per 1,000 Customers (Utilities)
type: Metric
description: 'Complaints per 1,000 Customers (Utilities) (CPCU) measures the quality of outputs and outcomes
  in the Utilities Customer Operations domain. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Complaints / Customers x 1,000, expressed
  in events per thousand or million (scaled). It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Utilities.'
