id: dea:metric-employee-experience-score-by-journey
name: Employee Experience Score by Journey
type: Metric
description: Employee Experience Score by Journey (EXJB) addresses the engagement or satisfaction of the
  people involved and is a fixture of culture & employee experience reporting. Its calculation is Average
  Satisfaction across Key Employee Journey Moments, measured in score (points). It is applied across virtually
  every sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
