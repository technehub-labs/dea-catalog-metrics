id: dea:metric-revenue-per-consultant
name: Revenue per Consultant
type: Metric
description: 'Revenue per Consultant (RPC) captures how efficiently resources are converted into outputs
  for organizations tracking professional services. It is computed as Fee Revenue / Consultant FTEs, expressed
  in currency value. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Professional services.'
