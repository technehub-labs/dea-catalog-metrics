id: dea:metric-mean-time-to-repair
name: Mean Time to Repair
type: Metric
description: A Maintenance & Reliability indicator, Mean Time to Repair (MTTR-M) quantifies how efficiently
  resources are converted into outputs. It is computed as Total Repair Time / Number of Repairs, expressed
  in hours. Its use is concentrated in Manufacturing. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: MTTR-M
unit: hour
