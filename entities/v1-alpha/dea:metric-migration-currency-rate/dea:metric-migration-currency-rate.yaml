id: dea:metric-migration-currency-rate
name: Migration Currency Rate
type: Metric
description: A Records & Information Management indicator, Migration Currency Rate (MCRR) quantifies the
  quality of outputs and outcomes. Its calculation is Record Formats Migrated from Obsolete Formats /
  Obsolete Formats Identified, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: MCRR
unit: percent
version: 1.1.0
