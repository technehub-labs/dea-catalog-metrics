id: dea:metric-hospital-acquired-infection-rate
name: Hospital-Acquired Infection Rate
type: Metric
description: A Healthcare indicator, Hospital-Acquired Infection Rate (HAIR) quantifies exposure to adverse
  outcomes. It is defined as Healthcare-Associated Infections / Patient Days x 1,000; the result is stated
  in events per thousand or million (scaled). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Lower values are better; each reduction is an improvement. In Healthcare,
  it is a recognized element of the standard performance toolkit.
