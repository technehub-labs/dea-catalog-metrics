id: dea:metric-vehicle-utilization
name: Vehicle Utilization
type: Metric
description: Vehicle Utilization (VUT) measures the utilization or availability of capacity in the Logistics
  & Transportation domain. It is computed as Vehicle Hours in Use / Vehicle Hours Available, expressed
  in percent (%). Its use is concentrated in Logistics. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It should be maximized within the limits of cost and
  quality trade-offs.
abbreviation: VUT
unit: percent
