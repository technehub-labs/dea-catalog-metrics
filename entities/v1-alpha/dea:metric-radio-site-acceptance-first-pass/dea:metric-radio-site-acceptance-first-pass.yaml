id: dea:metric-radio-site-acceptance-first-pass
name: Radio Site Acceptance First Pass
type: Metric
description: Radio Site Acceptance First Pass (RSAF) addresses the quality of outputs and outcomes and
  is a fixture of telecom field & installation reporting. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Sites Accepted on First Inspection
  / Sites Inspected, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Telecommunications.
abbreviation: RSAF
unit: percent
