id: dea:metric-port-berth-productivity-moves-per-hour-deep-dive
name: Port Berth Productivity - Moves per Hour (Deep Dive)
type: Metric
description: Port Berth Productivity - Moves per Hour (Deep Dive) (PBPH-D) measures how efficiently resources
  are converted into outputs in the Maritime Shipping (Deep Dive) domain. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Container Moves
  / Berth Hour - reported in count (items per period). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Maritime sector.
