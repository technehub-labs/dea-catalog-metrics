id: dea:metric-review-turnaround-time
name: Review Turnaround Time
type: Metric
description: 'Review Turnaround Time (RTT-PR) measures how efficiently resources are converted into outputs
  in the Code Review & Peer Quality domain. The formula is Hours from Review Request to First Response
  - reported in hours. It is a standard measure in the Software sector. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
