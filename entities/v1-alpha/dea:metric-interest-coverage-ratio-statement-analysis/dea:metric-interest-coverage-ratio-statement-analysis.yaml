id: dea:metric-interest-coverage-ratio-statement-analysis
name: Interest Coverage Ratio (Statement Analysis)
type: Metric
description: A Financial Statement Analysis Ratios (Deep Dive) indicator, Interest Coverage Ratio (Statement
  Analysis) (ICRDD) quantifies exposure to adverse outcomes. The formula is EBIT / Interest Expense -
  reported in ratio (x:1 or x). It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
