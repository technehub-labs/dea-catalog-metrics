id: dea:metric-post-incident-review-action-closure-rate
name: Post-Incident Review Action Closure Rate
type: Metric
description: Post-Incident Review Action Closure Rate (PIRACR) measures conformance to standards, plans,
  or obligations in the Observability & Site Reliability Engineering domain. It is defined as SRE Action
  Items Closed by Due Date / Items; the result is stated in percent (%). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
