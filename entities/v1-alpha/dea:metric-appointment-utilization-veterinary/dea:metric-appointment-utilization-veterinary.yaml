id: dea:metric-appointment-utilization-veterinary
name: Appointment Utilization (Veterinary)
type: Metric
description: 'A Veterinary & Animal Health indicator, Appointment Utilization (Veterinary) (AUV) quantifies
  the utilization or availability of capacity. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Booked Slots / Available Slots - reported in percent
  (%). Improvement means raising this figure toward best-in-class levels. It is a standard measure in
  the Healthcare sector.'
