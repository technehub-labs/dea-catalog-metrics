id: dea:metric-public-procurement-award-cycle-time
name: Public Procurement Award Cycle Time
type: Metric
description: Public Procurement Award Cycle Time (PPIACT) captures how efficiently resources are converted
  into outputs for organizations tracking public sector & citizen service standard measures (deep dive).
  Its calculation is Days from Solicitation to Contract Award, measured in days. Its value drives prioritization
  and resource reallocation among competing initiatives. Lower values are better; each reduction is an
  improvement. It originates from and is most used in Public sector practice.
