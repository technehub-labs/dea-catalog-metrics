id: dea:metric-mean-time-to-provision-resource
name: Mean Time to Provision Resource
type: Metric
description: A Data Center & Cloud Operations indicator, Mean Time to Provision Resource (MTTP) quantifies
  how efficiently resources are converted into outputs. It is computed as Hours from Request to Provisioned
  Resource, expressed in hours. Its use is concentrated in Technology & data centers. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. Reduction is the goal,
  and sustained decreases indicate successful intervention.
