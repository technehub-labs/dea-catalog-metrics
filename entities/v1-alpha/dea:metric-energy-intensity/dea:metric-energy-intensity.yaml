id: dea:metric-energy-intensity
name: Energy Intensity
type: Metric
description: 'Energy Intensity (EI) captures environmental and social sustainability performance for organizations
  tracking sustainability & esg. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. The formula is Energy Consumed / Unit of Output or Revenue - reported
  in ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
