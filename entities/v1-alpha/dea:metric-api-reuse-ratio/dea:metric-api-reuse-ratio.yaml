id: dea:metric-api-reuse-ratio
name: API Reuse Ratio
type: Metric
description: API Reuse Ratio (APIRU) addresses how efficiently resources are converted into outputs and
  is a fixture of api lifecycle management reporting. Its calculation is Services Reusing Existing APIs
  / New Integrations, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Software practice.
abbreviation: APIRU
unit: percent
