id: dea:metric-fare-evasion-rate-deep-dive
name: Fare Evasion Rate (Deep Dive)
type: Metric
description: 'Within Public Transit (Deep Dive), Fare Evasion Rate (Deep Dive) (FER-D) is used to gauge
  the economic value created or preserved. It is computed as Unpaid Journeys / Total Journeys, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Lower values are better; each reduction is an improvement. Its use is concentrated in
  Public Transit.'
abbreviation: FER-D
unit: percent
