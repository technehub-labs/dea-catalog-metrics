id: dea:metric-physician-productivity
name: Physician Productivity
type: Metric
description: Within Healthcare, Physician Productivity (PP) is used to gauge how efficiently resources
  are converted into outputs. It is defined as Relative Value Units Generated per Physician; the result
  is stated in ratio (x:1 or x). In Healthcare, it is a recognized element of the standard performance
  toolkit. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
