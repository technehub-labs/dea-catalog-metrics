id: dea:metric-digital-learning-platform-engagement
name: Digital Learning Platform Engagement
type: Metric
description: Digital Learning Platform Engagement (DLPE) captures the engagement or satisfaction of the
  people involved for organizations tracking education & training outcome standard measures. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. It is computed as Active
  Learners on Platform / Enrolled Students, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Its use is concentrated in Education.
abbreviation: DLPE
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
