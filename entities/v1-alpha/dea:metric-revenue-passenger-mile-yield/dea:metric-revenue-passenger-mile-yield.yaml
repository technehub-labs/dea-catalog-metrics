id: dea:metric-revenue-passenger-mile-yield
name: Revenue Passenger Mile Yield
type: Metric
description: Revenue Passenger Mile Yield (RPMY) addresses the economic value created or preserved and
  is a fixture of airline & transportation standard measures (deep dive) reporting. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Passenger
  Revenue / Revenue Passenger Miles; the result is stated in currency per unit. Improvement means raising
  this figure toward best-in-class levels. In Airlines & Aviation, it is a recognized element of the standard
  performance toolkit.
abbreviation: RPMY
unit: currency
