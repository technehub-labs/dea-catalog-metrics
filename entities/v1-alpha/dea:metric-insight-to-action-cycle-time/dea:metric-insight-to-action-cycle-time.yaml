id: dea:metric-insight-to-action-cycle-time
name: Insight-to-Action Cycle Time
type: Metric
description: Insight-to-Action Cycle Time (I2ACT) captures how effectively a process or entity achieves
  its intended outcome for organizations tracking data science & analytics operations. It is defined as
  Days from Insight Delivered to Action Taken; the result is stated in days. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: I2ACT
unit: day
