id: dea:metric-journal-entry-control-exception-rate
name: Journal Entry Control Exception Rate
type: Metric
description: 'Journal Entry Control Exception Rate (JECE) captures exposure to adverse outcomes for organizations
  tracking internal controls & financial reporting integrity. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. The formula is Manual Journal Entries Breaching Control
  / Manual Entries - reported in events per thousand or million (scaled). It should be driven down, since
  lower readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
