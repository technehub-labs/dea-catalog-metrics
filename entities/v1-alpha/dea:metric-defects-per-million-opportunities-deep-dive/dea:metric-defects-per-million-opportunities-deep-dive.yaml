id: dea:metric-defects-per-million-opportunities-deep-dive
name: Defects per Million Opportunities (Deep Dive)
type: Metric
description: A Process Capability & Six Sigma (Deep Dive) indicator, Defects per Million Opportunities
  (Deep Dive) (DPMOD) quantifies the quality of outputs and outcomes. It provides the day-to-day signal
  that a process is running as designed. Its calculation is Defects / (Units x Opportunities) x 1,000,000,
  measured in events per thousand or million (scaled). It should be driven down, since lower readings
  signal healthier performance. It originates from and is most used in Manufacturing practice.
abbreviation: DPMOD
