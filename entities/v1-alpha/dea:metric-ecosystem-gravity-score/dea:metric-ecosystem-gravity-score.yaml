id: dea:metric-ecosystem-gravity-score
name: Ecosystem Gravity Score
type: Metric
description: Ecosystem Gravity Score (ECGS) captures capability maturity or development for organizations
  tracking market structure & economics standard measures. It is defined as Attractiveness of Market Position
  to Complementary Players; the result is stated in score (points). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
