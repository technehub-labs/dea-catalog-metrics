id: dea:metric-emergency-change-rate
name: Emergency Change Rate
type: Metric
description: A IT Service Management indicator, Emergency Change Rate (ECR-T) quantifies exposure to adverse
  outcomes. Its calculation is Emergency Changes / Total Changes, measured in percent (%). Its value drives
  prioritization and resource reallocation among competing initiatives. Lower values are better; each
  reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: ECR-T
unit: percent
