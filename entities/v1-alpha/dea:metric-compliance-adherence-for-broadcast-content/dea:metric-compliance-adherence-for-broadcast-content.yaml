id: dea:metric-compliance-adherence-for-broadcast-content
name: Compliance Adherence for Broadcast Content
type: Metric
description: Compliance Adherence for Broadcast Content (CABC) measures conformance to standards, plans,
  or obligations in the Broadcasting & Streaming Media domain. The formula is Items Meeting Regulatory
  Code / Items Aired - reported in percent (%). It is a standard measure in the Media & Entertainment
  sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
