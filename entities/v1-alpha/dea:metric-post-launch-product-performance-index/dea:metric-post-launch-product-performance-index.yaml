id: dea:metric-post-launch-product-performance-index
name: Post-Launch Product Performance Index
type: Metric
description: A R&D and Innovation indicator, Post-Launch Product Performance Index (PPPI) quantifies the
  economic value created or preserved. Its calculation is Weighted Index of Sales, Quality, Margin vs
  Targets, measured in index (0-100 or normalized). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
