id: dea:metric-maintenance-cost-per-asset
name: Maintenance Cost per Asset
type: Metric
description: 'Within Maintenance & Reliability, Maintenance Cost per Asset (MCA) is used to gauge how
  efficiently resources are converted into outputs. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Total Maintenance Cost / Assets
  in Service - reported in currency per unit. It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Manufacturing sector.'
