id: dea:metric-audit-finding-acceptance-rate
name: Audit Finding Acceptance Rate
type: Metric
description: Audit Finding Acceptance Rate (AFAR) addresses the quality of outputs and outcomes and is
  a fixture of internal audit reporting. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Findings Accepted by Management / Findings Raised, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: AFAR
unit: percent
