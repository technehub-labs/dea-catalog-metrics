id: dea:metric-collection-loan-turnover
name: Collection Loan Turnover
type: Metric
description: 'Collection Loan Turnover (CLT-A) addresses the economic value created or preserved and is
  a fixture of arts & culture reporting. The formula is Works Loaned / Works in Collection per Period
  - reported in ratio (x:1 or x). It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. Higher values are better; gains are read as improvement and losses
  as deterioration. It is a standard measure in the Arts & culture sector.'
