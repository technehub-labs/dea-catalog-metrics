id: dea:metric-dast-coverage-of-attack-surface
name: DAST Coverage of Attack Surface
type: Metric
description: A DevSecOps & Application Security Engineering indicator, DAST Coverage of Attack Surface
  (DASC-DV) quantifies exposure to adverse outcomes. It is defined as Applications Scanned Dynamically
  / Applications in Production; the result is stated in percent (%). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
