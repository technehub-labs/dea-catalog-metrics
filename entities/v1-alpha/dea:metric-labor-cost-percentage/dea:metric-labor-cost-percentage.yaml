id: dea:metric-labor-cost-percentage
name: Labor Cost Percentage
type: Metric
description: Labor Cost Percentage (LCP) addresses how efficiently resources are converted into outputs
  and is a fixture of standard workforce & pay metrics reporting. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Total Labor
  Cost / Revenue, measured in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: LCP
unit: percent
