id: dea:metric-energy-per-tonne-milled-deep-dive
name: Energy per Tonne Milled (Deep Dive)
type: Metric
description: Energy per Tonne Milled (Deep Dive) (ETM-D) measures environmental and social sustainability
  performance in the Metals & Mining Operations (Deep Dive) domain. Its calculation is Energy Consumed
  / Tonnes Milled, measured in ratio (x:1 or x). Its value drives prioritization and resource reallocation
  among competing initiatives. Lower values are better; each reduction is an improvement. It originates
  from and is most used in Metals & Mining practice.
