id: dea:metric-net-zero-trajectory-compliance
name: Net Zero Trajectory Compliance
type: Metric
description: Within Sustainability & ESG, Net Zero Trajectory Compliance (NZTC) is used to gauge conformance
  to standards, plans, or obligations. The formula is Actual Emissions / Science-Based Target Pathway
  - reported in ratio (x:1 or x). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: NZTC
