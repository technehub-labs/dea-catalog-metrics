id: dea:metric-new-franchise-ramp-time-deep-dive
name: New Franchise Ramp Time (Deep Dive)
type: Metric
description: Within Franchise Operations (Deep Dive), New Franchise Ramp Time (Deep Dive) (NFRM-D) is
  used to gauge how efficiently resources are converted into outputs. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Months
  from Opening to Breakeven, measured in months. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: NFRM-D
