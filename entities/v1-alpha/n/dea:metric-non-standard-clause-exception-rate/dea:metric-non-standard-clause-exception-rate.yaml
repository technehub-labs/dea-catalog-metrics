source_credit: Public domain - no attribution required
calculation_definition: Clause Deviations Approved / Contracts
formula_definition:
  formula_id: dea:formula-non-standard-clause-exception-rate
  expression: NSCER = Clause Deviations Approved / Contracts
  inputs:
  - name: Clause Deviations Approved
  - name: Contracts
