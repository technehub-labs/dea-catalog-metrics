id: dea:metric-non-standard-clause-exception-rate
name: Non-Standard Clause Exception Rate
type: Metric
description: 'Non-Standard Clause Exception Rate (NSCER) captures exposure to adverse outcomes for organizations
  tracking contract lifecycle management. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is Clause Deviations Approved / Contracts - reported
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: NSCER
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
- risk
scope_classification:
- organizational_unit
directionality: lower_is_better
management_significance:
