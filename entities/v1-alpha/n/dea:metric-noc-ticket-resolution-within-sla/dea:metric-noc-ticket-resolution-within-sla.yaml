id: dea:metric-noc-ticket-resolution-within-sla
name: NOC Ticket Resolution within SLA
type: Metric
description: A Network Operations Center (Deep Dive) indicator, NOC Ticket Resolution within SLA (NCTRS)
  quantifies conformance to standards, plans, or obligations. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Its calculation is Tickets Resolved
  within SLA / Tickets, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
