id: dea:metric-net-effective-rent-ratio
name: Net Effective Rent Ratio
type: Metric
description: Net Effective Rent Ratio (NERR) addresses the economic value created or preserved and is
  a fixture of real estate & mortgage standard measures reporting. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Net Effective Rent after Concessions
  / Face Rent; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Real estate, it is a recognized element of the standard performance toolkit.
abbreviation: NERR
unit: percent
