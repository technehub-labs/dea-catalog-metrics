id: dea:metric-net-member-growth
name: Net Member Growth
type: Metric
description: 'A Fitness & Wellness indicator, Net Member Growth (NMG) quantifies growth over time. It
  is computed as New Members - Cancelled Members per Period, expressed in count (items per period). Its
  use is concentrated in Fitness & wellness. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It should be maximized within the limits of cost and quality
  trade-offs.'
abbreviation: NMG
unit: count
version: 1.1.0
