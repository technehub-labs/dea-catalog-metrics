id: dea:metric-noc-customer-notification-timeliness
name: NOC Customer Notification Timeliness
type: Metric
description: NOC Customer Notification Timeliness (NCNT) measures the quality of outputs and outcomes
  in the Network Operations Center (Deep Dive) domain. It is computed as Outage Notifications Sent within
  Commitment / Outages, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: NCNT
unit: percent
