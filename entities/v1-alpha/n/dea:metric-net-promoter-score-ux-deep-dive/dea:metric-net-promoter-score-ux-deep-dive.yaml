id: dea:metric-net-promoter-score-ux-deep-dive
name: Net Promoter Score (UX) - Deep Dive
type: Metric
description: Net Promoter Score (UX) - Deep Dive (NPSUXD) addresses the economic value created or preserved
  and is a fixture of ux & design systems reporting. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Promoters minus Detractors among Product Users;
  the result is stated in score (points). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: NPSUXD
