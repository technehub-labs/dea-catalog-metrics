id: dea:metric-noc-mean-time-to-acknowledge
name: NOC Mean Time to Acknowledge
type: Metric
description: NOC Mean Time to Acknowledge (NOMTA) measures how efficiently resources are converted into
  outputs in the Network Operations Center (Deep Dive) domain. Its calculation is Minutes from Alert to
  NOC Acknowledgment, measured in minutes. It provides the day-to-day signal that a process is running
  as designed. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: NOMTA
unit: minute
