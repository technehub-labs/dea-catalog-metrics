id: dea:metric-noise-complaint-rate-airports
name: Noise Complaint Rate (Airports)
type: Metric
description: Noise Complaint Rate (Airports) (NCR-A) measures the engagement or satisfaction of the people
  involved in the Airport Operations (Deep Dive) domain. It is computed as Complaints per 1,000 Aircraft
  Movements, expressed in events per thousand or million (scaled). Its use is concentrated in Aviation.
  It is reviewed at cadence by planning owners to correct course before issues become strategic. Reduction
  is the goal, and sustained decreases indicate successful intervention.
