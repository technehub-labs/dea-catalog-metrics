id: dea:metric-noc-mean-time-to-resolve
name: NOC Mean Time to Resolve
type: Metric
description: NOC Mean Time to Resolve (NOMTR) addresses how efficiently resources are converted into outputs
  and is a fixture of network operations center (deep dive) reporting. Its calculation is Hours from Acknowledgment
  to Resolution, measured in hours. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Lower values are better; each reduction is an improvement. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: NOMTR
