id: dea:metric-new-product-ramp-yield
name: New Product Ramp Yield
type: Metric
description: New Product Ramp Yield (NPRY) captures how effectively a process or entity achieves its intended
  outcome for organizations tracking semiconductor & electronics. It is defined as Yield at Ramp Milestone
  / Target Yield; the result is stated in percent (%). In Electronics & semiconductors, it is a recognized
  element of the standard performance toolkit. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: NPRY
unit: percent
