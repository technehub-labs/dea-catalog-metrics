id: dea:metric-network-velocity-deep-dive
name: Network Velocity (Deep Dive)
type: Metric
description: Network Velocity (Deep Dive) (NVD) addresses how efficiently resources are converted into
  outputs and is a fixture of rail freight (deep dive) reporting. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Kilometres per Wagon Day; the
  result is stated in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels.
  In Rail, it is a recognized element of the standard performance toolkit.
abbreviation: NVD
unit: ratio
