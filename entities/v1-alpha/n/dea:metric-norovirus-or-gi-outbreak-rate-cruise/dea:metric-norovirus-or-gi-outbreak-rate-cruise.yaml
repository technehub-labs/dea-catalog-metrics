id: dea:metric-norovirus-or-gi-outbreak-rate-cruise
name: Norovirus or GI Outbreak Rate (Cruise)
type: Metric
description: Norovirus or GI Outbreak Rate (Cruise) (GIOR) captures exposure to adverse outcomes for organizations
  tracking cruise & passenger shipping. The formula is Outbreak Voyages / Voyages - reported in events
  per thousand or million (scaled). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Lower values are better; each reduction is an improvement. It is a standard
  measure in the Hospitality sector.
