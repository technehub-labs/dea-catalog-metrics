id: dea:metric-new-location-ramp-time
name: New Location Ramp Time
type: Metric
description: New Location Ramp Time (NLRT) measures how efficiently resources are converted into outputs
  in the Franchise & Multi-site domain. It is defined as Months from Opening to Break-even Sales; the
  result is stated in days. In Franchise & multi-site, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: NLRT
unit: day
