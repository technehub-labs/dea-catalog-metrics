id: dea:metric-customer-traffic-conversion-correlation-index
name: Customer Traffic Conversion Correlation Index
type: Metric
description: 'Customer Traffic Conversion Correlation Index (CTCCI) captures the quality of outputs and
  outcomes for organizations tracking retail standard measures. The formula is Strength of Traffic-to-Sales
  Relationship across Stores - reported in index (0-100 or normalized). It is a standard measure in the
  Retail & E-commerce sector. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. It should be maximized within the limits of cost and quality trade-offs.'
