id: dea:metric-out-of-spec-rate
name: Out-of-Spec Rate
type: Metric
description: Out-of-Spec Rate (OSPR) measures the quality of outputs and outcomes in the Process Capability
  & Six Sigma (Deep Dive) domain. It is computed as Units Outside Specification / Units Produced, expressed
  in percent (%). Its use is concentrated in Manufacturing. Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: OSPR
unit: percent
