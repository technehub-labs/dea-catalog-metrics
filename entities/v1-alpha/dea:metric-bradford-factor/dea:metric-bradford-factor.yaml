id: dea:metric-bradford-factor
name: Bradford Factor
type: Metric
description: Within Standard Workforce & Pay Metrics, Bradford Factor (BRADF) is used to gauge exposure
  to adverse outcomes. It provides the day-to-day signal that a process is running as designed. Its calculation
  is S^2 x D (Frequency Squared x Days of Absence), measured in score (points). It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.
abbreviation: BRADF
unit: score
