id: dea:metric-r-d-pipeline-success-rate
name: R&D Pipeline Success Rate
type: Metric
description: Within Pharmaceuticals & Life Sciences, R&D Pipeline Success Rate (RPSR) is used to gauge
  how effectively a process or entity achieves its intended outcome. The formula is Candidates Passing
  Stage / Candidates Entering Stage - reported in percent (%). It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Higher values are better; gains are read as
  improvement and losses as deterioration. It is a standard measure in the Pharmaceuticals sector.
abbreviation: RPSR
