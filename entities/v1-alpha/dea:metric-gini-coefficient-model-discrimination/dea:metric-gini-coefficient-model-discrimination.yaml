id: dea:metric-gini-coefficient-model-discrimination
name: Gini Coefficient (Model Discrimination)
type: Metric
description: Within Statistical Model Performance Diagnostics, Gini Coefficient (Model Discrimination)
  (GINIM) is used to gauge the quality of outputs and outcomes. Its calculation is 2 x AUC - 1 (Rank Discrimination
  Power), measured in index (0-100 or normalized). It provides the day-to-day signal that a process is
  running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Software practice.
