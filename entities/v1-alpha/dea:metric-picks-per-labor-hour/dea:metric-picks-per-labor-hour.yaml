id: dea:metric-picks-per-labor-hour
name: Picks per Labor Hour
type: Metric
description: Picks per Labor Hour (PPH) captures how efficiently resources are converted into outputs
  for organizations tracking warehousing. Its calculation is Total Picks / Total Labor Hours, measured
  in ratio (x:1 or x). It provides the day-to-day signal that a process is running as designed. Higher
  values are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: PPH
