id: dea:metric-cost-savings-from-vendor-negotiation
name: Cost Savings from Vendor Negotiation
type: Metric
description: Cost Savings from Vendor Negotiation (CSVN) addresses the economic value created or preserved
  and is a fixture of outsourcing & vendor management reporting. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Negotiated
  Reduction vs Initial Quote, Annualized, measured in currency value. Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
