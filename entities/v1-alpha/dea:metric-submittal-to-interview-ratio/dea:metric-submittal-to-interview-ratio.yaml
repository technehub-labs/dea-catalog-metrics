id: dea:metric-submittal-to-interview-ratio
name: Submittal to Interview Ratio
type: Metric
description: 'Submittal to Interview Ratio (SIR-S) measures how effectively a process or entity achieves
  its intended outcome in the Staffing & Recruiting domain. It is defined as Candidate Interviews / Candidates
  Submitted to Client; the result is stated in percent (%). In Staffing & recruiting, it is a recognized
  element of the standard performance toolkit. It is a working-level control: thresholds trigger immediate
  operational response. It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: SIR-S
unit: percent
