id: dea:metric-vendor-exit-plan-coverage
name: Vendor Exit Plan Coverage
type: Metric
description: Vendor Exit Plan Coverage (VEPC) measures exposure to adverse outcomes in the Third-Party
  Risk Management domain. Its calculation is Critical Vendors with Tested Exit Plan / Critical Vendors,
  measured in percent (%). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: VEPC
unit: percent
version: 1.1.0
lifecycle_status: candidate
