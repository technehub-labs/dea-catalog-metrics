id: dea:metric-recovery-rate-on-charged-off-deep-dive
name: Recovery Rate on Charged-Off (Deep Dive)
type: Metric
description: Recovery Rate on Charged-Off (Deep Dive) (RRCOD) captures the economic value created or preserved
  for organizations tracking credit & collections risk (enterprise). The formula is Recovered Amount /
  Charged-Off Amount - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: RRCOD
