id: dea:metric-training-completion-rate
name: Training Completion Rate
type: Metric
description: Training Completion Rate (TCR-L) captures conformance to standards, plans, or obligations
  for organizations tracking learning & development. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. It is computed as Completed Enrollments / Enrollments,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: TCR-L
unit: percent
