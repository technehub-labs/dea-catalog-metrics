id: dea:metric-churn-rate-telecom
name: Churn Rate (Telecom)
type: Metric
description: 'Churn Rate (Telecom) (CR-T) measures exposure to adverse outcomes in the Telecommunications
  domain. It is computed as Subscribers Lost / Average Subscribers, expressed in percent (%). It is a
  headline indicator: movement in it prompts leadership questions about strategy and resourcing. Lower
  values are better; each reduction is an improvement. Its use is concentrated in Telecommunications.'
