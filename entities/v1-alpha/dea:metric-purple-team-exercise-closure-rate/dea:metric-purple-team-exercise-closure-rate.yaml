id: dea:metric-purple-team-exercise-closure-rate
name: Purple Team Exercise Closure Rate
type: Metric
description: Purple Team Exercise Closure Rate (PTECR) captures conformance to standards, plans, or obligations
  for organizations tracking threat intelligence & red team. It is computed as Exercise Findings Remediated
  / Findings, expressed in percent (%). It is applied across virtually every sector. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
