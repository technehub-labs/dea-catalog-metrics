id: dea:metric-energy-cost-ratio-to-output
name: Energy Cost Ratio to Output
type: Metric
description: 'A Operations Energy Management indicator, Energy Cost Ratio to Output (ECRO) quantifies
  how efficiently resources are converted into outputs. It is computed as Total Energy Cost / Units of
  Output, expressed in currency per unit. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: ECRO
unit: currency
