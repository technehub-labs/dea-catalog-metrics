id: dea:metric-seat-occupancy-rail
name: Seat Occupancy (Rail)
type: Metric
description: Seat Occupancy (Rail) (SO-R) addresses the utilization or availability of capacity and is
  a fixture of rail transport reporting. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Its calculation is Passenger Kilometres Travelled / Seat
  Kilometres Offered, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Rail practice.
abbreviation: SO-R
unit: percent
