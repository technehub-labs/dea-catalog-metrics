id: dea:metric-tenant-retention-rate-portfolio
name: Tenant Retention Rate (Portfolio)
type: Metric
description: Tenant Retention Rate (Portfolio) (TRR-P) addresses the retention of customers, users, or
  assets over time and is a fixture of real estate portfolio & property management reporting. Its calculation
  is Leases Renewed / Leases Expiring, measured in percent (%). It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Higher values are better; gains
  are read as improvement and losses as deterioration. It originates from and is most used in Real Estate
  practice.
abbreviation: TRR-P
unit: percent
