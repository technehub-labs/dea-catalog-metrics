id: dea:metric-ceremony-attendance-rate
name: Ceremony Attendance Rate
type: Metric
description: Ceremony Attendance Rate (CAR-AG) addresses the engagement or satisfaction of the people
  involved and is a fixture of agile delivery & team effectiveness reporting. It provides the day-to-day
  signal that a process is running as designed. Its calculation is Team Member Attendance at Scheduled
  Ceremonies / Expected, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CAR-AG
unit: percent
