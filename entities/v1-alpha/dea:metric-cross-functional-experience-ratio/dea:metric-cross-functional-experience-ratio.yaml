id: dea:metric-cross-functional-experience-ratio
name: Cross-Functional Experience Ratio
type: Metric
description: Cross-Functional Experience Ratio (CFER-BSC) measures capability maturity or development
  in the Balanced Scorecard - Learning & Growth Perspective domain. Its calculation is Employees with
  Cross-Functional Rotations / Employees, measured in percent (%). It is applied across virtually every
  sector. Its value drives prioritization and resource reallocation among competing initiatives. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: CFER-BSC
unit: percent
version: 1.1.0
