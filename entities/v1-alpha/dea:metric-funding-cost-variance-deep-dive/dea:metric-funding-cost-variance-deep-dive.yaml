id: dea:metric-funding-cost-variance-deep-dive
name: Funding Cost Variance (Deep Dive)
type: Metric
description: 'Funding Cost Variance (Deep Dive) (FCV-D) addresses the economic value created or preserved
  and is a fixture of corporate treasury (deep dive) reporting. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. It is computed as Actual Funding Cost
  - Plan / Plan, expressed in percent (%). The objective is neither maximization nor minimization but
  staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: FCV-D
unit: percent
