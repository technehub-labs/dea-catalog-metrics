id: dea:metric-enps-deep-dive
name: eNPS (Deep Dive)
type: Metric
description: A Employee Engagement & Culture (Deep Dive) indicator, eNPS (Deep Dive) (ENPSDD) quantifies
  the engagement or satisfaction of the people involved. Its calculation is Employee Promoters minus Detractors,
  measured in score (points). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: ENPSDD
