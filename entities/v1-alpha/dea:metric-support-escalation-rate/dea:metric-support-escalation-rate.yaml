id: dea:metric-support-escalation-rate
name: Support Escalation Rate
type: Metric
description: Support Escalation Rate (SER-S) addresses exposure to adverse outcomes and is a fixture of
  customer success (b2b saas) reporting. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It is computed as Escalated Tickets / Total Tickets, expressed
  in percent (%). It should be driven down, since lower readings signal healthier performance. Its use
  is concentrated in Software & SaaS.
abbreviation: SER-S
unit: percent
