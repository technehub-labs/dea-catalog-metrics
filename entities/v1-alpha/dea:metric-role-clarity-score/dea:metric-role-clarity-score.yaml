id: dea:metric-role-clarity-score
name: Role Clarity Score
type: Metric
description: Role Clarity Score (RCS-OM) measures the engagement or satisfaction of the people involved
  in the Operating Model & Process Health Deep Dive domain. It is defined as Employee Survey on Role and
  Accountability Clarity; the result is stated in score (points). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
