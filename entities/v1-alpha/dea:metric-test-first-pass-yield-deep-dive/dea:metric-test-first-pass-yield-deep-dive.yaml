id: dea:metric-test-first-pass-yield-deep-dive
name: Test First Pass Yield (Deep Dive)
type: Metric
description: Within Semiconductor Manufacturing (Deep Dive), Test First Pass Yield (Deep Dive) (TFPY-D)
  is used to gauge the quality of outputs and outcomes. Its calculation is Units Passing Final Test First
  Time / Units Tested, measured in percent (%). It originates from and is most used in Semiconductors
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
