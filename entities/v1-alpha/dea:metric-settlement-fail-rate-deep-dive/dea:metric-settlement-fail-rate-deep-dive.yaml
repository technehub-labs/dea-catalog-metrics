id: dea:metric-settlement-fail-rate-deep-dive
name: Settlement Fail Rate (Deep Dive)
type: Metric
description: 'Settlement Fail Rate (Deep Dive) (SEFR-D) addresses exposure to adverse outcomes and is
  a fixture of investment management - portfolio operations reporting. It is a working-level control:
  thresholds trigger immediate operational response. It is defined as Failed Settlements / Settlements;
  the result is stated in percent (%). It should be driven down, since lower readings signal healthier
  performance. In Financial Services, it is a recognized element of the standard performance toolkit.'
abbreviation: SEFR-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
