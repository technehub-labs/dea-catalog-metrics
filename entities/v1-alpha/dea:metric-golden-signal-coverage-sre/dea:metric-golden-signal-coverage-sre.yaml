id: dea:metric-golden-signal-coverage-sre
name: Golden Signal Coverage (SRE)
type: Metric
description: Golden Signal Coverage (SRE) (GSCOV) addresses capability maturity or development and is
  a fixture of sre & observability standard measures reporting. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Services Instrumented for Latency,
  Traffic, Errors, Saturation / Services; the result is stated in percent (%). Improvement means raising
  this figure toward best-in-class levels. In Software, it is a recognized element of the standard performance
  toolkit.
