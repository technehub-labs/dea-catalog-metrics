id: dea:metric-vehicle-defects-per-unit
name: Vehicle Defects per Unit
type: Metric
description: Vehicle Defects per Unit (VDPU) measures the quality of outputs and outcomes in the Automotive
  domain. Its calculation is Assembly Defects / Vehicles Produced, measured in ratio (x:1 or x). It provides
  the day-to-day signal that a process is running as designed. Lower values are better; each reduction
  is an improvement. It originates from and is most used in Automotive practice.
