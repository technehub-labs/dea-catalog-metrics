id: dea:metric-on-time-delivery-semiconductor
name: On-Time Delivery (Semiconductor)
type: Metric
description: A Semiconductor & Electronics indicator, On-Time Delivery (Semiconductor) (OTD-S) quantifies
  the quality of outputs and outcomes. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Order Lines Delivered on Commit Date / Order Lines, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. It originates from
  and is most used in Electronics & semiconductors practice.
abbreviation: OTD-S
unit: percent
