id: dea:metric-ticket-utilization-rate
name: Ticket Utilization Rate
type: Metric
description: Ticket Utilization Rate (TUR-A) addresses the engagement or satisfaction of the people involved
  and is a fixture of arts & culture reporting. It is computed as Tickets Used / Tickets Sold or Issued,
  expressed in percent (%). Its use is concentrated in Arts & culture. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It should be maximized within the limits of
  cost and quality trade-offs.
abbreviation: TUR-A
unit: percent
version: 1.1.0
