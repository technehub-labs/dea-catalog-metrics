id: dea:metric-qbr-completion-rate
name: QBR Completion Rate
type: Metric
description: QBR Completion Rate (QBRC) addresses the engagement or satisfaction of the people involved
  and is a fixture of customer success (b2b saas) reporting. It provides the day-to-day signal that a
  process is running as designed. Its calculation is Quarterly Business Reviews Held / Reviews Planned,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. It originates
  from and is most used in Software & SaaS practice.
abbreviation: QBRC
unit: percent
version: 1.1.0
lifecycle_status: candidate
