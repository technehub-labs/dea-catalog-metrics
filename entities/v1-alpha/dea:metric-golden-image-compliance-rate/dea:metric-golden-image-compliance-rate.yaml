id: dea:metric-golden-image-compliance-rate
name: Golden Image Compliance Rate
type: Metric
description: Golden Image Compliance Rate (GICR) addresses conformance to standards, plans, or obligations
  and is a fixture of cloud security posture management reporting. It provides the day-to-day signal that
  a process is running as designed. Its calculation is Workloads Launched from Approved Images / Workloads,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
