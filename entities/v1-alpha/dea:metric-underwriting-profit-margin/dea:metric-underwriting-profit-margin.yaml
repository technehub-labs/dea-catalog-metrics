id: dea:metric-underwriting-profit-margin
name: Underwriting Profit Margin
type: Metric
description: 'Underwriting Profit Margin (UPM) addresses the economic value created or preserved and is
  a fixture of insurance reporting. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as (Earned Premiums - Incurred Losses - Underwriting Expenses)
  / Earned Premiums, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Insurance.'
abbreviation: UPM
unit: percent
