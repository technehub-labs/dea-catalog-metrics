id: dea:metric-contingent-conversion-rate
name: Contingent Conversion Rate
type: Metric
description: Within Gig & Contingent Workforce, Contingent Conversion Rate (CVC) is used to gauge capability
  maturity or development. Its value drives prioritization and resource reallocation among competing initiatives.
  Its calculation is Contingent Workers Converted to Permanent / Eligible Contingent, measured in percent
  (%). The objective is neither maximization nor minimization but staying within an agreed operating band.
  Practitioners in nearly any industry can adopt it directly.
