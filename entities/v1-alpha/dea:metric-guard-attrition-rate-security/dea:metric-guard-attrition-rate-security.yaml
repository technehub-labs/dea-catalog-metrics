id: dea:metric-guard-attrition-rate-security
name: Guard Attrition Rate (Security)
type: Metric
description: 'A Security Services & Guarding indicator, Guard Attrition Rate (Security) (GAR) quantifies
  the retention of customers, users, or assets over time. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Guards Leaving / Guards Employed,
  expressed in percent (%). It should be driven down, since lower readings signal healthier performance.
  Its use is concentrated in Security.'
