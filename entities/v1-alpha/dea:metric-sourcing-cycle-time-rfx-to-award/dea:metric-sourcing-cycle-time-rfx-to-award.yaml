id: dea:metric-sourcing-cycle-time-rfx-to-award
name: Sourcing Cycle Time (RFx to Award)
type: Metric
description: A Strategic Sourcing & Supplier Performance (Deep Dive) indicator, Sourcing Cycle Time (RFx
  to Award) (SCTRF) quantifies how efficiently resources are converted into outputs. It is computed as
  Days from RFx Launch to Contract Award, expressed in days. It is applied across virtually every sector.
  It is reviewed at cadence by planning owners to correct course before issues become strategic. Reduction
  is the goal, and sustained decreases indicate successful intervention.
