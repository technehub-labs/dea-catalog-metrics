id: dea:metric-magic-number-deep-dive
name: Magic Number (Deep Dive)
type: Metric
description: Magic Number (Deep Dive) (MN-D) measures how efficiently resources are converted into outputs
  in the Startup & Venture-Backed Business domain. Its calculation is Net New ARR Quarter / Prior Quarter
  Sales and Marketing Spend, measured in ratio (x:1 or x). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: MN-D
unit: ratio
