name: Fabric Shrinkage Test Compliance
type: Metric
description: 'Fabric Shrinkage Test Compliance (FSTC-T) captures the quality of outputs and outcomes for
  organizations tracking textile & apparel (deep dive). It is defined as Tests within Shrinkage Spec /
