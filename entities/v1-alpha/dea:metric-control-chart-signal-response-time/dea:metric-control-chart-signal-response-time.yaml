id: dea:metric-control-chart-signal-response-time
name: Control Chart Signal Response Time
type: Metric
description: Within Process Capability & Six Sigma (Deep Dive), Control Chart Signal Response Time (CCSRT)
  is used to gauge how efficiently resources are converted into outputs. Its calculation is Hours from
  Control Chart Signal to Containment Action, measured in hours. It provides the day-to-day signal that
  a process is running as designed. Lower values are better; each reduction is an improvement. It originates
  from and is most used in Manufacturing practice.
