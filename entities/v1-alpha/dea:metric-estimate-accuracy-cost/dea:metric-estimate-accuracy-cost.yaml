id: dea:metric-estimate-accuracy-cost
name: Estimate Accuracy - Cost
type: Metric
description: A Project Management (Deep Dive) indicator, Estimate Accuracy - Cost (EAC-PM) quantifies
  the quality of outputs and outcomes. The formula is Actual Cost / Estimated Cost at Completion - reported
  in ratio (x:1 or x). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. It is managed toward a defined target band rather than an extreme - both overshoot and undershoot
  can signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: EAC-PM
