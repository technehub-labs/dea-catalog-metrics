id: dea:metric-average-time-to-issue-audit-report
name: Average Time to Issue Audit Report
type: Metric
description: A Internal Audit indicator, Average Time to Issue Audit Report (TIR) quantifies how efficiently
  resources are converted into outputs. It provides the day-to-day signal that a process is running as
  designed. Its calculation is Days from Fieldwork End to Report Issued, measured in days. It should be
  driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
