id: dea:metric-rebalancing-execution-cycle-time
name: Rebalancing Execution Cycle Time
type: Metric
description: A Investment Management - Portfolio Operations indicator, Rebalancing Execution Cycle Time
  (REXCT) quantifies how efficiently resources are converted into outputs. It provides the day-to-day
  signal that a process is running as designed. Its calculation is Days from Drift Trigger to Completed
  Rebalance, measured in days. It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Financial Services practice.
