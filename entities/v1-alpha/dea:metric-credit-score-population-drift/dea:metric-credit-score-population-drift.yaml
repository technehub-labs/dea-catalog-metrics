id: dea:metric-credit-score-population-drift
name: Credit Score Population Drift
type: Metric
description: 'Within Credit & Collections Risk (Enterprise), Credit Score Population Drift (CSPD) is used
  to gauge exposure to adverse outcomes. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Period Shift in Score Distribution of Book vs Origination -
  reported in index (0-100 or normalized). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
