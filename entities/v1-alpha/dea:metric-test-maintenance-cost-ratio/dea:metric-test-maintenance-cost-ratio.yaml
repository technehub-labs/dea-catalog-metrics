id: dea:metric-test-maintenance-cost-ratio
name: Test Maintenance Cost Ratio
type: Metric
description: 'Test Maintenance Cost Ratio (TMCR-QA) addresses how efficiently resources are converted
  into outputs and is a fixture of software testing & quality engineering reporting. The formula is Test
  Maintenance Effort / Total Test Effort - reported in percent (%). It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. It is managed toward a defined target
  band rather than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
