id: dea:metric-app-uninstall-rate
name: App Uninstall Rate
type: Metric
description: A Mobile & Client Development indicator, App Uninstall Rate (AUR-MOB) quantifies the retention
  of customers, users, or assets over time. Its calculation is Uninstalls / Installs in Period, measured
  in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Lower values are better; each reduction is an improvement. It originates from
  and is most used in Software practice.
abbreviation: AUR-MOB
unit: percent
