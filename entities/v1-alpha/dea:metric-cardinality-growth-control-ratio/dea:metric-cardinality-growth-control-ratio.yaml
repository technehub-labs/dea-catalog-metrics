id: dea:metric-cardinality-growth-control-ratio
name: Cardinality Growth Control Ratio
type: Metric
description: A Observability & Site Reliability Engineering indicator, Cardinality Growth Control Ratio
  (CGCR) quantifies the utilization or availability of capacity. Its calculation is Metric Cardinality
  Growth / Headroom Budget, measured in percent (%). It is applied across virtually every sector. Its
  value drives prioritization and resource reallocation among competing initiatives. Values outside the
  intended band, on either side, warrant investigation.
