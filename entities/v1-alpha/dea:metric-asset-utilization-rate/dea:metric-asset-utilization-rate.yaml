source_credit: Public domain - no attribution required
calculation_definition: Productive Asset Hours / Available Asset Hours
formula_definition:
  formula_id: dea:formula-asset-utilization-rate
  expression: AUR = Productive Asset Hours / Available Asset Hours
  inputs:
  - name: Productive Asset Hours
  - name: Available Asset Hours
