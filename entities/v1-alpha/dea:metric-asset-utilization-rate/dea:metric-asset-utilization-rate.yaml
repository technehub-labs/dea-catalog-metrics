id: dea:metric-asset-utilization-rate
name: Asset Utilization Rate
type: Metric
description: 'A Maintenance & Reliability indicator, Asset Utilization Rate (AUR) quantifies the utilization
  or availability of capacity. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Productive Asset Hours / Available Asset Hours, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Manufacturing.'
abbreviation: AUR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- business_architecture
purpose_classification:
