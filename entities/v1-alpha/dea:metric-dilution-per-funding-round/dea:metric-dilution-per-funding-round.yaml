id: dea:metric-dilution-per-funding-round
name: Dilution per Funding Round
type: Metric
description: 'A Startup & Venture-Backed Business indicator, Dilution per Funding Round (DPRF) quantifies
  the economic value created or preserved. It is computed as Founders'' Ownership Change per Round, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It is managed toward a defined target band rather than an extreme - both overshoot and
  undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
