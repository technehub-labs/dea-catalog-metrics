id: dea:metric-days-sales-outstanding-deep-dive
name: Days Sales Outstanding (Deep Dive)
type: Metric
description: 'Days Sales Outstanding (Deep Dive) (DSODD) captures how efficiently resources are converted
  into outputs for organizations tracking accounts payable & receivable operations (deep dive). It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. It
  is computed as Average Days from Invoice to Collection, expressed in days. It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.'
