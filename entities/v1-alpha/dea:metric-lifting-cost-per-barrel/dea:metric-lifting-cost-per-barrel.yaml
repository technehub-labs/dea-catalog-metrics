id: dea:metric-lifting-cost-per-barrel
name: Lifting Cost per Barrel
type: Metric
description: Lifting Cost per Barrel (LCB) measures how efficiently resources are converted into outputs
  in the Oil & Gas domain. The formula is Production Lifting Cost / Barrels Produced - reported in currency
  per unit. It is a standard measure in the Oil & gas sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases
  indicate successful intervention.
