id: dea:metric-contribution-margin-per-unit
name: Contribution Margin per Unit
type: Metric
description: Within Product Costing & Margin Management, Contribution Margin per Unit (CMU) is used to
  gauge the economic value created or preserved. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Price per Unit - Variable Cost
  per Unit, measured in currency per unit. Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
