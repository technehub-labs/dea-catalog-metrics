id: dea:metric-blended-roas-by-acquisition-stage
name: Blended ROAS by Acquisition Stage
type: Metric
description: Blended ROAS by Acquisition Stage (BRAS) addresses the economic value created or preserved
  and is a fixture of marketing & advertising standard measures (deep dive) reporting. The formula is
  Revenue / Spend across New versus Retention Activity - reported in ratio (x:1 or x). It is applied across
  virtually every sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Values outside the intended band, on either side, warrant investigation.
