id: dea:metric-syndication-and-licensing-revenue-ratio
name: Syndication and Licensing Revenue Ratio
type: Metric
description: 'Syndication and Licensing Revenue Ratio (SLRR) addresses the economic value created or preserved
  and is a fixture of publishing & news media reporting. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Licensing Revenue / Total Revenue
  - reported in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. It is a standard measure in the Media & Entertainment sector.'
