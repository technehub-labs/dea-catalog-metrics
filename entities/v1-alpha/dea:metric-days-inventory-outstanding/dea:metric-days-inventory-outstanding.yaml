id: dea:metric-days-inventory-outstanding
name: Days Inventory Outstanding
type: Metric
description: A Finance & Accounting indicator, Days Inventory Outstanding (DIO) quantifies how efficiently
  resources are converted into outputs. Its calculation is (Inventory / Cost of Goods Sold) x 365, measured
  in days. It is applied across virtually every sector. Its value drives prioritization and resource reallocation
  among competing initiatives. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: DIO
