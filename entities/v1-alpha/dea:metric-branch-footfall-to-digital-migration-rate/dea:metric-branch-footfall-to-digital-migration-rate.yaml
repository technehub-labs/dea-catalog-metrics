id: dea:metric-branch-footfall-to-digital-migration-rate
name: Branch Footfall to Digital Migration Rate
type: Metric
description: 'Branch Footfall to Digital Migration Rate (BFDM) measures how efficiently resources are
  converted into outputs in the Retail Banking Branch Network (Deep Dive) domain. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Migrated
  Transactions / Addressable Branch Transactions, expressed in percent (%). Improvement means raising
  this figure toward best-in-class levels. Its use is concentrated in Banking.'
abbreviation: BFDM
unit: percent
