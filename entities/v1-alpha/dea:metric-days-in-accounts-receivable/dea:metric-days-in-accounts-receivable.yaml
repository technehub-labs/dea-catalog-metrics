id: dea:metric-days-in-accounts-receivable
name: Days in Accounts Receivable
type: Metric
description: Within Healthcare Revenue Cycle, Days in Accounts Receivable (DAR) is used to gauge how efficiently
  resources are converted into outputs. It is defined as Total Accounts Receivable / Average Daily Revenue;
  the result is stated in days. In Healthcare, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: DAR
unit: day
