id: dea:metric-beneficiary-reach
name: Beneficiary Reach
type: Metric
description: Beneficiary Reach (BFR) addresses the utilization or availability of capacity and is a fixture
  of nonprofit & ngo reporting. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Individuals Served per Period; the result is stated in count (items
  per period). Improvement means raising this figure toward best-in-class levels. In Nonprofit & NGO,
  it is a recognized element of the standard performance toolkit.
