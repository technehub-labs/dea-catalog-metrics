id: dea:metric-voice-of-customer-participation-rate
name: Voice of Customer Participation Rate
type: Metric
description: Voice of Customer Participation Rate (VoCPR) measures the engagement or satisfaction of the
  people involved in the Customer domain. It is computed as Survey Responses / Survey Invitations, expressed
  in percent (%). Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: VoCPR
unit: percent
version: 1.0.1
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- engagement
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
