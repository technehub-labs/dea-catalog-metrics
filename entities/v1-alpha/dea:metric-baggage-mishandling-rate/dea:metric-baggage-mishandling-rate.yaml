id: dea:metric-baggage-mishandling-rate
name: Baggage Mishandling Rate
type: Metric
description: Baggage Mishandling Rate (BMR) captures the quality of outputs and outcomes for organizations
  tracking airlines & aviation. It is defined as Mishandled Bags / Total Bags Handled; the result is stated
  in ratio (x:1 or x). It bridges daily operations and executive reporting, giving managers a lever to
  pull within a quarter. Lower values are better; each reduction is an improvement. In Airlines & aviation,
  it is a recognized element of the standard performance toolkit.
