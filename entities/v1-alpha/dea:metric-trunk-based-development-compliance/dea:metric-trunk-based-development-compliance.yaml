id: dea:metric-trunk-based-development-compliance
name: Trunk-Based Development Compliance
type: Metric
description: Trunk-Based Development Compliance (TBDC) captures conformance to standards, plans, or obligations
  for organizations tracking continuous integration. It is computed as Changes Merged to Trunk within
  24 Hours / Changes, expressed in percent (%). It is applied across virtually every sector. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
