id: dea:metric-time-to-placement
name: Time to Placement
type: Metric
description: 'Time to Placement (TTP) addresses how efficiently resources are converted into outputs and
  is a fixture of staffing & recruiting reporting. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Days from Mandate Opening to Accepted
  Offer - reported in days. It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Staffing & recruiting sector.'
