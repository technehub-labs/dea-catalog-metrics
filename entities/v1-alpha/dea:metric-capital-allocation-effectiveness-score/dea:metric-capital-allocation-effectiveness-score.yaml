id: dea:metric-capital-allocation-effectiveness-score
name: Capital Allocation Effectiveness Score
type: Metric
description: Capital Allocation Effectiveness Score (CAES) captures the economic value created or preserved
  for organizations tracking valuation & corporate finance standard measures. It is defined as Composite
  of Value Created per Dollar Deployed across Uses; the result is stated in score (points). Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Higher values are
  better; gains are read as improvement and losses as deterioration. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.
abbreviation: CAES
