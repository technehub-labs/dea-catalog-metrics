id: dea:metric-audience-match-rate-deep-dive
name: Audience Match Rate (Deep Dive)
type: Metric
description: Audience Match Rate (Deep Dive) (AMR-D) addresses capability maturity or development and
  is a fixture of advertising & media buying reporting. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It is defined as Matched Targetable Audience / Addressable
  Audience; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Media & Entertainment, it is a recognized element of the standard performance toolkit.
abbreviation: AMR-D
unit: percent
version: 1.1.0
