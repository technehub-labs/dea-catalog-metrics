id: dea:metric-fuel-burn-variance-per-flight-deep-dive
name: Fuel Burn Variance per Flight (Deep Dive)
type: Metric
description: Fuel Burn Variance per Flight (Deep Dive) (FBVF-D) addresses how efficiently resources are
  converted into outputs and is a fixture of airline operations (deep dive) reporting. It is defined as
  Actual Fuel Burn - Flight Plan Fuel / Plan; the result is stated in percent (%). It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It is managed toward a defined
  target band rather than an extreme - both overshoot and undershoot can signal problems. In Airlines,
  it is a recognized element of the standard performance toolkit.
abbreviation: FBVF-D
