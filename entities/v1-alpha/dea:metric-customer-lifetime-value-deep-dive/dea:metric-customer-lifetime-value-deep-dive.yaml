id: dea:metric-customer-lifetime-value-deep-dive
name: Customer Lifetime Value (Deep Dive)
type: Metric
description: Customer Lifetime Value (Deep Dive) (LTVDD) measures the economic value created or preserved
  in the Unit Economics & Growth (Deep Dive) domain. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Average Gross Margin per
  Customer x Lifespan, measured in currency value. Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Software practice.
