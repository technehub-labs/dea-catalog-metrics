id: dea:metric-cost-per-hectare
name: Cost per Hectare
type: Metric
description: Cost per Hectare (CPh) captures how efficiently resources are converted into outputs for
  organizations tracking agriculture & food processing. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It is defined as Total Production Cost / Cultivated
  Hectares; the result is stated in currency per unit. It should be driven down, since lower readings
  signal healthier performance. In Agriculture & food, it is a recognized element of the standard performance
  toolkit.
abbreviation: CPh
