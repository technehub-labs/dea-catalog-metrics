id: dea:metric-configuration-drift-rate-network
name: Configuration Drift Rate (Network)
type: Metric
description: 'Within Network Change & Configuration Management, Configuration Drift Rate (Network) (CDRN)
  is used to gauge conformance to standards, plans, or obligations. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Devices with Unapproved Config Drift / Devices;
  the result is stated in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
