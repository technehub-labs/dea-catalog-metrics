id: dea:metric-member-net-promoter-score-deep-dive
name: Member Net Promoter Score (Deep Dive)
type: Metric
description: 'Member Net Promoter Score (Deep Dive) (MNPS-D) addresses the engagement or satisfaction
  of the people involved and is a fixture of fitness & wellness (deep dive) reporting. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Member NPS Survey Result, expressed in score (points). Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Health & Fitness.'
