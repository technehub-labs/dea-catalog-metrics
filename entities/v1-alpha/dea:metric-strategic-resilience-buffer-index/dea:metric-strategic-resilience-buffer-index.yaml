id: dea:metric-strategic-resilience-buffer-index
name: Strategic Resilience Buffer Index
type: Metric
description: A Emerging Risk & Horizon Scanning indicator, Strategic Resilience Buffer Index (SRBI) quantifies
  exposure to adverse outcomes. Its calculation is Composite of Financial and Operational Buffers vs Stressed
  Scenarios, measured in index (0-100 or normalized). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
