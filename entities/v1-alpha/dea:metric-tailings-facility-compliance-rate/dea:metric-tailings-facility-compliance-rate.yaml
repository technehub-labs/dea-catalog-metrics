id: dea:metric-tailings-facility-compliance-rate
name: Tailings Facility Compliance Rate
type: Metric
description: A Mining & Metals indicator, Tailings Facility Compliance Rate (TFC) quantifies conformance
  to standards, plans, or obligations. The formula is Tailings Facilities Meeting Stability Requirements
  / Facilities - reported in percent (%). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Mining & metals sector.
