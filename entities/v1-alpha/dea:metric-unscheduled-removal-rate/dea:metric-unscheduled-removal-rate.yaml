id: dea:metric-unscheduled-removal-rate
name: Unscheduled Removal Rate
type: Metric
description: A Aviation Maintenance Repair & Overhaul indicator, Unscheduled Removal Rate (URR) quantifies
  exposure to adverse outcomes. It is defined as Unscheduled Component Removals / Flight Hours x 1,000;
  the result is stated in events per thousand or million (scaled). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  In Airlines & aviation, it is a recognized element of the standard performance toolkit.
