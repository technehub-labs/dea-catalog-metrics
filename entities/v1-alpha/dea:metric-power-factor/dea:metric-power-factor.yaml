id: dea:metric-power-factor
name: Power Factor
type: Metric
description: Within Operations Energy Management, Power Factor (PFE) is used to gauge how efficiently
  resources are converted into outputs. It is computed as Real Power / Apparent Power, expressed in ratio
  (x:1 or x). Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PFE
unit: ratio
