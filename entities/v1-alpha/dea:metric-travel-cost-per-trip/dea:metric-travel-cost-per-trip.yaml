id: dea:metric-travel-cost-per-trip
name: Travel Cost per Trip
type: Metric
description: Travel Cost per Trip (TCPT) captures how efficiently resources are converted into outputs
  for organizations tracking corporate travel management. Its calculation is Total Travel Spend / Trips,
  measured in currency per unit. Its value drives prioritization and resource reallocation among competing
  initiatives. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
