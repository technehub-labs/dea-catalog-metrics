id: dea:metric-direct-labor-efficiency-variance
name: Direct Labor Efficiency Variance
type: Metric
description: Direct Labor Efficiency Variance (DLEV) addresses the economic value created or preserved
  and is a fixture of manufacturing reporting. Its calculation is (Actual Labor Hours - Standard Hours)
  x Standard Rate, measured in currency value. It originates from and is most used in Manufacturing practice.
  Its value drives prioritization and resource reallocation among competing initiatives. Reduction is
  the goal, and sustained decreases indicate successful intervention.
abbreviation: DLEV
unit: currency
