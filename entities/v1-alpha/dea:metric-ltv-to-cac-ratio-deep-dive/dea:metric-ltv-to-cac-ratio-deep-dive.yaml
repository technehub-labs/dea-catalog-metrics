id: dea:metric-ltv-to-cac-ratio-deep-dive
name: LTV-to-CAC Ratio (Deep Dive)
type: Metric
description: 'LTV-to-CAC Ratio (Deep Dive) (LTVCRD) addresses the economic value created or preserved
  and is a fixture of unit economics & growth (deep dive) reporting. It is computed as Lifetime Value
  / Acquisition Cost, expressed in ratio (x:1 or x). Its use is concentrated in Software. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
