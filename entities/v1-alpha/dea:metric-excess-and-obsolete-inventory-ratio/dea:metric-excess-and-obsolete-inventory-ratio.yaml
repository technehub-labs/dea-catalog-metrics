id: dea:metric-excess-and-obsolete-inventory-ratio
name: Excess and Obsolete Inventory Ratio
type: Metric
description: Excess and Obsolete Inventory Ratio (EOIR) addresses exposure to adverse outcomes and is
  a fixture of sales & operations planning reporting. It is defined as Excess and Obsolete Inventory Value
  / Total Inventory Value; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: EOIR
unit: percent
