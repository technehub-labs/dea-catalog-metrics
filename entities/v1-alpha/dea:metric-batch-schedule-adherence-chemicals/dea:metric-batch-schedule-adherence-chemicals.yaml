id: dea:metric-batch-schedule-adherence-chemicals
name: Batch Schedule Adherence (Chemicals)
type: Metric
description: Batch Schedule Adherence (Chemicals) (BSA-C) captures conformance to standards, plans, or
  obligations for organizations tracking chemicals. It is computed as Batches Produced on Schedule / Batches
  Planned, expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Chemicals.
