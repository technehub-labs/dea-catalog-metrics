id: dea:metric-missed-trip-rate
name: Missed Trip Rate
type: Metric
description: Missed Trip Rate (MTR-P) addresses the quality of outputs and outcomes and is a fixture of
  public transit reporting. It is computed as Trips Not Operated / Trips Scheduled, expressed in percent
  (%). Its use is concentrated in Public transit. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: MTR-P
unit: percent
