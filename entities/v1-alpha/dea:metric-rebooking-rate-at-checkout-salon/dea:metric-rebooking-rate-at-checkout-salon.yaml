id: dea:metric-rebooking-rate-at-checkout-salon
name: Rebooking Rate at Checkout (Salon)
type: Metric
description: Within Beauty & Personal Care Services, Rebooking Rate at Checkout (Salon) (RRC-S) is used
  to gauge the retention of customers, users, or assets over time. Its calculation is Appointments Booked
  before Leaving / Appointments Served, measured in percent (%). It originates from and is most used in
  Personal Services practice. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: RRC-S
unit: percent
