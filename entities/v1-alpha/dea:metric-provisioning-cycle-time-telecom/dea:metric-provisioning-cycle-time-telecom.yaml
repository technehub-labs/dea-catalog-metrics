id: dea:metric-provisioning-cycle-time-telecom
name: Provisioning Cycle Time (Telecom)
type: Metric
description: Within Telecom Field & Installation, Provisioning Cycle Time (Telecom) (PCT-T) is used to
  gauge how efficiently resources are converted into outputs. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Days from Order to Active Service;
  the result is stated in days. It should be driven down, since lower readings signal healthier performance.
  In Telecommunications, it is a recognized element of the standard performance toolkit.
