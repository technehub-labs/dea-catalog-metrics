id: dea:metric-customer-acquisition-cost
name: Customer Acquisition Cost
type: Metric
description: 'A Banking & Financial Services indicator, Customer Acquisition Cost (CAC) quantifies how
  efficiently resources are converted into outputs. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Total Sales and Marketing Cost
  / New Customers Acquired, expressed in currency per unit. It should be driven down, since lower readings
  signal healthier performance. Its use is concentrated in Financial services.'
abbreviation: CAC
unit: currency
