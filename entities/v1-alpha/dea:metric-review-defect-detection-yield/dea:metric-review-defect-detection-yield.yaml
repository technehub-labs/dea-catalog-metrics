id: dea:metric-review-defect-detection-yield
name: Review Defect Detection Yield
type: Metric
description: 'Within Code Review & Peer Quality, Review Defect Detection Yield (RDDY) is used to gauge
  the quality of outputs and outcomes. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Defects Found in Review / (Defects in Review + Field) - reported
  in percent (%). Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Software sector.'
abbreviation: RDDY
unit: percent
