id: dea:metric-patent-filing-success-rate-pharma
name: Patent Filing Success Rate (Pharma)
type: Metric
description: A Pharma R&D & Clinical Trials indicator, Patent Filing Success Rate (Pharma) (PFSR) quantifies
  the economic value created or preserved. It is defined as Granted Patents / Filed Patents; the result
  is stated in percent (%). In Pharmaceuticals, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: PFSR
unit: percent
