id: dea:metric-green-belt-project-throughput
name: Green Belt Project Throughput
type: Metric
description: Green Belt Project Throughput (GBPT) captures capability maturity or development for organizations
  tracking process excellence (lean six sigma). Its calculation is Certified Projects Completed per Practitioner
  per Year, measured in ratio (x:1 or x). Its value drives prioritization and resource reallocation among
  competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
