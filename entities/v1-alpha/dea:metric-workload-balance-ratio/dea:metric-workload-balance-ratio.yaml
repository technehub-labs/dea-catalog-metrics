id: dea:metric-workload-balance-ratio
name: Workload Balance Ratio
type: Metric
description: Workload Balance Ratio (WBR) measures exposure to adverse outcomes in the Employee Wellbeing
  domain. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It is computed as Employees above Sustainable Workload Threshold / Total Employees, expressed in percent
  (%). It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: WBR
unit: percent
