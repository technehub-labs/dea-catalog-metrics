id: dea:metric-case-fill-rate-deep-dive
name: Case Fill Rate (Deep Dive)
type: Metric
description: A Supply Chain Standard Measures (Deep Dive) indicator, Case Fill Rate (Deep Dive) (CFRDD)
  quantifies the quality of outputs and outcomes. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. It is computed as Cases Shipped Complete / Cases Ordered,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: CFRDD
unit: percent
