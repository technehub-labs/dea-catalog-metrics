id: dea:metric-instructor-utilization-rate-deep-dive
name: Instructor Utilization Rate (Deep Dive)
type: Metric
description: Within Education & Training (Deep Dive), Instructor Utilization Rate (Deep Dive) (IUR-D)
  is used to gauge the utilization or availability of capacity. It is computed as Teaching Hours / Contracted
  Hours, expressed in percent (%). Its use is concentrated in Education. It is reviewed at cadence by
  planning owners to correct course before issues become strategic. Values outside the intended band,
  on either side, warrant investigation.
