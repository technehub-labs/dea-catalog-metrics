id: dea:metric-net-revenue-per-available-berth-day
name: Net Revenue per Available Berth Day
type: Metric
description: 'Net Revenue per Available Berth Day (NRABD) captures the economic value created or preserved
  for organizations tracking cruise & passenger shipping. It is computed as Net Revenue / Available Berth
  Days, expressed in currency per unit. Its use is concentrated in Hospitality. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
