id: dea:metric-price-cost-margin-squeeze-ratio
name: Price Cost Margin Squeeze Ratio
type: Metric
description: A Market Structure & Economics Standard Measures indicator, Price Cost Margin Squeeze Ratio
  (PCMSR) quantifies the economic value created or preserved. The formula is Margin Change / Cost Change
  - reported in ratio (x:1 or x). It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Values outside the intended band,
  on either side, warrant investigation.
