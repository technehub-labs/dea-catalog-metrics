id: dea:metric-converting-downtime-rate-paper
name: Converting Downtime Rate (Paper)
type: Metric
description: Converting Downtime Rate (Paper) (CDR-P) measures the utilization or availability of capacity
  in the Pulp, Paper & Forest Products domain. It provides the day-to-day signal that a process is running
  as designed. Its calculation is Converting Downtime / Scheduled Converting Time, measured in percent
  (%). It should be driven down, since lower readings signal healthier performance. It originates from
  and is most used in Manufacturing practice.
