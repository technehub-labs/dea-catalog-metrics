id: dea:metric-ci-build-duration-median
name: CI Build Duration - Median
type: Metric
description: CI Build Duration - Median (CIBDM) captures how efficiently resources are converted into
  outputs for organizations tracking continuous integration. Its calculation is Median Minutes per Pipeline
  Run, measured in minutes. It provides the day-to-day signal that a process is running as designed. Lower
  values are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
