id: dea:metric-alarm-false-callout-rate
name: Alarm False Callout Rate
type: Metric
description: 'Alarm False Callout Rate (AFCR) addresses how efficiently resources are converted into outputs
  and is a fixture of security services & guarding reporting. It is defined as False Alarm Responses /
  Alarm Responses; the result is stated in percent (%). It is a working-level control: thresholds trigger
  immediate operational response. Lower values are better; each reduction is an improvement. In Security,
  it is a recognized element of the standard performance toolkit.'
