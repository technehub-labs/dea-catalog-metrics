id: dea:metric-cash-buffer-days
name: Cash Buffer Days
type: Metric
description: 'Cash Buffer Days (CBD) addresses exposure to adverse outcomes and is a fixture of treasury
  & cash management reporting. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Cash and Liquid Reserves / Average Daily Cash Outflow,
  expressed in days. The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: CBD
unit: day
