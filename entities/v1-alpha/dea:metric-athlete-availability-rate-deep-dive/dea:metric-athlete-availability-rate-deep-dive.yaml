id: dea:metric-athlete-availability-rate-deep-dive
name: Athlete Availability Rate (Deep Dive)
type: Metric
description: Athlete Availability Rate (Deep Dive) (AAR-D) addresses the utilization or availability of
  capacity and is a fixture of sports clubs & leagues (deep dive) reporting. Its calculation is Matches
  Available per Player / Squad Matches, measured in percent (%). It originates from and is most used in
  Sports practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: AAR-D
unit: percent
