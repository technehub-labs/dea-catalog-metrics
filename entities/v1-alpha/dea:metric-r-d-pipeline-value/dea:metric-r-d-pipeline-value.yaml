id: dea:metric-r-d-pipeline-value
name: R&D Pipeline Value
type: Metric
description: Within Pharma R&D & Clinical Trials, R&D Pipeline Value (RDPV) is used to gauge the economic
  value created or preserved. The formula is Risk-Adjusted NPV of Pipeline Candidates - reported in currency
  value. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Higher values are better; gains are read as improvement and losses as deterioration. It is a standard
  measure in the Pharmaceuticals sector.
abbreviation: RDPV
unit: currency
version: 1.1.0
