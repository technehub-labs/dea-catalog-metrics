id: dea:metric-store-staffing-ratio
name: Store Staffing Ratio
type: Metric
description: 'Within Retail & E-commerce, Store Staffing Ratio (SSR2) is used to gauge the utilization
  or availability of capacity. It is a working-level control: thresholds trigger immediate operational
  response. It is defined as Labor Hours / Store Operating Hours; the result is stated in ratio (x:1 or
  x). The objective is neither maximization nor minimization but staying within an agreed operating band.
  In Retail, it is a recognized element of the standard performance toolkit.'
