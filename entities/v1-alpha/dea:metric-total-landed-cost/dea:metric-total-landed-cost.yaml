id: dea:metric-total-landed-cost
name: Total Landed Cost
type: Metric
description: 'Total Landed Cost (TLC) measures the economic value created or preserved in the Supply Chain
  domain. It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. The formula is Product Cost + Freight + Duties + Insurance + Handling - reported in currency
  value. It should be driven down, since lower readings signal healthier performance. Practitioners in
  nearly any industry can adopt it directly.'
abbreviation: TLC
unit: currency
