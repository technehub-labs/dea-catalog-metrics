id: dea:metric-win-rate
name: Win Rate
type: Metric
description: Within Sales, Win Rate (WR) is used to gauge how effectively a process or entity achieves
  its intended outcome. It is defined as Closed-Won Deals / Total Closed Deals; the result is stated in
  percent (%). It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: WR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- effectiveness
scope_classification:
- capability
directionality: higher_is_better
management_significance:
