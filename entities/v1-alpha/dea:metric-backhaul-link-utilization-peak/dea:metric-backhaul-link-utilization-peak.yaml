id: dea:metric-backhaul-link-utilization-peak
name: Backhaul Link Utilization Peak
type: Metric
description: Backhaul Link Utilization Peak (BLUP) captures the utilization or availability of capacity
  for organizations tracking telecom network operations (deep dive). It is computed as Peak Backhaul Throughput
  / Link Capacity, expressed in percent (%). Its use is concentrated in Telecommunications. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. Values outside the intended
  band, on either side, warrant investigation.
