id: dea:metric-out-of-policy-spend-rate
name: Out-of-Policy Spend Rate
type: Metric
description: Within Corporate Travel Management, Out-of-Policy Spend Rate (OPSR) is used to gauge conformance
  to standards, plans, or obligations. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Out-of-Policy Travel Spend / Total Travel Spend, measured
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: OPSR
unit: percent
