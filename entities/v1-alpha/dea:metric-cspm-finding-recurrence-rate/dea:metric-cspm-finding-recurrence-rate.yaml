id: dea:metric-cspm-finding-recurrence-rate
name: CSPM Finding Recurrence Rate
type: Metric
description: A Cloud Security Posture Management indicator, CSPM Finding Recurrence Rate (CFRR-CS) quantifies
  the quality of outputs and outcomes. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Findings Reopened after Remediation / Findings, expressed
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
