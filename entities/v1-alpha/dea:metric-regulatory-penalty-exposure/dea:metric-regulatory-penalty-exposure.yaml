id: dea:metric-regulatory-penalty-exposure
name: Regulatory Penalty Exposure
type: Metric
description: 'Regulatory Penalty Exposure (RPE) measures exposure to adverse outcomes in the Legal domain.
  It is computed as Sum of Potential Penalties from Open Matters, expressed in currency value. It is a
  headline indicator: movement in it prompts leadership questions about strategy and resourcing. Lower
  values are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
