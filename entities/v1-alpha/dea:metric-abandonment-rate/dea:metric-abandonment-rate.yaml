id: dea:metric-abandonment-rate
name: Abandonment Rate
type: Metric
description: A Contact Center indicator, Abandonment Rate (ABR) quantifies the quality of outputs and
  outcomes. Its calculation is Abandoned Calls / Calls Offered, measured in percent (%). It provides the
  day-to-day signal that a process is running as designed. Lower values are better; each reduction is
  an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: ABR
