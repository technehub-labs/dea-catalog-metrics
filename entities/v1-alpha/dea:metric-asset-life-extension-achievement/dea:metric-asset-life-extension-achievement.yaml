id: dea:metric-asset-life-extension-achievement
name: Asset Life Extension Achievement
type: Metric
description: 'Asset Life Extension Achievement (ALEA) measures the economic value created or preserved
  in the Energy Transition & Renewables domain. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Turbines Operating beyond Design Life / Turbines
  at Design Life, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Renewable energy.'
abbreviation: ALEA
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- sustainability
purpose_classification:
- value_delivery
scope_classification:
