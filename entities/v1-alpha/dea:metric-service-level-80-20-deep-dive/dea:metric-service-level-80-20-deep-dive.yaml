id: dea:metric-service-level-80-20-deep-dive
name: Service Level - 80/20 (Deep Dive)
type: Metric
description: Service Level - 80/20 (Deep Dive) (SL8020-D) addresses the quality of outputs and outcomes
  and is a fixture of contact center operations (deep dive) reporting. It is defined as Calls Answered
  within 20 Seconds / Calls Offered; the result is stated in percent (%). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
