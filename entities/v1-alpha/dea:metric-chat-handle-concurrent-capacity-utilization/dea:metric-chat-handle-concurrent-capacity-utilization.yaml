id: dea:metric-chat-handle-concurrent-capacity-utilization
name: Chat-Handle Concurrent Capacity Utilization
type: Metric
description: Within Contact Center Standard Measures (Deep Dive), Chat-Handle Concurrent Capacity Utilization
  (CHCCU) is used to gauge the utilization or availability of capacity. It is computed as Active Concurrent
  Chats / Agents x Target Concurrency, expressed in ratio (x:1 or x). Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. It is managed toward a defined target
  band rather than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: CHCCU
