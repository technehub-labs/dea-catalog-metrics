id: dea:metric-benefit-payment-accuracy-rate-deep-dive
name: Benefit Payment Accuracy Rate (Deep Dive)
type: Metric
description: Within Public Sector & Citizen Service Standard Measures (Deep Dive), Benefit Payment Accuracy
  Rate (Deep Dive) (BPADD) is used to gauge the quality of outputs and outcomes. Its calculation is Correct
  Payments / Payments Made, measured in percent (%). It originates from and is most used in Public sector
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
