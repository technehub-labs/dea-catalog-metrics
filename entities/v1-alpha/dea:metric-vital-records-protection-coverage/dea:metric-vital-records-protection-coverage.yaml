id: dea:metric-vital-records-protection-coverage
name: Vital Records Protection Coverage
type: Metric
description: Within Business Continuity & Disaster Recovery, Vital Records Protection Coverage (VRPC)
  is used to gauge conformance to standards, plans, or obligations. Its value drives prioritization and
  resource reallocation among competing initiatives. Its calculation is Vital Records Stored per Retention
  and Protection Standard / Vital Records, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
