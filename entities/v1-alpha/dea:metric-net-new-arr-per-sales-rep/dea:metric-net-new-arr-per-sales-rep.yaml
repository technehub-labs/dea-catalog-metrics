id: dea:metric-net-new-arr-per-sales-rep
name: Net New ARR per Sales Rep
type: Metric
description: Net New ARR per Sales Rep (NNAR) addresses how efficiently resources are converted into outputs
  and is a fixture of unit economics & growth (deep dive) reporting. It is defined as Net New ARR / Quota-Carrying
  Reps; the result is stated in currency per unit. In Software, it is a recognized element of the standard
  performance toolkit. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: NNAR
unit: currency
