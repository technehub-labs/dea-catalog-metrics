id: dea:metric-shared-service-adoption-ratio-deep-dive
name: Shared Service Adoption Ratio (Deep Dive)
type: Metric
description: 'Shared Service Adoption Ratio (Deep Dive) (SSAR-D) captures how efficiently resources are
  converted into outputs for organizations tracking operating model monitoring & design effectiveness.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is computed as Business Units Using Shared Services / Eligible Units, expressed in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.'
abbreviation: SSAR-D
