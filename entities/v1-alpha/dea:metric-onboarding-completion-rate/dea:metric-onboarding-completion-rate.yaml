id: dea:metric-onboarding-completion-rate
name: Onboarding Completion Rate
type: Metric
description: 'Onboarding Completion Rate (OCR) addresses how effectively a process or entity achieves
  its intended outcome and is a fixture of customer success (b2b saas) reporting. The formula is Accounts
  Completing Onboarding Milestones / New Accounts - reported in percent (%). It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. Higher values are better; gains
  are read as improvement and losses as deterioration. It is a standard measure in the Software & SaaS
  sector.'
abbreviation: OCR
unit: percent
