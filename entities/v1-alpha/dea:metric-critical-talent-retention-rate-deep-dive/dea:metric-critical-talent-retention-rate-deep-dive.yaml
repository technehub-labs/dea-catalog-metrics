id: dea:metric-critical-talent-retention-rate-deep-dive
name: Critical Talent Retention Rate (Deep Dive)
type: Metric
description: 'Critical Talent Retention Rate (Deep Dive) (CTRR-D) captures the retention of customers,
  users, or assets over time for organizations tracking balanced scorecard - learning & growth perspective.
  It is computed as Critical Role Holders Retained / Critical Role Holders, expressed in percent (%).
  It is applied across virtually every sector. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It should be maximized within the limits of cost and quality
  trade-offs.'
abbreviation: CTRR-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
