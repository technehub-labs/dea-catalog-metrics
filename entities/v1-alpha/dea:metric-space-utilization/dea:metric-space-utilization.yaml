id: dea:metric-space-utilization
name: Space Utilization
type: Metric
description: Space Utilization (SUT) captures the utilization or availability of capacity for organizations
  tracking facilities & real estate. It is defined as Occupied Workspaces / Total Workspaces; the result
  is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SUT
unit: percent
