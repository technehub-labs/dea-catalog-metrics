id: dea:metric-greenhouse-gas-scope-1-emissions
name: Greenhouse Gas Scope 1 Emissions
type: Metric
description: Within Sustainability & ESG, Greenhouse Gas Scope 1 Emissions (GHG1) is used to gauge environmental
  and social sustainability performance. The formula is Direct Emissions from Owned or Controlled Sources
  - reported in tonnes CO2 equivalent (tCO2e). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction
  is the goal, and sustained decreases indicate successful intervention.
