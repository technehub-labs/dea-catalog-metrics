id: dea:metric-erp-batch-job-success-rate
name: ERP Batch Job Success Rate
type: Metric
description: 'ERP Batch Job Success Rate (EBJS) addresses the quality of outputs and outcomes and is a
  fixture of erp & enterprise application operations reporting. The formula is Successful Batch Runs /
  Scheduled Runs - reported in percent (%). It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: EBJS
unit: percent
