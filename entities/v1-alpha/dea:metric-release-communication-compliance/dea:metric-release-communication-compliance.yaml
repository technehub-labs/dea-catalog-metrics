id: dea:metric-release-communication-compliance
name: Release Communication Compliance
type: Metric
description: Release Communication Compliance (RCC-RM) addresses conformance to standards, plans, or obligations
  and is a fixture of release management & environments reporting. It is computed as Stakeholder Notices
  Sent per Policy / Releases, expressed in percent (%). Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
