id: dea:metric-on-time-in-full
name: On-Time In-Full
type: Metric
description: 'On-Time In-Full (OTIF) addresses the quality of outputs and outcomes and is a fixture of
  supply chain reporting. It is computed as Orders Delivered On Time and Complete / Total Orders, expressed
  in percent (%). It is applied across virtually every sector. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. It should be maximized within the limits
  of cost and quality trade-offs.'
abbreviation: OTIF
unit: percent
version: 1.0.1
