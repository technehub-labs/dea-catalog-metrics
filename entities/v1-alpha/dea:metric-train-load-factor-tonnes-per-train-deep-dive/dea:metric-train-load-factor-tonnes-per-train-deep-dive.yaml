id: dea:metric-train-load-factor-tonnes-per-train-deep-dive
name: Train Load Factor - Tonnes per Train (Deep Dive)
type: Metric
description: Within Rail Freight (Deep Dive), Train Load Factor - Tonnes per Train (Deep Dive) (TLF-D)
  is used to gauge how efficiently resources are converted into outputs. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Net Tonnes
  / Trains, measured in tonnes. Improvement means raising this figure toward best-in-class levels. It
  originates from and is most used in Rail practice.
