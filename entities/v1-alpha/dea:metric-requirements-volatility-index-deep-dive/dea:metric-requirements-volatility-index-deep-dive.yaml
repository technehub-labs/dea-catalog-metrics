id: dea:metric-requirements-volatility-index-deep-dive
name: Requirements Volatility Index (Deep Dive)
type: Metric
description: Requirements Volatility Index (Deep Dive) (RVI-D) captures exposure to adverse outcomes for
  organizations tracking project management (deep dive). It is defined as Changed Requirements after Freeze
  / Baseline Requirements; the result is stated in percent (%). It is applied across virtually every sector.
  It bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  Reduction is the goal, and sustained decreases indicate successful intervention.
