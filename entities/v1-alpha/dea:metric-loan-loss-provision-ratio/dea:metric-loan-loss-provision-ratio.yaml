id: dea:metric-loan-loss-provision-ratio
name: Loan Loss Provision Ratio
type: Metric
description: 'Loan Loss Provision Ratio (LLPR) measures exposure to adverse outcomes in the Banking &
  Financial Services domain. It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. The formula is Loan Loss Provisions / Gross Loans - reported in percent
  (%). The objective is neither maximization nor minimization but staying within an agreed operating band.
  It is a standard measure in the Financial services sector.'
abbreviation: LLPR
unit: percent
version: 1.1.0
