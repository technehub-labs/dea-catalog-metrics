id: dea:metric-budget-execution-rate-government
name: Budget Execution Rate (Government)
type: Metric
description: Budget Execution Rate (Government) (BER-G) measures conformance to standards, plans, or obligations
  in the Government & Public Administration domain. Its calculation is Actual Spend / Approved Budget,
  measured in percent (%). It originates from and is most used in Public Sector practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Values outside
  the intended band, on either side, warrant investigation.
abbreviation: BER-G
unit: percent
