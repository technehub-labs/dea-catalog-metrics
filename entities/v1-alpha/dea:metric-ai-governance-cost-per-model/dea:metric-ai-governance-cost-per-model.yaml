id: dea:metric-ai-governance-cost-per-model
name: AI Governance Cost per Model
type: Metric
description: AI Governance Cost per Model (AIGCM) addresses how efficiently resources are converted into
  outputs and is a fixture of ai governance & model risk management reporting. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Governance and Validation
  Cost / Active Models, measured in currency value. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
