id: dea:metric-profit-per-employee-deep-dive
name: Profit per Employee (Deep Dive)
type: Metric
description: 'A Standard Workforce & Pay Metrics indicator, Profit per Employee (Deep Dive) (PPE-WF) quantifies
  the economic value created or preserved. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Operating Profit / Average Headcount, expressed
  in currency per unit. Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
