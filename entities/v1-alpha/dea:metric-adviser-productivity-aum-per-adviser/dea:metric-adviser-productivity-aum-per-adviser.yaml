description: Adviser Productivity - AUM per Adviser (APA-W) captures how efficiently resources are converted
  into outputs for organizations tracking asset & wealth management (deep dive). It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Its calculation
  is AUM / Advisers, measured in currency per unit. Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Financial Services practice.
