id: dea:metric-process-capability-index
name: Process Capability Index
type: Metric
description: 'Process Capability Index (Cpk) captures the quality of outputs and outcomes for organizations
  tracking quality management. The formula is min(USL - Mean, Mean - LSL) / (3 x Std Dev) - reported in
  ratio (x:1 or x). It is applied across virtually every sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. It should be maximized within the limits
  of cost and quality trade-offs.'
abbreviation: Cpk
unit: ratio
version: 1.1.0
