id: dea:metric-single-point-of-failure-count-deep-dive
name: Single Point of Failure Count (Deep Dive)
type: Metric
description: Single Point of Failure Count (Deep Dive) (SPOFC) addresses exposure to adverse outcomes
  and is a fixture of software architecture & technical design reporting. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Architectural
  Single Points of Failure in Production, measured in count (items per period). It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.
