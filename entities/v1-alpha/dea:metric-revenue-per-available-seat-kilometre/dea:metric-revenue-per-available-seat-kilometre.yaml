id: dea:metric-revenue-per-available-seat-kilometre
name: Revenue per Available Seat Kilometre
type: Metric
description: Within Airlines & Aviation, Revenue per Available Seat Kilometre (RASK) is used to gauge
  the economic value created or preserved. Its calculation is Passenger Revenue / Available Seat Kilometres,
  measured in currency per unit. It originates from and is most used in Airlines & aviation practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: RASK
