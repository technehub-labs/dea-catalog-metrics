id: dea:metric-market-penetration-rate-deep-dive
name: Market Penetration Rate (Deep Dive)
type: Metric
description: 'A Market Structure & Economics Standard Measures indicator, Market Penetration Rate (Deep
  Dive) (MPRDD) quantifies growth over time. It is computed as Users of Product / Total Potential Users,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
