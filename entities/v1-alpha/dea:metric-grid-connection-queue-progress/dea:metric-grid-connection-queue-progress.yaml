id: dea:metric-grid-connection-queue-progress
name: Grid Connection Queue Progress
type: Metric
description: Grid Connection Queue Progress (GCQP) addresses the utilization or availability of capacity
  and is a fixture of energy transition & renewables reporting. It is defined as Projects with Executed
  Grid Agreement / Projects in Queue; the result is stated in percent (%). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Higher values are better; gains are
  read as improvement and losses as deterioration. In Renewable energy, it is a recognized element of
  the standard performance toolkit.
abbreviation: GCQP
unit: percent
