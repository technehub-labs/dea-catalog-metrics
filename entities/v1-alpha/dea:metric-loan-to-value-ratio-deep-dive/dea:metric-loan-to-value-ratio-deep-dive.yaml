id: dea:metric-loan-to-value-ratio-deep-dive
name: Loan-to-Value Ratio (Deep Dive)
type: Metric
description: Within Real Estate & Mortgage Standard Measures, Loan-to-Value Ratio (Deep Dive) (LTVDD)
  is used to gauge exposure to adverse outcomes. It is defined as Loan Amount / Appraised Property Value;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Lower values are better; each reduction is an improvement. In Real estate,
  it is a recognized element of the standard performance toolkit.
