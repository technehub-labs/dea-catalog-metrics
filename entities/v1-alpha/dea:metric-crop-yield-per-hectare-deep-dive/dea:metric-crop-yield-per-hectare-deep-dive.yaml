name: Crop Yield per Hectare (Deep Dive)
type: Metric
description: Crop Yield per Hectare (Deep Dive) (CYH-D) measures how effectively a process or entity achieves
  its intended outcome in the Agriculture & Agronomy (Deep Dive) domain. Its calculation is Harvested
  Tonnes / Hectares, measured in tonnes. It originates from and is most used in Agriculture practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
