id: dea:metric-original-content-roi-streaming
name: Original Content ROI (Streaming)
type: Metric
description: Original Content ROI (Streaming) (OCR-S) measures the economic value created or preserved
  in the Broadcasting & Streaming Media domain. Its calculation is Attributed Subscriber Value / Content
  Cost, measured in ratio (x:1 or x). It originates from and is most used in Media & Entertainment practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: OCR-S
