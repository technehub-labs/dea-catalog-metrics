id: dea:metric-fixed-asset-turnover
name: Fixed Asset Turnover
type: Metric
description: Fixed Asset Turnover (FAT) addresses how efficiently resources are converted into outputs
  and is a fixture of finance & accounting reporting. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Revenue / Net Fixed Assets, measured in ratio (x:1 or
  x). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any industry
  can adopt it directly.
