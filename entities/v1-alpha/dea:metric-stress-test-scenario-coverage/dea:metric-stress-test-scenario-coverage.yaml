id: dea:metric-stress-test-scenario-coverage
name: Stress Test Scenario Coverage
type: Metric
description: 'Within Investment Risk & Middle Office Operations, Stress Test Scenario Coverage (STSC)
  is used to gauge conformance to standards, plans, or obligations. It is computed as Mandated Scenarios
  Executed / Required Scenarios, expressed in percent (%). Its use is concentrated in Investment management.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
