id: dea:metric-attrition-predictive-precision
name: Attrition Predictive Precision
type: Metric
description: Attrition Predictive Precision (APP) captures the quality of outputs and outcomes for organizations
  tracking workforce planning & analytics. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is True At-Risk Departures Predicted / Predicted Departures,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
