id: dea:metric-stakeholder-satisfaction-with-audit
name: Stakeholder Satisfaction with Audit
type: Metric
description: 'Within Internal Audit, Stakeholder Satisfaction with Audit (SSA) is used to gauge the engagement
  or satisfaction of the people involved. The formula is Satisfied Audit Client Survey Responses / Responses
  - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: SSA
unit: percent
