id: dea:metric-compensation-ratio-to-market
name: Compensation Ratio to Market
type: Metric
description: 'Compensation Ratio to Market (CRM) addresses the economic value created or preserved and
  is a fixture of human resources reporting. It is computed as Average Salary / Market Median Salary,
  expressed in ratio (x:1 or x). It is applied across virtually every sector. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Values outside the intended
  band, on either side, warrant investigation.'
abbreviation: CRM
