id: dea:metric-process-cycle-time
name: Process Cycle Time
type: Metric
description: 'A Operations indicator, Process Cycle Time (PCT) quantifies how efficiently resources are
  converted into outputs. It is a working-level control: thresholds trigger immediate operational response.
  It is defined as End-to-End Elapsed Time of Process; the result is stated in hours. It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.'
