id: dea:metric-portfolio-capacity-utilization-pmo
name: Portfolio Capacity Utilization (PMO)
type: Metric
description: Portfolio Capacity Utilization (PMO) (PCU-P) addresses the utilization or availability of
  capacity and is a fixture of pmo & portfolio governance reporting. The formula is Committed Demand /
  Available Delivery Capacity - reported in percent (%). It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It is managed toward a defined target band
  rather than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: PCU-P
unit: percent
