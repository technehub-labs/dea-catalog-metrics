id: dea:metric-emergency-assistance-disbursement-time
name: Emergency Assistance Disbursement Time
type: Metric
description: Emergency Assistance Disbursement Time (EADT) addresses how efficiently resources are converted
  into outputs and is a fixture of public sector & citizen service standard measures (deep dive) reporting.
  The formula is Days from Eligibility Confirmed to Funds Received - reported in days. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. Lower values are
  better; each reduction is an improvement. It is a standard measure in the Public sector sector.
