id: dea:metric-policy-lifecycle-currency-rate
name: Policy Lifecycle Currency Rate
type: Metric
description: Policy Lifecycle Currency Rate (PLCR-GOV) addresses conformance to standards, plans, or obligations
  and is a fixture of enterprise decision effectiveness & governance monitoring reporting. The formula
  is Policies Reviewed within Cycle / Policies - reported in percent (%). It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
