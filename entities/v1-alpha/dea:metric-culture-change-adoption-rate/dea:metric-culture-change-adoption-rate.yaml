id: dea:metric-culture-change-adoption-rate
name: Culture Change Adoption Rate
type: Metric
description: 'Culture Change Adoption Rate (CCAR) captures transformation for organizations tracking culture
  & employee experience. It is computed as Behaviors Demonstrating Target Culture Observed / Behaviors
  Expected, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: CCAR
unit: percent
