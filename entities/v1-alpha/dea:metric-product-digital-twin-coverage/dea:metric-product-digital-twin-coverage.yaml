id: dea:metric-product-digital-twin-coverage
name: Product Digital Twin Coverage
type: Metric
description: 'Product Digital Twin Coverage (PDTC) addresses capability maturity or development and is
  a fixture of digital transformation reporting. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. The formula is Products with Digital Twin / Products
  in Scope - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
