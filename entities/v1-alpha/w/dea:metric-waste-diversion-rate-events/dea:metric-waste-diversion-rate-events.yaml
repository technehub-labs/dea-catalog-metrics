id: dea:metric-waste-diversion-rate-events
name: Waste Diversion Rate (Events)
type: Metric
description: A Events & Exhibitions indicator, Waste Diversion Rate (Events) (WDR-E) quantifies environmental
  and social sustainability performance. Its calculation is Waste Diverted from Landfill / Total Waste,
  measured in percent (%). It originates from and is most used in Media & Entertainment practice. Its
  value drives prioritization and resource reallocation among competing initiatives. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: WDR-E
unit: percent
