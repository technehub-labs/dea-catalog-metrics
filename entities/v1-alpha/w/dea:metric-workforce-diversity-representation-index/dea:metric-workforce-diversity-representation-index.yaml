id: dea:metric-workforce-diversity-representation-index
name: Workforce Diversity Representation Index
type: Metric
description: Workforce Diversity Representation Index (WDRI) addresses capability maturity or development
  and is a fixture of diversity, equity & inclusion (deep dive) reporting. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Composite Representation
  across Levels vs Labor Market; the result is stated in index (0-100 or normalized). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: WDRI
