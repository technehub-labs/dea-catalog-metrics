id: dea:metric-workforce-scheduling-efficiency-field
name: Workforce Scheduling Efficiency - Field
type: Metric
description: Workforce Scheduling Efficiency - Field (WSEF) measures how efficiently resources are converted
  into outputs in the Field Maintenance & Technical Field Service (Deep Dive) domain. It is computed as
  Jobs Scheduled versus Travel-Optimized Plan / Plan, expressed in percent (%). It is reviewed at cadence
  by planning owners to correct course before issues become strategic. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: WSEF
unit: percent
version: 1.1.0
