id: dea:metric-warranty-recovery-rate-mro
name: Warranty Recovery Rate (MRO)
type: Metric
description: Within Aviation Maintenance Repair & Overhaul, Warranty Recovery Rate (MRO) (WRR-MRO) is
  used to gauge the economic value created or preserved. It is computed as Recovered Warranty Value /
  Eligible Warranty Value, expressed in percent (%). It is reviewed at cadence by planning owners to correct
  course before issues become strategic. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is concentrated in Airlines & aviation.
abbreviation: WRR-MRO
unit: percent
version: 1.1.0
