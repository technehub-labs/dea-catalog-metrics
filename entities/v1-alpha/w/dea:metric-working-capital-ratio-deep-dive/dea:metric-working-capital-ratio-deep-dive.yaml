id: dea:metric-working-capital-ratio-deep-dive
name: Working Capital Ratio (Deep Dive)
type: Metric
description: Working Capital Ratio (Deep Dive) (WCR-D) addresses exposure to adverse outcomes and is a
  fixture of corporate treasury (deep dive) reporting. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Current Assets / Current
  Liabilities, measured in ratio (x:1 or x). The objective is neither maximization nor minimization but
  staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: WCR-D
unit: ratio
