id: dea:metric-warranty-cost-per-vehicle
name: Warranty Cost per Vehicle
type: Metric
description: 'Within Automotive, Warranty Cost per Vehicle (WCPV) is used to gauge exposure to adverse
  outcomes. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. It is computed as Total Warranty Cost / Vehicles Sold, expressed in currency per unit. It
  should be driven down, since lower readings signal healthier performance. Its use is concentrated in
  Automotive.'
abbreviation: WCPV
unit: currency
