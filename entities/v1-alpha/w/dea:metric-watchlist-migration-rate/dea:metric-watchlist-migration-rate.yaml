id: dea:metric-watchlist-migration-rate
name: Watchlist Migration Rate
type: Metric
description: A Credit & Collections Risk (Enterprise) indicator, Watchlist Migration Rate (WMR-CC) quantifies
  exposure to adverse outcomes. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is Accounts Migrating to Watchlist / Monitored Accounts, measured in percent
  (%). It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: WMR-CC
unit: percent
version: 1.1.0
