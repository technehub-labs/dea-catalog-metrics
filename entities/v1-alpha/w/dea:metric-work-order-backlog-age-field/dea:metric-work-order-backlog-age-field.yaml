id: dea:metric-work-order-backlog-age-field
name: Work Order Backlog Age - Field
type: Metric
description: A Field Maintenance & Technical Field Service (Deep Dive) indicator, Work Order Backlog Age
  - Field (WOBA-F) quantifies how efficiently resources are converted into outputs. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It is computed as Open
  Field Work Orders beyond Target / Open Orders, expressed in percent (%). It should be driven down, since
  lower readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: WOBA-F
unit: percent
version: 1.1.0
lifecycle_status: candidate
