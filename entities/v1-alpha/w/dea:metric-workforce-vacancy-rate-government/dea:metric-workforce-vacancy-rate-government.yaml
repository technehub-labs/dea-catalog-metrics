id: dea:metric-workforce-vacancy-rate-government
name: Workforce Vacancy Rate (Government)
type: Metric
description: Workforce Vacancy Rate (Government) (WVR-G) captures the utilization or availability of capacity
  for organizations tracking government & public administration. Its calculation is Unfilled Positions
  / Funded Positions, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Lower values are better; each reduction is an improvement.
  It originates from and is most used in Public Sector practice.
abbreviation: WVR-G
unit: percent
