id: dea:metric-warranty-cost-per-vehicle-deep-dive
name: Warranty Cost per Vehicle (Deep Dive)
type: Metric
description: Warranty Cost per Vehicle (Deep Dive) (WCPV-D) measures exposure to adverse outcomes in the
  Automotive Manufacturing (Deep Dive) domain. The formula is Warranty Spend / Vehicles Sold - reported
  in currency per unit. It is a standard measure in the Automotive sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
