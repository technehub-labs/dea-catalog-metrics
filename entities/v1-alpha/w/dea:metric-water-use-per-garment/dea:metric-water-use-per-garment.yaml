id: dea:metric-water-use-per-garment
name: Water Use per Garment
type: Metric
description: Water Use per Garment (WUG) measures environmental and social sustainability performance
  in the Textile & Apparel (Deep Dive) domain. Its calculation is Litres of Water Used / Garment, measured
  in kilolitres (kl). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Lower values are better; each reduction is an improvement. It originates from
  and is most used in Textiles & Apparel practice.
