id: dea:metric-write-off-rate
name: Write-Off Rate
type: Metric
description: 'Write-Off Rate (WOR) addresses exposure to adverse outcomes and is a fixture of professional
  services reporting. The formula is Billed but Uncollected Fees / Standard Fees - reported in percent
  (%). It is a standard measure in the Professional services sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
abbreviation: WOR
unit: percent
version: 1.1.0
