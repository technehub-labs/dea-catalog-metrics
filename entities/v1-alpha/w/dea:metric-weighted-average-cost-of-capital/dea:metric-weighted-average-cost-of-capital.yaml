id: dea:metric-weighted-average-cost-of-capital
name: Weighted Average Cost of Capital
type: Metric
description: 'Weighted Average Cost of Capital (WACC) captures the economic value created or preserved
  for organizations tracking treasury & cash management. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Weighted Average of Cost of Equity
  and After-Tax Cost of Debt, expressed in percent (%). It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: WACC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
- value_delivery
scope_classification:
- capability
directionality: lower_is_better
management_significance:
