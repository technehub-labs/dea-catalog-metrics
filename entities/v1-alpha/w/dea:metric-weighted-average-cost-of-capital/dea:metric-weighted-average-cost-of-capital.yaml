measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Weighted Average of Cost of Equity and After-Tax Cost of Debt
formula_definition:
  formula_id: dea:formula-weighted-average-cost-of-capital
  expression: WACC = Weighted Average of Cost of Equity and After-Tax Cost of Debt
  inputs:
  - name: Weighted Average of Cost of Equity and After
  - name: Tax Cost of Debt
