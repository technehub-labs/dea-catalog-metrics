id: dea:metric-duplicate-record-rate-deep-dive
name: Duplicate Record Rate (Deep Dive)
type: Metric
description: 'A Data Quality Management indicator, Duplicate Record Rate (Deep Dive) (DRR-DQ) quantifies
  the quality of outputs and outcomes. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Duplicate Records / Total Records - reported in percent (%).
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
abbreviation: DRR-DQ
unit: percent
version: 1.0.1
