id: dea:metric-privacy-consent-compliance-rate
name: Privacy Consent Compliance Rate
type: Metric
description: Privacy Consent Compliance Rate (PCCR-A) addresses conformance to standards, plans, or obligations
  and is a fixture of customer analytics & insights reporting. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Profiles with Valid Marketing
  Consent / Profiles Marketed - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
