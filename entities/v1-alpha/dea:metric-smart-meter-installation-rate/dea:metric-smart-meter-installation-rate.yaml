id: dea:metric-smart-meter-installation-rate
name: Smart Meter Installation Rate
type: Metric
description: Smart Meter Installation Rate (SMIR) addresses capability maturity or development and is
  a fixture of utilities customer operations reporting. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Smart Meters Installed / Meters in Service;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  In Utilities, it is a recognized element of the standard performance toolkit.
