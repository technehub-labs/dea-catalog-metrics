name: Latency - Round Trip 95th Percentile (Deep Dive)
type: Metric
description: Within Telecom Network Operations (Deep Dive), Latency - Round Trip 95th Percentile (Deep
  Dive) (RTT95) is used to gauge the quality of outputs and outcomes. It is computed as 95th Percentile
  Round-Trip Time, expressed in milliseconds (ms). Its use is concentrated in Telecommunications. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. Reduction
  is the goal, and sustained decreases indicate successful intervention.
