id: dea:metric-process-z-score-short-term
name: Process Z-Score (Short Term)
type: Metric
description: 'Process Z-Score (Short Term) (PZST) captures the quality of outputs and outcomes for organizations
  tracking process capability & six sigma (deep dive). The formula is Sigma Distance of Mean to Nearest
  Spec Limit - reported in score (points). It is a standard measure in the Manufacturing sector. It is
  monitored close to the work: teams act on it within a shift, sprint, or daily review. It should be maximized
  within the limits of cost and quality trade-offs.'
abbreviation: PZST
unit: score
