id: dea:metric-post-marketing-study-commitment-compliance
name: Post-Marketing Study Commitment Compliance
type: Metric
description: Post-Marketing Study Commitment Compliance (PMSC) addresses conformance to standards, plans,
  or obligations and is a fixture of pharma r&d & clinical trials reporting. It is defined as Commitments
  on Schedule / Commitments Made; the result is stated in percent (%). In Pharmaceuticals, it is a recognized
  element of the standard performance toolkit. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
