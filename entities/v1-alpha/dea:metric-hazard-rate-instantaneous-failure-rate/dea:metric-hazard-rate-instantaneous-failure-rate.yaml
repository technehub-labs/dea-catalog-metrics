id: dea:metric-hazard-rate-instantaneous-failure-rate
name: Hazard Rate (Instantaneous Failure Rate)
type: Metric
description: 'A Reliability & Maintainability Engineering (Deep Dive) indicator, Hazard Rate (Instantaneous
  Failure Rate) (HRIFR) quantifies exposure to adverse outcomes. The formula is Failures in Interval /
  Surviving Units at Interval Start - reported in events per thousand or million (scaled). It is applied
  across virtually every sector. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: HRIFR
