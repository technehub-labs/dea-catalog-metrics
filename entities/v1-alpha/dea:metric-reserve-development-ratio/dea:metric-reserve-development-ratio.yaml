id: dea:metric-reserve-development-ratio
name: Reserve Development Ratio
type: Metric
description: 'Reserve Development Ratio (RDR) addresses exposure to adverse outcomes and is a fixture
  of actuarial & reserving reporting. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Ultimate Claims / Initially Estimated Claims, expressed
  in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Its use is concentrated in Insurance.'
