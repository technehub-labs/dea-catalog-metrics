id: dea:metric-bandwidth-cost-per-gb-delivered
name: Bandwidth Cost per GB Delivered
type: Metric
description: Within Network Performance & Capacity, Bandwidth Cost per GB Delivered (BCGB) is used to
  gauge how efficiently resources are converted into outputs. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Network Spend / GB Delivered, expressed
  in currency per unit. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
