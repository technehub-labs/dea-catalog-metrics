id: dea:metric-energy-savings-project-realization
name: Energy Savings Project Realization
type: Metric
description: Energy Savings Project Realization (ESPR) measures the economic value created or preserved
  in the Operations Energy Management domain. It is defined as Realized Savings / Committed Savings from
  Projects; the result is stated in percent (%). It is applied across virtually every sector. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. It should be maximized
  within the limits of cost and quality trade-offs.
