id: dea:metric-liquidity-coverage-ratio
name: Liquidity Coverage Ratio
type: Metric
description: Liquidity Coverage Ratio (LCR) measures exposure to adverse outcomes in the Banking & Financial
  Services domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is High-Quality Liquid Assets / Net Cash Outflows over 30 Days,
  measured in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. It
  originates from and is most used in Financial services practice.
