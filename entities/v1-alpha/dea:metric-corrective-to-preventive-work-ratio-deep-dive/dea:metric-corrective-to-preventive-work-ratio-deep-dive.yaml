id: dea:metric-corrective-to-preventive-work-ratio-deep-dive
name: Corrective-to-Preventive Work Ratio (Deep Dive)
type: Metric
description: 'A Field Maintenance & Technical Field Service (Deep Dive) indicator, Corrective-to-Preventive
  Work Ratio (Deep Dive) (CPPW-D) quantifies how efficiently resources are converted into outputs. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is computed as Corrective Hours / Preventive Hours, expressed in ratio (x:1 or x). It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.'
