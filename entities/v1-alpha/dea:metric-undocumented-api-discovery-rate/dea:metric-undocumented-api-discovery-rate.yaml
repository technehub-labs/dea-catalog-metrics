id: dea:metric-undocumented-api-discovery-rate
name: Undocumented API Discovery Rate
type: Metric
description: 'A API Lifecycle Management indicator, Undocumented API Discovery Rate (UADR) quantifies
  exposure to adverse outcomes. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. The formula is Shadow Endpoints Discovered per Discovery Cycle - reported in count
  (items per period). It should be driven down, since lower readings signal healthier performance. It
  is a standard measure in the Software sector.'
