id: dea:metric-d1-d7-d30-retention-deep-dive
name: D1 / D7 / D30 Retention (Deep Dive)
type: Metric
description: 'D1 / D7 / D30 Retention (Deep Dive) (RET-D) measures the retention of customers, users,
  or assets over time in the Gaming Development & Live Operations domain. It is computed as Returning
  Players on Day N / New Players, expressed in percent (%). It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is concentrated in Gaming.'
