name: Forecast Accuracy (Revenue)
type: Metric
description: Within Financial Planning & Analysis, Forecast Accuracy (Revenue) (FAR) is used to gauge
  the quality of outputs and outcomes. The formula is Absolute Variance of Forecast vs Actual / Actual
  - reported in percent (%). It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
