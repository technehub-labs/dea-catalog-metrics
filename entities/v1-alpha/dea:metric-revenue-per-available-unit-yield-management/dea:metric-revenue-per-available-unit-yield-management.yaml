id: dea:metric-revenue-per-available-unit-yield-management
name: Revenue per Available Unit (Yield Management)
type: Metric
description: Revenue per Available Unit (Yield Management) (RevPAU) addresses the economic value created
  or preserved and is a fixture of pricing & revenue management reporting. Its calculation is Revenue
  / Available Units per Period, measured in currency per unit. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: RevPAU
unit: currency
