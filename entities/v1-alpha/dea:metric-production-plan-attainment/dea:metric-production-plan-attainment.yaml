id: dea:metric-production-plan-attainment
name: Production Plan Attainment
type: Metric
description: 'Production Plan Attainment (PPA) measures conformance to standards, plans, or obligations
  in the Manufacturing domain. The formula is Actual Production / Planned Production - reported in percent
  (%). It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. Higher values are better; gains are read as improvement and losses as deterioration. It is a
  standard measure in the Manufacturing sector.'
abbreviation: PPA
unit: percent
version: 1.0.1
