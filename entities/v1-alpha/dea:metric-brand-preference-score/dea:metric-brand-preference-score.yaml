id: dea:metric-brand-preference-score
name: Brand Preference Score
type: Metric
description: 'Within Balanced Scorecard - Customer Perspective, Brand Preference Score (BPS-BSC) is used
  to gauge the engagement or satisfaction of the people involved. It is computed as Survey-Based Preference
  versus Competitors, expressed in score (points). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
