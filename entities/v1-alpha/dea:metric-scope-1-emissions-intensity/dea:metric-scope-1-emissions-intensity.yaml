id: dea:metric-scope-1-emissions-intensity
name: Scope 1 Emissions Intensity
type: Metric
description: Scope 1 Emissions Intensity (S1EI) captures environmental and social sustainability performance
  for organizations tracking environmental, social & governance reporting. It is defined as Scope 1 tCO2e
  / Revenue Unit; the result is stated in tonnes CO2 equivalent (tCO2e). It is applied across virtually
  every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Reduction is the goal, and sustained decreases indicate successful intervention.
