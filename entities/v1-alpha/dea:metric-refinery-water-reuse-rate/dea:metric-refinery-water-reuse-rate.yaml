id: dea:metric-refinery-water-reuse-rate
name: Refinery-Water Reuse Rate
type: Metric
description: Within Oil & Gas Downstream & Refining, Refinery-Water Reuse Rate (RWRR) is used to gauge
  environmental and social sustainability performance. It is computed as Reused Water / Total Water Withdrawn,
  expressed in percent (%). It is reviewed at cadence by planning owners to correct course before issues
  become strategic. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Oil & Gas.
abbreviation: RWRR
