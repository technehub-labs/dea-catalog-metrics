id: dea:metric-alert-to-incident-conversion-rate
name: Alert-to-Incident Conversion Rate
type: Metric
description: Within SecOps & Security Operations Center, Alert-to-Incident Conversion Rate (AICR-SOC)
  is used to gauge how efficiently resources are converted into outputs. It provides the day-to-day signal
  that a process is running as designed. Its calculation is Alerts Escalated to Incidents / Alerts, measured
  in percent (%). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.
