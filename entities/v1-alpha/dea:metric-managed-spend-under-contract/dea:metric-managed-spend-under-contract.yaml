id: dea:metric-managed-spend-under-contract
name: Managed Spend under Contract
type: Metric
description: Managed Spend under Contract (MSUC) captures conformance to standards, plans, or obligations
  for organizations tracking strategic sourcing & supplier performance (deep dive). Its calculation is
  Contracted Spend / Addressable Spend, measured in percent (%). It is applied across virtually every
  sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. It should be maximized within the limits of cost and quality trade-offs.
