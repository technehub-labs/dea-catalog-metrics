id: dea:metric-waste-diversion-rate
name: Waste Diversion Rate
type: Metric
description: 'A Sustainability & ESG indicator, Waste Diversion Rate (WDR) quantifies environmental and
  social sustainability performance. The formula is Non-Landfilled Waste / Total Waste - reported in percent
  (%). It is applied across virtually every sector. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. It should be maximized within the limits of cost
  and quality trade-offs.'
