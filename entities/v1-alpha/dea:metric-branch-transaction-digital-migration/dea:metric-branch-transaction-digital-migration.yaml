id: dea:metric-branch-transaction-digital-migration
name: Branch Transaction Digital Migration
type: Metric
description: 'Branch Transaction Digital Migration (BTDM) captures how efficiently resources are converted
  into outputs for organizations tracking retail banking & lending. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Digitally Originated
  Transactions / Total Transactions, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Banking.'
