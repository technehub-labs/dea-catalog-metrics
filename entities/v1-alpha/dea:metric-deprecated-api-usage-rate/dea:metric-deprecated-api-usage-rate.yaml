id: dea:metric-deprecated-api-usage-rate
name: Deprecated API Usage Rate
type: Metric
description: Deprecated API Usage Rate (DAUR) addresses exposure to adverse outcomes and is a fixture
  of software development - coding & engineering practices reporting. It is computed as Calls to Deprecated
  APIs / Total Internal API Calls, expressed in percent (%). Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DAUR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- risk
scope_classification:
- capability
directionality: lower_is_better
management_significance:
- operational
measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Calls to Deprecated APIs / Total Internal API Calls
formula_definition:
  formula_id: dea:formula-deprecated-api-usage-rate
  expression: DAUR = Calls to Deprecated APIs / Total Internal API Calls
  inputs:
  - name: Calls to Deprecated APIs
  - name: Total Internal API Calls
  operators: []
  parameters: []
  unit_semantics:
