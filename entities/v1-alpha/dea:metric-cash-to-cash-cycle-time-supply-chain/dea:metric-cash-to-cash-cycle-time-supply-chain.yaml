id: dea:metric-cash-to-cash-cycle-time-supply-chain
name: Cash-to-Cash Cycle Time (Supply Chain)
type: Metric
description: Cash-to-Cash Cycle Time (Supply Chain) (C2C) measures how efficiently resources are converted
  into outputs in the Supply Chain Standard Measures (Deep Dive) domain. Its calculation is DIO + DSO
  - DPO across Chain, measured in days. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
