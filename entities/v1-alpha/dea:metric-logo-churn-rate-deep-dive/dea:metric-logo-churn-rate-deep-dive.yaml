id: dea:metric-logo-churn-rate-deep-dive
name: Logo Churn Rate (Deep Dive)
type: Metric
description: 'Within Software Product Operations (Deep Dive), Logo Churn Rate (Deep Dive) (LCR-D) is used
  to gauge the retention of customers, users, or assets over time. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Cancelled Accounts
  / Total Accounts, expressed in percent (%). It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Technology.'
