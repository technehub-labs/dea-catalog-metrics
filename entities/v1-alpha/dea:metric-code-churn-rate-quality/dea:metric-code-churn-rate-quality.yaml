id: dea:metric-code-churn-rate-quality
name: Code Churn Rate (Quality)
type: Metric
description: A Code Quality & Static Analysis indicator, Code Churn Rate (Quality) (CHURNQ) quantifies
  exposure to adverse outcomes. It provides the day-to-day signal that a process is running as designed.
  Its calculation is Lines Rewritten within Window after First Write / Lines, measured in percent (%).
  It should be driven down, since lower readings signal healthier performance. It originates from and
  is most used in Software practice.
