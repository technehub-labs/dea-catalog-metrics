id: dea:metric-retention-parity-ratio
name: Retention Parity Ratio
type: Metric
description: 'Retention Parity Ratio (RTP) measures conformance to standards, plans, or obligations in
  the Diversity, Equity & Inclusion domain. It is computed as Retention Rate of Underrepresented Group
  / Retention Rate Overall, expressed in ratio (x:1 or x). It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is managed toward a defined target band
  rather than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
