id: dea:metric-critical-knowledge-flight-risk
name: Critical Knowledge Flight Risk
type: Metric
description: Critical Knowledge Flight Risk (CKFR) measures exposure to adverse outcomes in the Knowledge
  Management (Deep Dive) domain. It is defined as Sole-Source Experts Nearing Departure Risk / Sole-Source
  Expertise; the result is stated in percent (%). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CKFR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
