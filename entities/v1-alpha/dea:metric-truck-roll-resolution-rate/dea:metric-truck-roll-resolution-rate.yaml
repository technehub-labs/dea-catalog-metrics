id: dea:metric-truck-roll-resolution-rate
name: Truck Roll Resolution Rate
type: Metric
description: 'A Field Maintenance & Technical Field Service (Deep Dive) indicator, Truck Roll Resolution
  Rate (TRRR) quantifies how efficiently resources are converted into outputs. It is computed as Issues
  Resolved without Truck Roll via Remote Support / Issues, expressed in percent (%). It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
