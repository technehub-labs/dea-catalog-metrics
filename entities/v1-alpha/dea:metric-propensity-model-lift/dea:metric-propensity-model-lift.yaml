id: dea:metric-propensity-model-lift
name: Propensity Model Lift
type: Metric
description: Propensity Model Lift (PML) measures the quality of outputs and outcomes in the Customer
  Analytics & Insights domain. The formula is Model Response Rate / Baseline Response Rate - reported
  in ratio (x:1 or x). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
