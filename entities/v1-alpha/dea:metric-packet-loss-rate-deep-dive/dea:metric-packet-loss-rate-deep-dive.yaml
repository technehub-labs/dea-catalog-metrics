id: dea:metric-packet-loss-rate-deep-dive
name: Packet Loss Rate (Deep Dive)
type: Metric
description: Packet Loss Rate (Deep Dive) (PLR-D) addresses the quality of outputs and outcomes and is
  a fixture of telecom network operations (deep dive) reporting. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. It is computed as Lost Packets / Transmitted
  Packets, expressed in percent (%). It should be driven down, since lower readings signal healthier performance.
  Its use is concentrated in Telecommunications.
abbreviation: PLR-D
unit: percent
