id: dea:metric-mean-time-to-contain-security
name: Mean Time to Contain - Security
type: Metric
description: Within SecOps & Security Operations Center, Mean Time to Contain - Security (MTTC-S) is used
  to gauge how efficiently resources are converted into outputs. It is defined as Hours from Response
  to Containment; the result is stated in hours. It is applied across virtually every sector. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Reduction is the
  goal, and sustained decreases indicate successful intervention.
