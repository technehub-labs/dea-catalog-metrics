id: dea:metric-attrition-equity-gap
name: Attrition Equity Gap
type: Metric
description: Within Diversity, Equity & Inclusion (Deep Dive), Attrition Equity Gap (AEG-DEI) is used
  to gauge the retention of customers, users, or assets over time. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Attrition Rate Difference
  between Groups - reported in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
