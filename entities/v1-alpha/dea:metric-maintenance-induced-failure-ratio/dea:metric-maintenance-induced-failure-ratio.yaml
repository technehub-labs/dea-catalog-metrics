id: dea:metric-maintenance-induced-failure-ratio
name: Maintenance-Induced Failure Ratio
type: Metric
description: 'Maintenance-Induced Failure Ratio (MIFR) measures the quality of outputs and outcomes in
  the Reliability & Maintainability Engineering (Deep Dive) domain. The formula is Failures Attributable
  to Maintenance Error / Failures - reported in percent (%). It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: MIFR
unit: percent
