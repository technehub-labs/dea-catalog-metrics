id: dea:metric-onboarding-risk-assessment-cycle-time
name: Onboarding Risk Assessment Cycle Time
type: Metric
description: Onboarding Risk Assessment Cycle Time (ORACT) captures how efficiently resources are converted
  into outputs for organizations tracking third-party risk management. Its calculation is Days from Vendor
  Request to Risk-Cleared Onboarding, measured in days. It is applied across virtually every sector. Its
  value drives prioritization and resource reallocation among competing initiatives. Reduction is the
  goal, and sustained decreases indicate successful intervention.
