id: dea:metric-upside-capture-ratio-deep-dive
name: Upside Capture Ratio (Deep Dive)
type: Metric
description: Upside Capture Ratio (Deep Dive) (UCR-IM) captures how effectively a process or entity achieves
  its intended outcome for organizations tracking investment management - portfolio operations. It is
  defined as Fund Upside Return / Benchmark Upside Return; the result is stated in ratio (x:1 or x). Its
  trend is watched by senior leadership as an early signal of structural performance shifts. Higher values
  are better; gains are read as improvement and losses as deterioration. In Financial Services, it is
  a recognized element of the standard performance toolkit.
abbreviation: UCR-IM
unit: ratio
