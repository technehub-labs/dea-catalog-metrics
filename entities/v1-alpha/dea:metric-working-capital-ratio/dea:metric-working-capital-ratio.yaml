id: dea:metric-working-capital-ratio
name: Working Capital Ratio
type: Metric
description: Working Capital Ratio (WCR) addresses exposure to adverse outcomes and is a fixture of finance
  & accounting reporting. It is defined as Current Assets / Current Liabilities; the result is stated
  in ratio (x:1 or x). It is applied across virtually every sector. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Values outside the intended band, on either
  side, warrant investigation.
