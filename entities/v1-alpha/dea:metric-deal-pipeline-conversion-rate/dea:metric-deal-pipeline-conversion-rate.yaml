id: dea:metric-deal-pipeline-conversion-rate
name: Deal Pipeline Conversion Rate
type: Metric
description: Deal Pipeline Conversion Rate (DPCR) captures how effectively a process or entity achieves
  its intended outcome for organizations tracking mergers & acquisitions. It is defined as Deals Completed
  / Deals Screened; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: DPCR
unit: percent
version: 1.1.0
