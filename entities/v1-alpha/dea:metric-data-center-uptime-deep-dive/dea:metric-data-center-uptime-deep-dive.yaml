id: dea:metric-data-center-uptime-deep-dive
name: Data Center Uptime (Deep Dive)
type: Metric
description: 'Data Center Uptime (Deep Dive) (DCU-D) measures the utilization or availability of capacity
  in the Data Centers & Cloud Infrastructure domain. It is computed as Available Hours / Total Hours,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Technology.'
