id: dea:metric-30-day-readmission-rate-deep-dive
name: 30-Day Readmission Rate (Deep Dive)
type: Metric
description: A Healthcare Quality & Patient Safety Standard Measures indicator, 30-Day Readmission Rate
  (Deep Dive) (R30DD) quantifies the quality of outputs and outcomes. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Readmissions within
  30 Days / Discharges - reported in percent (%). It should be driven down, since lower readings signal
  healthier performance. It is a standard measure in the Healthcare sector.
