id: dea:metric-liquidity-buffer-compliance
name: Liquidity Buffer Compliance
type: Metric
description: Liquidity Buffer Compliance (LBC-T) captures exposure to adverse outcomes for organizations
  tracking corporate treasury (deep dive). Its calculation is Days Buffer Meets Policy / Days in Period,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
