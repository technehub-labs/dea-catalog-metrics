id: dea:metric-unplanned-outage-rate
name: Unplanned Outage Rate
type: Metric
description: Unplanned Outage Rate (UOR) measures exposure to adverse outcomes in the Energy & Utilities
  domain. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It is computed as Unplanned Outages / Total Operating Units per Period, expressed in ratio (x:1 or x).
  It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Energy & utilities.
abbreviation: UOR
unit: ratio
