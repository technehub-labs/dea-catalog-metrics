id: dea:metric-letter-of-credit-compliance-rate
name: Letter of Credit Compliance Rate
type: Metric
description: Within International Trade & Customs, Letter of Credit Compliance Rate (LCCR) is used to
  gauge the quality of outputs and outcomes. Its calculation is Presentations without Discrepancies /
  Presentations, measured in percent (%). It provides the day-to-day signal that a process is running
  as designed. Higher values are better; gains are read as improvement and losses as deterioration. It
  originates from and is most used in Logistics & Trade practice.
