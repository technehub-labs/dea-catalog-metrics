id: dea:metric-key-control-operating-effectiveness-rate
name: Key Control Operating Effectiveness Rate
type: Metric
description: A Internal Controls & Financial Reporting Integrity indicator, Key Control Operating Effectiveness
  Rate (KCOER) quantifies the quality of outputs and outcomes. Its calculation is Key Controls Operating
  Effectively / Key Controls Tested, measured in percent (%). It is applied across virtually every sector.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
