id: dea:metric-page-worthy-alert-ratio
name: Page-Worthy Alert Ratio
type: Metric
description: 'Page-Worthy Alert Ratio (PWAR) addresses how efficiently resources are converted into outputs
  and is a fixture of observability & site reliability engineering reporting. It is defined as Pages Meeting
  Paging Criteria / Pages Sent; the result is stated in percent (%). It is a working-level control: thresholds
  trigger immediate operational response. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: PWAR
unit: percent
version: 1.1.0
