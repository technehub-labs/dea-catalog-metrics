id: dea:metric-system-average-interruption-duration-index
name: System Average Interruption Duration Index
type: Metric
description: System Average Interruption Duration Index (SAIDI) measures the quality of outputs and outcomes
  in the Energy & Utilities domain. Its calculation is Total Customer Interruption Minutes / Total Customers
  Served, measured in minutes. It originates from and is most used in Energy & utilities practice. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: SAIDI
unit: minute
