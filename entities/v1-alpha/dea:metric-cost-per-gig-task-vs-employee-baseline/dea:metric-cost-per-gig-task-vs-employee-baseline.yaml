id: dea:metric-cost-per-gig-task-vs-employee-baseline
name: Cost per Gig Task vs Employee Baseline
type: Metric
description: 'Within Gig & Contingent Workforce, Cost per Gig Task vs Employee Baseline (PGC) is used
  to gauge the economic value created or preserved. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Gig Task Cost / Equivalent Internal
  Task Cost, expressed in ratio (x:1 or x). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
