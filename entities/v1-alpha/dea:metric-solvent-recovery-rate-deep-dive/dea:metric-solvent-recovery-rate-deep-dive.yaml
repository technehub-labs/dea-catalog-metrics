id: dea:metric-solvent-recovery-rate-deep-dive
name: Solvent Recovery Rate (Deep Dive)
type: Metric
description: Within Chemicals & Specialty Materials, Solvent Recovery Rate (Deep Dive) (SRR-C2) is used
  to gauge environmental and social sustainability performance. Its calculation is Recovered Solvent Reused
  / Solvent Consumed, measured in percent (%). It originates from and is most used in Chemicals practice.
  Its value drives prioritization and resource reallocation among competing initiatives. It should be
  maximized within the limits of cost and quality trade-offs.
