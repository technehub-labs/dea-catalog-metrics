type: Metric
description: Within Data Privacy & Protection, Cross-Border Transfer Compliance Rate (CBTCR) is used to
  gauge conformance to standards, plans, or obligations. The formula is Transfers under Valid Mechanism
  / Transfers Identified - reported in percent (%). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
