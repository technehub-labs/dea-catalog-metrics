id: dea:metric-excess-return-over-benchmark-deep-dive
name: Excess Return over Benchmark (Deep Dive)
type: Metric
description: A Investment Management - Portfolio Operations indicator, Excess Return over Benchmark (Deep
  Dive) (EROB-D) quantifies how effectively a process or entity achieves its intended outcome. The formula
  is Portfolio Return - Benchmark Return - reported in percent (%). It is a standard measure in the Financial
  Services sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. It should be maximized within the limits of cost and quality trade-offs.
