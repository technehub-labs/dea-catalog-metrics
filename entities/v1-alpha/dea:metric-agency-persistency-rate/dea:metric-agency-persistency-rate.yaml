id: dea:metric-agency-persistency-rate
name: Agency Persistency Rate
type: Metric
description: A Insurance Distribution & Agency Management indicator, Agency Persistency Rate (APR-I) quantifies
  the retention of customers, users, or assets over time. It is defined as Policies Renewing across Periods
  / Policies In Force; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. In Insurance, it is a recognized element of the standard performance toolkit.
abbreviation: APR-I
unit: percent
