id: dea:metric-data-issue-recurrence-rate
name: Data Issue Recurrence Rate
type: Metric
description: 'Data Issue Recurrence Rate (DIRR) measures the quality of outputs and outcomes in the Data
  Governance & Stewardship domain. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Issues Reopened after Closure / Closed Issues - reported in
  percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: DIRR
unit: percent
