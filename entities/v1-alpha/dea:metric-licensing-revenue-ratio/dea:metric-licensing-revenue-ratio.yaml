id: dea:metric-licensing-revenue-ratio
name: Licensing Revenue Ratio
type: Metric
description: Licensing Revenue Ratio (LRR-CV) measures the economic value created or preserved in the
  Corporate Venturing & Partnerships domain. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Licensing and Royalty Revenue /
  Total Revenue, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
