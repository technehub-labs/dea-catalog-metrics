id: dea:metric-end-to-end-service-accountability-coverage
name: End-to-End Service Accountability Coverage
type: Metric
description: End-to-End Service Accountability Coverage (EESAC) captures governance for organizations
  tracking operating model monitoring & design effectiveness. The formula is Services with Single Accountable
  Executive / Services - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: EESAC
unit: percent
