id: dea:metric-data-quality-rule-coverage
name: Data Quality Rule Coverage
type: Metric
description: Data Quality Rule Coverage (DQRULE) measures conformance to standards, plans, or obligations
  in the Data Quality Management domain. Its calculation is Data Assets with Active Quality Rules / Data
  Assets, measured in percent (%). It is applied across virtually every sector. Its value drives prioritization
  and resource reallocation among competing initiatives. It should be maximized within the limits of cost
  and quality trade-offs.
abbreviation: DQRULE
unit: percent
