id: dea:metric-chargeback-rate
name: Chargeback Rate
type: Metric
description: Chargeback Rate (CBKR) addresses exposure to adverse outcomes and is a fixture of payments
  & fintech reporting. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is Chargebacks / Total Transactions, measured in percent (%).
  It should be driven down, since lower readings signal healthier performance. It originates from and
  is most used in Payments & fintech practice.
abbreviation: CBKR
unit: percent
