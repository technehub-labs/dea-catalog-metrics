id: dea:metric-average-length-of-stay-inpatient
name: Average Length of Stay (Inpatient)
type: Metric
description: A Healthcare Quality & Patient Safety Standard Measures indicator, Average Length of Stay
  (Inpatient) (ALOSDD) quantifies how efficiently resources are converted into outputs. It is defined
  as Inpatient Days / Discharges; the result is stated in days. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  In Healthcare, it is a recognized element of the standard performance toolkit.
