id: dea:metric-innovation-revenue-share
name: Innovation Revenue Share
type: Metric
description: Innovation Revenue Share (IRS) measures growth over time in the R&D and Innovation domain.
  It is defined as Revenue from Products Launched in Last 3 Years / Total Revenue; the result is stated
  in percent (%). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Higher values are better; gains are read as improvement and losses as deterioration. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: IRS
unit: percent
