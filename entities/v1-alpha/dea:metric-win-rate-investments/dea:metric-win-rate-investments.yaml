id: dea:metric-win-rate-investments
name: Win Rate (Investments)
type: Metric
description: Win Rate (Investments) (WRI) addresses how effectively a process or entity achieves its intended
  outcome and is a fixture of investment management reporting. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Its calculation is Profitable Positions
  Closed / Positions Closed, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Asset management practice.
abbreviation: WRI
unit: percent
