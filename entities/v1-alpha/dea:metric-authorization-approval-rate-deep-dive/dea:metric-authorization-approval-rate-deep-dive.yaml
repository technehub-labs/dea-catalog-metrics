description: Authorization Approval Rate (Deep Dive) (AAR-D) captures growth over time for organizations
  tracking payments & cards (deep dive). It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Approved Authorizations / Authorization Attempts
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. It is
  a standard measure in the Payments sector.
