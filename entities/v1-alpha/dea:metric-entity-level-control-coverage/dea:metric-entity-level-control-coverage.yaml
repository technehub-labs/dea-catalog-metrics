id: dea:metric-entity-level-control-coverage
name: Entity-Level Control Coverage
type: Metric
description: A Internal Controls & Financial Reporting Integrity indicator, Entity-Level Control Coverage
  (ELCC) quantifies conformance to standards, plans, or obligations. Its calculation is Entities with
  Documented Entity-Level Controls / Entities, measured in percent (%). It is applied across virtually
  every sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
