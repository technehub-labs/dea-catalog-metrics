id: dea:metric-cold-chain-excursion-rate
name: Cold Chain Excursion Rate
type: Metric
description: Cold Chain Excursion Rate (CCER) captures exposure to adverse outcomes for organizations
  tracking pharmacy retail. Its calculation is Refrigerated Items with Temperature Excursion / Items,
  measured in percent (%). It provides the day-to-day signal that a process is running as designed. Lower
  values are better; each reduction is an improvement. It originates from and is most used in Healthcare
  practice.
