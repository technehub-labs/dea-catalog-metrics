id: dea:metric-customer-digital-preference-share
name: Customer Digital Preference Share
type: Metric
description: A Digital Transformation indicator, Customer Digital Preference Share (CDPS) quantifies growth
  over time. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It is defined as Customers Choosing Digital Channel for Key Journey / Customers; the result is stated
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
