id: dea:metric-care-worker-turnover
name: Care Worker Turnover
type: Metric
description: Care Worker Turnover (CWT) measures exposure to adverse outcomes in the Elder & Social Care
  domain. It is defined as Care Worker Departures / Average Care Workforce; the result is stated in percent
  (%). In Social care, it is a recognized element of the standard performance toolkit. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Reduction is the goal, and
  sustained decreases indicate successful intervention.
abbreviation: CWT
unit: percent
