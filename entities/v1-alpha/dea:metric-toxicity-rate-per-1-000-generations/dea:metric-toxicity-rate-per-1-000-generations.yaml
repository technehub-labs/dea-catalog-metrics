id: dea:metric-toxicity-rate-per-1-000-generations
name: Toxicity Rate per 1,000 Generations
type: Metric
description: 'Within Generative AI & LLM Operations, Toxicity Rate per 1,000 Generations (TOXR) is used
  to gauge exposure to adverse outcomes. It is computed as Generations Flagged Toxic / 1,000 Generations,
  expressed in events per thousand or million (scaled). It is applied across virtually every sector. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
