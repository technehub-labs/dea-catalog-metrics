id: dea:metric-reputation-risk-radar-coverage
name: Reputation Risk Radar Coverage
type: Metric
description: A Corporate Communications & PR (Deep Dive) indicator, Reputation Risk Radar Coverage (RRRC)
  quantifies exposure to adverse outcomes. It is defined as Risks Monitored / Identified Risk Landscape;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: RRRC
unit: percent
version: 1.1.0
lifecycle_status: candidate
