id: dea:metric-cost-per-available-seat-kilometer
name: Cost per Available Seat Kilometer
type: Metric
description: 'Cost per Available Seat Kilometer (CASK) addresses how efficiently resources are converted
  into outputs and is a fixture of airline & transportation standard measures (deep dive) reporting. It
  is computed as Operating Cost / Available Seat Kilometers, expressed in currency per unit. Its use is
  concentrated in Airlines & Aviation. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Reduction is the goal, and sustained decreases indicate successful intervention.'
