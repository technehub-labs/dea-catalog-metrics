id: dea:metric-freedom-of-information-response-timeliness
name: Freedom of Information Response Timeliness
type: Metric
description: Within Public Sector & Citizen Service Standard Measures (Deep Dive), Freedom of Information
  Response Timeliness (FOIRT) is used to gauge conformance to standards, plans, or obligations. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Its
  calculation is Requests Answered within Statutory Deadline / Requests, measured in percent (%). Improvement
  means raising this figure toward best-in-class levels. It originates from and is most used in Public
  sector practice.
abbreviation: FOIRT
