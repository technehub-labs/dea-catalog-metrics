id: dea:metric-risk-response-plan-completion-rate
name: Risk Response Plan Completion Rate
type: Metric
description: Risk Response Plan Completion Rate (RRPCR) captures exposure to adverse outcomes for organizations
  tracking project management (deep dive). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Mitigation Plans Implemented for Red Risks
  / Red Risks - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
