id: dea:metric-security-screening-throughput-rate
name: Security Screening Throughput Rate
type: Metric
description: 'Within Airport Operations (Deep Dive), Security Screening Throughput Rate (SSTR) is used
  to gauge the utilization or availability of capacity. It is defined as Passengers Screened per Lane
  Hour; the result is stated in count (items per period). In Aviation, it is a recognized element of the
  standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. It should be maximized within the limits of cost and quality trade-offs.'
