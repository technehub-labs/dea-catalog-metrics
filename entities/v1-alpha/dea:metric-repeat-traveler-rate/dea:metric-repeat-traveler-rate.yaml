id: dea:metric-repeat-traveler-rate
name: Repeat Traveler Rate
type: Metric
description: Repeat Traveler Rate (RTR-T) captures the retention of customers, users, or assets over time
  for organizations tracking travel & tourism. It is defined as Travelers Booking Again within Period
  / Travelers; the result is stated in percent (%). It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Higher values are better; gains are read as improvement
  and losses as deterioration. In Travel & tourism, it is a recognized element of the standard performance
  toolkit.
abbreviation: RTR-T
unit: percent
