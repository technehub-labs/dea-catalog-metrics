id: dea:metric-customer-satisfaction-score-trend-deep-dive
name: Customer Satisfaction Score Trend (Deep Dive)
type: Metric
description: 'Within Balanced Scorecard - Customer Perspective, Customer Satisfaction Score Trend (Deep
  Dive) (CSATT-D) is used to gauge the engagement or satisfaction of the people involved. It is computed
  as Change in CSAT between Periods, expressed in score (points). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
