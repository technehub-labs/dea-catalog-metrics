id: dea:metric-pipeline-stage-failure-attribution-rate
name: Pipeline Stage Failure Attribution Rate
type: Metric
description: 'Pipeline Stage Failure Attribution Rate (PSFAR) captures the quality of outputs and outcomes
  for organizations tracking continuous integration. It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. The formula is Failures with Root Cause Attributed / Failures
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
