id: dea:metric-statement-of-account-accuracy
name: Statement of Account Accuracy
type: Metric
description: 'Statement of Account Accuracy (SOAA) addresses the quality of outputs and outcomes and is
  a fixture of insurance distribution & brokerage reporting. It is defined as Accurate Commission Statements
  / Statements Issued; the result is stated in percent (%). It is a working-level control: thresholds
  trigger immediate operational response. Higher values are better; gains are read as improvement and
  losses as deterioration. In Insurance distribution, it is a recognized element of the standard performance
  toolkit.'
