id: dea:metric-outsourced-versus-in-house-cost-delta
name: Outsourced versus In-House Cost Delta
type: Metric
description: Outsourced versus In-House Cost Delta (OVIHC) captures the economic value created or preserved
  for organizations tracking operating model monitoring & design effectiveness. It is defined as Outsourced
  Unit Cost - In-House Unit Cost / In-House; the result is stated in percent (%). It is applied across
  virtually every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Values outside the intended band, on either side, warrant investigation.
abbreviation: OVIHC
unit: percent
