id: dea:metric-release-readiness-checklist-compliance
name: Release Readiness Checklist Compliance
type: Metric
description: A Continuous Delivery & Deployment indicator, Release Readiness Checklist Compliance (RRCC)
  quantifies conformance to standards, plans, or obligations. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It is defined as Releases Passing Readiness
  Checklist / Releases; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
