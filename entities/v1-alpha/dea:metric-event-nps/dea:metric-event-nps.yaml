id: dea:metric-event-nps
name: Event NPS
type: Metric
description: A Sports & Events indicator, Event NPS (NPS-E) quantifies the engagement or satisfaction
  of the people involved. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is % Promoters - % Detractors among Event Attendees - reported in score (points).
  Improvement means raising this figure toward best-in-class levels. It is a standard measure in the Sports
  & events sector.
