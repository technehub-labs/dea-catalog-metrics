id: dea:metric-service-request-cycle-time-gbs
name: Service Request Cycle Time (GBS)
type: Metric
description: 'A Shared Services & Global Business Services indicator, Service Request Cycle Time (GBS)
  (SRCT) quantifies how efficiently resources are converted into outputs. It is defined as Hours from
  Request to Fulfillment; the result is stated in hours. It is a working-level control: thresholds trigger
  immediate operational response. Lower values are better; each reduction is an improvement. Its use is
  not sector-specific; it appears in cross-industry performance frameworks.'
