id: dea:metric-return-on-capital-employed-deep-dive
name: Return on Capital Employed (Deep Dive)
type: Metric
description: Return on Capital Employed (Deep Dive) (ROCE-D) captures the economic value created or preserved
  for organizations tracking balanced scorecard - financial perspective. The formula is EBIT / Capital
  Employed - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
