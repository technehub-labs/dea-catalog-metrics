id: dea:metric-revenue-per-available-seat-kilometer
name: Revenue per Available Seat Kilometer
type: Metric
description: Within Airline & Transportation Standard Measures (Deep Dive), Revenue per Available Seat
  Kilometer (RASK) is used to gauge the economic value created or preserved. The formula is Passenger
  Revenue / Available Seat Kilometers - reported in currency per unit. It is a standard measure in the
  Airlines & Aviation sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. It should be maximized within the limits of cost and quality trade-offs.
