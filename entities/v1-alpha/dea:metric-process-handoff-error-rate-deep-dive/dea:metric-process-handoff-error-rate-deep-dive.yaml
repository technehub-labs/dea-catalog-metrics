id: dea:metric-process-handoff-error-rate-deep-dive
name: Process Handoff Error Rate (Deep Dive)
type: Metric
description: Within Balanced Scorecard - Internal Process Perspective, Process Handoff Error Rate (Deep
  Dive) (PHER-D) is used to gauge the quality of outputs and outcomes. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. It is computed as Errors at Process
  Handoffs / Handoffs, expressed in events per thousand or million (scaled). It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.
