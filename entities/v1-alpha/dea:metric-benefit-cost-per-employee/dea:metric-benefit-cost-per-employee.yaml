id: dea:metric-benefit-cost-per-employee
name: Benefit Cost per Employee
type: Metric
description: Benefit Cost per Employee (BCPE) captures the economic value created or preserved for organizations
  tracking standard workforce & pay metrics. The formula is Total Benefits Spend / Employees - reported
  in currency per unit. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. It is managed toward a defined target band rather than an extreme - both overshoot and undershoot
  can signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.
