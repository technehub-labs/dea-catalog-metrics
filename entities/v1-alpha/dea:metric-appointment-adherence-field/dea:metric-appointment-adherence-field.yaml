name: Appointment Adherence (Field)
type: Metric
description: 'Within Telecom Field & Installation, Appointment Adherence (Field) (AAFT) is used to gauge
  conformance to standards, plans, or obligations. The formula is Appointments within Committed Window
  / Appointments - reported in percent (%). It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Higher values are better; gains are read as improvement and losses
  as deterioration. It is a standard measure in the Telecommunications sector.'
