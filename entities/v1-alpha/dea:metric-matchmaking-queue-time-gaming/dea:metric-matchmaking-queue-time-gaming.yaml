id: dea:metric-matchmaking-queue-time-gaming
name: Matchmaking Queue Time (Gaming)
type: Metric
description: A Gaming Development & Live Operations indicator, Matchmaking Queue Time (Gaming) (MQT) quantifies
  the quality of outputs and outcomes. It is computed as Median Seconds to Match, expressed in seconds.
  Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  Lower values are better; each reduction is an improvement. Its use is concentrated in Gaming.
