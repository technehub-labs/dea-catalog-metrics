id: dea:metric-overdue-compliance-action-rate
name: Overdue Compliance Action Rate
type: Metric
description: Overdue Compliance Action Rate (OCAR) captures conformance to standards, plans, or obligations
  for organizations tracking compliance monitoring & testing. It provides the day-to-day signal that a
  process is running as designed. Its calculation is Remediation Actions Past Due / Actions, measured
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: OCAR
unit: percent
