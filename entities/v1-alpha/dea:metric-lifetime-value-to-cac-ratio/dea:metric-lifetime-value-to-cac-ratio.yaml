id: dea:metric-lifetime-value-to-cac-ratio
name: Lifetime Value to CAC Ratio
type: Metric
description: Lifetime Value to CAC Ratio (LTV:CAC) measures the economic value created or preserved in
  the Banking & Financial Services domain. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Customer Lifetime Value / Customer
  Acquisition Cost, measured in ratio (x:1 or x). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Financial services practice.
abbreviation: LTV:CAC
