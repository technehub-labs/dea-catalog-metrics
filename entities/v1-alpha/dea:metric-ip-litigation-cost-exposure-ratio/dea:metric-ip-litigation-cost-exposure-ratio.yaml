id: dea:metric-ip-litigation-cost-exposure-ratio
name: IP Litigation Cost Exposure Ratio
type: Metric
description: 'IP Litigation Cost Exposure Ratio (ILCER) addresses exposure to adverse outcomes and is
  a fixture of intellectual property & licensing reporting. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as Litigation Spend and Reserves
  / Revenue, expressed in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: ILCER
unit: percent
version: 1.0.1
