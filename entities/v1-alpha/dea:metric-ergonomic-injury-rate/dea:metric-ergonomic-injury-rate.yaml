id: dea:metric-ergonomic-injury-rate
name: Ergonomic Injury Rate
type: Metric
description: Ergonomic Injury Rate (EIR) addresses exposure to adverse outcomes and is a fixture of health
  & safety reporting. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is computed as Ergonomic-Related Injuries / Total Injuries, expressed in percent (%).
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: EIR
unit: percent
version: 1.0.0
