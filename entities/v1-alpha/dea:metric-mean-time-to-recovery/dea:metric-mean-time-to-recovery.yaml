id: dea:metric-mean-time-to-recovery
name: Mean Time to Recovery
type: Metric
description: The arithmetic mean of recovery times across n incidents, expressed in minutes. 
  Recovery time is measured from incident-detection to service-restoration. Lower values indicate 
  faster recovery.
abbreviation: MTTR
unit: minute
version: 1.2.0
lifecycle_status: admitted
subject_concept: dea:subject-incident
measurement_nature: numeric
subject_classification:
- technology_architecture
purpose_classification:
- performance
- health
orientation_classification: lagging
scope_classification:
- system_or_component
- product_or_service
directionality: lower_is_better
management_significance:
- operational
- managerial
measurement_nature_detail: 'Arithmetic mean of recovery times across incidents, expressed in minutes.
  Lower values are better.

  '
unit_ref: dea:unit-minute
precision: 3
decimal_scale: 1
rounding_rule: half_up
null_value_semantics: excluded_from_aggregation
calculation_definition: 'MTTR = (sum_i RecoveryTime_i) / n; the arithmetic mean of recovery times across
  n incidents.

  '
formula_definition:
  formula_id: dea:formula-mttr-arithmetic-mean
  expression: MTTR = (sum_i RecoveryTime_i) / n
  inputs:
  - name: RecoveryTime_i
    source_ref: dea:metric-recovery-time
    measurement_nature: numeric
  operators:
  - sum
  - divide
  parameters:
  - name: n
    value_type: integer
    default_value: 1
  unit_semantics:
    input_units:
    - dea:unit-minute
    output_unit: dea:unit-minute
  validation_rules:
  - result >= 0
  - n > 0
  version: 1.0.0
frequency: monthly
measurable_entity_kind: dea:ApplicationComponent
reputability_tier: industry_standard
applicability:
  intended_subjects:
  - dea:ApplicationComponent
  - dea:BusinessService
  - dea:Service
  excluded_subjects:
  - dea:Outcome
designations:
- dea:designation-incident-frequency-operational
related_metrics:
- metric_ref: dea:metric-system-availability
  relationship: complements
quality:
  validation_rules:
  - Recovery time measured from incident-detection to service-restoration.
  known_limitations:
  - Detection latency is not captured (separate metric - Time to Detect).
  measurement_evidence:
  - ITIL 4 incident management practice
  - SRE workbook MTTR definitions
external_references:
- source: MAMA (Measuring Automation & Measuring Autonomy) - mama-metrics
  source_id: mama-metrics:card/recovery-time
  url: 
