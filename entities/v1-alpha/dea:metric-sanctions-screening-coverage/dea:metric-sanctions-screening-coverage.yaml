id: dea:metric-sanctions-screening-coverage
name: Sanctions Screening Coverage
type: Metric
description: 'Sanctions Screening Coverage (SSC-FC) addresses conformance to standards, plans, or obligations
  and is a fixture of insurance fraud & financial crime reporting. It is computed as Transactions Screened
  / In-Scope Transactions, expressed in percent (%). Its use is concentrated in Financial Services. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: SSC-FC
unit: percent
