id: dea:metric-attrition-rate-agents-deep-dive
name: Attrition Rate - Agents (Deep Dive)
type: Metric
description: 'A Contact Center Operations (Deep Dive) indicator, Attrition Rate - Agents (Deep Dive) (ARR-D)
  quantifies the retention of customers, users, or assets over time. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Agents Leaving /
  Agents Employed, expressed in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: ARR-D
unit: percent
