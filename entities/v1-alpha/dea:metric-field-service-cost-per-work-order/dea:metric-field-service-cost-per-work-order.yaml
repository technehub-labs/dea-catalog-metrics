id: dea:metric-field-service-cost-per-work-order
name: Field Service Cost per Work Order
type: Metric
description: Field Service Cost per Work Order (FSCWO) measures how efficiently resources are converted
  into outputs in the Field Service & Asset Performance domain. It is defined as Field Cost / Completed
  Work Orders; the result is stated in currency per unit. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
