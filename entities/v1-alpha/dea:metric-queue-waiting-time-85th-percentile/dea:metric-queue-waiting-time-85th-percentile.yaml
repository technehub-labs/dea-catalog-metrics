description: 'Within Retail Banking Branch Network (Deep Dive), Queue Waiting Time - 85th Percentile (QW85)
  is used to gauge the quality of outputs and outcomes. It is defined as Minutes waited by 85th percentile
  customer; the result is stated in minutes. In Banking, it is a recognized element of the standard performance
  toolkit. It is a working-level control: thresholds trigger immediate operational response. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
