id: dea:metric-weibull-shape-parameter-confidence
name: Weibull Shape Parameter Confidence
type: Metric
description: A Reliability & Maintainability Engineering (Deep Dive) indicator, Weibull Shape Parameter
  Confidence (WSPC) quantifies the quality of outputs and outcomes. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Confidence Interval Width
  of Fitted Beta, expressed in ratio (x:1 or x). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
