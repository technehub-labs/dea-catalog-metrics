id: dea:metric-ioc-enrichment-latency
name: IOC Enrichment Latency
type: Metric
description: 'A Threat Intelligence & Red Team indicator, IOC Enrichment Latency (IOEL) quantifies how
  efficiently resources are converted into outputs. It is defined as Minutes from Indicator Observed to
  Enriched Alert; the result is stated in minutes. It is applied across virtually every sector. It is
  a working-level control: thresholds trigger immediate operational response. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
