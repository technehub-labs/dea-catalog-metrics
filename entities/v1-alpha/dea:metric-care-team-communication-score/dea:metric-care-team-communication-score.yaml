id: dea:metric-care-team-communication-score
name: Care Team Communication Score
type: Metric
description: A Medical Practice & Clinical Operations indicator, Care Team Communication Score (CTCS)
  quantifies the engagement or satisfaction of the people involved. It is defined as Staff Survey on Clinical
  Communication Effectiveness; the result is stated in score (points). It bridges daily operations and
  executive reporting, giving managers a lever to pull within a quarter. Higher values are better; gains
  are read as improvement and losses as deterioration. In Healthcare, it is a recognized element of the
  standard performance toolkit.
