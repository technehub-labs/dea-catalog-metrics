id: dea:metric-supply-chain-attestation-coverage
name: Supply Chain Attestation Coverage
type: Metric
description: Within Application Security (AppSec), Supply Chain Attestation Coverage (SCATC) is used to
  gauge exposure to adverse outcomes. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It is defined as Builds with Signed Provenance / Production Builds; the
  result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  In Software, it is a recognized element of the standard performance toolkit.
abbreviation: SCATC
unit: percent
