id: dea:metric-combined-ratio
name: Combined Ratio
type: Metric
description: A Insurance indicator, Combined Ratio (CoR) quantifies the economic value created or preserved.
  It is defined as (Incurred Losses + Expenses) / Earned Premiums; the result is stated in percent (%).
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Lower
  values are better; each reduction is an improvement. In Insurance, it is a recognized element of the
  standard performance toolkit.
abbreviation: CoR
unit: percent
