id: dea:metric-average-length-of-trip
name: Average Length of Trip
type: Metric
description: 'Average Length of Trip (ALOT) captures the engagement or satisfaction of the people involved
  for organizations tracking travel & tourism. The formula is Total Traveler Nights / Trips - reported
  in days. It is a standard measure in the Travel & tourism sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. It should be maximized within the limits
  of cost and quality trade-offs.'
