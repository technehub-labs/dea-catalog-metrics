id: dea:metric-first-contact-resolution-claims
name: First Contact Resolution (Claims)
type: Metric
description: First Contact Resolution (Claims) (FCR-C) captures how efficiently resources are converted
  into outputs for organizations tracking insurance claims deep dive. It is computed as Claims Resolved
  at First Contact / Claims, expressed in percent (%). Its use is concentrated in Insurance. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It should
  be maximized within the limits of cost and quality trade-offs.
