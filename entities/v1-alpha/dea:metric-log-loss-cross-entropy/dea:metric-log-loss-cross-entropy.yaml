id: dea:metric-log-loss-cross-entropy
name: Log Loss (Cross-Entropy)
type: Metric
description: 'Log Loss (Cross-Entropy) (LOGL) captures the quality of outputs and outcomes for organizations
  tracking statistical model performance diagnostics. It is a working-level control: thresholds trigger
  immediate operational response. It is defined as Negative Log-Likelihood of Predicted Probabilities;
  the result is stated in score (points). It should be driven down, since lower readings signal healthier
  performance. In Software, it is a recognized element of the standard performance toolkit.'
