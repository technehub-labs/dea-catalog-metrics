id: dea:metric-data-verified-internally-before-disclosure
name: Data Verified Internally before Disclosure
type: Metric
description: Within Environmental, Social & Governance Reporting, Data Verified Internally before Disclosure
  (DVID) is used to gauge the quality of outputs and outcomes. It is computed as Metrics with Internal
  Verification / Metrics, expressed in percent (%). It is applied across virtually every sector. It is
  reviewed at cadence by planning owners to correct course before issues become strategic. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: DVID
unit: percent
