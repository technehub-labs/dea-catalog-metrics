id: dea:metric-data-consistency-across-finance-reports
name: Data Consistency across Finance Reports
type: Metric
description: Data Consistency across Finance Reports (DCFPR) captures the quality of outputs and outcomes
  for organizations tracking financial planning & analysis. It is computed as Reports Reconciled to Single
  Source / Reports, expressed in percent (%). It is applied across virtually every sector. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: DCFPR
unit: percent
version: 1.1.0
