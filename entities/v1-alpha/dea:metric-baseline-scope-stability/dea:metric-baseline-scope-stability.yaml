id: dea:metric-baseline-scope-stability
name: Baseline Scope Stability
type: Metric
description: Baseline Scope Stability (BSS) addresses exposure to adverse outcomes and is a fixture of
  project management reporting. It is computed as 1 - Changed Scope / Baseline Scope, expressed in percent
  (%). It is applied across virtually every sector. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: BSS
unit: percent
