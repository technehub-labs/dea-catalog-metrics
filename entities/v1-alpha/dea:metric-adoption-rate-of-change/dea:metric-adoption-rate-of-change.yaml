id: dea:metric-adoption-rate-of-change
name: Adoption Rate of Change
type: Metric
description: Adoption Rate of Change (ARC) captures how effectively a process or entity achieves its intended
  outcome for organizations tracking change management. Its calculation is Target Users Adopting Changed
  Process or System / Target Users, measured in percent (%). It is applied across virtually every sector.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: ARC
unit: percent
