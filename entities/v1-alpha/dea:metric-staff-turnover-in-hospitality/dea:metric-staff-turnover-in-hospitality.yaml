id: dea:metric-staff-turnover-in-hospitality
name: Staff Turnover in Hospitality
type: Metric
description: Staff Turnover in Hospitality (STOH) captures exposure to adverse outcomes for organizations
  tracking hospitality & food service. It is defined as Departures / Average Headcount; the result is
  stated in percent (%). It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. Lower values are better; each reduction is an improvement. In Hospitality,
  it is a recognized element of the standard performance toolkit.
abbreviation: STOH
unit: percent
