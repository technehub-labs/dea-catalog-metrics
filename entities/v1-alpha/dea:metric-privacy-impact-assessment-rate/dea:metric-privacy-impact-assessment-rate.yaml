id: dea:metric-privacy-impact-assessment-rate
name: Privacy Impact Assessment Rate
type: Metric
description: Within Data Privacy & Protection, Privacy Impact Assessment Rate (PIAR) is used to gauge
  exposure to adverse outcomes. It is defined as High-Risk Projects with Completed PIA / High-Risk Projects;
  the result is stated in percent (%). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
