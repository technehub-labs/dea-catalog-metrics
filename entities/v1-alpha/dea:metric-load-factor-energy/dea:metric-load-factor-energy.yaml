id: dea:metric-load-factor-energy
name: Load Factor (Energy)
type: Metric
description: Load Factor (Energy) (LFE) captures how efficiently resources are converted into outputs
  for organizations tracking operations energy management. It is defined as Average Load / Peak Load;
  the result is stated in percent (%). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
