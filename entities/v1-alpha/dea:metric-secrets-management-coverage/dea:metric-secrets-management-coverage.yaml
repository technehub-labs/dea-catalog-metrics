id: dea:metric-secrets-management-coverage
name: Secrets Management Coverage
type: Metric
description: 'Secrets Management Coverage (SMC-CS) addresses exposure to adverse outcomes and is a fixture
  of cloud security posture management reporting. It is defined as Secrets in Managed Vault / Secrets
  in Use; the result is stated in percent (%). It is applied across virtually every sector. It is a working-level
  control: thresholds trigger immediate operational response. It should be maximized within the limits
  of cost and quality trade-offs.'
abbreviation: SMC-CS
unit: percent
version: 1.1.0
lifecycle_status: candidate
