id: dea:metric-dei-training-completion-rate
name: DEI Training Completion Rate
type: Metric
description: A Diversity, Equity & Inclusion (Deep Dive) indicator, DEI Training Completion Rate (DEITC)
  quantifies capability maturity or development. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as Staff Completing Required DEI Learning / Staff,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: DEITC
unit: percent
