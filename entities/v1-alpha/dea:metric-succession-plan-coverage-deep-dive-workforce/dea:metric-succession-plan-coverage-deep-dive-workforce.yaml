id: dea:metric-succession-plan-coverage-deep-dive-workforce
name: Succession Plan Coverage (Deep Dive - Workforce)
type: Metric
description: 'Within Workforce Planning & Productivity, Succession Plan Coverage (Deep Dive - Workforce)
  (SPCD) is used to gauge exposure to adverse outcomes. It is computed as Critical Roles with Ready Successor
  / Critical Roles, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
