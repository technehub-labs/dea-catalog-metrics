id: dea:metric-core-network-availability
name: Core Network Availability
type: Metric
description: 'A Telecom Network Operations indicator, Core Network Availability (CNA) quantifies the quality
  of outputs and outcomes. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. It is computed as Core Network Uptime / Total Time, expressed in percent (%).
  Improvement means raising this figure toward best-in-class levels. Its use is concentrated in Telecommunications.'
abbreviation: CNA
unit: percent
