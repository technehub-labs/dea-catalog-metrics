id: dea:metric-break-even-load-factor-airline
name: Break-Even Load Factor (Airline)
type: Metric
description: Break-Even Load Factor (Airline) (BELF) measures exposure to adverse outcomes in the Airline
  & Transportation Standard Measures (Deep Dive) domain. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Operating Cost per ASK / Revenue
  per ASK; the result is stated in percent (%). It should be driven down, since lower readings signal
  healthier performance. In Airlines & Aviation, it is a recognized element of the standard performance
  toolkit.
abbreviation: BELF
unit: percent
