id: dea:metric-program-milestone-slip
name: Program Milestone Slip
type: Metric
description: Program Milestone Slip (PMS) addresses conformance to standards, plans, or obligations and
  is a fixture of defense & aerospace reporting. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Days of Schedule Slip at Milestone; the result
  is stated in days. It should be driven down, since lower readings signal healthier performance. In Defense
  & aerospace, it is a recognized element of the standard performance toolkit.
