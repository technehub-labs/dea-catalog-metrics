id: dea:metric-escalation-layer-depth
name: Escalation Layer Depth
type: Metric
description: A Operating Model & Process Health Deep Dive indicator, Escalation Layer Depth (ELD) quantifies
  how efficiently resources are converted into outputs. Its calculation is Layers Required to Resolve
  Standard Escalation, measured in count (items per period). Its value drives prioritization and resource
  reallocation among competing initiatives. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
