id: dea:metric-decision-reversal-rate
name: Decision Reversal Rate
type: Metric
description: 'Decision Reversal Rate (DRR-GOV) measures exposure to adverse outcomes in the Enterprise
  Decision Effectiveness & Governance Monitoring domain. It is computed as Decisions Reversed within Twelve
  Months / Decisions, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
