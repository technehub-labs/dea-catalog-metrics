id: dea:metric-maintainability-index
name: Maintainability Index
type: Metric
description: Maintainability Index (MAINIDX) captures the quality of outputs and outcomes for organizations
  tracking code quality & static analysis. It provides the day-to-day signal that a process is running
  as designed. Its calculation is Composite of Cyclomatic Complexity, Halstead, LOC, measured in index
  (0-100 or normalized). Improvement means raising this figure toward best-in-class levels. It originates
  from and is most used in Software practice.
