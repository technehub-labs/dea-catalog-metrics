id: dea:metric-system-average-interruption-frequency-index
name: System Average Interruption Frequency Index
type: Metric
description: Within Energy & Utilities, System Average Interruption Frequency Index (SAIFI) is used to
  gauge the quality of outputs and outcomes. The formula is Total Customer Interruptions / Total Customers
  Served - reported in ratio (x:1 or x). It is a standard measure in the Energy & utilities sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction
  is the goal, and sustained decreases indicate successful intervention.
