id: dea:metric-esg-disclosure-completeness
name: ESG Disclosure Completeness
type: Metric
description: ESG Disclosure Completeness (ESGDC) measures conformance to standards, plans, or obligations
  in the Investor Relations & Capital Markets domain. It is defined as Disclosed ESG Metrics per Framework
  / Required Metrics; the result is stated in percent (%). In Listed companies, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: ESGDC
unit: percent
