id: dea:metric-information-ratio-deep-dive
name: Information Ratio (Deep Dive)
type: Metric
description: Within Asset & Wealth Management (Deep Dive), Information Ratio (Deep Dive) (IR-D) is used
  to gauge how effectively a process or entity achieves its intended outcome. It is defined as Active
  Return / Tracking Error; the result is stated in ratio (x:1 or x). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. In Financial Services, it is a recognized element of the standard performance
  toolkit.
