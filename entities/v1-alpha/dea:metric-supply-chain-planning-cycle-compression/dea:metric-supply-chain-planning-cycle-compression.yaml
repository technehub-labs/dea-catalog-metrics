id: dea:metric-supply-chain-planning-cycle-compression
name: Supply Chain Planning Cycle Compression
type: Metric
description: A Supply Chain Standard Measures (Deep Dive) indicator, Supply Chain Planning Cycle Compression
  (SCPC) quantifies how efficiently resources are converted into outputs. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Reduction
  in S&OP Cycle Days vs Baseline, measured in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
