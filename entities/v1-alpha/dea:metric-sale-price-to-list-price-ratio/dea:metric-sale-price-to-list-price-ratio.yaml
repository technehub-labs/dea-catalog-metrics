id: dea:metric-sale-price-to-list-price-ratio
name: Sale Price to List Price Ratio
type: Metric
description: Sale Price to List Price Ratio (SPLP) measures the economic value created or preserved in
  the Real Estate Brokerage domain. The formula is Sale Price / Original List Price - reported in percent
  (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Higher values are better; gains are read as improvement and losses as deterioration. It is a standard
  measure in the Real estate sector.
