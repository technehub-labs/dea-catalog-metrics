id: dea:metric-operating-model-span-and-layer-index
name: Operating Model Span and Layer Index
type: Metric
description: 'Within Operating Model Monitoring & Design Effectiveness, Operating Model Span and Layer
  Index (OSLI) is used to gauge how efficiently resources are converted into outputs. It is computed as
  Reporting Layers and Span Balance Score, expressed in index (0-100 or normalized). It is applied across
  virtually every sector. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Values outside the intended band, on either side, warrant investigation.'
