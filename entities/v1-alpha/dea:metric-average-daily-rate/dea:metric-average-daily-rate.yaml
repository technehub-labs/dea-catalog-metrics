id: dea:metric-average-daily-rate
name: Average Daily Rate
type: Metric
description: 'A Hospitality & Food Service indicator, Average Daily Rate (ADR) quantifies the economic
  value created or preserved. It is computed as Room Revenue / Rooms Sold, expressed in currency value.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is concentrated
  in Hospitality.'
