id: dea:metric-time-to-find-information-deep-dive
name: Time to Find Information (Deep Dive)
type: Metric
description: 'Time to Find Information (Deep Dive) (TTFI) addresses how efficiently resources are converted
  into outputs and is a fixture of knowledge management (deep dive) reporting. It is a working-level control:
  thresholds trigger immediate operational response. It is defined as Median Minutes to Locate Required
  Knowledge; the result is stated in minutes. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
