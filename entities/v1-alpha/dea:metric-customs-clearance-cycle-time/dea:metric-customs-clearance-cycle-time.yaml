id: dea:metric-customs-clearance-cycle-time
name: Customs Clearance Cycle Time
type: Metric
description: Customs Clearance Cycle Time (CCCT-T) addresses how efficiently resources are converted into
  outputs and is a fixture of international trade & customs reporting. Its calculation is Hours from Arrival
  to Customs Release, measured in hours. It provides the day-to-day signal that a process is running as
  designed. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Logistics & Trade practice.
