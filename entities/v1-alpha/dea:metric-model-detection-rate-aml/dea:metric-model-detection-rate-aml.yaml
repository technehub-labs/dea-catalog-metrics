id: dea:metric-model-detection-rate-aml
name: Model Detection Rate - AML
type: Metric
description: Model Detection Rate - AML (MDRA) captures capability maturity or development for organizations
  tracking insurance fraud & financial crime. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Suspicious Activity Confirmed / Model Flagged
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. It is
  a standard measure in the Financial Services sector.
