id: dea:metric-emergency-department-wait-time
name: Emergency Department Wait Time
type: Metric
description: Emergency Department Wait Time (EDWT) captures how efficiently resources are converted into
  outputs for organizations tracking healthcare. Its calculation is Median Minutes from Arrival to Treatment,
  measured in minutes. It originates from and is most used in Healthcare practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Reduction is the
  goal, and sustained decreases indicate successful intervention.
