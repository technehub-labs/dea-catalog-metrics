id: dea:metric-gmroii-gross-margin-return-on-inventory-investment
name: GMROII (Gross Margin Return on Inventory Investment)
type: Metric
description: 'Within Retail Standard Measures, GMROII (Gross Margin Return on Inventory Investment) (GMROII)
  is used to gauge the economic value created or preserved. It is computed as Gross Margin / Average Inventory
  Cost, expressed in ratio (x:1 or x). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is concentrated in Retail & E-commerce.'
