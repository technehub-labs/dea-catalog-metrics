id: dea:metric-pipeline-coverage-ratio
name: Pipeline Coverage Ratio
type: Metric
description: A Sales indicator, Pipeline Coverage Ratio (PCR) quantifies the utilization or availability
  of capacity. Its calculation is Pipeline Value / Quota for Period, measured in ratio (x:1 or x). It
  is applied across virtually every sector. Its value drives prioritization and resource reallocation
  among competing initiatives. Values outside the intended band, on either side, warrant investigation.
