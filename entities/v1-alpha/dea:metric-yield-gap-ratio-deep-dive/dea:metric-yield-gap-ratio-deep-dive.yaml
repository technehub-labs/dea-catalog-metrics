id: dea:metric-yield-gap-ratio-deep-dive
name: Yield Gap Ratio (Deep Dive)
type: Metric
description: Within Agriculture & Agronomy (Deep Dive), Yield Gap Ratio (Deep Dive) (YGR-D) is used to
  gauge the quality of outputs and outcomes. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Actual Yield - Attainable Yield / Attainable
  Yield - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Agriculture sector.
abbreviation: YGR-D
unit: percent
