id: dea:metric-app-crash-rate
name: App Crash Rate
type: Metric
description: 'App Crash Rate (ACR2) addresses the quality of outputs and outcomes and is a fixture of
  software engineering reporting. It is defined as Sessions with Crash / Total Sessions; the result is
  stated in percent (%). It is applied across virtually every sector. It is a working-level control: thresholds
  trigger immediate operational response. Reduction is the goal, and sustained decreases indicate successful
  intervention.'
abbreviation: ACR2
unit: percent
