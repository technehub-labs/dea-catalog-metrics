id: dea:metric-model-lift-top-decile
name: Model Lift (Top Decile)
type: Metric
description: 'Model Lift (Top Decile) (LIFTD) captures the economic value created or preserved for organizations
  tracking statistical model performance diagnostics. It is a working-level control: thresholds trigger
  immediate operational response. It is defined as Response Rate in Top Decile / Overall Response Rate;
  the result is stated in ratio (x:1 or x). Improvement means raising this figure toward best-in-class
  levels. In Software, it is a recognized element of the standard performance toolkit.'
