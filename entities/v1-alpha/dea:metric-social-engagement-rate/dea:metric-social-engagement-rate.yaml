id: dea:metric-social-engagement-rate
name: Social Engagement Rate
type: Metric
description: Social Engagement Rate (SER) addresses the engagement or satisfaction of the people involved
  and is a fixture of marketing reporting. It is computed as Interactions / Followers or Impressions,
  expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations demand
  immediate correction. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SER
unit: percent
