id: dea:metric-fatality-and-serious-injury-rate
name: Fatality and Serious Injury Rate
type: Metric
description: 'Within Mining & Metals, Fatality and Serious Injury Rate (FSIR) is used to gauge exposure
  to adverse outcomes. It is computed as Serious Injuries and Fatalities / Hours Worked x 1,000,000, expressed
  in events per thousand or million (scaled). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Mining & metals.'
