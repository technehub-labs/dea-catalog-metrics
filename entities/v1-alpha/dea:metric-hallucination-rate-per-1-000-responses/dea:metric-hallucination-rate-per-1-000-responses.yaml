name: Hallucination Rate per 1,000 Responses
type: Metric
description: A Generative AI & LLM Operations indicator, Hallucination Rate per 1,000 Responses (HALLR)
  quantifies exposure to adverse outcomes. The formula is Responses Containing Fabricated Facts / 1,000
  Responses - reported in events per thousand or million (scaled). It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
