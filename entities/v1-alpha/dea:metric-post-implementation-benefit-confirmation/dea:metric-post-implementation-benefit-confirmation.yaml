id: dea:metric-post-implementation-benefit-confirmation
name: Post-Implementation Benefit Confirmation
type: Metric
description: Post-Implementation Benefit Confirmation (PIBC) captures the economic value created or preserved
  for organizations tracking change management. The formula is Initiatives with Confirmed Benefits at
  Review / Initiatives Closed - reported in percent (%). It is applied across virtually every sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
