description: 'Service Center Wait Time (Public) (SCWTP) measures the quality of outputs and outcomes in
  the Public Sector & Citizen Service Standard Measures (Deep Dive) domain. It is defined as Median Wait
  at Citizen Service Points; the result is stated in minutes. In Public sector, it is a recognized element
  of the standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. Reduction is the goal, and sustained decreases indicate successful intervention.'
