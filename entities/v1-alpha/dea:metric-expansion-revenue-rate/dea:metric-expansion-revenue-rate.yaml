id: dea:metric-expansion-revenue-rate
name: Expansion Revenue Rate
type: Metric
description: Expansion Revenue Rate (ERR) captures growth over time for organizations tracking customer
  success (b2b saas). Its calculation is Expansion MRR / MRR at Start of Period, measured in percent (%).
  It originates from and is most used in Software & SaaS practice. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
