id: dea:metric-revenue-churn-rate
name: Revenue Churn Rate
type: Metric
description: Revenue Churn Rate (RevChurn) addresses exposure to adverse outcomes and is a fixture of
  customer reporting. It is defined as (MRR_start - MRR_end + Upgrade MRR) / MRR_start; the result is
  stated in percent (%). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Lower values are better; each reduction is an improvement. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.
abbreviation: RevChurn
unit: percent
version: 1.0.0
