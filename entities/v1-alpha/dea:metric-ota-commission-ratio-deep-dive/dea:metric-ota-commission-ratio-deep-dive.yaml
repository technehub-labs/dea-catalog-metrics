id: dea:metric-ota-commission-ratio-deep-dive
name: OTA Commission Ratio (Deep Dive)
type: Metric
description: OTA Commission Ratio (Deep Dive) (OTAC-D) measures how efficiently resources are converted
  into outputs in the Hotel & Resort Operations (Deep Dive) domain. The formula is OTA Commissions / Rooms
  Revenue - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Lower values are better; each reduction is an improvement. It is a standard
  measure in the Hospitality sector.
