id: dea:metric-ethics-incident-mean-time-to-resolve
name: Ethics Incident Mean Time to Resolve
type: Metric
description: Ethics Incident Mean Time to Resolve (EIMTTR) addresses how efficiently resources are converted
  into outputs and is a fixture of ai ethics, fairness & responsible ai reporting. Its calculation is
  Days from Ethics Incident to Closure, measured in days. It is applied across virtually every sector.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Reduction is the goal, and sustained decreases indicate successful intervention.
