id: dea:metric-net-stable-funding-ratio
name: Net Stable Funding Ratio
type: Metric
description: 'Net Stable Funding Ratio (NSFR) addresses exposure to adverse outcomes and is a fixture
  of banking & financial services reporting. It is computed as Available Stable Funding / Required Stable
  Funding, expressed in ratio (x:1 or x). Its use is concentrated in Financial services. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
