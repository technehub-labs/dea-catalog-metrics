id: dea:metric-abandonment-rate-deep-dive
name: Abandonment Rate (Deep Dive)
type: Metric
description: Within Contact Center Operations (Deep Dive), Abandonment Rate (Deep Dive) (ABR-D) is used
  to gauge the quality of outputs and outcomes. Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. It is computed as Calls Abandoned / Calls Offered, expressed
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
