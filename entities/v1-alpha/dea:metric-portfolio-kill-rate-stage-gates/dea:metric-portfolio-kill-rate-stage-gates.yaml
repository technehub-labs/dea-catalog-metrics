id: dea:metric-portfolio-kill-rate-stage-gates
name: Portfolio Kill-Rate (Stage Gates)
type: Metric
description: 'Portfolio Kill-Rate (Stage Gates) (PKRG) measures governance in the PMO & Portfolio Governance
  domain. It is computed as Initiatives Stopped at Gate / Initiatives Reviewed, expressed in percent (%).
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: PKRG
unit: percent
version: 1.1.0
