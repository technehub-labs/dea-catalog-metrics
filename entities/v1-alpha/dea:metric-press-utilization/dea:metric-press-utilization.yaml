id: dea:metric-press-utilization
name: Press Utilization
type: Metric
description: A Printing & Publishing indicator, Press Utilization (PRU) quantifies the utilization or
  availability of capacity. It provides the day-to-day signal that a process is running as designed. Its
  calculation is Press Running Hours / Available Press Hours, measured in percent (%). Improvement means
  raising this figure toward best-in-class levels. It originates from and is most used in Printing & publishing
  practice.
abbreviation: PRU
unit: percent
