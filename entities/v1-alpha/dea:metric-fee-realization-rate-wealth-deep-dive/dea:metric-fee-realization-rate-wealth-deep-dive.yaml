id: dea:metric-fee-realization-rate-wealth-deep-dive
name: Fee Realization Rate (Wealth Deep Dive)
type: Metric
description: Fee Realization Rate (Wealth Deep Dive) (FRR-W) addresses the economic value created or preserved
  and is a fixture of asset & wealth management (deep dive) reporting. It is defined as Fees Collected
  / Fees Billable; the result is stated in percent (%). In Financial Services, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: FRR-W
