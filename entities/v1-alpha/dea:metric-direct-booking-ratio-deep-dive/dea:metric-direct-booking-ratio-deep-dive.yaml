id: dea:metric-direct-booking-ratio-deep-dive
name: Direct Booking Ratio (Deep Dive)
type: Metric
description: 'Direct Booking Ratio (Deep Dive) (DBR-D) addresses the economic value created or preserved
  and is a fixture of hotel & resort operations (deep dive) reporting. It is computed as Direct Reservations
  / Total Reservations, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is concentrated in Hospitality.'
abbreviation: DBR-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
