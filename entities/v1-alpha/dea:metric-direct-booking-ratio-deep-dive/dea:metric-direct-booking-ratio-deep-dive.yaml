calculation_definition: Direct Reservations / Total Reservations
formula_definition:
  formula_id: dea:formula-direct-booking-ratio-deep-dive
  expression: DBR-D = Direct Reservations / Total Reservations
  inputs:
  - name: Direct Reservations
  - name: Total Reservations
