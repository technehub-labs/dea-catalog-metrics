id: dea:metric-average-resolution-time
name: Average Resolution Time
type: Metric
description: Within Customer, Average Resolution Time (ART) is used to gauge how efficiently resources
  are converted into outputs. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Total Resolution Time / Resolved Cases, expressed in
  hours. It should be driven down, since lower readings signal healthier performance. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: ART
unit: hours
