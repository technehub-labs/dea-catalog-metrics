id: dea:metric-emergency-patch-cycle-time
name: Emergency Patch Cycle Time
type: Metric
description: Emergency Patch Cycle Time (EPCT-VM) measures how efficiently resources are converted into
  outputs in the Vulnerability & Exposure Management domain. Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. It is computed as Hours from Emergency Patch
  Release to Deployment, expressed in hours. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
