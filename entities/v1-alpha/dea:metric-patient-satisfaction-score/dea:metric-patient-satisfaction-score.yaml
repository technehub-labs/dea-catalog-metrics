id: dea:metric-patient-satisfaction-score
name: Patient Satisfaction Score
type: Metric
description: Patient Satisfaction Score (PSS) measures the engagement or satisfaction of the people involved
  in the Healthcare domain. Its calculation is Satisfied Patient Survey Responses / Responses, measured
  in percent (%). It originates from and is most used in Healthcare practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: PSS
unit: percent
