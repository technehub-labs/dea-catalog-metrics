id: dea:metric-estimated-bill-rate
name: Estimated Bill Rate
type: Metric
description: Estimated Bill Rate (EBR-U) captures the quality of outputs and outcomes for organizations
  tracking utilities customer operations. Its calculation is Estimated Bills / Total Bills Issued, measured
  in percent (%). It originates from and is most used in Utilities practice. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: EBR-U
unit: percent
