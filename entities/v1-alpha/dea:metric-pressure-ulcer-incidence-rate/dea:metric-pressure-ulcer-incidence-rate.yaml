id: dea:metric-pressure-ulcer-incidence-rate
name: Pressure Ulcer Incidence Rate
type: Metric
description: 'A Elder & Social Care indicator, Pressure Ulcer Incidence Rate (PUIR) quantifies the quality
  of outputs and outcomes. It is computed as New Pressure Ulcers / Resident Days x 1,000, expressed in
  events per thousand or million (scaled). Its use is concentrated in Social care. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
