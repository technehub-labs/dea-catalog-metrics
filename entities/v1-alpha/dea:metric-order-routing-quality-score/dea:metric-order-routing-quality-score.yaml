id: dea:metric-order-routing-quality-score
name: Order Routing Quality Score
type: Metric
description: Order Routing Quality Score (ORQS-T) addresses the quality of outputs and outcomes and is
  a fixture of investment research & trading operations reporting. Its calculation is Composite Routing
  Cost and Fill Score, measured in score (points). It originates from and is most used in Financial Services
  practice. It provides the day-to-day signal that a process is running as designed. It should be maximized
  within the limits of cost and quality trade-offs.
