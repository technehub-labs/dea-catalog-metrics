id: dea:metric-equipment-uptime-in-fab
name: Equipment Uptime in Fab
type: Metric
description: Equipment Uptime in Fab (EUPT) addresses the utilization or availability of capacity and
  is a fixture of semiconductor & electronics reporting. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Tool Productive Time / Total
  Tool Time, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Its use is concentrated in Electronics & semiconductors.
abbreviation: EUPT
unit: percent
version: 1.1.0
lifecycle_status: candidate
