id: dea:metric-near-miss-reporting-rate-construction-deep-dive
name: Near Miss Reporting Rate (Construction Deep Dive)
type: Metric
description: Within Construction Contracting (Deep Dive), Near Miss Reporting Rate (Construction Deep
  Dive) (NMRR-D) is used to gauge exposure to adverse outcomes. It is computed as Near Misses Reported
  per 200,000 Hours, expressed in events per thousand or million (scaled). Its use is concentrated in
  Construction. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It should be maximized within the limits of cost and quality trade-offs.
