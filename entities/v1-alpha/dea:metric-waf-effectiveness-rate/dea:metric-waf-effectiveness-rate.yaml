id: dea:metric-waf-effectiveness-rate
name: WAF Effectiveness Rate
type: Metric
description: WAF Effectiveness Rate (WAFER) addresses exposure to adverse outcomes and is a fixture of
  application security (appsec) reporting. It is computed as Attacks Blocked by WAF / Attack Attempts
  Detected, expressed in percent (%). Its use is concentrated in Software. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: WAFER
unit: percent
