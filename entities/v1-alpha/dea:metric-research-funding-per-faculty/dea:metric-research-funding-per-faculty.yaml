id: dea:metric-research-funding-per-faculty
name: Research Funding per Faculty
type: Metric
description: A Education indicator, Research Funding per Faculty (RFF) quantifies growth over time. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  Its calculation is Total Research Funding / Faculty FTEs, measured in currency per unit. Improvement
  means raising this figure toward best-in-class levels. It originates from and is most used in Education
  practice.
