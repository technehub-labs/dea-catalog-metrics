id: dea:metric-combined-loan-to-value-ratio
name: Combined Loan-to-Value Ratio
type: Metric
description: A Real Estate & Mortgage Standard Measures indicator, Combined Loan-to-Value Ratio (CLTV)
  quantifies exposure to adverse outcomes. It is defined as All Secured Debt / Property Value; the result
  is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Lower values are better; each reduction is an improvement. In Real estate, it is
  a recognized element of the standard performance toolkit.
abbreviation: CLTV
unit: percent
