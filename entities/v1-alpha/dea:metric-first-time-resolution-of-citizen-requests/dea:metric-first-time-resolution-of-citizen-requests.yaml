id: dea:metric-first-time-resolution-of-citizen-requests
name: First-Time Resolution of Citizen Requests
type: Metric
description: 'A Public Sector & Government indicator, First-Time Resolution of Citizen Requests (FTCR)
  quantifies the quality of outputs and outcomes. The formula is Requests Resolved without Follow-up /
  Requests Received - reported in percent (%). It is a standard measure in the Public sector sector. It
  guides mid-horizon planning: portfolio, program, and function owners act on it between review cycles.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: FTCR
unit: percent
