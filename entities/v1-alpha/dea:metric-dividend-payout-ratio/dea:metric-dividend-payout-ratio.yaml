id: dea:metric-dividend-payout-ratio
name: Dividend Payout Ratio
type: Metric
description: 'Dividend Payout Ratio (DPR) captures the economic value created or preserved for organizations
  tracking investor relations & capital markets. It is computed as Dividends Paid / Net Income, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It is managed toward a defined target band rather than an extreme - both overshoot and
  undershoot can signal problems. Its use is concentrated in Listed companies.'
abbreviation: DPR
unit: percent
