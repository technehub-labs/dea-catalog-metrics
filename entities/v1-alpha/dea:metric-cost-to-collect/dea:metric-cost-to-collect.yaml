id: dea:metric-cost-to-collect
name: Cost to Collect
type: Metric
description: A Healthcare Revenue Cycle indicator, Cost to Collect (CTC) quantifies how efficiently resources
  are converted into outputs. It is defined as Total Revenue Cycle Cost / Collected Revenue; the result
  is stated in percent (%). In Healthcare, it is a recognized element of the standard performance toolkit.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: CTC
unit: percent
