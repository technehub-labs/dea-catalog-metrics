id: dea:metric-landfill-gas-capture-rate
name: Landfill Gas Capture Rate
type: Metric
description: Landfill Gas Capture Rate (LGCR) captures environmental and social sustainability performance
  for organizations tracking waste & environmental services. The formula is Captured Landfill Gas / Generated
  Landfill Gas - reported in percent (%). It is a standard measure in the Environmental services sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
