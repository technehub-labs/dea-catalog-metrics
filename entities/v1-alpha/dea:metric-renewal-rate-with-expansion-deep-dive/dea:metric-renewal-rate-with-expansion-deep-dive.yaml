id: dea:metric-renewal-rate-with-expansion-deep-dive
name: Renewal Rate with Expansion (Deep Dive)
type: Metric
description: 'Renewal Rate with Expansion (Deep Dive) (RREWED) addresses the retention of customers, users,
  or assets over time and is a fixture of unit economics & growth (deep dive) reporting. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Renewed including Uplift / Contract Value Up for Renewal, expressed in percent (%). Improvement means
  raising this figure toward best-in-class levels. Its use is concentrated in Software.'
