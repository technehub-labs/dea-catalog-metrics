id: dea:metric-user-journey-drop-off-rate
name: User Journey Drop-off Rate
type: Metric
description: User Journey Drop-off Rate (UJDR) measures the retention of customers, users, or assets over
  time in the UX & Design Systems domain. It is computed as Users Abandoning at Step / Users Reaching
  Step, expressed in percent (%). It is applied across virtually every sector. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. Reduction is the goal,
  and sustained decreases indicate successful intervention.
abbreviation: UJDR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
