id: dea:metric-carbon-intensity-per-revenue
name: Carbon Intensity per Revenue
type: Metric
description: Carbon Intensity per Revenue (CIR-S) captures environmental and social sustainability performance
  for organizations tracking sustainability & esg. Its calculation is Total CO2e Emissions / Revenue,
  measured in ratio (x:1 or x). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and
  sustained decreases indicate successful intervention.
