id: dea:metric-cost-performance-index-programs
name: Cost Performance Index (Programs)
type: Metric
description: Cost Performance Index (Programs) (CPI-P) captures how efficiently resources are converted
  into outputs for organizations tracking aerospace & defense program management. It carries weight in
  boardroom and executive reviews, where it anchors cross-organization trade-offs. The formula is EV /
  AC - reported in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels.
  It is a standard measure in the Aerospace & Defense sector.
