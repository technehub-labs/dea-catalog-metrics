id: dea:metric-inbound-license-compliance-rate
name: Inbound License Compliance Rate
type: Metric
description: 'Inbound License Compliance Rate (ILCR) captures exposure to adverse outcomes for organizations
  tracking intellectual property & licensing. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Third-Party IP Usage within License Terms / Usage Sampled
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
