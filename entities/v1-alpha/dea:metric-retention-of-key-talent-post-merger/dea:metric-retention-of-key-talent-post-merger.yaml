id: dea:metric-retention-of-key-talent-post-merger
name: Retention of Key Talent (Post-Merger)
type: Metric
description: 'Retention of Key Talent (Post-Merger) (RKTP) addresses the retention of customers, users,
  or assets over time and is a fixture of mergers & acquisitions reporting. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Key Personnel
  Retained at 12 Months / Key Personnel, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: RKTP
unit: percent
