id: dea:metric-emerging-risk-mitigation-lead-time
name: Emerging Risk Mitigation Lead Time
type: Metric
description: Emerging Risk Mitigation Lead Time (ERMLT) captures how efficiently resources are converted
  into outputs for organizations tracking emerging risk & horizon scanning. Its calculation is Days from
  Risk Accepted to First Mitigation in Place, measured in days. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Lower values are better; each
  reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
