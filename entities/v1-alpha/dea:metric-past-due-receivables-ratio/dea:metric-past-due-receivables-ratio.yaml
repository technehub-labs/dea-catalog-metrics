id: dea:metric-past-due-receivables-ratio
name: Past Due Receivables Ratio
type: Metric
description: 'A Accounts Payable & Receivable Operations (Deep Dive) indicator, Past Due Receivables Ratio
  (PDRR) quantifies exposure to adverse outcomes. It is defined as Receivables Past Due / Total Receivables;
  the result is stated in percent (%). It is applied across virtually every sector. It is a working-level
  control: thresholds trigger immediate operational response. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
abbreviation: PDRR
unit: percent
version: 1.1.0
