id: dea:metric-sales-per-rep-per-month
name: Sales per Rep per Month
type: Metric
description: 'Sales per Rep per Month (SPM) captures how effectively a process or entity achieves its
  intended outcome for organizations tracking sales. It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. The formula is Monthly Closed Revenue / Active Sales Reps -
  reported in currency per unit. Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
