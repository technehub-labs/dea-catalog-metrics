id: dea:metric-customer-specification-compliance
name: Customer Specification Compliance
type: Metric
description: Within Chemicals, Customer Specification Compliance (CSC) is used to gauge the quality of
  outputs and outcomes. It is computed as Batches Meeting Customer Specification / Batches Tested, expressed
  in percent (%). Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Chemicals.
