id: dea:metric-alliance-margin-contribution
name: Alliance Margin Contribution
type: Metric
description: A Alliances & Partnerships Management indicator, Alliance Margin Contribution (AMC-AP) quantifies
  the economic value created or preserved. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Alliance Gross Margin / Total Gross
  Margin, measured in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: AMC-AP
unit: percent
