id: dea:metric-dei-goal-attainment-rate
name: DEI Goal Attainment Rate
type: Metric
description: DEI Goal Attainment Rate (DEIGAR) addresses conformance to standards, plans, or obligations
  and is a fixture of diversity, equity & inclusion (deep dive) reporting. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Published DEI Goals
  Achieved / Goals; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: DEIGAR
unit: percent
