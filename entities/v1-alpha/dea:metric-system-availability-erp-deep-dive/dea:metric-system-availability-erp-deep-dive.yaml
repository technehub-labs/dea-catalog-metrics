id: dea:metric-system-availability-erp-deep-dive
name: System Availability - ERP (Deep Dive)
type: Metric
description: A ERP & Enterprise Application Operations indicator, System Availability - ERP (Deep Dive)
  (SAE-D) quantifies the utilization or availability of capacity. Its calculation is Available Hours /
  Required Hours, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: SAE-D
