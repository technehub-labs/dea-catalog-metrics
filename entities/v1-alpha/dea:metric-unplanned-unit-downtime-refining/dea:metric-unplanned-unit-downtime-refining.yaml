id: dea:metric-unplanned-unit-downtime-refining
name: Unplanned Unit Downtime (Refining)
type: Metric
description: Within Oil & Gas Downstream & Refining, Unplanned Unit Downtime (Refining) (UUDR) is used
  to gauge exposure to adverse outcomes. Its calculation is Unplanned Downtime / Operating Period, measured
  in percent (%). It originates from and is most used in Oil & Gas practice. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and
  sustained decreases indicate successful intervention.
