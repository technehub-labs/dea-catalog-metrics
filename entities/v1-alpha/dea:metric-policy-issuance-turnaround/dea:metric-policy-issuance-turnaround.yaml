id: dea:metric-policy-issuance-turnaround
name: Policy Issuance Turnaround
type: Metric
description: Policy Issuance Turnaround (PIT) addresses how efficiently resources are converted into outputs
  and is a fixture of insurance distribution & brokerage reporting. Its calculation is Hours from Application
  to Policy Issued, measured in hours. It provides the day-to-day signal that a process is running as
  designed. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Insurance distribution practice.
