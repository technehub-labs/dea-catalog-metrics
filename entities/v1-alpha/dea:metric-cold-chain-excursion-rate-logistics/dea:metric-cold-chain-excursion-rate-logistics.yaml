id: dea:metric-cold-chain-excursion-rate-logistics
name: Cold Chain Excursion Rate (Logistics)
type: Metric
description: 'Cold Chain Excursion Rate (Logistics) (CCER) addresses exposure to adverse outcomes and
  is a fixture of supply chain standard measures (deep dive) reporting. The formula is Shipments with
  Temperature Excursion / Monitored Shipments - reported in events per thousand or million (scaled). It
  is monitored close to the work: teams act on it within a shift, sprint, or daily review. Lower values
  are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
