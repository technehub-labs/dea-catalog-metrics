id: dea:metric-cargo-load-factor
name: Cargo Load Factor
type: Metric
description: Within Airline & Transportation Standard Measures (Deep Dive), Cargo Load Factor (CLF-AT)
  is used to gauge how efficiently resources are converted into outputs. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Cargo
  Tonne-Kilometers Carried / Available Tonne-Kilometers, measured in percent (%). Improvement means raising
  this figure toward best-in-class levels. It originates from and is most used in Airlines & Aviation
  practice.
abbreviation: CLF-AT
unit: percent
