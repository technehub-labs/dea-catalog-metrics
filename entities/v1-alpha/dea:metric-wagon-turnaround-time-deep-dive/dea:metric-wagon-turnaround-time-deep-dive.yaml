id: dea:metric-wagon-turnaround-time-deep-dive
name: Wagon Turnaround Time (Deep Dive)
type: Metric
description: Within Rail Freight (Deep Dive), Wagon Turnaround Time (Deep Dive) (WTT-D) is used to gauge
  how efficiently resources are converted into outputs. It is defined as Days from Load to Reload; the
  result is stated in days. In Rail, it is a recognized element of the standard performance toolkit. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
