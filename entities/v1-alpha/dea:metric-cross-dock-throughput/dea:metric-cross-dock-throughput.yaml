id: dea:metric-cross-dock-throughput
name: Cross-Dock Throughput
type: Metric
description: Within Warehousing, Cross-Dock Throughput (CDT) is used to gauge the utilization or availability
  of capacity. It is computed as Units Cross-Docked / Day, expressed in count (items per period). It is
  applied across virtually every sector. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: CDT
unit: count
