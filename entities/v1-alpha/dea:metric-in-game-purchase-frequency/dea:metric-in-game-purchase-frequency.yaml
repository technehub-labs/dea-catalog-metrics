id: dea:metric-in-game-purchase-frequency
name: In-Game Purchase Frequency
type: Metric
description: 'Within Gaming, In-Game Purchase Frequency (IGPF) is used to gauge the economic value created
  or preserved. It guides mid-horizon planning: portfolio, program, and function owners act on it between
  review cycles. The formula is Purchases / Active Players per Period - reported in ratio (x:1 or x).
  Improvement means raising this figure toward best-in-class levels. It is a standard measure in the Gaming
  sector.'
