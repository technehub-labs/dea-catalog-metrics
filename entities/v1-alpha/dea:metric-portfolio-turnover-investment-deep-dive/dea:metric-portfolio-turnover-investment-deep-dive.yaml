id: dea:metric-portfolio-turnover-investment-deep-dive
name: Portfolio Turnover (Investment Deep Dive)
type: Metric
description: Portfolio Turnover (Investment Deep Dive) (PTID) measures how efficiently resources are converted
  into outputs in the Investment Management - Portfolio Operations domain. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Lesser of Purchases or Sales
  / Average NAV, measured in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. It originates from and is most used in Financial Services practice.
abbreviation: PTID
unit: percent
version: 1.1.0
