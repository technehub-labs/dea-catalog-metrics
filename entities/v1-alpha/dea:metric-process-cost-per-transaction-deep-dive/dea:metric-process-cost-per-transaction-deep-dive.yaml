id: dea:metric-process-cost-per-transaction-deep-dive
name: Process Cost per Transaction (Deep Dive)
type: Metric
description: 'Process Cost per Transaction (Deep Dive) (PCPT-D) captures how efficiently resources are
  converted into outputs for organizations tracking balanced scorecard - internal process perspective.
  It is computed as Operating Cost / Process Transactions, expressed in currency per unit. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Lower values are
  better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
