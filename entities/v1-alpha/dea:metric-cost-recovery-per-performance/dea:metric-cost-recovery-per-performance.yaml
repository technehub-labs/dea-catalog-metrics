id: dea:metric-cost-recovery-per-performance
name: Cost Recovery per Performance
type: Metric
description: Within Arts & Culture, Cost Recovery per Performance (CRPP) is used to gauge the economic
  value created or preserved. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Earned Revenue / Direct Production Costs, measured
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. It originates
  from and is most used in Arts & culture practice.
abbreviation: CRPP
unit: ratio
