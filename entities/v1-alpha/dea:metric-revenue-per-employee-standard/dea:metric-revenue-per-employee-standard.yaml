id: dea:metric-revenue-per-employee-standard
name: Revenue per Employee (Standard)
type: Metric
description: Revenue per Employee (Standard) (RPEDD) captures how efficiently resources are converted
  into outputs for organizations tracking standard workforce & pay metrics. The formula is Revenue / Average
  Headcount - reported in currency per unit. It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
