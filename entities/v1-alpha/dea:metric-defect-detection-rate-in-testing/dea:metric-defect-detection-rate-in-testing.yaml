id: dea:metric-defect-detection-rate-in-testing
name: Defect Detection Rate in Testing
type: Metric
description: Within Software Testing & Quality Engineering, Defect Detection Rate in Testing (DDRT-QA)
  is used to gauge the quality of outputs and outcomes. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Defects Found before Release / Total
  Defects - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: DDRT-QA
unit: percent
