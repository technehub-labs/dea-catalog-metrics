id: dea:metric-product-retirement-compliance-telecom
name: Product Retirement Compliance (Telecom)
type: Metric
description: 'Product Retirement Compliance (Telecom) (PRCT) addresses conformance to standards, plans,
  or obligations and is a fixture of telecom product & bundle management reporting. The formula is Retirements
  Completed by Migration Deadline / Retirements Planned - reported in percent (%). It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. Higher values are
  better; gains are read as improvement and losses as deterioration. It is a standard measure in the Telecommunications
  sector.'
abbreviation: PRCT
unit: percent
version: 1.1.0
