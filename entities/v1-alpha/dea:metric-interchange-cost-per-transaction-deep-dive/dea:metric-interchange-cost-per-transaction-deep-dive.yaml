id: dea:metric-interchange-cost-per-transaction-deep-dive
name: Interchange Cost per Transaction (Deep Dive)
type: Metric
description: A Payments & Cards (Deep Dive) indicator, Interchange Cost per Transaction (Deep Dive) (ICPT-D)
  quantifies how efficiently resources are converted into outputs. Its value drives prioritization and
  resource reallocation among competing initiatives. Its calculation is Interchange Fees / Transactions,
  measured in currency per unit. It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Payments practice.
