id: dea:metric-market-share-deep-dive
name: Market Share (Deep Dive)
type: Metric
description: Market Share (Deep Dive) (MSDD) captures growth over time for organizations tracking market
  structure & economics standard measures. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Entity Sales / Total Addressable Market Sales; the
  result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
