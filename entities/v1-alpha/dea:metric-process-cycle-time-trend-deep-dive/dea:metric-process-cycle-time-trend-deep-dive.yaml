id: dea:metric-process-cycle-time-trend-deep-dive
name: Process Cycle Time Trend (Deep Dive)
type: Metric
description: 'Within Balanced Scorecard - Internal Process Perspective, Process Cycle Time Trend (Deep
  Dive) (PCTT-D) is used to gauge how efficiently resources are converted into outputs. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Change in Process Cycle Time between Periods, expressed in days. It should be driven down, since
  lower readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
