id: dea:metric-sales-per-labor-hour
name: Sales per Labor Hour
type: Metric
description: 'Sales per Labor Hour (SPLH) addresses how efficiently resources are converted into outputs
  and is a fixture of retail standard measures reporting. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. The formula is Net Sales / Store Labor Hours - reported
  in currency per unit. Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Retail & E-commerce sector.'
