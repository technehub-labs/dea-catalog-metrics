id: dea:metric-mean-time-to-restore-service
name: Mean Time to Restore Service
type: Metric
description: 'A Software Engineering indicator, Mean Time to Restore Service (MTTRS) quantifies the quality
  of outputs and outcomes. It is computed as Median Time from Incident Start to Service Restoration, expressed
  in hours. It is applied across virtually every sector. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
