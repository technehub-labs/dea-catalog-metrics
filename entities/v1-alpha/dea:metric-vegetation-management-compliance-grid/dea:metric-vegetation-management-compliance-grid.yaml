id: dea:metric-vegetation-management-compliance-grid
name: Vegetation Management Compliance (Grid)
type: Metric
description: A Utilities Field Operations & Grid indicator, Vegetation Management Compliance (Grid) (VMC)
  quantifies exposure to adverse outcomes. Its calculation is Spans Treated per Cycle Plan / Planned,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Utilities practice.
abbreviation: VMC
unit: percent
