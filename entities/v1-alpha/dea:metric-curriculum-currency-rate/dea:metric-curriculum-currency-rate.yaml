id: dea:metric-curriculum-currency-rate
name: Curriculum Currency Rate
type: Metric
description: 'Curriculum Currency Rate (CURR) captures the quality of outputs and outcomes for organizations
  tracking education & training outcome standard measures. It is computed as Courses Reviewed within Update
  Cycle / Courses, expressed in percent (%). Its use is concentrated in Education. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
