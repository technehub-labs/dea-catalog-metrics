id: dea:metric-security-awareness-training-completion
name: Security Awareness Training Completion
type: Metric
description: 'Security Awareness Training Completion (SATC) measures conformance to standards, plans,
  or obligations in the Cybersecurity domain. The formula is Users Completing Training / Users Assigned
  - reported in percent (%). It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: SATC
unit: percent
