id: dea:metric-field-work-safety-incident-rate
name: Field Work Safety Incident Rate
type: Metric
description: A Field Maintenance & Technical Field Service (Deep Dive) indicator, Field Work Safety Incident
  Rate (FWSIR) quantifies exposure to adverse outcomes. Its calculation is Field Safety Incidents per
  200,000 Hours, measured in events per thousand or million (scaled). It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Lower values are better;
  each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
