id: dea:metric-cart-abandonment-rate
name: Cart Abandonment Rate
type: Metric
description: Within Retail & E-commerce, Cart Abandonment Rate (CAR) is used to gauge exposure to adverse
  outcomes. Its value drives prioritization and resource reallocation among competing initiatives. Its
  calculation is Abandoned Carts / Carts Created, measured in percent (%). It should be driven down, since
  lower readings signal healthier performance. It originates from and is most used in Retail practice.
