id: dea:metric-cost-per-available-seat-kilometre
name: Cost per Available Seat Kilometre
type: Metric
description: Cost per Available Seat Kilometre (CASK) addresses how efficiently resources are converted
  into outputs and is a fixture of airlines & aviation reporting. It is defined as Total Operating Cost
  / Available Seat Kilometres; the result is stated in currency per unit. In Airlines & aviation, it is
  a recognized element of the standard performance toolkit. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: CASK
