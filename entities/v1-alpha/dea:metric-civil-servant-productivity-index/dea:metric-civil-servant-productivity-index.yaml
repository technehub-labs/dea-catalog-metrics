id: dea:metric-civil-servant-productivity-index
name: Civil Servant Productivity Index
type: Metric
description: Civil Servant Productivity Index (CSPI) addresses how effectively a process or entity achieves
  its intended outcome and is a fixture of public sector & government reporting. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Weighted
  Index of Throughput, Timeliness, Satisfaction; the result is stated in index (0-100 or normalized).
  Improvement means raising this figure toward best-in-class levels. In Public sector, it is a recognized
  element of the standard performance toolkit.
