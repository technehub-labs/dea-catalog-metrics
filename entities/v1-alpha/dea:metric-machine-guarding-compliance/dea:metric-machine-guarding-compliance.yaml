id: dea:metric-machine-guarding-compliance
name: Machine Guarding Compliance
type: Metric
description: Machine Guarding Compliance (MGC) captures conformance to standards, plans, or obligations
  for organizations tracking health & safety. Its calculation is Guarded Hazards / Identified Machine
  Hazards, measured in percent (%). It provides the day-to-day signal that a process is running as designed.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
