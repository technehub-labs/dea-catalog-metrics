id: dea:metric-price-realization-rate-market
name: Price Realization Rate (Market)
type: Metric
description: A Market Structure & Economics Standard Measures indicator, Price Realization Rate (Market)
  (PRR-MKT) quantifies the economic value created or preserved. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Realized Price Change / List Price
  Change; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
