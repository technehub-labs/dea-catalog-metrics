id: dea:metric-alarm-response-time
name: Alarm Response Time
type: Metric
description: Alarm Response Time (ALRT) captures how efficiently resources are converted into outputs
  for organizations tracking physical security operations. Its calculation is Minutes from Alarm to Security
  Response on Scene, measured in minutes. It provides the day-to-day signal that a process is running
  as designed. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
