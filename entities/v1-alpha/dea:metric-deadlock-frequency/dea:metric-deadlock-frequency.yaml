id: dea:metric-deadlock-frequency
name: Deadlock Frequency
type: Metric
description: 'A Database & Data Platform Operations indicator, Deadlock Frequency (DLF-DB) quantifies
  the quality of outputs and outcomes. The formula is Deadlocks per Period - reported in count (items
  per period). It is a standard measure in the Software sector. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
