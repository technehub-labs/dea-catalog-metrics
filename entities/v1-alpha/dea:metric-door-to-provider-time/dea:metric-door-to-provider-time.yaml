id: dea:metric-door-to-provider-time
name: Door-to-Provider Time
type: Metric
description: Door-to-Provider Time (D2PT) addresses how efficiently resources are converted into outputs
  and is a fixture of healthcare quality & patient safety standard measures reporting. It provides the
  day-to-day signal that a process is running as designed. Its calculation is Minutes from ED Arrival
  to First Provider Contact, measured in minutes. It should be driven down, since lower readings signal
  healthier performance. It originates from and is most used in Healthcare practice.
abbreviation: D2PT
unit: minute
version: 1.1.0
