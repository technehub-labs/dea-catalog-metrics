id: dea:metric-monitoring-coverage-ratio
name: Monitoring Coverage Ratio
type: Metric
description: Monitoring Coverage Ratio (MONCR) addresses capability maturity or development and is a fixture
  of network operations center (deep dive) reporting. The formula is Devices under Monitoring / In-Scope
  Devices - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
