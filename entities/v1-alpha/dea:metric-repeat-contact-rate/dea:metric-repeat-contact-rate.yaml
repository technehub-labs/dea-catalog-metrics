id: dea:metric-repeat-contact-rate
name: Repeat Contact Rate
type: Metric
description: Within Contact Center, Repeat Contact Rate (RCR-CC) is used to gauge the quality of outputs
  and outcomes. Its value drives prioritization and resource reallocation among competing initiatives.
  Its calculation is Contacts Requiring More than One Interaction / Total Contact Reasons, measured in
  percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: RCR-CC
unit: percent
