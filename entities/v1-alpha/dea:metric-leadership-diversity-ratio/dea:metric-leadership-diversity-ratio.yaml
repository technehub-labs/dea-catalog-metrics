id: dea:metric-leadership-diversity-ratio
name: Leadership Diversity Ratio
type: Metric
description: Within Diversity, Equity & Inclusion (Deep Dive), Leadership Diversity Ratio (LDR-DEI) is
  used to gauge capability maturity or development. Its calculation is Underrepresented Groups in Leadership
  / Leadership Roles, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
