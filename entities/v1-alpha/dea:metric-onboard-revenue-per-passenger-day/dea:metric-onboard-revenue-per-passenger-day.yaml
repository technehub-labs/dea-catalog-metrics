id: dea:metric-onboard-revenue-per-passenger-day
name: Onboard Revenue per Passenger Day
type: Metric
description: 'A Cruise & Passenger Shipping indicator, Onboard Revenue per Passenger Day (ORPD) quantifies
  the economic value created or preserved. It is computed as Onboard Spend / Passenger Days, expressed
  in currency per unit. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Hospitality.'
