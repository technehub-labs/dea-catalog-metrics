id: dea:metric-dau-to-mau-stickiness-deep-dive
name: DAU-to-MAU Stickiness (Deep Dive)
type: Metric
description: DAU-to-MAU Stickiness (Deep Dive) (DMS-D) addresses the engagement or satisfaction of the
  people involved and is a fixture of gaming development & live operations reporting. Its calculation
  is DAU / MAU, measured in percent (%). It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Gaming practice.
