description: 'Within Industrial Automation & Robotics, Automation Upgrade Compliance (AUC) is used to
  gauge conformance to standards, plans, or obligations. It is a working-level control: thresholds trigger
  immediate operational response. It is defined as Cells Running Current Firmware and Safety Config /
  Cells; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Manufacturing, it is a recognized element of the standard performance toolkit.'
