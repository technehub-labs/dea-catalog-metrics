name: Permitted Operating Deviations
type: Metric
description: A Regulatory Affairs & Compliance Operations indicator, Permitted Operating Deviations (POD)
  quantifies exposure to adverse outcomes. Its calculation is Approved Deviations from Regulatory Standard
  / Requests, measured in percent (%). It is applied across virtually every sector. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
