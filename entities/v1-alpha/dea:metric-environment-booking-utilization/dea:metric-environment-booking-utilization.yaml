id: dea:metric-environment-booking-utilization
name: Environment Booking Utilization
type: Metric
description: Within Release Management & Environments, Environment Booking Utilization (EBU-RM) is used
  to gauge the utilization or availability of capacity. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Booked Environment Hours /
  Available Hours, expressed in percent (%). The objective is neither maximization nor minimization but
  staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: EBU-RM
unit: percent
