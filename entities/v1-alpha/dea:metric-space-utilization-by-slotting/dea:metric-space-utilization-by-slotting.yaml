id: dea:metric-space-utilization-by-slotting
name: Space Utilization by Slotting
type: Metric
description: Space Utilization by Slotting (SUS) addresses the utilization or availability of capacity
  and is a fixture of warehousing reporting. Its calculation is Slotted Pick Faces in Use / Total Pick
  Faces, measured in percent (%). It is applied across virtually every sector. It provides the day-to-day
  signal that a process is running as designed. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: SUS
unit: percent
