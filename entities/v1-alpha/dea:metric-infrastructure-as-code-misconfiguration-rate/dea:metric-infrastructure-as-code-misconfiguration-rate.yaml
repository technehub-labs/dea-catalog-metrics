id: dea:metric-infrastructure-as-code-misconfiguration-rate
name: Infrastructure-as-Code Misconfiguration Rate
type: Metric
description: 'Within DevSecOps & Application Security Engineering, Infrastructure-as-Code Misconfiguration
  Rate (IaCMR) is used to gauge exposure to adverse outcomes. The formula is Misconfigurations Found per
  1,000 IaC Lines - reported in events per thousand or million (scaled). It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
