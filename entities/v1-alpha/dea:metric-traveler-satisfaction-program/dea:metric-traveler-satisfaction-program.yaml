id: dea:metric-traveler-satisfaction-program
name: Traveler Satisfaction (Program)
type: Metric
description: A Corporate Travel Management indicator, Traveler Satisfaction (Program) (TSP) quantifies
  the engagement or satisfaction of the people involved. It is computed as Satisfied Traveler Survey Responses
  / Responses, expressed in percent (%). It is applied across virtually every sector. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
