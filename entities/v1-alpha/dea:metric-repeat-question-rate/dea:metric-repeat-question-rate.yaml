id: dea:metric-repeat-question-rate
name: Repeat Question Rate
type: Metric
description: Repeat Question Rate (RQR-KM) captures the quality of outputs and outcomes for organizations
  tracking knowledge management (deep dive). It provides the day-to-day signal that a process is running
  as designed. Its calculation is Questions Asked That Have Existing Answers / Questions, measured in
  percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: RQR-KM
unit: percent
