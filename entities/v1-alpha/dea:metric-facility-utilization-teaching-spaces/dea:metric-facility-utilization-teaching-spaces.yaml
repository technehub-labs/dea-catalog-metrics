id: dea:metric-facility-utilization-teaching-spaces
name: Facility Utilization (Teaching Spaces)
type: Metric
description: Facility Utilization (Teaching Spaces) (FUTS) captures the utilization or availability of
  capacity for organizations tracking education & training outcome standard measures. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. It is computed as Scheduled
  Teaching Hours / Available Space Hours, expressed in percent (%). The objective is neither maximization
  nor minimization but staying within an agreed operating band. Its use is concentrated in Education.
abbreviation: FUTS
unit: percent
