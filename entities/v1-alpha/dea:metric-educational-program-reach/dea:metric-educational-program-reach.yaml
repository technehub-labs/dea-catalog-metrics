id: dea:metric-educational-program-reach
name: Educational Program Reach
type: Metric
description: 'Educational Program Reach (EPR-A) captures the economic value created or preserved for organizations
  tracking arts & culture. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. It is computed as Participants in Education Programs per Period, expressed
  in count (items per period). Improvement means raising this figure toward best-in-class levels. Its
  use is concentrated in Arts & culture.'
