id: dea:metric-golden-record-confidence-score
name: Golden Record Confidence Score
type: Metric
description: Golden Record Confidence Score (GRCS) addresses the quality of outputs and outcomes and is
  a fixture of data governance & stewardship reporting. It is defined as Composite of Completeness, Uniqueness,
  Timeliness for Golden Records; the result is stated in score (points). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
