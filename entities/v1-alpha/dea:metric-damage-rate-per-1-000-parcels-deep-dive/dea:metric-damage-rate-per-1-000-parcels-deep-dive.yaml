id: dea:metric-damage-rate-per-1-000-parcels-deep-dive
name: Damage Rate per 1,000 Parcels (Deep Dive)
type: Metric
description: Damage Rate per 1,000 Parcels (Deep Dive) (DR1K-D) captures the quality of outputs and outcomes
  for organizations tracking parcel & last-mile logistics (deep dive). It is computed as Damaged Parcels
  / 1,000 Parcels, expressed in events per thousand or million (scaled). Its use is concentrated in Logistics
  & Trade. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  Reduction is the goal, and sustained decreases indicate successful intervention.
