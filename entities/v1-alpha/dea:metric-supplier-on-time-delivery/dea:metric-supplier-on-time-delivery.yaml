id: dea:metric-supplier-on-time-delivery
name: Supplier On-Time Delivery
type: Metric
description: Within Supply Chain, Supplier On-Time Delivery (SOTD) is used to gauge the quality of outputs
  and outcomes. Its calculation is Supplier Deliveries On Time / Total Supplier Deliveries, measured in
  percent (%). Its value drives prioritization and resource reallocation among competing initiatives.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SOTD
unit: percent
