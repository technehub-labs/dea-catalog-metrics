id: dea:metric-engagement-satisfaction-score
name: Engagement Satisfaction Score
type: Metric
description: 'A Professional Services indicator, Engagement Satisfaction Score (ESS) quantifies the engagement
  or satisfaction of the people involved. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is Satisfied Client Survey Responses / Responses
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. It is
  a standard measure in the Professional services sector.'
