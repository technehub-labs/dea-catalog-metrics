id: dea:metric-gig-quality-score
name: Gig Quality Score
type: Metric
description: Within Gig & Contingent Workforce, Gig Quality Score (GQS) is used to gauge the quality of
  outputs and outcomes. It is computed as Average Quality Rating of Completed Tasks, expressed in score
  (points). It is applied across virtually every sector. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It should be maximized within the limits of cost
  and quality trade-offs.
