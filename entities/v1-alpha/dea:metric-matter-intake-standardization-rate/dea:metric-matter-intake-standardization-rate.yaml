id: dea:metric-matter-intake-standardization-rate
name: Matter Intake Standardization Rate
type: Metric
description: Matter Intake Standardization Rate (MISR) captures the quality of outputs and outcomes for
  organizations tracking legal operations. It is computed as Matters via Standard Intake / Matters, expressed
  in percent (%). It is applied across virtually every sector. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. It should be maximized within the limits
  of cost and quality trade-offs.
