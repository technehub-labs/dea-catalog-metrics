id: dea:metric-volunteer-retention-rate
name: Volunteer Retention Rate
type: Metric
description: Volunteer Retention Rate (VRR-N) addresses the retention of customers, users, or assets over
  time and is a fixture of nonprofit & ngo reporting. It is defined as Volunteers Returning / Volunteers
  Engaged Previously; the result is stated in percent (%). In Nonprofit & NGO, it is a recognized element
  of the standard performance toolkit. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: VRR-N
unit: percent
