id: dea:metric-portfolio-value-delivery-rate-pmo
name: Portfolio Value Delivery Rate (PMO)
type: Metric
description: Portfolio Value Delivery Rate (PMO) (PVDR) measures the economic value created or preserved
  in the PMO & Portfolio Governance domain. It is defined as Benefits Realized vs Business Case / Business
  Case; the result is stated in percent (%). It is applied across virtually every sector. Its trend is
  watched by senior leadership as an early signal of structural performance shifts. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: PVDR
unit: percent
