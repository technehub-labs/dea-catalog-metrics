id: dea:metric-ed-length-of-stay-median
name: ED Length of Stay (Median)
type: Metric
description: A Healthcare Quality & Patient Safety Standard Measures indicator, ED Length of Stay (Median)
  (EDLOS) quantifies how efficiently resources are converted into outputs. It is computed as Median Time
  from ED Arrival to Discharge or Admission, expressed in hours. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. Lower values are better; each reduction
  is an improvement. Its use is concentrated in Healthcare.
