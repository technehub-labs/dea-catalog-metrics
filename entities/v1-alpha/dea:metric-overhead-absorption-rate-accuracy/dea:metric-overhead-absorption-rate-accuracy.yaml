id: dea:metric-overhead-absorption-rate-accuracy
name: Overhead Absorption Rate Accuracy
type: Metric
description: Overhead Absorption Rate Accuracy (OARA) captures the quality of outputs and outcomes for
  organizations tracking product costing & margin management. It is defined as 1 - ABS(Absorbed Overhead
  - Actual Overhead) / Actual Overhead; the result is stated in percent (%). It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
abbreviation: OARA
unit: percent
