id: dea:metric-trade-secret-protection-coverage
name: Trade Secret Protection Coverage
type: Metric
description: Trade Secret Protection Coverage (TSPC) captures exposure to adverse outcomes for organizations
  tracking intellectual property & licensing. The formula is Trade Secrets under Documented Controls /
  Identified Trade Secrets - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: TSPC
