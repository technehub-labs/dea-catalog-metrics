id: dea:metric-fleet-availability-mining-deep-dive
name: Fleet Availability (Mining Deep Dive)
type: Metric
description: Fleet Availability (Mining Deep Dive) (FAM) addresses the utilization or availability of
  capacity and is a fixture of metals & mining operations (deep dive) reporting. It is defined as Available
  Equipment Hours / Scheduled Hours; the result is stated in percent (%). It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. Higher values are better;
  gains are read as improvement and losses as deterioration. In Metals & Mining, it is a recognized element
  of the standard performance toolkit.
