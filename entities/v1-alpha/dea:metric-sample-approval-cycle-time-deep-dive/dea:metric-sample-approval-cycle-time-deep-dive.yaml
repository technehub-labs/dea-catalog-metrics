name: Sample Approval Cycle Time (Deep Dive)
type: Metric
description: 'A Textile & Apparel (Deep Dive) indicator, Sample Approval Cycle Time (Deep Dive) (SACT-D)
  quantifies how efficiently resources are converted into outputs. The formula is Days from Sample Submission
  to Approval - reported in days. It is a standard measure in the Textiles & Apparel sector. It guides
  mid-horizon planning: portfolio, program, and function owners act on it between review cycles. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
