id: dea:metric-average-check
name: Average Check
type: Metric
description: Average Check (AC-H) measures the economic value created or preserved in the Hospitality
  & Food Service domain. Its calculation is Revenue / Number of Guests or Checks, measured in currency
  value. It originates from and is most used in Hospitality practice. Its value drives prioritization
  and resource reallocation among competing initiatives. It should be maximized within the limits of cost
  and quality trade-offs.
