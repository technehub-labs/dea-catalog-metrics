id: dea:metric-packet-loss-rate-network-deep-dive
name: Packet Loss Rate (Network Deep Dive)
type: Metric
description: 'Packet Loss Rate (Network Deep Dive) (PLR-NW) captures the quality of outputs and outcomes
  for organizations tracking network performance & capacity. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Packets Lost / Packets Sent; the result is
  stated in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
