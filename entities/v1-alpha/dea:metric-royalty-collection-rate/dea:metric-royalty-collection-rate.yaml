id: dea:metric-royalty-collection-rate
name: Royalty Collection Rate
type: Metric
description: Royalty Collection Rate (RCR-F) addresses conformance to standards, plans, or obligations
  and is a fixture of franchise & multi-site reporting. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It is computed as Royalties Collected / Royalties Owed,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Its use
  is concentrated in Franchise & multi-site.
