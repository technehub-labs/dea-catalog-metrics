id: dea:metric-share-of-wallet-wealth
name: Share of Wallet (Wealth)
type: Metric
description: Share of Wallet (Wealth) (SOW-W) addresses growth over time and is a fixture of wealth management
  reporting. The formula is Assets Held with Firm / Client Estimated Total Assets - reported in percent
  (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Higher values are better; gains are read as improvement and losses as deterioration. It is a standard
  measure in the Wealth management sector.
