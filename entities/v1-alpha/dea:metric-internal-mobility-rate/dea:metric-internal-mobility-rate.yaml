id: dea:metric-internal-mobility-rate
name: Internal Mobility Rate
type: Metric
description: 'A Human Resources indicator, Internal Mobility Rate (IMR) quantifies capability maturity
  or development. It is computed as Employees Moving to New Internal Roles / Headcount, expressed in percent
  (%). It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: IMR
unit: percent
