id: dea:metric-financial-restatement-count
name: Financial Restatement Count
type: Metric
description: A Internal Controls & Financial Reporting Integrity indicator, Financial Restatement Count
  (FRC) quantifies exposure to adverse outcomes. It is defined as Restatements Issued in Period; the result
  is stated in count (items per period). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Reduction is the goal, and
  sustained decreases indicate successful intervention.
