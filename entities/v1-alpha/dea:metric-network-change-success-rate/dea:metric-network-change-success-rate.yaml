id: dea:metric-network-change-success-rate
name: Network Change Success Rate
type: Metric
description: 'Network Change Success Rate (NCSR) captures the quality of outputs and outcomes for organizations
  tracking network change & configuration management. It is monitored close to the work: teams act on
  it within a shift, sprint, or daily review. The formula is Changes Completed without Rollback or Incident
  / Changes - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
abbreviation: NCSR
unit: percent
