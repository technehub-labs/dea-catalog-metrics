id: dea:metric-transmission-losses
name: Transmission Losses
type: Metric
description: Transmission Losses (TL) measures how efficiently resources are converted into outputs in
  the Energy & Utilities domain. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is (Energy Sent - Energy Billed) / Energy Sent,
  measured in percent (%). It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Energy & utilities practice.
abbreviation: TL
unit: percent
