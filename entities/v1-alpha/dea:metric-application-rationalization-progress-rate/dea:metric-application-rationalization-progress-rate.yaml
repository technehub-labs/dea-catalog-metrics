id: dea:metric-application-rationalization-progress-rate
name: Application Rationalization Progress Rate
type: Metric
description: A IT Financial Management & Technology Budgeting indicator, Application Rationalization Progress
  Rate (ARRP-ITFM) quantifies how efficiently resources are converted into outputs. Its calculation is
  Applications Retired or Consolidated per Plan / Planned, measured in percent (%). It is applied across
  virtually every sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: ARRP-ITFM
