id: dea:metric-data-subject-request-cycle-time
name: Data Subject Request Cycle Time
type: Metric
description: Data Subject Request Cycle Time (DSRCT) captures how efficiently resources are converted
  into outputs for organizations tracking data privacy & protection. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Days from Request Received
  to Fulfilled, expressed in days. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: DSRCT
unit: day
