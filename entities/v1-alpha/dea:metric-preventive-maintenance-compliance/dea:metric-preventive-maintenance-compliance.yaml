id: dea:metric-preventive-maintenance-compliance
name: Preventive Maintenance Compliance
type: Metric
description: A Maintenance & Reliability indicator, Preventive Maintenance Compliance (PMC) quantifies
  conformance to standards, plans, or obligations. It is defined as PM Tasks Completed on Time / PM Tasks
  Scheduled; the result is stated in percent (%). In Manufacturing, it is a recognized element of the
  standard performance toolkit. It bridges daily operations and executive reporting, giving managers a
  lever to pull within a quarter. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: PMC
unit: percent
