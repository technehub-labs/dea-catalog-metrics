id: dea:metric-finding-and-development-cost
name: Finding and Development Cost
type: Metric
description: 'Finding and Development Cost (FDC) measures how efficiently resources are converted into
  outputs in the Oil & Gas domain. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Exploration and Development Cost / Reserves Added,
  expressed in currency per unit. It should be driven down, since lower readings signal healthier performance.
  Its use is concentrated in Oil & gas.'
