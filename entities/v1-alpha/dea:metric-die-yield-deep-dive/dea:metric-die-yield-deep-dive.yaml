id: dea:metric-die-yield-deep-dive
name: Die Yield (Deep Dive)
type: Metric
description: 'Within Semiconductor Manufacturing (Deep Dive), Die Yield (Deep Dive) (DYL-D) is used to
  gauge the quality of outputs and outcomes. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Good Die / Gross Die per Wafer, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Semiconductors.'
