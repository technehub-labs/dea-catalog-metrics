id: dea:metric-net-asset-value-growth
name: Net Asset Value Growth
type: Metric
description: A Investment Management indicator, Net Asset Value Growth (NAVG) quantifies growth over time.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Its calculation is (NAV_current - NAV_prior) / NAV_prior, measured in percent (%). Improvement
  means raising this figure toward best-in-class levels. It originates from and is most used in Asset
  management practice.
abbreviation: NAVG
unit: percent
version: 1.0.1
