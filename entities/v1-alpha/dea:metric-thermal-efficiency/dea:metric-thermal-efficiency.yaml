id: dea:metric-thermal-efficiency
name: Thermal Efficiency
type: Metric
description: 'Thermal Efficiency (THE) measures how efficiently resources are converted into outputs in
  the Energy & Utilities domain. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Useful Energy Output / Fuel Energy Input, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Energy & utilities.'
abbreviation: THE
unit: percent
version: 1.1.0
lifecycle_status: candidate
