id: dea:metric-load-forecast-accuracy-grid
name: Load Forecast Accuracy (Grid)
type: Metric
description: Load Forecast Accuracy (Grid) (LFA) captures the quality of outputs and outcomes for organizations
  tracking utilities field operations & grid. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is 1 - Absolute Forecast Error / Actual Load -
  reported in percent (%). Improvement means raising this figure toward best-in-class levels. It is a
  standard measure in the Utilities sector.
abbreviation: LFA
unit: percent
