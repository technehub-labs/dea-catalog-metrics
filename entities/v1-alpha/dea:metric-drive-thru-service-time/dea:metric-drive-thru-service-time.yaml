id: dea:metric-drive-thru-service-time
name: Drive-Thru Service Time
type: Metric
description: Drive-Thru Service Time (DTST) captures how efficiently resources are converted into outputs
  for organizations tracking restaurant operations (deep dive). It is computed as Minutes from Order to
  Hand-Off, expressed in minutes. Its use is concentrated in Restaurants. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
