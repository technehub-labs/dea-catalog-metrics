id: dea:metric-major-incident-declared-accuracy
name: Major Incident Declared Accuracy
type: Metric
description: Major Incident Declared Accuracy (MIDA) measures the quality of outputs and outcomes in the
  IT Incident & Major Problem Management domain. It is defined as Major Declarations Justified / Declarations;
  the result is stated in percent (%). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
