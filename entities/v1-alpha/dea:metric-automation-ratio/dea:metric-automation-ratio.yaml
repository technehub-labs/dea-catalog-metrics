id: dea:metric-automation-ratio
name: Automation Ratio
type: Metric
description: 'Automation Ratio (AUTO) addresses capability maturity or development and is a fixture of
  manufacturing reporting. It is computed as Automated Process Steps / Total Process Steps, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Manufacturing.'
abbreviation: AUTO
unit: percent
