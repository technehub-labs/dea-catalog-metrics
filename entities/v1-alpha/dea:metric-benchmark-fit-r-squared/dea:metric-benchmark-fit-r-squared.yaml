id: dea:metric-benchmark-fit-r-squared
name: Benchmark Fit R-Squared
type: Metric
description: A Investment Performance Measurement indicator, Benchmark Fit R-Squared (BFR2) quantifies
  the quality of outputs and outcomes. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Explained Variance of Returns vs Benchmark, expressed
  in percent (%). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Its use is concentrated in Investment management.
abbreviation: BFR2
unit: percent
