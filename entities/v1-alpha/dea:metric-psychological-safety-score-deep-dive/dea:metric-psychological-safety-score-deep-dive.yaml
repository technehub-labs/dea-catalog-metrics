id: dea:metric-psychological-safety-score-deep-dive
name: Psychological Safety Score (Deep Dive)
type: Metric
description: A Employee Engagement & Culture (Deep Dive) indicator, Psychological Safety Score (Deep Dive)
  (PSSDD) quantifies the engagement or satisfaction of the people involved. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Team-Level Psychological
  Safety Survey Composite; the result is stated in score (points). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PSSDD
