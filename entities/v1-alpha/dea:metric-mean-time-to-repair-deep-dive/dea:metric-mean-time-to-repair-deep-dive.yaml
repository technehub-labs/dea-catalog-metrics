id: dea:metric-mean-time-to-repair-deep-dive
name: Mean Time to Repair (Deep Dive)
type: Metric
description: 'A Telecom Network Operations (Deep Dive) indicator, Mean Time to Repair (Deep Dive) (MTTR-D)
  quantifies how efficiently resources are converted into outputs. The formula is Hours from Fault to
  Restoration - reported in hours. It is a standard measure in the Telecommunications sector. It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
