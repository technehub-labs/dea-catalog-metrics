id: dea:metric-content-publication-adherence-to-schedule
name: Content Publication Adherence to Schedule
type: Metric
description: Content Publication Adherence to Schedule (CPAS) captures conformance to standards, plans,
  or obligations for organizations tracking publishing & news media. It is computed as Items Published
  on Schedule / Planned, expressed in percent (%). Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is concentrated in Media & Entertainment.
abbreviation: CPAS
unit: percent
