id: dea:metric-gpu-or-accelerator-utilization
name: GPU or Accelerator Utilization
type: Metric
description: GPU or Accelerator Utilization (GAU-M) measures the utilization or availability of capacity
  in the MLOps & Model Lifecycle Operations domain. It is defined as Used Accelerator Hours / Provisioned
  Hours; the result is stated in percent (%). It is applied across virtually every sector. It bridges
  daily operations and executive reporting, giving managers a lever to pull within a quarter. Values outside
  the intended band, on either side, warrant investigation.
abbreviation: GAU-M
