id: dea:metric-client-concentration-risk
name: Client Concentration Risk
type: Metric
description: Within Professional Services, Client Concentration Risk (CCR-PS) is used to gauge exposure
  to adverse outcomes. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Largest Client Fee Revenue / Total Fee Revenue - reported in percent (%).
  It should be driven down, since lower readings signal healthier performance. It is a standard measure
  in the Professional services sector.
