id: dea:metric-planned-maintenance-window-compliance
name: Planned Maintenance Window Compliance
type: Metric
description: A Telecom Network Operations (Deep Dive) indicator, Planned Maintenance Window Compliance
  (PMWC) quantifies conformance to standards, plans, or obligations. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. It is computed as Maintenance Completed
  in Window / Scheduled, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Telecommunications.
