id: dea:metric-loan-origination-cycle-time
name: Loan Origination Cycle Time
type: Metric
description: Within Retail Banking & Lending, Loan Origination Cycle Time (LOCT) is used to gauge how
  efficiently resources are converted into outputs. It is defined as Days from Complete Application to
  Disbursement; the result is stated in days. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Lower values are better; each reduction is an improvement. In Banking,
  it is a recognized element of the standard performance toolkit.
