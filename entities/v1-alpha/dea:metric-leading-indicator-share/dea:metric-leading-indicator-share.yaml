id: dea:metric-leading-indicator-share
name: Leading Indicator Share
type: Metric
description: Leading Indicator Share (LIS-BSC) addresses capability maturity or development and is a fixture
  of balanced scorecard implementation & review reporting. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Leading Measures / Total BSC Measures;
  the result is stated in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: LIS-BSC
unit: percent
