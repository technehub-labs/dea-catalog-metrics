id: dea:metric-milestone-adherence
name: Milestone Adherence
type: Metric
description: Milestone Adherence (MA) measures conformance to standards, plans, or obligations in the
  Project Management domain. Its calculation is Milestones Met on Time / Milestones Planned, measured
  in percent (%). It is applied across virtually every sector. Its value drives prioritization and resource
  reallocation among competing initiatives. It should be maximized within the limits of cost and quality
  trade-offs.
