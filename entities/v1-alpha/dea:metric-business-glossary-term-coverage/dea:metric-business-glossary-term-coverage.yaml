id: dea:metric-business-glossary-term-coverage
name: Business Glossary Term Coverage
type: Metric
description: Business Glossary Term Coverage (BGTC) measures the quality of outputs and outcomes in the
  Data Governance & Stewardship domain. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Terms Defined and Approved / Terms in Use, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
