id: dea:metric-administrative-cost-ratio-deep-dive
name: Administrative Cost Ratio (Deep Dive)
type: Metric
description: A Nonprofit & Donor Operations (Deep Dive) indicator, Administrative Cost Ratio (Deep Dive)
  (ACR-D) quantifies how efficiently resources are converted into outputs. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Administrative
  Expenses / Total Expenses - reported in percent (%). It should be driven down, since lower readings
  signal healthier performance. It is a standard measure in the Nonprofit sector.
abbreviation: ACR-D
unit: percent
