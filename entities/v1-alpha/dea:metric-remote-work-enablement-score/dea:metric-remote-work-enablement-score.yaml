id: dea:metric-remote-work-enablement-score
name: Remote Work Enablement Score
type: Metric
description: Within Digital Workplace & Collaboration, Remote Work Enablement Score (RWES) is used to
  gauge capability maturity or development. It is defined as Weighted Index of Access, Tooling, Experience
  Items; the result is stated in index (0-100 or normalized). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
