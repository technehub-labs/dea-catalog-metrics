id: dea:metric-retention-schedule-compliance-rate
name: Retention Schedule Compliance Rate
type: Metric
description: A Records & Information Management indicator, Retention Schedule Compliance Rate (RSCR) quantifies
  conformance to standards, plans, or obligations. It is computed as Records Disposed or Held per Schedule
  / Records Sampled, expressed in percent (%). It is applied across virtually every sector. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It should
  be maximized within the limits of cost and quality trade-offs.
