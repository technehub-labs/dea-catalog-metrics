id: dea:metric-vendor-risk-assessment-currency
name: Vendor Risk Assessment Currency
type: Metric
description: 'Vendor Risk Assessment Currency (VRAC) captures conformance to standards, plans, or obligations
  for organizations tracking outsourcing & vendor management. It is computed as Vendors with Assessment
  within Review Cycle / Critical Vendors, expressed in percent (%). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: VRAC
unit: percent
