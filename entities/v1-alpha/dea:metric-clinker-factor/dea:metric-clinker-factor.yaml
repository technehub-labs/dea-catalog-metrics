id: dea:metric-clinker-factor
name: Clinker Factor
type: Metric
description: A Cement & Building Materials indicator, Clinker Factor (CF-C) quantifies environmental and
  social sustainability performance. Its calculation is Clinker Mass / Cement Mass, measured in ratio
  (x:1 or x). It originates from and is most used in Manufacturing practice. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and
  sustained decreases indicate successful intervention.
