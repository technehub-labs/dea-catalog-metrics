id: dea:metric-asynchronous-work-ratio
name: Asynchronous Work Ratio
type: Metric
description: Asynchronous Work Ratio (ASWR) addresses how efficiently resources are converted into outputs
  and is a fixture of digital workplace & collaboration reporting. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It is defined as Async Communications /
  Total Team Communications; the result is stated in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: ASWR
unit: percent
