id: dea:metric-trial-to-paid-conversion-deep-dive
name: Trial-to-Paid Conversion (Deep Dive)
type: Metric
description: Trial-to-Paid Conversion (Deep Dive) (TTPC-D) addresses growth over time and is a fixture
  of software product operations (deep dive) reporting. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Paid Conversions / Trials; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. In Technology,
  it is a recognized element of the standard performance toolkit.
abbreviation: TTPC-D
unit: percent
