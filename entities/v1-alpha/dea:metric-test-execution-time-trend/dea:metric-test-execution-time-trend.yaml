id: dea:metric-test-execution-time-trend
name: Test Execution Time Trend
type: Metric
description: Test Execution Time Trend (TETT-CI) measures how efficiently resources are converted into
  outputs in the Continuous Integration domain. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. It is defined as Change in Median Test Suite Duration per
  Quarter; the result is stated in percent (%). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: TETT-CI
