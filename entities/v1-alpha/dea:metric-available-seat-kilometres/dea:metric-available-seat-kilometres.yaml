id: dea:metric-available-seat-kilometres
name: Available Seat Kilometres
type: Metric
description: Available Seat Kilometres (ASK) addresses the utilization or availability of capacity and
  is a fixture of airlines & aviation reporting. Its calculation is Seats Flown x Distance Flown, measured
  in count (items per period). It originates from and is most used in Airlines & aviation practice. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: ASK
unit: count
