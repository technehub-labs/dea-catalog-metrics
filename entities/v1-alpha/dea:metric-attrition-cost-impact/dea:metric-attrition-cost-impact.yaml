id: dea:metric-attrition-cost-impact
name: Attrition Cost Impact
type: Metric
description: Within Workforce Planning & Productivity, Attrition Cost Impact (ACI-WF) is used to gauge
  the economic value created or preserved. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Replacement and Productivity Cost
  per Regretted Leaver, measured in currency per unit. It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
