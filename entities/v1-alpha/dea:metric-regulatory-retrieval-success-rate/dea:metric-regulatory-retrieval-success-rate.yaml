id: dea:metric-regulatory-retrieval-success-rate
name: Regulatory Retrieval Success Rate
type: Metric
description: Regulatory Retrieval Success Rate (RRSR) measures conformance to standards, plans, or obligations
  in the Records & Information Management domain. Its calculation is Records Retrieved within Regulatory
  Deadline / Requests, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: RRSR
unit: percent
