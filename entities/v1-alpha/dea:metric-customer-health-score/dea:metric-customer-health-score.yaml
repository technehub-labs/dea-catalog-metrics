id: dea:metric-customer-health-score
name: Customer Health Score
type: Metric
description: A Customer indicator, Customer Health Score (CHS) quantifies exposure to adverse outcomes.
  It is defined as Weighted Index of Usage, Satisfaction, and Support Signals; the result is stated in
  index (0-100 or normalized). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: CHS
