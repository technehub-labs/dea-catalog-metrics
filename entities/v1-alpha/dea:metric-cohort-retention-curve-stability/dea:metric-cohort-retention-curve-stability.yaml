id: dea:metric-cohort-retention-curve-stability
name: Cohort Retention Curve Stability
type: Metric
description: A Unit Economics & Growth (Deep Dive) indicator, Cohort Retention Curve Stability (CRCS)
  quantifies the quality of outputs and outcomes. The formula is Variance of Retention Curves across Cohorts
  - reported in index (0-100 or normalized). It is a standard measure in the Software sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction
  is the goal, and sustained decreases indicate successful intervention.
