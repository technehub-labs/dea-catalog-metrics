id: dea:metric-seafarer-retention-rate
name: Seafarer Retention Rate
type: Metric
description: Seafarer Retention Rate (SFR-M) measures the retention of customers, users, or assets over
  time in the Maritime & Shipping domain. Its calculation is Seafarers Completing Contracts and Returning
  / Seafarers Eligible, measured in percent (%). Its value drives prioritization and resource reallocation
  among competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Maritime & shipping practice.
abbreviation: SFR-M
