id: dea:metric-security-screening-wait-time
name: Security Screening Wait Time
type: Metric
description: 'A Airport Operations indicator, Security Screening Wait Time (SSWT) quantifies the quality
  of outputs and outcomes. It is computed as Median Passenger Wait at Checkpoint, expressed in minutes.
  Its use is concentrated in Airports. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Reduction is the goal, and sustained decreases indicate successful intervention.'
