id: dea:metric-straight-through-processing-rate-automation
name: Straight-Through Processing Rate (Automation)
type: Metric
description: Straight-Through Processing Rate (Automation) (STPA) addresses how efficiently resources
  are converted into outputs and is a fixture of automation & robotic process automation reporting. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. The
  formula is Transactions Processed End-to-End without Manual Touch / Transactions - reported in percent
  (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
abbreviation: STPA
unit: percent
version: 1.1.0
lifecycle_status: candidate
