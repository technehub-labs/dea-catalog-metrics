id: dea:metric-return-on-marketing-investment
name: Return on Marketing Investment
type: Metric
description: 'Return on Marketing Investment (ROMI) measures the economic value created or preserved in
  the Marketing domain. It is computed as (Attributable Revenue - Marketing Spend) / Marketing Spend,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: ROMI
unit: percent
version: 1.0.0
