source_credit: Public domain - no attribution required
calculation_definition: (Attributable Revenue - Marketing Spend) / Marketing Spend
formula_definition:
  formula_id: dea:formula-return-on-marketing-investment
  expression: ROMI = (Attributable Revenue - Marketing Spend) / Marketing Spend
  inputs:
