id: dea:metric-multi-region-release-consistency-rate
name: Multi-Region Release Consistency Rate
type: Metric
description: Multi-Region Release Consistency Rate (MRRCR) addresses the quality of outputs and outcomes
  and is a fixture of release management & environments reporting. Its calculation is Regions Deployed
  within Alignment Window / Regions, measured in percent (%). Its value drives prioritization and resource
  reallocation among competing initiatives. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: MRRCR
unit: percent
version: 1.1.0
