id: dea:metric-expertise-location-coverage
name: Expertise Location Coverage
type: Metric
description: Within Knowledge Management, Expertise Location Coverage (ELC) is used to gauge capability
  maturity or development. It is defined as Critical Topics with Identified Experts / Critical Topics;
  the result is stated in percent (%). It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: ELC
unit: percent
