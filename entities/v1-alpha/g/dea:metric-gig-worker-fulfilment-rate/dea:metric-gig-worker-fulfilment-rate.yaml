id: dea:metric-gig-worker-fulfilment-rate
name: Gig Worker Fulfilment Rate
type: Metric
description: 'Gig Worker Fulfilment Rate (GWFR) addresses the utilization or availability of capacity
  and is a fixture of gig & contingent workforce reporting. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. The formula is Tasks Accepted within SLA / Tasks Posted
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: GWFR
unit: percent
version: 1.1.0
lifecycle_status: candidate
