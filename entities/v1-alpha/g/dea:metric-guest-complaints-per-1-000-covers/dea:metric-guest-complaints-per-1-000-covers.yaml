id: dea:metric-guest-complaints-per-1-000-covers
name: Guest Complaints per 1,000 Covers
type: Metric
description: Within Restaurants, Guest Complaints per 1,000 Covers (GCPC) is used to gauge the quality
  of outputs and outcomes. It is computed as Complaints / Covers Served x 1,000, expressed in events per
  thousand or million (scaled). Its use is concentrated in Restaurants. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: GCPC
