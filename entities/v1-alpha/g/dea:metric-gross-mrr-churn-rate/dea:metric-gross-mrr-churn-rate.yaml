source_credit: Public domain - no attribution required
calculation_definition: Churned MRR / MRR at Start of Period
formula_definition:
  formula_id: dea:formula-gross-mrr-churn-rate
  expression: GMChurn = Churned MRR / MRR at Start of Period
  inputs:
