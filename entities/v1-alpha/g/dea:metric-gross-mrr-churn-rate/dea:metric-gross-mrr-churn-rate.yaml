id: dea:metric-gross-mrr-churn-rate
name: Gross MRR Churn Rate
type: Metric
description: Gross MRR Churn Rate (GMChurn) addresses the retention of customers, users, or assets over
  time and is a fixture of customer success (b2b saas) reporting. The formula is Churned MRR / MRR at
  Start of Period - reported in percent (%). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Software & SaaS sector.
abbreviation: GMChurn
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- retention
scope_classification:
- capability
directionality: lower_is_better
management_significance:
