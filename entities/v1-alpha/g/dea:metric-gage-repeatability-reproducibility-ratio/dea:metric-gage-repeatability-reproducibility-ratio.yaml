id: dea:metric-gage-repeatability-reproducibility-ratio
name: Gage Repeatability & Reproducibility Ratio
type: Metric
description: Gage Repeatability & Reproducibility Ratio (GRNR) captures the quality of outputs and outcomes
  for organizations tracking process capability & six sigma (deep dive). It is computed as Measurement
  System Variation / Total Variation, expressed in percent (%). Its use is concentrated in Manufacturing.
  Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: GRNR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- capability
purpose_classification:
- quality
scope_classification:
- organizational_unit
directionality: lower_is_better
