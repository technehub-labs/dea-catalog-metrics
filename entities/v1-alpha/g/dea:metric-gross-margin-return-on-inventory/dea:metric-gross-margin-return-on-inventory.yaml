id: dea:metric-gross-margin-return-on-inventory
name: Gross Margin Return on Inventory
type: Metric
description: Within Retail & E-commerce, Gross Margin Return on Inventory (GMROI) is used to gauge the
  economic value created or preserved. Its calculation is Gross Margin / Average Inventory Cost, measured
  in ratio (x:1 or x). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Retail practice.
abbreviation: GMROI
unit: ratio
