id: dea:metric-gross-revenue-retention
name: Gross Revenue Retention
type: Metric
description: 'Within Sales, Gross Revenue Retention (GRR) is used to gauge the retention of customers,
  users, or assets over time. It is computed as (MRR_start - Churned MRR) / MRR_start, expressed in percent
  (%). It is applied across virtually every sector. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It should be maximized within the limits of cost
  and quality trade-offs.'
abbreviation: GRR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- retention
scope_classification:
- capability
directionality: higher_is_better
management_significance:
- strategic
measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: (MRR_start - Churned MRR) / MRR_start
formula_definition:
  formula_id: dea:formula-gross-revenue-retention
  expression: GRR = (MRR_start - Churned MRR) / MRR_start
  inputs:
  - name: MRR_start
  - name: Churned MRR
