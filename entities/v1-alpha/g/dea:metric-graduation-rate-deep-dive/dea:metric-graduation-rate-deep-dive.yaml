id: dea:metric-graduation-rate-deep-dive
name: Graduation Rate (Deep Dive)
type: Metric
description: Graduation Rate (Deep Dive) (GRDD) captures the quality of outputs and outcomes for organizations
  tracking education & training outcome standard measures. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Cohort Completing within 150%
  of Program Time / Cohort - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Education sector.
abbreviation: GRDD
unit: percent
