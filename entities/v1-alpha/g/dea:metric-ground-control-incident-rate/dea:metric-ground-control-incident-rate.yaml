id: dea:metric-ground-control-incident-rate
name: Ground Control Incident Rate
type: Metric
description: 'Within Metals & Mining Operations (Deep Dive), Ground Control Incident Rate (GCIR) is used
  to gauge exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Ground Failure Incidents / 200,000 Hours,
  expressed in events per thousand or million (scaled). It should be driven down, since lower readings
  signal healthier performance. Its use is concentrated in Metals & Mining.'
abbreviation: GCIR
