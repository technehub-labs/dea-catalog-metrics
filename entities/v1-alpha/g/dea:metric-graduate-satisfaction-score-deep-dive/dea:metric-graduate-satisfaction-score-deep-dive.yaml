id: dea:metric-graduate-satisfaction-score-deep-dive
name: Graduate Satisfaction Score (Deep Dive)
type: Metric
description: Graduate Satisfaction Score (Deep Dive) (GSSDD) captures the engagement or satisfaction of
  the people involved for organizations tracking education & training outcome standard measures. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. It is defined as
  Exit Survey Composite of Graduates; the result is stated in score (points). Improvement means raising
  this figure toward best-in-class levels. In Education, it is a recognized element of the standard performance
  toolkit.
abbreviation: GSSDD
unit: score
