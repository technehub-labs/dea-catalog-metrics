id: dea:metric-gross-margin-per-product-line
name: Gross Margin per Product Line
type: Metric
description: 'Gross Margin per Product Line (GMPL) addresses the economic value created or preserved and
  is a fixture of product costing & margin management reporting. It is computed as (Product Revenue -
  Cost of Sales) / Product Revenue, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: GMPL
unit: percent
version: 1.1.0
lifecycle_status: candidate
