id: dea:metric-gig-worker-satisfaction
name: Gig Worker Satisfaction
type: Metric
description: 'Gig Worker Satisfaction (GWS) measures the engagement or satisfaction of the people involved
  in the Gig & Contingent Workforce domain. The formula is Satisfied Gig Worker Survey Responses / Responses
  - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: GWS
unit: percent
