id: dea:metric-green-building-certification-share
name: Green Building Certification Share
type: Metric
description: 'Within Real Estate Portfolio & Property Management, Green Building Certification Share (GBCS)
  is used to gauge environmental and social sustainability performance. It is computed as Certified Floor
  Area / Total Floor Area, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is concentrated in Real Estate.'
abbreviation: GBCS
unit: percent
version: 1.1.0
