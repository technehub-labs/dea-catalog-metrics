id: dea:metric-guard-tour-completion
name: Guard Tour Completion
type: Metric
description: Guard Tour Completion (GTC) addresses conformance to standards, plans, or obligations and
  is a fixture of physical security operations reporting. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Patrol Tours Completed / Tours Scheduled, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
abbreviation: GTC
unit: percent
