id: dea:metric-greenhouse-gas-scope-2-emissions
name: Greenhouse Gas Scope 2 Emissions
type: Metric
description: A Sustainability & ESG indicator, Greenhouse Gas Scope 2 Emissions (GHG2) quantifies environmental
  and social sustainability performance. It is defined as Indirect Emissions from Purchased Energy; the
  result is stated in tonnes CO2 equivalent (tCO2e). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
