id: dea:metric-risk-appetite-threshold-utilization
name: Risk Appetite Threshold Utilization
type: Metric
description: Risk Appetite Threshold Utilization (RATU-GOV) captures exposure to adverse outcomes for
  organizations tracking enterprise decision effectiveness & governance monitoring. It is defined as Current
  Risk Position / Approved Appetite; the result is stated in percent (%). It is applied across virtually
  every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Values outside the intended band, on either side, warrant investigation.
abbreviation: RATU-GOV
unit: percent
