id: dea:metric-field-force-first-time-fix-rate
name: Field Force First-Time Fix Rate
type: Metric
description: Field Force First-Time Fix Rate (FTFR) addresses how efficiently resources are converted
  into outputs and is a fixture of telecom network operations reporting. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It is computed as Faults Resolved
  on First Visit / Faults Dispatched, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Its use is concentrated in Telecommunications.
abbreviation: FTFR
unit: percent
version: 1.1.0
