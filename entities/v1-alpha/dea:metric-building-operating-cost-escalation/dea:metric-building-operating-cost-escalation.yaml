id: dea:metric-building-operating-cost-escalation
name: Building Operating Cost Escalation
type: Metric
description: Within Facilities & Real Estate, Building Operating Cost Escalation (BOCE) is used to gauge
  how efficiently resources are converted into outputs. Its calculation is (Cost_current - Cost_prior)
  / Cost_prior, measured in percent (%). Its value drives prioritization and resource reallocation among
  competing initiatives. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: BOCE
unit: percent
