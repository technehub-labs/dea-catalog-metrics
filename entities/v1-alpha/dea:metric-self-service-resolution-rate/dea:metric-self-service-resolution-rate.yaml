id: dea:metric-self-service-resolution-rate
name: Self-Service Resolution Rate
type: Metric
description: A IT Service Management indicator, Self-Service Resolution Rate (SSRR) quantifies how efficiently
  resources are converted into outputs. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Self-Service Resolutions / Total Service Requests;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: SSRR
unit: percent
