id: dea:metric-threat-intel-analyst-utilization
name: Threat Intel Analyst Utilization
type: Metric
description: Threat Intel Analyst Utilization (TIAU) captures the utilization or availability of capacity
  for organizations tracking threat intelligence & red team. It is defined as Analyst Hours on Strategic
  Intel / Total Analyst Hours; the result is stated in percent (%). It is applied across virtually every
  sector. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. Values outside the intended band, on either side, warrant investigation.
abbreviation: TIAU
unit: percent
