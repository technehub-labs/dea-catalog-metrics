id: dea:metric-privacy-by-design-review-coverage
name: Privacy-by-Design Review Coverage
type: Metric
description: 'Within Data Privacy & Protection, Privacy-by-Design Review Coverage (PBDRC) is used to gauge
  exposure to adverse outcomes. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. The formula is Features Passing Privacy Design Review / In-Scope Features
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: PBDRC
unit: percent
