id: dea:metric-population-stability-index-model
name: Population Stability Index (Model)
type: Metric
description: 'Population Stability Index (Model) (PSIM) captures exposure to adverse outcomes for organizations
  tracking statistical model performance diagnostics. It is defined as Divergence of Score Distribution
  vs Development Sample; the result is stated in index (0-100 or normalized). It is a working-level control:
  thresholds trigger immediate operational response. Lower values are better; each reduction is an improvement.
  In Software, it is a recognized element of the standard performance toolkit.'
