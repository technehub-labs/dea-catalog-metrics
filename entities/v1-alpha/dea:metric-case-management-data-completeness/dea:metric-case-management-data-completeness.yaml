id: dea:metric-case-management-data-completeness
name: Case Management Data Completeness
type: Metric
description: Case Management Data Completeness (CMDC-SOC) captures the quality of outputs and outcomes
  for organizations tracking secops & security operations center. Its calculation is Incident Records
  with Required Fields / Records, measured in percent (%). It provides the day-to-day signal that a process
  is running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
