id: dea:metric-journey-completion-rate
name: Journey Completion Rate
type: Metric
description: Journey Completion Rate (JCR) captures how effectively a process or entity achieves its intended
  outcome for organizations tracking customer journey & experience. It is defined as Customers Completing
  Journey / Customers Starting Journey; the result is stated in percent (%). It is applied across virtually
  every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: JCR
unit: percent
