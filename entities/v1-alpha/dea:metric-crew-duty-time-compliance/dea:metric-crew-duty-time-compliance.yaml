description: 'Crew Duty Time Compliance (CDTC) addresses conformance to standards, plans, or obligations
  and is a fixture of airlines & aviation reporting. It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. The formula is Crew Rosters within Duty Limits / Rosters Checked
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. It is
  a standard measure in the Airlines & aviation sector.'
