id: dea:metric-requirement-ambiguity-review-pass-rate
name: Requirement Ambiguity Review Pass Rate
type: Metric
description: 'Requirement Ambiguity Review Pass Rate (RARPR) addresses the quality of outputs and outcomes
  and is a fixture of requirements engineering & product discovery reporting. The formula is Requirements
  Passing Ambiguity Review / Reviewed - reported in percent (%). It is applied across virtually every
  sector. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  It should be maximized within the limits of cost and quality trade-offs.'
