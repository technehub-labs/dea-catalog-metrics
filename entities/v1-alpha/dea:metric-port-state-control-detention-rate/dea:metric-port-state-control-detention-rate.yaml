id: dea:metric-port-state-control-detention-rate
name: Port State Control Detention Rate
type: Metric
description: Port State Control Detention Rate (PSCD) addresses conformance to standards, plans, or obligations
  and is a fixture of maritime & shipping reporting. Its calculation is Inspections Ending in Detention
  / Inspections, measured in percent (%). It originates from and is most used in Maritime & shipping practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Reduction is the goal, and sustained decreases indicate successful intervention.
