id: dea:metric-innovation-and-slack-time-ratio
name: Innovation and Slack Time Ratio
type: Metric
description: Innovation and Slack Time Ratio (ISTR-AG) measures capability maturity or development in
  the Agile Delivery & Team Effectiveness domain. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Slack or Exploration Time / Total Time; the
  result is stated in percent (%). The objective is neither maximization nor minimization but staying
  within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: ISTR-AG
