id: dea:metric-pseudonymization-coverage-analytics
name: Pseudonymization Coverage (Analytics)
type: Metric
description: 'A Data Privacy & Protection indicator, Pseudonymization Coverage (Analytics) (PPC) quantifies
  exposure to adverse outcomes. The formula is Analytical Datasets Pseudonymized / Datasets with Personal
  Data - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: PPC
unit: percent
