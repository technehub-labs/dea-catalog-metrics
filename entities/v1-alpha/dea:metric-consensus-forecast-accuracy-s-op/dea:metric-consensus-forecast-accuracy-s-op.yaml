id: dea:metric-consensus-forecast-accuracy-s-op
name: Consensus Forecast Accuracy (S&OP)
type: Metric
description: Within Sales & Operations Planning, Consensus Forecast Accuracy (S&OP) (CFA-S) is used to
  gauge the quality of outputs and outcomes. It is defined as 1 - ABS(Consensus Forecast - Actual) / Actual;
  the result is stated in percent (%). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: CFA-S
unit: percent
