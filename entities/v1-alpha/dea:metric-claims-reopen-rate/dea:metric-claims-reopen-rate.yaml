id: dea:metric-claims-reopen-rate
name: Claims Reopen Rate
type: Metric
description: Claims Reopen Rate (CRR-C) captures the quality of outputs and outcomes for organizations
  tracking claims operations (insurance). It is computed as Reopened Claims / Claims Closed, expressed
  in percent (%). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Lower values are better; each reduction is an improvement. Its use is concentrated in Insurance.
