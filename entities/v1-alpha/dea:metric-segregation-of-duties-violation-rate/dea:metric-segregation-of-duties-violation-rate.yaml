id: dea:metric-segregation-of-duties-violation-rate
name: Segregation of Duties Violation Rate
type: Metric
description: Within Identity & Access Management Operations, Segregation of Duties Violation Rate (SODVR)
  is used to gauge exposure to adverse outcomes. It is defined as SoD Conflicts Detected per Period; the
  result is stated in count (items per period). It is applied across virtually every sector. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Reduction is the
  goal, and sustained decreases indicate successful intervention.
