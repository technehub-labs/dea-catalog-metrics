id: dea:metric-line-changeover-time-food
name: Line Changeover Time (Food)
type: Metric
description: Within Food & Beverage Manufacturing, Line Changeover Time (Food) (LCT-F) is used to gauge
  how efficiently resources are converted into outputs. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Minutes from Last Good Product
  to Next Good Product, expressed in minutes. It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Food & Beverage.
