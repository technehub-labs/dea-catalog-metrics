id: dea:metric-cash-ratio
name: Cash Ratio
type: Metric
description: Cash Ratio (CR) captures exposure to adverse outcomes for organizations tracking finance
  & accounting. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It is computed as (Cash + Cash Equivalents) / Current Liabilities, expressed in ratio (x:1 or x). The
  objective is neither maximization nor minimization but staying within an agreed operating band. Practitioners
  in nearly any industry can adopt it directly.
