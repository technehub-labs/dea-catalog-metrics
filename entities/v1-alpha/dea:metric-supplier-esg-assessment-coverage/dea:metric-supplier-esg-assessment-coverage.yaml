id: dea:metric-supplier-esg-assessment-coverage
name: Supplier ESG Assessment Coverage
type: Metric
description: Within Sustainability & ESG, Supplier ESG Assessment Coverage (SESG) is used to gauge conformance
  to standards, plans, or obligations. The formula is Key Suppliers ESG-Assessed / Key Suppliers - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SESG
unit: percent
