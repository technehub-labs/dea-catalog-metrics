id: dea:metric-observability-cost-per-service
name: Observability Cost per Service
type: Metric
description: Observability Cost per Service (OCS-SRE) addresses how efficiently resources are converted
  into outputs and is a fixture of observability & site reliability engineering reporting. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. It is computed as Telemetry
  Spend per Service per Month, expressed in currency value. It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
