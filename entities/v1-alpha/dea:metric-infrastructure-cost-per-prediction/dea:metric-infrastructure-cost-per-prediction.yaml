id: dea:metric-infrastructure-cost-per-prediction
name: Infrastructure Cost per Prediction
type: Metric
description: Within MLOps & Model Lifecycle Operations, Infrastructure Cost per Prediction (ICPP-M) is
  used to gauge how efficiently resources are converted into outputs. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Serving Infrastructure Cost /
  Predictions; the result is stated in currency per unit. It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
