id: dea:metric-client-reporting-accuracy-rate
name: Client Reporting Accuracy Rate
type: Metric
description: Client Reporting Accuracy Rate (CRAR-IM) captures the quality of outputs and outcomes for
  organizations tracking investment management - portfolio operations. It is defined as Reports without
  Restatement / Reports; the result is stated in percent (%). In Financial Services, it is a recognized
  element of the standard performance toolkit. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CRAR-IM
