id: dea:metric-hazardous-release-compliance-rate
name: Hazardous Release Compliance Rate
type: Metric
description: Within Chemicals, Hazardous Release Compliance Rate (HRCR) is used to gauge conformance to
  standards, plans, or obligations. The formula is Releases within Permitted Limits / Release Events -
  reported in percent (%). It is a standard measure in the Chemicals sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: HRCR
unit: percent
