id: dea:metric-shadow-vendor-count
name: Shadow Vendor Count
type: Metric
description: 'A Outsourcing & Vendor Management indicator, Shadow Vendor Count (SVC) quantifies conformance
  to standards, plans, or obligations. The formula is Unapproved Vendors with Spend in Period - reported
  in count (items per period). It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. Lower values are better; each reduction is an improvement. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.'
