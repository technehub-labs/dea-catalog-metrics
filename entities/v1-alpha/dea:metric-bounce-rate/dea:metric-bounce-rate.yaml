id: dea:metric-bounce-rate
name: Bounce Rate
type: Metric
description: 'Bounce Rate (BounceR) measures the engagement or satisfaction of the people involved in
  the Marketing domain. It is defined as Single-Page Sessions / Total Sessions; the result is stated in
  percent (%). It is a working-level control: thresholds trigger immediate operational response. Lower
  values are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: BounceR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- engagement
scope_classification:
- capability
directionality: lower_is_better
management_significance:
