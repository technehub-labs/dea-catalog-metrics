id: dea:metric-broken-build-recovery-time
name: Broken Build Recovery Time
type: Metric
description: 'Within Continuous Integration, Broken Build Recovery Time (BBRT) is used to gauge how efficiently
  resources are converted into outputs. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Minutes to Restore Green Build after Failure - reported in minutes.
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
