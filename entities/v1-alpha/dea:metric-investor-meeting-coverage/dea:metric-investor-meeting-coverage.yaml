id: dea:metric-investor-meeting-coverage
name: Investor Meeting Coverage
type: Metric
description: Within Investor Relations & Capital Markets, Investor Meeting Coverage (IMC) is used to gauge
  the engagement or satisfaction of the people involved. Its calculation is Top Shareholders Engaged in
  Period / Top Shareholders, measured in percent (%). It originates from and is most used in Listed companies
  practice. Its value drives prioritization and resource reallocation among competing initiatives. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: IMC
unit: percent
