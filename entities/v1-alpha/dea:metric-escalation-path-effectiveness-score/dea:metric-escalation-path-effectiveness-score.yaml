id: dea:metric-escalation-path-effectiveness-score
name: Escalation Path Effectiveness Score
type: Metric
description: A Enterprise Decision Effectiveness & Governance Monitoring indicator, Escalation Path Effectiveness
  Score (EPES) quantifies the quality of outputs and outcomes. It is defined as Survey and Case-Based
  Escalation Effectiveness; the result is stated in score (points). It is applied across virtually every
  sector. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: EPES
