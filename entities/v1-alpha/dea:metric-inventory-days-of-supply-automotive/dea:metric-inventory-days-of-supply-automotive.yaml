id: dea:metric-inventory-days-of-supply-automotive
name: Inventory Days of Supply (Automotive)
type: Metric
description: Within Automotive, Inventory Days of Supply (Automotive) (IDS-A) is used to gauge the utilization
  or availability of capacity. Its calculation is Vehicle and Parts Inventory / Average Daily Usage, measured
  in days. It originates from and is most used in Automotive practice. Its value drives prioritization
  and resource reallocation among competing initiatives. Values outside the intended band, on either side,
  warrant investigation.
