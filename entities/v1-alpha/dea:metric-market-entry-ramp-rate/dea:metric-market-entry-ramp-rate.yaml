id: dea:metric-market-entry-ramp-rate
name: Market Entry Ramp Rate
type: Metric
description: Market Entry Ramp Rate (MERR) captures growth over time for organizations tracking market
  structure & economics standard measures. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Share Achieved within Plan Period after Entry / Plan;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
