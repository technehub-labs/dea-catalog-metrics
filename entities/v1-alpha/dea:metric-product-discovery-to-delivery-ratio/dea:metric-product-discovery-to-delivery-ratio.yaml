id: dea:metric-product-discovery-to-delivery-ratio
name: Product Discovery-to-Delivery Ratio
type: Metric
description: Product Discovery-to-Delivery Ratio (PDDR) measures capability maturity or development in
  the Requirements Engineering & Product Discovery domain. The formula is Discovery Time / Delivery Time
  - reported in ratio (x:1 or x). It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Values outside the intended band,
  on either side, warrant investigation.
