id: dea:metric-runway-remaining
name: Runway Remaining
type: Metric
description: 'A Startup & Venture-Backed Business indicator, Runway Remaining (RWR-S) quantifies exposure
  to adverse outcomes. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It is computed as Cash Available / Net Monthly Burn, expressed in months. Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.'
