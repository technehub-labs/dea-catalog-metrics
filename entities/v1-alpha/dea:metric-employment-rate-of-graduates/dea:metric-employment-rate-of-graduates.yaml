id: dea:metric-employment-rate-of-graduates
name: Employment Rate of Graduates
type: Metric
description: Employment Rate of Graduates (ERG) measures the economic value created or preserved in the
  Education domain. The formula is Graduates Employed within Period / Graduates - reported in percent
  (%). It is a standard measure in the Education sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It should be maximized within the limits of
  cost and quality trade-offs.
abbreviation: ERG
unit: percent
