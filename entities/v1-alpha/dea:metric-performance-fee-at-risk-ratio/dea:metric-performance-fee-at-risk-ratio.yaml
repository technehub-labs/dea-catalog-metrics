id: dea:metric-performance-fee-at-risk-ratio
name: Performance Fee at Risk Ratio
type: Metric
description: Performance Fee at Risk Ratio (PFARR) captures the economic value created or preserved for
  organizations tracking investment performance measurement. Its calculation is Performance Fee at Target
  / Fees at Prior Period, measured in ratio (x:1 or x). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. It is managed toward a defined target band
  rather than an extreme - both overshoot and undershoot can signal problems. It originates from and is
  most used in Investment management practice.
