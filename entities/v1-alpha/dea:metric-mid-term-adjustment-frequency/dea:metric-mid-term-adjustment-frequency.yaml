id: dea:metric-mid-term-adjustment-frequency
name: Mid-Term Adjustment Frequency
type: Metric
description: 'Mid-Term Adjustment Frequency (MTAF) addresses exposure to adverse outcomes and is a fixture
  of insurance underwriting reporting. It is defined as Mid-Term Adjustments / Active Policies; the result
  is stated in times per period. In Insurance, it is a recognized element of the standard performance
  toolkit. It is a working-level control: thresholds trigger immediate operational response. Values outside
  the intended band, on either side, warrant investigation.'
