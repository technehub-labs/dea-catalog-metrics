id: dea:metric-insight-latency
name: Insight Latency
type: Metric
description: Insight Latency (INS-L) captures how efficiently resources are converted into outputs for
  organizations tracking customer analytics & insights. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Days from Data Availability
  to Insight Publication, expressed in days. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
