id: dea:metric-interface-error-rate-deep-dive
name: Interface Error Rate (Deep Dive)
type: Metric
description: 'Interface Error Rate (Deep Dive) (IER-D) addresses the quality of outputs and outcomes and
  is a fixture of erp & enterprise application operations reporting. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Failed Interface Messages / Messages; the result
  is stated in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
