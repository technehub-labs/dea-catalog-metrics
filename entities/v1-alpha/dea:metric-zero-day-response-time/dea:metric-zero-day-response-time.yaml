id: dea:metric-zero-day-response-time
name: Zero-Day Response Time
type: Metric
description: A Vulnerability & Exposure Management indicator, Zero-Day Response Time (ZDRT) quantifies
  how efficiently resources are converted into outputs. The formula is Hours from Zero-Day Advisory to
  Mitigation - reported in hours. It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
