id: dea:metric-fuel-per-1-000-gross-tonne-kilometres
name: Fuel per 1,000 Gross Tonne Kilometres
type: Metric
description: 'Fuel per 1,000 Gross Tonne Kilometres (FGTK) addresses how efficiently resources are converted
  into outputs and is a fixture of rail freight (deep dive) reporting. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. The formula is Fuel / 1,000
  GTK - reported in ratio (x:1 or x). It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Rail sector.'
