id: dea:metric-digital-claims-fnol-adoption
name: Digital Claims FNOL Adoption
type: Metric
description: 'Digital Claims FNOL Adoption (DCFA-I) addresses how efficiently resources are converted
  into outputs and is a fixture of insurance distribution - direct & digital reporting. It is computed
  as Digital First Notifications / Total FNOLs, expressed in percent (%). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is concentrated in Insurance.'
