id: dea:metric-provision-coverage-ratio
name: Provision Coverage Ratio
type: Metric
description: 'Provision Coverage Ratio (PCR-CC) measures exposure to adverse outcomes in the Credit &
  Collections Risk (Enterprise) domain. It is computed as Loan Loss Provision / Non-Performing Exposure,
  expressed in ratio (x:1 or x). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is managed toward a defined target band rather than an extreme - both
  overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: PCR-CC
unit: ratio
