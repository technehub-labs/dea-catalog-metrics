id: dea:metric-mean-time-to-remediate-critical-vulnerabilities
name: Mean Time to Remediate - Critical Vulnerabilities
type: Metric
description: Mean Time to Remediate - Critical Vulnerabilities (MTTRCV2) captures how efficiently resources
  are converted into outputs for organizations tracking vulnerability & exposure management. The formula
  is Days to Patch Critical Vulnerabilities - reported in days. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Lower values are better; each reduction is
  an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
