id: dea:metric-defects-per-million-opportunities
name: Defects per Million Opportunities
type: Metric
description: A Quality Management indicator, Defects per Million Opportunities (DPMO) quantifies the quality
  of outputs and outcomes. It is defined as Defects / (Units x Opportunities) x 1,000,000; the result
  is stated in events per thousand or million (scaled). Its trend is watched by senior leadership as an
  early signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DPMO
