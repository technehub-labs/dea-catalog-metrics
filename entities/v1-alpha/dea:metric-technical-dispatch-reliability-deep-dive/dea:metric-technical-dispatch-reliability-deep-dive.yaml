id: dea:metric-technical-dispatch-reliability-deep-dive
name: Technical Dispatch Reliability (Deep Dive)
type: Metric
description: Within Airline Operations (Deep Dive), Technical Dispatch Reliability (Deep Dive) (TDR-A)
  is used to gauge the quality of outputs and outcomes. It is defined as Departures without Technical
  Delay or Cancel / Departures; the result is stated in percent (%). In Airlines, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
