id: dea:metric-partner-onboarding-self-service-rate
name: Partner Onboarding Self-Service Rate
type: Metric
description: 'A Channel & Distribution Management indicator, Partner Onboarding Self-Service Rate (POSSR)
  quantifies how efficiently resources are converted into outputs. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Onboarding Steps Completed without
  Human Touch / Steps - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
