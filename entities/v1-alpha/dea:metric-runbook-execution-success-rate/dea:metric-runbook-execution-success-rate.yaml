id: dea:metric-runbook-execution-success-rate
name: Runbook Execution Success Rate
type: Metric
description: Runbook Execution Success Rate (RESR-NOC) addresses the quality of outputs and outcomes and
  is a fixture of network operations center (deep dive) reporting. Its calculation is Runbook-Guided Resolutions
  Successful / Executed, measured in percent (%). It is applied across virtually every sector. It provides
  the day-to-day signal that a process is running as designed. It should be maximized within the limits
  of cost and quality trade-offs.
abbreviation: RESR-NOC
unit: percent
