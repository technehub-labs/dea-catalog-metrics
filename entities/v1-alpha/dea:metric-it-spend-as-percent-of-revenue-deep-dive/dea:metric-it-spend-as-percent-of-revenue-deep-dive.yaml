id: dea:metric-it-spend-as-percent-of-revenue-deep-dive
name: IT Spend as Percent of Revenue (Deep Dive)
type: Metric
description: 'IT Spend as Percent of Revenue (Deep Dive) (ITSPR-D) addresses how efficiently resources
  are converted into outputs and is a fixture of it financial management & technology budgeting reporting.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is computed as Total IT Spend / Revenue, expressed in percent (%). The objective is neither maximization
  nor minimization but staying within an agreed operating band. Practitioners in nearly any industry can
  adopt it directly.'
