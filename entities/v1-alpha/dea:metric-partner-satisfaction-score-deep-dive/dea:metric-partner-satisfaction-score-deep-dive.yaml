id: dea:metric-partner-satisfaction-score-deep-dive
name: Partner Satisfaction Score (Deep Dive)
type: Metric
description: A Channel & Distribution Management indicator, Partner Satisfaction Score (Deep Dive) (PSSDD)
  quantifies the engagement or satisfaction of the people involved. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Annual Partner Survey
  Composite - reported in score (points). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
