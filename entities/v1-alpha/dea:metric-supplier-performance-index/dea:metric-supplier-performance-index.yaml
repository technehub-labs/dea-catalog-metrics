id: dea:metric-supplier-performance-index
name: Supplier Performance Index
type: Metric
description: Supplier Performance Index (SPI) captures the quality of outputs and outcomes for organizations
  tracking procurement. It is computed as Weighted Index of Quality, Delivery, Cost, Service, expressed
  in index (0-100 or normalized). It is reviewed at cadence by planning owners to correct course before
  issues become strategic. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
