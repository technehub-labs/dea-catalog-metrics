id: dea:metric-quality-monitoring-score
name: Quality Monitoring Score
type: Metric
description: 'Quality Monitoring Score (QMS) addresses the quality of outputs and outcomes and is a fixture
  of contact center reporting. The formula is Average QA Evaluation Score of Recorded Interactions - reported
  in score (points). It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Higher values are better; gains are read as improvement and losses as deterioration. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.'
