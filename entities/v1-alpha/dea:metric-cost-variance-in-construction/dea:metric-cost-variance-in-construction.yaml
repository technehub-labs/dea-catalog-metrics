id: dea:metric-cost-variance-in-construction
name: Cost Variance in Construction
type: Metric
description: Cost Variance in Construction (CV-C) addresses conformance to standards, plans, or obligations
  and is a fixture of construction & engineering reporting. It is defined as (Earned Value of Work - Actual
  Cost) / Actual Cost; the result is stated in percent (%). In Construction & engineering, it is a recognized
  element of the standard performance toolkit. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: CV-C
unit: percent
