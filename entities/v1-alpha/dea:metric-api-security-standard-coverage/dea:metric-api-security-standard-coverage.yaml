id: dea:metric-api-security-standard-coverage
name: API Security Standard Coverage
type: Metric
description: API Security Standard Coverage (APISSC) addresses exposure to adverse outcomes and is a fixture
  of api lifecycle management reporting. It provides the day-to-day signal that a process is running as
  designed. Its calculation is Endpoints Enforcing Auth and Rate Policy / Endpoints, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. It originates from and is most
  used in Software practice.
abbreviation: APISSC
unit: percent
