id: dea:metric-air-safety-report-rate
name: Air Safety Report Rate
type: Metric
description: Air Safety Report Rate (ASRR) addresses exposure to adverse outcomes and is a fixture of
  airline operations (deep dive) reporting. It is defined as Safety Reports per 1,000 Flights; the result
  is stated in events per thousand or million (scaled). In Airlines, it is a recognized element of the
  standard performance toolkit. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Values outside the intended band, on either side, warrant investigation.
