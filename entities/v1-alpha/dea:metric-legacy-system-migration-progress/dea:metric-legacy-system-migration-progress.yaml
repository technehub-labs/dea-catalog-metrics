id: dea:metric-legacy-system-migration-progress
name: Legacy System Migration Progress
type: Metric
description: Legacy System Migration Progress (LSMP) addresses transformation and is a fixture of digital
  transformation reporting. Its calculation is Workloads or Functions Migrated / Functions in Scope, measured
  in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: LSMP
unit: percent
