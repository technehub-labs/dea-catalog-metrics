id: dea:metric-voice-quality-mos-score
name: Voice Quality MOS Score
type: Metric
description: 'Voice Quality MOS Score (VQMS) addresses the quality of outputs and outcomes and is a fixture
  of network performance & capacity reporting. It is defined as Mean Opinion Score for Voice Sessions;
  the result is stated in score (points). It is applied across virtually every sector. It is a working-level
  control: thresholds trigger immediate operational response. It should be maximized within the limits
  of cost and quality trade-offs.'
