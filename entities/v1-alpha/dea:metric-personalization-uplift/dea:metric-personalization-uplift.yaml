id: dea:metric-personalization-uplift
name: Personalization Uplift
type: Metric
description: A Customer Journey & Experience indicator, Personalization Uplift (PU-CX) quantifies the
  economic value created or preserved. It is computed as (Personalized Conversion - Baseline Conversion)
  / Baseline Conversion, expressed in percent (%). It is applied across virtually every sector. It is
  reviewed at cadence by planning owners to correct course before issues become strategic. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: PU-CX
unit: percent
version: 1.0.0
