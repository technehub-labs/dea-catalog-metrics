id: dea:metric-guest-satisfaction-index
name: Guest Satisfaction Index
type: Metric
description: 'A Hospitality & Food Service indicator, Guest Satisfaction Index (GSI) quantifies the engagement
  or satisfaction of the people involved. It is computed as Weighted Guest Survey Score, expressed in
  index (0-100 or normalized). Its use is concentrated in Hospitality. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It should be maximized within the
  limits of cost and quality trade-offs.'
