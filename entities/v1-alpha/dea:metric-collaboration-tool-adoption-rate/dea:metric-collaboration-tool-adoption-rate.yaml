id: dea:metric-collaboration-tool-adoption-rate
name: Collaboration Tool Adoption Rate
type: Metric
description: Collaboration Tool Adoption Rate (CTAR) captures capability maturity or development for organizations
  tracking digital workplace & collaboration. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Active Users of Collaboration Platform / Licensed
  Users - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: CTAR
unit: percent
