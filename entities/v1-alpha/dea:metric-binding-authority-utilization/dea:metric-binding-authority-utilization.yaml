id: dea:metric-binding-authority-utilization
name: Binding Authority Utilization
type: Metric
description: Binding Authority Utilization (BAU) measures the utilization or availability of capacity
  in the Insurance Distribution & Agency Management domain. It is computed as Premium Bound under Delegated
  Authority / Authority Granted, expressed in percent (%). It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is concentrated in Insurance.
abbreviation: BAU
unit: percent
