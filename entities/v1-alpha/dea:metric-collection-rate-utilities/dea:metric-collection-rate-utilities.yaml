id: dea:metric-collection-rate-utilities
name: Collection Rate (Utilities)
type: Metric
description: Collection Rate (Utilities) (CLR-U) addresses the economic value created or preserved and
  is a fixture of utilities customer operations reporting. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Revenue Collected / Revenue
  Billed, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  It originates from and is most used in Utilities practice.
