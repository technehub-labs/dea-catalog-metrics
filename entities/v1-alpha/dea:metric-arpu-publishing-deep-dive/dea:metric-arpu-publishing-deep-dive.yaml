id: dea:metric-arpu-publishing-deep-dive
name: ARPU - Publishing (Deep Dive)
type: Metric
description: ARPU - Publishing (Deep Dive) (ARPU-P) addresses the economic value created or preserved
  and is a fixture of publishing & news media reporting. Its calculation is Total Revenue / Active Readers
  or Subscribers, measured in currency per unit. It originates from and is most used in Media & Entertainment
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: ARPU-P
