id: dea:metric-esg-score-delta-vs-benchmark
name: ESG Score Delta vs Benchmark
type: Metric
description: ESG Score Delta vs Benchmark (ESGSDB) measures environmental and social sustainability performance
  in the Investment Performance Measurement domain. The formula is Portfolio ESG Score minus Benchmark
  ESG Score - reported in score (points). It is a standard measure in the Investment management sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Values outside the intended band, on either side, warrant investigation.
