id: dea:metric-business-continuity-plan-coverage
name: Business Continuity Plan Coverage
type: Metric
description: Business Continuity Plan Coverage (BCPC) measures conformance to standards, plans, or obligations
  in the Business Resilience & Continuity domain. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Critical Processes with Current Tested
  BCP / Critical Processes - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: BCPC
unit: percent
