id: dea:metric-debt-to-assets-ratio-deep-dive
name: Debt-to-Assets Ratio (Deep Dive)
type: Metric
description: Debt-to-Assets Ratio (Deep Dive) (DARDD) measures exposure to adverse outcomes in the Financial
  Statement Analysis Ratios (Deep Dive) domain. The formula is Total Debt / Total Assets - reported in
  percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
