id: dea:metric-fibre-loss-rate
name: Fibre Loss Rate
type: Metric
description: 'Fibre Loss Rate (FLR) addresses how efficiently resources are converted into outputs and
  is a fixture of pulp, paper & forest products reporting. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. The formula is Fibre Lost to Effluent / Fibre Input -
  reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Manufacturing sector.'
abbreviation: FLR
unit: percent
