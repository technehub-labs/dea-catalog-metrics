id: dea:metric-process-centering-ratio
name: Process Centering Ratio
type: Metric
description: 'A Process Capability & Six Sigma (Deep Dive) indicator, Process Centering Ratio (PCR-SS)
  quantifies the quality of outputs and outcomes. The formula is Distance of Process Mean from Spec Midpoint
  / Half-Tolerance - reported in ratio (x:1 or x). It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Manufacturing sector.'
