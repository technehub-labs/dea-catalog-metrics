id: dea:metric-average-class-size
name: Average Class Size
type: Metric
description: 'A Education indicator, Average Class Size (ACS) quantifies the utilization or availability
  of capacity. It is defined as Enrolled Students / Classes; the result is stated in ratio (x:1 or x).
  It is a working-level control: thresholds trigger immediate operational response. It is managed toward
  a defined target band rather than an extreme - both overshoot and undershoot can signal problems. In
  Education, it is a recognized element of the standard performance toolkit.'
