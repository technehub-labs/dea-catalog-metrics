id: dea:metric-average-handle-time-deep-dive
name: Average Handle Time (Deep Dive)
type: Metric
description: 'Average Handle Time (Deep Dive) (AHT-D) addresses how efficiently resources are converted
  into outputs and is a fixture of contact center operations (deep dive) reporting. It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. The formula is Talk Time + Hold
  + After-Call Work per Contact - reported in minutes. The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: AHT-D
unit: minute
