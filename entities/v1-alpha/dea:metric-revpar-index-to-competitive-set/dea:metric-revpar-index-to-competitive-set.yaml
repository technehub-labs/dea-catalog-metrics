id: dea:metric-revpar-index-to-competitive-set
name: RevPAR Index to Competitive Set
type: Metric
description: A Hotel & Resort Operations (Deep Dive) indicator, RevPAR Index to Competitive Set (RPI)
  quantifies how effectively a process or entity achieves its intended outcome. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. It is defined as Hotel RevPAR
  / Compset RevPAR; the result is stated in ratio (x:1 or x). Improvement means raising this figure toward
  best-in-class levels. In Hospitality, it is a recognized element of the standard performance toolkit.
abbreviation: RPI
unit: ratio
