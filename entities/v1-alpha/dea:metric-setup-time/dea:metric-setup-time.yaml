id: dea:metric-setup-time
name: Setup Time
type: Metric
description: 'Setup Time (SET) captures how efficiently resources are converted into outputs for organizations
  tracking manufacturing. It is defined as Time to Prepare Equipment for Production Run; the result is
  stated in minutes. It is a working-level control: thresholds trigger immediate operational response.
  Lower values are better; each reduction is an improvement. In Manufacturing, it is a recognized element
  of the standard performance toolkit.'
