id: dea:metric-it-general-control-deficiency-rate
name: IT General Control Deficiency Rate
type: Metric
description: IT General Control Deficiency Rate (ITGCDR) addresses exposure to adverse outcomes and is
  a fixture of internal controls & financial reporting integrity reporting. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is ITGC Tests with
  Deficiencies / ITGC Tests - reported in percent (%). It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
