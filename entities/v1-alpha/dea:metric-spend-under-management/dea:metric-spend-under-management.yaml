id: dea:metric-spend-under-management
name: Spend under Management
type: Metric
description: A Supply Chain indicator, Spend under Management (SuM) quantifies how effectively a process
  or entity achieves its intended outcome. Its calculation is Managed Spend / Total Addressable Spend,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SuM
unit: percent
