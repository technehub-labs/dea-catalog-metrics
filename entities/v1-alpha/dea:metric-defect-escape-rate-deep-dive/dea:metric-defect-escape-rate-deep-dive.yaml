id: dea:metric-defect-escape-rate-deep-dive
name: Defect Escape Rate (Deep Dive)
type: Metric
description: Defect Escape Rate (Deep Dive) (DER-QA) addresses the quality of outputs and outcomes and
  is a fixture of software testing & quality engineering reporting. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Defects
  Found in Production / Total Defects, measured in percent (%). It should be driven down, since lower
  readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: DER-QA
unit: percent
