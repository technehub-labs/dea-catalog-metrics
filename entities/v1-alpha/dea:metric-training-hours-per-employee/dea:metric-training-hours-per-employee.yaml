id: dea:metric-training-hours-per-employee
name: Training Hours per Employee
type: Metric
description: Training Hours per Employee (THPE) addresses the utilization or availability of capacity
  and is a fixture of human resources reporting. It is defined as Total Training Hours / Average Headcount;
  the result is stated in hours. It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
