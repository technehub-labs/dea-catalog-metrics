id: dea:metric-tax-collection-effectiveness
name: Tax Collection Effectiveness
type: Metric
description: Within Public Sector & Government, Tax Collection Effectiveness (TCE) is used to gauge how
  effectively a process or entity achieves its intended outcome. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Taxes Collected
  / Taxes Assessed, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Public sector practice.
