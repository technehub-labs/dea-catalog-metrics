id: dea:metric-esg-data-completeness-rate
name: ESG Data Completeness Rate
type: Metric
description: Within Environmental, Social & Governance Reporting, ESG Data Completeness Rate (ESGDC) is
  used to gauge conformance to standards, plans, or obligations. Its calculation is Reported Data Points
  / Required Data Points, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: ESGDC
unit: percent
