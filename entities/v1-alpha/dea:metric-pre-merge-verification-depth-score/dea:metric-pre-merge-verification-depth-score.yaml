id: dea:metric-pre-merge-verification-depth-score
name: Pre-Merge Verification Depth Score
type: Metric
description: 'Pre-Merge Verification Depth Score (PMVDS) captures the quality of outputs and outcomes
  for organizations tracking continuous integration. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Composite Gate Strength Score
  for Merge Checks, expressed in index (0-100 or normalized). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
