id: dea:metric-fraud-detection-rate
name: Fraud Detection Rate
type: Metric
description: 'A Insurance indicator, Fraud Detection Rate (FDR) quantifies exposure to adverse outcomes.
  It guides mid-horizon planning: portfolio, program, and function owners act on it between review cycles.
  The formula is Fraudulent Claims Detected / Total Fraudulent Claims Estimated - reported in percent
  (%). Improvement means raising this figure toward best-in-class levels. It is a standard measure in
  the Insurance sector.'
abbreviation: FDR
unit: percent
version: 1.1.0
lifecycle_status: candidate
