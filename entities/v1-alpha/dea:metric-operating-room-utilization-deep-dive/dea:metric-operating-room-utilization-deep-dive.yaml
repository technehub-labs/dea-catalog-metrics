id: dea:metric-operating-room-utilization-deep-dive
name: Operating Room Utilization (Deep Dive)
type: Metric
description: Operating Room Utilization (Deep Dive) (ORU-D) addresses the utilization or availability
  of capacity and is a fixture of medical practice & clinical operations reporting. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is In-Use OR Minutes / Available
  OR Minutes, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  It originates from and is most used in Healthcare practice.
abbreviation: ORU-D
unit: percent
