id: dea:metric-property-viewing-to-offer-rate
name: Property Viewing to Offer Rate
type: Metric
description: 'Property Viewing to Offer Rate (V2O) captures how effectively a process or entity achieves
  its intended outcome for organizations tracking real estate brokerage. It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. The formula is Offers Made / Viewings
  Conducted - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  It is a standard measure in the Real estate sector.'
