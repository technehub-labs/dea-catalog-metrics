id: dea:metric-learning-transfer-rate-deep-dive-l-d
name: Learning Transfer Rate (Deep Dive - L&D)
type: Metric
description: Learning Transfer Rate (Deep Dive - L&D) (LTRDDL) addresses the economic value created or
  preserved and is a fixture of learning & development effectiveness (deep dive) reporting. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Its
  calculation is Behaviors Applied at Work after Training / Trained Cohort, measured in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: LTRDDL
unit: percent
