id: dea:metric-first-payment-default-rate
name: First Payment Default Rate
type: Metric
description: A Banking Retail Lending (Deep Dive) indicator, First Payment Default Rate (FPDR) quantifies
  exposure to adverse outcomes. Its calculation is Borrowers Missing First Payment / Disbursed Loans,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Lower values are better; each reduction is an improvement. It originates from
  and is most used in Banking practice.
