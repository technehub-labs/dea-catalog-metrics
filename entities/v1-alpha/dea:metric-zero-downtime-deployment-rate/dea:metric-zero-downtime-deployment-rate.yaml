id: dea:metric-zero-downtime-deployment-rate
name: Zero-Downtime Deployment Rate
type: Metric
description: Zero-Downtime Deployment Rate (ZDDR) captures the quality of outputs and outcomes for organizations
  tracking continuous delivery & deployment. The formula is Deployments without Service Interruption /
  Deployments - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: ZDDR
unit: percent
