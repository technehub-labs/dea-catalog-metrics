id: dea:metric-cp-cpk-gap
name: Cp-Cpk Gap
type: Metric
description: 'Cp-Cpk Gap (CCGAP) measures the quality of outputs and outcomes in the Process Capability
  & Six Sigma (Deep Dive) domain. It is defined as Cp minus Cpk (Centering Penalty); the result is stated
  in ratio (x:1 or x). It is a working-level control: thresholds trigger immediate operational response.
  Lower values are better; each reduction is an improvement. In Manufacturing, it is a recognized element
  of the standard performance toolkit.'
abbreviation: CCGAP
unit: ratio
