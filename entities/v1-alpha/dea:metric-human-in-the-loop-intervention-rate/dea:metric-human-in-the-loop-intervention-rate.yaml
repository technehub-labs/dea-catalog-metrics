id: dea:metric-human-in-the-loop-intervention-rate
name: Human-in-the-Loop Intervention Rate
type: Metric
description: Human-in-the-Loop Intervention Rate (HITL) measures exposure to adverse outcomes in the Automation
  & Robotic Process Automation domain. Its calculation is Cases Requiring Human Override / Automated Cases,
  measured in percent (%). It is applied across virtually every sector. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: HITL
unit: percent
version: 1.0.0
