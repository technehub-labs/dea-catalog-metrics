id: dea:metric-beta-to-benchmark-deep-dive
name: Beta to Benchmark (Deep Dive)
type: Metric
description: A Investment Management - Portfolio Operations indicator, Beta to Benchmark (Deep Dive) (BETA-D)
  quantifies exposure to adverse outcomes. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Covariance with Benchmark / Benchmark
  Variance, measured in ratio (x:1 or x). The objective is neither maximization nor minimization but staying
  within an agreed operating band. It originates from and is most used in Financial Services practice.
abbreviation: BETA-D
unit: ratio
