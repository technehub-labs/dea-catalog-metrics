id: dea:metric-backup-success-rate
name: Backup Success Rate
type: Metric
description: 'Backup Success Rate (BSR-C) measures exposure to adverse outcomes in the Cybersecurity domain.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. The formula
  is Successful Backups / Scheduled Backups - reported in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
