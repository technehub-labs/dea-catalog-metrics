id: dea:metric-learning-outcome-attainment-rate
name: Learning Outcome Attainment Rate
type: Metric
description: A Education & Training Outcome Standard Measures indicator, Learning Outcome Attainment Rate
  (LOATR) quantifies the quality of outputs and outcomes. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Students Meeting Course
  Learning Outcomes / Enrolled Students, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. It originates from and is most used in Education practice.
abbreviation: LOATR
unit: percent
