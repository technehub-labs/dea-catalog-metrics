id: dea:metric-known-error-database-utilization-rate
name: Known Error Database Utilization Rate
type: Metric
description: Within IT Incident & Major Problem Management, Known Error Database Utilization Rate (KEDBR)
  is used to gauge how efficiently resources are converted into outputs. It is computed as Incidents Resolved
  via Known Error Entries / Applicable Incidents, expressed in percent (%). Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: KEDBR
unit: percent
version: 1.1.0
lifecycle_status: candidate
