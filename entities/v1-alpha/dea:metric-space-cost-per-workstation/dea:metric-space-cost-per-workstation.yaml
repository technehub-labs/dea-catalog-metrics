id: dea:metric-space-cost-per-workstation
name: Space Cost per Workstation
type: Metric
description: Within Facility Management & Workplace (Deep Dive), Space Cost per Workstation (SCPW) is
  used to gauge how efficiently resources are converted into outputs. The formula is Total Facility Cost
  / Workstations - reported in currency per unit. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
