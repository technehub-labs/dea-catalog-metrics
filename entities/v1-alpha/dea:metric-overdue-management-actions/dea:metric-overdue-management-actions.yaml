id: dea:metric-overdue-management-actions
name: Overdue Management Actions
type: Metric
description: Overdue Management Actions (OMA) captures exposure to adverse outcomes for organizations
  tracking internal audit. It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. It is defined as Actions Past Due Date; the result is stated in count (items
  per period). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: OMA
unit: count
