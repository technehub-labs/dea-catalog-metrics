id: dea:metric-continuity-plan-activation-success-rate
name: Continuity Plan Activation Success Rate
type: Metric
description: Continuity Plan Activation Success Rate (CPASR) addresses exposure to adverse outcomes and
  is a fixture of business continuity & disaster recovery reporting. It is defined as Activations Executed
  per Plan without Failure / Activations; the result is stated in percent (%). It is applied across virtually
  every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CPASR
unit: percent
