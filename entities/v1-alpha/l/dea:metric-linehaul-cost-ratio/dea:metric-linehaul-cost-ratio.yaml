id: dea:metric-linehaul-cost-ratio
name: Linehaul Cost Ratio
type: Metric
description: A Logistics & Transportation indicator, Linehaul Cost Ratio (LHR) quantifies how efficiently
  resources are converted into outputs. It is defined as Linehaul Cost / Total Logistics Cost; the result
  is stated in percent (%). It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. It is managed toward a defined target band rather than an extreme - both overshoot
  and undershoot can signal problems. In Logistics, it is a recognized element of the standard performance
  toolkit.
abbreviation: LHR
unit: percent
version: 1.1.0
