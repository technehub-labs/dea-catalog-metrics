id: dea:metric-loan-portfolio-yield
name: Loan Portfolio Yield
type: Metric
description: Loan Portfolio Yield (LPY) captures the economic value created or preserved for organizations
  tracking banking & financial services. Its calculation is Loan Interest Income / Average Loan Portfolio,
  measured in percent (%). It originates from and is most used in Financial services practice. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: LPY
unit: percent
version: 1.1.0
