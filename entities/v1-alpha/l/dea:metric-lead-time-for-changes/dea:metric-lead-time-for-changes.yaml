id: dea:metric-lead-time-for-changes
name: Lead Time for Changes
type: Metric
description: Lead Time for Changes (LTDC) addresses how efficiently resources are converted into outputs
  and is a fixture of software engineering reporting. Its calculation is Median Time from Commit to Production,
  measured in hours. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: LTDC
