source_credit: Public domain - no attribution required
calculation_definition: Players Joining Events / Active Players
formula_definition:
  formula_id: dea:formula-live-ops-event-participation
  expression: LOEP = Players Joining Events / Active Players
  inputs:
  - name: Players Joining Events
  - name: Active Players
