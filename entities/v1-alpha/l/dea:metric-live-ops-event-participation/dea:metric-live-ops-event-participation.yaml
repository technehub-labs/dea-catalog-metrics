id: dea:metric-live-ops-event-participation
name: Live Ops Event Participation
type: Metric
description: Live Ops Event Participation (LOEP) addresses the engagement or satisfaction of the people
  involved and is a fixture of gaming development & live operations reporting. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Players Joining Events / Active
  Players, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  It originates from and is most used in Gaming practice.
abbreviation: LOEP
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
