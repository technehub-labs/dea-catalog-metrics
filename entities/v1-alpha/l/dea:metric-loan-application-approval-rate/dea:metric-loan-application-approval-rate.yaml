id: dea:metric-loan-application-approval-rate
name: Loan Application Approval Rate
type: Metric
description: Loan Application Approval Rate (LAAR) captures how effectively a process or entity achieves
  its intended outcome for organizations tracking retail banking & lending. Its calculation is Approved
  Applications / Applications Received, measured in percent (%). It originates from and is most used in
  Banking practice. Its value drives prioritization and resource reallocation among competing initiatives.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: LAAR
unit: percent
