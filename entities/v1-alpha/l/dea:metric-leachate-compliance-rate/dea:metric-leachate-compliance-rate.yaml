id: dea:metric-leachate-compliance-rate
name: Leachate Compliance Rate
type: Metric
description: 'A Waste & Environmental Services indicator, Leachate Compliance Rate (LCR-W) quantifies
  conformance to standards, plans, or obligations. It is computed as Leachate Samples within Discharge
  Limits / Samples, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is concentrated in Environmental services.'
abbreviation: LCR-W
unit: percent
