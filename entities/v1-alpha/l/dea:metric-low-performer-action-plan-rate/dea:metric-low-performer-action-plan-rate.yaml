id: dea:metric-low-performer-action-plan-rate
name: Low Performer Action Plan Rate
type: Metric
description: 'Low Performer Action Plan Rate (LPAPR) captures capability maturity or development for organizations
  tracking enterprise okr & performance management. The formula is Underperformers with Development Plans
  / Identified - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: LPAPR
unit: percent
version: 1.1.0
