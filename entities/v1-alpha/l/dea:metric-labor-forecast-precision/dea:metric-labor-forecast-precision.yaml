id: dea:metric-labor-forecast-precision
name: Labor Forecast Precision
type: Metric
description: Within Workforce Planning & Productivity, Labor Forecast Precision (LFP) is used to gauge
  the quality of outputs and outcomes. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Forecast vs Actual Labor Hours / Actual, measured in percent
  (%). It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: LFP
unit: percent
