id: dea:metric-lead-response-time
name: Lead Response Time
type: Metric
description: 'Lead Response Time (LRT) addresses how efficiently resources are converted into outputs
  and is a fixture of sales reporting. It is defined as Average Time from Lead Arrival to First Response;
  the result is stated in minutes. It is applied across virtually every sector. It is a working-level
  control: thresholds trigger immediate operational response. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
abbreviation: LRT
unit: minute
