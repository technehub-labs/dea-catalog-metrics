id: dea:metric-losses-and-gains-variance-refining
name: Losses and Gains Variance (Refining)
type: Metric
description: Losses and Gains Variance (Refining) (LGV) measures the quality of outputs and outcomes in
  the Oil & Gas Downstream & Refining domain. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as Measured Output vs Theoretical Output Variance,
  expressed in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Its use is concentrated in Oil & Gas.
abbreviation: LGV
unit: percent
