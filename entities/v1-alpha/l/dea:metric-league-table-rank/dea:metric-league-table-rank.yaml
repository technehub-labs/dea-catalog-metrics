id: dea:metric-league-table-rank
name: League Table Rank
type: Metric
description: A Investment Banking & Capital Markets indicator, League Table Rank (LTR) quantifies growth
  over time. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Rank in Deal Volume or Fee League Tables - reported in count (items per period).
  Improvement means raising this figure toward best-in-class levels. It is a standard measure in the Investment
  banking sector.
