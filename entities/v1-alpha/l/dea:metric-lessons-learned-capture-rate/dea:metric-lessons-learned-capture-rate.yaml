id: dea:metric-lessons-learned-capture-rate
name: Lessons Learned Capture Rate
type: Metric
description: Lessons Learned Capture Rate (LLCR) captures capability maturity or development for organizations
  tracking project management. It is defined as Projects Recording Lessons Learned / Projects Closed;
  the result is stated in percent (%). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: LLCR
unit: percent
version: 1.1.0
