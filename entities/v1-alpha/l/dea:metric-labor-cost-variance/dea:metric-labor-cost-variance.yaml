id: dea:metric-labor-cost-variance
name: Labor Cost Variance
type: Metric
description: Within Workforce Planning & Analytics, Labor Cost Variance (LCV) is used to gauge conformance
  to standards, plans, or obligations. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as (Actual Labor Cost - Planned Labor Cost) / Planned
  Labor Cost; the result is stated in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: LCV
unit: percent
