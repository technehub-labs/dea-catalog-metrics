id: dea:metric-legacy-cost-run-rate-reduction
name: Legacy Cost Run-Rate Reduction
type: Metric
description: Legacy Cost Run-Rate Reduction (LCRR) addresses the economic value created or preserved and
  is a fixture of digital transformation reporting. Its calculation is (Legacy Cost_prior - Legacy Cost_current)
  / Legacy Cost_prior, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: LCRR
unit: percent
