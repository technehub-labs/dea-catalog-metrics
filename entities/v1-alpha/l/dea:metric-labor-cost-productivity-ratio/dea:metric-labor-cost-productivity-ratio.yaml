id: dea:metric-labor-cost-productivity-ratio
name: Labor Cost Productivity Ratio
type: Metric
description: Labor Cost Productivity Ratio (LCPR) measures how efficiently resources are converted into
  outputs in the Workforce Planning & Productivity domain. It is defined as Revenue or Output / Total
  Labor Cost; the result is stated in ratio (x:1 or x). Its trend is watched by senior leadership as an
  early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: LCPR
unit: ratio
