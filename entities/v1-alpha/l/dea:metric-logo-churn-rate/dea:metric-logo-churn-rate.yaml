source_credit: Public domain - no attribution required
calculation_definition: Customers Lost / Customers at Start of Period
formula_definition:
  formula_id: dea:formula-logo-churn-rate
  expression: LogoChurn = Customers Lost / Customers at Start of Period
  inputs:
