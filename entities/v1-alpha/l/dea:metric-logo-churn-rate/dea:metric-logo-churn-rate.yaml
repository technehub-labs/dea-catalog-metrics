id: dea:metric-logo-churn-rate
name: Logo Churn Rate
type: Metric
description: A Customer Success (B2B SaaS) indicator, Logo Churn Rate (LogoChurn) quantifies exposure
  to adverse outcomes. Its calculation is Customers Lost / Customers at Start of Period, measured in percent
  (%). It originates from and is most used in Software & SaaS practice. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and
  sustained decreases indicate successful intervention.
abbreviation: LogoChurn
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
