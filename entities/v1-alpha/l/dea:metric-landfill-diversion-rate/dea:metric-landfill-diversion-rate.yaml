id: dea:metric-landfill-diversion-rate
name: Landfill Diversion Rate
type: Metric
description: A Waste & Environmental Services indicator, Landfill Diversion Rate (LDR) quantifies environmental
  and social sustainability performance. The formula is Diverted Waste / Total Waste Collected - reported
  in percent (%). It is a standard measure in the Environmental services sector. It carries weight in
  boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: LDR
unit: percent
