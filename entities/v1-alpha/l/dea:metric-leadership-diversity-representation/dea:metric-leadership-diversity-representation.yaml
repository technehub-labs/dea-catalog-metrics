id: dea:metric-leadership-diversity-representation
name: Leadership Diversity Representation
type: Metric
description: A Diversity, Equity & Inclusion indicator, Leadership Diversity Representation (LDR) quantifies
  conformance to standards, plans, or obligations. The formula is Underrepresented Group in Leadership
  / Leadership Roles - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: LDR
unit: percent
