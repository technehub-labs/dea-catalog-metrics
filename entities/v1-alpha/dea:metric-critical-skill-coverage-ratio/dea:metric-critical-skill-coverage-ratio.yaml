id: dea:metric-critical-skill-coverage-ratio
name: Critical Skill Coverage Ratio
type: Metric
description: Critical Skill Coverage Ratio (CSCR-LD) addresses exposure to adverse outcomes and is a fixture
  of learning & development effectiveness (deep dive) reporting. The formula is Roles with Successor-Ready
  Skills / Critical Roles - reported in percent (%). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: CSCR-LD
unit: percent
