id: dea:metric-maintenance-request-resolution-time
name: Maintenance Request Resolution Time
type: Metric
description: 'Within Facilities & Real Estate, Maintenance Request Resolution Time (MRRT) is used to gauge
  how efficiently resources are converted into outputs. The formula is Hours from Request to Completion
  - reported in hours. It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Lower values are better; each reduction is an improvement. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.'
