id: dea:metric-fuel-burn-per-block-hour
name: Fuel Burn per Block Hour
type: Metric
description: Fuel Burn per Block Hour (FBH) captures how efficiently resources are converted into outputs
  for organizations tracking airlines & aviation. Its calculation is Fuel Consumed / Block Hours, measured
  in ratio (x:1 or x). It provides the day-to-day signal that a process is running as designed. Lower
  values are better; each reduction is an improvement. It originates from and is most used in Airlines
  & aviation practice.
