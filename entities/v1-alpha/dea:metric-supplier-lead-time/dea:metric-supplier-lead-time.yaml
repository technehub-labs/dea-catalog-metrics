id: dea:metric-supplier-lead-time
name: Supplier Lead Time
type: Metric
description: Supplier Lead Time (SLT) measures how efficiently resources are converted into outputs in
  the Procurement domain. Its calculation is Average Days from PO to Delivery, measured in days. Its value
  drives prioritization and resource reallocation among competing initiatives. Lower values are better;
  each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
