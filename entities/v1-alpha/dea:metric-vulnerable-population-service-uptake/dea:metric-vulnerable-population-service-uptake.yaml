id: dea:metric-vulnerable-population-service-uptake
name: Vulnerable Population Service Uptake
type: Metric
description: Vulnerable Population Service Uptake (VPSU) measures the economic value created or preserved
  in the Public Sector & Citizen Service Standard Measures (Deep Dive) domain. It is defined as Eligible
  Vulnerable Citizens Receiving Entitlements / Eligible; the result is stated in percent (%). In Public
  sector, it is a recognized element of the standard performance toolkit. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It should be maximized within the limits
  of cost and quality trade-offs.
