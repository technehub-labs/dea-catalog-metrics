id: dea:metric-clinical-trial-enrollment-rate
name: Clinical Trial Enrollment Rate
type: Metric
description: A Pharmaceuticals & Life Sciences indicator, Clinical Trial Enrollment Rate (CTER) quantifies
  how efficiently resources are converted into outputs. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Enrolled Subjects / Planned Subjects, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. It originates from and is most
  used in Pharmaceuticals practice.
abbreviation: CTER
unit: percent
version: 1.0.1
lifecycle_status: candidate
