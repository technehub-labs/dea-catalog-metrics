id: dea:metric-credit-card-utilization-rate
name: Credit Card Utilization Rate
type: Metric
description: 'Credit Card Utilization Rate (CCUR) measures exposure to adverse outcomes in the Retail
  Banking & Lending domain. It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. The formula is Outstanding Card Balances / Approved Credit Limits - reported
  in percent (%). The objective is neither maximization nor minimization but staying within an agreed
  operating band. It is a standard measure in the Banking sector.'
abbreviation: CCUR
unit: percent
version: 1.1.0
