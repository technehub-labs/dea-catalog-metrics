id: dea:metric-shelf-life-attainment-rate
name: Shelf Life Attainment Rate
type: Metric
description: 'Shelf Life Attainment Rate (SLAR) addresses the quality of outputs and outcomes and is a
  fixture of food & beverage manufacturing reporting. The formula is Batches Meeting Target Shelf Life
  / Batches - reported in percent (%). It is a standard measure in the Food & Beverage sector. It guides
  mid-horizon planning: portfolio, program, and function owners act on it between review cycles. It should
  be maximized within the limits of cost and quality trade-offs.'
