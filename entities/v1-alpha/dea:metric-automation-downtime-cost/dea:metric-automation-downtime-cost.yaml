id: dea:metric-automation-downtime-cost
name: Automation Downtime Cost
type: Metric
description: Automation Downtime Cost (ADC) captures exposure to adverse outcomes for organizations tracking
  industrial automation & robotics. Its calculation is Lost Output Value from Automation Unavailability
  per Period, measured in currency value. It originates from and is most used in Manufacturing practice.
  Its value drives prioritization and resource reallocation among competing initiatives. Reduction is
  the goal, and sustained decreases indicate successful intervention.
