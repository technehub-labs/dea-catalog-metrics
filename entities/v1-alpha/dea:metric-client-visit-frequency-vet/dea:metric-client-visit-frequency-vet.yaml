id: dea:metric-client-visit-frequency-vet
name: Client Visit Frequency (Vet)
type: Metric
description: Client Visit Frequency (Vet) (CVF) addresses the engagement or satisfaction of the people
  involved and is a fixture of veterinary & animal health reporting. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Visits per Patient per Year,
  expressed in times per period. Improvement means raising this figure toward best-in-class levels. Its
  use is concentrated in Healthcare.
