id: dea:metric-continuity-training-completion-rate
name: Continuity Training Completion Rate
type: Metric
description: Continuity Training Completion Rate (CTCR) measures capability maturity or development in
  the Business Continuity & Disaster Recovery domain. It is computed as Staff Completing Continuity Role
  Training / Staff in Roles, expressed in percent (%). It is reviewed at cadence by planning owners to
  correct course before issues become strategic. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: CTCR
unit: percent
