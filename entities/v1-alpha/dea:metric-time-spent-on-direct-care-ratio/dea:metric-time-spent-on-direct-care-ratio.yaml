id: dea:metric-time-spent-on-direct-care-ratio
name: Time Spent on Direct Care Ratio
type: Metric
description: 'A Elder & Social Care indicator, Time Spent on Direct Care Ratio (TSDC) quantifies the utilization
  or availability of capacity. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. The formula is Direct Care Hours / Paid Hours - reported in percent
  (%). Improvement means raising this figure toward best-in-class levels. It is a standard measure in
  the Social care sector.'
abbreviation: TSDC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
