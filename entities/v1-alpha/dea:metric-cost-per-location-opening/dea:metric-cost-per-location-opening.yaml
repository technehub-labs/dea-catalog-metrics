id: dea:metric-cost-per-location-opening
name: Cost per Location Opening
type: Metric
description: 'A Franchise & Multi-site indicator, Cost per Location Opening (CLO) quantifies how efficiently
  resources are converted into outputs. The formula is Total Opening Costs / New Locations Opened - reported
  in currency per unit. It is a standard measure in the Franchise & multi-site sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. Reduction is the
  goal, and sustained decreases indicate successful intervention.'
