id: dea:metric-integration-count-per-application
name: Integration Count per Application
type: Metric
description: Integration Count per Application (ICA) addresses capability maturity or development and
  is a fixture of enterprise architecture reporting. It is defined as Average Point-to-Point Interfaces
  per Application; the result is stated in ratio (x:1 or x). It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
