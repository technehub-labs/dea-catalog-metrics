id: dea:metric-alert-to-case-conversion-rate
name: Alert-to-Case Conversion Rate
type: Metric
description: 'Alert-to-Case Conversion Rate (ACR-FC) addresses how efficiently resources are converted
  into outputs and is a fixture of insurance fraud & financial crime reporting. The formula is Cases Opened
  / Alerts Triaged - reported in percent (%). It is a standard measure in the Financial Services sector.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. Values outside
  the intended band, on either side, warrant investigation.'
