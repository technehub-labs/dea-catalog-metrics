id: dea:metric-exit-plan-coverage
name: Exit Plan Coverage
type: Metric
description: Exit Plan Coverage (EPC) measures exposure to adverse outcomes in the Outsourcing & Vendor
  Management domain. Its calculation is Contracts with Tested Exit or Step-In Plan / Critical Contracts,
  measured in percent (%). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: EPC
unit: percent
