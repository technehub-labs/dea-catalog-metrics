id: dea:metric-single-points-of-dependency-count
name: Single Points of Dependency Count
type: Metric
description: 'Within Business Continuity & Disaster Recovery, Single Points of Dependency Count (SPOD)
  is used to gauge exposure to adverse outcomes. It is computed as Critical Dependencies without Redundancy
  / Critical Dependencies, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
