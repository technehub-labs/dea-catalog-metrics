id: dea:metric-product-line-breakeven-coverage
name: Product Line Breakeven Coverage
type: Metric
description: 'Within Product Costing & Margin Management, Product Line Breakeven Coverage (PLBC) is used
  to gauge the economic value created or preserved. It is computed as Products above Breakeven Volume
  / Products Sold, expressed in percent (%). It is applied across virtually every sector. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
