id: dea:metric-cell-site-outage-rate
name: Cell Site Outage Rate
type: Metric
description: A Telecom Network Operations (Deep Dive) indicator, Cell Site Outage Rate (CSOR) quantifies
  exposure to adverse outcomes. It bridges daily operations and executive reporting, giving managers a
  lever to pull within a quarter. It is defined as Site Outages / Sites; the result is stated in percent
  (%). It should be driven down, since lower readings signal healthier performance. In Telecommunications,
  it is a recognized element of the standard performance toolkit.
