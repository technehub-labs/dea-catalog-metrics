id: dea:metric-device-lot-acceptance-rate
name: Device Lot Acceptance Rate
type: Metric
description: 'A Medical Devices indicator, Device Lot Acceptance Rate (DLAR) quantifies the quality of
  outputs and outcomes. It is defined as Lots Accepted on Release Testing / Lots Tested; the result is
  stated in percent (%). It is a working-level control: thresholds trigger immediate operational response.
  Higher values are better; gains are read as improvement and losses as deterioration. In Medical devices,
  it is a recognized element of the standard performance toolkit.'
