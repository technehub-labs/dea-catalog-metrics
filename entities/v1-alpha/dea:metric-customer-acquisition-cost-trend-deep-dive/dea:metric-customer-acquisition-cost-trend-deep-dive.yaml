id: dea:metric-customer-acquisition-cost-trend-deep-dive
name: Customer Acquisition Cost Trend (Deep Dive)
type: Metric
description: A Balanced Scorecard - Customer Perspective indicator, Customer Acquisition Cost Trend (Deep
  Dive) (CACT-D) quantifies how efficiently resources are converted into outputs. It is defined as Change
  in CAC between Periods; the result is stated in currency value. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
