id: dea:metric-partnership-revenue-contribution
name: Partnership Revenue Contribution
type: Metric
description: Partnership Revenue Contribution (PRC-AP) measures the economic value created or preserved
  in the Alliances & Partnerships Management domain. It is defined as Partner-Attributed Revenue / Total
  Revenue; the result is stated in percent (%). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: PRC-AP
unit: percent
