id: dea:metric-rag-index-freshness-lag
name: RAG Index Freshness Lag
type: Metric
description: RAG Index Freshness Lag (RAGIFL) measures the quality of outputs and outcomes in the Generative
  AI & LLM Operations domain. Its calculation is Hours between Source Update and Index Refresh, measured
  in hours. It provides the day-to-day signal that a process is running as designed. Lower values are
  better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
