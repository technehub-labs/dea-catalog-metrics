id: dea:metric-feature-usage-rate
name: Feature Usage Rate
type: Metric
description: Within Software Engineering, Feature Usage Rate (FUR) is used to gauge the economic value
  created or preserved. Its calculation is Active Feature Users / Eligible Users, measured in percent
  (%). It is applied across virtually every sector. Its value drives prioritization and resource reallocation
  among competing initiatives. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: FUR
unit: percent
