id: dea:metric-target-costing-gap
name: Target Costing Gap
type: Metric
description: Target Costing Gap (TCG) captures the economic value created or preserved for organizations
  tracking product costing & margin management. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as (Target Cost - Current Cost) / Target Cost;
  the result is stated in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: TCG
unit: percent
version: 1.0.0
