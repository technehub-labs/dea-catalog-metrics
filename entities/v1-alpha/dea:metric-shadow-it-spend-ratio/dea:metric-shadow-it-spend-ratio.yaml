id: dea:metric-shadow-it-spend-ratio
name: Shadow IT Spend Ratio
type: Metric
description: Shadow IT Spend Ratio (SITSR) addresses exposure to adverse outcomes and is a fixture of
  it financial management & technology budgeting reporting. It is defined as Unsanctioned Technology Spend
  / Total Technology Spend; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SITSR
unit: percent
