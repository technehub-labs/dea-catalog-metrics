id: dea:metric-board-skills-coverage
name: Board Skills Coverage
type: Metric
description: Board Skills Coverage (BSC) captures capability maturity or development for organizations
  tracking corporate governance. It is defined as Required Competencies Present on Board / Required Competencies;
  the result is stated in percent (%). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
