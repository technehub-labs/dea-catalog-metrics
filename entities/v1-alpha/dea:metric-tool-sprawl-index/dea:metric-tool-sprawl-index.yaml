id: dea:metric-tool-sprawl-index
name: Tool Sprawl Index
type: Metric
description: 'Within Digital Workplace & Collaboration, Tool Sprawl Index (TSI) is used to gauge how efficiently
  resources are converted into outputs. The formula is Distinct Collaboration Apps per Team / Target App
  Count - reported in ratio (x:1 or x). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Lower values are better; each reduction is an improvement. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.'
