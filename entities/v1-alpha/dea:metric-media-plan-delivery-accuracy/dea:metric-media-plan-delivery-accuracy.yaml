id: dea:metric-media-plan-delivery-accuracy
name: Media Plan Delivery Accuracy
type: Metric
description: Media Plan Delivery Accuracy (MPDA) addresses conformance to standards, plans, or obligations
  and is a fixture of advertising & media buying reporting. It is computed as Delivered Impressions vs
  Plan within Tolerance / Placements, expressed in percent (%). Its use is concentrated in Media & Entertainment.
  Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: MPDA
unit: percent
