id: dea:metric-individual-goal-alignment-rate
name: Individual Goal Alignment Rate
type: Metric
description: 'Individual Goal Alignment Rate (IGAR-OKR) addresses the engagement or satisfaction of the
  people involved and is a fixture of enterprise okr & performance management reporting. The formula is
  Individual Goals Mapped to Team OKRs / Goals - reported in percent (%). It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
