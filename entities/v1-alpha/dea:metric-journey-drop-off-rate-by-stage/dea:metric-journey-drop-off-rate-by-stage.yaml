id: dea:metric-journey-drop-off-rate-by-stage
name: Journey Drop-off Rate by Stage
type: Metric
description: Journey Drop-off Rate by Stage (JDR) addresses exposure to adverse outcomes and is a fixture
  of customer journey & experience reporting. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It is computed as Customers Exiting at Stage / Customers Reaching
  Stage, expressed in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: JDR
unit: percent
version: 1.1.0
lifecycle_status: candidate
