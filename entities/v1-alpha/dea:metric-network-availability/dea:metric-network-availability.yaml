id: dea:metric-network-availability
name: Network Availability
type: Metric
description: Network Availability (NAV) addresses the quality of outputs and outcomes and is a fixture
  of telecommunications reporting. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Uptime of Network Services / Total Time, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. It originates from
  and is most used in Telecommunications practice.
abbreviation: NAV
unit: percent
