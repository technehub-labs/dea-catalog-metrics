id: dea:metric-locomotive-availability-deep-dive
name: Locomotive Availability (Deep Dive)
type: Metric
description: A Rail Freight (Deep Dive) indicator, Locomotive Availability (Deep Dive) (LA-D) quantifies
  the utilization or availability of capacity. The formula is Locomotives Available / Locomotives in Fleet
  - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Rail sector.
