id: dea:metric-crisis-fund-disbursement-time
name: Crisis Fund Disbursement Time
type: Metric
description: 'Crisis Fund Disbursement Time (CFDT) measures how efficiently resources are converted into
  outputs in the Crisis Management & Emergency Response domain. It is computed as Hours from Approval
  to Funds Available in Crisis, expressed in hours. It is applied across virtually every sector. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
