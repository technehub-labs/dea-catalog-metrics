id: dea:metric-grant-administration-overhead-ratio
name: Grant Administration Overhead Ratio
type: Metric
description: Grant Administration Overhead Ratio (GAOR) captures how efficiently resources are converted
  into outputs for organizations tracking public sector & citizen service standard measures (deep dive).
  Its calculation is Administration Cost / Grant Funds Disbursed, measured in percent (%). It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Lower
  values are better; each reduction is an improvement. It originates from and is most used in Public sector
  practice.
