id: dea:metric-claim-settlement-ratio
name: Claim Settlement Ratio
type: Metric
description: Claim Settlement Ratio (CSR) addresses the quality of outputs and outcomes and is a fixture
  of insurance reporting. It is defined as Claims Settled / Claims Received; the result is stated in percent
  (%). Its trend is watched by senior leadership as an early signal of structural performance shifts.
  Higher values are better; gains are read as improvement and losses as deterioration. In Insurance, it
  is a recognized element of the standard performance toolkit.
abbreviation: CSR
unit: percent
