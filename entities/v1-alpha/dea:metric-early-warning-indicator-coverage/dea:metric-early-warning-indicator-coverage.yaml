id: dea:metric-early-warning-indicator-coverage
name: Early Warning Indicator Coverage
type: Metric
description: 'A Emerging Risk & Horizon Scanning indicator, Early Warning Indicator Coverage (EWIC) quantifies
  exposure to adverse outcomes. It is computed as Emerging Risks with Defined Indicators / Emerging Risks,
  expressed in percent (%). It is applied across virtually every sector. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It should be maximized within the
  limits of cost and quality trade-offs.'
abbreviation: EWIC
unit: percent
version: 1.1.0
