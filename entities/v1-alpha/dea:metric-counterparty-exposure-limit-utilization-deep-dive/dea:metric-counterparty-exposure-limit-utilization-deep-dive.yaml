id: dea:metric-counterparty-exposure-limit-utilization-deep-dive
name: Counterparty Exposure Limit Utilization (Deep Dive)
type: Metric
description: Counterparty Exposure Limit Utilization (Deep Dive) (CELU) addresses exposure to adverse
  outcomes and is a fixture of corporate treasury (deep dive) reporting. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Exposure to Counterparty
  / Approved Limit - reported in percent (%). The objective is neither maximization nor minimization but
  staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
