id: dea:metric-automated-decision-approval-rate
name: Automated Decision Approval Rate
type: Metric
description: Within Automation & Robotic Process Automation, Automated Decision Approval Rate (ADAR) is
  used to gauge the quality of outputs and outcomes. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Automated Decisions Upheld
  on Review / Automated Decisions Sampled, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
