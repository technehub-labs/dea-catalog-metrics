id: dea:metric-mortality-within-30-days-of-procedure
name: Mortality within 30 Days of Procedure
type: Metric
description: Within Veterinary & Animal Health, Mortality within 30 Days of Procedure (MP30) is used to
  gauge exposure to adverse outcomes. It is defined as Deaths within 30 Days / Procedures; the result
  is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Lower values are better; each reduction is an improvement. In Healthcare, it is
  a recognized element of the standard performance toolkit.
