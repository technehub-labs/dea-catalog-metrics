id: dea:metric-maintenance-related-cancellation-rate
name: Maintenance-Related Cancellation Rate
type: Metric
description: 'A Airline Operations (Deep Dive) indicator, Maintenance-Related Cancellation Rate (MRCR-A)
  quantifies exposure to adverse outcomes. It is computed as Cancellations Due to Maintenance / Schedules,
  expressed in percent (%). Its use is concentrated in Airlines. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
abbreviation: MRCR-A
unit: percent
