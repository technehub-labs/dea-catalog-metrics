id: dea:metric-design-review-coverage
name: Design Review Coverage
type: Metric
description: Within Engineering & Design, Design Review Coverage (DRC) is used to gauge conformance to
  standards, plans, or obligations. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Artifacts Passing through Formal Review / Artifacts,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
