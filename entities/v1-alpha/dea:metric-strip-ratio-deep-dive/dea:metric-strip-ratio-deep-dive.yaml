id: dea:metric-strip-ratio-deep-dive
name: Strip Ratio (Deep Dive)
type: Metric
description: Strip Ratio (Deep Dive) (SR-D) addresses how efficiently resources are converted into outputs
  and is a fixture of metals & mining operations (deep dive) reporting. It is defined as Waste Tonnes
  / Ore Tonnes; the result is stated in ratio (x:1 or x). Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. In Metals & Mining, it is a recognized
  element of the standard performance toolkit.
