id: dea:metric-exemption-and-waiver-register-currency
name: Exemption and Waiver Register Currency
type: Metric
description: Exemption and Waiver Register Currency (EWRC) addresses conformance to standards, plans,
  or obligations and is a fixture of compliance monitoring & testing reporting. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. It is computed as Approved Exceptions
  within Validity / Exceptions, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
