id: dea:metric-customer-retention-cost-ratio-deep-dive
name: Customer Retention Cost Ratio (Deep Dive)
type: Metric
description: Within Balanced Scorecard - Customer Perspective, Customer Retention Cost Ratio (Deep Dive)
  (CRCR-D) is used to gauge how efficiently resources are converted into outputs. Its calculation is Retention
  Spend / Retained Revenue, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Reduction
  is the goal, and sustained decreases indicate successful intervention.
