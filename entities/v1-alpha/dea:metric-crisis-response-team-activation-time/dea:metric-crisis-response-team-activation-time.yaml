id: dea:metric-crisis-response-team-activation-time
name: Crisis Response Team Activation Time
type: Metric
description: 'A Crisis Management & Emergency Response indicator, Crisis Response Team Activation Time
  (CRTAT) quantifies how efficiently resources are converted into outputs. It is computed as Minutes from
  Trigger to Crisis Team Convened, expressed in minutes. It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
