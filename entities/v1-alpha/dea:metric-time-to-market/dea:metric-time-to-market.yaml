id: dea:metric-time-to-market
name: Time to Market
type: Metric
description: 'A R&D and Innovation indicator, Time to Market (TTM) quantifies how efficiently resources
  are converted into outputs. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Days from Concept Approval to First Sale, expressed
  in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
