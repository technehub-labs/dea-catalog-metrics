id: dea:metric-wafer-fab-cycle-time
name: Wafer Fab Cycle Time
type: Metric
description: Wafer Fab Cycle Time (WFCT) addresses how efficiently resources are converted into outputs
  and is a fixture of semiconductor & electronics reporting. The formula is Days from Wafer Start to Finished
  Wafer - reported in days. It is a standard measure in the Electronics & semiconductors sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction
  is the goal, and sustained decreases indicate successful intervention.
