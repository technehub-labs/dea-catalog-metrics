id: dea:metric-single-source-of-truth-metric-adoption
name: Single Source of Truth Metric Adoption
type: Metric
description: Single Source of Truth Metric Adoption (SSTMA) captures the quality of outputs and outcomes
  for organizations tracking enterprise decision effectiveness & governance monitoring. The formula is
  Governed Metrics from Authoritative Source / Governed Metrics - reported in percent (%). It is applied
  across virtually every sector. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. It should be maximized within the limits of cost and quality trade-offs.
