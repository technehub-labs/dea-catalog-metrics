id: dea:metric-subsidy-per-passenger-trip
name: Subsidy per Passenger Trip
type: Metric
description: Subsidy per Passenger Trip (SPT) measures the economic value created or preserved in the
  Public Transit domain. The formula is (Operating Cost - Fare Revenue) / Trips - reported in currency
  per unit. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. It is a standard measure in the
  Public transit sector.
abbreviation: SPT
