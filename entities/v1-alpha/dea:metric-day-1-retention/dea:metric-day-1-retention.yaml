id: dea:metric-day-1-retention
name: Day 1 Retention
type: Metric
description: Within Gaming, Day 1 Retention (D1R) is used to gauge the retention of customers, users,
  or assets over time. The formula is Players Returning on Day 1 / New Player Cohort - reported in percent
  (%). It is a standard measure in the Gaming sector. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. It should be maximized within the limits of cost and
  quality trade-offs.
