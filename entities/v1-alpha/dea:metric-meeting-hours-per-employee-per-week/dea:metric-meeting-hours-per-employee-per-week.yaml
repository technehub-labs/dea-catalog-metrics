id: dea:metric-meeting-hours-per-employee-per-week
name: Meeting Hours per Employee per Week
type: Metric
description: Meeting Hours per Employee per Week (MHPE) captures how efficiently resources are converted
  into outputs for organizations tracking digital workplace & collaboration. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Meeting Hours / Employee
  Weeks; the result is stated in hours. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: MHPE
unit: hour
