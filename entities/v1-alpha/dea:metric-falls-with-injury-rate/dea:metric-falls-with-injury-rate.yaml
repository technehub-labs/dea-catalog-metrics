id: dea:metric-falls-with-injury-rate
name: Falls with Injury Rate
type: Metric
description: 'Falls with Injury Rate (FWIR) addresses exposure to adverse outcomes and is a fixture of
  healthcare quality & patient safety standard measures reporting. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Falls Causing Injury / 1,000
  Patient Days - reported in events per thousand or million (scaled). It should be driven down, since
  lower readings signal healthier performance. It is a standard measure in the Healthcare sector.'
abbreviation: FWIR
unit: event
version: 1.1.0
