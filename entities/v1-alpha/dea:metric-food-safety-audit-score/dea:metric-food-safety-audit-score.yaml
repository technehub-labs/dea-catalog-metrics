id: dea:metric-food-safety-audit-score
name: Food Safety Audit Score
type: Metric
description: Within Agriculture & Food Processing, Food Safety Audit Score (FSAS) is used to gauge conformance
  to standards, plans, or obligations. Its calculation is Weighted Score of Food Safety Compliance Audits,
  measured in score (points). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. It originates from and is most used in Agriculture & food practice.
