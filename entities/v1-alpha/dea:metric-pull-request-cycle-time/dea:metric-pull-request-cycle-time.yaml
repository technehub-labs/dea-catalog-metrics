id: dea:metric-pull-request-cycle-time
name: Pull Request Cycle Time
type: Metric
description: 'Pull Request Cycle Time (PRCT) addresses how efficiently resources are converted into outputs
  and is a fixture of software engineering reporting. It is monitored close to the work: teams act on
  it within a shift, sprint, or daily review. The formula is Median Time from PR Open to Merge - reported
  in hours. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
