id: dea:metric-product-cannibalization-rate
name: Product Cannibalization Rate
type: Metric
description: 'Product Cannibalization Rate (PCR-T) addresses exposure to adverse outcomes and is a fixture
  of telecom product & bundle management reporting. The formula is Revenue Lost from Existing Products
  to New Product / Existing Product Baseline - reported in percent (%). It is a standard measure in the
  Telecommunications sector. It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. Values outside the intended band, on either side, warrant investigation.'
abbreviation: PCR-T
unit: percent
