id: dea:metric-citizen-satisfaction-index-government
name: Citizen Satisfaction Index (Government)
type: Metric
description: 'Citizen Satisfaction Index (Government) (CSI-G) addresses the engagement or satisfaction
  of the people involved and is a fixture of government & public administration reporting. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Weighted Citizen Survey Score, expressed in index (0-100 or normalized). Improvement means raising
  this figure toward best-in-class levels. Its use is concentrated in Public Sector.'
