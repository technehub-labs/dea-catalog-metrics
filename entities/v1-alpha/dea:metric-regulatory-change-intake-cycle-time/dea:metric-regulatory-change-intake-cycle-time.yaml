id: dea:metric-regulatory-change-intake-cycle-time
name: Regulatory Change Intake Cycle Time
type: Metric
description: 'Regulatory Change Intake Cycle Time (RCICT) addresses how efficiently resources are converted
  into outputs and is a fixture of compliance monitoring & testing reporting. The formula is Days from
  Regulation Published to Obligation Assessed - reported in days. It is applied across virtually every
  sector. It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. Reduction is the goal, and sustained decreases indicate successful intervention.'
