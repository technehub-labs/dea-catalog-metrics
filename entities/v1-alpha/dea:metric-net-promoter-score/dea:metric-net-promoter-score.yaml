id: dea:metric-net-promoter-score
name: Net Promoter Score
type: Metric
description: A Customer indicator, Net Promoter Score (NPS) quantifies the engagement or satisfaction
  of the people involved. The formula is % Promoters - % Detractors - reported in score (points). It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: NPS
unit: score
