id: dea:metric-price-variance-vs-benchmark
name: Price Variance vs Benchmark
type: Metric
description: 'Within Strategic Sourcing & Supplier Performance (Deep Dive), Price Variance vs Benchmark
  (PVB-SS) is used to gauge the economic value created or preserved. It is computed as Negotiated Price
  vs Market Benchmark / Benchmark, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Values outside the intended band, on either side, warrant investigation.'
