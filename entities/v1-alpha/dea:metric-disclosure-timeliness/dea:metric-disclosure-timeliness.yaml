id: dea:metric-disclosure-timeliness
name: Disclosure Timeliness
type: Metric
description: Disclosure Timeliness (DTM) measures conformance to standards, plans, or obligations in the
  Investor Relations & Capital Markets domain. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Required Disclosures Made by Deadline / Disclosures
  Due; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Listed companies, it is a recognized element of the standard performance toolkit.
