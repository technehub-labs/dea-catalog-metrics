id: dea:metric-straight-through-processing-rate-claims
name: Straight-Through Processing Rate (Claims)
type: Metric
description: Straight-Through Processing Rate (Claims) (STP-C) measures how efficiently resources are
  converted into outputs in the Claims Operations (Insurance) domain. The formula is Claims Settled without
  Manual Intervention / Claims Received - reported in percent (%). It is a standard measure in the Insurance
  sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: STP-C
unit: percent
