id: dea:metric-duplicate-content-ratio
name: Duplicate Content Ratio
type: Metric
description: 'A Knowledge Management (Deep Dive) indicator, Duplicate Content Ratio (DCR-KM) quantifies
  the quality of outputs and outcomes. The formula is Redundant Articles / Total Articles - reported in
  percent (%). It is applied across virtually every sector. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
