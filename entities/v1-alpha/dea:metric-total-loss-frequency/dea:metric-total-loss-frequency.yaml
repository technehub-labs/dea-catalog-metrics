id: dea:metric-total-loss-frequency
name: Total Loss Frequency
type: Metric
description: 'Total Loss Frequency (TLF) addresses exposure to adverse outcomes and is a fixture of insurance
  claims deep dive reporting. The formula is Total Loss Settlements / Claims Settled - reported in percent
  (%). It is a standard measure in the Insurance sector. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Values outside the intended band, on either side,
  warrant investigation.'
