id: dea:metric-customer-returns-rate
name: Customer Returns Rate
type: Metric
description: Customer Returns Rate (CRR) addresses the quality of outputs and outcomes and is a fixture
  of quality management reporting. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Returned Units / Units Sold - reported in percent (%).
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
