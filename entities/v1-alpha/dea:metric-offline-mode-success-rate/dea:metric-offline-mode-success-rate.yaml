id: dea:metric-offline-mode-success-rate
name: Offline Mode Success Rate
type: Metric
description: A Mobile & Client Development indicator, Offline Mode Success Rate (OMSR) quantifies the
  quality of outputs and outcomes. It provides the day-to-day signal that a process is running as designed.
  Its calculation is Offline Transactions Completed Correctly / Offline Attempts, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. It originates from and is most
  used in Software practice.
