id: dea:metric-total-turnover-rate
name: Total Turnover Rate
type: Metric
description: A Human Resources indicator, Total Turnover Rate (TTR) quantifies exposure to adverse outcomes.
  The formula is All Departures / Average Headcount - reported in percent (%). It is applied across virtually
  every sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: TTR
unit: percent
version: 1.1.0
