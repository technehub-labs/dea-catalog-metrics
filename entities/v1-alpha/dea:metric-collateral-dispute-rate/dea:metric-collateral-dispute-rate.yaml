id: dea:metric-collateral-dispute-rate
name: Collateral Dispute Rate
type: Metric
description: Collateral Dispute Rate (CDR-IR) measures the quality of outputs and outcomes in the Investment
  Risk & Middle Office Operations domain. Its calculation is Collateral Disputes / Collateral Calls, measured
  in percent (%). It originates from and is most used in Investment management practice. It provides the
  day-to-day signal that a process is running as designed. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: CDR-IR
unit: percent
