id: dea:metric-weighted-average-cost-of-capital-deep-dive
name: Weighted Average Cost of Capital (Deep Dive)
type: Metric
description: Weighted Average Cost of Capital (Deep Dive) (WACC) addresses the economic value created
  or preserved and is a fixture of valuation & corporate finance standard measures reporting. The formula
  is Weighted Cost of Equity and After-Tax Debt - reported in percent (%). It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Lower values are better; each
  reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
