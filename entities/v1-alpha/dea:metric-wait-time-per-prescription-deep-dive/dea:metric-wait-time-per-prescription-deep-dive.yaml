id: dea:metric-wait-time-per-prescription-deep-dive
name: Wait Time per Prescription (Deep Dive)
type: Metric
description: Wait Time per Prescription (Deep Dive) (WTP-D) measures how efficiently resources are converted
  into outputs in the Pharmacy Retail domain. It is computed as Minutes from Drop-Off to Ready, expressed
  in minutes. Its use is concentrated in Healthcare. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: WTP-D
unit: minute
