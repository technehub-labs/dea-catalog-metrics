id: dea:metric-reliability-growth-curve-adherence
name: Reliability Growth Curve Adherence
type: Metric
description: Reliability Growth Curve Adherence (RGCA) addresses the quality of outputs and outcomes and
  is a fixture of aerospace & defense program management reporting. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Actual
  MTBF vs Planned Growth Curve, measured in ratio (x:1 or x). Improvement means raising this figure toward
  best-in-class levels. It originates from and is most used in Aerospace & Defense practice.
