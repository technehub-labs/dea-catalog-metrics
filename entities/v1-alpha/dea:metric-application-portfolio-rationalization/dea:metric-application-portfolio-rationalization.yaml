id: dea:metric-application-portfolio-rationalization
name: Application Portfolio Rationalization
type: Metric
description: 'A Enterprise Architecture indicator, Application Portfolio Rationalization (APR) quantifies
  how efficiently resources are converted into outputs. It is computed as Applications Retired or Consolidated
  / Applications Identified, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: APR
unit: percent
