id: dea:metric-distributed-trace-sampling-efficiency
name: Distributed Trace Sampling Efficiency
type: Metric
description: Distributed Trace Sampling Efficiency (DTSE) addresses how efficiently resources are converted
  into outputs and is a fixture of sre & observability standard measures reporting. It is computed as
  Trace Samples Retained within Budget while Meeting Diagnostic Need, expressed in percent (%). Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is concentrated in Software.
