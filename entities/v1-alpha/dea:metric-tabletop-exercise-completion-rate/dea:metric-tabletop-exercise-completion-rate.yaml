id: dea:metric-tabletop-exercise-completion-rate
name: Tabletop Exercise Completion Rate
type: Metric
description: Tabletop Exercise Completion Rate (TECR-SOC) addresses capability maturity or development
  and is a fixture of secops & security operations center reporting. Its calculation is Exercises Completed
  per Year / Planned, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
