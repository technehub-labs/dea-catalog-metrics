id: dea:metric-direct-material-usage-variance
name: Direct Material Usage Variance
type: Metric
description: A Manufacturing indicator, Direct Material Usage Variance (DMUV) quantifies the economic
  value created or preserved. It is computed as (Actual Material Used - Standard Material) x Standard
  Price, expressed in currency value. It is reviewed at cadence by planning owners to correct course before
  issues become strategic. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Manufacturing.
abbreviation: DMUV
unit: currency
