id: dea:metric-follow-the-sun-handoff-failure-rate
name: Follow-the-Sun Handoff Failure Rate
type: Metric
description: Within Network Operations Center (Deep Dive), Follow-the-Sun Handoff Failure Rate (FTSHFR)
  is used to gauge the quality of outputs and outcomes. It is computed as Handoffs with Dropped Context
  / Handoffs, expressed in events per thousand or million (scaled). It is applied across virtually every
  sector. Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  Reduction is the goal, and sustained decreases indicate successful intervention.
