id: dea:metric-board-evaluation-completion
name: Board Evaluation Completion
type: Metric
description: 'Board Evaluation Completion (BEC) measures conformance to standards, plans, or obligations
  in the Corporate Governance domain. It is computed as Board Evaluations Completed on Schedule / Boards
  and Committees Requiring Evaluation, expressed in percent (%). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: BEC
unit: percent
