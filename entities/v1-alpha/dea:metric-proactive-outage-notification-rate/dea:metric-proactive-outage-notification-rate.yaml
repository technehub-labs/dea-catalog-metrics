id: dea:metric-proactive-outage-notification-rate
name: Proactive Outage Notification Rate
type: Metric
description: 'Proactive Outage Notification Rate (PONR) captures the quality of outputs and outcomes for
  organizations tracking telecom customer experience & billing. The formula is Outages with Customer Notification
  before Contact / Outages - reported in percent (%). It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. It is a standard measure in the Telecommunications sector.'
