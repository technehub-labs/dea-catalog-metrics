id: dea:metric-warehouse-cost-per-query
name: Warehouse Cost per Query
type: Metric
description: 'Within Data Science & Analytics Operations, Warehouse Cost per Query (WCQ-DS) is used to
  gauge how efficiently resources are converted into outputs. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. The formula is Warehouse Spend / Queries
  Executed - reported in currency per unit. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
