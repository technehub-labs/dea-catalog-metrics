description: 'Biodiversity Index - Farm (BIF) captures environmental and social sustainability performance
  for organizations tracking agriculture & agronomy (deep dive). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Composite Habitat
  and Species Score, expressed in index (0-100 or normalized). Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Agriculture.'
