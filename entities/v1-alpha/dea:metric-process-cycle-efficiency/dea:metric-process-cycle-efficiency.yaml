id: dea:metric-process-cycle-efficiency
name: Process Cycle Efficiency
type: Metric
description: A Operations indicator, Process Cycle Efficiency (PCE) quantifies how efficiently resources
  are converted into outputs. It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. It is defined as Value-Added Time / Total Cycle Time; the result is stated
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: PCE
unit: percent
