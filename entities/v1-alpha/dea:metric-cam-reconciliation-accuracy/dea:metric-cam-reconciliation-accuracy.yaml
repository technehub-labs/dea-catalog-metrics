id: dea:metric-cam-reconciliation-accuracy
name: CAM Reconciliation Accuracy
type: Metric
description: CAM Reconciliation Accuracy (CAMRA) captures the quality of outputs and outcomes for organizations
  tracking real estate portfolio & property management. Its calculation is Reconciliations without Adjustment
  / Reconciliations, measured in percent (%). It provides the day-to-day signal that a process is running
  as designed. Higher values are better; gains are read as improvement and losses as deterioration. It
  originates from and is most used in Real Estate practice.
