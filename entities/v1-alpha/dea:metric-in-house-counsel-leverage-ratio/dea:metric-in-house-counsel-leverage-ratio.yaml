name: In-House Counsel Leverage Ratio
type: Metric
description: Within Legal Operations, In-House Counsel Leverage Ratio (IHCL) is used to gauge capability
  maturity or development. The formula is In-House Legal Hours / Outside Counsel Hours - reported in ratio
  (x:1 or x). It is applied across virtually every sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Values outside the intended band, on either
  side, warrant investigation.
