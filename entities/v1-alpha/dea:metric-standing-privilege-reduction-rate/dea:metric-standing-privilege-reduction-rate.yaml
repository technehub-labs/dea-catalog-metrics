id: dea:metric-standing-privilege-reduction-rate
name: Standing Privilege Reduction Rate
type: Metric
description: Within Identity & Access Management Operations, Standing Privilege Reduction Rate (SPRR)
  is used to gauge exposure to adverse outcomes. It is defined as Just-in-Time Access Grants / Privileged
  Access Grants; the result is stated in percent (%). Its trend is watched by senior leadership as an
  early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: SPRR
unit: percent
