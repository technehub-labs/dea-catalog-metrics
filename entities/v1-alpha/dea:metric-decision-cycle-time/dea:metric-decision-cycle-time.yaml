id: dea:metric-decision-cycle-time
name: Decision Cycle Time
type: Metric
description: A Operating Model & Decision Effectiveness indicator, Decision Cycle Time (DCT) quantifies
  how efficiently resources are converted into outputs. The formula is Days from Decision Request to Approved
  Decision - reported in days. It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
