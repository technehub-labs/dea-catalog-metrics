id: dea:metric-vessel-schedule-reliability
name: Vessel Schedule Reliability
type: Metric
description: Within Maritime & Shipping, Vessel Schedule Reliability (VSR) is used to gauge the quality
  of outputs and outcomes. The formula is Voyages Arriving within Schedule Tolerance / Voyages - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Maritime & shipping sector.
