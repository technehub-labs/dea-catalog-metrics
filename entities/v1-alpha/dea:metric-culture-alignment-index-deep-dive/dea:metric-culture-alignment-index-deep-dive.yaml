id: dea:metric-culture-alignment-index-deep-dive
name: Culture Alignment Index (Deep Dive)
type: Metric
description: Culture Alignment Index (Deep Dive) (CAI-EE) addresses the quality of outputs and outcomes
  and is a fixture of employee engagement & culture (deep dive) reporting. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Survey Composite of
  Stated vs Lived Values; the result is stated in index (0-100 or normalized). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
