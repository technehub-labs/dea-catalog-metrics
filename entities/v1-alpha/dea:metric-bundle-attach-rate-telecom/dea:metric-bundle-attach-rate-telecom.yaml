id: dea:metric-bundle-attach-rate-telecom
name: Bundle Attach Rate (Telecom)
type: Metric
description: Bundle Attach Rate (Telecom) (BART-T) addresses growth over time and is a fixture of telecom
  product & bundle management reporting. The formula is Customers with Multi-Product Bundle / Customers
  - reported in percent (%). It is a standard measure in the Telecommunications sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: BART-T
unit: percent
