id: dea:metric-energy-intensity-of-extraction
name: Energy Intensity of Extraction
type: Metric
description: A Mining & Metals indicator, Energy Intensity of Extraction (EIE) quantifies environmental
  and social sustainability performance. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Energy Consumed / Ore Processed - reported in
  ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance. It is
  a standard measure in the Mining & metals sector.
