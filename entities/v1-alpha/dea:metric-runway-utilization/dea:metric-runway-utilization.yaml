id: dea:metric-runway-utilization
name: Runway Utilization
type: Metric
description: Runway Utilization (RWU) captures the utilization or availability of capacity for organizations
  tracking airport operations. It is computed as Aircraft Movements / Available Runway Hours, expressed
  in ratio (x:1 or x). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Airports.
abbreviation: RWU
