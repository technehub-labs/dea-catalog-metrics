id: dea:metric-risk-exposure-trend-index
name: Risk Exposure Trend Index
type: Metric
description: Risk Exposure Trend Index (RETI-PM) captures exposure to adverse outcomes for organizations
  tracking project management (deep dive). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Change in Aggregated Risk Score per Reporting
  Cycle - reported in index (0-100 or normalized). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
