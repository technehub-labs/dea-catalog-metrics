id: dea:metric-best-execution-compliance-rate
name: Best Execution Compliance Rate
type: Metric
description: Best Execution Compliance Rate (BECR-IM) captures conformance to standards, plans, or obligations
  for organizations tracking investment management - portfolio operations. Its calculation is Trades Meeting
  Best Execution Policy / Sampled, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. It originates from and is most used in Financial Services practice.
