id: dea:metric-business-impact-recovery-rate
name: Business Impact Recovery Rate
type: Metric
description: Business Impact Recovery Rate (BIRR) measures how effectively a process or entity achieves
  its intended outcome in the IT Incident & Major Problem Management domain. Its calculation is Transactions
  Recovered after Rerouting or Failover / Affected, measured in percent (%). It is applied across virtually
  every sector. Its value drives prioritization and resource reallocation among competing initiatives.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: BIRR
unit: percent
