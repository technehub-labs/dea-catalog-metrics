id: dea:metric-shadow-ai-detection-ratio
name: Shadow AI Detection Ratio
type: Metric
description: Shadow AI Detection Ratio (SAIDR) measures exposure to adverse outcomes in the AI Governance
  & Model Risk Management domain. It is defined as Unsanctioned AI Tools Discovered per Audit Cycle; the
  result is stated in count (items per period). It is applied across virtually every sector. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Reduction is the
  goal, and sustained decreases indicate successful intervention.
abbreviation: SAIDR
unit: count
version: 1.1.0
lifecycle_status: candidate
subject_classification:
