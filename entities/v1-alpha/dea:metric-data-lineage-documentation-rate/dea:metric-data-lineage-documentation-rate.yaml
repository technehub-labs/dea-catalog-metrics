id: dea:metric-data-lineage-documentation-rate
name: Data Lineage Documentation Rate
type: Metric
description: Data Lineage Documentation Rate (DLDR) addresses the quality of outputs and outcomes and
  is a fixture of data governance & stewardship reporting. Its calculation is Critical Elements with End-to-End
  Lineage / Critical Elements, measured in percent (%). It is applied across virtually every sector. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DLDR
unit: percent
version: 1.1.0
