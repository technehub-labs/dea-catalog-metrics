id: dea:metric-decommission-cycle-time
name: Decommission Cycle Time
type: Metric
description: 'Decommission Cycle Time (DCT-DC) addresses how efficiently resources are converted into
  outputs and is a fixture of data centers & cloud infrastructure reporting. The formula is Days from
  Asset Retirement Request to Racked-Out - reported in days. It is a standard measure in the Technology
  sector. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
