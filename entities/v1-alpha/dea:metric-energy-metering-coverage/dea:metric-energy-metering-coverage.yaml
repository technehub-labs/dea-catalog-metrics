id: dea:metric-energy-metering-coverage
name: Energy Metering Coverage
type: Metric
description: 'Within Operations Energy Management, Energy Metering Coverage (EMC-E) is used to gauge capability
  maturity or development. The formula is Major Loads Metered / Major Loads - reported in percent (%).
