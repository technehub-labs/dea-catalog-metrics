id: dea:metric-average-revenue-per-broadband-user
name: Average Revenue per Broadband User
type: Metric
description: 'Average Revenue per Broadband User (ARPBU) addresses the economic value created or preserved
  and is a fixture of telecommunications reporting. It is computed as Broadband Revenue / Broadband Subscribers,
  expressed in currency per unit. Its use is concentrated in Telecommunications. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
