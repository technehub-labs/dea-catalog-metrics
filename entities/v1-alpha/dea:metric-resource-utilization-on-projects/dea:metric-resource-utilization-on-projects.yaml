id: dea:metric-resource-utilization-on-projects
name: Resource Utilization on Projects
type: Metric
description: 'Resource Utilization on Projects (RUP) captures the utilization or availability of capacity
  for organizations tracking project management. The formula is Billable or Project Hours / Available
  Hours - reported in percent (%). It is applied across virtually every sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. Values outside the
  intended band, on either side, warrant investigation.'
abbreviation: RUP
unit: percent
version: 1.1.0
