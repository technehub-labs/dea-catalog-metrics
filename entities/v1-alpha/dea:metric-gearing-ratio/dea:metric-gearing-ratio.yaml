id: dea:metric-gearing-ratio
name: Gearing Ratio
type: Metric
description: 'Within Finance & Accounting, Gearing Ratio (GR) is used to gauge exposure to adverse outcomes.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is computed as Net Debt / (Net Debt + Shareholders'' Equity), expressed in percent (%). It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.'
