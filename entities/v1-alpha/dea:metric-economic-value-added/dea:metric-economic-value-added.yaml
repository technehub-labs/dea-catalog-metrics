id: dea:metric-economic-value-added
name: Economic Value Added
type: Metric
description: 'Within Strategy & Portfolio, Economic Value Added (EVA) is used to gauge the economic value
  created or preserved. It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. It is computed as NOPAT - (Capital Employed x Cost of Capital), expressed in
  currency value. Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.'
