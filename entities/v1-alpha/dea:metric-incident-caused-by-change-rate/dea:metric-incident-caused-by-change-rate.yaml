id: dea:metric-incident-caused-by-change-rate
name: Incident Caused by Change Rate
type: Metric
description: 'Within IT Incident & Major Problem Management, Incident Caused by Change Rate (ICBCR) is
  used to gauge exposure to adverse outcomes. It is computed as Incidents Caused by Recent Change / Incidents,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
