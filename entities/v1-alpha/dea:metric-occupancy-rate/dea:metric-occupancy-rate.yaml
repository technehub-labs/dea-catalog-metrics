id: dea:metric-occupancy-rate
name: Occupancy Rate
type: Metric
description: Occupancy Rate (OCC) measures the utilization or availability of capacity in the Hospitality
  & Food Service domain. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Rooms Occupied / Rooms Available - reported in percent (%). Improvement means
  raising this figure toward best-in-class levels. It is a standard measure in the Hospitality sector.
abbreviation: OCC
unit: percent
