id: dea:metric-cash-to-cash-cycle-time
name: Cash-to-Cash Cycle Time
type: Metric
description: Cash-to-Cash Cycle Time (C2C) measures how efficiently resources are converted into outputs
  in the Supply Chain domain. It is defined as DSO + DIO - DPO; the result is stated in days. It is applied
  across virtually every sector. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: C2C
unit: day
