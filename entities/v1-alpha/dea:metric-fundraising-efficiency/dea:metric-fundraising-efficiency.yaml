id: dea:metric-fundraising-efficiency
name: Fundraising Efficiency
type: Metric
description: Fundraising Efficiency (FE-N) measures how efficiently resources are converted into outputs
  in the Nonprofit & NGO domain. Its calculation is Funds Raised / Fundraising Costs, measured in ratio
  (x:1 or x). It originates from and is most used in Nonprofit & NGO practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
