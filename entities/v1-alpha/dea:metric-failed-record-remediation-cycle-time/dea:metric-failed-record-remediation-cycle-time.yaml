id: dea:metric-failed-record-remediation-cycle-time
name: Failed Record Remediation Cycle Time
type: Metric
description: A Data Quality Management indicator, Failed Record Remediation Cycle Time (FRRCT) quantifies
  how efficiently resources are converted into outputs. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Days to Remediate Failed Records,
  expressed in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
