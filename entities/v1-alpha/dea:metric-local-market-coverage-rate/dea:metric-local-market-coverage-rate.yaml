id: dea:metric-local-market-coverage-rate
name: Local Market Coverage Rate
type: Metric
description: Within Advertising & Media Buying, Local Market Coverage Rate (LMCR) is used to gauge conformance
  to standards, plans, or obligations. Its calculation is Designated Markets Covered per Plan / Planned
  Markets, measured in percent (%). It originates from and is most used in Media & Entertainment practice.
  Its value drives prioritization and resource reallocation among competing initiatives. It should be
  maximized within the limits of cost and quality trade-offs.
