id: dea:metric-reconciliation-break-rate-positions
name: Reconciliation Break Rate (Positions)
type: Metric
description: Reconciliation Break Rate (Positions) (RBRP) captures the quality of outputs and outcomes
  for organizations tracking investment risk & middle office operations. Its calculation is Unreconciled
  Position Breaks / Positions Reconciled, measured in events per thousand or million (scaled). It provides
  the day-to-day signal that a process is running as designed. Lower values are better; each reduction
  is an improvement. It originates from and is most used in Investment management practice.
