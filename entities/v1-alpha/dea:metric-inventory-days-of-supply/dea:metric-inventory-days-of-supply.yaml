id: dea:metric-inventory-days-of-supply
name: Inventory Days of Supply
type: Metric
description: 'Inventory Days of Supply (IDS) measures the utilization or availability of capacity in the
  Supply Chain domain. The formula is Average Inventory Value / Average Daily Usage - reported in days.
  It guides mid-horizon planning: portfolio, program, and function owners act on it between review cycles.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: IDS
unit: days
