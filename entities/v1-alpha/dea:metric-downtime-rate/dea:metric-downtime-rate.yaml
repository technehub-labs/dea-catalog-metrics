id: dea:metric-downtime-rate
name: Downtime Rate
type: Metric
description: Downtime Rate (DTR) captures the utilization or availability of capacity for organizations
  tracking operations. Its calculation is Downtime Hours / Scheduled Operating Hours, measured in percent
  (%). It is applied across virtually every sector. It provides the day-to-day signal that a process is
  running as designed. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: DTR
unit: percent
