id: dea:metric-water-recovery-rate-street-cleaning
name: Water Recovery Rate (Street Cleaning)
type: Metric
description: Water Recovery Rate (Street Cleaning) (WRR-S2) measures environmental and social sustainability
  performance in the Cleaning & Environmental Services domain. Its calculation is Recovered Wastewater
  / Water Used, measured in percent (%). It originates from and is most used in Facility Services practice.
  Its value drives prioritization and resource reallocation among competing initiatives. It should be
  maximized within the limits of cost and quality trade-offs.
