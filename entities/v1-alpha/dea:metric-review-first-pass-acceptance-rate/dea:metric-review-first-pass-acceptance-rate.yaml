id: dea:metric-review-first-pass-acceptance-rate
name: Review First-Pass Acceptance Rate
type: Metric
description: 'Review First-Pass Acceptance Rate (RFPAR) measures the quality of outputs and outcomes in
  the Code Review & Peer Quality domain. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Reviews Approved without Change Requests / Reviews - reported
  in percent (%). Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Software sector.'
