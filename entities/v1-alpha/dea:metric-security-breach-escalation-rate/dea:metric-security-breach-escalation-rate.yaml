id: dea:metric-security-breach-escalation-rate
name: Security Breach Escalation Rate
type: Metric
description: Security Breach Escalation Rate (SBER) addresses exposure to adverse outcomes and is a fixture
  of security services & guarding reporting. It is defined as Breaches Escalated / Breaches Detected;
  the result is stated in percent (%). It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. In Security, it is a recognized element of the
  standard performance toolkit.
abbreviation: SBER
unit: percent
