id: dea:metric-tuition-net-revenue-per-student
name: Tuition Net Revenue Per Student
type: Metric
description: Tuition Net Revenue Per Student (TNRS) captures the economic value created or preserved for
  organizations tracking education & training outcome standard measures. Its calculation is Net Tuition
  Revenue / Enrolled Students, measured in currency per unit. It originates from and is most used in Education
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Values outside the intended band, on either side, warrant investigation.
