id: dea:metric-fan-engagement-rate-digital
name: Fan Engagement Rate (Digital)
type: Metric
description: A Sports & Events indicator, Fan Engagement Rate (Digital) (FER-D) quantifies the engagement
  or satisfaction of the people involved. Its calculation is Interactions on Club Channels / Followers,
  measured in percent (%). It originates from and is most used in Sports & events practice. Its value
  drives prioritization and resource reallocation among competing initiatives. It should be maximized
  within the limits of cost and quality trade-offs.
