id: dea:metric-equipment-idle-time
name: Equipment Idle Time
type: Metric
description: 'Equipment Idle Time (EIT) addresses the utilization or availability of capacity and is a
  fixture of construction & engineering reporting. The formula is Idle Equipment Hours / Available Equipment
  Hours - reported in percent (%). It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Lower values are better; each reduction is an improvement. It is a standard
  measure in the Construction & engineering sector.'
abbreviation: EIT
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- business_architecture
purpose_classification:
