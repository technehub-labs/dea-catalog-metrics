id: dea:metric-cyclomatic-complexity-deep-dive
name: Cyclomatic Complexity (Deep Dive)
type: Metric
description: A Code Quality & Static Analysis indicator, Cyclomatic Complexity (Deep Dive) (CYCD) quantifies
  the quality of outputs and outcomes. Its calculation is Count of Independent Paths through Code Unit,
  measured in count (items per period). It originates from and is most used in Software practice. It provides
  the day-to-day signal that a process is running as designed. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: CYCD
unit: count
