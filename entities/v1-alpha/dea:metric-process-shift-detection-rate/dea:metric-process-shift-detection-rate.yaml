id: dea:metric-process-shift-detection-rate
name: Process Shift Detection Rate
type: Metric
description: A Process Capability & Six Sigma (Deep Dive) indicator, Process Shift Detection Rate (PSDR)
  quantifies the quality of outputs and outcomes. It is computed as Sustained Shifts Detected by Control
  Plan / Shifts Confirmed, expressed in percent (%). Its use is concentrated in Manufacturing. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: PSDR
unit: percent
