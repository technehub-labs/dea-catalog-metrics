id: dea:metric-security-checkpoint-throughput
name: Security Checkpoint Throughput
type: Metric
description: Security Checkpoint Throughput (SCT) addresses the utilization or availability of capacity
  and is a fixture of airport operations reporting. It is computed as Passengers Screened / Checkpoint
  Lane Hour, expressed in ratio (x:1 or x). Its use is concentrated in Airports. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: SCT
unit: ratio
