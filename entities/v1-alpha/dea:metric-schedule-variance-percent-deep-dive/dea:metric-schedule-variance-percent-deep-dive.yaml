id: dea:metric-schedule-variance-percent-deep-dive
name: Schedule Variance Percent (Deep Dive)
type: Metric
description: Schedule Variance Percent (Deep Dive) (SVP-D) addresses conformance to standards, plans,
  or obligations and is a fixture of project management (deep dive) reporting. It is defined as (Actual
  Duration - Baseline Duration) / Baseline Duration; the result is stated in percent (%). Its trend is
  watched by senior leadership as an early signal of structural performance shifts. It is managed toward
  a defined target band rather than an extreme - both overshoot and undershoot can signal problems. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SVP-D
unit: percent
