id: dea:metric-revenue-per-passenger
name: Revenue per Passenger
type: Metric
description: 'Revenue per Passenger (RPP) captures the economic value created or preserved for organizations
  tracking airlines & aviation. The formula is Passenger Revenue / Passengers Carried - reported in currency
  per unit. It is a standard measure in the Airlines & aviation sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
