id: dea:metric-third-party-inventory-completeness
name: Third-Party Inventory Completeness
type: Metric
description: Third-Party Inventory Completeness (TPIC) captures exposure to adverse outcomes for organizations
  tracking third-party risk management. It is defined as Vendors Registered in TPRM System / Vendors Identified;
  the result is stated in percent (%). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: TPIC
unit: percent
