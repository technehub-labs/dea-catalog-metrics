id: dea:metric-mandate-compliance-breach-count
name: Mandate Compliance Breach Count
type: Metric
description: Within Investment Management - Portfolio Operations, Mandate Compliance Breach Count (MCBC-IM)
  is used to gauge conformance to standards, plans, or obligations. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Investment
  Guideline Breaches per Period, measured in count (items per period). It should be driven down, since
  lower readings signal healthier performance. It originates from and is most used in Financial Services
  practice.
