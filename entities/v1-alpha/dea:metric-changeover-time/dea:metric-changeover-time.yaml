id: dea:metric-changeover-time
name: Changeover Time
type: Metric
description: Changeover Time (COT) captures how efficiently resources are converted into outputs for organizations
  tracking operations. It provides the day-to-day signal that a process is running as designed. Its calculation
  is Time to Switch Production from One Item to Next, measured in minutes. It should be driven down, since
  lower readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: COT
unit: minute
