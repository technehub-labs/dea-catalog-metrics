id: dea:metric-roll-rate-30-to-60-days
name: Roll Rate (30 to 60 Days)
type: Metric
description: Roll Rate (30 to 60 Days) (RR3060) measures exposure to adverse outcomes in the Credit &
  Collections Risk (Enterprise) domain. Its calculation is Accounts Rolling from 30DPD to 60DPD / Accounts
  at 30DPD, measured in percent (%). It is applied across virtually every sector. It provides the day-to-day
  signal that a process is running as designed. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: RR3060
unit: percent
