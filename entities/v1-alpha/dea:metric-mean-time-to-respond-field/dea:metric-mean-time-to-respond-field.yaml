id: dea:metric-mean-time-to-respond-field
name: Mean Time to Respond (Field)
type: Metric
description: 'A Field Service & Asset Performance indicator, Mean Time to Respond (Field) (MTTR-F) quantifies
  how efficiently resources are converted into outputs. It is monitored close to the work: teams act on
  it within a shift, sprint, or daily review. The formula is Time from Dispatch to Technician Arrival
  - reported in hours. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
