id: dea:metric-legal-advice-response-time
name: Legal Advice Response Time
type: Metric
description: 'A Legal Operations indicator, Legal Advice Response Time (LART) quantifies how efficiently
  resources are converted into outputs. The formula is Hours or Days from Request to Substantive Legal
  Response - reported in days. It is applied across virtually every sector. It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
