id: dea:metric-first-time-through-assembly-deep-dive
name: First Time Through - Assembly (Deep Dive)
type: Metric
description: A Automotive Manufacturing (Deep Dive) indicator, First Time Through - Assembly (Deep Dive)
  (FTA-D) quantifies the quality of outputs and outcomes. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Vehicles Passing without Rework /
  Vehicles; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Automotive, it is a recognized element of the standard performance toolkit.
abbreviation: FTA-D
unit: percent
version: 1.1.0
