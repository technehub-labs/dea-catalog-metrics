id: dea:metric-days-payable-outstanding
name: Days Payable Outstanding
type: Metric
description: 'Within Finance & Accounting, Days Payable Outstanding (DPO) is used to gauge how efficiently
  resources are converted into outputs. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is (Accounts Payable / Cost of Goods Sold) x 365
  - reported in days. Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
