id: dea:metric-passenger-assist-compliance-rate-wheelchair
name: Passenger Assist Compliance Rate (Wheelchair)
type: Metric
description: 'A Airline & Transportation Standard Measures (Deep Dive) indicator, Passenger Assist Compliance
  Rate (Wheelchair) (PACRW) quantifies the quality of outputs and outcomes. It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. The formula is Assistance Delivered within
  SLA / Assistance Requests - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Airlines & Aviation sector.'
