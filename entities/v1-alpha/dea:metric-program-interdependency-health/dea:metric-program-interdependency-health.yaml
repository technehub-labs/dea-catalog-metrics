id: dea:metric-program-interdependency-health
name: Program Interdependency Health
type: Metric
description: Program Interdependency Health (PIH-PPM) captures exposure to adverse outcomes for organizations
  tracking program & portfolio management. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Cross-Program Milestones on Track
  / Cross-Program Milestones, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PIH-PPM
unit: percent
