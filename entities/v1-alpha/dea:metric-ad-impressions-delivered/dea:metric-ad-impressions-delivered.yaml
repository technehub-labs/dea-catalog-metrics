id: dea:metric-ad-impressions-delivered
name: Ad Impressions Delivered
type: Metric
description: Ad Impressions Delivered (AID) measures the utilization or availability of capacity in the
  Media & Entertainment domain. It provides the day-to-day signal that a process is running as designed.
