id: dea:metric-farm-cost-per-tonne-produced-deep-dive
name: Farm Cost per Tonne Produced (Deep Dive)
type: Metric
description: A Agriculture & Agronomy (Deep Dive) indicator, Farm Cost per Tonne Produced (Deep Dive)
  (FCPT-D) quantifies how efficiently resources are converted into outputs. The formula is Total Cost
  / Production Tonnes - reported in currency per unit. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Agriculture sector.
