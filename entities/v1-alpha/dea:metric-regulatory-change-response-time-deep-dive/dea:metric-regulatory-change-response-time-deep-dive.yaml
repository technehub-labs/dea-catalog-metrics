id: dea:metric-regulatory-change-response-time-deep-dive
name: Regulatory Change Response Time (Deep Dive)
type: Metric
description: Regulatory Change Response Time (Deep Dive) (RCRT) measures how efficiently resources are
  converted into outputs in the Regulatory Affairs & Compliance Operations domain. Its calculation is
  Days from Regulation Publication to Impact Assessment, measured in days. Its value drives prioritization
  and resource reallocation among competing initiatives. Lower values are better; each reduction is an
  improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
