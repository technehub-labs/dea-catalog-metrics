id: dea:metric-marginal-cac-efficiency
name: Marginal CAC Efficiency
type: Metric
description: A Unit Economics & Growth (Deep Dive) indicator, Marginal CAC Efficiency (MCAE) quantifies
  how efficiently resources are converted into outputs. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Change in Customers / Change in Acquisition
  Spend - reported in ratio (x:1 or x). It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Software sector.
