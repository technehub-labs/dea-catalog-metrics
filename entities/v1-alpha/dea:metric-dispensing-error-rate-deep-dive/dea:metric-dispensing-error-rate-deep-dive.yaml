id: dea:metric-dispensing-error-rate-deep-dive
name: Dispensing Error Rate (Deep Dive)
type: Metric
description: Dispensing Error Rate (Deep Dive) (DER-D) captures exposure to adverse outcomes for organizations
  tracking pharmacy retail. The formula is Dispensing Errors / Prescriptions Dispensed - reported in events
  per thousand or million (scaled). It is a standard measure in the Healthcare sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction is the
  goal, and sustained decreases indicate successful intervention.
