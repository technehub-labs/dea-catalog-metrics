id: dea:metric-consumer-complaint-rate-deep-dive
name: Consumer Complaint Rate (Deep Dive)
type: Metric
description: Consumer Complaint Rate (Deep Dive) (CCR-D) captures the quality of outputs and outcomes
  for organizations tracking food & beverage manufacturing. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Complaints per Million Units Sold;
  the result is stated in events per thousand or million (scaled). It should be driven down, since lower
  readings signal healthier performance. In Food & Beverage, it is a recognized element of the standard
  performance toolkit.
