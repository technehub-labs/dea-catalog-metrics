id: dea:metric-strategic-reallocation-speed
name: Strategic Reallocation Speed
type: Metric
description: 'Strategic Reallocation Speed (SRS) measures capability maturity or development in the Operating
  Model & Decision Effectiveness domain. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Months to Shift Budget beyond Threshold between
  Units, expressed in days. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
