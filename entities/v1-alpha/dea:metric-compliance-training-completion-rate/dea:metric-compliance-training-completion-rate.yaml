id: dea:metric-compliance-training-completion-rate
name: Compliance Training Completion Rate
type: Metric
description: 'Compliance Training Completion Rate (CTCR-CM) captures conformance to standards, plans,
  or obligations for organizations tracking compliance monitoring & testing. It is monitored close to
  the work: teams act on it within a shift, sprint, or daily review. The formula is Staff Completing Mandatory
  Training by Due Date / Staff - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
