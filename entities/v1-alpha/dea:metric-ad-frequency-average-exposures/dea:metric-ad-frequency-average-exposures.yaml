id: dea:metric-ad-frequency-average-exposures
name: Ad Frequency (Average Exposures)
type: Metric
description: 'Ad Frequency (Average Exposures) (AFREQ) measures the engagement or satisfaction of the
  people involved in the Marketing & Advertising Standard Measures (Deep Dive) domain. It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. The formula is Impressions
  / Unique Users Reached - reported in ratio (x:1 or x). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
