id: dea:metric-season-ticket-renewal-rate-deep-dive
name: Season Ticket Renewal Rate (Deep Dive)
type: Metric
description: A Sports Clubs & Leagues (Deep Dive) indicator, Season Ticket Renewal Rate (Deep Dive) (STRR-D)
  quantifies the retention of customers, users, or assets over time. It is defined as Renewed Season Seats
  / Eligible Season Seats; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. In Sports, it is a recognized element of the standard performance toolkit.
