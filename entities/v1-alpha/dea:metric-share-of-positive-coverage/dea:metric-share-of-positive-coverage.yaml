id: dea:metric-share-of-positive-coverage
name: Share of Positive Coverage
type: Metric
description: A Corporate Communications & PR (Deep Dive) indicator, Share of Positive Coverage (SOPC)
  quantifies the engagement or satisfaction of the people involved. The formula is Positive Stories /
  Total Stories Monitored - reported in percent (%). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
