id: dea:metric-peak-demand-ratio
name: Peak Demand Ratio
type: Metric
description: 'Within Operations Energy Management, Peak Demand Ratio (PDR-E) is used to gauge the utilization
  or availability of capacity. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. The formula is Peak Power Demand / Contracted Demand Capacity - reported
  in percent (%). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: PDR-E
unit: percent
version: 1.1.0
