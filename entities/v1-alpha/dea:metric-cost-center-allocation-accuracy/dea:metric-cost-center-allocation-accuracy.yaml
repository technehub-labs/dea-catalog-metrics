id: dea:metric-cost-center-allocation-accuracy
name: Cost Center Allocation Accuracy
type: Metric
description: Cost Center Allocation Accuracy (CCAA) addresses conformance to standards, plans, or obligations
  and is a fixture of financial planning & analysis reporting. Its calculation is Allocations per Documented
  Policy / Allocation Lines, measured in percent (%). It provides the day-to-day signal that a process
  is running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
