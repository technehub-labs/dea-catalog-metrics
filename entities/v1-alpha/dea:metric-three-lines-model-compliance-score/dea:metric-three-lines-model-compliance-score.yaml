id: dea:metric-three-lines-model-compliance-score
name: Three Lines Model Compliance Score
type: Metric
description: Three Lines Model Compliance Score (TLMCS) addresses conformance to standards, plans, or
  obligations and is a fixture of enterprise decision effectiveness & governance monitoring reporting.
  The formula is Composite Independence and Coverage Assessment - reported in score (points). It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
