id: dea:metric-mask-set-utilization
name: Mask Set Utilization
type: Metric
description: Mask Set Utilization (MSU-S) addresses the utilization or availability of capacity and is
  a fixture of semiconductor manufacturing (deep dive) reporting. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It is defined as Active Mask Sets / Mask
  Sets in Inventory; the result is stated in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. In Semiconductors, it is a recognized element of the standard
  performance toolkit.
abbreviation: MSU-S
unit: percent
version: 1.1.0
