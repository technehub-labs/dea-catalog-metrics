id: dea:metric-incident-report-data-completeness
name: Incident Report Data Completeness
type: Metric
description: 'Incident Report Data Completeness (IRDC) measures the quality of outputs and outcomes in
  the IT Incident & Major Problem Management domain. It is a working-level control: thresholds trigger
  immediate operational response. It is defined as Incident Records with Required Fields / Records; the
  result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
