id: dea:metric-cost-per-case
name: Cost per Case
type: Metric
description: 'A Healthcare indicator, Cost per Case (CPC2) quantifies how efficiently resources are converted
  into outputs. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It is computed as Total Treatment Cost / Cases Treated, expressed in currency per unit.
  It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Healthcare.'
abbreviation: CPC2
unit: currency
