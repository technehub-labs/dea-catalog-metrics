id: dea:metric-process-compliance-score
name: Process Compliance Score
type: Metric
description: 'Process Compliance Score (PCS-BSC) measures conformance to standards, plans, or obligations
  in the Balanced Scorecard - Internal Process Perspective domain. It is computed as Control Tests Passed
  / Control Tests, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: PCS-BSC
unit: percent
