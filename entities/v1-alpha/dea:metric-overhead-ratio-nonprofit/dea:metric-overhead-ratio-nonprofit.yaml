id: dea:metric-overhead-ratio-nonprofit
name: Overhead Ratio (Nonprofit)
type: Metric
description: A Nonprofit & NGO indicator, Overhead Ratio (Nonprofit) (OHR-N) quantifies how efficiently
  resources are converted into outputs. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is (Administrative + Fundraising Expenses) / Total
  Expenses - reported in percent (%). It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Nonprofit & NGO sector.
abbreviation: OHR-N
unit: percent
