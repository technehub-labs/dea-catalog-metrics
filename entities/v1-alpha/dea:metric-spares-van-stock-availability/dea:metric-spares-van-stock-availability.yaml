id: dea:metric-spares-van-stock-availability
name: Spares Van Stock Availability
type: Metric
description: Within Telecom Field & Installation, Spares Van Stock Availability (SVSA) is used to gauge
  the utilization or availability of capacity. Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. It is computed as Jobs Completed without Spares Stockout
  / Jobs, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Its use is concentrated in Telecommunications.
