id: dea:metric-license-utilization-rate-deep-dive
name: License Utilization Rate (Deep Dive)
type: Metric
description: A ERP & Enterprise Application Operations indicator, License Utilization Rate (Deep Dive)
  (LUR-D) quantifies how efficiently resources are converted into outputs. It is reviewed at cadence by
  planning owners to correct course before issues become strategic. It is computed as Used Licenses /
  Purchased Licenses, expressed in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: LUR-D
unit: percent
