id: dea:metric-model-serving-availability
name: Model Serving Availability
type: Metric
description: Model Serving Availability (MSAV) measures the utilization or availability of capacity in
  the MLOps & Model Lifecycle Operations domain. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. It is computed as Serving Endpoint Uptime / Required
  Time, expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: MSAV
unit: percent
