id: dea:metric-franchisee-retention-rate
name: Franchisee Retention Rate
type: Metric
description: 'A Franchise & Multi-site indicator, Franchisee Retention Rate (FRR) quantifies the retention
  of customers, users, or assets over time. It is computed as Franchisees Renewing or Continuing / Franchisees,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Franchise & multi-site.'
abbreviation: FRR
unit: percent
version: 1.1.0
