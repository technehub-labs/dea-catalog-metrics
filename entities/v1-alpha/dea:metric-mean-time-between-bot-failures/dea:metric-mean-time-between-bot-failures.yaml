id: dea:metric-mean-time-between-bot-failures
name: Mean Time between Bot Failures
type: Metric
description: A Automation & Robotic Process Automation indicator, Mean Time between Bot Failures (MTBBF)
  quantifies exposure to adverse outcomes. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It is computed as Total Bot Operating Time / Bot Failures, expressed
  in hours. Improvement means raising this figure toward best-in-class levels. Practitioners in nearly
  any industry can adopt it directly.
