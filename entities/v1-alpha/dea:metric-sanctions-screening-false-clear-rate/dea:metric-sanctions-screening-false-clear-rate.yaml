id: dea:metric-sanctions-screening-false-clear-rate
name: Sanctions Screening False Clear Rate
type: Metric
description: Sanctions Screening False Clear Rate (SSFCR) addresses the quality of outputs and outcomes
  and is a fixture of enterprise fraud & financial crime management reporting. It is computed as Cleared
  Alerts Reversed on Review / Alerts Cleared, expressed in events per thousand or million (scaled). It
  is applied across virtually every sector. Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. Reduction is the goal, and sustained decreases indicate successful
  intervention.
