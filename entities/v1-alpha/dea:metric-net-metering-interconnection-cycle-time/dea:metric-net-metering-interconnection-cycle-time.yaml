id: dea:metric-net-metering-interconnection-cycle-time
name: Net Metering Interconnection Cycle Time
type: Metric
description: A Utilities Field Operations & Grid indicator, Net Metering Interconnection Cycle Time (NMICT)
  quantifies how efficiently resources are converted into outputs. Its value drives prioritization and
  resource reallocation among competing initiatives. Its calculation is Days from Application to Permission
  to Operate, measured in days. It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Utilities practice.
abbreviation: NMICT
unit: day
