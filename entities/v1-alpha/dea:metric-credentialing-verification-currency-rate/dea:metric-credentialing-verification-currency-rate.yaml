id: dea:metric-credentialing-verification-currency-rate
name: Credentialing Verification Currency Rate
type: Metric
description: Credentialing Verification Currency Rate (CVCR-HC) measures conformance to standards, plans,
  or obligations in the Healthcare Quality & Patient Safety Standard Measures domain. The formula is Practitioners
  with Current Primary Source Verification / Practitioners - reported in percent (%). It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. Higher values are
  better; gains are read as improvement and losses as deterioration. It is a standard measure in the Healthcare
  sector.
