id: dea:metric-case-backlog-ratio-government
name: Case Backlog Ratio (Government)
type: Metric
description: Case Backlog Ratio (Government) (CBR-G) addresses how efficiently resources are converted
  into outputs and is a fixture of government & public administration reporting. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Open Cases
  beyond Standard / Open Cases; the result is stated in percent (%). It should be driven down, since lower
  readings signal healthier performance. In Public Sector, it is a recognized element of the standard
  performance toolkit.
abbreviation: CBR-G
unit: percent
