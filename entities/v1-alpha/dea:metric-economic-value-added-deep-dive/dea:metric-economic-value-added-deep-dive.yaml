id: dea:metric-economic-value-added-deep-dive
name: Economic Value Added (Deep Dive)
type: Metric
description: Within Balanced Scorecard - Financial Perspective, Economic Value Added (Deep Dive) (EVA-D)
  is used to gauge the economic value created or preserved. The formula is NOPAT - WACC x Capital Employed
  - reported in currency value. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
