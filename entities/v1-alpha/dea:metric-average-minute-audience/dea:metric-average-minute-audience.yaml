id: dea:metric-average-minute-audience
name: Average Minute Audience
type: Metric
description: Average Minute Audience (AMA) measures the engagement or satisfaction of the people involved
  in the Media & Entertainment domain. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Average Viewers or Listeners Watching per Minute,
  measured in count (items per period). Improvement means raising this figure toward best-in-class levels.
  It originates from and is most used in Media & entertainment practice.
abbreviation: AMA
unit: count
