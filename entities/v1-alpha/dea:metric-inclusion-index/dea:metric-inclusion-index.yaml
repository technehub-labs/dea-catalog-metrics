id: dea:metric-inclusion-index
name: Inclusion Index
type: Metric
description: 'Within Culture & Employee Experience, Inclusion Index (INCI) is used to gauge the engagement
  or satisfaction of the people involved. It is computed as Weighted Index of Belonging and Fairness Survey
  Items, expressed in index (0-100 or normalized). It is applied across virtually every sector. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. It
  should be maximized within the limits of cost and quality trade-offs.'
