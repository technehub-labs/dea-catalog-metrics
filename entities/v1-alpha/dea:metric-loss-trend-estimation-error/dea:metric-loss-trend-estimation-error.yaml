id: dea:metric-loss-trend-estimation-error
name: Loss Trend Estimation Error
type: Metric
description: Loss Trend Estimation Error (LTE) captures the quality of outputs and outcomes for organizations
  tracking actuarial & reserving. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Actual Loss Trend - Estimated Loss Trend - reported in
  percent (%). It should be driven down, since lower readings signal healthier performance. It is a standard
  measure in the Insurance sector.
