id: dea:metric-return-on-assets-deep-dive
name: Return on Assets (Deep Dive)
type: Metric
description: Return on Assets (Deep Dive) (ROADD) measures the economic value created or preserved in
  the Financial Statement Analysis Ratios (Deep Dive) domain. Its calculation is Net Income / Total Assets,
  measured in percent (%). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
