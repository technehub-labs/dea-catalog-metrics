id: dea:metric-project-team-attrition-rate-deep-dive
name: Project Team Attrition Rate (Deep Dive)
type: Metric
description: Project Team Attrition Rate (Deep Dive) (PTAR-D) measures exposure to adverse outcomes in
  the Project Management (Deep Dive) domain. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Team Members Departing Mid-Project / Team, measured
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: PTAR-D
unit: percent
