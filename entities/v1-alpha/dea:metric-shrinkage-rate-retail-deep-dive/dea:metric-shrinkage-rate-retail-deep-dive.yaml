id: dea:metric-shrinkage-rate-retail-deep-dive
name: Shrinkage Rate (Retail Deep Dive)
type: Metric
description: Shrinkage Rate (Retail Deep Dive) (SHR) captures exposure to adverse outcomes for organizations
  tracking retail standard measures. It is defined as Inventory Loss / Sales; the result is stated in
  percent (%). In Retail & E-commerce, it is a recognized element of the standard performance toolkit.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: SHR
unit: percent
version: 1.1.0
lifecycle_status: candidate
