id: dea:metric-supplier-quality-rating
name: Supplier Quality Rating
type: Metric
description: Supplier Quality Rating (SQR-Q) addresses the quality of outputs and outcomes and is a fixture
  of quality management reporting. It is computed as Accepted Lots / Total Lots Received, expressed in
  percent (%). It is applied across virtually every sector. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It should be maximized within the limits of cost and
  quality trade-offs.
abbreviation: SQR-Q
unit: percent
