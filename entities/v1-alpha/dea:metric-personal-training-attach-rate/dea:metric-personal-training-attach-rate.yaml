id: dea:metric-personal-training-attach-rate
name: Personal Training Attach Rate
type: Metric
description: Within Fitness & Wellness, Personal Training Attach Rate (PTAR) is used to gauge growth over
  time. Its value drives prioritization and resource reallocation among competing initiatives. Its calculation
  is Members with Active PT Contracts / Members, measured in percent (%). Improvement means raising this
  figure toward best-in-class levels. It originates from and is most used in Fitness & wellness practice.
