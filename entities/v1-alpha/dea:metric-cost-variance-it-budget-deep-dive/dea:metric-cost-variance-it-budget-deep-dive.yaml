id: dea:metric-cost-variance-it-budget-deep-dive
name: Cost Variance - IT Budget (Deep Dive)
type: Metric
description: Cost Variance - IT Budget (Deep Dive) (CVITB-D) measures conformance to standards, plans,
  or obligations in the IT Financial Management & Technology Budgeting domain. It is defined as Actual
  Spend - Budget / Budget; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: CVITB-D
unit: percent
