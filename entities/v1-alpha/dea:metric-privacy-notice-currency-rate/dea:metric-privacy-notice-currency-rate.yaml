id: dea:metric-privacy-notice-currency-rate
name: Privacy Notice Currency Rate
type: Metric
description: 'Privacy Notice Currency Rate (PNCR) captures conformance to standards, plans, or obligations
  for organizations tracking data privacy & protection. The formula is Notices Updated within Change Window
  / Notices Requiring Update - reported in percent (%). It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: PNCR
unit: percent
