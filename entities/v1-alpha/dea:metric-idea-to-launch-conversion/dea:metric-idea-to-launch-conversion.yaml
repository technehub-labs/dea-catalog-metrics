id: dea:metric-idea-to-launch-conversion
name: Idea-to-Launch Conversion
type: Metric
description: Idea-to-Launch Conversion (I2L) captures how effectively a process or entity achieves its
  intended outcome for organizations tracking r&d and innovation. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Ideas Reaching Launch / Ideas
  Submitted - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: I2L
unit: percent
