id: dea:metric-time-to-interactive
name: Time to Interactive
type: Metric
description: 'A Digital Product & Web Operations indicator, Time to Interactive (TTI) quantifies the quality
  of outputs and outcomes. It is defined as Median Time until Page Fully Interactive; the result is stated
  in seconds. It is a working-level control: thresholds trigger immediate operational response. Lower
  values are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
