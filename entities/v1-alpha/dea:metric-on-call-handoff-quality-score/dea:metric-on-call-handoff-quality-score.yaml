id: dea:metric-on-call-handoff-quality-score
name: On-Call Handoff Quality Score
type: Metric
description: On-Call Handoff Quality Score (OCHQS) addresses the quality of outputs and outcomes and is
  a fixture of observability & site reliability engineering reporting. Its calculation is Handoff Survey
  Completeness Score, measured in score (points). It is applied across virtually every sector. It provides
  the day-to-day signal that a process is running as designed. It should be maximized within the limits
  of cost and quality trade-offs.
