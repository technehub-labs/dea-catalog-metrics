id: dea:metric-patient-portal-activation-rate
name: Patient Portal Activation Rate
type: Metric
description: Within Medical Practice & Clinical Operations, Patient Portal Activation Rate (PPAR) is used
  to gauge the engagement or satisfaction of the people involved. Its calculation is Patients Activated
  in Portal / Eligible Patients, measured in percent (%). It originates from and is most used in Healthcare
  practice. Its value drives prioritization and resource reallocation among competing initiatives. It
  should be maximized within the limits of cost and quality trade-offs.
