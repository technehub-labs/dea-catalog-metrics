id: dea:metric-decision-cycle-time-strategic-decisions
name: Decision Cycle Time - Strategic Decisions
type: Metric
description: Decision Cycle Time - Strategic Decisions (DCTSD) addresses how efficiently resources are
  converted into outputs and is a fixture of enterprise decision effectiveness & governance monitoring
  reporting. The formula is Days from Decision Request to Final Decision - reported in days. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Lower values
  are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
