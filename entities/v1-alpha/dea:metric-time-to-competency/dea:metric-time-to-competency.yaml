name: Time to Competency
type: Metric
description: A Learning & Development indicator, Time to Competency (TTC-L) quantifies capability maturity
  or development. The formula is Days from Role Entry to Competent Performance - reported in days. It
  is applied across virtually every sector. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases indicate successful
  intervention.
