id: dea:metric-indirect-tax-recovery-rate
name: Indirect Tax Recovery Rate
type: Metric
description: Within Tax & Fiscal, Indirect Tax Recovery Rate (ITRR) is used to gauge the economic value
  created or preserved. It is defined as Recoverable Indirect Taxes Claimed / Eligible Amounts; the result
  is stated in percent (%). It is applied across virtually every sector. It bridges daily operations and
  executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
