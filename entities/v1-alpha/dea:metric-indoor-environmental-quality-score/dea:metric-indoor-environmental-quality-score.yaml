id: dea:metric-indoor-environmental-quality-score
name: Indoor Environmental Quality Score
type: Metric
description: Indoor Environmental Quality Score (IEQS) addresses the quality of outputs and outcomes and
  is a fixture of facility management & workplace (deep dive) reporting. It is computed as Composite Air,
  Light, Acoustics and Comfort Score, expressed in index (0-100 or normalized). It is applied across virtually
  every sector. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It should be maximized within the limits of cost and quality trade-offs.
