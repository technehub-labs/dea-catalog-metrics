id: dea:metric-l-d-investment-per-employee
name: L&D Investment per Employee
type: Metric
description: L&D Investment per Employee (LDIPE) captures the economic value created or preserved for
  organizations tracking learning & development effectiveness (deep dive). It is defined as Annual L&D
  Spend / Employees; the result is stated in currency per unit. It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Values
  outside the intended band, on either side, warrant investigation.
