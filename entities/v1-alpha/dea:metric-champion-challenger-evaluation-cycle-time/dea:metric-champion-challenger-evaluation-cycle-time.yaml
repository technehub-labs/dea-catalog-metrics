id: dea:metric-champion-challenger-evaluation-cycle-time
name: Champion-Challenger Evaluation Cycle Time
type: Metric
description: Champion-Challenger Evaluation Cycle Time (CCECT) addresses how efficiently resources are
  converted into outputs and is a fixture of mlops & model lifecycle operations reporting. It is computed
  as Days to Complete Champion-Challenger Evaluation, expressed in days. It is applied across virtually
  every sector. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  Reduction is the goal, and sustained decreases indicate successful intervention.
