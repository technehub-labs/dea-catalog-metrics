id: dea:metric-rights-cost-per-viewing-hour
name: Rights Cost per Viewing Hour
type: Metric
description: Rights Cost per Viewing Hour (RCPH) captures how efficiently resources are converted into
  outputs for organizations tracking media & entertainment. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. It is defined as Content Rights Cost /
  Total Viewing Hours; the result is stated in currency per unit. It should be driven down, since lower
  readings signal healthier performance. In Media & entertainment, it is a recognized element of the standard
  performance toolkit.
abbreviation: RCPH
unit: currency
