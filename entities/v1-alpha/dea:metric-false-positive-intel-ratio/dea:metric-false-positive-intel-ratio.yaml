id: dea:metric-false-positive-intel-ratio
name: False Positive Intel Ratio
type: Metric
description: 'A Threat Intelligence & Red Team indicator, False Positive Intel Ratio (FPIR) quantifies
  the quality of outputs and outcomes. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is Intel Items Disproven / Items Actioned - reported
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: FPIR
unit: percent
