id: dea:metric-location-profitability-ratio
name: Location Profitability Ratio
type: Metric
description: 'Location Profitability Ratio (LPR) addresses the economic value created or preserved and
  is a fixture of franchise & multi-site reporting. It is computed as Profitable Locations / Total Locations,
  expressed in percent (%). Its use is concentrated in Franchise & multi-site. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
abbreviation: LPR
unit: percent
version: 1.1.0
lifecycle_status: candidate
