id: dea:metric-process-safety-incidents-chemicals
name: Process Safety Incidents (Chemicals)
type: Metric
description: Process Safety Incidents (Chemicals) (PSIC) measures exposure to adverse outcomes in the
  Chemicals domain. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It is defined as Tier 1 and Tier 2 Process Safety Events per Period; the result is stated in
  count (items per period). It should be driven down, since lower readings signal healthier performance.
  In Chemicals, it is a recognized element of the standard performance toolkit.
