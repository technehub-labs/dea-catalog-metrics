id: dea:metric-security-incident-recurrence-rate
name: Security Incident Recurrence Rate
type: Metric
description: 'Security Incident Recurrence Rate (SIRR-SOC) captures the quality of outputs and outcomes
  for organizations tracking secops & security operations center. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Incidents Repeating
  Same Root Cause / Incidents, expressed in percent (%). It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
