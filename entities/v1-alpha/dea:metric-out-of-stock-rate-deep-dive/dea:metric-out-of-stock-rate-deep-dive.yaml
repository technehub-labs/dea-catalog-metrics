id: dea:metric-out-of-stock-rate-deep-dive
name: Out-of-Stock Rate (Deep Dive)
type: Metric
description: Out-of-Stock Rate (Deep Dive) (OOSDD) captures the quality of outputs and outcomes for organizations
  tracking retail standard measures. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as SKU-Location Days Out of Stock / SKU-Location Days, expressed
  in percent (%). It should be driven down, since lower readings signal healthier performance. Its use
  is concentrated in Retail & E-commerce.
abbreviation: OOSDD
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
