id: dea:metric-delegation-of-authority-compliance
name: Delegation of Authority Compliance
type: Metric
description: Delegation of Authority Compliance (DOAC-GOV) measures conformance to standards, plans, or
  obligations in the Enterprise Decision Effectiveness & Governance Monitoring domain. Its calculation
  is Decisions within Approved Authority / Sampled Decisions, measured in percent (%). It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Higher values are
  better; gains are read as improvement and losses as deterioration. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.
abbreviation: DOAC-GOV
