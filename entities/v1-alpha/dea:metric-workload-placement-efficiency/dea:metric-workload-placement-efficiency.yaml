id: dea:metric-workload-placement-efficiency
name: Workload Placement Efficiency
type: Metric
description: Workload Placement Efficiency (WPE) addresses how efficiently resources are converted into
  outputs and is a fixture of data centers & cloud infrastructure reporting. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Workloads
  on Optimal Tier / Workloads, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Technology practice.
