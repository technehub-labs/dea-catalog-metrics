id: dea:metric-sanding-rework-rate
name: Sanding Rework Rate
type: Metric
description: Sanding Rework Rate (SRR-F) measures the quality of outputs and outcomes in the Furniture
  & Wood Products domain. It is computed as Items Requiring Sanding Rework / Items, expressed in percent
  (%). Its use is concentrated in Manufacturing. Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: SRR-F
unit: percent
