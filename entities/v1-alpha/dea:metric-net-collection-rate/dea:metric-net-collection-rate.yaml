id: dea:metric-net-collection-rate
name: Net Collection Rate
type: Metric
description: A Healthcare Revenue Cycle indicator, Net Collection Rate (NCR-H) quantifies the economic
  value created or preserved. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Payments Received / Charges Billable at Contracted Rates - reported in percent
  (%). Improvement means raising this figure toward best-in-class levels. It is a standard measure in
  the Healthcare sector.
