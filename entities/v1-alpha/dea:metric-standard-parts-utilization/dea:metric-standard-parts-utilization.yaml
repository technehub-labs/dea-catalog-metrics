id: dea:metric-standard-parts-utilization
name: Standard Parts Utilization
type: Metric
description: Standard Parts Utilization (SPU) measures how efficiently resources are converted into outputs
  in the Engineering & Design domain. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Standard or Catalog Parts / Total Parts - reported in
  percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: SPU
unit: percent
