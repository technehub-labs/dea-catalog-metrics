id: dea:metric-process-standardization-prerequisite-rate
name: Process Standardization Prerequisite Rate
type: Metric
description: A Automation & Robotic Process Automation indicator, Process Standardization Prerequisite
  Rate (PSPR) quantifies conformance to standards, plans, or obligations. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It is defined as Processes
  Standardized before Automation / Processes Automated; the result is stated in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
