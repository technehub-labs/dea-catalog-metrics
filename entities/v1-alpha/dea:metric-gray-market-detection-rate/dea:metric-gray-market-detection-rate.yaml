id: dea:metric-gray-market-detection-rate
name: Gray Market Detection Rate
type: Metric
description: 'Within Channel & Distribution Management, Gray Market Detection Rate (GMDR) is used to gauge
  exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Unauthorized Channel Incidents Confirmed / Investigated,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
