id: dea:metric-visual-management-board-effectiveness
name: Visual Management Board Effectiveness
type: Metric
description: 'Visual Management Board Effectiveness (VMBE) measures conformance to standards, plans, or
  obligations in the Process Excellence (Lean Six Sigma) domain. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. The formula is Boards Reviewed at Required Cadence
  / Boards Deployed - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: VMBE
unit: percent
