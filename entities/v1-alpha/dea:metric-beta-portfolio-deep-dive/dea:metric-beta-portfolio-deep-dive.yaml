id: dea:metric-beta-portfolio-deep-dive
name: Beta (Portfolio) (Deep Dive)
type: Metric
description: 'Beta (Portfolio) (Deep Dive) (BTPDD) measures exposure to adverse outcomes in the Investment
  Performance Measurement domain. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Covariance with Market / Market Variance, expressed
  in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Its use is concentrated in Investment management.'
abbreviation: BTPDD
unit: ratio
version: 1.1.0
