id: dea:metric-sprint-goal-success-rate-deep-dive
name: Sprint Goal Success Rate (Deep Dive)
type: Metric
description: Sprint Goal Success Rate (Deep Dive) (SGSR-AG) measures how effectively a process or entity
  achieves its intended outcome in the Agile Delivery & Team Effectiveness domain. Its calculation is
  Sprint Goals Achieved / Sprints, measured in percent (%). It is applied across virtually every sector.
  Its value drives prioritization and resource reallocation among competing initiatives. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: SGSR-AG
unit: percent
