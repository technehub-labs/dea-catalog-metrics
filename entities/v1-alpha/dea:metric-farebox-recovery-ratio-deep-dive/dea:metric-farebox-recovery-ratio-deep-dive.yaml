id: dea:metric-farebox-recovery-ratio-deep-dive
name: Farebox Recovery Ratio (Deep Dive)
type: Metric
description: Farebox Recovery Ratio (Deep Dive) (FRR-D) captures the economic value created or preserved
  for organizations tracking public transit (deep dive). It is defined as Fare Revenue / Operating Cost;
  the result is stated in percent (%). In Public Transit, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
