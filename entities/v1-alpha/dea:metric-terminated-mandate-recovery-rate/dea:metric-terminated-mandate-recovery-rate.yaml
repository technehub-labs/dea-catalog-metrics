id: dea:metric-terminated-mandate-recovery-rate
name: Terminated Mandate Recovery Rate
type: Metric
description: 'A Asset & Wealth Management (Deep Dive) indicator, Terminated Mandate Recovery Rate (TMRR)
  quantifies the retention of customers, users, or assets over time. It is computed as Won-Back Mandates
  / Terminated Mandates, expressed in percent (%). Its use is concentrated in Financial Services. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. It
  should be maximized within the limits of cost and quality trade-offs.'
abbreviation: TMRR
unit: percent
