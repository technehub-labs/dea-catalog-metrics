id: dea:metric-rebalancing-policy-adherence
name: Rebalancing Policy Adherence
type: Metric
description: Rebalancing Policy Adherence (RPA-W) captures conformance to standards, plans, or obligations
  for organizations tracking asset & wealth management (deep dive). Its calculation is Rebalances per
  Policy / Rebalancing Triggers, measured in percent (%). It originates from and is most used in Financial
  Services practice. Its value drives prioritization and resource reallocation among competing initiatives.
  It should be maximized within the limits of cost and quality trade-offs.
