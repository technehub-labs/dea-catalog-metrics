id: dea:metric-attraction-downtime-ratio
name: Attraction Downtime Ratio
type: Metric
description: 'Attraction Downtime Ratio (ADR-V) measures the utilization or availability of capacity in
  the Entertainment Venues & Attractions domain. The formula is Ride or Exhibit Downtime / Operating Hours
  - reported in percent (%). It is a standard measure in the Media & Entertainment sector. It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
abbreviation: ADR-V
unit: percent
version: 1.1.0
