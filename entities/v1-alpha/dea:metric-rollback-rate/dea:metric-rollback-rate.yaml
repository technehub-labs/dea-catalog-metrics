id: dea:metric-rollback-rate
name: Rollback Rate
type: Metric
description: Rollback Rate (RBR-CD) captures exposure to adverse outcomes for organizations tracking continuous
  delivery & deployment. It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. It is defined as Deployments Rolled Back / Deployments; the result is stated
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: RBR-CD
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
