id: dea:metric-maintenance-defect-closure-rate
name: Maintenance Defect Closure Rate
type: Metric
description: 'Maintenance Defect Closure Rate (MDCR) captures the quality of outputs and outcomes for
  organizations tracking aviation maintenance repair & overhaul. The formula is Deferred Defects Closed
  within Limit / Defects - reported in percent (%). It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Airlines & aviation sector.'
