id: dea:metric-streaming-churn-rate-deep-dive
name: Streaming Churn Rate (Deep Dive)
type: Metric
description: Within Broadcasting & Streaming Media, Streaming Churn Rate (Deep Dive) (SCR-S) is used to
  gauge the retention of customers, users, or assets over time. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Cancelled Subscriptions / Subscribers
  - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Media & Entertainment sector.
abbreviation: SCR-S
unit: percent
