id: dea:metric-contract-sla-attainment-cleaning
name: Contract SLA Attainment (Cleaning)
type: Metric
description: 'Contract SLA Attainment (Cleaning) (CSLA-C) measures conformance to standards, plans, or
  obligations in the Cleaning & Environmental Services domain. The formula is SLAs Met / SLAs Measured
  - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. Higher values are better; gains are read as improvement and losses as deterioration.
  It is a standard measure in the Facility Services sector.'
