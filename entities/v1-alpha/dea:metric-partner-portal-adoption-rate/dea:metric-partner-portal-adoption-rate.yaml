id: dea:metric-partner-portal-adoption-rate
name: Partner Portal Adoption Rate
type: Metric
description: 'Partner Portal Adoption Rate (PPA-AP) measures the engagement or satisfaction of the people
  involved in the Alliances & Partnerships Management domain. It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Active Partner Users / Registered Partner Users;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
