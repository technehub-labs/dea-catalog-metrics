id: dea:metric-partial-settlement-rate
name: Partial Settlement Rate
type: Metric
description: 'Partial Settlement Rate (PSR-C) addresses exposure to adverse outcomes and is a fixture
  of insurance claims deep dive reporting. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Claims Partially Settled then Closed / Claims; the result is
  stated in percent (%). It should be driven down, since lower readings signal healthier performance.
  In Insurance, it is a recognized element of the standard performance toolkit.'
