id: dea:metric-contract-compliance-to-negotiated-terms
name: Contract Compliance to Negotiated Terms
type: Metric
description: 'Contract Compliance to Negotiated Terms (CCNT) addresses conformance to standards, plans,
  or obligations and is a fixture of strategic sourcing & supplier performance (deep dive) reporting.
  The formula is Invoices Matching Contract Price / Invoices Sampled - reported in percent (%). It is
  applied across virtually every sector. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. It should be maximized within the limits of cost and quality trade-offs.'
