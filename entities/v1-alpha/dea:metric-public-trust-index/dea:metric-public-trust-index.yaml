id: dea:metric-public-trust-index
name: Public Trust Index
type: Metric
description: A Government & Public Administration indicator, Public Trust Index (PTI) quantifies the engagement
  or satisfaction of the people involved. The formula is Composite Trust Survey Score - reported in index
  (0-100 or normalized). It is a standard measure in the Public Sector sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
