name: Time to Productivity - New Hires (Deep Dive)
type: Metric
description: Within Balanced Scorecard - Learning & Growth Perspective, Time to Productivity - New Hires
  (Deep Dive) (TTP-D2) is used to gauge how efficiently resources are converted into outputs. Its calculation
  is Days to Reach Full Productivity, measured in days. It is applied across virtually every sector. Its
  value drives prioritization and resource reallocation among competing initiatives. Reduction is the
  goal, and sustained decreases indicate successful intervention.
