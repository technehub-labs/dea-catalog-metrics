id: dea:metric-target-price-accuracy-band
name: Target Price Accuracy Band
type: Metric
description: 'A Investment Research & Trading Operations indicator, Target Price Accuracy Band (TPAB)
  quantifies the quality of outputs and outcomes. It is computed as Actual Prices within Target Band /
  Targets Sampled, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is concentrated in Financial Services.'
