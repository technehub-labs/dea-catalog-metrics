id: dea:metric-labeling-accuracy-rate-food
name: Labeling Accuracy Rate (Food)
type: Metric
description: Labeling Accuracy Rate (Food) (LAR-F) addresses conformance to standards, plans, or obligations
  and is a fixture of food & beverage manufacturing reporting. It is computed as Labels Matching Specification
  / Labels Sampled, expressed in percent (%). Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is concentrated in Food & Beverage.
