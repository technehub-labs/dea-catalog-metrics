id: dea:metric-percent-complete-planned-vs-actual-deep-dive
name: Percent Complete Planned vs Actual (Deep Dive)
type: Metric
description: 'Percent Complete Planned vs Actual (Deep Dive) (PCPA-D) captures conformance to standards,
  plans, or obligations for organizations tracking construction contracting (deep dive). It is computed
  as Actual Percent Complete - Planned Percent Complete, expressed in percent (%). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is managed toward a defined
  target band rather than an extreme - both overshoot and undershoot can signal problems. Its use is concentrated
  in Construction.'
