id: dea:metric-successor-readiness-ratio
name: Successor Readiness Ratio
type: Metric
description: Successor Readiness Ratio (SRR-W) captures exposure to adverse outcomes for organizations
  tracking workforce planning & analytics. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. The formula is Ready-Now Successors / Critical Roles - reported
  in ratio (x:1 or x). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
