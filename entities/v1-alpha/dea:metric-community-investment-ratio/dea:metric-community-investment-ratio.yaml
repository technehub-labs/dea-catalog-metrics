id: dea:metric-community-investment-ratio
name: Community Investment Ratio
type: Metric
description: A Sustainability & ESG indicator, Community Investment Ratio (CIR2) quantifies the economic
  value created or preserved. Its calculation is Community Investment Spend / Pre-Tax Profit, measured
  in percent (%). It is applied across virtually every sector. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Values outside the intended band,
  on either side, warrant investigation.
