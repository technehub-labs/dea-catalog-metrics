id: dea:metric-flaring-intensity-deep-dive
name: Flaring Intensity (Deep Dive)
type: Metric
description: Flaring Intensity (Deep Dive) (FI-OG) captures environmental and social sustainability performance
  for organizations tracking oil & gas downstream & refining. The formula is Flared Volume / Throughput
  - reported in ratio (x:1 or x). It is a standard measure in the Oil & Gas sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction is the
  goal, and sustained decreases indicate successful intervention.
abbreviation: FI-OG
