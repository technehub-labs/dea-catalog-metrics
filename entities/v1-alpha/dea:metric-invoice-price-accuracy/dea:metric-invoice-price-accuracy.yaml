id: dea:metric-invoice-price-accuracy
name: Invoice Price Accuracy
type: Metric
description: 'Invoice Price Accuracy (IPA) measures the quality of outputs and outcomes in the Pricing
  & Revenue Management domain. The formula is Invoices Billed at Approved Price / Invoices - reported
  in percent (%). It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Higher values are better; gains are read as improvement and losses as deterioration. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.'
