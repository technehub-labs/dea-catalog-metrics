id: dea:metric-contribution-margin-per-unit-deep-dive
name: Contribution Margin per Unit (Deep Dive)
type: Metric
description: Within Unit Economics & Growth (Deep Dive), Contribution Margin per Unit (Deep Dive) (CMPUD)
  is used to gauge the economic value created or preserved. Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. It is computed as (Price - Variable Cost)
  per Unit, expressed in currency per unit. Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Software.
