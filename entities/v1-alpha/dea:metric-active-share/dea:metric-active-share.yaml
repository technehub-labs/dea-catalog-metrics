id: dea:metric-active-share
name: Active Share
type: Metric
description: Within Investment Management - Portfolio Operations, Active Share (ACTSH) is used to gauge
  exposure to adverse outcomes. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Non-Overlapping Portfolio Weight / Total, measured
  in percent (%). The objective is neither maximization nor minimization but staying within an agreed
  operating band. It originates from and is most used in Financial Services practice.
abbreviation: ACTSH
unit: percent
