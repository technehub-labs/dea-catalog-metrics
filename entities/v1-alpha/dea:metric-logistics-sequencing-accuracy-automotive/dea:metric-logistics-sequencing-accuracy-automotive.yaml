id: dea:metric-logistics-sequencing-accuracy-automotive
name: Logistics Sequencing Accuracy (Automotive)
type: Metric
description: Logistics Sequencing Accuracy (Automotive) (LSA) addresses the quality of outputs and outcomes
  and is a fixture of automotive manufacturing (deep dive) reporting. It is computed as Sequenced Deliveries
  Correct / Deliveries, expressed in percent (%). Its use is concentrated in Automotive. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: LSA
unit: percent
