id: dea:metric-design-reuse-rate
name: Design Reuse Rate
type: Metric
description: 'Within Engineering & Design, Design Reuse Rate (DRR-E) is used to gauge how efficiently
  resources are converted into outputs. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Reused Components or Modules / Total Components,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: DRR-E
unit: percent
