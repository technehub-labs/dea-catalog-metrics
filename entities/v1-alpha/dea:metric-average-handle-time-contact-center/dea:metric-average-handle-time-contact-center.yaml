id: dea:metric-average-handle-time-contact-center
name: Average Handle Time (Contact Center)
type: Metric
description: Average Handle Time (Contact Center) (AHTDD) captures how efficiently resources are converted
  into outputs for organizations tracking contact center standard measures (deep dive). It is computed
  as Talk + Hold + After-Call Work per Contact, expressed in minutes. It is applied across virtually every
  sector. Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  Values outside the intended band, on either side, warrant investigation.
