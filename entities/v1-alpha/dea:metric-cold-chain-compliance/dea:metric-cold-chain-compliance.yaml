id: dea:metric-cold-chain-compliance
name: Cold Chain Compliance
type: Metric
description: Cold Chain Compliance (CCC-F) addresses the quality of outputs and outcomes and is a fixture
  of agriculture & food processing reporting. It is computed as Shipments within Temperature Range / Shipments
  Monitored, expressed in percent (%). It is reviewed at cadence by planning owners to correct course
  before issues become strategic. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is concentrated in Agriculture & food.
abbreviation: CCC-F
unit: percent
