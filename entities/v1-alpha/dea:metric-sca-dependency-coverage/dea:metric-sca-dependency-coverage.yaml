id: dea:metric-sca-dependency-coverage
name: SCA Dependency Coverage
type: Metric
description: SCA Dependency Coverage (SCADC) measures exposure to adverse outcomes in the Application
  Security (AppSec) domain. It is computed as Projects with Dependency Scanning / Projects, expressed
  in percent (%). Its use is concentrated in Software. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It should be maximized within the limits of cost
  and quality trade-offs.
