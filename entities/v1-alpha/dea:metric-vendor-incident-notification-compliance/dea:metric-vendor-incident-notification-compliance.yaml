id: dea:metric-vendor-incident-notification-compliance
name: Vendor Incident Notification Compliance
type: Metric
description: 'A Third-Party Risk Management indicator, Vendor Incident Notification Compliance (VINC)
  quantifies exposure to adverse outcomes. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Vendor Breaches Notified per Contract Terms
  / Breaches, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
