id: dea:metric-pesticide-residue-compliance
name: Pesticide Residue Compliance
type: Metric
description: 'Pesticide Residue Compliance (PRC-A) measures conformance to standards, plans, or obligations
  in the Agriculture & Agronomy (Deep Dive) domain. It is computed as Samples within MRL / Samples Tested,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Agriculture.'
