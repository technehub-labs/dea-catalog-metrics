id: dea:metric-remediation-ticket-cycle-time
name: Remediation Ticket Cycle Time
type: Metric
description: 'Remediation Ticket Cycle Time (RTCVM) captures how efficiently resources are converted into
  outputs for organizations tracking vulnerability & exposure management. It is defined as Days from Finding
  to Ticket Closure; the result is stated in days. It is a working-level control: thresholds trigger immediate
  operational response. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
