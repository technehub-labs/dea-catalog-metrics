id: dea:metric-incident-resolution-satisfaction-score
name: Incident Resolution Satisfaction Score
type: Metric
description: Incident Resolution Satisfaction Score (IRSS-IT) measures the engagement or satisfaction
  of the people involved in the IT Incident & Major Problem Management domain. It is defined as User CSAT
  after Incident Resolution; the result is stated in score (points). It is applied across virtually every
  sector. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
