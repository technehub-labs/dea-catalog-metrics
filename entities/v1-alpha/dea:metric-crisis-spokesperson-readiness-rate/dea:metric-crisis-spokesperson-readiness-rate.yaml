id: dea:metric-crisis-spokesperson-readiness-rate
name: Crisis Spokesperson Readiness Rate
type: Metric
description: Within Crisis Management & Emergency Response, Crisis Spokesperson Readiness Rate (CSRR)
  is used to gauge capability maturity or development. Its calculation is Trained and Current Spokespersons
  / Designated Spokespersons, measured in percent (%). It is applied across virtually every sector. Its
  value drives prioritization and resource reallocation among competing initiatives. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: CSRR
unit: percent
version: 1.1.0
