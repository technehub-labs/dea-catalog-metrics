id: dea:metric-badge-audit-completion-rate
name: Badge Audit Completion Rate
type: Metric
description: Within Physical Security Operations, Badge Audit Completion Rate (BACR) is used to gauge
  conformance to standards, plans, or obligations. It is computed as Access Reviews Completed / Reviews
  Scheduled, expressed in percent (%). It is applied across virtually every sector. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
