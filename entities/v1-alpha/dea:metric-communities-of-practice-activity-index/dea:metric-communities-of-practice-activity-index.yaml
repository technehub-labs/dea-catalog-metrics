id: dea:metric-communities-of-practice-activity-index
name: Communities of Practice Activity Index
type: Metric
description: Within Knowledge Management (Deep Dive), Communities of Practice Activity Index (COPI) is
  used to gauge the engagement or satisfaction of the people involved. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Composite of Participation
  and Contribution per Community, expressed in index (0-100 or normalized). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: COPI
