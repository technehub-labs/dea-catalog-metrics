id: dea:metric-design-debt-backlog-ratio
name: Design Debt Backlog Ratio
type: Metric
description: Design Debt Backlog Ratio (DDBR-UX) captures the quality of outputs and outcomes for organizations
  tracking ux & design systems. Its calculation is Design Debt Items / Total Design Backlog Items, measured
  in percent (%). Its value drives prioritization and resource reallocation among competing initiatives.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
