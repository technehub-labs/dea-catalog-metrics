id: dea:metric-fraud-model-coverage
name: Fraud Model Coverage
type: Metric
description: Fraud Model Coverage (FMC-EF) addresses exposure to adverse outcomes and is a fixture of
  enterprise fraud & financial crime management reporting. The formula is Transaction Channels Monitored
  by Fraud Models / Channels - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
