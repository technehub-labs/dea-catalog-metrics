id: dea:metric-feature-importance-stability
name: Feature Importance Stability
type: Metric
description: 'Within Statistical Model Performance Diagnostics, Feature Importance Stability (FIIMP) is
  used to gauge the quality of outputs and outcomes. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Rank Correlation of Feature Importances
  across Retrains - reported in index (0-100 or normalized). Improvement means raising this figure toward
  best-in-class levels. It is a standard measure in the Software sector.'
