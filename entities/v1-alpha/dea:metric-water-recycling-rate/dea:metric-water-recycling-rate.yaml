id: dea:metric-water-recycling-rate
name: Water Recycling Rate
type: Metric
description: Water Recycling Rate (WRR) captures environmental and social sustainability performance for
  organizations tracking sustainability & esg. Its calculation is Recycled or Reused Water / Total Water
  Withdrawn, measured in percent (%). Its value drives prioritization and resource reallocation among
  competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: WRR
unit: percent
