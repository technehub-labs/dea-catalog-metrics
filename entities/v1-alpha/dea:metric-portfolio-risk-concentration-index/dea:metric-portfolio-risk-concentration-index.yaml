id: dea:metric-portfolio-risk-concentration-index
name: Portfolio Risk Concentration Index
type: Metric
description: 'Portfolio Risk Concentration Index (PRCI-PPM) measures exposure to adverse outcomes in the
  Program & Portfolio Management domain. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Concentration of Investment in Single Risk
  Classes, expressed in index (0-100 or normalized). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
