id: dea:metric-access-control-compliance
name: Access Control Compliance
type: Metric
description: Access Control Compliance (ACC-P) captures conformance to standards, plans, or obligations
  for organizations tracking physical security operations. It is computed as Access Events per Policy
  / Access Events Audited, expressed in percent (%). It is applied across virtually every sector. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: ACC-P
unit: percent
