id: dea:metric-first-time-through-rate-automotive
name: First Time Through Rate (Automotive)
type: Metric
description: First Time Through Rate (Automotive) (FTT-A) addresses the quality of outputs and outcomes
  and is a fixture of automotive reporting. It is computed as Vehicles Passing All Inspections without
  Rework / Vehicles Produced, expressed in percent (%). It is reviewed at cadence by planning owners to
  correct course before issues become strategic. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is concentrated in Automotive.
abbreviation: FTT-A
unit: percent
