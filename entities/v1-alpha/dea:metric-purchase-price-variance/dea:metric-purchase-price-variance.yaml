id: dea:metric-purchase-price-variance
name: Purchase Price Variance
type: Metric
description: 'Purchase Price Variance (PPV) measures the economic value created or preserved in the Procurement
  domain. It guides mid-horizon planning: portfolio, program, and function owners act on it between review
  cycles. The formula is (Actual Price - Standard Price) x Quantity Purchased - reported in currency value.
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
abbreviation: PPV
unit: currency
version: 1.1.0
