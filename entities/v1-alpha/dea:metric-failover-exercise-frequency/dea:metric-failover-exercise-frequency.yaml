id: dea:metric-failover-exercise-frequency
name: Failover Exercise Frequency
type: Metric
description: A Business Continuity & Disaster Recovery indicator, Failover Exercise Frequency (FEF-BC)
  quantifies capability maturity or development. It is computed as Failover Exercises Completed per Year,
  expressed in count (items per period). It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is managed toward a defined target band rather than an extreme -
  both overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: FEF-BC
