id: dea:metric-restatement-rate-esg-disclosures
name: Restatement Rate (ESG Disclosures)
type: Metric
description: 'A Environmental, Social & Governance Reporting indicator, Restatement Rate (ESG Disclosures)
  (RRESD) quantifies the quality of outputs and outcomes. It is computed as Restated Disclosures / Disclosures,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
