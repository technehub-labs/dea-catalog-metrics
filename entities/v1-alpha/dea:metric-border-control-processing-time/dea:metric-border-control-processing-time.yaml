id: dea:metric-border-control-processing-time
name: Border Control Processing Time
type: Metric
description: 'A Airport Operations (Deep Dive) indicator, Border Control Processing Time (BCPT) quantifies
  how efficiently resources are converted into outputs. It is monitored close to the work: teams act on
  it within a shift, sprint, or daily review. The formula is Minutes to Process Passenger - reported in
  minutes. It should be driven down, since lower readings signal healthier performance. It is a standard
  measure in the Aviation sector.'
