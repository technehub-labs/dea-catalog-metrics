id: dea:metric-focus-time-share
name: Focus Time Share
type: Metric
description: Within Digital Workplace & Collaboration, Focus Time Share (FTS-DW) is used to gauge the
  utilization or availability of capacity. It is defined as Non-Meeting Work Time / Total Working Time;
  the result is stated in percent (%). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: FTS-DW
unit: percent
