id: dea:metric-model-retraining-automation-rate
name: Model Retraining Automation Rate
type: Metric
description: A MLOps & Model Lifecycle Operations indicator, Model Retraining Automation Rate (MRAR) quantifies
  capability maturity or development. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Automated Retraining Workflows / Retraining Workflows,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
