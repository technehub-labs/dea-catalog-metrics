id: dea:metric-regulatory-barrier-exposure-score
name: Regulatory Barrier Exposure Score
type: Metric
description: 'Regulatory Barrier Exposure Score (RBES) captures exposure to adverse outcomes for organizations
  tracking market structure & economics standard measures. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as Weighted Exposure of Market
  Strategy to Regulatory Constraints, expressed in score (points). It should be driven down, since lower
  readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
