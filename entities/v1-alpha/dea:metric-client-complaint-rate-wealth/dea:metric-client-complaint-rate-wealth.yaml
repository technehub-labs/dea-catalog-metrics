id: dea:metric-client-complaint-rate-wealth
name: Client Complaint Rate (Wealth)
type: Metric
description: 'A Wealth Management indicator, Client Complaint Rate (Wealth) (CCR-W) quantifies the quality
  of outputs and outcomes. It is computed as Complaints / 1,000 Client Relationships, expressed in events
  per thousand or million (scaled). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is
  concentrated in Wealth management.'
