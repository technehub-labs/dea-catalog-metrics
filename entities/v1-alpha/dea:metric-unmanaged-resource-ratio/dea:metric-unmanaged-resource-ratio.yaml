id: dea:metric-unmanaged-resource-ratio
name: Unmanaged Resource Ratio
type: Metric
description: 'Within Cloud Security Posture Management, Unmanaged Resource Ratio (URR-CS) is used to gauge
  governance. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  The formula is Resources without Tagged Owner / Resources - reported in percent (%). It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.'
