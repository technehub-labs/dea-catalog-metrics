description: 'Process First-Pass Yield Trend (Deep Dive) (FPYT-D) captures the quality of outputs and
  outcomes for organizations tracking balanced scorecard - internal process perspective. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Change in First-Pass Yield between Periods, expressed in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
