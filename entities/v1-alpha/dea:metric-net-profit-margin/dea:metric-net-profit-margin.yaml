id: dea:metric-net-profit-margin
name: Net Profit Margin
type: Metric
description: Net Profit Margin (NPM) captures the economic value created or preserved for organizations
  tracking finance & accounting. The formula is Net Income / Revenue - reported in percent (%). It is
  applied across virtually every sector. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: NPM
unit: percent
