id: dea:metric-raw-mill-utilization
name: Raw Mill Utilization
type: Metric
description: Raw Mill Utilization (RMU-C) addresses the utilization or availability of capacity and is
  a fixture of cement & building materials reporting. It is computed as Raw Mill Operating Time / Available
  Time, expressed in percent (%). Its use is concentrated in Manufacturing. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: RMU-C
unit: percent
