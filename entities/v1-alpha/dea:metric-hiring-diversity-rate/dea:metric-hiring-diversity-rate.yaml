id: dea:metric-hiring-diversity-rate
name: Hiring Diversity Rate
type: Metric
description: 'Hiring Diversity Rate (HDR-D) captures conformance to standards, plans, or obligations for
  organizations tracking diversity, equity & inclusion. It is computed as Diverse Hires / Total Hires,
  expressed in percent (%). It is applied across virtually every sector. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It should be maximized within the
  limits of cost and quality trade-offs.'
abbreviation: HDR-D
unit: percent
