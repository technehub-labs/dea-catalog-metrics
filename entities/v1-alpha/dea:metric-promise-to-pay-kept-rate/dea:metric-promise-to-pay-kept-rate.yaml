id: dea:metric-promise-to-pay-kept-rate
name: Promise-to-Pay Kept Rate
type: Metric
description: Promise-to-Pay Kept Rate (PPKR) measures the quality of outputs and outcomes in the Banking
  Retail Lending (Deep Dive) domain. It is computed as Promises Honored / Promises Made, expressed in
  percent (%). Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is concentrated in Banking.
abbreviation: PPKR
unit: percent
