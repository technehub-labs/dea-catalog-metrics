id: dea:metric-artifact-build-reproducibility-rate
name: Artifact Build Reproducibility Rate
type: Metric
description: 'Artifact Build Reproducibility Rate (ABRR-CI) addresses the quality of outputs and outcomes
  and is a fixture of continuous integration reporting. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Builds Producing Identical Artifacts
  from Same Input / Sampled, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: ABRR-CI
unit: percent
