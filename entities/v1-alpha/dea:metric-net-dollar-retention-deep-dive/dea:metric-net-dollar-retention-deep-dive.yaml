id: dea:metric-net-dollar-retention-deep-dive
name: Net Dollar Retention (Deep Dive)
type: Metric
description: 'Net Dollar Retention (Deep Dive) (NDRD) measures the retention of customers, users, or assets
  over time in the Unit Economics & Growth (Deep Dive) domain. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. It is computed as Cohort Revenue Now
  / Same Cohort Prior Period, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Software.'
abbreviation: NDRD
unit: percent
version: 1.1.0
lifecycle_status: candidate
