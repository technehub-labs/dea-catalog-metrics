id: dea:metric-passenger-repeat-rate-cruise
name: Passenger Repeat Rate (Cruise)
type: Metric
description: Passenger Repeat Rate (Cruise) (PRR-C) measures the retention of customers, users, or assets
  over time in the Cruise & Passenger Shipping domain. Its calculation is Repeat Passengers / Passengers,
  measured in percent (%). It originates from and is most used in Hospitality practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: PRR-C
unit: percent
version: 1.1.0
