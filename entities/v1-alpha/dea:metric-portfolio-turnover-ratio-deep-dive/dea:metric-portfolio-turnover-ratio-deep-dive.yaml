id: dea:metric-portfolio-turnover-ratio-deep-dive
name: Portfolio Turnover Ratio (Deep Dive)
type: Metric
description: Within Asset & Wealth Management (Deep Dive), Portfolio Turnover Ratio (Deep Dive) (PTR-D)
  is used to gauge how efficiently resources are converted into outputs. Its calculation is Min(Purchases,
  Sales) / Average AUM, measured in percent (%). It originates from and is most used in Financial Services
  practice. Its value drives prioritization and resource reallocation among competing initiatives. Values
  outside the intended band, on either side, warrant investigation.
