id: dea:metric-marketing-campaign-roi
name: Marketing Campaign ROI
type: Metric
description: Marketing Campaign ROI (MROI) captures the economic value created or preserved for organizations
  tracking marketing. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is computed as (Campaign Revenue - Campaign Cost) / Campaign Cost, expressed in percent
  (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
abbreviation: MROI
unit: percent
