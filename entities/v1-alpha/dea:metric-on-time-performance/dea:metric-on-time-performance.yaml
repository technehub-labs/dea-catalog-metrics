id: dea:metric-on-time-performance
name: On-Time Performance
type: Metric
description: A Airlines & Aviation indicator, On-Time Performance (OTP) quantifies the quality of outputs
  and outcomes. The formula is Flights Departing within Threshold of Schedule / Total Flights - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Airlines & aviation sector.
abbreviation: OTP
unit: percent
