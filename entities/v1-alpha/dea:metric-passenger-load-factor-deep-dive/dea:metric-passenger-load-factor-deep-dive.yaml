id: dea:metric-passenger-load-factor-deep-dive
name: Passenger Load Factor (Deep Dive)
type: Metric
description: Passenger Load Factor (Deep Dive) (PLFDD) measures how efficiently resources are converted
  into outputs in the Airline & Transportation Standard Measures (Deep Dive) domain. It is defined as
  Revenue Passenger Kilometers / Available Seat Kilometers; the result is stated in percent (%). Its trend
  is watched by senior leadership as an early signal of structural performance shifts. Higher values are
  better; gains are read as improvement and losses as deterioration. In Airlines & Aviation, it is a recognized
  element of the standard performance toolkit.
abbreviation: PLFDD
unit: percent
