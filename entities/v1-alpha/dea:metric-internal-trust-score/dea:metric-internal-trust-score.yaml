id: dea:metric-internal-trust-score
name: Internal Trust Score
type: Metric
description: A Culture & Employee Experience indicator, Internal Trust Score (ITS) quantifies the engagement
  or satisfaction of the people involved. The formula is Average Trust in Leadership Survey Rating - reported
  in score (points). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
