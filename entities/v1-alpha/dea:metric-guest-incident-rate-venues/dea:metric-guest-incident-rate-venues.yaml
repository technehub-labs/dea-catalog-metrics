id: dea:metric-guest-incident-rate-venues
name: Guest Incident Rate (Venues)
type: Metric
description: Within Entertainment Venues & Attractions, Guest Incident Rate (Venues) (GIR-V) is used to
  gauge exposure to adverse outcomes. The formula is Reportable Guest Incidents / Attendance - reported
  in events per thousand or million (scaled). It is a standard measure in the Media & Entertainment sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Reduction is the goal, and sustained decreases indicate successful intervention.
