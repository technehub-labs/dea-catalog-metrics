id: dea:metric-lost-time-injury-frequency-rate
name: Lost Time Injury Frequency Rate
type: Metric
description: 'Lost Time Injury Frequency Rate (LTIFR) addresses exposure to adverse outcomes and is a
  fixture of health & safety reporting. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as (Lost Time Injuries x 1,000,000) / Total
  Hours Worked, expressed in events per thousand or million (scaled). It should be driven down, since
  lower readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: LTIFR
unit: event
