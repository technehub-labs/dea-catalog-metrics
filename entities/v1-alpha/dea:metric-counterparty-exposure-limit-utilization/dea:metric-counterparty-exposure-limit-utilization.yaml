id: dea:metric-counterparty-exposure-limit-utilization
name: Counterparty Exposure Limit Utilization
type: Metric
description: Counterparty Exposure Limit Utilization (CELU) measures exposure to adverse outcomes in the
  Treasury & Cash Management domain. It is computed as Exposure to Counterparty / Approved Limit, expressed
  in percent (%). It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: CELU
unit: percent
