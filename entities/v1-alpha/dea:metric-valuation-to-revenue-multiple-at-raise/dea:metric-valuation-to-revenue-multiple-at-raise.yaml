id: dea:metric-valuation-to-revenue-multiple-at-raise
name: Valuation-to-Revenue Multiple at Raise
type: Metric
description: Valuation-to-Revenue Multiple at Raise (VRMR) addresses the economic value created or preserved
  and is a fixture of startup & venture-backed business reporting. Its calculation is Post-Money Valuation
  / Trailing Revenue, measured in ratio (x:1 or x). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. Values
  outside the intended band, on either side, warrant investigation.
