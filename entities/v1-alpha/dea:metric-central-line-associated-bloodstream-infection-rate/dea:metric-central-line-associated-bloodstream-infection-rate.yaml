id: dea:metric-central-line-associated-bloodstream-infection-rate
name: Central Line-Associated Bloodstream Infection Rate
type: Metric
description: A Healthcare Quality & Patient Safety Standard Measures indicator, Central Line-Associated
  Bloodstream Infection Rate (CLABSI) quantifies exposure to adverse outcomes. The formula is CLABSI Events
  / 1,000 Central Line Days - reported in events per thousand or million (scaled). It is a standard measure
  in the Healthcare sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Reduction is the goal, and sustained decreases indicate successful intervention.
