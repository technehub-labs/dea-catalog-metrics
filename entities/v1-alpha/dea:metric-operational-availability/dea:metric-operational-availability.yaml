id: dea:metric-operational-availability
name: Operational Availability
type: Metric
description: Operational Availability (OPAVL) addresses the quality of outputs and outcomes and is a fixture
  of reliability & maintainability engineering (deep dive) reporting. Its calculation is Uptime / (Uptime
  + Downtime all Causes), measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: OPAVL
unit: percent
version: 1.0.0
lifecycle_status: candidate
