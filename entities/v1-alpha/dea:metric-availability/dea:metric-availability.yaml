id: dea:metric-availability
name: Availability
type: Metric
description: 'Availability (AVL) measures the utilization or availability of capacity in the Maintenance
  & Reliability domain. The formula is Uptime / (Uptime + Downtime) - reported in percent (%). It is a
  standard measure in the Manufacturing sector. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. It should be maximized within the limits of cost and
  quality trade-offs.'
