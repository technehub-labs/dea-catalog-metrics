id: dea:metric-channel-forecast-accuracy
name: Channel Forecast Accuracy
type: Metric
description: Channel Forecast Accuracy (CFA-CD) captures the quality of outputs and outcomes for organizations
  tracking channel & distribution management. Its calculation is Partner Forecast vs Actual Sell-Through
  / Actual, measured in percent (%). Its value drives prioritization and resource reallocation among competing
  initiatives. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
