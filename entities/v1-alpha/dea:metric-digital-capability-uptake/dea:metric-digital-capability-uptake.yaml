id: dea:metric-digital-capability-uptake
name: Digital Capability Uptake
type: Metric
description: Within Digital Transformation, Digital Capability Uptake (DCU) is used to gauge how effectively
  a process or entity achieves its intended outcome. It is computed as Users Adopting New Digital Capability
  / Target Users, expressed in percent (%). It is reviewed at cadence by planning owners to correct course
  before issues become strategic. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DCU
unit: percent
