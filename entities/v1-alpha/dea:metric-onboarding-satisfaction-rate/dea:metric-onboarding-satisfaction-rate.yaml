id: dea:metric-onboarding-satisfaction-rate
name: Onboarding Satisfaction Rate
type: Metric
description: 'Within Culture & Employee Experience, Onboarding Satisfaction Rate (OSR-E) is used to gauge
  the engagement or satisfaction of the people involved. The formula is Satisfied New Hire Survey Responses
  / Responses - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: OSR-E
unit: percent
version: 1.1.0
