id: dea:metric-defect-density-deep-dive
name: Defect Density (Deep Dive)
type: Metric
description: 'Defect Density (Deep Dive) (DD-D) captures the quality of outputs and outcomes for organizations
  tracking semiconductor manufacturing (deep dive). It is computed as Killer Defects per Square Centimetre,
  expressed in events per thousand or million (scaled). Its use is concentrated in Semiconductors. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
