id: dea:metric-requisition-backlog-age
name: Requisition Backlog Age
type: Metric
description: 'A Talent Acquisition Deep Dive indicator, Requisition Backlog Age (RBA-TA) quantifies the
  utilization or availability of capacity. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Average Age of Unfilled Open Requisitions; the result is stated
  in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
