id: dea:metric-production-backlog
name: Production Backlog
type: Metric
description: Production Backlog (PBL) addresses the utilization or availability of capacity and is a fixture
  of manufacturing reporting. It is computed as Open Production Orders Awaiting Start, expressed in count
  (items per period). Front-line and delivery teams watch it in real time, as small deviations demand
  immediate correction. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Manufacturing.
