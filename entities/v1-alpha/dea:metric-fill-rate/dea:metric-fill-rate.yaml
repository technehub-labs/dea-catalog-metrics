id: dea:metric-fill-rate
name: Fill Rate
type: Metric
description: A Supply Chain indicator, Fill Rate (FR) quantifies the quality of outputs and outcomes.
  Its calculation is Items Shipped from Stock / Items Ordered, measured in percent (%). Its value drives
  prioritization and resource reallocation among competing initiatives. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: FR
unit: percent
