id: dea:metric-management-information-freshness-score
name: Management Information Freshness Score
type: Metric
description: 'Within Enterprise Decision Effectiveness & Governance Monitoring, Management Information
  Freshness Score (MIFS-GOV) is used to gauge the quality of outputs and outcomes. It is computed as Reports
  Presented with Data under Refresh SLA / Reports, expressed in percent (%). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
abbreviation: MIFS-GOV
unit: percent
version: 1.1.0
