id: dea:metric-aircraft-turnaround-time-deep-dive
name: Aircraft Turnaround Time (Deep Dive)
type: Metric
description: A Airline & Transportation Standard Measures (Deep Dive) indicator, Aircraft Turnaround Time
  (Deep Dive) (TATDD) quantifies how efficiently resources are converted into outputs. It is computed
  as Minutes from Arrival Gate to Departure Gate, expressed in minutes. Its use is concentrated in Airlines
  & Aviation. Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Reduction is the goal, and sustained decreases indicate successful intervention.
