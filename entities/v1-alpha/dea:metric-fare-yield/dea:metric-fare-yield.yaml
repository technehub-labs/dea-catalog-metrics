id: dea:metric-fare-yield
name: Fare Yield
type: Metric
description: Fare Yield (FY) captures the economic value created or preserved for organizations tracking
  airlines & aviation. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Passenger Revenue / Revenue Passenger Kilometres - reported in currency per
  unit. Improvement means raising this figure toward best-in-class levels. It is a standard measure in
  the Airlines & aviation sector.
