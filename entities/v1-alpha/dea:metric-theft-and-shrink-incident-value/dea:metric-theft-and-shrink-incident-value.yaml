id: dea:metric-theft-and-shrink-incident-value
name: Theft and Shrink Incident Value
type: Metric
description: Theft and Shrink Incident Value (TSIV) measures exposure to adverse outcomes in the Physical
  Security Operations domain. It is defined as Value of Confirmed Theft and Loss Events per Period; the
  result is stated in currency value. It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Reduction is the goal, and
  sustained decreases indicate successful intervention.
