id: dea:metric-cooling-efficiency-delta-t-compliance
name: Cooling Efficiency - Delta-T Compliance
type: Metric
description: 'Cooling Efficiency - Delta-T Compliance (CEDT) measures how efficiently resources are converted
  into outputs in the Data Centers & Cloud Infrastructure domain. The formula is Airflow Tests Meeting
  Delta-T Design / Tests - reported in percent (%). It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Technology sector.'
