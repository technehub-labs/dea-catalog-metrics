id: dea:metric-plant-load-factor
name: Plant Load Factor
type: Metric
description: Within Energy & Utilities, Plant Load Factor (PLF) is used to gauge the utilization or availability
  of capacity. It is defined as Actual Energy Generated / Maximum Possible Generation; the result is stated
  in percent (%). In Energy & utilities, it is a recognized element of the standard performance toolkit.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: PLF
unit: percent
