id: dea:metric-amendment-tracking-completeness
name: Amendment Tracking Completeness
type: Metric
description: Within Contract Lifecycle Management, Amendment Tracking Completeness (ATC-CL) is used to
  gauge the quality of outputs and outcomes. It is computed as Amendments Linked to Master Contract /
  Amendments, expressed in percent (%). Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: ATC-CL
unit: percent
