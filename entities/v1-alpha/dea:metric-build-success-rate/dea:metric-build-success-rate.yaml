id: dea:metric-build-success-rate
name: Build Success Rate
type: Metric
description: 'Build Success Rate (BSR) addresses the quality of outputs and outcomes and is a fixture
  of software engineering reporting. The formula is Successful Builds / Total Builds - reported in percent
  (%). It is monitored close to the work: teams act on it within a shift, sprint, or daily review. Higher
  values are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
abbreviation: BSR
unit: percent
