id: dea:metric-knowledge-article-effectiveness
name: Knowledge Article Effectiveness
type: Metric
description: Knowledge Article Effectiveness (KAE) addresses the quality of outputs and outcomes and is
  a fixture of knowledge management reporting. Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. It is computed as Articles Rated Helpful / Article Views
  with Rating, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: KAE
unit: percent
