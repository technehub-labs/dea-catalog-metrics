id: dea:metric-all-in-sustaining-cost
name: All-In Sustaining Cost
type: Metric
description: All-In Sustaining Cost (AISC) addresses the economic value created or preserved and is a
  fixture of mining & metals reporting. The formula is Total Sustaining Production Cost / Unit of Metal
  Produced - reported in currency per unit. It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Lower values are better; each reduction is an improvement.
  It is a standard measure in the Mining & metals sector.
