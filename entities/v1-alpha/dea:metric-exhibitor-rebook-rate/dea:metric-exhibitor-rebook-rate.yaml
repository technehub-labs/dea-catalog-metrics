id: dea:metric-exhibitor-rebook-rate
name: Exhibitor Rebook Rate
type: Metric
description: A Events & Exhibitions indicator, Exhibitor Rebook Rate (ERR-E) quantifies the retention
  of customers, users, or assets over time. It is defined as Exhibitors Rebooking for Next Edition / Exhibitors;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. In Media & Entertainment, it is a recognized element of the standard performance toolkit.
abbreviation: ERR-E
