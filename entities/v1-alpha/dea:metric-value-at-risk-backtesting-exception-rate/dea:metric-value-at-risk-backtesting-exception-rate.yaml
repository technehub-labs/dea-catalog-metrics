id: dea:metric-value-at-risk-backtesting-exception-rate
name: Value at Risk Backtesting Exception Rate
type: Metric
description: Value at Risk Backtesting Exception Rate (VARBER) measures exposure to adverse outcomes in
  the Investment Risk & Middle Office Operations domain. The formula is Exceptions beyond VaR Model Tolerance
  / Backtest Days - reported in percent (%). It is a standard measure in the Investment management sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Reduction is the goal, and sustained decreases indicate successful intervention.
