id: dea:metric-customer-segment-nps-delta
name: Customer Segment NPS Delta
type: Metric
description: 'Customer Segment NPS Delta (CSND) addresses the engagement or satisfaction of the people
  involved and is a fixture of customer journey & experience reporting. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as NPS of Target Segment
  - NPS of Baseline Segment, expressed in score (points). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: CSND
unit: score
