id: dea:metric-revenue-churn-with-expansion-offset
name: Revenue Churn with Expansion Offset
type: Metric
description: 'Revenue Churn with Expansion Offset (RCWEO) captures the retention of customers, users,
  or assets over time for organizations tracking unit economics & growth (deep dive). It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Net Revenue Lost after Expansion / Starting MRR, expressed in percent (%). It should be driven down,
  since lower readings signal healthier performance. Its use is concentrated in Software.'
