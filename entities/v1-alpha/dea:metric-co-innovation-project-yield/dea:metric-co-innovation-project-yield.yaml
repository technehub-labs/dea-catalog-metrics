id: dea:metric-co-innovation-project-yield
name: Co-Innovation Project Yield
type: Metric
description: Co-Innovation Project Yield (CIPY) addresses how effectively a process or entity achieves
  its intended outcome and is a fixture of corporate venturing & partnerships reporting. Its trend is
  watched by senior leadership as an early signal of structural performance shifts. It is defined as Co-Innovation
  Projects Reaching Market / Projects Started; the result is stated in percent (%). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CIPY
