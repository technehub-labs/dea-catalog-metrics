id: dea:metric-inclusion-survey-participation
name: Inclusion Survey Participation
type: Metric
description: 'Inclusion Survey Participation (ISP) measures the engagement or satisfaction of the people
  involved in the Diversity, Equity & Inclusion domain. The formula is Survey Responses / Survey Invitations
  - reported in percent (%). It is applied across virtually every sector. It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. It should be maximized within the limits
  of cost and quality trade-offs.'
