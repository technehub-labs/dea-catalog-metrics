id: dea:metric-cost-per-citizen-transaction
name: Cost per Citizen Transaction
type: Metric
description: Cost per Citizen Transaction (CPCT) measures how efficiently resources are converted into
  outputs in the Government & Public Administration domain. It is defined as Total Service Cost / Transactions;
  the result is stated in currency value. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Lower values are better; each reduction is an improvement. In Public
  Sector, it is a recognized element of the standard performance toolkit.
