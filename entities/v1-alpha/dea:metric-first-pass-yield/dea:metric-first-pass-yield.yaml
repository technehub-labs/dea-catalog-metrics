id: dea:metric-first-pass-yield
name: First Pass Yield
type: Metric
description: First Pass Yield (FPY) captures the quality of outputs and outcomes for organizations tracking
  operations. It is computed as Units Passing All Processes Without Rework / Units Started, expressed
  in percent (%). It is applied across virtually every sector. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. It should be maximized within the limits
  of cost and quality trade-offs.
abbreviation: FPY
unit: percent
