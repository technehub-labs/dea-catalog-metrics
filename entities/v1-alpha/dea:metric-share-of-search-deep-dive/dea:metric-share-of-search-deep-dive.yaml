id: dea:metric-share-of-search-deep-dive
name: Share of Search (Deep Dive)
type: Metric
description: Share of Search (Deep Dive) (SOSDD) measures growth over time in the Marketing & Advertising
  Standard Measures (Deep Dive) domain. Its calculation is Brand Searches / Total Category Searches, measured
  in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SOSDD
unit: percent
