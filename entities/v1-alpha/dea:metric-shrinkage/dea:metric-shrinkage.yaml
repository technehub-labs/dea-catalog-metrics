id: dea:metric-shrinkage
name: Shrinkage
type: Metric
description: Shrinkage (SHK) captures the utilization or availability of capacity for organizations tracking
  contact center. Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. It is computed as Non-Productive Time / Total Paid Time, expressed in percent (%). The objective
  is neither maximization nor minimization but staying within an agreed operating band. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: SHK
unit: percent
