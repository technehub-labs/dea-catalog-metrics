id: dea:metric-backup-restore-test-pass-rate
name: Backup Restore Test Pass Rate
type: Metric
description: Backup Restore Test Pass Rate (BRT-PR) addresses exposure to adverse outcomes and is a fixture
  of database & data platform operations reporting. It provides the day-to-day signal that a process is
  running as designed. Its calculation is Restore Tests Passed / Restore Tests Executed, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. It originates from and is most
  used in Software practice.
