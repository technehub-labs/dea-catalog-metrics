id: dea:metric-api-rate-limit-breach-rate
name: API Rate Limit Breach Rate
type: Metric
description: 'API Rate Limit Breach Rate (APRLB) addresses the utilization or availability of capacity
  and is a fixture of api lifecycle management reporting. It is defined as Throttled Requests / Total
  Requests; the result is stated in percent (%). In Software, it is a recognized element of the standard
  performance toolkit. It is a working-level control: thresholds trigger immediate operational response.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: APRLB
unit: percent
version: 1.0.1
