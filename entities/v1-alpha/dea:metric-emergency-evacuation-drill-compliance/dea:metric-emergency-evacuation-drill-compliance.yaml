id: dea:metric-emergency-evacuation-drill-compliance
name: Emergency Evacuation Drill Compliance
type: Metric
description: Emergency Evacuation Drill Compliance (EEDC) addresses conformance to standards, plans, or
  obligations and is a fixture of crisis management & emergency response reporting. It is computed as
  Sites Completing Required Drills / Sites, expressed in percent (%). Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
