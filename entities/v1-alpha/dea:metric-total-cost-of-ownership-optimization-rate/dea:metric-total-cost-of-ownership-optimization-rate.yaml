id: dea:metric-total-cost-of-ownership-optimization-rate
name: Total Cost of Ownership Optimization Rate
type: Metric
description: Total Cost of Ownership Optimization Rate (TCOOR) captures how efficiently resources are
  converted into outputs for organizations tracking strategic sourcing & supplier performance (deep dive).
  It is defined as Awards on TCO Basis rather than Price / Awards; the result is stated in percent (%).
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Higher
  values are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: TCOOR
unit: percent
