id: dea:metric-warranty-claim-rate
name: Warranty Claim Rate
type: Metric
description: A Quality Management indicator, Warranty Claim Rate (WCR) quantifies exposure to adverse
  outcomes. It is defined as Warranty Claims / Units Sold; the result is stated in percent (%). It is
  applied across virtually every sector. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Reduction is the goal, and sustained decreases indicate successful
  intervention.
