id: dea:metric-duplicate-requirement-rate
name: Duplicate Requirement Rate
type: Metric
description: Duplicate Requirement Rate (DRR-RE) measures the quality of outputs and outcomes in the Requirements
  Engineering & Product Discovery domain. It is computed as Duplicate Requirements Identified / Requirements
  Reviewed, expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Lower values are better; each reduction is an improvement. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DRR-RE
unit: percent
version: 1.0.0
