id: dea:metric-relative-market-position
name: Relative Market Position
type: Metric
description: A Strategy & Portfolio indicator, Relative Market Position (RMP) quantifies growth over time.
  Its calculation is Organization Market Share / Largest Competitor Market Share, measured in ratio (x:1
  or x). It is applied across virtually every sector. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. It should be maximized within the limits of
  cost and quality trade-offs.
