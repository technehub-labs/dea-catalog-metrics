id: dea:metric-crash-free-session-rate
name: Crash-Free Session Rate
type: Metric
description: 'Within Gaming, Crash-Free Session Rate (CFSR) is used to gauge the quality of outputs and
  outcomes. It is defined as Sessions without Crash / Total Sessions; the result is stated in percent
  (%). In Gaming, it is a recognized element of the standard performance toolkit. It is a working-level
  control: thresholds trigger immediate operational response. It should be maximized within the limits
  of cost and quality trade-offs.'
