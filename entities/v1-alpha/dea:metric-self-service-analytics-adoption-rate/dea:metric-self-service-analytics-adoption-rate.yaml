id: dea:metric-self-service-analytics-adoption-rate
name: Self-Service Analytics Adoption Rate
type: Metric
description: 'Self-Service Analytics Adoption Rate (SSAAR) addresses capability maturity or development
  and is a fixture of data science & analytics operations reporting. It is computed as Analyses via Self-Service
  Tooling / Total Analyses, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: SSAAR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- information_architecture
purpose_classification:
