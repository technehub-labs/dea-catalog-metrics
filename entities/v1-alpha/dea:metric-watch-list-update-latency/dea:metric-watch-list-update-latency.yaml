id: dea:metric-watch-list-update-latency
name: Watch List Update Latency
type: Metric
description: 'Watch List Update Latency (WLUL) measures conformance to standards, plans, or obligations
  in the Insurance Fraud & Financial Crime domain. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Hours to Deploy New Sanctions List; the result is stated in hours.
  It should be driven down, since lower readings signal healthier performance. In Financial Services,
  it is a recognized element of the standard performance toolkit.'
