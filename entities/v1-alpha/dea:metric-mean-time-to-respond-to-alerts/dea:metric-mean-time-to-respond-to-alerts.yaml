id: dea:metric-mean-time-to-respond-to-alerts
name: Mean Time to Respond to Alerts
type: Metric
description: 'Mean Time to Respond to Alerts (MTTRA) measures how efficiently resources are converted
  into outputs in the Cybersecurity domain. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Total Alert Response Time / Alerts; the result is stated in minutes.
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
abbreviation: MTTRA
unit: minutes
