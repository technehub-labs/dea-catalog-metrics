id: dea:metric-business-downtime-per-crisis-event
name: Business Downtime per Crisis Event
type: Metric
description: A Crisis Management & Emergency Response indicator, Business Downtime per Crisis Event (BDCE)
  quantifies exposure to adverse outcomes. Its calculation is Average Operating Hours Lost per Crisis,
  measured in hours. It is applied across virtually every sector. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and sustained
  decreases indicate successful intervention.
