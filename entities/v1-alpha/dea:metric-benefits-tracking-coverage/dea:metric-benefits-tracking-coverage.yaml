id: dea:metric-benefits-tracking-coverage
name: Benefits Tracking Coverage
type: Metric
description: Benefits Tracking Coverage (BTC-PPM) captures conformance to standards, plans, or obligations
  for organizations tracking program & portfolio management. Its calculation is Initiatives with Measurable
  Benefits Tracked / Initiatives, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
