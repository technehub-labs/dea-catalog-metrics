id: dea:metric-longest-delay-in-queue
name: Longest Delay in Queue
type: Metric
description: Within Contact Center Standard Measures (Deep Dive), Longest Delay in Queue (LDQ-CC) is used
  to gauge the quality of outputs and outcomes. Its calculation is Maximum Queue Wait in Period, measured
  in minutes. It is applied across virtually every sector. It provides the day-to-day signal that a process
  is running as designed. Reduction is the goal, and sustained decreases indicate successful intervention.
