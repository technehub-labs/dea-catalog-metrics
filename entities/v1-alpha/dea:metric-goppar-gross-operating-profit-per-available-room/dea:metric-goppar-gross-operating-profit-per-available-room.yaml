id: dea:metric-goppar-gross-operating-profit-per-available-room
name: GOPPAR - Gross Operating Profit per Available Room
type: Metric
description: GOPPAR - Gross Operating Profit per Available Room (GOPPAR) captures the economic value created
  or preserved for organizations tracking hotel & resort operations (deep dive). It is defined as Gross
  Operating Profit / Available Room Nights; the result is stated in currency per unit. In Hospitality,
  it is a recognized element of the standard performance toolkit. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It should be maximized within the limits of cost
  and quality trade-offs.
