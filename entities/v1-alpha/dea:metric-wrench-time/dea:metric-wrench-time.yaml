id: dea:metric-wrench-time
name: Wrench Time
type: Metric
description: 'Wrench Time (WT) captures how efficiently resources are converted into outputs for organizations
  tracking maintenance & reliability. It is defined as Direct Tool-Time / Total Technician Time; the result
  is stated in percent (%). In Manufacturing, it is a recognized element of the standard performance toolkit.
  It is a working-level control: thresholds trigger immediate operational response. It should be maximized
  within the limits of cost and quality trade-offs.'
abbreviation: WT
unit: percent
