id: dea:metric-commit-to-build-latency
name: Commit-to-Build Latency
type: Metric
description: 'Commit-to-Build Latency (CTBL) measures how efficiently resources are converted into outputs
  in the Continuous Integration domain. It is defined as Minutes from Commit to Build Start; the result
  is stated in minutes. It is a working-level control: thresholds trigger immediate operational response.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
