id: dea:metric-alert-to-ticket-conversion-ratio
name: Alert-to-Ticket Conversion Ratio
type: Metric
description: 'A Network Operations Center (Deep Dive) indicator, Alert-to-Ticket Conversion Ratio (ATTR)
  quantifies how efficiently resources are converted into outputs. It is defined as Alerts Generating
  Tickets / Alerts; the result is stated in percent (%). It is applied across virtually every sector.
  It is a working-level control: thresholds trigger immediate operational response. Values outside the
  intended band, on either side, warrant investigation.'
