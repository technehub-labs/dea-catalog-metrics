id: dea:metric-franchise-unit-economics-consistency
name: Franchise Unit Economics Consistency
type: Metric
description: Franchise Unit Economics Consistency (FUEC) captures exposure to adverse outcomes for organizations
  tracking franchise operations (deep dive). Its calculation is Units within EBITDA Band / Total Units,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
