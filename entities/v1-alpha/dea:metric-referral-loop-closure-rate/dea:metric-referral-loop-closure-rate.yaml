id: dea:metric-referral-loop-closure-rate
name: Referral Loop Closure Rate
type: Metric
description: Referral Loop Closure Rate (RLCR) measures the quality of outputs and outcomes in the Medical
  Practice & Clinical Operations domain. It is computed as Referrals with Specialist Report Returned /
  Referrals, expressed in percent (%). It is reviewed at cadence by planning owners to correct course
  before issues become strategic. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is concentrated in Healthcare.
abbreviation: RLCR
unit: percent
