id: dea:metric-single-source-style-coverage
name: Single-Source Style Coverage
type: Metric
description: 'A UX & Design Systems indicator, Single-Source Style Coverage (SSSC) quantifies how efficiently
  resources are converted into outputs. The formula is UI Tokens Sourced from Central Library / Tokens
  in Use - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: SSSC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
