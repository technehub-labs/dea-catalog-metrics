id: dea:metric-net-promoter-score-product
name: Net Promoter Score (Product)
type: Metric
description: A Product Management indicator, Net Promoter Score (Product) (NPS-P) quantifies the engagement
  or satisfaction of the people involved. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Its calculation is % Promoters - % Detractors among Product
  Users, measured in score (points). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: NPS-P
unit: score
