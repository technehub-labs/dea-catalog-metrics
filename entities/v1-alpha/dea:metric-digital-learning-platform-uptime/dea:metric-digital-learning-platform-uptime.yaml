id: dea:metric-digital-learning-platform-uptime
name: Digital Learning Platform Uptime
type: Metric
description: 'Digital Learning Platform Uptime (DLPU) measures the utilization or availability of capacity
  in the Education & Training (Deep Dive) domain. The formula is Platform Available Hours / Required Hours
  - reported in percent (%). It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. Higher values are better; gains are read as improvement and losses as deterioration.
  It is a standard measure in the Education sector.'
abbreviation: DLPU
unit: percent
