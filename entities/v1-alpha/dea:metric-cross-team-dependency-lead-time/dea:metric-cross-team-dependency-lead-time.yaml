id: dea:metric-cross-team-dependency-lead-time
name: Cross-Team Dependency Lead Time
type: Metric
description: Cross-Team Dependency Lead Time (CTDLT-AG) captures how efficiently resources are converted
  into outputs for organizations tracking agile delivery & team effectiveness. It is computed as Days
  Waiting on External Team Dependencies, expressed in days. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
