id: dea:metric-peak-demand-reduction-from-programs
name: Peak Demand Reduction from Programs
type: Metric
description: A Utilities Customer Operations indicator, Peak Demand Reduction from Programs (PDRP) quantifies
  how effectively a process or entity achieves its intended outcome. It is defined as Load Reduction Achieved
  / Contracted Reduction; the result is stated in percent (%). In Utilities, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
