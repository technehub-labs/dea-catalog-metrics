id: dea:metric-crisis-role-clarity-score
name: Crisis Role Clarity Score
type: Metric
description: Crisis Role Clarity Score (CRCS) measures the engagement or satisfaction of the people involved
  in the Crisis Management & Emergency Response domain. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Post-Exercise Survey on Role Clarity, measured in score
  (points). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly
  any industry can adopt it directly.
