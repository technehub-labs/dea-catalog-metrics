id: dea:metric-belonging-index
name: Belonging Index
type: Metric
description: A Diversity, Equity & Inclusion (Deep Dive) indicator, Belonging Index (BI-DEI) quantifies
  the engagement or satisfaction of the people involved. Its calculation is Survey Composite of Belonging
  and Psychological Safety, measured in index (0-100 or normalized). It is applied across virtually every
  sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: BI-DEI
