id: dea:metric-cargo-yield-per-tonne-kilometre
name: Cargo Yield per Tonne-Kilometre
type: Metric
description: Cargo Yield per Tonne-Kilometre (CYTK) addresses the economic value created or preserved
  and is a fixture of airline operations (deep dive) reporting. Its calculation is Cargo Revenue / Cargo
  Tonne-Kilometres, measured in currency per unit. It originates from and is most used in Airlines practice.
  Its value drives prioritization and resource reallocation among competing initiatives. It should be
  maximized within the limits of cost and quality trade-offs.
