id: dea:metric-legacy-code-coverage
name: Legacy Code Coverage
type: Metric
description: A Code Quality & Static Analysis indicator, Legacy Code Coverage (LCC) quantifies exposure
  to adverse outcomes. It is defined as Legacy Modules under Test / Legacy Modules; the result is stated
  in percent (%). It bridges daily operations and executive reporting, giving managers a lever to pull
  within a quarter. Higher values are better; gains are read as improvement and losses as deterioration.
  In Software, it is a recognized element of the standard performance toolkit.
