id: dea:metric-replication-lag
name: Replication Lag
type: Metric
description: Replication Lag (REPLAG) captures the quality of outputs and outcomes for organizations tracking
  database & data platform operations. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Seconds Behind Primary for Read Replicas, expressed in
  seconds. It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Software.
