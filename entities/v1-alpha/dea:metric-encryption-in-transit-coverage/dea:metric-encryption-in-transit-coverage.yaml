id: dea:metric-encryption-in-transit-coverage
name: Encryption in Transit Coverage
type: Metric
description: 'Encryption in Transit Coverage (EITC) captures exposure to adverse outcomes for organizations
  tracking cloud security posture management. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Services Enforcing TLS / Network-Exposed Services -
  reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: EITC
unit: percent
