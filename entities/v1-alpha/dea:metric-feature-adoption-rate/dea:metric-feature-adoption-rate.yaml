id: dea:metric-feature-adoption-rate
name: Feature Adoption Rate
type: Metric
description: Feature Adoption Rate (FAR) measures the economic value created or preserved in the Product
  Management domain. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is computed as Users Adopting New Feature / Users Exposed, expressed in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: FAR
unit: percent
