id: dea:metric-spares-fill-rate-defense
name: Spares Fill Rate (Defense)
type: Metric
description: Spares Fill Rate (Defense) (SFR-D) captures the utilization or availability of capacity for
  organizations tracking defense & aerospace. It is computed as Spares Demands Filled from Stock / Spares
  Demands, expressed in percent (%). It is reviewed at cadence by planning owners to correct course before
  issues become strategic. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Defense & aerospace.
