id: dea:metric-reach-growth-rate
name: Reach Growth Rate
type: Metric
description: Reach Growth Rate (RGR-M) measures growth over time in the Marketing domain. It bridges daily
  operations and executive reporting, giving managers a lever to pull within a quarter. It is defined
  as (Reach_current - Reach_prior) / Reach_prior; the result is stated in percent (%). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: RGR-M
unit: percent
