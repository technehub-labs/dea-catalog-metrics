id: dea:metric-overall-operations-effectiveness
name: Overall Operations Effectiveness
type: Metric
description: Overall Operations Effectiveness (OOE) captures how effectively a process or entity achieves
  its intended outcome for organizations tracking manufacturing. Its calculation is OEE over Calendar
  Time Including Planned Stops, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. It originates from and is most used in Manufacturing practice.
abbreviation: OOE
unit: percent
