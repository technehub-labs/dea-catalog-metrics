id: dea:metric-subsidy-per-passenger-journey-deep-dive
name: Subsidy per Passenger Journey (Deep Dive)
type: Metric
description: Subsidy per Passenger Journey (Deep Dive) (SPR-D) measures how efficiently resources are
  converted into outputs in the Public Transit (Deep Dive) domain. The formula is Net Subsidy / Journeys
  - reported in currency per unit. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Lower values are better; each reduction is an improvement. It is a standard
  measure in the Public Transit sector.
