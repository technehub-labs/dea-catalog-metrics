id: dea:metric-customer-profitability-segmentation-index
name: Customer Profitability Segmentation Index
type: Metric
description: Customer Profitability Segmentation Index (CPSI-BSC) measures the economic value created
  or preserved in the Balanced Scorecard - Customer Perspective domain. It is defined as Share of Profitable
  Customers in Portfolio; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: CPSI-BSC
unit: percent
