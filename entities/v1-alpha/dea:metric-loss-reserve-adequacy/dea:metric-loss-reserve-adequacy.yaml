id: dea:metric-loss-reserve-adequacy
name: Loss Reserve Adequacy
type: Metric
description: 'Loss Reserve Adequacy (LRA) addresses exposure to adverse outcomes and is a fixture of actuarial
  & reserving reporting. It is computed as Reserves Held / Actuarial Best Estimate, expressed in ratio
  (x:1 or x). Its use is concentrated in Insurance. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Values outside the intended band, on either side,
  warrant investigation.'
