id: dea:metric-misclassification-audit-findings
name: Misclassification Audit Findings
type: Metric
description: 'Misclassification Audit Findings (MAF) captures conformance to standards, plans, or obligations
  for organizations tracking gig & contingent workforce. It is computed as Worker Classification Violations
  Detected / Workers Audited, expressed in percent (%). It is applied across virtually every sector. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
