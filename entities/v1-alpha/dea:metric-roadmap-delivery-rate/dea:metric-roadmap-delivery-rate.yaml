id: dea:metric-roadmap-delivery-rate
name: Roadmap Delivery Rate
type: Metric
description: A Product Management indicator, Roadmap Delivery Rate (RDR) quantifies conformance to standards,
  plans, or obligations. It is defined as Committed Roadmap Items Delivered / Items Committed; the result
  is stated in percent (%). It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: RDR
unit: percent
