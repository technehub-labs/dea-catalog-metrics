id: dea:metric-fraud-loss-rate-deep-dive
name: Fraud Loss Rate (Deep Dive)
type: Metric
description: 'Fraud Loss Rate (Deep Dive) (FLR-D) captures exposure to adverse outcomes for organizations
  tracking insurance fraud & financial crime. It is computed as Fraud Losses / Transaction or Premium
  Base, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is
  concentrated in Financial Services.'
abbreviation: FLR-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
