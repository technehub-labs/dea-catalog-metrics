id: dea:metric-multi-account-governance-coverage
name: Multi-Account Governance Coverage
type: Metric
description: Multi-Account Governance Coverage (MAGC-CS) measures governance in the Cloud Security Posture
  Management domain. The formula is Accounts under Central Landing Zone Policy / Accounts - reported in
  percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
