id: dea:metric-excess-obsolete-inventory-ratio-supply-chain
name: Excess & Obsolete Inventory Ratio (Supply Chain)
type: Metric
description: A Supply Chain Standard Measures (Deep Dive) indicator, Excess & Obsolete Inventory Ratio
  (Supply Chain) (EOIR) quantifies exposure to adverse outcomes. It is defined as E&O Inventory Value
  / Total Inventory Value; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: EOIR
unit: percent
