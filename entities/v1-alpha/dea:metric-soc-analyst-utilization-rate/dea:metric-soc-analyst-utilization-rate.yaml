id: dea:metric-soc-analyst-utilization-rate
name: SOC Analyst Utilization Rate
type: Metric
description: SOC Analyst Utilization Rate (SAUR-SOC) captures the utilization or availability of capacity
  for organizations tracking secops & security operations center. Its calculation is Triage Hours / Shift
  Hours, measured in percent (%). It provides the day-to-day signal that a process is running as designed.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SAUR-SOC
unit: percent
