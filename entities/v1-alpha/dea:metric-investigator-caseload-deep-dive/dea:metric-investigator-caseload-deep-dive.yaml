id: dea:metric-investigator-caseload-deep-dive
name: Investigator Caseload (Deep Dive)
type: Metric
description: Investigator Caseload (Deep Dive) (ICL-D) captures the utilization or availability of capacity
  for organizations tracking insurance fraud & financial crime. It is computed as Open Cases per Investigator,
  expressed in count (items per period). Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. Its use is concentrated in Financial Services.
abbreviation: ICL-D
unit: count
