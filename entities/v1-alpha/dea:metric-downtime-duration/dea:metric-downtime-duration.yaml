id: dea:metric-downtime-duration
name: Downtime Duration
type: Metric
description: Downtime Duration (DT) measures exposure to adverse outcomes in the IT Service Management
  domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. Its calculation is Total Unplanned Unavailability per Period, measured in hours. It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
abbreviation: DT
unit: hour
