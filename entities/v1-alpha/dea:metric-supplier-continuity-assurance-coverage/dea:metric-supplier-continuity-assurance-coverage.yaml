id: dea:metric-supplier-continuity-assurance-coverage
name: Supplier Continuity Assurance Coverage
type: Metric
description: Supplier Continuity Assurance Coverage (SCAC) addresses exposure to adverse outcomes and
  is a fixture of business resilience & continuity reporting. The formula is Critical Suppliers with Continuity
  Assurance / Critical Suppliers - reported in percent (%). It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: SCAC
unit: percent
