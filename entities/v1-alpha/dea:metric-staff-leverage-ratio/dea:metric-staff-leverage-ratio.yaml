id: dea:metric-staff-leverage-ratio
name: Staff Leverage Ratio
type: Metric
description: Staff Leverage Ratio (SLR-PS) measures the utilization or availability of capacity in the
  Professional Services domain. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Non-Partner Staff / Partners; the result is stated in ratio (x:1
  or x). The objective is neither maximization nor minimization but staying within an agreed operating
  band. In Professional services, it is a recognized element of the standard performance toolkit.
abbreviation: SLR-PS
