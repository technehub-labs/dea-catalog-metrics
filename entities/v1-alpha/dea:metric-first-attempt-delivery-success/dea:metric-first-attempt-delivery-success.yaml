id: dea:metric-first-attempt-delivery-success
name: First-Attempt Delivery Success
type: Metric
description: 'Within Postal & Courier, First-Attempt Delivery Success (FADS) is used to gauge the quality
  of outputs and outcomes. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. The formula is Items Delivered on First Attempt / Delivery Attempts - reported in percent
  (%). Improvement means raising this figure toward best-in-class levels. It is a standard measure in
  the Postal & courier sector.'
