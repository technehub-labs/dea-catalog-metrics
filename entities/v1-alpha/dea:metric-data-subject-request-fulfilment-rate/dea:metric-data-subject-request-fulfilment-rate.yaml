id: dea:metric-data-subject-request-fulfilment-rate
name: Data Subject Request Fulfilment Rate
type: Metric
description: A Data Privacy & Protection indicator, Data Subject Request Fulfilment Rate (DSRFR) quantifies
  conformance to standards, plans, or obligations. The formula is DSARs Fulfilled within Statutory Time
  / DSARs - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
