id: dea:metric-internal-network-connectivity-index
name: Internal Network Connectivity Index
type: Metric
description: Internal Network Connectivity Index (INCI) addresses the engagement or satisfaction of the
  people involved and is a fixture of employee engagement & culture (deep dive) reporting. It is computed
  as Breadth of Cross-Functional Collaborative Ties per Employee, expressed in index (0-100 or normalized).
  It is applied across virtually every sector. It is reviewed at cadence by planning owners to correct
  course before issues become strategic. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: INCI
unit: index
