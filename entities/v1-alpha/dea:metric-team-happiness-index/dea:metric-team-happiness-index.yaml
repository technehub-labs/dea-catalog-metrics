id: dea:metric-team-happiness-index
name: Team Happiness Index
type: Metric
description: 'Team Happiness Index (THI-AG) addresses the engagement or satisfaction of the people involved
  and is a fixture of agile delivery & team effectiveness reporting. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Composite Team Sentiment
  Score, expressed in index (0-100 or normalized). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
