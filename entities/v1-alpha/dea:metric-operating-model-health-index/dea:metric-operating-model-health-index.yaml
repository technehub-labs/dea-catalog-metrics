id: dea:metric-operating-model-health-index
name: Operating Model Health Index
type: Metric
description: Within Operating Model & Process Health Deep Dive, Operating Model Health Index (OMHI) is
  used to gauge strategy. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It is defined as Composite of Alignment, Accountability, Efficiency Subscores; the result is
  stated in index (0-100 or normalized). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
