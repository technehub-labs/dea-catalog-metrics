id: dea:metric-water-recirculation-rate-mining
name: Water Recirculation Rate (Mining)
type: Metric
description: Water Recirculation Rate (Mining) (WRR-M) captures environmental and social sustainability
  performance for organizations tracking mining & metals. It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. It is defined as Recirculated Water / Total Water
  Used; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Mining & metals, it is a recognized element of the standard performance toolkit.
abbreviation: WRR-M
unit: percent
