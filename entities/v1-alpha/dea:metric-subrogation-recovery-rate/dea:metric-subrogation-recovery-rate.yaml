id: dea:metric-subrogation-recovery-rate
name: Subrogation Recovery Rate
type: Metric
description: A Claims Operations (Insurance) indicator, Subrogation Recovery Rate (SRR-C) quantifies the
  economic value created or preserved. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Recovered Amounts from Third Parties / Recoverable
  Amounts, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Its use is concentrated in Insurance.
