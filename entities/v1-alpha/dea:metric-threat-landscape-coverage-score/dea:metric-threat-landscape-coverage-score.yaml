id: dea:metric-threat-landscape-coverage-score
name: Threat Landscape Coverage Score
type: Metric
description: Threat Landscape Coverage Score (TLCS) addresses exposure to adverse outcomes and is a fixture
  of threat intelligence & red team reporting. Its calculation is Coverage of Industry-Threat Scenarios
  with Playbooks, measured in score (points). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
