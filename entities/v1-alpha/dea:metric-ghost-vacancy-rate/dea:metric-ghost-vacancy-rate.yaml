id: dea:metric-ghost-vacancy-rate
name: Ghost Vacancy Rate
type: Metric
description: Ghost Vacancy Rate (GVR) captures exposure to adverse outcomes for organizations tracking
  workforce planning & analytics. It is computed as Approved Roles Unfilled beyond Target Time / Approved
  Roles, expressed in percent (%). It is applied across virtually every sector. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: GVR
unit: percent
version: 1.1.0
