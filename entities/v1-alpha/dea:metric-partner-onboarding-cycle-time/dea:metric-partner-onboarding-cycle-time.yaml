id: dea:metric-partner-onboarding-cycle-time
name: Partner Onboarding Cycle Time
type: Metric
description: Partner Onboarding Cycle Time (POCT) measures how efficiently resources are converted into
  outputs in the Alliances & Partnerships Management domain. It is defined as Days from Agreement to First
  Transaction; the result is stated in days. It is applied across virtually every sector. It bridges daily
  operations and executive reporting, giving managers a lever to pull within a quarter. Reduction is the
  goal, and sustained decreases indicate successful intervention.
