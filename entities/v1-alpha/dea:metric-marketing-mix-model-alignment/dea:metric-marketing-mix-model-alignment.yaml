id: dea:metric-marketing-mix-model-alignment
name: Marketing Mix Model Alignment
type: Metric
description: 'A Marketing Attribution & Analytics indicator, Marketing Mix Model Alignment (MMA) quantifies
  the economic value created or preserved. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Channel Spend per Model Optimum / Actual
  Channel Spend, expressed in ratio (x:1 or x). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
