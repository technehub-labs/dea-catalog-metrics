id: dea:metric-supplier-scorecard-coverage
name: Supplier Scorecard Coverage
type: Metric
description: Supplier Scorecard Coverage (SSC-SS) captures the quality of outputs and outcomes for organizations
  tracking strategic sourcing & supplier performance (deep dive). It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It is computed as Strategic Suppliers under
  Scorecard / Strategic Suppliers, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
