id: dea:metric-scrap-rate-plastics
name: Scrap Rate (Plastics)
type: Metric
description: 'Scrap Rate (Plastics) (SRP) measures how efficiently resources are converted into outputs
  in the Packaging & Plastics domain. The formula is Scrap Material / Total Material - reported in percent
  (%). It is a standard measure in the Manufacturing sector. It is monitored close to the work: teams
  act on it within a shift, sprint, or daily review. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
abbreviation: SRP
unit: percent
