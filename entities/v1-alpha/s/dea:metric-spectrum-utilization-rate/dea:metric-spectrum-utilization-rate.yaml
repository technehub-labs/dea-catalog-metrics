id: dea:metric-spectrum-utilization-rate
name: Spectrum Utilization Rate
type: Metric
description: Within Telecom Network Operations (Deep Dive), Spectrum Utilization Rate (SUR-T) is used
  to gauge the utilization or availability of capacity. Its calculation is Used Capacity / Licensed Spectrum
  Capacity, measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. It originates from and is most used in Telecommunications
  practice.
abbreviation: SUR-T
unit: percent
version: 1.1.0
