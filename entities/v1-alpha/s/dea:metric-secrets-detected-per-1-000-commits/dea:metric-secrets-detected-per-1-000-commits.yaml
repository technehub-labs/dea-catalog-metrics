id: dea:metric-secrets-detected-per-1-000-commits
name: Secrets Detected per 1,000 Commits
type: Metric
description: Secrets Detected per 1,000 Commits (SD1KC) captures exposure to adverse outcomes for organizations
  tracking devsecops & application security engineering. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Hardcoded Secrets Detected / 1,000 Commits, measured in events
  per thousand or million (scaled). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
