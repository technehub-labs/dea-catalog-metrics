id: dea:metric-sustainment-rate-of-improvements
name: Sustainment Rate of Improvements
type: Metric
description: A Process Excellence (Lean Six Sigma) indicator, Sustainment Rate of Improvements (SRI) quantifies
  the quality of outputs and outcomes. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Improvements Sustaining Gains after 6 Months
  / Improvements Closed, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SRI
unit: percent
