id: dea:metric-student-to-faculty-ratio-standard
name: Student-to-Faculty Ratio (Standard)
type: Metric
description: A Education & Training Outcome Standard Measures indicator, Student-to-Faculty Ratio (Standard)
  (STFR) quantifies the utilization or availability of capacity. Its calculation is Enrolled Students
  / Full-Time Faculty, measured in ratio (x:1 or x). It originates from and is most used in Education
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Values outside the intended band, on either side, warrant investigation.
abbreviation: STFR
unit: ratio
