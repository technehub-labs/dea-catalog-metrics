id: dea:metric-sortino-ratio-deep-dive
name: Sortino Ratio (Deep Dive)
type: Metric
description: Within Investment Performance Measurement, Sortino Ratio (Deep Dive) (SORTDD) is used to
  gauge exposure to adverse outcomes. It is defined as Return below Target / Downside Deviation; the result
  is stated in ratio (x:1 or x). In Investment management, it is a recognized element of the standard
  performance toolkit. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: SORTDD
unit: ratio
