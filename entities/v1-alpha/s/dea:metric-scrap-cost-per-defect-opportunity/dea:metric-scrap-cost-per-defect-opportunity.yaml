id: dea:metric-scrap-cost-per-defect-opportunity
name: Scrap Cost per Defect Opportunity
type: Metric
description: 'Within Process Capability & Six Sigma (Deep Dive), Scrap Cost per Defect Opportunity (SCPDO)
  is used to gauge the economic value created or preserved. The formula is Scrap Cost / Defect Opportunities
  - reported in currency per unit. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. Lower values are better; each reduction is an improvement. It is a
  standard measure in the Manufacturing sector.'
