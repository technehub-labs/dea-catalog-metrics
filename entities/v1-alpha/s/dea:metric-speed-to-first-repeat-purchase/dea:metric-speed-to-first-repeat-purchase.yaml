id: dea:metric-speed-to-first-repeat-purchase
name: Speed to First Repeat Purchase
type: Metric
description: Speed to First Repeat Purchase (SFRP-S) addresses the engagement or satisfaction of the people
  involved and is a fixture of startup & venture-backed business reporting. It is reviewed at cadence
  by planning owners to correct course before issues become strategic. It is computed as Days from First
  to Second Purchase, expressed in days. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: SFRP-S
unit: day
