id: dea:metric-ship-hotel-maintenance-score
name: Ship Hotel Maintenance Score
type: Metric
description: Ship Hotel Maintenance Score (SHMS) measures the quality of outputs and outcomes in the Cruise
  & Passenger Shipping domain. Its calculation is Interior Condition Audit Score, measured in score (points).
  It originates from and is most used in Hospitality practice. Its value drives prioritization and resource
  reallocation among competing initiatives. It should be maximized within the limits of cost and quality
  trade-offs.
