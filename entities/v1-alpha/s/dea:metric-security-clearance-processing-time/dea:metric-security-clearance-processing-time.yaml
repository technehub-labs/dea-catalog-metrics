id: dea:metric-security-clearance-processing-time
name: Security Clearance Processing Time
type: Metric
description: Within Defense & Aerospace, Security Clearance Processing Time (SCPT) is used to gauge how
  efficiently resources are converted into outputs. It is computed as Days from Clearance Request to Adjudication,
  expressed in days. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. Lower values are better; each reduction is an improvement. Its use is concentrated in Defense
  & aerospace.
