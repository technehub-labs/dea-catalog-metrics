id: dea:metric-span-of-control
name: Span of Control
type: Metric
description: 'A Operating Model & Decision Effectiveness indicator, Span of Control (SOC) quantifies the
  utilization or availability of capacity. It is computed as Direct Reports / Manager, Averaged, expressed
  in ratio (x:1 or x). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It is managed toward a defined target band rather than an extreme - both overshoot and
  undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: SOC
unit: ratio
