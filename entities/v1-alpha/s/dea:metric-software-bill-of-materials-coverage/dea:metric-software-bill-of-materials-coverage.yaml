source_credit: Public domain - no attribution required
calculation_definition: Artifacts with Generated SBOM / Artifacts
formula_definition:
  formula_id: dea:formula-software-bill-of-materials-coverage
  expression: SBOMC = Artifacts with Generated SBOM / Artifacts
  inputs:
  - name: Artifacts with Generated SBOM
  - name: Artifacts
