id: dea:metric-software-bill-of-materials-coverage
name: Software Bill of Materials Coverage
type: Metric
description: A DevSecOps & Application Security Engineering indicator, Software Bill of Materials Coverage
  (SBOMC) quantifies conformance to standards, plans, or obligations. Its calculation is Artifacts with
  Generated SBOM / Artifacts, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: SBOMC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- compliance
scope_classification:
