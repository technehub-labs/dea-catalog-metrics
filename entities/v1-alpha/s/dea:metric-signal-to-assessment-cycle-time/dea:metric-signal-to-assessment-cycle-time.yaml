id: dea:metric-signal-to-assessment-cycle-time
name: Signal-to-Assessment Cycle Time
type: Metric
description: A Emerging Risk & Horizon Scanning indicator, Signal-to-Assessment Cycle Time (SACT) quantifies
  how efficiently resources are converted into outputs. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Days from External Signal to Formal
  Risk Assessment; the result is stated in days. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: SACT
unit: day
version: 1.1.0
lifecycle_status: candidate
