id: dea:metric-service-delivery-completion-rate-government
name: Service Delivery Completion Rate (Government)
type: Metric
description: Within Government & Public Administration, Service Delivery Completion Rate (Government)
  (SDCR) is used to gauge how effectively a process or entity achieves its intended outcome. Its calculation
  is Services Delivered within Standard / Services Due, measured in percent (%). It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Higher values are
  better; gains are read as improvement and losses as deterioration. It originates from and is most used
  in Public Sector practice.
abbreviation: SDCR
unit: percent
