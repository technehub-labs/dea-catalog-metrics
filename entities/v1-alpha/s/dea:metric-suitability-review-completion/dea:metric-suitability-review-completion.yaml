id: dea:metric-suitability-review-completion
name: Suitability Review Completion
type: Metric
description: Within Wealth Management, Suitability Review Completion (SRC-W) is used to gauge conformance
  to standards, plans, or obligations. Its calculation is Client Files Reviewed within Cycle / Client
  Files, measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. It originates from and is most used in Wealth management practice.
abbreviation: SRC-W
unit: percent
