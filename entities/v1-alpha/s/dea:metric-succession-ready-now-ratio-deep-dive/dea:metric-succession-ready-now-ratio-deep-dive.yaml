id: dea:metric-succession-ready-now-ratio-deep-dive
name: Succession Ready-now Ratio (Deep Dive)
type: Metric
description: Succession Ready-now Ratio (Deep Dive) (SRNRD) measures exposure to adverse outcomes in the
  Standard Workforce & Pay Metrics domain. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Critical Roles with Ready-Now Successor
  / Critical Roles, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SRNRD
unit: percent
