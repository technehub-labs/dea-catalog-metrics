id: dea:metric-scrap-cost-per-wafer
name: Scrap Cost per Wafer
type: Metric
description: Scrap Cost per Wafer (SCW) captures how efficiently resources are converted into outputs
  for organizations tracking semiconductor & electronics. It is computed as Total Scrap Cost / Wafers
  Started, expressed in currency per unit. Its use is concentrated in Electronics & semiconductors. It
  is reviewed at cadence by planning owners to correct course before issues become strategic. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: SCW
unit: currency
