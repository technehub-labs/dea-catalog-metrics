id: dea:metric-support-tickets-per-1-000-users
name: Support Tickets per 1,000 Users
type: Metric
description: 'Support Tickets per 1,000 Users (STK) captures the quality of outputs and outcomes for organizations
  tracking product management. It is defined as Support Tickets / Users x 1,000; the result is stated
  in events per thousand or million (scaled). It is applied across virtually every sector. It is a working-level
  control: thresholds trigger immediate operational response. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
