id: dea:metric-supply-plan-attainment
name: Supply Plan Attainment
type: Metric
description: Supply Plan Attainment (SPA-S) captures conformance to standards, plans, or obligations for
  organizations tracking sales & operations planning. Its calculation is Volume Supplied per Plan / Volume
  Planned, measured in percent (%). Its value drives prioritization and resource reallocation among competing
  initiatives. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: SPA-S
unit: percent
version: 1.1.0
