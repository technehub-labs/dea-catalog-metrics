id: dea:metric-sli-coverage-rate
name: SLI Coverage Rate
type: Metric
description: SLI Coverage Rate (SLIC) captures conformance to standards, plans, or obligations for organizations
  tracking sre & observability standard measures. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Critical Services with Defined SLIs / Critical
  Services; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Software, it is a recognized element of the standard performance toolkit.
abbreviation: SLIC
unit: percent
version: 1.1.0
