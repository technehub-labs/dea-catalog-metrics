id: dea:metric-sustained-adoption-at-90-days
name: Sustained Adoption at 90 Days
type: Metric
description: Sustained Adoption at 90 Days (SA90) captures the retention of customers, users, or assets
  over time for organizations tracking change management. Its calculation is Users Still Adopting at 90
  Days / Initial Adopters, measured in percent (%). It is applied across virtually every sector. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: SA90
unit: percent
version: 1.1.0
