id: dea:metric-shareholder-meeting-participation
name: Shareholder Meeting Participation
type: Metric
description: Shareholder Meeting Participation (SMP) addresses the engagement or satisfaction of the people
  involved and is a fixture of corporate governance reporting. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Shares Voted / Shares Outstanding
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: SMP
unit: percent
