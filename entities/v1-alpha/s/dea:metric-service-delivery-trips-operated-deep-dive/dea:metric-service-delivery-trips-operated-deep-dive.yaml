id: dea:metric-service-delivery-trips-operated-deep-dive
name: Service Delivery - Trips Operated (Deep Dive)
type: Metric
description: Service Delivery - Trips Operated (Deep Dive) (SDTO-D) measures conformance to standards,
  plans, or obligations in the Public Transit (Deep Dive) domain. The formula is Trips Operated / Trips
  Scheduled - reported in percent (%). It is a standard measure in the Public Transit sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
