id: dea:metric-safety-incident-rate-field
name: Safety Incident Rate (Field)
type: Metric
description: Safety Incident Rate (Field) (SIR-F) captures exposure to adverse outcomes for organizations
  tracking field service & asset performance. The formula is Recordable Field Incidents per 200,000 Hours
  - reported in events per thousand or million (scaled). It is applied across virtually every sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Reduction is the goal, and sustained decreases indicate successful intervention.
