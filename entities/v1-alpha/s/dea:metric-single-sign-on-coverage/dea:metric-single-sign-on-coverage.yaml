id: dea:metric-single-sign-on-coverage
name: Single Sign-On Coverage
type: Metric
description: Single Sign-On Coverage (SSOC) measures exposure to adverse outcomes in the Digital Workplace
  & Collaboration domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is Applications behind SSO / Applications, measured in percent
  (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any
  industry can adopt it directly.
abbreviation: SSOC
unit: percent
version: 1.1.0
