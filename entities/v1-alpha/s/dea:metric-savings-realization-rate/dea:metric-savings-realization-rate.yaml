id: dea:metric-savings-realization-rate
name: Savings Realization Rate
type: Metric
description: Savings Realization Rate (SRR) addresses the economic value created or preserved and is a
  fixture of procurement reporting. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Realized Savings / Identified Savings, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: SRR
unit: percent
