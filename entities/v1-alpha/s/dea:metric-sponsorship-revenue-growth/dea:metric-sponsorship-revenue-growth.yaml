id: dea:metric-sponsorship-revenue-growth
name: Sponsorship Revenue Growth
type: Metric
description: Sponsorship Revenue Growth (SRG-S) measures growth over time in the Sports & Events domain.
  Its calculation is (Sponsorship Revenue_current - Revenue_prior) / Revenue_prior, measured in percent
  (%). It originates from and is most used in Sports & events practice. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: SRG-S
unit: percent
version: 1.1.0
