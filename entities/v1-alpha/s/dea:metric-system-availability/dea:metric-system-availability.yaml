id: dea:metric-system-availability
name: System Availability
type: Metric
description: System Availability (SYS-A) addresses the quality of outputs and outcomes and is a fixture
  of it service management reporting. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It is defined as Uptime / Scheduled Availability; the result is stated
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: SYS-A
unit: percent
version: 1.1.0
lifecycle_status: candidate
