id: dea:metric-settlement-timeliness
name: Settlement Timeliness
type: Metric
description: 'A Payments & Fintech indicator, Settlement Timeliness (STL) quantifies the quality of outputs
  and outcomes. It is defined as Settlements Completed by Expected Date / Settlements Due; the result
  is stated in percent (%). It is a working-level control: thresholds trigger immediate operational response.
  Higher values are better; gains are read as improvement and losses as deterioration. In Payments & fintech,
  it is a recognized element of the standard performance toolkit.'
abbreviation: STL
unit: percent
