id: dea:metric-success-plan-coverage
name: Success Plan Coverage
type: Metric
description: Success Plan Coverage (SPC-S) addresses how effectively a process or entity achieves its
  intended outcome and is a fixture of customer success (b2b saas) reporting. It is computed as Accounts
  with Agreed Success Plan / Total Accounts, expressed in percent (%). It is reviewed at cadence by planning
  owners to correct course before issues become strategic. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is concentrated in Software & SaaS.
abbreviation: SPC-S
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
