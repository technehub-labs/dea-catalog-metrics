id: dea:metric-supplier-lead-time-variability
name: Supplier Lead Time Variability
type: Metric
description: Supplier Lead Time Variability (SLTV) captures exposure to adverse outcomes for organizations
  tracking supply chain. Its value drives prioritization and resource reallocation among competing initiatives.
  Its calculation is Standard Deviation of Supplier Lead Time, measured in days. It should be driven down,
  since lower readings signal healthier performance. Practitioners in nearly any industry can adopt it
  directly.
abbreviation: SLTV
unit: day
