id: dea:metric-showback-or-chargeback-coverage
name: Showback or Chargeback Coverage
type: Metric
description: Within IT Financial Management & Technology Budgeting, Showback or Chargeback Coverage (SBC-ITFM)
  is used to gauge capability maturity or development. It is defined as Business Units Receiving Cost
  Visibility / Units; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: SBC-ITFM
unit: percent
