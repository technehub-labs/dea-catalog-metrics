id: dea:metric-safety-stock-optimization-coverage
name: Safety Stock Optimization Coverage
type: Metric
description: 'Safety Stock Optimization Coverage (SSOC) measures how efficiently resources are converted
  into outputs in the Supply Chain Standard Measures (Deep Dive) domain. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. The formula is SKUs with Statistically
  Sized Safety Stock / SKUs - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: SSOC
unit: percent
