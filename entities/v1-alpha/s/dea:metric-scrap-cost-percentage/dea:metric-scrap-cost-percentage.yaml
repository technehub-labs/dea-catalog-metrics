id: dea:metric-scrap-cost-percentage
name: Scrap Cost Percentage
type: Metric
description: Scrap Cost Percentage (SCP) captures the economic value created or preserved for organizations
  tracking manufacturing. It is computed as Scrap Cost / Total Production Cost, expressed in percent (%).
  It is reviewed at cadence by planning owners to correct course before issues become strategic. Lower
  values are better; each reduction is an improvement. Its use is concentrated in Manufacturing.
abbreviation: SCP
unit: percent
