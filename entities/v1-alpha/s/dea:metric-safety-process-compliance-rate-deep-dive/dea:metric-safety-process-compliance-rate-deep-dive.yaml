id: dea:metric-safety-process-compliance-rate-deep-dive
name: Safety Process Compliance Rate (Deep Dive)
type: Metric
description: Safety Process Compliance Rate (Deep Dive) (SPCR-D) measures conformance to standards, plans,
  or obligations in the Balanced Scorecard - Internal Process Perspective domain. It carries weight in
  boardroom and executive reviews, where it anchors cross-organization trade-offs. The formula is Safety
  Process Audits Passed / Audits - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SPCR-D
unit: percent
