id: dea:metric-schedule-performance-index
name: Schedule Performance Index
type: Metric
description: A Project Management indicator, Schedule Performance Index (SPI) quantifies conformance to
  standards, plans, or obligations. Its calculation is Earned Value / Planned Value, measured in ratio
  (x:1 or x). It is applied across virtually every sector. Its value drives prioritization and resource
  reallocation among competing initiatives. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: SPI
unit: ratio
