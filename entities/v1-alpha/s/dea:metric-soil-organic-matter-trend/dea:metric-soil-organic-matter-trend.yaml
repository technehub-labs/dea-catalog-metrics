id: dea:metric-soil-organic-matter-trend
name: Soil Organic Matter Trend
type: Metric
description: Soil Organic Matter Trend (SOMT) addresses environmental and social sustainability performance
  and is a fixture of agriculture & agronomy (deep dive) reporting. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Change in Soil Organic Matter
  per Cycle; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Agriculture, it is a recognized element of the standard performance toolkit.
abbreviation: SOMT
