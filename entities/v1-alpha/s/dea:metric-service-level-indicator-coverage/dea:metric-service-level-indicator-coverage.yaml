id: dea:metric-service-level-indicator-coverage
name: Service Level Indicator Coverage
type: Metric
description: Within Observability & Site Reliability Engineering, Service Level Indicator Coverage (SLIC)
  is used to gauge capability maturity or development. It is defined as User-Facing Services with Defined
  SLIs / Services; the result is stated in percent (%). Its trend is watched by senior leadership as an
  early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: SLIC
unit: percent
version: 1.1.0
