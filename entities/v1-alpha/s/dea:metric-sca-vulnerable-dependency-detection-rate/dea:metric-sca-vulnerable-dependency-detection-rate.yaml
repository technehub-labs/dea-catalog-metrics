formula_definition:
  formula_id: dea:formula-sca-vulnerable-dependency-detection-rate
  expression: SCAVDR = Known Vulnerable Dependencies Detected before Release / Total Found
  inputs:
  - name: Known Vulnerable Dependencies Detected before Release
  - name: Total Found
