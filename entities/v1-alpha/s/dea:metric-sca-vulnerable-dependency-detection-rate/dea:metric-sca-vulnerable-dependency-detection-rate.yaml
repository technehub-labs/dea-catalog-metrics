id: dea:metric-sca-vulnerable-dependency-detection-rate
name: SCA - Vulnerable Dependency Detection Rate
type: Metric
description: 'SCA - Vulnerable Dependency Detection Rate (SCAVDR) measures exposure to adverse outcomes
  in the DevSecOps & Application Security Engineering domain. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. It is computed as Known Vulnerable Dependencies
  Detected before Release / Total Found, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: SCAVDR
unit: percent
version: 1.1.0
lifecycle_status: candidate
