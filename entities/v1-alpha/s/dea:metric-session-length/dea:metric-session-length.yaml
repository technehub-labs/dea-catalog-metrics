id: dea:metric-session-length
name: Session Length
type: Metric
description: 'Session Length (SGL) addresses the engagement or satisfaction of the people involved and
  is a fixture of gaming reporting. It is defined as Total Play Time / Sessions; the result is stated
  in minutes. In Gaming, it is a recognized element of the standard performance toolkit. It is a working-level
  control: thresholds trigger immediate operational response. It should be maximized within the limits
  of cost and quality trade-offs.'
