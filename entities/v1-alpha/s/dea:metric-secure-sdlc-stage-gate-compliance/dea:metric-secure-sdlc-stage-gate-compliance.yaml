id: dea:metric-secure-sdlc-stage-gate-compliance
name: Secure SDLC Stage Gate Compliance
type: Metric
description: A Application Security (AppSec) indicator, Secure SDLC Stage Gate Compliance (SSDLC) quantifies
  conformance to standards, plans, or obligations. The formula is Projects Passing Security Gates at Each
  Stage / Projects - reported in percent (%). It is a standard measure in the Software sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: SSDLC
unit: percent
