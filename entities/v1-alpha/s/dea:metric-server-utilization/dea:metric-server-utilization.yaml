id: dea:metric-server-utilization
name: Server Utilization
type: Metric
description: Server Utilization (SVU) measures the utilization or availability of capacity in the IT Service
  Management domain. Its calculation is Average CPU or Memory Utilization of Servers, measured in percent
  (%). It is applied across virtually every sector. It provides the day-to-day signal that a process is
  running as designed. Values outside the intended band, on either side, warrant investigation.
abbreviation: SVU
unit: percent
