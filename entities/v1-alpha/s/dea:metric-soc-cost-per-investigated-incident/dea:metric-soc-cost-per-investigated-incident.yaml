id: dea:metric-soc-cost-per-investigated-incident
name: SOC Cost per Investigated Incident
type: Metric
description: SOC Cost per Investigated Incident (SOCPII) addresses how efficiently resources are converted
  into outputs and is a fixture of secops & security operations center reporting. It is defined as SOC
  Operating Cost / Investigated Incidents; the result is stated in currency value. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Lower values are better; each
  reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: SOCPII
unit: currency
