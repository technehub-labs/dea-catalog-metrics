id: dea:metric-stockout-rate-deep-dive
name: Stockout Rate (Deep Dive)
type: Metric
description: A Supply Chain Standard Measures (Deep Dive) indicator, Stockout Rate (Deep Dive) (SORD)
  quantifies the quality of outputs and outcomes. Its calculation is Demand Occasions Unfilled / Demand
  Occasions, measured in percent (%). It provides the day-to-day signal that a process is running as designed.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
abbreviation: SORD
unit: percent
version: 1.1.0
