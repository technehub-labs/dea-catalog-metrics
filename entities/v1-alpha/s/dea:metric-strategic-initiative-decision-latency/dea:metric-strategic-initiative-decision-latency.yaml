id: dea:metric-strategic-initiative-decision-latency
name: Strategic Initiative Decision Latency
type: Metric
description: 'Within Enterprise Decision Effectiveness & Governance Monitoring, Strategic Initiative Decision
  Latency (SIDL) is used to gauge how efficiently resources are converted into outputs. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Days Strategic Decisions Wait beyond Target, expressed in days. It should be driven down, since lower
  readings signal healthier performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: SIDL
unit: day
