id: dea:metric-sd-wan-path-selection-efficiency
name: SD-WAN Path Selection Efficiency
type: Metric
description: 'SD-WAN Path Selection Efficiency (SPSE) addresses how efficiently resources are converted
  into outputs and is a fixture of network performance & capacity reporting. It is defined as Optimal
  Path Selections / Steering Decisions; the result is stated in percent (%). It is a working-level control:
  thresholds trigger immediate operational response. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: SPSE
unit: percent
