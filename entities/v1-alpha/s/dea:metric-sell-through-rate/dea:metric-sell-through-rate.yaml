source_credit: Public domain - no attribution required
calculation_definition: Units Sold / Units Available for Sale
formula_definition:
  formula_id: dea:formula-sell-through-rate
  expression: STR = Units Sold / Units Available for Sale
  inputs:
  - name: Units Sold
  - name: Units Available for Sale
