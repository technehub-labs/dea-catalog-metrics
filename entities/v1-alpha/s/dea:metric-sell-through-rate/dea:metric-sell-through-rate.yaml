id: dea:metric-sell-through-rate
name: Sell-Through Rate
type: Metric
description: Within Retail & E-commerce, Sell-Through Rate (STR) is used to gauge how efficiently resources
  are converted into outputs. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Units Sold / Units Available for Sale, expressed in percent (%).
  Improvement means raising this figure toward best-in-class levels. Its use is concentrated in Retail.
abbreviation: STR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- efficiency
scope_classification:
- capability
directionality: higher_is_better
management_significance:
