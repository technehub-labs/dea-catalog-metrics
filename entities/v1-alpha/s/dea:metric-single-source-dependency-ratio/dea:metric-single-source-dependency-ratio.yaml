id: dea:metric-single-source-dependency-ratio
name: Single-Source Dependency Ratio
type: Metric
description: 'Within Strategic Sourcing & Supplier Performance (Deep Dive), Single-Source Dependency Ratio
  (SSDR) is used to gauge exposure to adverse outcomes. It is computed as Critical Categories with Single
  Supplier / Critical Categories, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: SSDR
unit: percent
