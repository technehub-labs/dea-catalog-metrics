id: dea:metric-source-of-hire-effectiveness-index
name: Source of Hire Effectiveness Index
type: Metric
description: Source of Hire Effectiveness Index (SOHEI) measures how efficiently resources are converted
  into outputs in the Talent Acquisition Deep Dive domain. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Quality-Retention Adjusted Yield
  per Sourcing Channel; the result is stated in index (0-100 or normalized). Improvement means raising
  this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SOHEI
