id: dea:metric-steam-consumption-per-tonne-of-paper
name: Steam Consumption per Tonne of Paper
type: Metric
description: Steam Consumption per Tonne of Paper (SCPT) addresses how efficiently resources are converted
  into outputs and is a fixture of pulp, paper & forest products reporting. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is Steam Used / Production Tonnes,
  measured in ratio (x:1 or x). It should be driven down, since lower readings signal healthier performance.
  It originates from and is most used in Manufacturing practice.
abbreviation: SCPT
unit: ratio
version: 1.1.0
