id: dea:metric-secret-scanning-gate-pass-rate
name: Secret Scanning Gate Pass Rate
type: Metric
description: Secret Scanning Gate Pass Rate (SSGPR) addresses exposure to adverse outcomes and is a fixture
  of continuous integration reporting. Its calculation is Builds Passing Secret Scan Gate / Builds, measured
  in percent (%). It provides the day-to-day signal that a process is running as designed. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: SSGPR
unit: percent
