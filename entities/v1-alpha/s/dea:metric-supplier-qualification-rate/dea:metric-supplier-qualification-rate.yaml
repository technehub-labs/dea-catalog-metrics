id: dea:metric-supplier-qualification-rate
name: Supplier Qualification Rate
type: Metric
description: Supplier Qualification Rate (SQR) measures the quality of outputs and outcomes in the Procurement
  domain. Its value drives prioritization and resource reallocation among competing initiatives. Its calculation
  is Approved Suppliers / Suppliers Assessed, measured in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SQR
unit: percent
