id: dea:metric-s-op-meeting-cadence-compliance
name: S&OP Meeting Cadence Compliance
type: Metric
description: A Sales & Operations Planning indicator, S&OP Meeting Cadence Compliance (SMCC) quantifies
  conformance to standards, plans, or obligations. The formula is S&OP Cycles Completed per Standard /
  Cycles Due - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: SMCC
unit: percent
