id: dea:metric-skill-gap-closure-rate-l-d
name: Skill Gap Closure Rate (L&D)
type: Metric
description: A Learning & Development Effectiveness (Deep Dive) indicator, Skill Gap Closure Rate (L&D)
  (SGCR-LD) quantifies capability maturity or development. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Critical Skill Gaps Closed
  within Plan / Gaps, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: SGCR-LD
unit: percent
