id: dea:metric-standard-contract-clause-adoption-rate
name: Standard Contract Clause Adoption Rate
type: Metric
description: 'Standard Contract Clause Adoption Rate (SCCA) addresses how efficiently resources are converted
  into outputs and is a fixture of legal operations reporting. It is computed as Agreements using Standard
  Positions / Agreements, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: SCCA
unit: percent
version: 1.1.0
