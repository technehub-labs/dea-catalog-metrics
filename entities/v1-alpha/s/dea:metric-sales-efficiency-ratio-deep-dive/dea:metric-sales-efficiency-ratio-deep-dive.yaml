id: dea:metric-sales-efficiency-ratio-deep-dive
name: Sales Efficiency Ratio (Deep Dive)
type: Metric
description: Sales Efficiency Ratio (Deep Dive) (SERD) addresses how efficiently resources are converted
  into outputs and is a fixture of unit economics & growth (deep dive) reporting. Its calculation is New
  ARR / Total Sales and Marketing Cost, measured in ratio (x:1 or x). It originates from and is most used
  in Software practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: SERD
unit: ratio
