id: dea:metric-share-price-volatility
name: Share Price Volatility
type: Metric
description: Within Investor Relations & Capital Markets, Share Price Volatility (SPV) is used to gauge
  exposure to adverse outcomes. Its calculation is Annualized Standard Deviation of Daily Returns, measured
  in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Lower values are better; each reduction is an improvement. It originates from
  and is most used in Listed companies practice.
abbreviation: SPV
unit: percent
version: 1.1.0
