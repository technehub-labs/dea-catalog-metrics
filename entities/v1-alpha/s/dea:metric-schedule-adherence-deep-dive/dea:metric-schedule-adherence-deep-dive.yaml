id: dea:metric-schedule-adherence-deep-dive
name: Schedule Adherence (Deep Dive)
type: Metric
description: A Contact Center Operations (Deep Dive) indicator, Schedule Adherence (Deep Dive) (SAD-D)
  quantifies conformance to standards, plans, or obligations. Its calculation is Time in Scheduled State
  / Scheduled Time, measured in percent (%). It is applied across virtually every sector. It provides
  the day-to-day signal that a process is running as designed. It should be maximized within the limits
  of cost and quality trade-offs.
