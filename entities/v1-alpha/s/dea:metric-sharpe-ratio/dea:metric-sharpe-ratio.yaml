id: dea:metric-sharpe-ratio
name: Sharpe Ratio
type: Metric
description: 'Sharpe Ratio (SHARPE) measures the economic value created or preserved in the Investment
  Management domain. It is computed as (Portfolio Return - Risk-Free Rate) / Return Standard Deviation,
  expressed in ratio (x:1 or x). Its use is concentrated in Asset management. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
abbreviation: SHARPE
unit: ratio
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
