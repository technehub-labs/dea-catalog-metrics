id: dea:metric-sponsor-visibility-score
name: Sponsor Visibility Score
type: Metric
description: 'Sponsor Visibility Score (SVS) addresses the engagement or satisfaction of the people involved
  and is a fixture of change management reporting. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Stakeholder-Perceived Executive
  Sponsorship Rating, expressed in score (points). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: SVS
unit: score
