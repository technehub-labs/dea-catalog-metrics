id: dea:metric-spares-availability-defense
name: Spares Availability (Defense)
type: Metric
description: Spares Availability (Defense) (SAD) addresses the utilization or availability of capacity
  and is a fixture of aerospace & defense program management reporting. It is defined as Mission-Critical
  Spares in Stock / Required; the result is stated in percent (%). It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Higher values are better; gains are read
  as improvement and losses as deterioration. In Aerospace & Defense, it is a recognized element of the
  standard performance toolkit.
abbreviation: SAD
unit: percent
