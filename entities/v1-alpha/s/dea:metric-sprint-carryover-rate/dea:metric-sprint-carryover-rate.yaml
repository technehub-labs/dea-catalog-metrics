id: dea:metric-sprint-carryover-rate
name: Sprint Carryover Rate
type: Metric
description: 'Sprint Carryover Rate (SCR-AG) measures exposure to adverse outcomes in the Agile Delivery
  & Team Effectiveness domain. The formula is Stories Carried to Next Sprint / Sprint Stories - reported
  in percent (%). It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Lower values are better; each reduction is an improvement. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.'
abbreviation: SCR-AG
unit: percent
version: 1.1.0
lifecycle_status: candidate
