id: dea:metric-defect-escape-rate
name: Defect Escape Rate
type: Metric
description: Defect Escape Rate (DER) addresses the quality of outputs and outcomes and is a fixture of
  software engineering reporting. It is defined as Defects Found in Production / Total Defects Found;
  the result is stated in percent (%). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. Reduction is the goal, and
  sustained decreases indicate successful intervention.
abbreviation: DER
unit: percent
