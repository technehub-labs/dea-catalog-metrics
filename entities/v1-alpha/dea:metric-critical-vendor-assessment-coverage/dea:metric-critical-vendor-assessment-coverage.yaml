id: dea:metric-critical-vendor-assessment-coverage
name: Critical Vendor Assessment Coverage
type: Metric
description: Critical Vendor Assessment Coverage (CVAC-TP) captures exposure to adverse outcomes for organizations
  tracking third-party risk management. The formula is Critical Vendors with Current Risk Assessment /
  Critical Vendors - reported in percent (%). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: CVAC-TP
unit: percent
