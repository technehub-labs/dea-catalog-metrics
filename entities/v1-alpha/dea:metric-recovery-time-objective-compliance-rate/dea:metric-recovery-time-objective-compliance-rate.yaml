id: dea:metric-recovery-time-objective-compliance-rate
name: Recovery Time Objective Compliance Rate
type: Metric
description: 'Within Business Continuity & Disaster Recovery, Recovery Time Objective Compliance Rate
  (RTOCR) is used to gauge exposure to adverse outcomes. It is computed as Services Restored within RTO
  in Tests / Services Tested, expressed in percent (%). It is applied across virtually every sector. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
