id: dea:metric-cost-per-1-000-inference-tokens
name: Cost per 1,000 Inference Tokens
type: Metric
description: Cost per 1,000 Inference Tokens (CP1KT) measures how efficiently resources are converted
  into outputs in the Generative AI & LLM Operations domain. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Inference Spend / 1,000 Tokens Processed,
  expressed in currency per unit. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
