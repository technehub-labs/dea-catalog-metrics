id: dea:metric-claims-catastrophe-response-time
name: Claims Catastrophe Response Time
type: Metric
description: 'Claims Catastrophe Response Time (CCRT) measures how efficiently resources are converted
  into outputs in the Insurance Claims Deep Dive domain. The formula is Hours from Catastrophe Event to
  First Claim Response - reported in hours. It is a standard measure in the Insurance sector. It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
