id: dea:metric-model-prediction-accuracy
name: Model Prediction Accuracy
type: Metric
description: 'Model Prediction Accuracy (MPA) measures the quality of outputs and outcomes in the Data
  Management & Analytics domain. The formula is Correct Model Predictions / Total Predictions - reported
  in percent (%). It is applied across virtually every sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. It should be maximized within the limits
  of cost and quality trade-offs.'
