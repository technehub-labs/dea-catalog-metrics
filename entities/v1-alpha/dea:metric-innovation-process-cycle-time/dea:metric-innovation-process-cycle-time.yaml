id: dea:metric-innovation-process-cycle-time
name: Innovation Process Cycle Time
type: Metric
description: A Balanced Scorecard - Internal Process Perspective indicator, Innovation Process Cycle Time
  (IPCT-BSC) quantifies capability maturity or development. The formula is Days from Idea to Market Launch
  - reported in days. It is applied across virtually every sector. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
