id: dea:metric-markdown-rate
name: Markdown Rate
type: Metric
description: Markdown Rate (MDR) captures the economic value created or preserved for organizations tracking
  retail & e-commerce. Its calculation is Markdown Value / Gross Sales Value, measured in percent (%).
  It originates from and is most used in Retail practice. Its value drives prioritization and resource
  reallocation among competing initiatives. Reduction is the goal, and sustained decreases indicate successful
  intervention.
abbreviation: MDR
unit: percent
