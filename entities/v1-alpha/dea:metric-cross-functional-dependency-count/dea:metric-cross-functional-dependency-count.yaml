id: dea:metric-cross-functional-dependency-count
name: Cross-Functional Dependency Count
type: Metric
description: Within Operating Model & Process Health Deep Dive, Cross-Functional Dependency Count (CFDC)
  is used to gauge how efficiently resources are converted into outputs. It is computed as Process Dependencies
  Crossing Function Boundaries / Process, expressed in ratio (x:1 or x). It is reviewed at cadence by
  planning owners to correct course before issues become strategic. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
