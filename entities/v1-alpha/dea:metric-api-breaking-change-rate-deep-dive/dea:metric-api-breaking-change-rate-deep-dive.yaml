id: dea:metric-api-breaking-change-rate-deep-dive
name: API Breaking Change Rate (Deep Dive)
type: Metric
description: A API Lifecycle Management indicator, API Breaking Change Rate (Deep Dive) (APIBC) quantifies
  exposure to adverse outcomes. It is computed as Breaking Changes Released / Releases with API Changes,
  expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations demand
  immediate correction. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Software.
abbreviation: APIBC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- risk
scope_classification:
- organizational_unit
directionality: lower_is_better
management_significance:
- operational
measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Breaking Changes Released / Releases with API Changes
formula_definition:
  formula_id: dea:formula-api-breaking-change-rate-deep-dive
  expression: APIBC = Breaking Changes Released / Releases with API Changes
  inputs:
