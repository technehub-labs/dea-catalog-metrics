id: dea:metric-hazardous-waste-per-tonne-output
name: Hazardous Waste per Tonne Output
type: Metric
description: Hazardous Waste per Tonne Output (HWTO) measures environmental and social sustainability
  performance in the Chemicals & Specialty Materials domain. Its calculation is Hazardous Waste Generated
  / Production Tonnes, measured in ratio (x:1 or x). It originates from and is most used in Chemicals
  practice. Its value drives prioritization and resource reallocation among competing initiatives. Reduction
  is the goal, and sustained decreases indicate successful intervention.
