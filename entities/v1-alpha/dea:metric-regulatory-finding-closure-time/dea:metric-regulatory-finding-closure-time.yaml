id: dea:metric-regulatory-finding-closure-time
name: Regulatory Finding Closure Time
type: Metric
description: Regulatory Finding Closure Time (RFCT) addresses conformance to standards, plans, or obligations
  and is a fixture of risk & compliance reporting. Its calculation is Days from Finding to Verified Closure,
  measured in days. It is applied across virtually every sector. Its value drives prioritization and resource
  reallocation among competing initiatives. Reduction is the goal, and sustained decreases indicate successful
  intervention.
