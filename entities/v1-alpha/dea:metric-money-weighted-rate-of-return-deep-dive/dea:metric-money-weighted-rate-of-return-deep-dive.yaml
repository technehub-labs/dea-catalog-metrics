id: dea:metric-money-weighted-rate-of-return-deep-dive
name: Money-Weighted Rate of Return (Deep Dive)
type: Metric
description: 'Within Investment Management - Portfolio Operations, Money-Weighted Rate of Return (Deep
  Dive) (MWRR-D) is used to gauge how effectively a process or entity achieves its intended outcome. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is computed as Internal Rate of Return on Investor Cash Flows, expressed in percent (%). Improvement
  means raising this figure toward best-in-class levels. Its use is concentrated in Financial Services.'
