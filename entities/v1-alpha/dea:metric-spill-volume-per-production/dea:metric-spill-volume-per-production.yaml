id: dea:metric-spill-volume-per-production
name: Spill Volume per Production
type: Metric
description: 'Spill Volume per Production (SVP) measures environmental and social sustainability performance
  in the Oil & Gas domain. It is computed as Hydrocarbons Spilled / Hydrocarbons Produced, expressed in
  ratio (x:1 or x). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Lower values are better; each reduction is an improvement. Its use is concentrated in
  Oil & gas.'
abbreviation: SVP
unit: ratio
