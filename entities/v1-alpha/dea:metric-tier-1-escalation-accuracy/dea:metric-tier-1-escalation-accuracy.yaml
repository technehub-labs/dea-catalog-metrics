id: dea:metric-tier-1-escalation-accuracy
name: Tier-1 Escalation Accuracy
type: Metric
description: Tier-1 Escalation Accuracy (T1EA) addresses the quality of outputs and outcomes and is a
  fixture of secops & security operations center reporting. It is computed as Escalations Justified /
  Escalations, expressed in percent (%). Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
