id: dea:metric-appointment-no-show-rate
name: Appointment No-Show Rate
type: Metric
description: A Healthcare indicator, Appointment No-Show Rate (NSR) quantifies how efficiently resources
  are converted into outputs. It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. It is defined as Missed Appointments / Scheduled Appointments; the result
  is stated in percent (%). It should be driven down, since lower readings signal healthier performance.
  In Healthcare, it is a recognized element of the standard performance toolkit.
abbreviation: NSR
unit: percent
version: 1.1.0
lifecycle_status: candidate
