id: dea:metric-ci-compute-cost-per-build
name: CI Compute Cost per Build
type: Metric
description: 'Within Continuous Integration, CI Compute Cost per Build (CICPB) is used to gauge how efficiently
  resources are converted into outputs. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is CI Infrastructure Cost / Builds - reported in
  currency per unit. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
