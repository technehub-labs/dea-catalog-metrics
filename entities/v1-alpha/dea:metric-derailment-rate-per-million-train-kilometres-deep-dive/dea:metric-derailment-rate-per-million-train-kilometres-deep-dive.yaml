id: dea:metric-derailment-rate-per-million-train-kilometres-deep-dive
name: Derailment Rate per Million Train Kilometres (Deep Dive)
type: Metric
description: 'A Rail Freight (Deep Dive) indicator, Derailment Rate per Million Train Kilometres (Deep
  Dive) (DRMTK) quantifies exposure to adverse outcomes. It is computed as Derailments / Million Train
  Kilometres, expressed in events per thousand or million (scaled). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Lower values are better; each reduction
  is an improvement. Its use is concentrated in Rail.'
