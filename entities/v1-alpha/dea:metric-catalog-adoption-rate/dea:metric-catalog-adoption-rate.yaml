id: dea:metric-catalog-adoption-rate
name: Catalog Adoption Rate
type: Metric
description: Within Shared Services & Global Business Services, Catalog Adoption Rate (CAR-GBS) is used
  to gauge how efficiently resources are converted into outputs. Its calculation is Requests via Service
  Catalog / Total Requests, measured in percent (%). It is applied across virtually every sector. Its
  value drives prioritization and resource reallocation among competing initiatives. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: CAR-GBS
unit: percent
version: 1.1.0
lifecycle_status: candidate
