id: dea:metric-p1-incident-resolution-within-sla
name: P1 Incident Resolution within SLA
type: Metric
description: Within IT Incident & Major Problem Management, P1 Incident Resolution within SLA (P1IRSLA)
  is used to gauge conformance to standards, plans, or obligations. It is defined as P1 Incidents Resolved
  within SLA / P1 Incidents; the result is stated in percent (%). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
