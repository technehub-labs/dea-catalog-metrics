id: dea:metric-reforestation-completion-rate
name: Reforestation Completion Rate
type: Metric
description: A Pulp, Paper & Forest Products indicator, Reforestation Completion Rate (RCR-F) quantifies
  environmental and social sustainability performance. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Areas Replanted per License
  Requirement / Required, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Manufacturing practice.
