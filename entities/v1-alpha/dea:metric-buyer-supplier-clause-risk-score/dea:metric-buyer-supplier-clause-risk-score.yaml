id: dea:metric-buyer-supplier-clause-risk-score
name: Buyer-Supplier Clause Risk Score
type: Metric
description: Within Contract Lifecycle Management, Buyer-Supplier Clause Risk Score (BSCRS) is used to
  gauge exposure to adverse outcomes. It is defined as Average Risk Balance Score of Executed Terms; the
  result is stated in score (points). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
