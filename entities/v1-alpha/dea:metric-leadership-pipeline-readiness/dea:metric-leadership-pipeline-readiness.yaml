id: dea:metric-leadership-pipeline-readiness
name: Leadership Pipeline Readiness
type: Metric
description: A Learning & Development indicator, Leadership Pipeline Readiness (LPR) quantifies capability
  maturity or development. The formula is Leadership Roles with Ready Internal Candidates / Leadership
  Roles - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
