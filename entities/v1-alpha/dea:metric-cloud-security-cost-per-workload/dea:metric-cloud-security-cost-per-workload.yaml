id: dea:metric-cloud-security-cost-per-workload
name: Cloud Security Cost per Workload
type: Metric
description: Cloud Security Cost per Workload (CSCW) addresses how efficiently resources are converted
  into outputs and is a fixture of cloud security posture management reporting. It is defined as Annual
  Cloud Security Spend / Managed Workloads; the result is stated in currency per unit. It is applied across
  virtually every sector. It bridges daily operations and executive reporting, giving managers a lever
  to pull within a quarter. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: CSCW
unit: currency
