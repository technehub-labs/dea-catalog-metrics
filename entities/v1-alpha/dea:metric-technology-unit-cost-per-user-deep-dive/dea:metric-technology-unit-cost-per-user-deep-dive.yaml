id: dea:metric-technology-unit-cost-per-user-deep-dive
name: Technology Unit Cost per User (Deep Dive)
type: Metric
description: 'Technology Unit Cost per User (Deep Dive) (TUCU-D) addresses how efficiently resources are
  converted into outputs and is a fixture of it financial management & technology budgeting reporting.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is computed as Total Technology Cost / Users, expressed in currency per unit. It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.'
