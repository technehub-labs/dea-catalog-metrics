id: dea:metric-vendor-privacy-assurance-coverage
name: Vendor Privacy Assurance Coverage
type: Metric
description: Vendor Privacy Assurance Coverage (VPAC) measures exposure to adverse outcomes in the Data
  Privacy & Protection domain. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Vendors with DPAs and Assessments / Vendors Handling Personal
  Data - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: VPAC
