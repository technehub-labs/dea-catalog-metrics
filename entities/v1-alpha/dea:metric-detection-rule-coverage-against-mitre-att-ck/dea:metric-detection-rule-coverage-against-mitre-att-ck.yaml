id: dea:metric-detection-rule-coverage-against-mitre-att-ck
name: Detection Rule Coverage against MITRE ATT&CK
type: Metric
description: Within SecOps & Security Operations Center, Detection Rule Coverage against MITRE ATT&CK
  (DRCMA) is used to gauge capability maturity or development. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as ATT&CK Techniques with Detection
  Coverage / Applicable Techniques; the result is stated in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
