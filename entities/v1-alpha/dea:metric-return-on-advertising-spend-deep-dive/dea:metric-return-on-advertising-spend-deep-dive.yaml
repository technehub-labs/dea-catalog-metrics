id: dea:metric-return-on-advertising-spend-deep-dive
name: Return on Advertising Spend (Deep Dive)
type: Metric
description: 'Return on Advertising Spend (Deep Dive) (ROASDD) addresses the economic value created or
  preserved and is a fixture of marketing & advertising standard measures (deep dive) reporting. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. It
  is computed as Attributed Revenue / Advertising Spend, expressed in ratio (x:1 or x). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
