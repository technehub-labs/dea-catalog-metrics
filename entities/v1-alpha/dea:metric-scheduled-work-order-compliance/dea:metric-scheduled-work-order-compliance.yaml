id: dea:metric-scheduled-work-order-compliance
name: Scheduled Work Order Compliance
type: Metric
description: Scheduled Work Order Compliance (SWOC-F) captures conformance to standards, plans, or obligations
  for organizations tracking field service & asset performance. Its calculation is PM Work Orders Completed
  on Schedule / Scheduled, measured in percent (%). It provides the day-to-day signal that a process is
  running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
