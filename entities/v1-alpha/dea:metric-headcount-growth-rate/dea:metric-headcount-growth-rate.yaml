id: dea:metric-headcount-growth-rate
name: Headcount Growth Rate
type: Metric
description: A Human Resources indicator, Headcount Growth Rate (HGR) quantifies growth over time. It
  is defined as (Headcount_current - Headcount_prior) / Headcount_prior; the result is stated in percent
  (%). Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It is managed toward a defined target band rather than an extreme - both overshoot and undershoot can
  signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: HGR
unit: percent
version: 1.0.1
