id: dea:metric-vendor-quality-scorecard-average
name: Vendor Quality Scorecard Average
type: Metric
description: Vendor Quality Scorecard Average (VQSA) captures the quality of outputs and outcomes for
  organizations tracking outsourcing & vendor management. It is computed as Average Weighted Quality Score
  across Strategic Vendors, expressed in score (points). It is reviewed at cadence by planning owners
  to correct course before issues become strategic. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
