id: dea:metric-informed-consent-coverage-for-ai-processing
name: Informed Consent Coverage for AI Processing
type: Metric
description: 'Informed Consent Coverage for AI Processing (ICCAP) measures conformance to standards, plans,
  or obligations in the AI Ethics, Fairness & Responsible AI domain. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Processing Purposes
  with Valid Consent / Purposes, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
