id: dea:metric-review-participation-rate
name: Review Participation Rate
type: Metric
description: 'Within Code Review & Peer Quality, Review Participation Rate (RPR-PR) is used to gauge the
  engagement or satisfaction of the people involved. The formula is Engineers Contributing Reviews / Active
  Engineers - reported in percent (%). It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Higher values are better; gains are read as improvement and losses as deterioration.
  It is a standard measure in the Software sector.'
abbreviation: RPR-PR
unit: percent
