id: dea:metric-model-retirement-cycle-time
name: Model Retirement Cycle Time
type: Metric
description: 'Model Retirement Cycle Time (MRCT-AI) measures how efficiently resources are converted into
  outputs in the AI Governance & Model Risk Management domain. The formula is Days from Decommission Decision
  to Model Retired - reported in days. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
