id: dea:metric-layup-days
name: Layup Days
type: Metric
description: Layup Days (LUD) captures the utilization or availability of capacity for organizations tracking
  maritime & shipping. It bridges daily operations and executive reporting, giving managers a lever to
  pull within a quarter. It is defined as Vessel Days Idle / Total Vessel Days; the result is stated in
  percent (%). It should be driven down, since lower readings signal healthier performance. In Maritime
  & shipping, it is a recognized element of the standard performance toolkit.
abbreviation: LUD
unit: percent
