id: dea:metric-model-accuracy
name: Model Accuracy
type: Metric
description: 'Within Statistical Model Performance Diagnostics, Model Accuracy (MACC) is used to gauge
  the quality of outputs and outcomes. It is a working-level control: thresholds trigger immediate operational
  response. It is defined as Correct Predictions / Total Predictions; the result is stated in percent
  (%). Improvement means raising this figure toward best-in-class levels. In Software, it is a recognized
  element of the standard performance toolkit.'
