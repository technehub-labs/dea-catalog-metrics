id: dea:metric-agent-occupancy-rate-contact-center
name: Agent Occupancy Rate (Contact Center)
type: Metric
description: A Contact Center Standard Measures (Deep Dive) indicator, Agent Occupancy Rate (Contact Center)
  (AOR-CC) quantifies the utilization or availability of capacity. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. It is computed as Handle Time / Scheduled
  Time, expressed in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: AOR-CC
unit: percent
