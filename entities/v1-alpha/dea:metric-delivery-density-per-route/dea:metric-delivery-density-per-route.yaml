id: dea:metric-delivery-density-per-route
name: Delivery Density per Route
type: Metric
description: Within Parcel & Last-Mile Logistics (Deep Dive), Delivery Density per Route (DDPR) is used
  to gauge the utilization or availability of capacity. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It is computed as Stops / Route, expressed in count (items
  per period). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Logistics & Trade.
