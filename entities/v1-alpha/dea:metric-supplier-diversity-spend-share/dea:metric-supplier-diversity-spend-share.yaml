id: dea:metric-supplier-diversity-spend-share
name: Supplier Diversity Spend Share
type: Metric
description: 'Supplier Diversity Spend Share (SDS) measures conformance to standards, plans, or obligations
  in the Diversity, Equity & Inclusion domain. It is computed as Spend with Diverse Suppliers / Total
  Procurement Spend, expressed in percent (%). It is applied across virtually every sector. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
abbreviation: SDS
unit: percent
version: 1.1.0
