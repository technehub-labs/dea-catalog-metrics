id: dea:metric-realization-rate
name: Realization Rate
type: Metric
description: 'Realization Rate (RLZ) measures the economic value created or preserved in the Professional
  Services domain. It is computed as Fees Collected / Standard Fees Billed, expressed in percent (%).
  Its use is concentrated in Professional services. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It should be maximized within the limits of cost
  and quality trade-offs.'
abbreviation: RLZ
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
