id: dea:metric-regulatory-report-filing-timeliness
name: Regulatory Report Filing Timeliness
type: Metric
description: Regulatory Report Filing Timeliness (RRFT) addresses conformance to standards, plans, or
  obligations and is a fixture of compliance monitoring & testing reporting. It is defined as Filings
  Submitted by Deadline / Filings Due; the result is stated in percent (%). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: RRFT
unit: percent
version: 1.1.0
