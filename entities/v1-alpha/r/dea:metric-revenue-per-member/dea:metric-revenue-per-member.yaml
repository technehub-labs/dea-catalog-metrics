id: dea:metric-revenue-per-member
name: Revenue per Member
type: Metric
description: Revenue per Member (RPM-F) captures the economic value created or preserved for organizations
  tracking fitness & wellness. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Total Revenue / Average Members, measured in
  currency per unit. Improvement means raising this figure toward best-in-class levels. It originates
  from and is most used in Fitness & wellness practice.
abbreviation: RPM-F
unit: currency
