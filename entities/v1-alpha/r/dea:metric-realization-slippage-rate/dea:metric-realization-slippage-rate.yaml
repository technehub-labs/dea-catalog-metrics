id: dea:metric-realization-slippage-rate
name: Realization Slippage Rate
type: Metric
description: Within PMO & Portfolio Governance, Realization Slippage Rate (RSR-P) is used to gauge the
  economic value created or preserved. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Benefits Realized Later than Plan / Planned Benefits
  - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: RSR-P
unit: percent
