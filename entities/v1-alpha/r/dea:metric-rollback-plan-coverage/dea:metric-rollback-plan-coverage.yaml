id: dea:metric-rollback-plan-coverage
name: Rollback Plan Coverage
type: Metric
description: 'Within Network Change & Configuration Management, Rollback Plan Coverage (RBPC) is used
  to gauge exposure to adverse outcomes. The formula is Changes with Tested Rollback Plan / High-Risk
  Changes - reported in percent (%). It is applied across virtually every sector. It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. It should be maximized within
  the limits of cost and quality trade-offs.'
abbreviation: RBPC
unit: percent
version: 1.1.0
