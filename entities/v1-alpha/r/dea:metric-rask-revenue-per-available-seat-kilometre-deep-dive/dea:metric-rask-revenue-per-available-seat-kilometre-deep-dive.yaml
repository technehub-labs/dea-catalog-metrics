id: dea:metric-rask-revenue-per-available-seat-kilometre-deep-dive
name: RASK - Revenue per Available Seat Kilometre (Deep Dive)
type: Metric
description: 'Within Airline Operations (Deep Dive), RASK - Revenue per Available Seat Kilometre (Deep
  Dive) (RASK-D) is used to gauge the economic value created or preserved. It is computed as Revenue /
  ASK, expressed in currency per unit. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is concentrated in Airlines.'
