id: dea:metric-revenue-per-salesperson
name: Revenue per Salesperson
type: Metric
description: Revenue per Salesperson (RPS) captures how efficiently resources are converted into outputs
  for organizations tracking sales. It is computed as Total Revenue / Number of Salespeople, expressed
  in currency value. It is applied across virtually every sector. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. It should be maximized within the limits of
  cost and quality trade-offs.
abbreviation: RPS
unit: currency
