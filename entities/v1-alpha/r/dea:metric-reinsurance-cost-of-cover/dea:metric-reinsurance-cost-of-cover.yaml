id: dea:metric-reinsurance-cost-of-cover
name: Reinsurance Cost of Cover
type: Metric
description: Reinsurance Cost of Cover (RCC) captures the economic value created or preserved for organizations
  tracking insurance underwriting. It is defined as Reinsurance Premium Ceded / Gross Written Premium;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It is managed toward a defined target band rather than an extreme - both
  overshoot and undershoot can signal problems. In Insurance, it is a recognized element of the standard
  performance toolkit.
abbreviation: RCC
unit: percent
version: 1.1.0
