id: dea:metric-regulatory-submission-acceptance-rate
name: Regulatory Submission Acceptance Rate
type: Metric
description: Regulatory Submission Acceptance Rate (RSAR) measures the quality of outputs and outcomes
  in the Pharma R&D & Clinical Trials domain. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Submissions Accepted First Time
  / Submissions, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  It originates from and is most used in Pharmaceuticals practice.
abbreviation: RSAR
unit: percent
version: 1.1.0
lifecycle_status: candidate
