id: dea:metric-restructuring-success-rate
name: Restructuring Success Rate
type: Metric
description: A Credit & Collections Risk (Enterprise) indicator, Restructuring Success Rate (RSR-CC) quantifies
  the quality of outputs and outcomes. It is defined as Restructured Accounts Remaining Current / Restructured;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: RSR-CC
unit: percent
version: 1.1.0
