id: dea:metric-recovery-time-objective-attainment
name: Recovery Time Objective Attainment
type: Metric
description: 'Recovery Time Objective Attainment (RTOA) addresses exposure to adverse outcomes and is
  a fixture of business resilience & continuity reporting. It is computed as Recoveries within RTO in
  Tests or Events / Recovery Tests, expressed in percent (%). It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: RTOA
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- governance
purpose_classification:
- risk
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
- strategic
measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Recoveries within RTO in Tests or Events / Recovery Tests
formula_definition:
  formula_id: dea:formula-recovery-time-objective-attainment
  expression: RTOA = Recoveries within RTO in Tests or Events / Recovery Tests
  inputs:
