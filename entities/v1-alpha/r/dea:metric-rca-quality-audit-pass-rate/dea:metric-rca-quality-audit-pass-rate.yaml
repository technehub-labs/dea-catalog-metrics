id: dea:metric-rca-quality-audit-pass-rate
name: RCA Quality Audit Pass Rate
type: Metric
description: RCA Quality Audit Pass Rate (RQAPR) addresses the quality of outputs and outcomes and is
  a fixture of it incident & major problem management reporting. Its calculation is RCAs Meeting Quality
  Bar / Audited, measured in percent (%). It is applied across virtually every sector. Its value drives
  prioritization and resource reallocation among competing initiatives. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: RQAPR
unit: percent
