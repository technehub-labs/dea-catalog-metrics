id: dea:metric-rollback-mean-time
name: Rollback Mean Time
type: Metric
description: 'Rollback Mean Time (RMT-CD) measures how efficiently resources are converted into outputs
  in the Continuous Delivery & Deployment domain. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Minutes to Execute Rollback; the result is stated in minutes.
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
abbreviation: RMT-CD
unit: minute
