id: dea:metric-robots-per-10-000-employees
name: Robots per 10,000 Employees
type: Metric
description: 'Robots per 10,000 Employees (RD) captures capability maturity or development for organizations
  tracking industrial automation & robotics. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Industrial Robots in Operation / Employees
  x 10,000, expressed in events per thousand or million (scaled). Improvement means raising this figure
  toward best-in-class levels. Its use is concentrated in Manufacturing.'
