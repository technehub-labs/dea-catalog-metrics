id: dea:metric-recurring-findings-rate
name: Recurring Findings Rate
type: Metric
description: Recurring Findings Rate (RFR) addresses the quality of outputs and outcomes and is a fixture
  of internal audit reporting. The formula is Findings Repeated from Prior Cycle / Total Findings - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: RFR
unit: percent
