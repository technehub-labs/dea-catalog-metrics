id: dea:metric-release-note-completeness
name: Release Note Completeness
type: Metric
description: Release Note Completeness (RNC-RM) measures the quality of outputs and outcomes in the Release
  Management & Environments domain. Its calculation is Changes Documented in Release Notes / Changes Shipped,
  measured in percent (%). It provides the day-to-day signal that a process is running as designed. Higher
  values are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: RNC-RM
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
