id: dea:metric-release-cycle-time
name: Release Cycle Time
type: Metric
description: A Release Management & Environments indicator, Release Cycle Time (RCLT-RM) quantifies how
  efficiently resources are converted into outputs. It is defined as Days between Consecutive Production
  Releases; the result is stated in days. It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Reduction is the goal, and
  sustained decreases indicate successful intervention.
abbreviation: RCLT-RM
unit: day
