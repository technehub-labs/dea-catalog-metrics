id: dea:metric-ramp-rate-of-new-teams
name: Ramp Rate of New Teams
type: Metric
description: 'Ramp Rate of New Teams (RRNT) measures capability maturity or development in the Workforce
  Planning & Productivity domain. The formula is Weeks for New Team to Reach Target Velocity - reported
  in weeks. It is applied across virtually every sector. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
