id: dea:metric-recyclable-content-share-packaging
name: Recyclable Content Share (Packaging)
type: Metric
description: 'Recyclable Content Share (Packaging) (RCS-P) captures environmental and social sustainability
  performance for organizations tracking packaging & plastics. It is computed as Recycled Content Mass
  / Total Packaging Mass, expressed in percent (%). Its use is concentrated in Manufacturing. It is a
  headline indicator: movement in it prompts leadership questions about strategy and resourcing. It should
  be maximized within the limits of cost and quality trade-offs.'
abbreviation: RCS-P
unit: percent
version: 1.1.0
lifecycle_status: candidate
