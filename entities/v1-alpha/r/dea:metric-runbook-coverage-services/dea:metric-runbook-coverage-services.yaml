id: dea:metric-runbook-coverage-services
name: Runbook Coverage (Services)
type: Metric
description: 'Runbook Coverage (Services) (RBCS) addresses capability maturity or development and is a
  fixture of sre & observability standard measures reporting. The formula is Critical Alerts with Runbook
  / Critical Alert Types - reported in percent (%). It is monitored close to the work: teams act on it
  within a shift, sprint, or daily review. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Software sector.'
abbreviation: RBCS
unit: percent
