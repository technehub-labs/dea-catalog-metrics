id: dea:metric-refinery-yield-clean-products
name: Refinery Yield - Clean Products
type: Metric
description: A Oil & Gas Downstream & Refining indicator, Refinery Yield - Clean Products (RYCP) quantifies
  how efficiently resources are converted into outputs. Its calculation is Clean Product Barrels / Crude
  Barrels, measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. It originates from and is most used in Oil & Gas practice.
abbreviation: RYCP
unit: percent
version: 1.1.0
