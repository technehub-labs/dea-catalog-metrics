id: dea:metric-reliability-at-time-t-r-t
name: Reliability at Time t (R(t))
type: Metric
description: 'Reliability at Time t (R(t)) (RTT) addresses exposure to adverse outcomes and is a fixture
  of reliability & maintainability engineering (deep dive) reporting. It is computed as exp(-Integral
  of Hazard Function to t), expressed in percent (%). It is applied across virtually every sector. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: RTT
unit: percent
version: 1.1.0
