id: dea:metric-release-rollback-automation-rate
name: Release Rollback Automation Rate
type: Metric
description: Release Rollback Automation Rate (RRA) captures how efficiently resources are converted into
  outputs for organizations tracking sre & observability standard measures. It is computed as Rollbacks
  Executed via Automated Path / Rollbacks, expressed in percent (%). Its use is concentrated in Software.
  Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: RRA
unit: percent
version: 1.1.0
