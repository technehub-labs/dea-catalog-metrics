id: dea:metric-regulatory-change-response-time
name: Regulatory Change Response Time
type: Metric
description: Regulatory Change Response Time (RCRT) captures conformance to standards, plans, or obligations
  for organizations tracking risk & compliance. It is defined as Days from Regulatory Publication to Compliance
  Action; the result is stated in days. It is applied across virtually every sector. It bridges daily
  operations and executive reporting, giving managers a lever to pull within a quarter. Reduction is the
  goal, and sustained decreases indicate successful intervention.
abbreviation: RCRT
