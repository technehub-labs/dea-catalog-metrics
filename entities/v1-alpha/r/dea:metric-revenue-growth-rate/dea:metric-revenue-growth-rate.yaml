id: dea:metric-revenue-growth-rate
name: Revenue Growth Rate
type: Metric
description: Within Finance & Accounting, Revenue Growth Rate (RGR) is used to gauge growth over time.
  Its calculation is (Revenue_current - Revenue_prior) / Revenue_prior, measured in percent (%). It is
  applied across virtually every sector. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. It should be maximized within the limits of cost and
  quality trade-offs.
abbreviation: RGR
unit: percent
version: 1.1.0
lifecycle_status: candidate
