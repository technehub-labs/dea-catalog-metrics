id: dea:metric-risk-survey-completion-rate
name: Risk Survey Completion Rate
type: Metric
description: 'Risk Survey Completion Rate (RSCR) measures conformance to standards, plans, or obligations
  in the Insurance Underwriting domain. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Surveys Completed before Binding / Risks Requiring Survey -
  reported in percent (%). Improvement means raising this figure toward best-in-class levels. It is a
  standard measure in the Insurance sector.'
abbreviation: RSCR
unit: percent
version: 1.1.0
