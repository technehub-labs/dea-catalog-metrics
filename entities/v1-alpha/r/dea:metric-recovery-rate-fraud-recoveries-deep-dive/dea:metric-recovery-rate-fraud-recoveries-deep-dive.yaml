id: dea:metric-recovery-rate-fraud-recoveries-deep-dive
name: Recovery Rate - Fraud Recoveries (Deep Dive)
type: Metric
description: Recovery Rate - Fraud Recoveries (Deep Dive) (RFR-D) captures the economic value created
  or preserved for organizations tracking insurance fraud & financial crime. It is defined as Fraud Amounts
  Recovered / Fraud Losses; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. In Financial Services, it is a recognized element of the standard performance
  toolkit.
abbreviation: RFR-D
unit: percent
version: 1.1.0
