id: dea:metric-referral-rate-wealth
name: Referral Rate (Wealth)
type: Metric
description: Referral Rate (Wealth) (REFW) captures growth over time for organizations tracking wealth
  management. Its value drives prioritization and resource reallocation among competing initiatives. Its
  calculation is New Clients from Referrals / New Clients, measured in percent (%). Improvement means
  raising this figure toward best-in-class levels. It originates from and is most used in Wealth management
  practice.
abbreviation: REFW
unit: percent
