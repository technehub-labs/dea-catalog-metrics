id: dea:metric-return-on-equity-deep-dive
name: Return on Equity (Deep Dive)
type: Metric
description: Return on Equity (Deep Dive) (ROEDD) measures the economic value created or preserved in
  the Financial Statement Analysis Ratios (Deep Dive) domain. The formula is Net Income / Shareholder
  Equity - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: ROEDD
unit: percent
version: 1.1.0
