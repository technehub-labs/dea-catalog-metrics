id: dea:metric-renewal-retention-ratio-underwriting
name: Renewal Retention Ratio (Underwriting)
type: Metric
description: Renewal Retention Ratio (Underwriting) (RRR-U) addresses the retention of customers, users,
  or assets over time and is a fixture of insurance underwriting reporting. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Policies Renewed /
  Policies Eligible for Renewal; the result is stated in percent (%). Improvement means raising this figure
  toward best-in-class levels. In Insurance, it is a recognized element of the standard performance toolkit.
abbreviation: RRR-U
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
