id: dea:metric-reproducibility-test-pass-rate
name: Reproducibility Test Pass Rate
type: Metric
description: Within MLOps & Model Lifecycle Operations, Reproducibility Test Pass Rate (RTPR-M) is used
  to gauge the quality of outputs and outcomes. The formula is Experiment Runs Reproduced within Tolerance
  / Sampled - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
