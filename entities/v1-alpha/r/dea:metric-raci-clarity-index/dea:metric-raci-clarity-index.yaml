id: dea:metric-raci-clarity-index
name: RACI Clarity Index
type: Metric
description: 'A Operating Model & Decision Effectiveness indicator, RACI Clarity Index (RACI) quantifies
  capability maturity or development. The formula is Decisions with Clear Accountability / Decisions Mapped
  - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: RACI
unit: percent
