id: dea:metric-release-on-time-delivery-rate
name: Release On-Time Delivery Rate
type: Metric
description: 'Release On-Time Delivery Rate (ROTD) captures conformance to standards, plans, or obligations
  for organizations tracking release management & environments. It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. It is computed as Releases Delivered
  on Committed Date / Releases, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: ROTD
unit: percent
version: 1.1.0
