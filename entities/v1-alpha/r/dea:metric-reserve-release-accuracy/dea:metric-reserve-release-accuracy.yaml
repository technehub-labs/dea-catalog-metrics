id: dea:metric-reserve-release-accuracy
name: Reserve Release Accuracy
type: Metric
description: 'Within Actuarial & Reserving, Reserve Release Accuracy (RRA) is used to gauge exposure to
  adverse outcomes. It is computed as Reserve Releases Justified by Experience / Total Releases, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Insurance.'
abbreviation: RRA
unit: percent
