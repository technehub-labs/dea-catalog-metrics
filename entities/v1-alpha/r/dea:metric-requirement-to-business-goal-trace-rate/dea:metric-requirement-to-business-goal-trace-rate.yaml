id: dea:metric-requirement-to-business-goal-trace-rate
name: Requirement-to-Business-Goal Trace Rate
type: Metric
description: Requirement-to-Business-Goal Trace Rate (RBGT) captures the economic value created or preserved
  for organizations tracking requirements engineering & product discovery. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Requirements Linked
  to Business Goals / Requirements - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: RBGT
unit: percent
version: 1.1.0
