id: dea:metric-research-note-timeliness
name: Research Note Timeliness
type: Metric
description: Within Investment Research & Trading Operations, Research Note Timeliness (RNT-RS) is used
  to gauge how efficiently resources are converted into outputs. It is computed as Notes Published within
  Event SLA / Events, expressed in percent (%). Its use is concentrated in Financial Services. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: RNT-RS
unit: percent
