id: dea:metric-remote-diagnostics-resolution-rate
name: Remote Diagnostics Resolution Rate
type: Metric
description: 'Remote Diagnostics Resolution Rate (RDRR-F) measures how efficiently resources are converted
  into outputs in the Field Maintenance & Technical Field Service (Deep Dive) domain. It is computed as
  Resolutions via Remote Diagnostics / Diagnosable Issues, expressed in percent (%). It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
abbreviation: RDRR-F
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
