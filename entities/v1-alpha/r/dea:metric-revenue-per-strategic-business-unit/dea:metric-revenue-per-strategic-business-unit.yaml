id: dea:metric-revenue-per-strategic-business-unit
name: Revenue per Strategic Business Unit
type: Metric
description: Revenue per Strategic Business Unit (RPSBU) addresses the economic value created or preserved
  and is a fixture of strategy & portfolio reporting. Its calculation is Total Revenue / Number of Business
  Units, measured in currency value. It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: RPSBU
unit: currency
