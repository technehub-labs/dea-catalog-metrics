id: dea:metric-recovery-time-objective-attainment-deep-dive
name: Recovery Time Objective Attainment (Deep Dive)
type: Metric
description: Recovery Time Objective Attainment (Deep Dive) (RTOA-SA) captures exposure to adverse outcomes
  for organizations tracking software architecture & technical design. The formula is Actual Recovery
  Time within RTO / Recovery Events - reported in percent (%). It is applied across virtually every sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: RTOA-SA
unit: percent
version: 1.1.0
