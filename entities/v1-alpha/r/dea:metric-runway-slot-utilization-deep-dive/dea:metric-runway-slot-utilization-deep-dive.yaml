id: dea:metric-runway-slot-utilization-deep-dive
name: Runway Slot Utilization (Deep Dive)
type: Metric
description: Runway Slot Utilization (Deep Dive) (RSU-D) addresses the utilization or availability of
  capacity and is a fixture of airport operations (deep dive) reporting. Its calculation is Used Slots
  / Declared Capacity, measured in percent (%). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Aviation practice.
abbreviation: RSU-D
unit: percent
version: 1.1.0
