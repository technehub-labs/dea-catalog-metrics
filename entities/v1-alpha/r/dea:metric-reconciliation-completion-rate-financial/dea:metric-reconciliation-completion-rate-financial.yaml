type: Metric
description: 'Reconciliation Completion Rate (Financial) (RCRF) measures conformance to standards, plans,
  or obligations in the Internal Controls & Financial Reporting Integrity domain. The formula is Reconciliations
  Completed by Deadline / Reconciliations - reported in percent (%). It is applied across virtually every
  sector. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  It should be maximized within the limits of cost and quality trade-offs.'
