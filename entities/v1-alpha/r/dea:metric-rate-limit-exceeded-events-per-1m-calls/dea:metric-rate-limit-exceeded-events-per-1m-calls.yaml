id: dea:metric-rate-limit-exceeded-events-per-1m-calls
name: Rate-Limit Exceeded Events per 1M Calls
type: Metric
description: 'Within Software Product Operations (Deep Dive), Rate-Limit Exceeded Events per 1M Calls
  (RLE1M) is used to gauge the quality of outputs and outcomes. It is defined as 429 Responses / API Calls
  x 1,000,000; the result is stated in events per thousand or million (scaled). In Technology, it is a
  recognized element of the standard performance toolkit. It is a working-level control: thresholds trigger
  immediate operational response. Reduction is the goal, and sustained decreases indicate successful intervention.'
