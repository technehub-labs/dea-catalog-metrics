id: dea:metric-rework-and-scrap-rate-semiconductor-deep-dive
name: Rework and Scrap Rate (Semiconductor Deep Dive)
type: Metric
description: Rework and Scrap Rate (Semiconductor Deep Dive) (RSR-S) captures how efficiently resources
  are converted into outputs for organizations tracking semiconductor manufacturing (deep dive). It is
  defined as Reworked or Scrapped Wafers / Wafers Processed; the result is stated in percent (%). In Semiconductors,
  it is a recognized element of the standard performance toolkit. It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: RSR-S
unit: percent
