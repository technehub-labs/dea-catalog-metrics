id: dea:metric-range-penetration-ratio
name: Range Penetration Ratio
type: Metric
description: 'Range Penetration Ratio (RPR-PAY) measures conformance to standards, plans, or obligations
  in the Standard Workforce & Pay Metrics domain. The formula is (Salary - Range Minimum) / (Range Maximum
  - Minimum) - reported in percent (%). It is applied across virtually every sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. Values outside the
  intended band, on either side, warrant investigation.'
abbreviation: RPR-PAY
unit: percent
