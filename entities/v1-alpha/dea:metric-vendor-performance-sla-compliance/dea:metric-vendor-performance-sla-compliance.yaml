id: dea:metric-vendor-performance-sla-compliance
name: Vendor Performance SLA Compliance
type: Metric
description: 'A Third-Party Risk Management indicator, Vendor Performance SLA Compliance (VPSC) quantifies
  the quality of outputs and outcomes. The formula is SLAs Met by Vendors / SLAs Measured - reported in
  percent (%). It is applied across virtually every sector. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. It should be maximized within the limits of cost and
  quality trade-offs.'
