id: dea:metric-key-control-design-adequacy-rate
name: Key Control Design Adequacy Rate
type: Metric
description: Within Internal Controls & Financial Reporting Integrity, Key Control Design Adequacy Rate
  (KCDAR) is used to gauge the quality of outputs and outcomes. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Key Controls
  Assessed as Adequately Designed / Key Controls, measured in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
