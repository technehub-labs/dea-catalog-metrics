id: dea:metric-payment-reconciliation-break-rate
name: Payment Reconciliation Break Rate
type: Metric
description: 'Payment Reconciliation Break Rate (PRBR) measures the quality of outputs and outcomes in
  the Payments & Fintech domain. It is defined as Unreconciled Items / Transactions Processed; the result
  is stated in percent (%). It is a working-level control: thresholds trigger immediate operational response.
  Lower values are better; each reduction is an improvement. In Payments & fintech, it is a recognized
  element of the standard performance toolkit.'
