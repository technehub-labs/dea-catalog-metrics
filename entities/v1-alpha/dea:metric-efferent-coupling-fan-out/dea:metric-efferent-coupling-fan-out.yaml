name: Efferent Coupling (Fan-Out)
type: Metric
description: Efferent Coupling (Fan-Out) (EFFC) measures the quality of outputs and outcomes in the Code
  Quality & Static Analysis domain. Its calculation is Outbound Dependencies per Module, measured in count
  (items per period). It originates from and is most used in Software practice. It provides the day-to-day
  signal that a process is running as designed. Values outside the intended band, on either side, warrant
  investigation.
