id: dea:metric-control-environment-maturity-score
name: Control Environment Maturity Score
type: Metric
description: A Internal Controls & Financial Reporting Integrity indicator, Control Environment Maturity
  Score (CEMS) quantifies capability maturity or development. The formula is COSO-Based Maturity Rating
  of Control Environment - reported in score (points). It is applied across virtually every sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It
  should be maximized within the limits of cost and quality trade-offs.
