id: dea:metric-agency-plan-growth-attainment
name: Agency Plan Growth Attainment
type: Metric
description: Agency Plan Growth Attainment (APGA) addresses growth over time and is a fixture of insurance
  distribution & agency management reporting. It is defined as Actual Agency Growth / Planned Growth;
  the result is stated in percent (%). In Insurance, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
