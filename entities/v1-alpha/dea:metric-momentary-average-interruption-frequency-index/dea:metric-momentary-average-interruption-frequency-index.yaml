id: dea:metric-momentary-average-interruption-frequency-index
name: Momentary Average Interruption Frequency Index
type: Metric
description: Momentary Average Interruption Frequency Index (MAIFI) measures the quality of outputs and
  outcomes in the Utilities Field Operations & Grid domain. It is computed as Momentary Interruptions
  / Customers Served, expressed in times per period. Its use is concentrated in Utilities. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. Reduction is the goal,
  and sustained decreases indicate successful intervention.
abbreviation: MAIFI
unit: times
version: 1.1.0
lifecycle_status: candidate
