source_credit: IEEE Std 1366 reliability indices
calculation_definition: Momentary Interruptions / Customers Served
formula_definition:
  formula_id: dea:formula-momentary-average-interruption-frequency-index
  expression: MAIFI = Momentary Interruptions / Customers Served
  inputs:
  - name: Momentary Interruptions
  - name: Customers Served
