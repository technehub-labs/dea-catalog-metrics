source_credit: Public domain - no attribution required
calculation_definition: Documented Expert Sessions / Sessions Planned
formula_definition:
  formula_id: dea:formula-tacit-to-explicit-conversion-rate
  expression: TECR = Documented Expert Sessions / Sessions Planned
  inputs:
