id: dea:metric-tacit-to-explicit-conversion-rate
name: Tacit-to-Explicit Conversion Rate
type: Metric
description: Tacit-to-Explicit Conversion Rate (TECR) measures capability maturity or development in the
  Knowledge Management (Deep Dive) domain. It is defined as Documented Expert Sessions / Sessions Planned;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: TECR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
- capability
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
