id: dea:metric-capacity-constraint-throughput
name: Capacity Constraint Throughput
type: Metric
description: 'Capacity Constraint Throughput (CCT) measures the utilization or availability of capacity
  in the Manufacturing domain. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. The formula is Units through Constraint per Shift - reported in count (items per period).
  Improvement means raising this figure toward best-in-class levels. It is a standard measure in the Manufacturing
  sector.'
