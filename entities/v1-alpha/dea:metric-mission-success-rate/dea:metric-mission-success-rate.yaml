id: dea:metric-mission-success-rate
name: Mission Success Rate
type: Metric
description: Mission Success Rate (MSR-D) measures how effectively a process or entity achieves its intended
  outcome in the Defense & Aerospace domain. Its calculation is Missions Achieving Objectives / Missions
  Executed, measured in percent (%). It originates from and is most used in Defense & aerospace practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: MSR-D
unit: percent
