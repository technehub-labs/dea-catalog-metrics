id: dea:metric-post-merger-synergy-realization-rate
name: Post-Merger Synergy Realization Rate
type: Metric
description: Post-Merger Synergy Realization Rate (PSRR) addresses the economic value created or preserved
  and is a fixture of mergers & acquisitions reporting. It is defined as Realized Synergies / Promised
  Synergies; the result is stated in percent (%). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PSRR
unit: percent
version: 1.1.0
