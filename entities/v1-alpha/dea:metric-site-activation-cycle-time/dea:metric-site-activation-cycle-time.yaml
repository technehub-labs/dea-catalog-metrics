id: dea:metric-site-activation-cycle-time
name: Site Activation Cycle Time
type: Metric
description: 'Site Activation Cycle Time (SACT) addresses how efficiently resources are converted into
  outputs and is a fixture of pharma r&d & clinical trials reporting. It is defined as Days from Site
  Selection to Site Activation; the result is stated in days. In Pharmaceuticals, it is a recognized element
  of the standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. Reduction is the goal, and sustained decreases indicate successful intervention.'
