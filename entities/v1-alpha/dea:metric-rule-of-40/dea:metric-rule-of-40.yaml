id: dea:metric-rule-of-40
name: Rule of 40
type: Metric
description: Within Startup & Venture-Backed Business, Rule of 40 (R40) is used to gauge the economic
  value created or preserved. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Revenue Growth Percent + Profit Margin Percent,
  measured in index (0-100 or normalized). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
