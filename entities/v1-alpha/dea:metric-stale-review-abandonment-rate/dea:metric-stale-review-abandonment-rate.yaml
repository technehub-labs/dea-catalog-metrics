id: dea:metric-stale-review-abandonment-rate
name: Stale Review Abandonment Rate
type: Metric
description: Stale Review Abandonment Rate (SRAR) addresses how efficiently resources are converted into
  outputs and is a fixture of code review & peer quality reporting. It is computed as Open Reviews Abandoned
  / Opened Reviews, expressed in percent (%). Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Software.
abbreviation: SRAR
unit: percent
