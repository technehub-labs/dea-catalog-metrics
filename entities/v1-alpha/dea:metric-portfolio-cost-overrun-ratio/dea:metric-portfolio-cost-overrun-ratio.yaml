id: dea:metric-portfolio-cost-overrun-ratio
name: Portfolio Cost Overrun Ratio
type: Metric
description: Within Program & Portfolio Management, Portfolio Cost Overrun Ratio (PCOR-PPM) is used to
  gauge exposure to adverse outcomes. The formula is Portfolio Overruns / Portfolio Budget - reported
  in percent (%). It is applied across virtually every sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: PCOR-PPM
