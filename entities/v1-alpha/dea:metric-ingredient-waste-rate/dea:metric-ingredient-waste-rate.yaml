id: dea:metric-ingredient-waste-rate
name: Ingredient Waste Rate
type: Metric
description: Within Restaurants, Ingredient Waste Rate (IWR) is used to gauge how efficiently resources
  are converted into outputs. Its calculation is Wasted Ingredient Value / Ingredient Value Used, measured
  in percent (%). It originates from and is most used in Restaurants practice. It provides the day-to-day
  signal that a process is running as designed. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: IWR
unit: percent
