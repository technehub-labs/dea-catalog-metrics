id: dea:metric-modularity-reuse-rate
name: Modularity Reuse Rate
type: Metric
description: Modularity Reuse Rate (MRR-SA) addresses how efficiently resources are converted into outputs
  and is a fixture of software architecture & technical design reporting. It is defined as Shared Component
  Usage / Total Component Usage; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: MRR-SA
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- efficiency
scope_classification:
- capability
directionality: higher_is_better
management_significance:
- strategic
measurable_entity_kind: dea:ApplicationComponent
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Shared Component Usage / Total Component Usage
formula_definition:
  formula_id: dea:formula-modularity-reuse-rate
  expression: MRR-SA = Shared Component Usage / Total Component Usage
  inputs:
  - name: Shared Component Usage
  - name: Total Component Usage
