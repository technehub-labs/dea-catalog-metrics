id: dea:metric-customer-acquisition-spend-share
name: Customer Acquisition Spend Share
type: Metric
description: A Marketing & Advertising Standard Measures (Deep Dive) indicator, Customer Acquisition Spend
  Share (CASS) quantifies how efficiently resources are converted into outputs. It is defined as Acquisition
  Spend / Total Marketing Budget; the result is stated in percent (%). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is managed toward a defined target
  band rather than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: CASS
unit: percent
