id: dea:metric-cost-of-governance-ratio
name: Cost of Governance Ratio
type: Metric
description: Cost of Governance Ratio (COGR-OM) addresses how efficiently resources are converted into
  outputs and is a fixture of operating model monitoring & design effectiveness reporting. The formula
  is Governance and Coordination Cost / Operating Cost - reported in percent (%). It carries weight in
  boardroom and executive reviews, where it anchors cross-organization trade-offs. Lower values are better;
  each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: COGR-OM
unit: percent
