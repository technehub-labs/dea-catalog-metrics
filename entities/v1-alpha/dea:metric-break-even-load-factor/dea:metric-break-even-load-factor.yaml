id: dea:metric-break-even-load-factor
name: Break-even Load Factor
type: Metric
description: Break-even Load Factor (BELF) captures exposure to adverse outcomes for organizations tracking
  airline operations (deep dive). Its calculation is Load Factor Required to Cover Costs, measured in
  percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It is managed toward a defined target band rather than an extreme - both overshoot
  and undershoot can signal problems. It originates from and is most used in Airlines practice.
abbreviation: BELF
unit: percent
