id: dea:metric-clinical-guideline-adherence-rate
name: Clinical Guideline Adherence Rate
type: Metric
description: A Medical Practice & Clinical Operations indicator, Clinical Guideline Adherence Rate (CGAR)
  quantifies the quality of outputs and outcomes. It is defined as Care Decisions per Guideline / Care
  Decisions Sampled; the result is stated in percent (%). In Healthcare, it is a recognized element of
  the standard performance toolkit. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CGAR
unit: percent
