id: dea:metric-click-through-rate
name: Click-Through Rate
type: Metric
description: 'Click-Through Rate (CTR) captures how effectively a process or entity achieves its intended
  outcome for organizations tracking marketing. It is defined as Clicks / Impressions; the result is stated
  in percent (%). It is a working-level control: thresholds trigger immediate operational response. Higher
  values are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
abbreviation: CTR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- effectiveness
scope_classification:
- capability
directionality: higher_is_better
management_significance:
