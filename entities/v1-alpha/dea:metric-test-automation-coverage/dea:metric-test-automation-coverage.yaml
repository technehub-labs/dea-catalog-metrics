id: dea:metric-test-automation-coverage
name: Test Automation Coverage
type: Metric
description: 'A Software Engineering indicator, Test Automation Coverage (TAC) quantifies capability maturity
  or development. The formula is Automated Test Cases / Total Test Cases - reported in percent (%). It
  guides mid-horizon planning: portfolio, program, and function owners act on it between review cycles.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: TAC
unit: percent
