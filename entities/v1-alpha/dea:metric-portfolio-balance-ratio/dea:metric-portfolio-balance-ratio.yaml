id: dea:metric-portfolio-balance-ratio
name: Portfolio Balance Ratio
type: Metric
description: Portfolio Balance Ratio (PBR) captures the economic value created or preserved for organizations
  tracking strategy & portfolio. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Growth Investment / Maintenance Investment - reported
  in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: PBR
unit: ratio
