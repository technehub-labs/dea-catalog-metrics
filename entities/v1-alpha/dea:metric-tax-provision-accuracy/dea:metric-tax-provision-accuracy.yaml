id: dea:metric-tax-provision-accuracy
name: Tax Provision Accuracy
type: Metric
description: Tax Provision Accuracy (TPA) addresses the quality of outputs and outcomes and is a fixture
  of tax & fiscal reporting. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is 1 - ABS(Provision - Final Liability) / Final Liability, measured in
  percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: TPA
unit: percent
