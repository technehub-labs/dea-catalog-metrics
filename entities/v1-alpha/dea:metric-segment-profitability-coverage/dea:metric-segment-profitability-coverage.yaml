id: dea:metric-segment-profitability-coverage
name: Segment Profitability Coverage
type: Metric
description: 'A Customer Analytics & Insights indicator, Segment Profitability Coverage (SPC-A) quantifies
  capability maturity or development. The formula is Segments with Current Profitability Model / Active
  Segments - reported in percent (%). It is applied across virtually every sector. It guides mid-horizon
  planning: portfolio, program, and function owners act on it between review cycles. It should be maximized
  within the limits of cost and quality trade-offs.'
