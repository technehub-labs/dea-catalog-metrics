id: dea:metric-financial-plan-coverage
name: Financial Plan Coverage
type: Metric
description: Financial Plan Coverage (FPC) captures how effectively a process or entity achieves its intended
  outcome for organizations tracking wealth management. It is defined as Clients with Current Written
  Financial Plan / Clients; the result is stated in percent (%). In Wealth management, it is a recognized
  element of the standard performance toolkit. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. It should be maximized within the limits of cost and quality
  trade-offs.
abbreviation: FPC
unit: percent
version: 1.1.0
