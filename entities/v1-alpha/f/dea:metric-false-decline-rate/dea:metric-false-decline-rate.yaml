id: dea:metric-false-decline-rate
name: False Decline Rate
type: Metric
description: False Decline Rate (FDR-P) addresses exposure to adverse outcomes and is a fixture of payments
  & fintech reporting. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Legitimate Transactions Declined / Legitimate Attempts - reported in percent
  (%). It should be driven down, since lower readings signal healthier performance. It is a standard measure
  in the Payments & fintech sector.
abbreviation: FDR-P
unit: percent
