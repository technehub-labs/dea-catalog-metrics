id: dea:metric-flight-completion-factor
name: Flight Completion Factor
type: Metric
description: A Airline & Transportation Standard Measures (Deep Dive) indicator, Flight Completion Factor
  (FCF-AT) quantifies the quality of outputs and outcomes. The formula is Flights Operated / Flights Scheduled
  - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Airlines & Aviation sector.
abbreviation: FCF-AT
unit: percent
