id: dea:metric-fixed-asset-turnover-statement-analysis
name: Fixed Asset Turnover (Statement Analysis)
type: Metric
description: A Financial Statement Analysis Ratios (Deep Dive) indicator, Fixed Asset Turnover (Statement
  Analysis) (FATO) quantifies how efficiently resources are converted into outputs. The formula is Revenue
  / Net Fixed Assets - reported in ratio (x:1 or x). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: FATO
unit: ratio
version: 1.1.0
