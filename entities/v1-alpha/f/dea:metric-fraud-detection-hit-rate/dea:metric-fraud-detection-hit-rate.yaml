id: dea:metric-fraud-detection-hit-rate
name: Fraud Detection Hit Rate
type: Metric
description: Fraud Detection Hit Rate (FDHR) addresses exposure to adverse outcomes and is a fixture of
  insurance claims deep dive reporting. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Confirmed Fraud Cases / Cases Referred for Investigation;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  In Insurance, it is a recognized element of the standard performance toolkit.
abbreviation: FDHR
unit: percent
version: 1.1.0
lifecycle_status: candidate
