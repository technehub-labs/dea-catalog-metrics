id: dea:metric-fact-check-compliance-rate
name: Fact-Check Compliance Rate
type: Metric
description: A Publishing & News Media indicator, Fact-Check Compliance Rate (FCCR-P) quantifies the quality
  of outputs and outcomes. It is defined as Stories Passing Fact-Check / Stories Checked; the result is
  stated in percent (%). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Higher values are better; gains are read as improvement and losses as deterioration. In Media
  & Entertainment, it is a recognized element of the standard performance toolkit.
abbreviation: FCCR-P
unit: percent
version: 1.1.0
