id: dea:metric-fleet-availability-transport-deep-dive
name: Fleet Availability (Transport) (Deep Dive)
type: Metric
description: 'A Airline & Transportation Standard Measures (Deep Dive) indicator, Fleet Availability (Transport)
  (Deep Dive) (FADD) quantifies the utilization or availability of capacity. It is computed as Aircraft
  Serviceable Days / Fleet Days, expressed in percent (%). Its use is concentrated in Airlines & Aviation.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: FADD
unit: percent
