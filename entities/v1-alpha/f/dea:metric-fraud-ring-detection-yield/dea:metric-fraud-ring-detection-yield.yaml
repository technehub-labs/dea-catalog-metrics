id: dea:metric-fraud-ring-detection-yield
name: Fraud Ring Detection Yield
type: Metric
description: Fraud Ring Detection Yield (FRDY) measures exposure to adverse outcomes in the Enterprise
  Fraud & Financial Crime Management domain. It is computed as Confirmed Rings Disrupted / Network Investigations,
  expressed in percent (%). It is applied across virtually every sector. It is reviewed at cadence by
  planning owners to correct course before issues become strategic. It should be maximized within the
  limits of cost and quality trade-offs.
abbreviation: FRDY
unit: percent
version: 1.1.0
