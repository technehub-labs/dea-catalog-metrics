id: dea:metric-fab-utilization-steppers-deep-dive
name: Fab Utilization - Steppers (Deep Dive)
type: Metric
description: Within Semiconductor Manufacturing (Deep Dive), Fab Utilization - Steppers (Deep Dive) (FUS-D)
  is used to gauge the utilization or availability of capacity. Its calculation is Exposure Tool Productive
  Time / Available Time, measured in percent (%). It originates from and is most used in Semiconductors
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: FUS-D
unit: percent
