id: dea:metric-fx-hedge-effectiveness-ratio
name: FX Hedge Effectiveness Ratio
type: Metric
description: Within Corporate Treasury (Deep Dive), FX Hedge Effectiveness Ratio (FXHER) is used to gauge
  exposure to adverse outcomes. It is defined as Hedge Gains or Losses vs Exposure Movement; the result
  is stated in ratio (x:1 or x). It is applied across virtually every sector. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. Values outside the intended band,
  on either side, warrant investigation.
abbreviation: FXHER
