id: dea:metric-finished-goods-availability
name: Finished Goods Availability
type: Metric
description: 'Finished Goods Availability (FGA) addresses the utilization or availability of capacity
  and is a fixture of sales & operations planning reporting. The formula is Demand Lines Fulfilled from
  Stock / Demand Lines - reported in percent (%). It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: FGA
unit: percent
