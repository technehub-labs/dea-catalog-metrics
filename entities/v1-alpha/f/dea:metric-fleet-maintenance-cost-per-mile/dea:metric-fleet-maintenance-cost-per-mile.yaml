id: dea:metric-fleet-maintenance-cost-per-mile
name: Fleet Maintenance Cost per Mile
type: Metric
description: 'Fleet Maintenance Cost per Mile (FMCM) measures how efficiently resources are converted
  into outputs in the Logistics & Transportation domain. It is a working-level control: thresholds trigger
  immediate operational response. It is defined as Total Maintenance Cost / Total Miles; the result is
  stated in currency per unit. It should be driven down, since lower readings signal healthier performance.
  In Logistics, it is a recognized element of the standard performance toolkit.'
abbreviation: FMCM
unit: currency
version: 1.1.0
