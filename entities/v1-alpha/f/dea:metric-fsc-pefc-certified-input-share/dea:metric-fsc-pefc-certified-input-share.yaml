id: dea:metric-fsc-pefc-certified-input-share
name: FSC / PEFC Certified Input Share
type: Metric
description: FSC / PEFC Certified Input Share (FCIS) measures environmental and social sustainability
  performance in the Furniture & Wood Products domain. Its calculation is Certified Timber / Timber Consumed,
  measured in percent (%). It originates from and is most used in Manufacturing practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: FCIS
unit: percent
version: 1.1.0
