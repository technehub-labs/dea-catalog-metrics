id: dea:metric-field-technician-productivity
name: Field Technician Productivity
type: Metric
description: 'Field Technician Productivity (FTP-T) captures how efficiently resources are converted into
  outputs for organizations tracking telecom field & installation. It is defined as Completed Jobs / Technician
  Day; the result is stated in ratio (x:1 or x). It is a working-level control: thresholds trigger immediate
  operational response. Higher values are better; gains are read as improvement and losses as deterioration.
  In Telecommunications, it is a recognized element of the standard performance toolkit.'
abbreviation: FTP-T
unit: ratio
version: 1.1.0
