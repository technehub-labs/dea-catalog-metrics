id: dea:metric-foreign-object-detection-rate
name: Foreign Object Detection Rate
type: Metric
description: 'Within Food & Beverage Manufacturing, Foreign Object Detection Rate (FODR) is used to gauge
  exposure to adverse outcomes. It is defined as Contaminants Detected by Inspection / Batches; the result
  is stated in events per thousand or million (scaled). It is a working-level control: thresholds trigger
  immediate operational response. It is managed toward a defined target band rather than an extreme -
  both overshoot and undershoot can signal problems. In Food & Beverage, it is a recognized element of
  the standard performance toolkit.'
