id: dea:metric-foreign-object-damage-rate
name: Foreign Object Damage Rate
type: Metric
description: 'Within Defense & Aerospace, Foreign Object Damage Rate (FODR) is used to gauge the quality
  of outputs and outcomes. It is defined as Foreign Object Damage Events / Flight Hours x 1,000; the result
  is stated in events per thousand or million (scaled). In Defense & aerospace, it is a recognized element
  of the standard performance toolkit. It is a working-level control: thresholds trigger immediate operational
  response. Reduction is the goal, and sustained decreases indicate successful intervention.'
