id: dea:metric-firmware-currency-rate
name: Firmware Currency Rate
type: Metric
description: Firmware Currency Rate (FCR-NW) captures exposure to adverse outcomes for organizations tracking
  network change & configuration management. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It is computed as Devices within Supported Firmware Baseline / Devices,
  expressed in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: FCR-NW
unit: percent
