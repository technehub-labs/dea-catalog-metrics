id: dea:metric-field-service-response-time-deep-dive
name: Field Service Response Time (Deep Dive)
type: Metric
description: 'Field Service Response Time (Deep Dive) (FSRT-D) measures how efficiently resources are
  converted into outputs in the Field Maintenance & Technical Field Service (Deep Dive) domain. It is
  a working-level control: thresholds trigger immediate operational response. It is defined as Hours from
  Dispatch to On-Site; the result is stated in hours. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: FSRT-D
unit: hour
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- efficiency
scope_classification:
- capability
directionality: lower_is_better
management_significance:
