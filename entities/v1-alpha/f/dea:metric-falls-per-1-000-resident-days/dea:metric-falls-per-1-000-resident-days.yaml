id: dea:metric-falls-per-1-000-resident-days
name: Falls per 1,000 Resident Days
type: Metric
description: Falls per 1,000 Resident Days (FPRD) measures exposure to adverse outcomes in the Elder &
  Social Care domain. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Its calculation is Falls / Resident Days x 1,000, measured in events per thousand
  or million (scaled). It should be driven down, since lower readings signal healthier performance. It
  originates from and is most used in Social care practice.
abbreviation: FPRD
