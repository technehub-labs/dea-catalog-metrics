id: dea:metric-frequency-overexposure-rate
name: Frequency Overexposure Rate
type: Metric
description: Frequency Overexposure Rate (FOR-A) addresses the quality of outputs and outcomes and is
  a fixture of advertising & media buying reporting. Its calculation is Users Exceeding Frequency Cap
  / Reached Users, measured in percent (%). It provides the day-to-day signal that a process is running
  as designed. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Media & Entertainment practice.
abbreviation: FOR-A
unit: percent
version: 1.1.0
