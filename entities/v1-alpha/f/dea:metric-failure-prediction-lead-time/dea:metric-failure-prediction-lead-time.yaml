id: dea:metric-failure-prediction-lead-time
name: Failure Prediction Lead Time
type: Metric
description: 'A Reliability & Maintainability Engineering (Deep Dive) indicator, Failure Prediction Lead
  Time (FPLT) quantifies the quality of outputs and outcomes. It is computed as Time between Predicted
  and Actual Failure, expressed in days. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
