id: dea:metric-freight-wagon-turnaround-time
name: Freight Wagon Turnaround Time
type: Metric
description: Freight Wagon Turnaround Time (FWTT) addresses how efficiently resources are converted into
  outputs and is a fixture of rail transport reporting. It is computed as Days from Loading to Return
  for Loading, expressed in days. Its use is concentrated in Rail. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: FWTT
