calculation_definition: Re-attempt Costs / Total Delivery Costs
formula_definition:
  formula_id: dea:formula-failed-delivery-re-attempt-cost-ratio
  expression: FDRC = Re-attempt Costs / Total Delivery Costs
  inputs:
