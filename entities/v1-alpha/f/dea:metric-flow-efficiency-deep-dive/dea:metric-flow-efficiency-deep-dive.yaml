id: dea:metric-flow-efficiency-deep-dive
name: Flow Efficiency (Deep Dive)
type: Metric
description: A Agile Delivery & Team Effectiveness indicator, Flow Efficiency (Deep Dive) (FE-D) quantifies
  how efficiently resources are converted into outputs. It is defined as Active Work Time / Total Lead
  Time; the result is stated in percent (%). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: FE-D
unit: percent
version: 1.1.0
