id: dea:metric-first-attempt-delivery-rate-deep-dive
name: First Attempt Delivery Rate (Deep Dive)
type: Metric
description: 'A Parcel & Last-Mile Logistics (Deep Dive) indicator, First Attempt Delivery Rate (Deep
  Dive) (FADR-D) quantifies the quality of outputs and outcomes. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Deliveries on First
  Attempt / Delivery Attempts, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Logistics & Trade.'
abbreviation: FADR-D
unit: percent
version: 1.1.0
