id: dea:metric-failover-recovery-time-network
name: Failover Recovery Time (Network)
type: Metric
description: Within Network Performance & Capacity, Failover Recovery Time (Network) (FRTN) is used to
  gauge exposure to adverse outcomes. It provides the day-to-day signal that a process is running as designed.
  Its calculation is Time to Restore Traffic over Redundant Path, measured in seconds. It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.
