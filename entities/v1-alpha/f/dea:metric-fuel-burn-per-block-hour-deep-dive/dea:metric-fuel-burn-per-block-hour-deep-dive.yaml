id: dea:metric-fuel-burn-per-block-hour-deep-dive
name: Fuel Burn per Block Hour (Deep Dive)
type: Metric
description: 'Fuel Burn per Block Hour (Deep Dive) (FPBH) addresses how efficiently resources are converted
  into outputs and is a fixture of airline & transportation standard measures (deep dive) reporting. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It is computed as Fuel Consumed / Block Hours, expressed in currency per unit. It should be driven down,
  since lower readings signal healthier performance. Its use is concentrated in Airlines & Aviation.'
abbreviation: FPBH
unit: currency
