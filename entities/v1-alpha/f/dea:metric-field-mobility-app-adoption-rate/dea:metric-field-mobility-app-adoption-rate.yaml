id: dea:metric-field-mobility-app-adoption-rate
name: Field Mobility App Adoption Rate
type: Metric
description: Field Mobility App Adoption Rate (FMAAR) captures capability maturity or development for
  organizations tracking field maintenance & technical field service (deep dive). It is computed as Technicians
  Using Digital Work Order App / Technicians, expressed in percent (%). It is applied across virtually
  every sector. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: FMAAR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- capability
scope_classification:
- capability
directionality: higher_is_better
