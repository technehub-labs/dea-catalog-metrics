calculation_definition: Technicians Using Digital Work Order App / Technicians
formula_definition:
  formula_id: dea:formula-field-mobility-app-adoption-rate
  expression: FMAAR = Technicians Using Digital Work Order App / Technicians
  inputs:
  - name: Technicians Using Digital Work Order App
  - name: Technicians
