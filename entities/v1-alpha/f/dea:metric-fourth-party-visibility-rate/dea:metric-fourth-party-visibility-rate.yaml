calculation_definition: Critical Subprocessors Disclosed and Assessed / Subprocessors Identified
formula_definition:
  formula_id: dea:formula-fourth-party-visibility-rate
  expression: FPVR = Critical Subprocessors Disclosed and Assessed / Subprocessors Identified
  inputs:
  - name: Critical Subprocessors Disclosed and Assessed
  - name: Subprocessors Identified
