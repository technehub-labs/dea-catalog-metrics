id: dea:metric-fourth-party-visibility-rate
name: Fourth-Party Visibility Rate
type: Metric
description: Fourth-Party Visibility Rate (FPVR) captures exposure to adverse outcomes for organizations
  tracking third-party risk management. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Its calculation is Critical Subprocessors Disclosed and
  Assessed / Subprocessors Identified, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: FPVR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- risk
purpose_classification:
