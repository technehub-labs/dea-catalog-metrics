id: dea:metric-float-consumption-rate
name: Float Consumption Rate
type: Metric
description: Float Consumption Rate (FCR-PM) measures exposure to adverse outcomes in the Project Management
  (Deep Dive) domain. Its value drives prioritization and resource reallocation among competing initiatives.
  Its calculation is Float Consumed / Total Float, measured in percent (%). The objective is neither maximization
  nor minimization but staying within an agreed operating band. Practitioners in nearly any industry can
  adopt it directly.
abbreviation: FCR-PM
unit: percent
version: 1.1.0
