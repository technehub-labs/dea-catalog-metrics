id: dea:metric-facility-condition-index-property
name: Facility Condition Index (Property)
type: Metric
description: Within Real Estate Portfolio & Property Management, Facility Condition Index (Property) (FCI-P)
  is used to gauge the utilization or availability of capacity. It is defined as Deferred Maintenance
  Backlog / Replacement Value; the result is stated in ratio (x:1 or x). Its trend is watched by senior
  leadership as an early signal of structural performance shifts. Lower values are better; each reduction
  is an improvement. In Real Estate, it is a recognized element of the standard performance toolkit.
abbreviation: FCI-P
