id: dea:metric-shrinkage-rate
name: Shrinkage Rate
type: Metric
description: Within Warehousing, Shrinkage Rate (ShR) is used to gauge exposure to adverse outcomes. It
  is reviewed at cadence by planning owners to correct course before issues become strategic. It is computed
  as Unexplained Inventory Loss Value / Inventory Value, expressed in percent (%). It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: ShR
unit: percent
version: 1.1.0
lifecycle_status: candidate
