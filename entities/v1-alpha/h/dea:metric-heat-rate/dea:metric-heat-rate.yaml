id: dea:metric-heat-rate
name: Heat Rate
type: Metric
description: Heat Rate (HR) addresses how efficiently resources are converted into outputs and is a fixture
  of energy & utilities reporting. It is defined as Fuel Energy Input per Unit of Electricity Generated;
  the result is stated in ratio (x:1 or x). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Lower values are better; each reduction is an improvement. In Energy
  & utilities, it is a recognized element of the standard performance toolkit.
