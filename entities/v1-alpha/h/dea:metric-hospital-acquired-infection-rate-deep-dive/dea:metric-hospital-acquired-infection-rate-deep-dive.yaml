id: dea:metric-hospital-acquired-infection-rate-deep-dive
name: Hospital-Acquired Infection Rate (Deep Dive)
type: Metric
description: A Medical Practice & Clinical Operations indicator, Hospital-Acquired Infection Rate (Deep
  Dive) (HAI-D) quantifies exposure to adverse outcomes. Its calculation is HAIs / Device or Admission
  Days, measured in events per thousand or million (scaled). It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Lower values are better; each reduction
  is an improvement. It originates from and is most used in Healthcare practice.
abbreviation: HAI-D
