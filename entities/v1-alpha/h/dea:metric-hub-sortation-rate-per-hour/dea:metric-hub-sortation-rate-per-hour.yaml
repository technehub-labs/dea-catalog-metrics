id: dea:metric-hub-sortation-rate-per-hour
name: Hub Sortation Rate per Hour
type: Metric
description: 'Within Parcel & Last-Mile Logistics (Deep Dive), Hub Sortation Rate per Hour (HSRH) is used
  to gauge how efficiently resources are converted into outputs. The formula is Parcels Sorted / Sorter
  Hour - reported in count (items per period). It is a standard measure in the Logistics & Trade sector.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should
  be maximized within the limits of cost and quality trade-offs.'
