id: dea:metric-horizon-scan-coverage-ratio
name: Horizon Scan Coverage Ratio
type: Metric
description: Within Emerging Risk & Horizon Scanning, Horizon Scan Coverage Ratio (HSCR) is used to gauge
  exposure to adverse outcomes. Its calculation is Scanned Risk Categories per Framework / Categories,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: HSCR
unit: percent
