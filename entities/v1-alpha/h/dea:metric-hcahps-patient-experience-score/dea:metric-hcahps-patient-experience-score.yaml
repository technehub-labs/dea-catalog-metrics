id: dea:metric-hcahps-patient-experience-score
name: HCAHPS Patient Experience Score
type: Metric
description: 'HCAHPS Patient Experience Score (HCAHPS) captures the engagement or satisfaction of the
  people involved for organizations tracking healthcare quality & patient safety standard measures. It
  is computed as Composite Patient Experience Survey Rating, expressed in score (points). It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is concentrated in Healthcare.'
abbreviation: HCAHPS
unit: score
