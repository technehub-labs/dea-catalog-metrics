id: dea:metric-hr-to-employee-ratio
name: HR to Employee Ratio
type: Metric
description: HR to Employee Ratio (HRER) captures how efficiently resources are converted into outputs
  for organizations tracking human resources. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. It is defined as HR FTEs / Total Employee FTEs; the result
  is stated in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: HRER
unit: ratio
