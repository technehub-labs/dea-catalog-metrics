id: dea:metric-concentration-risk-ratio
name: Concentration Risk Ratio
type: Metric
description: Within Third-Party Risk Management, Concentration Risk Ratio (CRR-TP) is used to gauge exposure
  to adverse outcomes. Its calculation is Spend with Top 10 Vendors / Total Vendor Spend, measured in
  percent (%). It is applied across virtually every sector. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: CRR-TP
unit: percent
