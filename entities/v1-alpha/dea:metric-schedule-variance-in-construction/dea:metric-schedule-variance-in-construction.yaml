id: dea:metric-schedule-variance-in-construction
name: Schedule Variance in Construction
type: Metric
description: Schedule Variance in Construction (SV-C) captures conformance to standards, plans, or obligations
  for organizations tracking construction & engineering. It is computed as (Earned Work - Planned Work)
  / Planned Work, expressed in percent (%). Its use is concentrated in Construction & engineering. It
  is reviewed at cadence by planning owners to correct course before issues become strategic. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: SV-C
unit: percent
