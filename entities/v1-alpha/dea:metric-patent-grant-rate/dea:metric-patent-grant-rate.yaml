id: dea:metric-patent-grant-rate
name: Patent Grant Rate
type: Metric
description: Patent Grant Rate (PGR) captures how effectively a process or entity achieves its intended
  outcome for organizations tracking r&d and innovation. It is defined as Patents Granted / Applications
  Filed; the result is stated in percent (%). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PGR
unit: percent
