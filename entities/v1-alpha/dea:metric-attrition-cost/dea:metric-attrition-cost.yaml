id: dea:metric-attrition-cost
name: Attrition Cost
type: Metric
description: A Human Resources indicator, Attrition Cost (AC) quantifies exposure to adverse outcomes.
  Its calculation is Sum of Separation, Replacement, and Productivity Loss Costs, measured in currency
  value. It is applied across virtually every sector. Its value drives prioritization and resource reallocation
  among competing initiatives. Reduction is the goal, and sustained decreases indicate successful intervention.
