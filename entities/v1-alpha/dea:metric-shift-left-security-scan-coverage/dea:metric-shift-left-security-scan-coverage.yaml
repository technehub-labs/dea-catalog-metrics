id: dea:metric-shift-left-security-scan-coverage
name: Shift-Left Security Scan Coverage
type: Metric
description: Shift-Left Security Scan Coverage (SLSSC) measures capability maturity or development in
  the DevSecOps & Application Security Engineering domain. Its calculation is Pipelines with Security
  Scanning at Build Time / Pipelines, measured in percent (%). It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
