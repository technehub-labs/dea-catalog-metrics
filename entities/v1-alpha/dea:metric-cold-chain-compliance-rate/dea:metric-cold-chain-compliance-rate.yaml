id: dea:metric-cold-chain-compliance-rate
name: Cold Chain Compliance Rate
type: Metric
description: Within Food & Beverage Manufacturing, Cold Chain Compliance Rate (CCCR) is used to gauge
  conformance to standards, plans, or obligations. It is computed as Temperature-Compliant Shipments /
  Shipments, expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Food & Beverage.
abbreviation: CCCR
unit: percent
