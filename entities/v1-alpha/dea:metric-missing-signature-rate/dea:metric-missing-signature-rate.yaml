id: dea:metric-missing-signature-rate
name: Missing Signature Rate
type: Metric
description: Missing Signature Rate (MSR-CL) addresses exposure to adverse outcomes and is a fixture of
  contract lifecycle management reporting. It is computed as Counterparty-Unsigned Contracts in Force
  / Contracts Sampled, expressed in percent (%). Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: MSR-CL
unit: percent
version: 1.0.1
lifecycle_status: candidate
subject_classification:
- organization
purpose_classification:
- risk
scope_classification:
- organizational_unit
directionality: lower_is_better
management_significance:
