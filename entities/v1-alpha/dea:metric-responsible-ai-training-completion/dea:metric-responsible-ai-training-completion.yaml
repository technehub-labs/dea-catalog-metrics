id: dea:metric-responsible-ai-training-completion
name: Responsible AI Training Completion
type: Metric
description: A AI Ethics, Fairness & Responsible AI indicator, Responsible AI Training Completion (RAITC)
  quantifies capability maturity or development. It is defined as Staff Completing Responsible AI Training
  / Staff in Scope; the result is stated in percent (%). It is applied across virtually every sector.
  It bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  It should be maximized within the limits of cost and quality trade-offs.
