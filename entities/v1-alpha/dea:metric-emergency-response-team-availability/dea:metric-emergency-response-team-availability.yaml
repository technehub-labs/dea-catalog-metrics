id: dea:metric-emergency-response-team-availability
name: Emergency Response Team Availability
type: Metric
description: Emergency Response Team Availability (ERTA) addresses the utilization or availability of
  capacity and is a fixture of crisis management & emergency response reporting. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It is computed as ERT
  Shifts Fully Staffed / Shifts in Period, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: ERTA
unit: percent
version: 1.1.0
