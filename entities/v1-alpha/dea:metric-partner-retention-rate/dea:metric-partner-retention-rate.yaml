id: dea:metric-partner-retention-rate
name: Partner Retention Rate
type: Metric
description: 'Partner Retention Rate (PRTN) captures the retention of customers, users, or assets over
  time for organizations tracking alliances & partnerships management. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Active Partners
  Year-over-Year / Prior Active Partners, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: PRTN
unit: percent
