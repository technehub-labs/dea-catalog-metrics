id: dea:metric-partner-retention-rate
name: Partner Retention Rate
type: Metric
description: 'Partner Retention Rate (PRTN) captures the retention of customers, users, or assets over
  time for organizations tracking alliances & partnerships management. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Active Partners
  Year-over-Year / Prior Active Partners, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: PRTN
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- strategy
purpose_classification:
- retention
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
- strategic
measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Active Partners Year-over-Year / Prior Active Partners
formula_definition:
  formula_id: dea:formula-partner-retention-rate
  expression: PRTN = Active Partners Year-over-Year / Prior Active Partners
  inputs:
  - name: Active Partners Year
  - name: over
  - name: Year
  - name: Prior Active Partners
