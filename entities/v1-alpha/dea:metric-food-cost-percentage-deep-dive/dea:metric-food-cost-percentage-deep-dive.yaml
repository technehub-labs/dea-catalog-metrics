id: dea:metric-food-cost-percentage-deep-dive
name: Food Cost Percentage (Deep Dive)
type: Metric
description: Within Restaurant Operations (Deep Dive), Food Cost Percentage (Deep Dive) (FCP-D) is used
  to gauge how efficiently resources are converted into outputs. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Food Cost / Food Sales; the result
  is stated in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. In Restaurants, it is a recognized element of the standard performance toolkit.
