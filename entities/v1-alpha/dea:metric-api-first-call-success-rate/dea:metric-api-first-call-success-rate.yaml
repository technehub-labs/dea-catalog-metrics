id: dea:metric-api-first-call-success-rate
name: API First-Call Success Rate
type: Metric
description: 'A API Lifecycle Management indicator, API First-Call Success Rate (FCSR) quantifies the
  quality of outputs and outcomes. It is a working-level control: thresholds trigger immediate operational
  response. It is defined as Consumer Integrations Succeeding on First Attempt / Integrations; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. In Software,
  it is a recognized element of the standard performance toolkit.'
abbreviation: FCSR
unit: percent
