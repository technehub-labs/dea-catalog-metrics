id: dea:metric-manufacturing-yield-devices
name: Manufacturing Yield (Devices)
type: Metric
description: 'Manufacturing Yield (Devices) (MYD) addresses the quality of outputs and outcomes and is
  a fixture of medical devices reporting. The formula is Conforming Devices / Devices Started - reported
  in percent (%). It is a standard measure in the Medical devices sector. It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. It should be maximized within the limits
  of cost and quality trade-offs.'
