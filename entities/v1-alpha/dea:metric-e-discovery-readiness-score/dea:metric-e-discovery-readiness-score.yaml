id: dea:metric-e-discovery-readiness-score
name: E-Discovery Readiness Score
type: Metric
description: E-Discovery Readiness Score (EDRS) measures capability maturity or development in the Records
  & Information Management domain. It is defined as Rubric of Indexing, Collection and Processing Readiness;
  the result is stated in score (points). It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
