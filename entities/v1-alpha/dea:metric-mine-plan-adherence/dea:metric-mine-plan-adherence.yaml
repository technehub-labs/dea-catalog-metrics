id: dea:metric-mine-plan-adherence
name: Mine Plan Adherence
type: Metric
description: 'A Mining & Metals indicator, Mine Plan Adherence (MPA) quantifies conformance to standards,
  plans, or obligations. The formula is Actual Extraction vs Plan Tonnage and Grade / Plan - reported
  in percent (%). It is a standard measure in the Mining & metals sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
