id: dea:metric-human-handoff-containment-after-handoff
name: Human Handoff Containment after Handoff
type: Metric
description: 'Human Handoff Containment after Handoff (HCHH) captures the quality of outputs and outcomes
  for organizations tracking conversational ai & chatbots. The formula is Handoffs Resolved by Agent without
  Repeat Contact / Handoffs - reported in percent (%). It is applied across virtually every sector. It
  is monitored close to the work: teams act on it within a shift, sprint, or daily review. It should be
  maximized within the limits of cost and quality trade-offs.'
