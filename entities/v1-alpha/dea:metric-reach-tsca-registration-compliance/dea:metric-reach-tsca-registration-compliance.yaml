id: dea:metric-reach-tsca-registration-compliance
name: REACH / TSCA Registration Compliance
type: Metric
description: REACH / TSCA Registration Compliance (RTCC) captures conformance to standards, plans, or
  obligations for organizations tracking chemicals & specialty materials. Its calculation is Substances
  with Current Registrations / Substances Handled, measured in percent (%). It originates from and is
  most used in Chemicals practice. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: RTCC
unit: percent
version: 1.1.0
