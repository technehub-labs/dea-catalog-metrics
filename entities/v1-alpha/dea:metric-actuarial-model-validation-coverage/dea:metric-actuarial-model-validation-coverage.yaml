id: dea:metric-actuarial-model-validation-coverage
name: Actuarial Model Validation Coverage
type: Metric
description: Within Actuarial & Reserving, Actuarial Model Validation Coverage (AMVC) is used to gauge
  conformance to standards, plans, or obligations. It is defined as Models Validated in Period / Models
  in Use; the result is stated in percent (%). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Higher values are better; gains are read as improvement and losses
  as deterioration. In Insurance, it is a recognized element of the standard performance toolkit.
