id: dea:metric-product-margin-per-bundle
name: Product Margin per Bundle
type: Metric
description: 'A Telecom Product & Bundle Management indicator, Product Margin per Bundle (PMPB) quantifies
  the economic value created or preserved. It is computed as (Bundle Revenue - Bundle Direct Cost) / Bundle
  Revenue, expressed in percent (%). Its use is concentrated in Telecommunications. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
abbreviation: PMPB
unit: percent
version: 1.0.0
