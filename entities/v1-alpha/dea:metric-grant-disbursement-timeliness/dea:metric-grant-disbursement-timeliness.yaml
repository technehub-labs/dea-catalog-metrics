id: dea:metric-grant-disbursement-timeliness
name: Grant Disbursement Timeliness
type: Metric
description: A Public Sector & Government indicator, Grant Disbursement Timeliness (GDT) quantifies conformance
  to standards, plans, or obligations. It is defined as Grants Disbursed by Target Date / Grants Approved;
  the result is stated in percent (%). In Public sector, it is a recognized element of the standard performance
  toolkit. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
