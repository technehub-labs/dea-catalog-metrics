id: dea:metric-call-setup-success-rate
name: Call Setup Success Rate
type: Metric
description: Call Setup Success Rate (CSSR) captures the quality of outputs and outcomes for organizations
  tracking telecommunications. Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. It is computed as Successfully Established Calls / Call Attempts, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Its use is concentrated
  in Telecommunications.
abbreviation: CSSR
unit: percent
