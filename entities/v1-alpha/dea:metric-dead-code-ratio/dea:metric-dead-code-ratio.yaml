id: dea:metric-dead-code-ratio
name: Dead Code Ratio
type: Metric
description: 'Dead Code Ratio (DCR-CQ) measures the quality of outputs and outcomes in the Code Quality
  & Static Analysis domain. It is a working-level control: thresholds trigger immediate operational response.
  It is defined as Unreachable or Unused Code / Total Code; the result is stated in percent (%). It should
  be driven down, since lower readings signal healthier performance. In Software, it is a recognized element
  of the standard performance toolkit.'
abbreviation: DCR-CQ
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
