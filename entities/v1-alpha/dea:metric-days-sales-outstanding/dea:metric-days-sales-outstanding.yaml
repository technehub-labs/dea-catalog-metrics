id: dea:metric-days-sales-outstanding
name: Days Sales Outstanding
type: Metric
description: Days Sales Outstanding (DSO) addresses how efficiently resources are converted into outputs
  and is a fixture of finance & accounting reporting. Its calculation is (Accounts Receivable / Revenue)
  x 365, measured in days. It is applied across virtually every sector. Its value drives prioritization
  and resource reallocation among competing initiatives. Reduction is the goal, and sustained decreases
  indicate successful intervention.
