id: dea:metric-psychological-safety-score
name: Psychological Safety Score
type: Metric
description: Psychological Safety Score (PSS-E) captures the engagement or satisfaction of the people
  involved for organizations tracking employee wellbeing. The formula is Average Team Psychological Safety
  Survey Rating - reported in score (points). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: PSS-E
