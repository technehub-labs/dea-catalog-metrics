id: dea:metric-bed-occupancy-rate
name: Bed Occupancy Rate
type: Metric
description: 'Within Healthcare, Bed Occupancy Rate (BOR2) is used to gauge the utilization or availability
  of capacity. It is computed as Occupied Bed Days / Available Bed Days, expressed in percent (%). Its
  use is concentrated in Healthcare. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Values outside the intended band, on either side, warrant investigation.'
