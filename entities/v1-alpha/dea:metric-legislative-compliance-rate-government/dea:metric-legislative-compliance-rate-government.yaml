id: dea:metric-legislative-compliance-rate-government
name: Legislative Compliance Rate (Government)
type: Metric
description: 'Within Government & Public Administration, Legislative Compliance Rate (Government) (LCR-G)
  is used to gauge conformance to standards, plans, or obligations. It is computed as Obligations Met
  on Time / Obligations, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is concentrated in Public Sector.'
