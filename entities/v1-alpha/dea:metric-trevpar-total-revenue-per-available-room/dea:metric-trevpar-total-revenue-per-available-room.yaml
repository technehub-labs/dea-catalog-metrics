id: dea:metric-trevpar-total-revenue-per-available-room
name: TRevPAR - Total Revenue per Available Room
type: Metric
description: 'TRevPAR - Total Revenue per Available Room (TRevPAR) addresses the economic value created
  or preserved and is a fixture of hotel & resort operations (deep dive) reporting. It is computed as
  Total Revenue / Available Room Nights, expressed in currency per unit. Its use is concentrated in Hospitality.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: TRevPAR
unit: currency
