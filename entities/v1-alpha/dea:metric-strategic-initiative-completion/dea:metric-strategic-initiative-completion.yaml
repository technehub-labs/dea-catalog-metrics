id: dea:metric-strategic-initiative-completion
name: Strategic Initiative Completion
type: Metric
description: Strategic Initiative Completion (SIC) measures conformance to standards, plans, or obligations
  in the Strategy & Portfolio domain. It is defined as Initiatives Completed / Initiatives Planned; the
  result is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
