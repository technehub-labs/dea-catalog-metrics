id: dea:metric-digital-maturity-index
name: Digital Maturity Index
type: Metric
description: Digital Maturity Index (DMI) addresses capability maturity or development and is a fixture
  of digital transformation reporting. The formula is Weighted Index of Strategy, Technology, Data, Process,
  Culture Dimensions - reported in index (0-100 or normalized). It is applied across virtually every sector.
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  It should be maximized within the limits of cost and quality trade-offs.
