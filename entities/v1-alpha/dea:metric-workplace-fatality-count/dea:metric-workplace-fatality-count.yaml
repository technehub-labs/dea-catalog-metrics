id: dea:metric-workplace-fatality-count
name: Workplace Fatality Count
type: Metric
description: Workplace Fatality Count (WFC) captures exposure to adverse outcomes for organizations tracking
  health & safety. The formula is Work-Related Fatalities per Period - reported in count (items per period).
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
