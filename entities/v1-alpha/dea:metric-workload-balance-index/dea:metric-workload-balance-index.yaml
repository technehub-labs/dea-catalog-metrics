id: dea:metric-workload-balance-index
name: Workload Balance Index
type: Metric
description: A Workforce Planning & Productivity indicator, Workload Balance Index (WBI-WF) quantifies
  how efficiently resources are converted into outputs. Its calculation is Distribution Variance of Load
  across Comparable Roles, measured in index (0-100 or normalized). It provides the day-to-day signal
  that a process is running as designed. Lower values are better; each reduction is an improvement. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: WBI-WF
