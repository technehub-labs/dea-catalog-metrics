id: dea:metric-rack-power-density
name: Rack Power Density
type: Metric
description: Rack Power Density (RPD) addresses the utilization or availability of capacity and is a fixture
  of data centers & cloud infrastructure reporting. It is defined as Power Draw / Rack; the result is
  stated in ratio (x:1 or x). In Technology, it is a recognized element of the standard performance toolkit.
  It bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  Values outside the intended band, on either side, warrant investigation.
