id: dea:metric-visitor-management-compliance-rate
name: Visitor Management Compliance Rate
type: Metric
description: Visitor Management Compliance Rate (VMCR) addresses conformance to standards, plans, or obligations
  and is a fixture of facility management & workplace (deep dive) reporting. It is computed as Visitors
  Processed per Policy / Visitors, expressed in percent (%). It is applied across virtually every sector.
  Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  It should be maximized within the limits of cost and quality trade-offs.
