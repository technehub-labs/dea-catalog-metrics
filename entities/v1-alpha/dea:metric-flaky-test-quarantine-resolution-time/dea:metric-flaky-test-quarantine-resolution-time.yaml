id: dea:metric-flaky-test-quarantine-resolution-time
name: Flaky Test Quarantine Resolution Time
type: Metric
description: Flaky Test Quarantine Resolution Time (FTQRT) captures the quality of outputs and outcomes
  for organizations tracking continuous integration. It is computed as Days a Test Remains Quarantined,
  expressed in days. It is applied across virtually every sector. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
