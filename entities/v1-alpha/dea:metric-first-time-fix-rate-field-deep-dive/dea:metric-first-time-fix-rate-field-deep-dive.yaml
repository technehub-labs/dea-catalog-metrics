id: dea:metric-first-time-fix-rate-field-deep-dive
name: First-Time Fix Rate - Field (Deep Dive)
type: Metric
description: First-Time Fix Rate - Field (Deep Dive) (FTFR-D) measures the quality of outputs and outcomes
  in the Field Maintenance & Technical Field Service (Deep Dive) domain. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. Its calculation is Issues
  Resolved on First Visit / Field Jobs, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
