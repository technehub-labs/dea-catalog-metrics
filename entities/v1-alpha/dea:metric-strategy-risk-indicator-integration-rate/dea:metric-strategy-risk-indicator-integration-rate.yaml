id: dea:metric-strategy-risk-indicator-integration-rate
name: Strategy Risk Indicator Integration Rate
type: Metric
description: Strategy Risk Indicator Integration Rate (SRII) captures exposure to adverse outcomes for
  organizations tracking balanced scorecard implementation & review. Its calculation is Strategic Risks
  Reflected in Scorecard Measures / Strategic Risks, measured in percent (%). It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Higher values are
  better; gains are read as improvement and losses as deterioration. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.
abbreviation: SRII
unit: percent
