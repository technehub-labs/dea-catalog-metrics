id: dea:metric-student-to-faculty-ratio
name: Student-to-Faculty Ratio
type: Metric
description: Student-to-Faculty Ratio (SFR) measures the utilization or availability of capacity in the
  Education domain. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Enrolled Students / Faculty Members - reported in ratio (x:1 or x). The objective
  is neither maximization nor minimization but staying within an agreed operating band. It is a standard
  measure in the Education sector.
