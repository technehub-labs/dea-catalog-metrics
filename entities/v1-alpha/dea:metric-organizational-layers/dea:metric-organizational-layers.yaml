id: dea:metric-organizational-layers
name: Organizational Layers
type: Metric
description: A Operating Model & Decision Effectiveness indicator, Organizational Layers (ORGL) quantifies
  how efficiently resources are converted into outputs. Its trend is watched by senior leadership as an
  early signal of structural performance shifts. It is defined as Layers from Frontline to CEO; the result
  is stated in count (items per period). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: ORGL
unit: count
