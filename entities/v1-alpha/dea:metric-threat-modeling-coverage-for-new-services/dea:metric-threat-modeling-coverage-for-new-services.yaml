id: dea:metric-threat-modeling-coverage-for-new-services
name: Threat Modeling Coverage for New Services
type: Metric
description: Threat Modeling Coverage for New Services (TMCFNS) captures exposure to adverse outcomes
  for organizations tracking devsecops & application security engineering. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as New Services with Threat
  Model before Design Sign-off / New Services; the result is stated in percent (%). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
