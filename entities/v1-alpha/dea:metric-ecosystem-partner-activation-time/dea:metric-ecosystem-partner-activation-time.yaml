id: dea:metric-ecosystem-partner-activation-time
name: Ecosystem Partner Activation Time
type: Metric
description: 'Within Corporate Venturing & Partnerships, Ecosystem Partner Activation Time (EPAT) is used
  to gauge how efficiently resources are converted into outputs. The formula is Days from Partner Agreement
  to First Joint Value Delivered - reported in days. It is applied across virtually every sector. It guides
  mid-horizon planning: portfolio, program, and function owners act on it between review cycles. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
