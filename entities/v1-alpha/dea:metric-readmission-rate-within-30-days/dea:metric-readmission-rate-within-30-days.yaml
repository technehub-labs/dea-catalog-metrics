id: dea:metric-readmission-rate-within-30-days
name: Readmission Rate within 30 Days
type: Metric
description: Within Healthcare, Readmission Rate within 30 Days (RR30) is used to gauge the quality of
  outputs and outcomes. The formula is Readmissions within 30 Days / Discharges - reported in percent
  (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Lower values are better; each reduction is an improvement. It is a standard measure in the Healthcare
  sector.
