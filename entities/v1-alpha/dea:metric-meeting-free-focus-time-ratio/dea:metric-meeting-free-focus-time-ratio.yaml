id: dea:metric-meeting-free-focus-time-ratio
name: Meeting-Free Focus Time Ratio
type: Metric
description: Meeting-Free Focus Time Ratio (MFFTR) addresses how efficiently resources are converted into
  outputs and is a fixture of workforce planning & productivity reporting. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It is computed as Deep Work
  Hours / Paid Hours, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: MFFTR
unit: percent
version: 1.1.0
