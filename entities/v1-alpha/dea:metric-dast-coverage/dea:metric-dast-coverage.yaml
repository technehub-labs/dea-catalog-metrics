id: dea:metric-dast-coverage
name: DAST Coverage
type: Metric
description: DAST Coverage (DASTC) measures exposure to adverse outcomes in the Application Security (AppSec)
  domain. It is computed as Applications Under Dynamic Testing / Internet-Facing Applications, expressed
  in percent (%). Its use is concentrated in Software. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It should be maximized within the limits of cost
  and quality trade-offs.
