id: dea:metric-risk-network-density-index
name: Risk Network Density Index
type: Metric
description: A Emerging Risk & Horizon Scanning indicator, Risk Network Density Index (RNDI) quantifies
  exposure to adverse outcomes. The formula is Connectedness of Risk Clusters in Taxonomy Network - reported
  in index (0-100 or normalized). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. It is managed toward a defined target band rather than an extreme - both
  overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
