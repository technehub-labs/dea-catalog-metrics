id: dea:metric-rework-rate
name: Rework Rate
type: Metric
description: 'Rework Rate (RWR) addresses the quality of outputs and outcomes and is a fixture of operations
  reporting. It is a working-level control: thresholds trigger immediate operational response. It is defined
  as Units Requiring Rework / Units Produced; the result is stated in percent (%). It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.'
abbreviation: RWR
unit: percent
