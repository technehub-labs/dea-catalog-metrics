id: dea:metric-agent-licensing-compliance-rate
name: Agent Licensing Compliance Rate
type: Metric
description: 'Agent Licensing Compliance Rate (ALCR) addresses conformance to standards, plans, or obligations
  and is a fixture of insurance distribution & agency management reporting. It is a working-level control:
  thresholds trigger immediate operational response. It is defined as Agents with Valid Licenses / Appointed
  Agents; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Insurance, it is a recognized element of the standard performance toolkit.'
abbreviation: ALCR
unit: percent
version: 1.1.0
lifecycle_status: candidate
