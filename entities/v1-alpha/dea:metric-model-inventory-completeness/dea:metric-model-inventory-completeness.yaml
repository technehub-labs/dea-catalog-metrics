id: dea:metric-model-inventory-completeness
name: Model Inventory Completeness
type: Metric
description: Model Inventory Completeness (MIC-AI) addresses conformance to standards, plans, or obligations
  and is a fixture of ai governance & model risk management reporting. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Documented Models
  in Inventory / Deployed Models - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
