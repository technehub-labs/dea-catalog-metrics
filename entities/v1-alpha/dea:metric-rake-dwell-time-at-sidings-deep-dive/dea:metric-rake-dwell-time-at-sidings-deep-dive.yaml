id: dea:metric-rake-dwell-time-at-sidings-deep-dive
name: Rake Dwell Time at Sidings (Deep Dive)
type: Metric
description: A Rail Freight (Deep Dive) indicator, Rake Dwell Time at Sidings (Deep Dive) (RDT-D) quantifies
  how efficiently resources are converted into outputs. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Hours at Sidings per Trip, measured in hours. It should be
  driven down, since lower readings signal healthier performance. It originates from and is most used
  in Rail practice.
