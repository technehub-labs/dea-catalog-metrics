id: dea:metric-inventory-record-accuracy-deep-dive
name: Inventory Record Accuracy (Deep Dive)
type: Metric
description: Within Supply Chain Standard Measures (Deep Dive), Inventory Record Accuracy (Deep Dive)
  (IRA-DD) is used to gauge the quality of outputs and outcomes. Its calculation is Bins Matching System
  Count / Bins Sampled, measured in percent (%). It provides the day-to-day signal that a process is running
  as designed. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: IRA-DD
unit: percent
