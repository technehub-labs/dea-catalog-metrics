id: dea:metric-risk-exposure-value
name: Risk Exposure Value
type: Metric
description: Risk Exposure Value (REV) measures exposure to adverse outcomes in the Risk & Compliance
  domain. Its calculation is Sum of (Likelihood x Impact) across Key Risks, measured in currency value.
  It is applied across virtually every sector. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: REV
unit: currency
