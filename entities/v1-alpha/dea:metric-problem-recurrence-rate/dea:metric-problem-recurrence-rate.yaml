id: dea:metric-problem-recurrence-rate
name: Problem Recurrence Rate
type: Metric
description: 'Problem Recurrence Rate (PRR) captures the quality of outputs and outcomes for organizations
  tracking it service management. The formula is Recurring Incidents / Total Incidents - reported in percent
  (%). It is applied across virtually every sector. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Reduction is the goal, and sustained decreases
  indicate successful intervention.'
