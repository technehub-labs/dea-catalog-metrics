id: dea:metric-booking-conversion-rate-travel
name: Booking Conversion Rate (Travel)
type: Metric
description: Booking Conversion Rate (Travel) (BCR-T) captures how effectively a process or entity achieves
  its intended outcome for organizations tracking travel & tourism. It is defined as Completed Bookings
  / Search Sessions; the result is stated in percent (%). In Travel & tourism, it is a recognized element
  of the standard performance toolkit. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It should be maximized within the limits of cost and quality trade-offs.
