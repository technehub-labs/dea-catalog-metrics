id: dea:metric-o-m-cost-per-megawatt
name: O&M Cost per Megawatt
type: Metric
description: O&M Cost per Megawatt (OMCMW) addresses how efficiently resources are converted into outputs
  and is a fixture of energy transition & renewables reporting. It is defined as Operations and Maintenance
  Cost / Installed Capacity; the result is stated in currency per unit. In Renewable energy, it is a recognized
  element of the standard performance toolkit. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Reduction is the goal, and sustained decreases indicate successful
  intervention.
