id: dea:metric-energy-per-vehicle-produced
name: Energy per Vehicle Produced
type: Metric
description: 'Within Automotive, Energy per Vehicle Produced (EPV) is used to gauge environmental and
  social sustainability performance. The formula is Energy Consumed / Vehicles Produced - reported in
  ratio (x:1 or x). It guides mid-horizon planning: portfolio, program, and function owners act on it
  between review cycles. Lower values are better; each reduction is an improvement. It is a standard measure
  in the Automotive sector.'
