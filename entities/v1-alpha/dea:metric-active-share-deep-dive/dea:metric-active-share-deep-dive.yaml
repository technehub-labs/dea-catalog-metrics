id: dea:metric-active-share-deep-dive
name: Active Share (Deep Dive)
type: Metric
description: 'Active Share (Deep Dive) (ACTSH) measures exposure to adverse outcomes in the Investment
  Performance Measurement domain. It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. It is computed as Portfolio Holdings Differing from Benchmark / Holdings,
  expressed in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Its use is concentrated in Investment management.'
abbreviation: ACTSH
unit: percent
