id: dea:metric-cost-avoidance-realization-rate
name: Cost Avoidance Realization Rate
type: Metric
description: Within IT Financial Management & Technology Budgeting, Cost Avoidance Realization Rate (CARR-ITFM)
  is used to gauge the economic value created or preserved. Its calculation is Validated Cost Avoidance
  / Identified, measured in percent (%). It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: CARR-ITFM
unit: percent
