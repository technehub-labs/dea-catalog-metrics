id: dea:metric-digital-initiative-value-realization
name: Digital Initiative Value Realization
type: Metric
description: Digital Initiative Value Realization (DIVR) measures the economic value created or preserved
  in the Digital Transformation domain. The formula is Realized Benefits / Planned Benefits of Digital
  Portfolio - reported in percent (%). It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DIVR
unit: percent
