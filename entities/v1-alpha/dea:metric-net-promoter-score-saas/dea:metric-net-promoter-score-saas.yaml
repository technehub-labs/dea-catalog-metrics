id: dea:metric-net-promoter-score-saas
name: Net Promoter Score (SaaS)
type: Metric
description: 'A Customer Success (B2B SaaS) indicator, Net Promoter Score (SaaS) (NPS-S) quantifies the
  engagement or satisfaction of the people involved. It is computed as % Promoters - % Detractors among
  SaaS Accounts, expressed in score (points). Its use is concentrated in Software & SaaS. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It should be maximized
  within the limits of cost and quality trade-offs.'
abbreviation: NPS-S
unit: score
