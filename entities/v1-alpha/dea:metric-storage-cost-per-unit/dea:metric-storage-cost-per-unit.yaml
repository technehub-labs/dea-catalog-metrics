id: dea:metric-storage-cost-per-unit
name: Storage Cost per Unit
type: Metric
description: Storage Cost per Unit (SCPU) captures how efficiently resources are converted into outputs
  for organizations tracking warehousing. Its calculation is Total Storage Cost / Units Stored, measured
  in currency per unit. Its value drives prioritization and resource reallocation among competing initiatives.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
abbreviation: SCPU
unit: currency
