id: dea:metric-analyst-attrition-rate-soc
name: Analyst Attrition Rate - SOC
type: Metric
description: 'Within SecOps & Security Operations Center, Analyst Attrition Rate - SOC (AAR-SOC) is used
  to gauge the retention of customers, users, or assets over time. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Analysts Leaving
  / Analysts Employed, expressed in percent (%). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: AAR-SOC
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- technology_architecture
purpose_classification:
- retention
scope_classification:
- capability
directionality: lower_is_better
management_significance:
- strategic
measurable_entity_kind: dea:BusinessProcess
reputability_tier: industry_standard
unit_ref: dea:unit-ratio-percent
source_credit: Public domain - no attribution required
calculation_definition: Analysts Leaving / Analysts Employed
formula_definition:
  formula_id: dea:formula-analyst-attrition-rate-soc
  expression: AAR-SOC = Analysts Leaving / Analysts Employed
  inputs:
  - name: Analysts Leaving
  - name: Analysts Employed
