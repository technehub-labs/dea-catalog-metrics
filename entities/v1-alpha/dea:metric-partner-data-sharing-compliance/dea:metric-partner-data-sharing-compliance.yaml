id: dea:metric-partner-data-sharing-compliance
name: Partner Data Sharing Compliance
type: Metric
description: Partner Data Sharing Compliance (PDSC-AP) addresses conformance to standards, plans, or obligations
  and is a fixture of alliances & partnerships management reporting. Its calculation is Data Exchanges
  under Agreed Terms / Exchanges, measured in percent (%). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: PDSC-AP
