id: dea:metric-business-partner-escalation-rate
name: Business Partner Escalation Rate
type: Metric
description: 'Business Partner Escalation Rate (BPER) addresses the quality of outputs and outcomes and
  is a fixture of shared services & global business services reporting. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Escalations to Business Partner
  / Total Requests - reported in percent (%). It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: BPER
unit: percent
