id: dea:metric-energy-use-intensity-of-buildings
name: Energy Use Intensity of Buildings
type: Metric
description: Energy Use Intensity of Buildings (EUI) captures environmental and social sustainability
  performance for organizations tracking facilities & real estate. It is defined as Building Energy /
  Floor Area; the result is stated in ratio (x:1 or x). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
