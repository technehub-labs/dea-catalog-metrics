id: dea:metric-local-resident-discount-uptake
name: Local Resident Discount Uptake
type: Metric
description: Within Entertainment Venues & Attractions, Local Resident Discount Uptake (LRDU) is used
  to gauge growth over time. It is computed as Discount Tickets Sold to Locals / Local Capacity, expressed
  in percent (%). Its use is concentrated in Media & Entertainment. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. Values outside the intended band,
  on either side, warrant investigation.
abbreviation: LRDU
unit: percent
