id: dea:metric-quick-ratio-deep-dive
name: Quick Ratio (Deep Dive)
type: Metric
description: Within Financial Statement Analysis Ratios (Deep Dive), Quick Ratio (Deep Dive) (QRDD) is
  used to gauge exposure to adverse outcomes. Its calculation is (Current Assets - Inventory) / Current
  Liabilities, measured in ratio (x:1 or x). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. It is managed toward a defined target band rather
  than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: QRDD
