id: dea:metric-metal-recovery-rate-deep-dive
name: Metal Recovery Rate (Deep Dive)
type: Metric
description: A Metals & Mining Operations (Deep Dive) indicator, Metal Recovery Rate (Deep Dive) (MRR-D)
  quantifies how efficiently resources are converted into outputs. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Recovered Metal /
  Contained Metal - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Metals & Mining sector.
abbreviation: MRR-D
unit: percent
