id: dea:metric-public-exposure-rate-cloud-assets
name: Public Exposure Rate (Cloud Assets)
type: Metric
description: Within Cloud Security Posture Management, Public Exposure Rate (Cloud Assets) (PERC) is used
  to gauge exposure to adverse outcomes. It provides the day-to-day signal that a process is running as
  designed. Its calculation is Assets Publicly Exposed / Cloud Assets, measured in percent (%). It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
abbreviation: PERC
unit: percent
