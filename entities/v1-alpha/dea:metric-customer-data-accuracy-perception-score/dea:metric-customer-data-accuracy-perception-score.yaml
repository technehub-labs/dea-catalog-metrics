id: dea:metric-customer-data-accuracy-perception-score
name: Customer Data Accuracy Perception Score
type: Metric
description: Within Balanced Scorecard - Customer Perspective, Customer Data Accuracy Perception Score
  (CDAP) is used to gauge the quality of outputs and outcomes. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Customer-Rated Accuracy of Communications
  and Records, expressed in score (points). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
