id: dea:metric-key-result-attainment-average
name: Key Result Attainment Average
type: Metric
description: 'A Enterprise OKR & Performance Management indicator, Key Result Attainment Average (KRAA-OKR)
  quantifies how effectively a process or entity achieves its intended outcome. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Average
  Attainment across Key Results, expressed in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.'
