id: dea:metric-on-time-performance-rate-deep-dive
name: On-Time Performance Rate (Deep Dive)
type: Metric
description: 'On-Time Performance Rate (Deep Dive) (OTPDD) captures the quality of outputs and outcomes
  for organizations tracking airline & transportation standard measures (deep dive). It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Flights within 15 Minutes of Schedule / Flights, expressed in percent (%). Improvement means raising
  this figure toward best-in-class levels. Its use is concentrated in Airlines & Aviation.'
abbreviation: OTPDD
unit: percent
