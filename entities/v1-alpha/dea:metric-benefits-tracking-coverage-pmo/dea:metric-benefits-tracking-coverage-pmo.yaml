id: dea:metric-benefits-tracking-coverage-pmo
name: Benefits Tracking Coverage (PMO)
type: Metric
description: Within PMO & Portfolio Governance, Benefits Tracking Coverage (PMO) (BTC-P) is used to gauge
  the economic value created or preserved. It is defined as Initiatives with Tracked Benefits / Initiatives
  Closed; the result is stated in percent (%). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: BTC-P
unit: percent
