id: dea:metric-data-center-cooling-efficiency
name: Data Center Cooling Efficiency
type: Metric
description: Data Center Cooling Efficiency (DCCE) captures how efficiently resources are converted into
  outputs for organizations tracking data center & cloud operations. Its calculation is IT Load / Cooling
  Load, measured in ratio (x:1 or x). It originates from and is most used in Technology & data centers
  practice. Its value drives prioritization and resource reallocation among competing initiatives. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: DCCE
unit: ratio
