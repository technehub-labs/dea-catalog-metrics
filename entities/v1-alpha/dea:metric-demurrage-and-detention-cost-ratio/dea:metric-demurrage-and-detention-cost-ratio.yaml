id: dea:metric-demurrage-and-detention-cost-ratio
name: Demurrage and Detention Cost Ratio
type: Metric
description: 'Demurrage and Detention Cost Ratio (DDCR) measures how efficiently resources are converted
  into outputs in the International Trade & Customs domain. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. The formula is Demurrage and Detention Charges / Freight
  Spend - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Logistics & Trade sector.'
abbreviation: DDCR
unit: percent
