id: dea:metric-system-usability-scale-score
name: System Usability Scale Score
type: Metric
description: 'System Usability Scale Score (SUS-UX) measures the quality of outputs and outcomes in the
  UX & Design Systems domain. The formula is Standardized 10-Item Usability Questionnaire Score - reported
  in score (points). It guides mid-horizon planning: portfolio, program, and function owners act on it
  between review cycles. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
