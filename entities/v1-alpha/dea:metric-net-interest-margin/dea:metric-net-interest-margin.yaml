id: dea:metric-net-interest-margin
name: Net Interest Margin
type: Metric
description: A Banking & Financial Services indicator, Net Interest Margin (NIM) quantifies the economic
  value created or preserved. Its calculation is (Interest Income - Interest Expense) / Average Earning
  Assets, measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Higher values are better; gains are read as improvement and losses
  as deterioration. It originates from and is most used in Financial services practice.
abbreviation: NIM
unit: percent
