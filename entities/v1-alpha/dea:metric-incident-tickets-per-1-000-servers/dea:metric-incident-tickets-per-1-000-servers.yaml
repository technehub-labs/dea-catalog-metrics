name: Incident Tickets per 1,000 Servers
type: Metric
description: 'A Data Center & Cloud Operations indicator, Incident Tickets per 1,000 Servers (ITPS) quantifies
  the quality of outputs and outcomes. The formula is Incident Tickets / Servers x 1,000 - reported in
  events per thousand or million (scaled). It is a standard measure in the Technology & data centers sector.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
