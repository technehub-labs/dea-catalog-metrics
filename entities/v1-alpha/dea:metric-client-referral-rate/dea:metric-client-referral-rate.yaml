id: dea:metric-client-referral-rate
name: Client Referral Rate
type: Metric
description: 'Client Referral Rate (CRR-RE) addresses growth over time and is a fixture of real estate
  brokerage reporting. It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. It is computed as Clients from Referrals / New Clients, expressed in percent (%). Improvement
  means raising this figure toward best-in-class levels. Its use is concentrated in Real estate.'
