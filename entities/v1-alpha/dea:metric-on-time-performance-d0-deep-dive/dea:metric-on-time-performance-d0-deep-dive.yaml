id: dea:metric-on-time-performance-d0-deep-dive
name: On-Time Performance - D0 (Deep Dive)
type: Metric
description: Within Airline Operations (Deep Dive), On-Time Performance - D0 (Deep Dive) (OTP-D0) is used
  to gauge the quality of outputs and outcomes. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Departures within 0 Minutes of
  Schedule / Departures, measured in percent (%). Improvement means raising this figure toward best-in-class
  levels. It originates from and is most used in Airlines practice.
abbreviation: OTP-D0
unit: percent
