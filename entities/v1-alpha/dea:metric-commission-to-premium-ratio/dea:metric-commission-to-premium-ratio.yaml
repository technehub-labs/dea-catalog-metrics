id: dea:metric-commission-to-premium-ratio
name: Commission-to-Premium Ratio
type: Metric
description: 'Within Insurance Distribution & Agency Management, Commission-to-Premium Ratio (CPR-I) is
  used to gauge how efficiently resources are converted into outputs. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. It is computed as Commissions Paid
  / Written Premium, expressed in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Its use is concentrated in Insurance.'
