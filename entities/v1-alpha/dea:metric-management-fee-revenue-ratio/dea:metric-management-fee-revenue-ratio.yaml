id: dea:metric-management-fee-revenue-ratio
name: Management Fee Revenue Ratio
type: Metric
description: Within Investment Management, Management Fee Revenue Ratio (MFR) is used to gauge the economic
  value created or preserved. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Management Fees / Average Assets under Management; the result is
  stated in percent (%). Improvement means raising this figure toward best-in-class levels. In Asset management,
  it is a recognized element of the standard performance toolkit.
abbreviation: MFR
unit: percent
