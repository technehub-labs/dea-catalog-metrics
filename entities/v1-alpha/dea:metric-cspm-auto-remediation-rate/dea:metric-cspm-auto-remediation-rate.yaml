id: dea:metric-cspm-auto-remediation-rate
name: CSPM Auto-Remediation Rate
type: Metric
description: A Cloud Security Posture Management indicator, CSPM Auto-Remediation Rate (CSPMAR) quantifies
  how efficiently resources are converted into outputs. It is computed as Findings Auto-Remediated / Auto-Remediable
  Findings, expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CSPMAR
unit: percent
