id: dea:metric-architecture-roadmap-realization
name: Architecture Roadmap Realization
type: Metric
description: Within Enterprise Architecture, Architecture Roadmap Realization (ARR) is used to gauge conformance
  to standards, plans, or obligations. Its calculation is Roadmap Milestones Delivered / Milestones Planned,
  measured in percent (%). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: ARR
unit: percent
version: 1.1.0
