id: dea:metric-earned-value-schedule-compliance
name: Earned Value Schedule Compliance
type: Metric
description: A Defense & Aerospace indicator, Earned Value Schedule Compliance (EVSC) quantifies conformance
  to standards, plans, or obligations. It is defined as Earned Value / Planned Value at Milestone; the
  result is stated in ratio (x:1 or x). In Defense & aerospace, it is a recognized element of the standard
  performance toolkit. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: EVSC
