id: dea:metric-excessive-entitlement-revocation-rate
name: Excessive Entitlement Revocation Rate
type: Metric
description: A Identity & Access Management Operations indicator, Excessive Entitlement Revocation Rate
  (EERR-IAM) quantifies exposure to adverse outcomes. It is computed as Entitlements Revoked after Recertification
  Flag / Flagged, expressed in percent (%). It is reviewed at cadence by planning owners to correct course
  before issues become strategic. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: EERR-IAM
unit: percent
version: 1.1.0
