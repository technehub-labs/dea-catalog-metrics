id: dea:metric-error-budget-policy-compliance
name: Error Budget Policy Compliance
type: Metric
description: 'Within SRE & Observability Standard Measures, Error Budget Policy Compliance (EBPC) is used
  to gauge conformance to standards, plans, or obligations. It is computed as Enforcement Actions Taken
  per Policy Breach Windows / Breach Windows, expressed in percent (%). It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Higher values are better; gains are
  read as improvement and losses as deterioration. Its use is concentrated in Software.'
abbreviation: EBPC
unit: percent
version: 1.1.0
