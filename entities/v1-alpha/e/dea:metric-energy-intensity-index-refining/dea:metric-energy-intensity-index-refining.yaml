id: dea:metric-energy-intensity-index-refining
name: Energy Intensity Index - Refining
type: Metric
description: Energy Intensity Index - Refining (EIIR) addresses how efficiently resources are converted
  into outputs and is a fixture of oil & gas downstream & refining reporting. It is defined as Actual
  Energy / Solomon or Benchmark Energy; the result is stated in ratio (x:1 or x). Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Lower values are better; each
  reduction is an improvement. In Oil & Gas, it is a recognized element of the standard performance toolkit.
abbreviation: EIIR
unit: ratio
version: 1.1.0
lifecycle_status: candidate
