id: dea:metric-equipment-maintenance-uptime-deep-dive
name: Equipment Maintenance Uptime (Deep Dive)
type: Metric
description: 'Equipment Maintenance Uptime (Deep Dive) (EMU-D) captures the utilization or availability
  of capacity for organizations tracking fitness & wellness (deep dive). It is defined as Equipment Available
  / Equipment Inventory; the result is stated in percent (%). It is a working-level control: thresholds
  trigger immediate operational response. Higher values are better; gains are read as improvement and
  losses as deterioration. In Health & Fitness, it is a recognized element of the standard performance
  toolkit.'
abbreviation: EMU-D
unit: percent
version: 1.1.0
lifecycle_status: candidate
