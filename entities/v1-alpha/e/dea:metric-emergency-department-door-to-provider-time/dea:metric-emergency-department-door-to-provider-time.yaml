id: dea:metric-emergency-department-door-to-provider-time
name: Emergency Department Door-to-Provider Time
type: Metric
description: Emergency Department Door-to-Provider Time (DTP) captures how efficiently resources are converted
  into outputs for organizations tracking medical practice & clinical operations. It is computed as Minutes
  from Arrival to First Provider Contact, expressed in minutes. Front-line and delivery teams watch it
  in real time, as small deviations demand immediate correction. Lower values are better; each reduction
  is an improvement. Its use is concentrated in Healthcare.
abbreviation: DTP
unit: minute
