id: dea:metric-equity-multiplier
name: Equity Multiplier
type: Metric
description: Equity Multiplier (EQMUL) addresses exposure to adverse outcomes and is a fixture of financial
  statement analysis ratios (deep dive) reporting. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Total Assets / Total Equity; the result is
  stated in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: EQMUL
