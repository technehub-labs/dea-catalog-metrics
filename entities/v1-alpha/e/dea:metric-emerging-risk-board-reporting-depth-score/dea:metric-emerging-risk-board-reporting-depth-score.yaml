id: dea:metric-emerging-risk-board-reporting-depth-score
name: Emerging Risk Board Reporting Depth Score
type: Metric
description: Emerging Risk Board Reporting Depth Score (ERBRD) measures governance in the Emerging Risk
  & Horizon Scanning domain. It is defined as Rubric of Board Discussion Quality on Emerging Risks; the
  result is stated in score (points). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
