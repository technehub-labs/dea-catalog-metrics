id: dea:metric-excess-recovery-ratio
name: Excess Recovery Ratio
type: Metric
description: 'A Insurance Claims Deep Dive indicator, Excess Recovery Ratio (ERR) quantifies the economic
  value created or preserved. The formula is Recoveries from Excess / Reinsurers'' Share / Share - reported
  in percent (%). It is a standard measure in the Insurance sector. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. It should be maximized within the limits
  of cost and quality trade-offs.'
abbreviation: ERR
unit: percent
