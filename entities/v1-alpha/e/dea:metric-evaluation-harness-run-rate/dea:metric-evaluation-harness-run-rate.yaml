id: dea:metric-evaluation-harness-run-rate
name: Evaluation Harness Run Rate
type: Metric
description: Evaluation Harness Run Rate (EHRR-LLM) addresses conformance to standards, plans, or obligations
  and is a fixture of generative ai & llm operations reporting. Its calculation is Model Releases Evaluated
  before Deployment / Releases, measured in percent (%). It is applied across virtually every sector.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
