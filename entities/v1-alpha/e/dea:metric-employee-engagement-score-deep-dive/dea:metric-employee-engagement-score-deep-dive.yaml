id: dea:metric-employee-engagement-score-deep-dive
name: Employee Engagement Score (Deep Dive)
type: Metric
description: A Employee Engagement & Culture (Deep Dive) indicator, Employee Engagement Score (Deep Dive)
  (EESDD) quantifies the engagement or satisfaction of the people involved. It is defined as Composite
  Survey Score of Engagement Drivers; the result is stated in score (points). It is applied across virtually
  every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: EESDD
