id: dea:metric-error-budget-consumption-rate
name: Error Budget Consumption Rate
type: Metric
description: Error Budget Consumption Rate (EBCR) addresses exposure to adverse outcomes and is a fixture
  of observability & site reliability engineering reporting. It is defined as Error Budget Consumed /
  Total Error Budget; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Values
  outside the intended band, on either side, warrant investigation.
abbreviation: EBCR
unit: percent
version: 1.1.0
