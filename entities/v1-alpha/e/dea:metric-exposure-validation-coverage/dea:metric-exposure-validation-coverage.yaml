id: dea:metric-exposure-validation-coverage
name: Exposure Validation Coverage
type: Metric
description: Within Vulnerability & Exposure Management, Exposure Validation Coverage (EVC) is used to
  gauge exposure to adverse outcomes. It is reviewed at cadence by planning owners to correct course before
  issues become strategic. It is computed as Findings Validated as Exploitable / Critical Findings, expressed
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: EVC
unit: percent
version: 1.1.0
lifecycle_status: candidate
