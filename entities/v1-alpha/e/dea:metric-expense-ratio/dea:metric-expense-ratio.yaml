id: dea:metric-expense-ratio
name: Expense Ratio
type: Metric
description: Expense Ratio (ExR) measures how efficiently resources are converted into outputs in the
  Insurance domain. The formula is Underwriting Expenses / Earned Premiums - reported in percent (%).
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Lower values are better; each reduction is an improvement. It is a standard measure in the Insurance
  sector.
abbreviation: ExR
unit: percent
