source_credit: Public domain - no attribution required
calculation_definition: Available Hours of Digital Services / Total Hours
formula_definition:
  formula_id: dea:formula-e-government-service-uptime
  expression: EGSU = Available Hours of Digital Services / Total Hours
  inputs:
  - name: Available Hours of Digital Services
  - name: Total Hours
