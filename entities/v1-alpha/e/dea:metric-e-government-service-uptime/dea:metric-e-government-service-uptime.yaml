id: dea:metric-e-government-service-uptime
name: E-Government Service Uptime
type: Metric
description: E-Government Service Uptime (EGSU) measures the utilization or availability of capacity in
  the Government & Public Administration domain. It is computed as Available Hours of Digital Services
  / Total Hours, expressed in percent (%). Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is concentrated in Public Sector.
abbreviation: EGSU
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- governance
purpose_classification:
- capacity
scope_classification:
- organizational_unit
directionality: higher_is_better
