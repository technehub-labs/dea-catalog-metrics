id: dea:metric-encryption-at-rest-coverage
name: Encryption at Rest Coverage
type: Metric
description: 'Encryption at Rest Coverage (EARC) addresses exposure to adverse outcomes and is a fixture
  of cloud security posture management reporting. It is defined as Storage Services Encrypted at Rest
  / Storage Services; the result is stated in percent (%). It is a working-level control: thresholds trigger
  immediate operational response. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: EARC
unit: percent
version: 1.1.0
