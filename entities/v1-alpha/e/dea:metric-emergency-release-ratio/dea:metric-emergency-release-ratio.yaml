id: dea:metric-emergency-release-ratio
name: Emergency Release Ratio
type: Metric
description: A Release Management & Environments indicator, Emergency Release Ratio (ERR-RM) quantifies
  exposure to adverse outcomes. The formula is Emergency Releases / Total Releases - reported in percent
  (%). It is applied across virtually every sector. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Reduction is the goal, and sustained decreases indicate
  successful intervention.
abbreviation: ERR-RM
unit: percent
