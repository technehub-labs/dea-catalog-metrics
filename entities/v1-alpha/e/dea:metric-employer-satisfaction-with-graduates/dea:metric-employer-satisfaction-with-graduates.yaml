id: dea:metric-employer-satisfaction-with-graduates
name: Employer Satisfaction with Graduates
type: Metric
description: Employer Satisfaction with Graduates (ESG-ED) measures the economic value created or preserved
  in the Education & Training Outcome Standard Measures domain. Its calculation is Employer Survey Score
  of Graduate Readiness, measured in score (points). It originates from and is most used in Education
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
