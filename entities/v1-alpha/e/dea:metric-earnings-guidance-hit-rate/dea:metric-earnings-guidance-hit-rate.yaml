id: dea:metric-earnings-guidance-hit-rate
name: Earnings Guidance Hit Rate
type: Metric
description: 'Earnings Guidance Hit Rate (EGHR) addresses the quality of outputs and outcomes and is a
  fixture of investor relations & capital markets reporting. It is computed as Periods within Guidance
  Range / Periods Guided, expressed in percent (%). Its use is concentrated in Listed companies. It is
  a headline indicator: movement in it prompts leadership questions about strategy and resourcing. It
  should be maximized within the limits of cost and quality trade-offs.'
abbreviation: EGHR
unit: percent
version: 1.1.0
