id: dea:metric-underwriting-exception-rate-mortgage
name: Underwriting Exception Rate (Mortgage)
type: Metric
description: 'Underwriting Exception Rate (Mortgage) (UERM) measures exposure to adverse outcomes in the
  Real Estate & Mortgage Standard Measures domain. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Loans with Approved Underwriting Exception / Loans; the result
  is stated in percent (%). It should be driven down, since lower readings signal healthier performance.
