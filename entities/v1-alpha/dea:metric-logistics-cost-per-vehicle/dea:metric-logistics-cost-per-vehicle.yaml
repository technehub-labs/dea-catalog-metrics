id: dea:metric-logistics-cost-per-vehicle
name: Logistics Cost per Vehicle
type: Metric
description: 'Logistics Cost per Vehicle (LCV) measures how efficiently resources are converted into outputs
  in the Automotive domain. It guides mid-horizon planning: portfolio, program, and function owners act
  on it between review cycles. The formula is Total Inbound and Outbound Logistics Cost / Vehicles Sold
  - reported in currency per unit. It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Automotive sector.'
