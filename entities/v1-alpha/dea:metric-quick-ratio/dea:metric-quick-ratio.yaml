id: dea:metric-quick-ratio
name: Quick Ratio
type: Metric
description: Quick Ratio (QR) captures exposure to adverse outcomes for organizations tracking finance
  & accounting. It is defined as (Current Assets - Inventory) / Current Liabilities; the result is stated
  in ratio (x:1 or x). It bridges daily operations and executive reporting, giving managers a lever to
  pull within a quarter. It is managed toward a defined target band rather than an extreme - both overshoot
  and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
