id: dea:metric-territory-penetration-rate
name: Territory Penetration Rate
type: Metric
description: Within Franchise & Multi-site, Territory Penetration Rate (TPR) is used to gauge growth over
  time. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
