id: dea:metric-net-profit-margin-deep-dive
name: Net Profit Margin (Deep Dive)
type: Metric
description: A Financial Statement Analysis Ratios (Deep Dive) indicator, Net Profit Margin (Deep Dive)
  (NPMDD) quantifies the economic value created or preserved. It is defined as Net Income / Revenue; the
  result is stated in percent (%). It is applied across virtually every sector. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
