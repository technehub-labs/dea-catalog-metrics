id: dea:metric-show-cancellation-rate
name: Show Cancellation Rate
type: Metric
description: Show Cancellation Rate (SCR-V) addresses exposure to adverse outcomes and is a fixture of
  entertainment venues & attractions reporting. It is computed as Shows Cancelled / Shows Scheduled, expressed
  in percent (%). Its use is concentrated in Media & Entertainment. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. Reduction is the goal, and sustained decreases
  indicate successful intervention.
