id: dea:metric-nav-restatement-rate
name: NAV Restatement Rate
type: Metric
description: A Investment Risk & Middle Office Operations indicator, NAV Restatement Rate (NAVRR) quantifies
  the quality of outputs and outcomes. Its calculation is NAVs Restated / NAVs Published, measured in
  events per thousand or million (scaled). It provides the day-to-day signal that a process is running
  as designed. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Investment management practice.
