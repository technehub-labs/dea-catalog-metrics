id: dea:metric-retention-ratio-earnings
name: Retention Ratio (Earnings)
type: Metric
description: Retention Ratio (Earnings) (RRE) measures the economic value created or preserved in the
  Valuation & Corporate Finance Standard Measures domain. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Retained Earnings / Net Income
  - reported in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.
