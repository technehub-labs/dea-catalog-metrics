id: dea:metric-demand-to-delivery-cycle-time
name: Demand-to-Delivery Cycle Time
type: Metric
description: Demand-to-Delivery Cycle Time (DDCT-PPM) addresses how efficiently resources are converted
  into outputs and is a fixture of program & portfolio management reporting. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Days from Demand
  Intake to Initiative Start - reported in days. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
