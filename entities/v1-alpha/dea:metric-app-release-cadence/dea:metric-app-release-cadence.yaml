id: dea:metric-app-release-cadence
name: App Release Cadence
type: Metric
description: App Release Cadence (ARC-MOB) measures how efficiently resources are converted into outputs
  in the Mobile & Client Development domain. Its calculation is Production App Releases per Month, measured
  in times per period. It originates from and is most used in Software practice. It provides the day-to-day
  signal that a process is running as designed. Values outside the intended band, on either side, warrant
  investigation.
