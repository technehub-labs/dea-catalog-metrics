id: dea:metric-deployment-cost-per-service
name: Deployment Cost per Service
type: Metric
description: Within Continuous Delivery & Deployment, Deployment Cost per Service (DCPS-CD) is used to
  gauge how efficiently resources are converted into outputs. It is computed as Pipeline Cost per Deployable
  Service per Month, expressed in currency value. It is applied across virtually every sector. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. Reduction is the goal,
  and sustained decreases indicate successful intervention.
