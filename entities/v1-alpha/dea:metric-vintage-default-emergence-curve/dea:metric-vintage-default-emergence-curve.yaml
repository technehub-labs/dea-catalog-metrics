id: dea:metric-vintage-default-emergence-curve
name: Vintage Default Emergence Curve
type: Metric
description: Vintage Default Emergence Curve (VDEC) measures exposure to adverse outcomes in the Credit
  & Collections Risk (Enterprise) domain. The formula is Cumulative Default Rate by Loan Age Cohort -
  reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
