id: dea:metric-compliance-breach-count
name: Compliance Breach Count
type: Metric
description: A Risk & Compliance indicator, Compliance Breach Count (CBC) quantifies exposure to adverse
  outcomes. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Its calculation is Confirmed Regulatory Breaches per Period, measured in count (items
  per period). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
