id: dea:metric-managed-spend-percentage
name: Managed Spend Percentage
type: Metric
description: Within Procurement, Managed Spend Percentage (MSP) is used to gauge how effectively a process
  or entity achieves its intended outcome. Its calculation is Spend via Managed Contracts / Total Spend,
  measured in percent (%). It is applied across virtually every sector. It informs long-horizon decisions
  and is typically tracked on enterprise dashboards rather than team boards. It should be maximized within
  the limits of cost and quality trade-offs.
