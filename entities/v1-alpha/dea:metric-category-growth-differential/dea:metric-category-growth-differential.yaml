id: dea:metric-category-growth-differential
name: Category Growth Differential
type: Metric
description: 'Category Growth Differential (CGD) addresses growth over time and is a fixture of market
  structure & economics standard measures reporting. It is computed as Entity Category Growth minus Market
  Growth, expressed in percent (%). It is applied across virtually every sector. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It should be maximized within
  the limits of cost and quality trade-offs.'
