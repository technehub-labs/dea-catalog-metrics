id: dea:metric-staff-to-patient-ratio
name: Staff-to-Patient Ratio
type: Metric
description: 'A Healthcare indicator, Staff-to-Patient Ratio (SPR) quantifies the utilization or availability
  of capacity. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  The formula is Clinical Staff on Duty / Patients in Care - reported in ratio (x:1 or x). The objective
  is neither maximization nor minimization but staying within an agreed operating band. It is a standard
  measure in the Healthcare sector.'
abbreviation: SPR
unit: ratio
