id: dea:metric-critical-knowledge-retention-risk
name: Critical Knowledge Retention Risk
type: Metric
description: Within Knowledge Management, Critical Knowledge Retention Risk (CKRR) is used to gauge exposure
  to adverse outcomes. It is defined as Critical Knowledge Held by Departing or Single Holders / Critical
  Knowledge Areas; the result is stated in percent (%). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: CKRR
unit: percent
