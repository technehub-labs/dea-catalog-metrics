id: dea:metric-litigation-win-settle-favorable-ratio
name: Litigation Win-Settle-Favorable Ratio
type: Metric
description: 'Litigation Win-Settle-Favorable Ratio (LWSF) captures how effectively a process or entity
  achieves its intended outcome for organizations tracking legal operations. It is computed as Favorable
  Outcomes / Resolved Matters, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: LWSF
unit: percent
version: 1.1.0
