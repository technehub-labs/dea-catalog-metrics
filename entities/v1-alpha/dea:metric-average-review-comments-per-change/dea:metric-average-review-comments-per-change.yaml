id: dea:metric-average-review-comments-per-change
name: Average Review Comments per Change
type: Metric
description: Average Review Comments per Change (ARCC) captures the quality of outputs and outcomes for
  organizations tracking code review & peer quality. It is computed as Review Comments / Merged Changes,
  expressed in ratio (x:1 or x). Its use is concentrated in Software. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. Values outside the intended band,
  on either side, warrant investigation.
