id: dea:metric-function-parameter-count-compliance
name: Function Parameter Count Compliance
type: Metric
description: 'A Code Quality & Static Analysis indicator, Function Parameter Count Compliance (FPCC) quantifies
  the quality of outputs and outcomes. The formula is Functions within Parameter Limit / Functions - reported
  in percent (%). It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Higher values are better; gains are read as improvement and losses as deterioration. It is a
  standard measure in the Software sector.'
abbreviation: FPCC
unit: percent
