id: dea:metric-time-to-digital-experiment
name: Time to Digital Experiment
type: Metric
description: Within Digital Transformation, Time to Digital Experiment (TTDE) is used to gauge how efficiently
  resources are converted into outputs. The formula is Days from Idea to Live Digital Experiment - reported
  in days. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.
