id: dea:metric-online-order-fulfilment-cost-ratio
name: Online Order Fulfilment Cost Ratio
type: Metric
description: A Retail Standard Measures indicator, Online Order Fulfilment Cost Ratio (OOFCR) quantifies
  how efficiently resources are converted into outputs. The formula is Pick-Pack-Deliver Cost / Online
  Revenue - reported in percent (%). It is a standard measure in the Retail & E-commerce sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: OOFCR
unit: percent
