id: dea:metric-crisis-communication-activation-time
name: Crisis Communication Activation Time
type: Metric
description: Crisis Communication Activation Time (CCAT) addresses exposure to adverse outcomes and is
  a fixture of corporate communications & pr (deep dive) reporting. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Hours from Event to First Approved
  Statement; the result is stated in hours. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.
