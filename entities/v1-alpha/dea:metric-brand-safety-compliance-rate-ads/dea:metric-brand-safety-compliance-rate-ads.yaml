id: dea:metric-brand-safety-compliance-rate-ads
name: Brand Safety Compliance Rate (Ads)
type: Metric
description: Brand Safety Compliance Rate (Ads) (BSCR-A) captures exposure to adverse outcomes for organizations
  tracking advertising & media buying. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Impressions on Approved Content / Impressions, measured in
  percent (%). Improvement means raising this figure toward best-in-class levels. It originates from and
  is most used in Media & Entertainment practice.
