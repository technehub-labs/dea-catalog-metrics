id: dea:metric-idea-generation-to-decision-cycle-time
name: Idea Generation to Decision Cycle Time
type: Metric
description: Idea Generation to Decision Cycle Time (IGDCT) measures how efficiently resources are converted
  into outputs in the Investment Research & Trading Operations domain. Its calculation is Days from Research
  Publication to Decision, measured in days. It originates from and is most used in Financial Services
  practice. Its value drives prioritization and resource reallocation among competing initiatives. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: IGDCT
unit: day
