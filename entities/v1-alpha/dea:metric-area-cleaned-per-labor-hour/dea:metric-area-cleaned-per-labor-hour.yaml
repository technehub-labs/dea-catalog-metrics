id: dea:metric-area-cleaned-per-labor-hour
name: Area Cleaned per Labor Hour
type: Metric
description: A Cleaning & Environmental Services indicator, Area Cleaned per Labor Hour (ACPH) quantifies
  how efficiently resources are converted into outputs. It is computed as Square Metres Cleaned / Labor
  Hours, expressed in ratio (x:1 or x). Front-line and delivery teams watch it in real time, as small
  deviations demand immediate correction. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is concentrated in Facility Services.
