id: dea:metric-change-failure-rate
name: Change Failure Rate
type: Metric
description: 'Change Failure Rate (CFR) addresses the quality of outputs and outcomes and is a fixture
  of software engineering reporting. It is computed as Deployments Causing Failure / Total Deployments,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
abbreviation: CFR
unit: percent
