id: dea:metric-executive-threat-briefing-cadence
name: Executive Threat Briefing Cadence
type: Metric
description: A Threat Intelligence & Red Team indicator, Executive Threat Briefing Cadence (ETBC) quantifies
  governance. The formula is Threat Briefings Delivered to Leadership per Quarter - reported in count
  (items per period). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. It is managed toward a defined target band rather than an extreme - both overshoot and undershoot
  can signal problems. Its use is not sector-specific; it appears in cross-industry performance frameworks.
