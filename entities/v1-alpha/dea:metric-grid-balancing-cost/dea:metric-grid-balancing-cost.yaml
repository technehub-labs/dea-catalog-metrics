id: dea:metric-grid-balancing-cost
name: Grid Balancing Cost
type: Metric
description: A Energy & Utilities indicator, Grid Balancing Cost (GBC) quantifies how efficiently resources
  are converted into outputs. It is computed as Cost of Balancing Operations / Energy Delivered, expressed
  in currency per unit. Its use is concentrated in Energy & utilities. It is reviewed at cadence by planning
  owners to correct course before issues become strategic. Reduction is the goal, and sustained decreases
  indicate successful intervention.
