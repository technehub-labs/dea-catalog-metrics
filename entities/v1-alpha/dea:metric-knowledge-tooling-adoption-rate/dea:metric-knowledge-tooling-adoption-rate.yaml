id: dea:metric-knowledge-tooling-adoption-rate
name: Knowledge Tooling Adoption Rate
type: Metric
description: Within Knowledge Management (Deep Dive), Knowledge Tooling Adoption Rate (KTAR) is used to
  gauge how efficiently resources are converted into outputs. It is defined as Employees Using Central
  Knowledge Platform / Employees; the result is stated in percent (%). It bridges daily operations and
  executive reporting, giving managers a lever to pull within a quarter. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: KTAR
unit: percent
