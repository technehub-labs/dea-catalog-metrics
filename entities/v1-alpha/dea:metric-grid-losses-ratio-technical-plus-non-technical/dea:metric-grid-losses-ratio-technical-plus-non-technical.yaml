id: dea:metric-grid-losses-ratio-technical-plus-non-technical
name: Grid Losses Ratio (Technical plus Non-Technical)
type: Metric
description: Grid Losses Ratio (Technical plus Non-Technical) (GLR) addresses how efficiently resources
  are converted into outputs and is a fixture of utilities field operations & grid reporting. Its calculation
  is (Generation - Billed Energy) / Generation, measured in percent (%). It originates from and is most
  used in Utilities practice. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Reduction is the goal, and sustained decreases indicate successful
  intervention.
abbreviation: GLR
unit: percent
