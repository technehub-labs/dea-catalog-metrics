name: Architecture Runway Adequacy
type: Metric
description: A Software Architecture & Technical Design indicator, Architecture Runway Adequacy (ARA-SA)
  quantifies capability maturity or development. It is defined as Features with Architecture Runway Ready
  / Planned Features; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
