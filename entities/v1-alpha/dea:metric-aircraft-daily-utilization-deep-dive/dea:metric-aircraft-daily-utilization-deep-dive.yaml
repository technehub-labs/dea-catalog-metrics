id: dea:metric-aircraft-daily-utilization-deep-dive
name: Aircraft Daily Utilization (Deep Dive)
type: Metric
description: 'Aircraft Daily Utilization (Deep Dive) (ADUDD) measures how efficiently resources are converted
  into outputs in the Airline & Transportation Standard Measures (Deep Dive) domain. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Revenue Block Hours / Aircraft Days, expressed in hours. Improvement means raising this figure toward
  best-in-class levels. Its use is concentrated in Airlines & Aviation.'
