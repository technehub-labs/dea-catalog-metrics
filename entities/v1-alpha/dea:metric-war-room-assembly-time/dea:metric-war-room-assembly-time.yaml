id: dea:metric-war-room-assembly-time
name: War Room Assembly Time
type: Metric
description: A IT Incident & Major Problem Management indicator, War Room Assembly Time (WRAT) quantifies
  how efficiently resources are converted into outputs. It is computed as Minutes to Assemble Response
  Team for Major Incident, expressed in minutes. It is applied across virtually every sector. Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. Reduction
  is the goal, and sustained decreases indicate successful intervention.
