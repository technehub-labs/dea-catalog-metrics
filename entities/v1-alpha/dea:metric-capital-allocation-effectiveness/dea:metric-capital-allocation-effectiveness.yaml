id: dea:metric-capital-allocation-effectiveness
name: Capital Allocation Effectiveness
type: Metric
description: 'Within Strategy & Portfolio, Capital Allocation Effectiveness (CAE2) is used to gauge the
  economic value created or preserved. It is computed as Returns from New Investments / Cost of Capital,
  expressed in ratio (x:1 or x). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
