id: dea:metric-days-away-restricted-or-transferred
name: Days Away, Restricted, or Transferred
type: Metric
description: Days Away, Restricted, or Transferred (DART) addresses exposure to adverse outcomes and is
  a fixture of health & safety reporting. The formula is (DART Cases x 200,000) / Total Hours Worked -
  reported in ratio (x:1 or x). It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: DART
unit: ratio
