id: dea:metric-incident-detection-via-monitoring-ratio
name: Incident Detection via Monitoring Ratio
type: Metric
description: 'Incident Detection via Monitoring Ratio (IDVMR) addresses capability maturity or development
  and is a fixture of it incident & major problem management reporting. It is computed as Incidents Detected
  before User Report / Incidents, expressed in percent (%). It is applied across virtually every sector.
  It is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
