id: dea:metric-returns-handling-cycle-time
name: Returns Handling Cycle Time
type: Metric
description: Returns Handling Cycle Time (RHCT) addresses how efficiently resources are converted into
  outputs and is a fixture of postal & courier reporting. Its calculation is Days from Return Receipt
  to Disposition, measured in days. It provides the day-to-day signal that a process is running as designed.
  Lower values are better; each reduction is an improvement. It originates from and is most used in Postal
  & courier practice.
