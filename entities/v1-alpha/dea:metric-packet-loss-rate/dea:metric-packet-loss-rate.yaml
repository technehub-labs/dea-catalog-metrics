id: dea:metric-packet-loss-rate
name: Packet Loss Rate
type: Metric
description: A Telecom Network Operations indicator, Packet Loss Rate (PLR) quantifies the quality of
  outputs and outcomes. Its calculation is Lost Packets / Packets Transmitted, measured in percent (%).
  It originates from and is most used in Telecommunications practice. It provides the day-to-day signal
  that a process is running as designed. Reduction is the goal, and sustained decreases indicate successful
  intervention.
abbreviation: PLR
unit: percent
version: 1.1.0
