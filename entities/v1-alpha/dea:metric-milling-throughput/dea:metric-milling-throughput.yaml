id: dea:metric-milling-throughput
name: Milling Throughput
type: Metric
description: 'Milling Throughput (MTH) measures the utilization or availability of capacity in the Mining
  & Metals domain. It is defined as Ore Milled per Period; the result is stated in tonnes. It is a working-level
  control: thresholds trigger immediate operational response. Higher values are better; gains are read
  as improvement and losses as deterioration. In Mining & metals, it is a recognized element of the standard
  performance toolkit.'
