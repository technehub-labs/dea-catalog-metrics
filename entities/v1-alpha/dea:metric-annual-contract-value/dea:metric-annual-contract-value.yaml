id: dea:metric-annual-contract-value
name: Annual Contract Value
type: Metric
description: Annual Contract Value (ACV) measures the economic value created or preserved in the Sales
  domain. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It is defined as Total Contract Value / Contract Years; the result is stated in currency value. Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
