id: dea:metric-secret-scanning-coverage
name: Secret Scanning Coverage
type: Metric
description: 'Secret Scanning Coverage (SSC-AS) captures exposure to adverse outcomes for organizations
  tracking application security (appsec). It is monitored close to the work: teams act on it within a
  shift, sprint, or daily review. The formula is Repositories with Secret Scanning / Repositories - reported
  in percent (%). Improvement means raising this figure toward best-in-class levels. It is a standard
  measure in the Software sector.'
