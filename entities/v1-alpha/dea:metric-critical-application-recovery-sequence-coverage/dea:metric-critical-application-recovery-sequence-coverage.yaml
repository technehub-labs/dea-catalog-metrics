id: dea:metric-critical-application-recovery-sequence-coverage
name: Critical Application Recovery Sequence Coverage
type: Metric
description: Critical Application Recovery Sequence Coverage (CARSC) captures conformance to standards,
  plans, or obligations for organizations tracking business continuity & disaster recovery. It provides
  the day-to-day signal that a process is running as designed. Its calculation is Applications in Documented
  Runbook Sequence / Critical Applications, measured in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CARSC
unit: percent
version: 1.1.0
lifecycle_status: candidate
