id: dea:metric-capacity-headroom
name: Capacity Headroom
type: Metric
description: Within IT Service Management, Capacity Headroom (CH) is used to gauge the utilization or
  availability of capacity. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is (Available Capacity - Peak Demand) / Available Capacity, measured in
  percent (%). The objective is neither maximization nor minimization but staying within an agreed operating
  band. Practitioners in nearly any industry can adopt it directly.
abbreviation: CH
unit: percent
