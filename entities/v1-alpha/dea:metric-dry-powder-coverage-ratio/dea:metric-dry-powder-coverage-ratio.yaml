id: dea:metric-dry-powder-coverage-ratio
name: Dry Powder Coverage Ratio
type: Metric
description: Dry Powder Coverage Ratio (DPCR-IM) measures the utilization or availability of capacity
  in the Investment Management - Portfolio Operations domain. Its calculation is Available Uncalled Capital
  / Planned Investments, measured in ratio (x:1 or x). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. It is managed toward a defined target band
  rather than an extreme - both overshoot and undershoot can signal problems. It originates from and is
  most used in Financial Services practice.
