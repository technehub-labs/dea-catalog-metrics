id: dea:metric-contamination-rate-recycling
name: Contamination Rate (Recycling)
type: Metric
description: 'Contamination Rate (Recycling) (CNTR) captures the quality of outputs and outcomes for organizations
  tracking waste & environmental services. The formula is Non-Recyclable Items in Recycling Stream / Recycling
  Stream - reported in percent (%). It is a standard measure in the Environmental services sector. It
  guides mid-horizon planning: portfolio, program, and function owners act on it between review cycles.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
abbreviation: CNTR
unit: percent
