id: dea:metric-insight-to-action-conversion
name: Insight-to-Action Conversion
type: Metric
description: Insight-to-Action Conversion (I2AC) measures the economic value created or preserved in the
  Customer Analytics & Insights domain. It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. The formula is Insights Resulting in Deployed Action / Insights
  Delivered - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
