id: dea:metric-share-of-wallet-deep-dive
name: Share of Wallet (Deep Dive)
type: Metric
description: 'Share of Wallet (Deep Dive) (SWDD) captures the economic value created or preserved for
  organizations tracking market structure & economics standard measures. It is computed as Customer Spend
  with Entity / Total Category Spend, expressed in percent (%). It is a headline indicator: movement in
  it prompts leadership questions about strategy and resourcing. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: SWDD
unit: percent
version: 1.1.0
