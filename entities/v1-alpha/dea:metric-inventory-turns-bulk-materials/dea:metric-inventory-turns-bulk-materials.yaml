id: dea:metric-inventory-turns-bulk-materials
name: Inventory Turns (Bulk Materials)
type: Metric
description: Within Cement & Building Materials, Inventory Turns (Bulk Materials) (ITBM) is used to gauge
  the utilization or availability of capacity. Its value drives prioritization and resource reallocation
  among competing initiatives. Its calculation is Annual Volume / Average Silo Stock, measured in times
  per period. Improvement means raising this figure toward best-in-class levels. It originates from and
  is most used in Manufacturing practice.
