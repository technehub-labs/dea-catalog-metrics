id: dea:metric-idle-equipment-energy-draw
name: Idle Equipment Energy Draw
type: Metric
description: Idle Equipment Energy Draw (IED) captures how efficiently resources are converted into outputs
  for organizations tracking operations energy management. It is computed as Energy Consumed by Idle Equipment
  / Total Energy, expressed in percent (%). It is applied across virtually every sector. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. Reduction is
  the goal, and sustained decreases indicate successful intervention.
