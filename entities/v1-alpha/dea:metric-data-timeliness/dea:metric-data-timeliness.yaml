id: dea:metric-data-timeliness
name: Data Timeliness
type: Metric
description: 'Data Timeliness (DT) addresses the quality of outputs and outcomes and is a fixture of data
  management & analytics reporting. The formula is Data Available within Target Latency / Total Data Deliveries
  - reported in percent (%). It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: DT
unit: percent
