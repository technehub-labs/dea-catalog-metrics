id: dea:metric-site-selection-forecast-accuracy
name: Site Selection Forecast Accuracy
type: Metric
description: A Franchise & Multi-site indicator, Site Selection Forecast Accuracy (SSFA) quantifies the
  quality of outputs and outcomes. Its calculation is 1 - ABS(Actual Year-1 Sales - Forecast) / Forecast,
  measured in percent (%). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Franchise & multi-site practice.
abbreviation: SSFA
unit: percent
