id: dea:metric-stevedore-injury-rate
name: Stevedore Injury Rate
type: Metric
description: 'A Maritime & Shipping indicator, Stevedore Injury Rate (SIR) quantifies exposure to adverse
  outcomes. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. It is computed as Recordable Injuries / Hours Worked x 200,000, expressed in ratio (x:1
  or x). It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Maritime & shipping.'
abbreviation: SIR
unit: ratio
