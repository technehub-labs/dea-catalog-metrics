id: dea:metric-prime-cost-percentage
name: Prime Cost Percentage
type: Metric
description: Prime Cost Percentage (PCP-R) measures the economic value created or preserved in the Restaurants
  domain. It is defined as (Food Cost + Labor Cost) / Revenue; the result is stated in percent (%). In
  Restaurants, it is a recognized element of the standard performance toolkit. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: PCP-R
unit: percent
