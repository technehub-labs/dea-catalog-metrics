id: dea:metric-charge-capture-accuracy
name: Charge Capture Accuracy
type: Metric
description: 'Charge Capture Accuracy (CCA-H) addresses the economic value created or preserved and is
  a fixture of healthcare revenue cycle reporting. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Charges Captured for Billable Services
  / Billable Services - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Healthcare sector.'
