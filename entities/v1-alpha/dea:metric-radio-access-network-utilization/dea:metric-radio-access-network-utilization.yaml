id: dea:metric-radio-access-network-utilization
name: Radio Access Network Utilization
type: Metric
description: Within Telecom Network Operations, Radio Access Network Utilization (RANU) is used to gauge
  the utilization or availability of capacity. Its calculation is Used Radio Capacity / Provisioned Radio
  Capacity, measured in percent (%). It originates from and is most used in Telecommunications practice.
  Its value drives prioritization and resource reallocation among competing initiatives. Values outside
  the intended band, on either side, warrant investigation.
abbreviation: RANU
unit: percent
