id: dea:metric-agent-occupancy-rate
name: Agent Occupancy Rate
type: Metric
description: Agent Occupancy Rate (AOR) captures the utilization or availability of capacity for organizations
  tracking contact center. It is computed as Handle Time / Scheduled Time, expressed in percent (%). Front-line
  and delivery teams watch it in real time, as small deviations demand immediate correction. It is managed
  toward a defined target band rather than an extreme - both overshoot and undershoot can signal problems.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: AOR
unit: percent
