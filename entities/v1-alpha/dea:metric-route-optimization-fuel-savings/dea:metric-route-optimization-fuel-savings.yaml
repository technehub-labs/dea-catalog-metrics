description: 'A Parcel & Last-Mile Logistics (Deep Dive) indicator, Route Optimization Fuel Savings (ROFS)
  quantifies environmental and social sustainability performance. The formula is Fuel Saved vs Baseline
  / Baseline - reported in percent (%). It is a standard measure in the Logistics & Trade sector. It guides
  mid-horizon planning: portfolio, program, and function owners act on it between review cycles. It should
  be maximized within the limits of cost and quality trade-offs.'
