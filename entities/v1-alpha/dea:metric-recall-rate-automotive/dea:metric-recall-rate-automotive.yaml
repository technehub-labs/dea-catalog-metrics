id: dea:metric-recall-rate-automotive
name: Recall Rate (Automotive)
type: Metric
description: Recall Rate (Automotive) (RRA) addresses exposure to adverse outcomes and is a fixture of
  automotive reporting. Its calculation is Recalled Vehicles / Vehicles Sold, measured in percent (%).
  It originates from and is most used in Automotive practice. It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: RRA
unit: percent
