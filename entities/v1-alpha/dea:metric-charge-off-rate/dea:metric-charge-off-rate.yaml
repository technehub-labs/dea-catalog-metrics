id: dea:metric-charge-off-rate
name: Charge-Off Rate
type: Metric
description: 'Charge-Off Rate (COR) measures exposure to adverse outcomes in the Banking & Financial Services
  domain. It is computed as Net Charge-Offs / Average Loans Outstanding, expressed in percent (%). Its
  use is concentrated in Financial services. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Reduction is the goal, and sustained decreases indicate successful
  intervention.'
