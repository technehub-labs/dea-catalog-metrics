id: dea:metric-baggage-handling-system-availability-deep-dive
name: Baggage Handling System Availability (Deep Dive)
type: Metric
description: Baggage Handling System Availability (Deep Dive) (BHSA) addresses the utilization or availability
  of capacity and is a fixture of airport operations (deep dive) reporting. It is computed as BHS Available
  Time / Required Time, expressed in percent (%). Its use is concentrated in Aviation. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. It should be
  maximized within the limits of cost and quality trade-offs.
abbreviation: BHSA
unit: percent
