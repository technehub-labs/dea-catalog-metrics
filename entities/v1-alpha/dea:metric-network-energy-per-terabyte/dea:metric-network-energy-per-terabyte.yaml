id: dea:metric-network-energy-per-terabyte
name: Network Energy per Terabyte
type: Metric
description: Within Telecom Network Operations (Deep Dive), Network Energy per Terabyte (NET-T) is used
  to gauge environmental and social sustainability performance. Its calculation is Energy Consumed / Data
  Carried, measured in megawatt-hours (MWh). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Lower values are better; each reduction is an improvement.
  It originates from and is most used in Telecommunications practice.
