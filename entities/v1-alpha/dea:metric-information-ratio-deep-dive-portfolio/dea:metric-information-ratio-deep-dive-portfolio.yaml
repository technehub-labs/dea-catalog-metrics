id: dea:metric-information-ratio-deep-dive-portfolio
name: Information Ratio (Deep Dive - Portfolio)
type: Metric
description: Within Investment Performance Measurement, Information Ratio (Deep Dive - Portfolio) (IRDD)
  is used to gauge the economic value created or preserved. The formula is Excess Return / Tracking Error
  - reported in ratio (x:1 or x). It is a standard measure in the Investment management sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
