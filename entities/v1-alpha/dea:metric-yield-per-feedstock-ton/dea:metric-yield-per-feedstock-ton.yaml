id: dea:metric-yield-per-feedstock-ton
name: Yield per Feedstock Ton
type: Metric
description: Yield per Feedstock Ton (YPFT) captures how efficiently resources are converted into outputs
  for organizations tracking chemicals. Its calculation is Product Output Tonnes / Feedstock Tonnes, measured
  in ratio (x:1 or x). Its value drives prioritization and resource reallocation among competing initiatives.
  Higher values are better; gains are read as improvement and losses as deterioration. It originates from
  and is most used in Chemicals practice.
