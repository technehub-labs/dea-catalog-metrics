id: dea:metric-subcontractor-on-time-performance
name: Subcontractor On-Time Performance
type: Metric
description: A Construction & Engineering indicator, Subcontractor On-Time Performance (SOTP) quantifies
  the quality of outputs and outcomes. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. It is defined as Subcontractor Milestones Met on Time / Milestones
  Planned; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Construction & engineering, it is a recognized element of the standard performance toolkit.
abbreviation: SOTP
unit: percent
