id: dea:metric-steam-or-compressed-air-loss-rate
name: Steam or Compressed Air Loss Rate
type: Metric
description: Steam or Compressed Air Loss Rate (SCAL) addresses how efficiently resources are converted
  into outputs and is a fixture of operations energy management reporting. Its calculation is Leakage
  Losses / Generated Utility Volume, measured in percent (%). It is applied across virtually every sector.
  It provides the day-to-day signal that a process is running as designed. Reduction is the goal, and
  sustained decreases indicate successful intervention.
