id: dea:metric-calmar-ratio
name: Calmar Ratio
type: Metric
description: Calmar Ratio (CALR) captures exposure to adverse outcomes for organizations tracking investment
  performance measurement. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Annualized Return / Maximum Drawdown - reported in ratio (x:1 or x). Improvement
  means raising this figure toward best-in-class levels. It is a standard measure in the Investment management
  sector.
