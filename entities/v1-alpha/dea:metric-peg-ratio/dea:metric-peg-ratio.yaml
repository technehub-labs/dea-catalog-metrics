id: dea:metric-peg-ratio
name: PEG Ratio
type: Metric
description: PEG Ratio (PEGR) measures the economic value created or preserved in the Valuation & Corporate
  Finance Standard Measures domain. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Price-to-Earnings / Expected Earnings Growth,
  measured in ratio (x:1 or x). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.
