id: dea:metric-course-completion-rate-deep-dive
name: Course Completion Rate (Deep Dive)
type: Metric
description: A Education & Training (Deep Dive) indicator, Course Completion Rate (Deep Dive) (CCRT-D)
  quantifies how effectively a process or entity achieves its intended outcome. It is defined as Completers
  / Enrolments; the result is stated in percent (%). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. Higher values are better; gains are read as improvement and
  losses as deterioration. In Education, it is a recognized element of the standard performance toolkit.
