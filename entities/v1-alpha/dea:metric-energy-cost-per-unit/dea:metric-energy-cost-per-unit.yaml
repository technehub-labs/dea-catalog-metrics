id: dea:metric-energy-cost-per-unit
name: Energy Cost per Unit
type: Metric
description: Within Manufacturing, Energy Cost per Unit (ECU) is used to gauge how efficiently resources
  are converted into outputs. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Total Energy Cost / Units Produced, expressed in currency per unit.
  It should be driven down, since lower readings signal healthier performance. Its use is concentrated
  in Manufacturing.
abbreviation: ECU
unit: currency
