id: dea:metric-reserved-instance-coverage
name: Reserved Instance Coverage
type: Metric
description: 'Within Data Center & Cloud Operations, Reserved Instance Coverage (RIC) is used to gauge
  how efficiently resources are converted into outputs. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Workloads on Reserved Capacity /
  Total Workloads - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Technology & data centers sector.'
abbreviation: RIC
unit: percent
version: 1.0.1
