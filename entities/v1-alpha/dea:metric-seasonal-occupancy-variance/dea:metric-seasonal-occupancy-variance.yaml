id: dea:metric-seasonal-occupancy-variance
name: Seasonal Occupancy Variance
type: Metric
description: 'Within Travel & Tourism, Seasonal Occupancy Variance (SOV) is used to gauge the utilization
  or availability of capacity. It is computed as (Peak Occupancy - Off-Peak Occupancy) / Peak Occupancy,
  expressed in percent (%). Its use is concentrated in Travel & tourism. It is a headline indicator: movement
  in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and sustained
  decreases indicate successful intervention.'
abbreviation: SOV
unit: percent
