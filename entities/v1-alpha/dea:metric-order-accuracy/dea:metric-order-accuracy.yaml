id: dea:metric-order-accuracy
name: Order Accuracy
type: Metric
description: 'Within Supply Chain, Order Accuracy (OA) is used to gauge the quality of outputs and outcomes.
  It is monitored close to the work: teams act on it within a shift, sprint, or daily review. The formula
  is Error-Free Orders / Total Orders - reported in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: OA
unit: percent
