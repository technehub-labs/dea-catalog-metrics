id: dea:metric-deposit-growth-rate
name: Deposit Growth Rate
type: Metric
description: Within Banking & Financial Services, Deposit Growth Rate (DGR) is used to gauge growth over
  time. It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  The formula is (Deposits_current - Deposits_prior) / Deposits_prior - reported in percent (%). Improvement
  means raising this figure toward best-in-class levels. It is a standard measure in the Financial services
  sector.
abbreviation: DGR
unit: percent
