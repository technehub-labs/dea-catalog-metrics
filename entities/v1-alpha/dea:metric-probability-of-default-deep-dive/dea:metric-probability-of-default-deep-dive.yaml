id: dea:metric-probability-of-default-deep-dive
name: Probability of Default (Deep Dive)
type: Metric
description: Probability of Default (Deep Dive) (PDDD) addresses exposure to adverse outcomes and is a
  fixture of credit & collections risk (enterprise) reporting. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Modeled Likelihood of Borrower
  Default within Horizon; the result is stated in percent (%). It should be driven down, since lower readings
  signal healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: PDDD
unit: percent
