id: dea:metric-f1-score
name: F1 Score
type: Metric
description: Within Statistical Model Performance Diagnostics, F1 Score (F1SC) is used to gauge the quality
  of outputs and outcomes. It provides the day-to-day signal that a process is running as designed. Its
  calculation is Harmonic Mean of Precision and Recall, measured in score (points). Improvement means
  raising this figure toward best-in-class levels. It originates from and is most used in Software practice.
