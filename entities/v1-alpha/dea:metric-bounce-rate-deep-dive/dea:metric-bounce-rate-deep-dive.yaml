id: dea:metric-bounce-rate-deep-dive
name: Bounce Rate (Deep Dive)
type: Metric
description: Bounce Rate (Deep Dive) (BRDD) addresses the engagement or satisfaction of the people involved
  and is a fixture of web & digital analytics standard measures reporting. Its calculation is Single-Page
  Sessions / Total Sessions, measured in percent (%). It originates from and is most used in Digital product
  practice. It provides the day-to-day signal that a process is running as designed. Reduction is the
  goal, and sustained decreases indicate successful intervention.
