id: dea:metric-capacity-to-demand-match-index
name: Capacity-to-Demand Match Index
type: Metric
description: A Workforce Planning & Productivity indicator, Capacity-to-Demand Match Index (CDMI) quantifies
  the utilization or availability of capacity. Its calculation is Available Capacity vs Demand across
  Skills, measured in index (0-100 or normalized). It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. It is managed toward a defined target band
  rather than an extreme - both overshoot and undershoot can signal problems. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
