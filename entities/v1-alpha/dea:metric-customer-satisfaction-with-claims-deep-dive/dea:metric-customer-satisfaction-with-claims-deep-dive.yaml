id: dea:metric-customer-satisfaction-with-claims-deep-dive
name: Customer Satisfaction with Claims (Deep Dive)
type: Metric
description: Within Insurance Claims Deep Dive, Customer Satisfaction with Claims (Deep Dive) (CSAT-C)
  is used to gauge the engagement or satisfaction of the people involved. It is defined as Average Claimant
  Satisfaction Score; the result is stated in score (points). In Insurance, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
