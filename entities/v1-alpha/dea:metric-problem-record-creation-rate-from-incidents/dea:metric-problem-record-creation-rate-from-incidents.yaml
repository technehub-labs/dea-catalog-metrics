id: dea:metric-problem-record-creation-rate-from-incidents
name: Problem Record Creation Rate from Incidents
type: Metric
description: Problem Record Creation Rate from Incidents (PRCRI) addresses the quality of outputs and
  outcomes and is a fixture of it incident & major problem management reporting. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Problems
  Opened from Incident Trends / Major or Repeat Incidents; the result is stated in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
abbreviation: PRCRI
unit: percent
