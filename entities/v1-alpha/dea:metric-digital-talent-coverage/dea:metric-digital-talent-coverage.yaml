id: dea:metric-digital-talent-coverage
name: Digital Talent Coverage
type: Metric
description: Within Digital Transformation, Digital Talent Coverage (DTC) is used to gauge capability
  maturity or development. It is defined as Roles Filled with Digital Skills / Roles Requiring Digital
  Skills; the result is stated in percent (%). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DTC
unit: percent
