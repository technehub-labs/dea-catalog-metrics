id: dea:metric-interest-coverage-ratio
name: Interest Coverage Ratio
type: Metric
description: Interest Coverage Ratio (ICR) addresses exposure to adverse outcomes and is a fixture of
  finance & accounting reporting. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is EBIT / Interest Expense, measured in ratio (x:1 or x). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
