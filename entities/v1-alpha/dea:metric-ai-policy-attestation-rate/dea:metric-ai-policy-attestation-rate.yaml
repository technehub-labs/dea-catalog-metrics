id: dea:metric-ai-policy-attestation-rate
name: AI Policy Attestation Rate
type: Metric
description: A AI Governance & Model Risk Management indicator, AI Policy Attestation Rate (AIPAR) quantifies
  conformance to standards, plans, or obligations. It is computed as Staff Attesting to AI Usage Policy
  / Staff in Scope, expressed in percent (%). Front-line and delivery teams watch it in real time, as
  small deviations demand immediate correction. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: AIPAR
