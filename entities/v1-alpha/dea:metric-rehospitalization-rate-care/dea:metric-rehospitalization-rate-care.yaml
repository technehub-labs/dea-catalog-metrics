id: dea:metric-rehospitalization-rate-care
name: Rehospitalization Rate (Care)
type: Metric
description: Within Elder & Social Care, Rehospitalization Rate (Care) (RHR) is used to gauge the quality
  of outputs and outcomes. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. The formula is Rehospitalizations within 30 Days / Discharges - reported in percent (%).
  It should be driven down, since lower readings signal healthier performance. It is a standard measure
  in the Social care sector.
