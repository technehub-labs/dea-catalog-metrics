id: dea:metric-renewable-certificate-issuance-rate
name: Renewable Certificate Issuance Rate
type: Metric
description: 'Renewable Certificate Issuance Rate (RCIR) captures conformance to standards, plans, or
  obligations for organizations tracking energy transition & renewables. The formula is Certificates Issued
  / Eligible Generation - reported in percent (%). It is a standard measure in the Renewable energy sector.
  It guides mid-horizon planning: portfolio, program, and function owners act on it between review cycles.
  It should be maximized within the limits of cost and quality trade-offs.'
