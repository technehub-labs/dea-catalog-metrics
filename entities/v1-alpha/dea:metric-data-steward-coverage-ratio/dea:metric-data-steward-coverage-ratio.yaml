id: dea:metric-data-steward-coverage-ratio
name: Data Steward Coverage Ratio
type: Metric
description: A Data Governance & Stewardship indicator, Data Steward Coverage Ratio (DSCR) quantifies
  governance. Its calculation is Systems with Assigned Stewards / Systems, measured in percent (%). It
  is applied across virtually every sector. Its value drives prioritization and resource reallocation
  among competing initiatives. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DSCR
unit: percent
