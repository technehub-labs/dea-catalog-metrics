id: dea:metric-lessons-learned-capture-rate-deep-dive
name: Lessons Learned Capture Rate (Deep Dive)
type: Metric
description: Lessons Learned Capture Rate (Deep Dive) (LLCR-PM) addresses capability maturity or development
  and is a fixture of project management (deep dive) reporting. Its calculation is Projects Documenting
  Lessons Learned / Closed Projects, measured in percent (%). It informs long-horizon decisions and is
  typically tracked on enterprise dashboards rather than team boards. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
