id: dea:metric-cost-to-income-ratio
name: Cost-to-Income Ratio
type: Metric
description: 'Cost-to-Income Ratio (CIR) captures how efficiently resources are converted into outputs
  for organizations tracking banking & financial services. It is computed as Operating Expenses / Operating
  Income, expressed in ratio (x:1 or x). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Financial services.'
