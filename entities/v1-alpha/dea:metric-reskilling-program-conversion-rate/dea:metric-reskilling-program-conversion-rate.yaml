id: dea:metric-reskilling-program-conversion-rate
name: Reskilling Program Conversion Rate
type: Metric
description: 'Reskilling Program Conversion Rate (RPCR-LD) captures the economic value created or preserved
  for organizations tracking learning & development effectiveness (deep dive). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Participants
  Redeployed to New Roles / Participants, expressed in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
