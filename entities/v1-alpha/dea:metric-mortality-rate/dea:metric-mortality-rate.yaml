id: dea:metric-mortality-rate
name: Mortality Rate
type: Metric
description: Within Healthcare, Mortality Rate (MR) is used to gauge the quality of outputs and outcomes.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Its calculation is Deaths / Discharges, measured in percent (%). It should be driven down, since
  lower readings signal healthier performance. It originates from and is most used in Healthcare practice.
