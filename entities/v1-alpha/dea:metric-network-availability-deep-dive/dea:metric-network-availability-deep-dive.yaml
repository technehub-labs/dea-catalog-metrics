id: dea:metric-network-availability-deep-dive
name: Network Availability (Deep Dive)
type: Metric
description: 'Network Availability (Deep Dive) (NA-D) measures the utilization or availability of capacity
  in the Telecom Network Operations (Deep Dive) domain. It is computed as Available Time / Total Time,
  expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions about
  strategy and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Telecommunications.'
abbreviation: NA-D
unit: percent
