id: dea:metric-listing-to-sale-ratio
name: Listing to Sale Ratio
type: Metric
description: Within Real Estate Brokerage, Listing to Sale Ratio (LSR-RE) is used to gauge how effectively
  a process or entity achieves its intended outcome. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Listings Sold within Period / Listings
  Taken - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  It is a standard measure in the Real estate sector.
