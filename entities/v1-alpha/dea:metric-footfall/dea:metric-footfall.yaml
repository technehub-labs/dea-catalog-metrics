id: dea:metric-footfall
name: Footfall
type: Metric
description: Within Retail & E-commerce, Footfall (FF) is used to gauge the utilization or availability
  of capacity. Its calculation is Customer Visits per Period, measured in count (items per period). It
  provides the day-to-day signal that a process is running as designed. Higher values are better; gains
  are read as improvement and losses as deterioration. It originates from and is most used in Retail practice.
