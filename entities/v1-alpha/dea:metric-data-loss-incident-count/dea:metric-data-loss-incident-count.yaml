id: dea:metric-data-loss-incident-count
name: Data Loss Incident Count
type: Metric
description: Data Loss Incident Count (DLIC) measures exposure to adverse outcomes in the Cybersecurity
  domain. It is defined as Confirmed Data Loss or Leakage Events; the result is stated in count (items
  per period). Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Lower values are better; each reduction is an improvement. Its use is not sector-specific; it
  appears in cross-industry performance frameworks.
abbreviation: DLIC
unit: count
