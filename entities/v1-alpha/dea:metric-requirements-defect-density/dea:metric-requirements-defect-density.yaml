id: dea:metric-requirements-defect-density
name: Requirements Defect Density
type: Metric
description: Requirements Defect Density (RDD) measures the quality of outputs and outcomes in the Requirements
  Engineering & Product Discovery domain. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Requirement Defects per 100 Requirements, measured in ratio
  (x:1 or x). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
