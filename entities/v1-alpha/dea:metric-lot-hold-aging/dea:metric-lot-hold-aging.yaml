id: dea:metric-lot-hold-aging
name: Lot Hold Aging
type: Metric
description: Within Semiconductor Manufacturing (Deep Dive), Lot Hold Aging (LHA-S) is used to gauge the
  quality of outputs and outcomes. It is computed as Wafers on Hold over Threshold / Wafers on Hold, expressed
  in percent (%). Front-line and delivery teams watch it in real time, as small deviations demand immediate
  correction. Lower values are better; each reduction is an improvement. Its use is concentrated in Semiconductors.
abbreviation: LHA-S
