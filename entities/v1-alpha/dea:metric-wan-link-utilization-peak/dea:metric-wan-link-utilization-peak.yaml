id: dea:metric-wan-link-utilization-peak
name: WAN Link Utilization Peak
type: Metric
description: 'A Network Performance & Capacity indicator, WAN Link Utilization Peak (WLUP) quantifies
  the utilization or availability of capacity. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Peak Period Traffic / Circuit Capacity - reported in
  percent (%). The objective is neither maximization nor minimization but staying within an agreed operating
  band. Practitioners in nearly any industry can adopt it directly.'
abbreviation: WLUP
unit: percent
