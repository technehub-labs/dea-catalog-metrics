id: dea:metric-containment-actions-automation-rate
name: Containment Actions Automation Rate
type: Metric
description: Containment Actions Automation Rate (CAAR-SOC) addresses how efficiently resources are converted
  into outputs and is a fixture of secops & security operations center reporting. It is defined as Automated
  Containment Actions / Containment Actions; the result is stated in percent (%). It is applied across
  virtually every sector. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CAAR-SOC
unit: percent
