id: dea:metric-rework-rate-construction
name: Rework Rate (Construction)
type: Metric
description: Rework Rate (Construction) (RWR-C) addresses the quality of outputs and outcomes and is a
  fixture of construction & engineering reporting. It is defined as Value of Rework / Total Contract Value;
  the result is stated in percent (%). In Construction & engineering, it is a recognized element of the
  standard performance toolkit. It bridges daily operations and executive reporting, giving managers a
  lever to pull within a quarter. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: RWR-C
unit: percent
