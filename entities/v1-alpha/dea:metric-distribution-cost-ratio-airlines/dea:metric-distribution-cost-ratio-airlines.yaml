id: dea:metric-distribution-cost-ratio-airlines
name: Distribution Cost Ratio (Airlines)
type: Metric
description: A Airline Operations (Deep Dive) indicator, Distribution Cost Ratio (Airlines) (DCR-A) quantifies
  how efficiently resources are converted into outputs. It is defined as Distribution Costs / Revenue;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Lower values are better; each reduction is an improvement. In Airlines,
  it is a recognized element of the standard performance toolkit.
