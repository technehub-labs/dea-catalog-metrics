id: dea:metric-counterfeit-intel-rejection-rate
name: Counterfeit Intel Rejection Rate
type: Metric
description: 'Counterfeit Intel Rejection Rate (CIRR) captures the quality of outputs and outcomes for
  organizations tracking threat intelligence & red team. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Unverified Intel Rejected / Intel
  Received - reported in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
