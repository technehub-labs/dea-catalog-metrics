id: dea:metric-production-per-employee-deep-dive
name: Production per Employee (Deep Dive)
type: Metric
description: Production per Employee (Deep Dive) (PPE-D) measures how efficiently resources are converted
  into outputs in the Automotive Manufacturing (Deep Dive) domain. Its calculation is Vehicles / Employee,
  measured in ratio (x:1 or x). It originates from and is most used in Automotive practice. It informs
  long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: PPE-D
