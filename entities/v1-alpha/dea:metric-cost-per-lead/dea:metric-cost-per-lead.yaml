id: dea:metric-cost-per-lead
name: Cost per Lead
type: Metric
description: Cost per Lead (CPL) captures how efficiently resources are converted into outputs for organizations
  tracking marketing. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is computed as Total Campaign Cost / Leads Generated, expressed in currency per unit.
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: CPL
unit: currency
