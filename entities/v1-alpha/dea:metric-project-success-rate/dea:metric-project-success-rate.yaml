id: dea:metric-project-success-rate
name: Project Success Rate
type: Metric
description: A Project Management indicator, Project Success Rate (PSR) quantifies how effectively a process
  or entity achieves its intended outcome. It is defined as Projects Meeting Scope, Schedule, Budget /
  Total Projects; the result is stated in percent (%). It is applied across virtually every sector. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
abbreviation: PSR
unit: percent
