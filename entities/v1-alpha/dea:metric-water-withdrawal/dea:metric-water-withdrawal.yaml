id: dea:metric-water-withdrawal
name: Water Withdrawal
type: Metric
description: 'Water Withdrawal (WW) measures environmental and social sustainability performance in the
  Sustainability & ESG domain. It is computed as Total Water Withdrawn per Period, expressed in kilolitres
  (kl). It is applied across virtually every sector. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
