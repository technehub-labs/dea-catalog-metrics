id: dea:metric-staff-to-guest-ratio-deep-dive
name: Staff-to-Guest Ratio (Deep Dive)
type: Metric
description: 'Staff-to-Guest Ratio (Deep Dive) (SGR-D) measures the utilization or availability of capacity
  in the Hotel & Resort Operations (Deep Dive) domain. The formula is Staff / Guests in House - reported
  in ratio (x:1 or x). It is a standard measure in the Hospitality sector. It is monitored close to the
  work: teams act on it within a shift, sprint, or daily review. Values outside the intended band, on
  either side, warrant investigation.'
