id: dea:metric-content-readability-score
name: Content Readability Score
type: Metric
description: 'Content Readability Score (CRS-UX) addresses the quality of outputs and outcomes and is
  a fixture of ux & design systems reporting. It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. The formula is Standardized Reading Grade of Product Copy - reported
  in score (points). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.'
