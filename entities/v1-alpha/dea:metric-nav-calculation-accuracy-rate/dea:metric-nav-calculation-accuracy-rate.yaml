id: dea:metric-nav-calculation-accuracy-rate
name: NAV Calculation Accuracy Rate
type: Metric
description: NAV Calculation Accuracy Rate (NAVCAR) measures the quality of outputs and outcomes in the
  Investment Management - Portfolio Operations domain. The formula is NAV Calculations without Error /
  Calculations - reported in percent (%). It carries weight in boardroom and executive reviews, where
  it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and
  losses as deterioration. It is a standard measure in the Financial Services sector.
abbreviation: NAVCAR
unit: percent
