id: dea:metric-workforce-productivity-index
name: Workforce Productivity Index
type: Metric
description: 'Workforce Productivity Index (WPI) captures how efficiently resources are converted into
  outputs for organizations tracking workforce planning & analytics. It is computed as Output Value per
  Labor Hour, Indexed to Baseline, expressed in index (0-100 or normalized). It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
