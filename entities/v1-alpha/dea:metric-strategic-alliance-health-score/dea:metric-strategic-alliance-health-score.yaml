id: dea:metric-strategic-alliance-health-score
name: Strategic Alliance Health Score
type: Metric
description: Strategic Alliance Health Score (SAHS) captures the quality of outputs and outcomes for organizations
  tracking corporate venturing & partnerships. The formula is Weighted Index of Joint Plan Attainment
  and Satisfaction - reported in index (0-100 or normalized). It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. Higher values are better; gains are read as
  improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
