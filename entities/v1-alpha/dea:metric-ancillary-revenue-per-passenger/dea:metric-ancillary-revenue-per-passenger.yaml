id: dea:metric-ancillary-revenue-per-passenger
name: Ancillary Revenue per Passenger
type: Metric
description: Ancillary Revenue per Passenger (ARPP) measures the economic value created or preserved in
  the Travel & Tourism domain. It is defined as Ancillary Revenue / Passengers; the result is stated in
  currency per unit. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. Higher values are better; gains are read as improvement and losses as deterioration. In Travel
  & tourism, it is a recognized element of the standard performance toolkit.
