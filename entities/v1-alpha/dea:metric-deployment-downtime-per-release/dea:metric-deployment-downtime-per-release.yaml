id: dea:metric-deployment-downtime-per-release
name: Deployment Downtime per Release
type: Metric
description: 'A Continuous Delivery & Deployment indicator, Deployment Downtime per Release (DDPR-CD)
  quantifies the quality of outputs and outcomes. It is computed as Customer-Visible Minutes Lost per
  Release, expressed in minutes. It is applied across virtually every sector. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Reduction is the goal, and
  sustained decreases indicate successful intervention.'
