id: dea:metric-address-quality-correction-rate
name: Address Quality Correction Rate
type: Metric
description: Address Quality Correction Rate (AQC) measures the quality of outputs and outcomes in the
  Postal & Courier domain. It provides the day-to-day signal that a process is running as designed. Its
  calculation is Items Requiring Address Correction / Items Received, measured in percent (%). It should
  be driven down, since lower readings signal healthier performance. It originates from and is most used
  in Postal & courier practice.
abbreviation: AQC
unit: percent
