id: dea:metric-reliability-centered-maintenance-coverage-grid
name: Reliability-Centered Maintenance Coverage (Grid)
type: Metric
description: Reliability-Centered Maintenance Coverage (Grid) (RCMC) addresses capability maturity or
  development and is a fixture of utilities field operations & grid reporting. Its calculation is Critical
  Assets under RCM Strategy / Critical Assets, measured in percent (%). It originates from and is most
  used in Utilities practice. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
