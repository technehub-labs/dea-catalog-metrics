id: dea:metric-incident-free-release-rate-deep-dive
name: Incident-Free Release Rate (Deep Dive)
type: Metric
description: 'Incident-Free Release Rate (Deep Dive) (IFRRD) captures the quality of outputs and outcomes
  for organizations tracking sre & observability standard measures. The formula is Releases without Error
  Budget Impact / Releases - reported in percent (%). It is monitored close to the work: teams act on
  it within a shift, sprint, or daily review. Higher values are better; gains are read as improvement
  and losses as deterioration. It is a standard measure in the Software sector.'
abbreviation: IFRRD
unit: percent
