id: dea:metric-digital-channel-adoption-government
name: Digital Channel Adoption (Government)
type: Metric
description: Digital Channel Adoption (Government) (DCAD) measures how efficiently resources are converted
  into outputs in the Government & Public Administration domain. The formula is Digital Service Transactions
  / Total Transactions - reported in percent (%). It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. Higher values are better; gains are read as improvement
  and losses as deterioration. It is a standard measure in the Public Sector sector.
abbreviation: DCAD
unit: percent
