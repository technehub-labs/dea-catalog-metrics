calculation_definition: Unauthorized Changes Detected / Total Changes Audited
formula_definition:
  formula_id: dea:formula-out-of-window-change-detection-rate
  expression: OWCDR = Unauthorized Changes Detected / Total Changes Audited
  inputs:
