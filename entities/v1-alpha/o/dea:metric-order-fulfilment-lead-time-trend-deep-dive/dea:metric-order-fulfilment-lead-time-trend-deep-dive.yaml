id: dea:metric-order-fulfilment-lead-time-trend-deep-dive
name: Order Fulfilment Lead Time Trend (Deep Dive)
type: Metric
description: Order Fulfilment Lead Time Trend (Deep Dive) (OFLTT-D) measures how efficiently resources
  are converted into outputs in the Balanced Scorecard - Internal Process Perspective domain. The formula
  is Change in Fulfilment Lead Time - reported in days. It is applied across virtually every sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction
  is the goal, and sustained decreases indicate successful intervention.
