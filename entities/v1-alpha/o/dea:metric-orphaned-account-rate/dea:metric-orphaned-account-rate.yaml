id: dea:metric-orphaned-account-rate
name: Orphaned Account Rate
type: Metric
description: Within Identity & Access Management Operations, Orphaned Account Rate (OAR-IAM) is used to
  gauge exposure to adverse outcomes. It is defined as Accounts without Active Owner / Accounts; the result
  is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: OAR-IAM
unit: percent
