id: dea:metric-on-time-delivery-wafer-commitments-deep-dive
name: On-Time Delivery - Wafer Commitments (Deep Dive)
type: Metric
description: 'A Semiconductor Manufacturing (Deep Dive) indicator, On-Time Delivery - Wafer Commitments
  (Deep Dive) (OTD-D) quantifies conformance to standards, plans, or obligations. It is computed as Lots
  Delivered to Commit Date / Lots, expressed in percent (%). It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is concentrated in Semiconductors.'
abbreviation: OTD-D
unit: percent
