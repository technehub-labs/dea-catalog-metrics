id: dea:metric-open-data-publication-compliance
name: Open Data Publication Compliance
type: Metric
description: A Public Sector & Citizen Service Standard Measures (Deep Dive) indicator, Open Data Publication
  Compliance (ODPC) quantifies conformance to standards, plans, or obligations. The formula is Datasets
  Published per Mandate / Mandated Datasets - reported in percent (%). It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Higher values are better; gains
  are read as improvement and losses as deterioration. It is a standard measure in the Public sector sector.
abbreviation: ODPC
