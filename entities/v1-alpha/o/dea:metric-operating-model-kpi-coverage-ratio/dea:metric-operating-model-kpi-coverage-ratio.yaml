id: dea:metric-operating-model-kpi-coverage-ratio
name: Operating Model KPI Coverage Ratio
type: Metric
description: Within Operating Model Monitoring & Design Effectiveness, Operating Model KPI Coverage Ratio
  (OMKPCR) is used to gauge capability maturity or development. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Value Streams
  with Defined KPIs / Value Streams, measured in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: OMKPCR
unit: percent
