id: dea:metric-operating-margin-trend-deep-dive
name: Operating Margin Trend (Deep Dive)
type: Metric
description: A Balanced Scorecard - Financial Perspective indicator, Operating Margin Trend (Deep Dive)
  (OMT-D) quantifies the economic value created or preserved. The formula is Change in Operating Margin
  over Periods - reported in percent (%). It is applied across virtually every sector. It carries weight
  in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
