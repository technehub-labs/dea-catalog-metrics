id: dea:metric-okr-tooling-adoption-rate
name: OKR Tooling Adoption Rate
type: Metric
description: Within Enterprise OKR & Performance Management, OKR Tooling Adoption Rate (OTAR) is used
  to gauge capability maturity or development. It bridges daily operations and executive reporting, giving
  managers a lever to pull within a quarter. It is defined as Teams Using OKR Platform / Teams; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: OTAR
unit: percent
