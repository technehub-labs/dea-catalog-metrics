id: dea:metric-onboarding-time-for-new-developer
name: Onboarding Time for New Developer
type: Metric
description: Within Software Engineering, Onboarding Time for New Developer (OTND) is used to gauge capability
  maturity or development. Its value drives prioritization and resource reallocation among competing initiatives.
  Its calculation is Days to First Meaningful Merged Contribution, measured in days. It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.
