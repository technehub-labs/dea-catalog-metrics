id: dea:metric-occupancy-cost-ratio
name: Occupancy Cost Ratio
type: Metric
description: Occupancy Cost Ratio (OCR) captures how efficiently resources are converted into outputs
  for organizations tracking facilities & real estate. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Total Occupancy Cost / Revenue - reported
  in percent (%). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: OCR
unit: percent
