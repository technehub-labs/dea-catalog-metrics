id: dea:metric-online-order-mix
name: Online Order Mix
type: Metric
description: Online Order Mix (OOM) captures growth over time for organizations tracking restaurants.
  Its calculation is Digital Orders / Total Orders, measured in percent (%). It originates from and is
  most used in Restaurants practice. Its value drives prioritization and resource reallocation among competing
  initiatives. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: OOM
unit: percent
version: 1.1.0
