id: dea:metric-offboarding-completeness-rate
name: Offboarding Completeness Rate
type: Metric
description: 'Offboarding Completeness Rate (OCR-TP) captures exposure to adverse outcomes for organizations
  tracking third-party risk management. It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. The formula is Offboardings with Access, Data, Asset Recovery Completed / Offboardings
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
abbreviation: OCR-TP
unit: percent
version: 1.1.0
lifecycle_status: candidate
