id: dea:metric-offer-acceptance-rate
name: Offer Acceptance Rate
type: Metric
description: A Human Resources indicator, Offer Acceptance Rate (OAR) quantifies how effectively a process
  or entity achieves its intended outcome. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Offers Accepted / Offers Extended, measured in percent (%).
  Improvement means raising this figure toward best-in-class levels. Practitioners in nearly any industry
  can adopt it directly.
abbreviation: OAR
unit: percent
version: 1.1.0
lifecycle_status: candidate
