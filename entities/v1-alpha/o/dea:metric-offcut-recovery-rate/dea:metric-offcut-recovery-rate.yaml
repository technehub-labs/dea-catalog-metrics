id: dea:metric-offcut-recovery-rate
name: Offcut Recovery Rate
type: Metric
description: Offcut Recovery Rate (ORR) addresses environmental and social sustainability performance
  and is a fixture of furniture & wood products reporting. It is computed as Offcuts Reused / Offcuts
  Generated, expressed in percent (%). Its use is concentrated in Manufacturing. Front-line and delivery
  teams watch it in real time, as small deviations demand immediate correction. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: ORR
unit: percent
version: 1.1.0
