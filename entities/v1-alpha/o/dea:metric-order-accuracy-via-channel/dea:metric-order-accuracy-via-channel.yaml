id: dea:metric-order-accuracy-via-channel
name: Order Accuracy via Channel
type: Metric
description: 'A Channel & Distribution Management indicator, Order Accuracy via Channel (OAVC) quantifies
  the quality of outputs and outcomes. It is defined as Channel Orders Filled without Correction / Channel
  Orders; the result is stated in percent (%). It is a working-level control: thresholds trigger immediate
  operational response. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: OAVC
unit: percent
