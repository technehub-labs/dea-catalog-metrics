id: dea:metric-omnichannel-consistency-score
name: Omnichannel Consistency Score
type: Metric
description: Within Customer Journey & Experience, Omnichannel Consistency Score (OCS) is used to gauge
  the quality of outputs and outcomes. It is defined as Weighted Score of Experience Consistency across
  Channels; the result is stated in score (points). It is applied across virtually every sector. Its trend
  is watched by senior leadership as an early signal of structural performance shifts. It should be maximized
  within the limits of cost and quality trade-offs.
