id: dea:metric-ready-backlog-coverage-ratio
name: Ready Backlog Coverage Ratio
type: Metric
description: 'Ready Backlog Coverage Ratio (RBCR) captures the utilization or availability of capacity
  for organizations tracking requirements engineering & product discovery. The formula is Sprint-Ready
  Backlog Items / Planned Sprint Demand - reported in ratio (x:1 or x). It is applied across virtually
  every sector. It guides mid-horizon planning: portfolio, program, and function owners act on it between
  review cycles. It should be maximized within the limits of cost and quality trade-offs.'
