id: dea:metric-service-level-objective-attainment
name: Service Level Objective Attainment
type: Metric
description: Service Level Objective Attainment (SLOA) measures the quality of outputs and outcomes in
  the Observability & Site Reliability Engineering domain. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is SLO Windows Achieved /
  Total Windows, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: SLOA
unit: percent
