id: dea:metric-tag-coverage-rate
name: Tag Coverage Rate
type: Metric
description: Tag Coverage Rate (TAGCR) addresses the quality of outputs and outcomes and is a fixture
  of web & digital analytics standard measures reporting. Front-line and delivery teams watch it in real
  time, as small deviations demand immediate correction. It is computed as Pages with Complete Analytics
  Tag Firing / Pages, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Digital product.
abbreviation: TAGCR
unit: percent
version: 1.1.0
