id: dea:metric-process-automation-coverage
name: Process Automation Coverage
type: Metric
description: Process Automation Coverage (PAC-A) measures capability maturity or development in the Automation
  & Robotic Process Automation domain. It is defined as Automated Process Steps / Total Process Steps
  in Scope; the result is stated in percent (%). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: PAC-A
unit: percent
