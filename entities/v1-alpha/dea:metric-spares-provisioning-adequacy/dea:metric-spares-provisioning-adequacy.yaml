id: dea:metric-spares-provisioning-adequacy
name: Spares Provisioning Adequacy
type: Metric
description: 'Spares Provisioning Adequacy (SPA-RM) addresses the utilization or availability of capacity
  and is a fixture of reliability & maintainability engineering (deep dive) reporting. It is defined as
  Demand Met from Stock / Total Spares Demand; the result is stated in percent (%). It is a working-level
  control: thresholds trigger immediate operational response. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
