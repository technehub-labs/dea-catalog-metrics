id: dea:metric-resistance-escalation-rate
name: Resistance Escalation Rate
type: Metric
description: Resistance Escalation Rate (RER) measures exposure to adverse outcomes in the Change Management
  domain. It is defined as Resistance Cases Escalated / Resistance Cases Identified; the result is stated
  in percent (%). It bridges daily operations and executive reporting, giving managers a lever to pull
  within a quarter. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
