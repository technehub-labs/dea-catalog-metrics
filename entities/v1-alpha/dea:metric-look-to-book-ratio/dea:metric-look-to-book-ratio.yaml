id: dea:metric-look-to-book-ratio
name: Look-to-Book Ratio
type: Metric
description: Look-to-Book Ratio (L2B) addresses how effectively a process or entity achieves its intended
  outcome and is a fixture of travel & tourism reporting. It is defined as Bookings / Search or Quote
  Requests; the result is stated in ratio (x:1 or x). It bridges daily operations and executive reporting,
  giving managers a lever to pull within a quarter. Higher values are better; gains are read as improvement
  and losses as deterioration. In Travel & tourism, it is a recognized element of the standard performance
  toolkit.
