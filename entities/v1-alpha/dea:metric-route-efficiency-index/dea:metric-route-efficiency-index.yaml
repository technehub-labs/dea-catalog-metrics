id: dea:metric-route-efficiency-index
name: Route Efficiency Index
type: Metric
description: Route Efficiency Index (REI-F) captures how efficiently resources are converted into outputs
  for organizations tracking field service & asset performance. It is computed as Effective Travel Time
  / Total Travel Time, expressed in index (0-100 or normalized). It is applied across virtually every
  sector. Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  It should be maximized within the limits of cost and quality trade-offs.
