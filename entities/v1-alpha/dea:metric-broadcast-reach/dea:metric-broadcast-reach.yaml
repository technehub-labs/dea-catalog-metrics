id: dea:metric-broadcast-reach
name: Broadcast Reach
type: Metric
description: Broadcast Reach (BCR) captures the economic value created or preserved for organizations
  tracking sports & events. It is defined as Average Audience per Broadcast; the result is stated in count
  (items per period). In Sports & events, it is a recognized element of the standard performance toolkit.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
