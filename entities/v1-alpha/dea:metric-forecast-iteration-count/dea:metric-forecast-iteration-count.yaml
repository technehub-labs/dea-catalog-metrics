id: dea:metric-forecast-iteration-count
name: Forecast Iteration Count
type: Metric
description: 'Forecast Iteration Count (FIC-FP) measures how efficiently resources are converted into
  outputs in the Financial Planning & Analysis domain. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Review Cycles needed per Forecast
  Sign-Off - reported in times per period. It should be driven down, since lower readings signal healthier
  performance. Practitioners in nearly any industry can adopt it directly.'
