id: dea:metric-api-deprecation-notice-compliance
name: API Deprecation Notice Compliance
type: Metric
description: API Deprecation Notice Compliance (APIDNC) measures conformance to standards, plans, or obligations
  in the API Lifecycle Management domain. Its calculation is Deprecations Announced within Policy Lead
  Time / Deprecations, measured in percent (%). It provides the day-to-day signal that a process is running
  as designed. Higher values are better; gains are read as improvement and losses as deterioration. It
  originates from and is most used in Software practice.
abbreviation: APIDNC
unit: percent
