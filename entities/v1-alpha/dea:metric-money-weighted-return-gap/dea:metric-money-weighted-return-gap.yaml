id: dea:metric-money-weighted-return-gap
name: Money-Weighted Return Gap
type: Metric
description: Money-Weighted Return Gap (MWRG) captures the economic value created or preserved for organizations
  tracking investment performance measurement. It is computed as Money-Weighted minus Time-Weighted Return,
  expressed in percent (%). It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is managed toward a defined target band rather than an extreme - both overshoot
  and undershoot can signal problems. Its use is concentrated in Investment management.
abbreviation: MWRG
unit: percent
