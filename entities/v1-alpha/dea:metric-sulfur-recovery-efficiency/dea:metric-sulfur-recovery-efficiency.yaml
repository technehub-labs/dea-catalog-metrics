id: dea:metric-sulfur-recovery-efficiency
name: Sulfur Recovery Efficiency
type: Metric
description: Sulfur Recovery Efficiency (SRE) measures environmental and social sustainability performance
  in the Oil & Gas Downstream & Refining domain. Its calculation is Sulfur Recovered / Sulfur in Feed,
  measured in percent (%). It originates from and is most used in Oil & Gas practice. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: SRE
unit: percent
