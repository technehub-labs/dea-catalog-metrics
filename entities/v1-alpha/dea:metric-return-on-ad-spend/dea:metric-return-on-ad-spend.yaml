id: dea:metric-return-on-ad-spend
name: Return on Ad Spend
type: Metric
description: 'Within Marketing Attribution & Analytics, Return on Ad Spend (ROAS) is used to gauge the
  economic value created or preserved. It is computed as Attributed Revenue / Ad Spend, expressed in ratio
  (x:1 or x). It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.'
