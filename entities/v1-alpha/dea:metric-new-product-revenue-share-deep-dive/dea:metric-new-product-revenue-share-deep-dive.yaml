id: dea:metric-new-product-revenue-share-deep-dive
name: New Product Revenue Share (Deep Dive)
type: Metric
description: New Product Revenue Share (Deep Dive) (NPRS-D) captures growth over time for organizations
  tracking balanced scorecard - internal process perspective. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Revenue from Products under
  Three Years / Total Revenue - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: NPRS-D
unit: percent
