id: dea:metric-vehicles-per-plant-per-day-deep-dive
name: Vehicles per Plant per Day (Deep Dive)
type: Metric
description: Within Automotive Manufacturing (Deep Dive), Vehicles per Plant per Day (Deep Dive) (VPD-D)
  is used to gauge the utilization or availability of capacity. Its calculation is Units Produced / Plant
  Day, measured in count (items per period). It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Higher values are better; gains are read as improvement
  and losses as deterioration. It originates from and is most used in Automotive practice.
