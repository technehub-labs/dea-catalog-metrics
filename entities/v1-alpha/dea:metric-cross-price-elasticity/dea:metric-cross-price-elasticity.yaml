id: dea:metric-cross-price-elasticity
name: Cross-Price Elasticity
type: Metric
description: Cross-Price Elasticity (CPE) captures the economic value created or preserved for organizations
  tracking market structure & economics standard measures. Its calculation is Percent Change in Quantity
  / Percent Change in Related Price, measured in ratio (x:1 or x). It is applied across virtually every
  sector. Its value drives prioritization and resource reallocation among competing initiatives. Values
  outside the intended band, on either side, warrant investigation.
