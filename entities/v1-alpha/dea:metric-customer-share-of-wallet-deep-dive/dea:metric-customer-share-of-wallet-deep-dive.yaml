id: dea:metric-customer-share-of-wallet-deep-dive
name: Customer Share of Wallet (Deep Dive)
type: Metric
description: Within Balanced Scorecard - Customer Perspective, Customer Share of Wallet (Deep Dive) (CSW-D)
  is used to gauge the economic value created or preserved. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Spend with Company / Total Category
  Spend; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CSW-D
unit: percent
version: 1.1.0
