id: dea:metric-donor-retention-rate
name: Donor Retention Rate
type: Metric
description: Donor Retention Rate (DRR-N) measures the retention of customers, users, or assets over time
  in the Nonprofit & NGO domain. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Donors Giving Again within Year / Donors at Start; the result is
  stated in percent (%). Improvement means raising this figure toward best-in-class levels. In Nonprofit
  & NGO, it is a recognized element of the standard performance toolkit.
abbreviation: DRR-N
unit: percent
