id: dea:metric-quota-attainment
name: Quota Attainment
type: Metric
description: 'A Sales indicator, Quota Attainment (QA) quantifies conformance to standards, plans, or
  obligations. The formula is Actual Sales / Quota - reported in percent (%). It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
