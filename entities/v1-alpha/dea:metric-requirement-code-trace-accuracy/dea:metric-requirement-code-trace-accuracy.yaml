id: dea:metric-requirement-code-trace-accuracy
name: Requirement-Code Trace Accuracy
type: Metric
description: Requirement-Code Trace Accuracy (RCTA-SD) addresses the quality of outputs and outcomes and
  is a fixture of software development - coding & engineering practices reporting. Its calculation is
  Coded Behavior Matching Requirements / Sampled Behavior, measured in percent (%). Its value drives prioritization
  and resource reallocation among competing initiatives. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: RCTA-SD
unit: percent
