id: dea:metric-client-portfolio-retention-brokerage
name: Client Portfolio Retention (Brokerage)
type: Metric
description: Client Portfolio Retention (Brokerage) (CPBR) addresses the retention of customers, users,
  or assets over time and is a fixture of insurance distribution & brokerage reporting. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It is defined as Accounts
  Retained at Renewal / Accounts at Start; the result is stated in percent (%). Improvement means raising
  this figure toward best-in-class levels. In Insurance distribution, it is a recognized element of the
  standard performance toolkit.
abbreviation: CPBR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
