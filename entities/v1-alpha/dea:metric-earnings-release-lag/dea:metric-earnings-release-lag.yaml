id: dea:metric-earnings-release-lag
name: Earnings Release Lag
type: Metric
description: Within Investor Relations & Capital Markets, Earnings Release Lag (ERL) is used to gauge
  how efficiently resources are converted into outputs. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It is computed as Days from Period End to Earnings Release,
  expressed in days. It should be driven down, since lower readings signal healthier performance. Its
  use is concentrated in Listed companies.
