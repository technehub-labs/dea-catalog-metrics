id: dea:metric-capex-utilization-rate
name: Capex Utilization Rate
type: Metric
description: Capex Utilization Rate (CUR-FP) captures the economic value created or preserved for organizations
  tracking financial planning & analysis. It informs long-horizon decisions and is typically tracked on
  enterprise dashboards rather than team boards. Its calculation is Capex Spent vs Approved Plan / Plan,
  measured in percent (%). The objective is neither maximization nor minimization but staying within an
  agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: CUR-FP
unit: percent
