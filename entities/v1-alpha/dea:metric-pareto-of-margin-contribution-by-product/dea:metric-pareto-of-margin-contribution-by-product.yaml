id: dea:metric-pareto-of-margin-contribution-by-product
name: Pareto of Margin Contribution by Product
type: Metric
description: Pareto of Margin Contribution by Product (PMCP) captures the economic value created or preserved
  for organizations tracking pricing & revenue management. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Margin from Top Products / Total
  Margin; the result is stated in percent (%). The objective is neither maximization nor minimization
  but staying within an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: PMCP
unit: percent
