id: dea:metric-tax-effective-rate-variance
name: Tax Effective Rate Variance
type: Metric
description: 'A Balanced Scorecard - Financial Perspective indicator, Tax Effective Rate Variance (TERV-BSC)
  quantifies conformance to standards, plans, or obligations. The formula is Effective Tax Rate - Plan
  / Plan - reported in percent (%). It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. It is managed toward a defined target band rather than an extreme -
  both overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
