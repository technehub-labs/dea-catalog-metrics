id: dea:metric-critical-patch-compliance
name: Critical Patch Compliance
type: Metric
description: A Cybersecurity indicator, Critical Patch Compliance (CPC) quantifies conformance to standards,
  plans, or obligations. It is defined as Critical Patches Applied within SLA / Critical Patches Released;
  the result is stated in percent (%). It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CPC
unit: percent
