id: dea:metric-ai-use-case-approval-cycle-time
name: AI Use Case Approval Cycle Time
type: Metric
description: AI Use Case Approval Cycle Time (AIAC) measures how efficiently resources are converted into
  outputs in the AI Governance & Model Risk Management domain. Its calculation is Days from Proposal to
  Governance Decision, measured in days. Its value drives prioritization and resource reallocation among
  competing initiatives. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
