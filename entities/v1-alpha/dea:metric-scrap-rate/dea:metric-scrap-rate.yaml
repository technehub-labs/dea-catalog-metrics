id: dea:metric-scrap-rate
name: Scrap Rate
type: Metric
description: 'Scrap Rate (SR) addresses the quality of outputs and outcomes and is a fixture of operations
  reporting. The formula is Scrapped Units / Total Units Started - reported in percent (%). It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Lower values are better;
  each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: SR
unit: percent
