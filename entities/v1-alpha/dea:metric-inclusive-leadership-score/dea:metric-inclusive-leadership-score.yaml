id: dea:metric-inclusive-leadership-score
name: Inclusive Leadership Score
type: Metric
description: Within Diversity, Equity & Inclusion (Deep Dive), Inclusive Leadership Score (ILS-DEI) is
  used to gauge the engagement or satisfaction of the people involved. The formula is 360-Degree Rating
  of Inclusive Behaviors - reported in score (points). It is applied across virtually every sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It
  should be maximized within the limits of cost and quality trade-offs.
abbreviation: ILS-DEI
unit: score
