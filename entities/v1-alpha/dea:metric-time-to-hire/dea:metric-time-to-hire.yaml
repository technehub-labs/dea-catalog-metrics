id: dea:metric-time-to-hire
name: Time to Hire
type: Metric
description: Within Human Resources, Time to Hire (TTH) is used to gauge how efficiently resources are
  converted into outputs. It is reviewed at cadence by planning owners to correct course before issues
  become strategic. It is computed as Days from Candidate Application to Offer Acceptance, expressed in
  days. It should be driven down, since lower readings signal healthier performance. Practitioners in
  nearly any industry can adopt it directly.
