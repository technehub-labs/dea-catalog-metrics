id: dea:metric-business-continuity-plan-coverage-deep-dive
name: Business Continuity Plan Coverage (Deep Dive)
type: Metric
description: Within Business Continuity & Disaster Recovery, Business Continuity Plan Coverage (Deep Dive)
  (BCPC) is used to gauge exposure to adverse outcomes. It is defined as Critical Processes with Current
  BCP / Critical Processes; the result is stated in percent (%). It is applied across virtually every
  sector. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
abbreviation: BCPC
unit: percent
version: 1.1.0
