id: dea:metric-funding-reallocation-velocity
name: Funding Reallocation Velocity
type: Metric
description: Within PMO & Portfolio Governance, Funding Reallocation Velocity (FRV) is used to gauge how
  efficiently resources are converted into outputs. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Days from Decision to Reallocate Portfolio
  Funds - reported in days. It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
