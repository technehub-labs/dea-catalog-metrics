id: dea:metric-code-ownership-distribution-index
name: Code Ownership Distribution Index
type: Metric
description: A Software Development - Coding & Engineering Practices indicator, Code Ownership Distribution
  Index (CODI) quantifies exposure to adverse outcomes. It is reviewed at cadence by planning owners to
  correct course before issues become strategic. It is computed as Files with Single Owner / Files, expressed
  in percent (%). The objective is neither maximization nor minimization but staying within an agreed
  operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: CODI
unit: percent
