id: dea:metric-supplier-concentration-risk
name: Supplier Concentration Risk
type: Metric
description: 'A Supply Chain indicator, Supplier Concentration Risk (SCR) quantifies exposure to adverse
  outcomes. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. It is computed as Spend with Top Supplier / Total Supplier Spend, expressed in percent (%).
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
abbreviation: SCR
unit: percent
