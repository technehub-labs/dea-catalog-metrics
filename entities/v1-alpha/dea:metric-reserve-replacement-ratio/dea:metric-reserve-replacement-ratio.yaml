id: dea:metric-reserve-replacement-ratio
name: Reserve Replacement Ratio
type: Metric
description: Reserve Replacement Ratio (RRR) addresses growth over time and is a fixture of oil & gas
  reporting. Its calculation is Reserves Added / Production, measured in ratio (x:1 or x). It originates
  from and is most used in Oil & gas practice. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. It should be maximized within the limits of cost and
  quality trade-offs.
