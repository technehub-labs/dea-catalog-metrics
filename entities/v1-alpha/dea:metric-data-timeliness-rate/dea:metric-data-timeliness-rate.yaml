id: dea:metric-data-timeliness-rate
name: Data Timeliness Rate
type: Metric
description: Data Timeliness Rate (DTR-DQ) captures the quality of outputs and outcomes for organizations
  tracking data quality management. It provides the day-to-day signal that a process is running as designed.
  Its calculation is Records Available within Freshness SLA / Records, measured in percent (%). Improvement
  means raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt
  it directly.
