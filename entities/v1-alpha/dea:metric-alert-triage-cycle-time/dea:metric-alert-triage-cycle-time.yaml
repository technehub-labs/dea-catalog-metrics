id: dea:metric-alert-triage-cycle-time
name: Alert Triage Cycle Time
type: Metric
description: 'Alert Triage Cycle Time (ATCT-EF) measures how efficiently resources are converted into
  outputs in the Enterprise Fraud & Financial Crime Management domain. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Hours from Alert to Triage Decision
  - reported in hours. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
