id: dea:metric-emerging-risk-escalation-timeliness
name: Emerging Risk Escalation Timeliness
type: Metric
description: A Emerging Risk & Horizon Scanning indicator, Emerging Risk Escalation Timeliness (ERET)
  quantifies conformance to standards, plans, or obligations. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. The formula is Emerging Risks Escalated within
  Threshold / Risks Meeting Criteria - reported in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
