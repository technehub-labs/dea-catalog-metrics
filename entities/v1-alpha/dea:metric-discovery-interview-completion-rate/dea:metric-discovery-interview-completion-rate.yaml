id: dea:metric-discovery-interview-completion-rate
name: Discovery Interview Completion Rate
type: Metric
description: Within Requirements Engineering & Product Discovery, Discovery Interview Completion Rate
  (DICR-RE) is used to gauge how effectively a process or entity achieves its intended outcome. Its calculation
  is Customer Discovery Interviews Completed per Cycle / Planned, measured in percent (%). It is applied
  across virtually every sector. Its value drives prioritization and resource reallocation among competing
  initiatives. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DICR-RE
unit: percent
