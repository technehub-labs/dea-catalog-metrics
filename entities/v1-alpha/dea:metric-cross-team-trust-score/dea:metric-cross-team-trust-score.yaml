id: dea:metric-cross-team-trust-score
name: Cross-Team Trust Score
type: Metric
description: A Employee Engagement & Culture (Deep Dive) indicator, Cross-Team Trust Score (CTTS) quantifies
  the engagement or satisfaction of the people involved. It is defined as Survey Score of Inter-Team Trust;
  the result is stated in score (points). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: CTTS
unit: score
