id: dea:metric-endpoint-compliance-rate
name: Endpoint Compliance Rate
type: Metric
description: Endpoint Compliance Rate (EPCR) addresses conformance to standards, plans, or obligations
  and is a fixture of digital workplace & collaboration reporting. Front-line and delivery teams watch
  it in real time, as small deviations demand immediate correction. It is computed as Devices Meeting
  Security Baseline / Devices, expressed in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: EPCR
unit: percent
