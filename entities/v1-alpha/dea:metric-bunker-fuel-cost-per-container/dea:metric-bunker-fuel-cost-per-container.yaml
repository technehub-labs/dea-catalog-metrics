id: dea:metric-bunker-fuel-cost-per-container
name: Bunker Fuel Cost per Container
type: Metric
description: 'Bunker Fuel Cost per Container (BFCC) addresses how efficiently resources are converted
  into outputs and is a fixture of maritime & shipping reporting. It is computed as Fuel Cost / Containers
  Carried, expressed in currency per unit. Its use is concentrated in Maritime & shipping. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Reduction is the
  goal, and sustained decreases indicate successful intervention.'
