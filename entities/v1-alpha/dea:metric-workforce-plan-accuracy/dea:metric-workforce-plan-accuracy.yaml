id: dea:metric-workforce-plan-accuracy
name: Workforce Plan Accuracy
type: Metric
description: 'Workforce Plan Accuracy (WPA-WF) addresses the quality of outputs and outcomes and is a
  fixture of workforce planning & productivity reporting. It is computed as Planned vs Actual Headcount
  Variance / Plan, expressed in percent (%). It is applied across virtually every sector. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Reduction is the
  goal, and sustained decreases indicate successful intervention.'
abbreviation: WPA-WF
unit: percent
version: 1.0.1
