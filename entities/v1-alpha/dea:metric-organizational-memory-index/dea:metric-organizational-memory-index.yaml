id: dea:metric-organizational-memory-index
name: Organizational Memory Index
type: Metric
description: Within Knowledge Management (Deep Dive), Organizational Memory Index (OMI) is used to gauge
  capability maturity or development. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Rubric of Preserved Institutional Knowledge across
  Functions, measured in index (0-100 or normalized). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
