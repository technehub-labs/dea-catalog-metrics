id: dea:metric-stop-accessibility-compliance
name: Stop Accessibility Compliance
type: Metric
description: Stop Accessibility Compliance (SAC-T) addresses conformance to standards, plans, or obligations
  and is a fixture of public transit (deep dive) reporting. The formula is Stops Meeting Accessibility
  Standard / Stops - reported in percent (%). It is a standard measure in the Public Transit sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It
  should be maximized within the limits of cost and quality trade-offs.
