id: dea:metric-server-capacity-headroom-gaming
name: Server Capacity Headroom (Gaming)
type: Metric
description: Server Capacity Headroom (Gaming) (SCH-G) addresses the utilization or availability of capacity
  and is a fixture of gaming development & live operations reporting. It is computed as Peak Utilized
  Capacity / Provisioned Capacity, expressed in percent (%). Front-line and delivery teams watch it in
  real time, as small deviations demand immediate correction. It is managed toward a defined target band
  rather than an extreme - both overshoot and undershoot can signal problems. Its use is concentrated
  in Gaming.
abbreviation: SCH-G
unit: percent
