id: dea:metric-per-capita-spend-venues
name: Per Capita Spend (Venues)
type: Metric
description: Within Entertainment Venues & Attractions, Per Capita Spend (Venues) (PCSV) is used to gauge
  the economic value created or preserved. It is defined as Total Revenue / Attendance; the result is
  stated in currency per unit. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  In Media & Entertainment, it is a recognized element of the standard performance toolkit.
