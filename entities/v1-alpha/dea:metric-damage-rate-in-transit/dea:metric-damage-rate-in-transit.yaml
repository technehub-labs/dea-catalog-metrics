id: dea:metric-damage-rate-in-transit
name: Damage Rate in Transit
type: Metric
description: 'A Supply Chain indicator, Damage Rate in Transit (DRIT) quantifies the quality of outputs
  and outcomes. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  The formula is Damaged Units on Arrival / Units Shipped - reported in percent (%). It should be driven
  down, since lower readings signal healthier performance. Practitioners in nearly any industry can adopt
  it directly.'
abbreviation: DRIT
unit: percent
