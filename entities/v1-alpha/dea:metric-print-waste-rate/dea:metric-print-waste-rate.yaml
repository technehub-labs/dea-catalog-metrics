id: dea:metric-print-waste-rate
name: Print Waste Rate
type: Metric
description: Print Waste Rate (PWR) addresses how efficiently resources are converted into outputs and
  is a fixture of printing & publishing reporting. Its calculation is Wasted Sheets / Total Sheets Consumed,
  measured in percent (%). It originates from and is most used in Printing & publishing practice. It provides
  the day-to-day signal that a process is running as designed. Reduction is the goal, and sustained decreases
  indicate successful intervention.
abbreviation: PWR
unit: percent
