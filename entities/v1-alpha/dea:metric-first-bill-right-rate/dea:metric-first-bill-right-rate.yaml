id: dea:metric-first-bill-right-rate
name: First Bill Right Rate
type: Metric
description: A Telecom Customer Experience & Billing indicator, First Bill Right Rate (FBRR) quantifies
  the quality of outputs and outcomes. Its calculation is First Bills without Error / New Customer Bills,
  measured in percent (%). It originates from and is most used in Telecommunications practice. Its value
  drives prioritization and resource reallocation among competing initiatives. It should be maximized
  within the limits of cost and quality trade-offs.
