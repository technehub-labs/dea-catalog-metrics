id: dea:metric-regulatory-engagement-success-rate
name: Regulatory Engagement Success Rate
type: Metric
description: 'Regulatory Engagement Success Rate (RESR) addresses how effectively a process or entity
  achieves its intended outcome and is a fixture of regulatory affairs & compliance operations reporting.
  It is computed as Favorable or Neutral Outcomes / Engagements with Regulator, expressed in percent (%).
  It is applied across virtually every sector. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It should be maximized within the limits of cost and quality
  trade-offs.'
