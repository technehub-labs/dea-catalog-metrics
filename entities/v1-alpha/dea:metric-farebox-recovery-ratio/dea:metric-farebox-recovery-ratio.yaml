id: dea:metric-farebox-recovery-ratio
name: Farebox Recovery Ratio
type: Metric
description: Farebox Recovery Ratio (FBR) addresses the economic value created or preserved and is a fixture
  of public transit reporting. The formula is Fare Revenue / Operating Costs - reported in percent (%).
  It carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs.
  Higher values are better; gains are read as improvement and losses as deterioration. It is a standard
  measure in the Public transit sector.
