id: dea:metric-average-gift-size
name: Average Gift Size
type: Metric
description: Average Gift Size (AGS) measures the economic value created or preserved in the Nonprofit
  & NGO domain. It is computed as Total Donations / Number of Gifts, expressed in currency value. Its
  use is concentrated in Nonprofit & NGO. It is reviewed at cadence by planning owners to correct course
  before issues become strategic. It should be maximized within the limits of cost and quality trade-offs.
