id: dea:metric-vm-program-maturity-index
name: VM Program Maturity Index
type: Metric
description: Within Vulnerability & Exposure Management, VM Program Maturity Index (VMPMI) is used to
  gauge capability maturity or development. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Composite Program Capability Score; the result is
  stated in index (0-100 or normalized). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
