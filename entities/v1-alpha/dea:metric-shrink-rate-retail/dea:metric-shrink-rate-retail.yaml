id: dea:metric-shrink-rate-retail
name: Shrink Rate (Retail)
type: Metric
description: 'A Retail & E-commerce indicator, Shrink Rate (Retail) (ShR-R) quantifies exposure to adverse
  outcomes. The formula is (Recorded Inventory - Counted Inventory) / Sales - reported in percent (%).
  It is a standard measure in the Retail sector. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. Reduction is the goal, and sustained decreases indicate
  successful intervention.'
abbreviation: ShR-R
unit: percent
