id: dea:metric-hiring-diversity-rate-deep-dive
name: Hiring Diversity Rate (Deep Dive)
type: Metric
description: Hiring Diversity Rate (Deep Dive) (HDR-DEI) captures capability maturity or development for
  organizations tracking diversity, equity & inclusion (deep dive). The formula is Diverse Hires / Total
  Hires - reported in percent (%). It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. It is managed toward a defined target band rather than an extreme - both
  overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: HDR-DEI
unit: percent
