id: dea:metric-hazardous-waste-generation
name: Hazardous Waste Generation
type: Metric
description: Hazardous Waste Generation (HWG) captures environmental and social sustainability performance
  for organizations tracking sustainability & esg. The formula is Hazardous Waste Produced per Period
  - reported in tonnes. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
