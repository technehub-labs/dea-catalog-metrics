id: dea:metric-deployment-frequency
name: Deployment Frequency
type: Metric
description: Deployment Frequency (DF) addresses how efficiently resources are converted into outputs
  and is a fixture of software engineering reporting. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Production Deployments
  per Period, measured in times per period. Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
