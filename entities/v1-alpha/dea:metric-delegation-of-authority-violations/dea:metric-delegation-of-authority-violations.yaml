id: dea:metric-delegation-of-authority-violations
name: Delegation of Authority Violations
type: Metric
description: Delegation of Authority Violations (DOAV) captures conformance to standards, plans, or obligations
  for organizations tracking corporate governance. It is defined as Decisions outside Approved Authority
  Levels / Decisions Audited; the result is stated in percent (%). It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: DOAV
unit: percent
