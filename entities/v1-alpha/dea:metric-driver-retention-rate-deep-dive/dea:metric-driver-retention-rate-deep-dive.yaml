id: dea:metric-driver-retention-rate-deep-dive
name: Driver Retention Rate (Deep Dive)
type: Metric
description: Driver Retention Rate (Deep Dive) (DRR-D) captures the retention of customers, users, or
  assets over time for organizations tracking parcel & last-mile logistics (deep dive). The formula is
  Drivers Retained / Drivers Employed - reported in percent (%). It is a standard measure in the Logistics
  & Trade sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DRR-D
unit: percent
