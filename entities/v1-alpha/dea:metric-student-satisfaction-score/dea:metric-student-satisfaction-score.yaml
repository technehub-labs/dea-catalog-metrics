id: dea:metric-student-satisfaction-score
name: Student Satisfaction Score
type: Metric
description: 'Student Satisfaction Score (SSS) captures the engagement or satisfaction of the people involved
  for organizations tracking education. The formula is Satisfied Student Survey Responses / Responses
  - reported in percent (%). It is a standard measure in the Education sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
