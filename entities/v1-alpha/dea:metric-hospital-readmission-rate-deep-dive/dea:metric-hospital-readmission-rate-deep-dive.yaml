id: dea:metric-hospital-readmission-rate-deep-dive
name: Hospital Readmission Rate (Deep Dive)
type: Metric
description: Within Medical Practice & Clinical Operations, Hospital Readmission Rate (Deep Dive) (HRR-D)
  is used to gauge the quality of outputs and outcomes. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Readmissions within 30
  Days / Discharges, measured in percent (%). It should be driven down, since lower readings signal healthier
  performance. It originates from and is most used in Healthcare practice.
abbreviation: HRR-D
unit: percent
