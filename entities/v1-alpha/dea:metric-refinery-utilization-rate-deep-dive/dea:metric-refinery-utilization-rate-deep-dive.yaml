id: dea:metric-refinery-utilization-rate-deep-dive
name: Refinery Utilization Rate (Deep Dive)
type: Metric
description: Refinery Utilization Rate (Deep Dive) (RUR) addresses the utilization or availability of
  capacity and is a fixture of oil & gas downstream & refining reporting. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. The formula is Barrels Processed
  per Day / Crude Distillation Capacity - reported in percent (%). Improvement means raising this figure
  toward best-in-class levels. It is a standard measure in the Oil & Gas sector.
abbreviation: RUR
unit: percent
