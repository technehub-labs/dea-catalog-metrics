id: dea:metric-customer-effort-score
name: Customer Effort Score
type: Metric
description: Within Customer, Customer Effort Score (CES) is used to gauge the engagement or satisfaction
  of the people involved. It is defined as Average Ease Rating on 7-Point Scale; the result is stated
  in score (points). It bridges daily operations and executive reporting, giving managers a lever to pull
  within a quarter. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
