id: dea:metric-order-picking-cost-per-order
name: Order Picking Cost per Order
type: Metric
description: Within Retail & E-commerce, Order Picking Cost per Order (OPC) is used to gauge how efficiently
  resources are converted into outputs. Its calculation is Total Picking Cost / Orders, measured in currency
  per unit. It originates from and is most used in Retail practice. It provides the day-to-day signal
  that a process is running as designed. Reduction is the goal, and sustained decreases indicate successful
  intervention.
