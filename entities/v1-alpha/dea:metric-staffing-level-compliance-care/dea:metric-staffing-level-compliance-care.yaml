id: dea:metric-staffing-level-compliance-care
name: Staffing Level Compliance (Care)
type: Metric
description: Staffing Level Compliance (Care) (SLCC) captures conformance to standards, plans, or obligations
  for organizations tracking elder & social care. The formula is Shifts Meeting Minimum Staffing / Shifts
  - reported in percent (%). It is a standard measure in the Social care sector. It carries weight in
  boardroom and executive reviews, where it anchors cross-organization trade-offs. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: SLCC
unit: percent
