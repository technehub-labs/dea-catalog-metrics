id: dea:metric-regression-test-completion-rate
name: Regression Test Completion Rate
type: Metric
description: Regression Test Completion Rate (RTCR-QA) addresses conformance to standards, plans, or obligations
  and is a fixture of software testing & quality engineering reporting. It provides the day-to-day signal
  that a process is running as designed. Its calculation is Regression Runs Completed per Release / Required,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
