id: dea:metric-customer-attrition-post-merger
name: Customer Attrition Post-Merger
type: Metric
description: Customer Attrition Post-Merger (CAPM) measures the retention of customers, users, or assets
  over time in the Mergers & Acquisitions domain. Its calculation is Customers Lost in Year One / Customers
  at Close, measured in percent (%). It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Reduction is the
  goal, and sustained decreases indicate successful intervention.
abbreviation: CAPM
unit: percent
