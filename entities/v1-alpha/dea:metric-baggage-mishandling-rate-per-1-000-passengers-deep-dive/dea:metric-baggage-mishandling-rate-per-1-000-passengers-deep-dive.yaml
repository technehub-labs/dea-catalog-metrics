id: dea:metric-baggage-mishandling-rate-per-1-000-passengers-deep-dive
name: Baggage Mishandling Rate per 1,000 Passengers (Deep Dive)
type: Metric
description: Baggage Mishandling Rate per 1,000 Passengers (Deep Dive) (BMR-D) addresses the quality of
  outputs and outcomes and is a fixture of airline operations (deep dive) reporting. It is defined as
  Mishandled Bags / 1,000 Passengers; the result is stated in events per thousand or million (scaled).
  In Airlines, it is a recognized element of the standard performance toolkit. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. Reduction is the goal, and sustained
  decreases indicate successful intervention.
