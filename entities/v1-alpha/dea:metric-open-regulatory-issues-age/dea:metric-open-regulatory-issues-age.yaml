id: dea:metric-open-regulatory-issues-age
name: Open Regulatory Issues Age
type: Metric
description: 'Within Risk & Compliance, Open Regulatory Issues Age (ORIA) is used to gauge exposure to
  adverse outcomes. The formula is Median Age of Open Regulatory Issues - reported in days. It guides
  mid-horizon planning: portfolio, program, and function owners act on it between review cycles. Lower
  values are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
