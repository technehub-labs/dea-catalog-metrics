id: dea:metric-whistleblower-report-resolution-time
name: Whistleblower Report Resolution Time
type: Metric
description: Whistleblower Report Resolution Time (WRRT) captures conformance to standards, plans, or
  obligations for organizations tracking risk & compliance. It is defined as Days from Report to Case
  Closure; the result is stated in days. It bridges daily operations and executive reporting, giving managers
  a lever to pull within a quarter. Lower values are better; each reduction is an improvement. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: WRRT
unit: day
