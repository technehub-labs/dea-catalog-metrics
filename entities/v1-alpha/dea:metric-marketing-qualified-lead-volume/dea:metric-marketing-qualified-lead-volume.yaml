id: dea:metric-marketing-qualified-lead-volume
name: Marketing Qualified Lead Volume
type: Metric
description: Marketing Qualified Lead Volume (MQL) captures growth over time for organizations tracking
  marketing. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It is defined as Count of Leads Meeting Scoring Threshold; the result is stated in count
  (items per period). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
