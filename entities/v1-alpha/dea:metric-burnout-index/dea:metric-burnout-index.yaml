id: dea:metric-burnout-index
name: Burnout Index
type: Metric
description: A Employee Wellbeing indicator, Burnout Index (BOI) quantifies exposure to adverse outcomes.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Its calculation is Weighted Index of Exhaustion, Cynicism, and Efficacy Survey Items, measured
  in index (0-100 or normalized). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
