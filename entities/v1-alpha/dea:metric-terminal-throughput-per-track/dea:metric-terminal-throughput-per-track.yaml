id: dea:metric-terminal-throughput-per-track
name: Terminal Throughput per Track
type: Metric
description: Terminal Throughput per Track (TTPT) captures the utilization or availability of capacity
  for organizations tracking rail freight (deep dive). It is computed as Cars Handled / Track Day, expressed
  in count (items per period). Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Rail.
