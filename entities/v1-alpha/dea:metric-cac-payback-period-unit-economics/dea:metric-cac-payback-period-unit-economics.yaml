id: dea:metric-cac-payback-period-unit-economics
name: CAC Payback Period (Unit Economics)
type: Metric
description: 'Within Unit Economics & Growth (Deep Dive), CAC Payback Period (Unit Economics) (CACPPD)
  is used to gauge how efficiently resources are converted into outputs. It is computed as CAC / Monthly
  Contribution Margin per Customer, expressed in months. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Software.'
