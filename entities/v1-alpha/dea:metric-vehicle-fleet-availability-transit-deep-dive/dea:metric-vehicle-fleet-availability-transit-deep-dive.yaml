id: dea:metric-vehicle-fleet-availability-transit-deep-dive
name: Vehicle Fleet Availability (Transit Deep Dive)
type: Metric
description: Vehicle Fleet Availability (Transit Deep Dive) (VFA-D) measures the utilization or availability
  of capacity in the Public Transit (Deep Dive) domain. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Vehicles Available for Service / Peak
  Vehicles Required - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Public Transit sector.
abbreviation: VFA-D
unit: percent
