id: dea:metric-vacancy-cost-drag
name: Vacancy Cost Drag
type: Metric
description: 'Vacancy Cost Drag (VCD-RE) captures the economic value created or preserved for organizations
  tracking real estate & mortgage standard measures. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Rent Lost to Vacancy / Potential
  Gross Rent, expressed in percent (%). It should be driven down, since lower readings signal healthier
  performance. Its use is concentrated in Real estate.'
abbreviation: VCD-RE
unit: percent
version: 1.1.0
lifecycle_status: candidate
