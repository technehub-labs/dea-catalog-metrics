id: dea:metric-aircraft-mission-capability-rate
name: Aircraft Mission Capability Rate
type: Metric
description: 'A Defense & Aerospace indicator, Aircraft Mission Capability Rate (MCR) quantifies the utilization
  or availability of capacity. It is computed as Aircraft Available for Tasking / Aircraft Assigned, expressed
  in percent (%). It is a headline indicator: movement in it prompts leadership questions about strategy
  and resourcing. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Defense & aerospace.'
abbreviation: MCR
unit: percent
