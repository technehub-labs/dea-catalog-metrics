id: dea:metric-distribution-to-paid-in-ratio-private
name: Distribution-to-Paid-In Ratio (Private)
type: Metric
description: 'Distribution-to-Paid-In Ratio (Private) (DPI-IM) addresses the economic value created or
  preserved and is a fixture of investment management - portfolio operations reporting. It is computed
  as Distributions Paid to Investors / Capital Contributed, expressed in ratio (x:1 or x). It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is concentrated in Financial
  Services.'
