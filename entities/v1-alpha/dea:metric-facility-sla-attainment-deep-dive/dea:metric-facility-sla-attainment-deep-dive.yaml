id: dea:metric-facility-sla-attainment-deep-dive
name: Facility SLA Attainment (Deep Dive)
type: Metric
description: A Facility Management & Workplace (Deep Dive) indicator, Facility SLA Attainment (Deep Dive)
  (FSLA-D) quantifies conformance to standards, plans, or obligations. Its value drives prioritization
  and resource reallocation among competing initiatives. Its calculation is SLAs Met / SLAs Measured,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
