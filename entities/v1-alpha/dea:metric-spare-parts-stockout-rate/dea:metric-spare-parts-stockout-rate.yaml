id: dea:metric-spare-parts-stockout-rate
name: Spare Parts Stockout Rate
type: Metric
description: 'Spare Parts Stockout Rate (SPS) captures exposure to adverse outcomes for organizations
  tracking maintenance & reliability. The formula is Critical Spare Stockouts / Spare Parts Demand Events
  - reported in percent (%). It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. Lower values are better; each reduction is an improvement. It is a standard measure
  in the Manufacturing sector.'
abbreviation: SPS
unit: percent
