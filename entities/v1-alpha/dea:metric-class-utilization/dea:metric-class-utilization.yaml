id: dea:metric-class-utilization
name: Class Utilization
type: Metric
description: Class Utilization (CLU) captures the utilization or availability of capacity for organizations
  tracking fitness & wellness. It is computed as Attendees / Class Capacity, expressed in percent (%).
  Front-line and delivery teams watch it in real time, as small deviations demand immediate correction.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is concentrated
  in Fitness & wellness.
abbreviation: CLU
unit: percent
