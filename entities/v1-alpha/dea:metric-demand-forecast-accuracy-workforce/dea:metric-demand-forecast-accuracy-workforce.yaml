id: dea:metric-demand-forecast-accuracy-workforce
name: Demand Forecast Accuracy (Workforce)
type: Metric
description: Within Workforce Planning & Analytics, Demand Forecast Accuracy (Workforce) (DFAW) is used
  to gauge the quality of outputs and outcomes. It is defined as 1 - ABS(Forecast Staffing - Required
  Staffing) / Required Staffing; the result is stated in percent (%). It is applied across virtually every
  sector. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DFAW
unit: percent
