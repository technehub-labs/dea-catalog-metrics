id: dea:metric-dock-to-stock-time
name: Dock-to-Stock Time
type: Metric
description: 'Dock-to-Stock Time (D2S) measures how efficiently resources are converted into outputs in
  the Logistics & Transportation domain. The formula is Hours from Receiving Dock to Stock Availability
  - reported in hours. It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Lower values are better; each reduction is an improvement. It is a standard measure in the Logistics
  sector.'
