id: dea:metric-error-budget-remaining
name: Error Budget Remaining
type: Metric
description: Error Budget Remaining (EBREM) measures exposure to adverse outcomes in the SRE & Observability
  Standard Measures domain. The formula is Allowed Errors minus Consumed Errors / Allowed Errors - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. It
  is a standard measure in the Software sector.
abbreviation: EBREM
unit: percent
