id: dea:metric-tax-transparency-disclosure-rate
name: Tax Transparency Disclosure Rate
type: Metric
description: Tax Transparency Disclosure Rate (TTDR) measures governance in the Environmental, Social
  & Governance Reporting domain. It is defined as Country-by-Country Items Disclosed / Required; the result
  is stated in percent (%). Its trend is watched by senior leadership as an early signal of structural
  performance shifts. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: TTDR
unit: percent
version: 1.1.0
