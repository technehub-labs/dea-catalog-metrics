name: Fund Expense Ratio Trend
type: Metric
description: Within Investment Management - Portfolio Operations, Fund Expense Ratio Trend (FERT-IM) is
  used to gauge how efficiently resources are converted into outputs. Its calculation is Total Expense
  Ratio Change per Year, measured in percent (%). It originates from and is most used in Financial Services
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Reduction is the goal, and sustained decreases indicate successful intervention.
