id: dea:metric-dust-emissions-compliance-rate-cement
name: Dust Emissions Compliance Rate (Cement)
type: Metric
description: 'Within Cement & Building Materials, Dust Emissions Compliance Rate (Cement) (DECR) is used
  to gauge conformance to standards, plans, or obligations. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as Stack Tests within Limits
  / Tests, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Its use is concentrated in Manufacturing.'
