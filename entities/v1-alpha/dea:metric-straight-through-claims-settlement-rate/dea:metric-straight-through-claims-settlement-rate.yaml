id: dea:metric-straight-through-claims-settlement-rate
name: Straight-Through Claims Settlement Rate
type: Metric
description: Within Insurance Claims Deep Dive, Straight-Through Claims Settlement Rate (STCS) is used
  to gauge how efficiently resources are converted into outputs. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Claims Settled without Human Touch
  / Claims; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. In Insurance, it is a recognized element of the standard performance toolkit.
abbreviation: STCS
unit: percent
