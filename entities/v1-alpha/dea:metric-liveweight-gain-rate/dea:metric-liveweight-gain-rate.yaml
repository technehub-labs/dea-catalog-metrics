id: dea:metric-liveweight-gain-rate
name: Liveweight Gain Rate
type: Metric
description: Liveweight Gain Rate (LWG) captures how efficiently resources are converted into outputs
  for organizations tracking agriculture & food processing. Its calculation is Animal Weight Gain / Days
  on Feed, measured in ratio (x:1 or x). It provides the day-to-day signal that a process is running as
  designed. Higher values are better; gains are read as improvement and losses as deterioration. It originates
  from and is most used in Agriculture & food practice.
