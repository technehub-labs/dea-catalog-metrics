id: dea:metric-cash-conversion-cycle-deep-dive
name: Cash Conversion Cycle (Deep Dive)
type: Metric
description: 'Cash Conversion Cycle (Deep Dive) (CCC-D) measures how efficiently resources are converted
  into outputs in the Corporate Treasury (Deep Dive) domain. It is a headline indicator: movement in it
  prompts leadership questions about strategy and resourcing. It is computed as DIO + DSO - DPO, expressed
  in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
