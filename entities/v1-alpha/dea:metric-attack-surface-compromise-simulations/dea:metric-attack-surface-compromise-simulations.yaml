id: dea:metric-attack-surface-compromise-simulations
name: Attack Surface Compromise Simulations
type: Metric
description: Attack Surface Compromise Simulations (ASCS) addresses exposure to adverse outcomes and is
  a fixture of threat intelligence & red team reporting. Its calculation is Compromise Paths Demonstrated
  per Exercise, measured in count (items per period). It is applied across virtually every sector. Its
  value drives prioritization and resource reallocation among competing initiatives. Reduction is the
  goal, and sustained decreases indicate successful intervention.
