id: dea:metric-student-attendance-rate-deep-dive
name: Student Attendance Rate (Deep Dive)
type: Metric
description: 'A Education & Training Outcome Standard Measures indicator, Student Attendance Rate (Deep
  Dive) (SARDD) quantifies the engagement or satisfaction of the people involved. It is monitored close
  to the work: teams act on it within a shift, sprint, or daily review. The formula is Attended Sessions
  / Scheduled Sessions - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Education sector.'
