id: dea:metric-model-backtesting-pass-rate-actuarial
name: Model Backtesting Pass Rate (Actuarial)
type: Metric
description: 'Model Backtesting Pass Rate (Actuarial) (MBPR) addresses the quality of outputs and outcomes
  and is a fixture of actuarial & reserving reporting. It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as Models Meeting Backtest Tolerances
  / Models Tested, expressed in percent (%). Improvement means raising this figure toward best-in-class
  levels. Its use is concentrated in Insurance.'
