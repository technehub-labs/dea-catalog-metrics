id: dea:metric-divestiture-completion-time
name: Divestiture Completion Time
type: Metric
description: Divestiture Completion Time (DVC) captures how efficiently resources are converted into outputs
  for organizations tracking mergers & acquisitions. Its calculation is Days from Decision to Completed
  Divestiture, measured in days. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Lower values are better; each reduction is an improvement. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.
