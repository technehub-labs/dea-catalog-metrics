id: dea:metric-first-notice-of-loss-response-time
name: First Notice of Loss Response Time
type: Metric
description: 'A Claims Operations (Insurance) indicator, First Notice of Loss Response Time (FNOLT) quantifies
  how efficiently resources are converted into outputs. It is defined as Hours from Loss Notification
  to First Customer Contact; the result is stated in hours. It is a working-level control: thresholds
  trigger immediate operational response. Lower values are better; each reduction is an improvement. In
  Insurance, it is a recognized element of the standard performance toolkit.'
