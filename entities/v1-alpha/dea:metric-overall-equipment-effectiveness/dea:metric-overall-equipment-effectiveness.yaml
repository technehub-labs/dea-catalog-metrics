id: dea:metric-overall-equipment-effectiveness
name: Overall Equipment Effectiveness
type: Metric
description: Within Operations, Overall Equipment Effectiveness (OEE) is used to gauge how effectively
  a process or entity achieves its intended outcome. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Availability x Performance
  x Quality, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: OEE
unit: percent
