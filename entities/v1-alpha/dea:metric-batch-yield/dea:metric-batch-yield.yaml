id: dea:metric-batch-yield
name: Batch Yield
type: Metric
description: 'Within Pharmaceuticals & Life Sciences, Batch Yield (BAY) is used to gauge the quality of
  outputs and outcomes. The formula is Conforming Product Mass / Input Mass - reported in percent (%).
  It is a standard measure in the Pharmaceuticals sector. It is monitored close to the work: teams act
  on it within a shift, sprint, or daily review. It should be maximized within the limits of cost and
  quality trade-offs.'
