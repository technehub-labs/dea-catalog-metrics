id: dea:metric-page-load-time
name: Page Load Time
type: Metric
description: Page Load Time (PLT) captures the quality of outputs and outcomes for organizations tracking
  it service management. Front-line and delivery teams watch it in real time, as small deviations demand
  immediate correction. It is computed as Median Browser Load Time for Key Pages, expressed in seconds.
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
