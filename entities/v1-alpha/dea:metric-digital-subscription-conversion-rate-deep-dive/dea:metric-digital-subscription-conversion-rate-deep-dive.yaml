id: dea:metric-digital-subscription-conversion-rate-deep-dive
name: Digital Subscription Conversion Rate (Deep Dive)
type: Metric
description: Digital Subscription Conversion Rate (Deep Dive) (DSCR-D) addresses growth over time and
  is a fixture of publishing & news media reporting. It is defined as New Digital Subscribers / Anonymous
  Visitors; the result is stated in percent (%). In Media & Entertainment, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: DSCR-D
