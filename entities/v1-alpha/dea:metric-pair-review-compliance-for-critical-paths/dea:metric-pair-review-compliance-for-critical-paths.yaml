id: dea:metric-pair-review-compliance-for-critical-paths
name: Pair Review Compliance for Critical Paths
type: Metric
description: 'Pair Review Compliance for Critical Paths (PRCC) measures exposure to adverse outcomes in
  the Code Review & Peer Quality domain. The formula is Critical-Path Changes with Two Reviewers / Critical-Path
  Changes - reported in percent (%). It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Higher values are better; gains are read as improvement and losses as deterioration.
  It is a standard measure in the Software sector.'
abbreviation: PRCC
unit: percent
