id: dea:metric-cross-zone-availability-compliance
name: Cross-Zone Availability Compliance
type: Metric
description: Within Data Centers & Cloud Infrastructure, Cross-Zone Availability Compliance (CZAC) is
  used to gauge exposure to adverse outcomes. Its calculation is Services Meeting Zone Redundancy Standard
  / Services, measured in percent (%). It originates from and is most used in Technology practice. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
