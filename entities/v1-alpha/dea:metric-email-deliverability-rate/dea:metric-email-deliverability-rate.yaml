id: dea:metric-email-deliverability-rate
name: Email Deliverability Rate
type: Metric
description: 'Email Deliverability Rate (EDR) captures the quality of outputs and outcomes for organizations
  tracking marketing. The formula is Emails Delivered / Emails Sent - reported in percent (%). It is monitored
  close to the work: teams act on it within a shift, sprint, or daily review. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
