id: dea:metric-left-without-being-seen-rate
name: Left Without Being Seen Rate
type: Metric
description: 'A Healthcare Quality & Patient Safety Standard Measures indicator, Left Without Being Seen
  Rate (LWBS) quantifies the quality of outputs and outcomes. The formula is ED Patients Leaving before
  Clinical Evaluation / ED Arrivals - reported in percent (%). It is a standard measure in the Healthcare
  sector. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
