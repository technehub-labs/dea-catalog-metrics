id: dea:metric-flight-cancellation-rate
name: Flight Cancellation Rate
type: Metric
description: A Airlines & Aviation indicator, Flight Cancellation Rate (FCR) quantifies exposure to adverse
  outcomes. Its calculation is Cancelled Flights / Scheduled Flights, measured in percent (%). It originates
  from and is most used in Airlines & aviation practice. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Reduction is the goal, and sustained decreases
  indicate successful intervention.
