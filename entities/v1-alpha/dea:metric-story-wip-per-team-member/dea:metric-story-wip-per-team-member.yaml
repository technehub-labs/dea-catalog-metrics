id: dea:metric-story-wip-per-team-member
name: Story WIP per Team Member
type: Metric
description: Story WIP per Team Member (SWTM-AG) captures how efficiently resources are converted into
  outputs for organizations tracking agile delivery & team effectiveness. It provides the day-to-day signal
  that a process is running as designed. Its calculation is In-Progress Stories / Team Members, measured
  in count (items per period). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: SWTM-AG
unit: count
