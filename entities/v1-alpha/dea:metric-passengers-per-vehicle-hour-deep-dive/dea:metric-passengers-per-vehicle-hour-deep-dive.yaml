id: dea:metric-passengers-per-vehicle-hour-deep-dive
name: Passengers per Vehicle Hour (Deep Dive)
type: Metric
description: A Public Transit (Deep Dive) indicator, Passengers per Vehicle Hour (Deep Dive) (PPVH-D)
  quantifies how efficiently resources are converted into outputs. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Passengers / Vehicle
  Revenue Hour - reported in count (items per period). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Public Transit sector.
abbreviation: PPVH-D
