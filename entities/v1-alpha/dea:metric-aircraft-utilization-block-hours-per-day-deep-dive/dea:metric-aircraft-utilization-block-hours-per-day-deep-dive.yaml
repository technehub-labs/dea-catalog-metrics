id: dea:metric-aircraft-utilization-block-hours-per-day-deep-dive
name: Aircraft Utilization - Block Hours per Day (Deep Dive)
type: Metric
description: Within Airline Operations (Deep Dive), Aircraft Utilization - Block Hours per Day (Deep Dive)
  (AUHD-D) is used to gauge the utilization or availability of capacity. The formula is Block Hours /
  Aircraft Days - reported in hours. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. Higher values are better; gains are read as improvement and losses as
  deterioration. It is a standard measure in the Airlines sector.
