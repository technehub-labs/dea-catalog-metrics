id: dea:metric-preventive-to-reactive-work-ratio
name: Preventive-to-Reactive Work Ratio
type: Metric
description: Preventive-to-Reactive Work Ratio (PRWR-F) addresses exposure to adverse outcomes and is
  a fixture of field service & asset performance reporting. It is computed as PM Work Orders / Reactive
  Work Orders, expressed in ratio (x:1 or x). It is applied across virtually every sector. It is reviewed
  at cadence by planning owners to correct course before issues become strategic. It should be maximized
  within the limits of cost and quality trade-offs.
abbreviation: PRWR-F
