id: dea:metric-api-change-failure-rate
name: API Change Failure Rate
type: Metric
description: 'API Change Failure Rate (APICFR) captures the quality of outputs and outcomes for organizations
  tracking api lifecycle management. It is defined as API Changes Causing Incident / API Changes; the
  result is stated in percent (%). In Software, it is a recognized element of the standard performance
  toolkit. It is a working-level control: thresholds trigger immediate operational response. Reduction
  is the goal, and sustained decreases indicate successful intervention.'
abbreviation: APICFR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
