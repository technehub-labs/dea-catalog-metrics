id: dea:metric-punch-list-closure-time
name: Punch List Closure Time
type: Metric
description: Within Construction & Engineering, Punch List Closure Time (PLCT) is used to gauge how efficiently
  resources are converted into outputs. It is computed as Days from Handover Inspection to Punch List
  Completion, expressed in days. Its use is concentrated in Construction & engineering. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. Reduction is
  the goal, and sustained decreases indicate successful intervention.
