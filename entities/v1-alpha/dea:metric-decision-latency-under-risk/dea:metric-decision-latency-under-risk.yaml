id: dea:metric-decision-latency-under-risk
name: Decision Latency under Risk
type: Metric
description: Decision Latency under Risk (DLUR) measures how efficiently resources are converted into
  outputs in the Project Risk & Issue Management domain. Its value drives prioritization and resource
  reallocation among competing initiatives. Its calculation is Days Risk-Aged Decisions Pending, measured
  in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
