id: dea:metric-relative-market-share
name: Relative Market Share
type: Metric
description: Relative Market Share (RMS) measures growth over time in the Market Structure & Economics
  Standard Measures domain. The formula is Entity Market Share / Largest Competitor Share - reported in
  ratio (x:1 or x). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
