id: dea:metric-privacy-breach-notification-timeliness
name: Privacy Breach Notification Timeliness
type: Metric
description: Privacy Breach Notification Timeliness (PBNT) addresses exposure to adverse outcomes and
  is a fixture of data privacy & protection reporting. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Breaches Notified to Regulator within
  Deadline / Notifiable Breaches - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: PBNT
unit: percent
