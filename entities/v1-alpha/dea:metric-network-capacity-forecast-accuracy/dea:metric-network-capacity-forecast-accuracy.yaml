id: dea:metric-network-capacity-forecast-accuracy
name: Network Capacity Forecast Accuracy
type: Metric
description: Network Capacity Forecast Accuracy (NCFA) measures the utilization or availability of capacity
  in the Network Performance & Capacity domain. It is computed as Forecast vs Actual Utilization Variance,
  expressed in percent (%). It is applied across virtually every sector. It is reviewed at cadence by
  planning owners to correct course before issues become strategic. Values outside the intended band,
  on either side, warrant investigation.
