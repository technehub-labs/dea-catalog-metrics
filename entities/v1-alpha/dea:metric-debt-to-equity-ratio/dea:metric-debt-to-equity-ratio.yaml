id: dea:metric-debt-to-equity-ratio
name: Debt-to-Equity Ratio
type: Metric
description: Debt-to-Equity Ratio (D/E) measures exposure to adverse outcomes in the Finance & Accounting
  domain. It is defined as Total Debt / Shareholders' Equity; the result is stated in ratio (x:1 or x).
  It is applied across virtually every sector. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. Values outside the intended band, on either side, warrant investigation.
