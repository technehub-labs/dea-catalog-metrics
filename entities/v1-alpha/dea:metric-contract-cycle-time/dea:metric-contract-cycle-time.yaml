id: dea:metric-contract-cycle-time
name: Contract Cycle Time
type: Metric
description: Within Legal, Contract Cycle Time (CnCT) is used to gauge how efficiently resources are converted
  into outputs. Its calculation is Days from Request to Fully Executed Contract, measured in days. Its
  value drives prioritization and resource reallocation among competing initiatives. Lower values are
  better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
