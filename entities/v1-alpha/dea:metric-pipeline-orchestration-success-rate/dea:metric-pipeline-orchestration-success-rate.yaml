id: dea:metric-pipeline-orchestration-success-rate
name: Pipeline Orchestration Success Rate
type: Metric
description: Pipeline Orchestration Success Rate (POSR-M) addresses the quality of outputs and outcomes
  and is a fixture of mlops & model lifecycle operations reporting. It is computed as Orchestrated DAG
  Runs Succeeding / Runs, expressed in percent (%). Front-line and delivery teams watch it in real time,
  as small deviations demand immediate correction. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: POSR-M
