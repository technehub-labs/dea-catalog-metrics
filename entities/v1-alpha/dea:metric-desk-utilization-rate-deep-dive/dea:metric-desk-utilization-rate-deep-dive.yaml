id: dea:metric-desk-utilization-rate-deep-dive
name: Desk Utilization Rate (Deep Dive)
type: Metric
description: 'A Facility Management & Workplace (Deep Dive) indicator, Desk Utilization Rate (Deep Dive)
  (DUR-D) quantifies the utilization or availability of capacity. It is computed as Days Desks Used /
  Days Desks Available, expressed in percent (%). It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Higher values are better; gains are read as improvement and
  losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: DUR-D
unit: percent
