id: dea:metric-reliability-growth-rate
name: Reliability Growth Rate
type: Metric
description: Within Reliability & Maintainability Engineering (Deep Dive), Reliability Growth Rate (RGR-RM)
  is used to gauge the quality of outputs and outcomes. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Change in MTBF across Test-Fix-Test Cycles
  - reported in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
