id: dea:metric-accessibility-compliance-rate-transit
name: Accessibility Compliance Rate (Transit)
type: Metric
description: A Public Transit indicator, Accessibility Compliance Rate (Transit) (ACR-T) quantifies conformance
  to standards, plans, or obligations. Its calculation is Stops and Vehicles Meeting Accessibility Standards
  / Total, measured in percent (%). It originates from and is most used in Public transit practice. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
