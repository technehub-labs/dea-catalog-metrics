id: dea:metric-data-governance-coverage
name: Data Governance Coverage
type: Metric
description: Within Data Management & Analytics, Data Governance Coverage (DGC) is used to gauge conformance
  to standards, plans, or obligations. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It is defined as Data Domains with Steward and Standards / Total Domains;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
