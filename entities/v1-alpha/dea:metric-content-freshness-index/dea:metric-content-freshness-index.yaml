id: dea:metric-content-freshness-index
name: Content Freshness Index
type: Metric
description: 'Content Freshness Index (CFI) measures conformance to standards, plans, or obligations in
  the Digital Product & Web Operations domain. It is a working-level control: thresholds trigger immediate
  operational response. It is defined as Pages Updated within Review Cadence / Total Pages; the result
  is stated in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.'
