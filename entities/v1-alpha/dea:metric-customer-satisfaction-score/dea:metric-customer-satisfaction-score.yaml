id: dea:metric-customer-satisfaction-score
name: Customer Satisfaction Score
type: Metric
description: Customer Satisfaction Score (CSAT) captures the engagement or satisfaction of the people
  involved for organizations tracking customer. It is defined as Satisfied Responses / Total Survey Responses;
  the result is stated in percent (%). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: CSAT
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
purpose_classification:
- engagement
scope_classification:
- organizational_unit
directionality: higher_is_better
management_significance:
