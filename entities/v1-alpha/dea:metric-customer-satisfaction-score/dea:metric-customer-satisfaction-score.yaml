source_credit: Public domain - no attribution required
calculation_definition: Satisfied Responses / Total Survey Responses
formula_definition:
  formula_id: dea:formula-customer-satisfaction-score
  expression: CSAT = Satisfied Responses / Total Survey Responses
  inputs:
  - name: Satisfied Responses
  - name: Total Survey Responses
