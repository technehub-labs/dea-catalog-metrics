id: dea:metric-treatment-room-turnover-time
name: Treatment Room Turnover Time
type: Metric
description: 'Treatment Room Turnover Time (TRTT) captures how efficiently resources are converted into
  outputs for organizations tracking beauty & personal care services. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Minutes between Appointments
  in Room - reported in minutes. It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Personal Services sector.'
