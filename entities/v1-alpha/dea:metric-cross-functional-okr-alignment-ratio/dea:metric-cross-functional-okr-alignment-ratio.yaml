id: dea:metric-cross-functional-okr-alignment-ratio
name: Cross-Functional OKR Alignment Ratio
type: Metric
description: A Enterprise OKR & Performance Management indicator, Cross-Functional OKR Alignment Ratio
  (XFOAR) quantifies capability maturity or development. It is defined as Shared OKRs across Functions
  / Cross-Cutting Initiatives; the result is stated in percent (%). Its trend is watched by senior leadership
  as an early signal of structural performance shifts. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.
abbreviation: XFOAR
unit: percent
