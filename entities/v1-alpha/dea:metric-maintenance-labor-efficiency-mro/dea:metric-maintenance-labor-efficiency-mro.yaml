id: dea:metric-maintenance-labor-efficiency-mro
name: Maintenance Labor Efficiency (MRO)
type: Metric
description: Within Aviation Maintenance Repair & Overhaul, Maintenance Labor Efficiency (MRO) (MLE) is
  used to gauge how efficiently resources are converted into outputs. Its calculation is Standard Labor
  Hours / Actual Labor Hours, measured in ratio (x:1 or x). Its value drives prioritization and resource
  reallocation among competing initiatives. Higher values are better; gains are read as improvement and
  losses as deterioration. It originates from and is most used in Airlines & aviation practice.
