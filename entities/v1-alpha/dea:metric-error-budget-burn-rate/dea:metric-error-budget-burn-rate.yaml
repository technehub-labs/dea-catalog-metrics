id: dea:metric-error-budget-burn-rate
name: Error Budget Burn Rate
type: Metric
description: Within SRE & Observability Standard Measures, Error Budget Burn Rate (EBBR) is used to gauge
  exposure to adverse outcomes. It is computed as Error Consumption Rate relative to Budget Allocation,
  expressed in ratio (x:1 or x). Front-line and delivery teams watch it in real time, as small deviations
  demand immediate correction. Lower values are better; each reduction is an improvement. Its use is concentrated
  in Software.
abbreviation: EBBR
