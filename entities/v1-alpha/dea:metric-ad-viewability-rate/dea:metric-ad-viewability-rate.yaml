id: dea:metric-ad-viewability-rate
name: Ad Viewability Rate
type: Metric
description: 'Ad Viewability Rate (AVR-MK) captures the quality of outputs and outcomes for organizations
  tracking marketing & advertising standard measures (deep dive). It is a working-level control: thresholds
  trigger immediate operational response. It is defined as Viewable Impressions / Measurable Impressions;
  the result is stated in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.'
