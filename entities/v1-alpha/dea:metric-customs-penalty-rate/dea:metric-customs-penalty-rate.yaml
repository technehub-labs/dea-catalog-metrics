id: dea:metric-customs-penalty-rate
name: Customs Penalty Rate
type: Metric
description: A International Trade & Customs indicator, Customs Penalty Rate (CPR-C) quantifies exposure
  to adverse outcomes. Its calculation is Penalty Incidents / Entries Filed, measured in events per thousand
  or million (scaled). Its value drives prioritization and resource reallocation among competing initiatives.
  Lower values are better; each reduction is an improvement. It originates from and is most used in Logistics
  & Trade practice.
