id: dea:metric-days-on-market
name: Days on Market
type: Metric
description: Days on Market (DOM) captures how efficiently resources are converted into outputs for organizations
  tracking real estate brokerage. It is defined as Average Days from Listing to Contract; the result is
  stated in days. In Real estate, it is a recognized element of the standard performance toolkit. Its
  trend is watched by senior leadership as an early signal of structural performance shifts. Reduction
  is the goal, and sustained decreases indicate successful intervention.
