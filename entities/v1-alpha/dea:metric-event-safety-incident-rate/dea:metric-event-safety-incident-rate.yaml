id: dea:metric-event-safety-incident-rate
name: Event Safety Incident Rate
type: Metric
description: 'Within Sports & Events, Event Safety Incident Rate (ESIR) is used to gauge exposure to adverse
  outcomes. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. It is computed as Safety Incidents / Attendees x 1,000, expressed in events per thousand
  or million (scaled). It should be driven down, since lower readings signal healthier performance. Its
  use is concentrated in Sports & events.'
