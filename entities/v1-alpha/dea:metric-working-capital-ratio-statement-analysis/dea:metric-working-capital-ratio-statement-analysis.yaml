id: dea:metric-working-capital-ratio-statement-analysis
name: Working Capital Ratio (Statement Analysis)
type: Metric
description: A Financial Statement Analysis Ratios (Deep Dive) indicator, Working Capital Ratio (Statement
  Analysis) (WCRDD) quantifies exposure to adverse outcomes. It is defined as Net Working Capital / Total
  Assets; the result is stated in percent (%). Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: WCRDD
unit: percent
