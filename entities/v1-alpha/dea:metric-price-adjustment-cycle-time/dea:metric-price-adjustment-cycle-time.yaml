id: dea:metric-price-adjustment-cycle-time
name: Price Adjustment Cycle Time
type: Metric
description: 'A Pricing & Revenue Management indicator, Price Adjustment Cycle Time (PACT) quantifies
  how efficiently resources are converted into outputs. The formula is Days from Price Decision to Effective
  in Market - reported in days. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
