id: dea:metric-clinical-trial-cost-per-patient
name: Clinical Trial Cost per Patient
type: Metric
description: Within Pharma R&D & Clinical Trials, Clinical Trial Cost per Patient (CTCP) is used to gauge
  how efficiently resources are converted into outputs. It is computed as Trial Costs / Patients Enrolled,
  expressed in currency value. Its use is concentrated in Pharmaceuticals. It is reviewed at cadence by
  planning owners to correct course before issues become strategic. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: CTCP
unit: currency
version: 1.1.0
