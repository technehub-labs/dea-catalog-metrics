id: dea:metric-cash-management-forecast-accuracy-branch
name: Cash Management Forecast Accuracy (Branch)
type: Metric
description: Within Retail Banking Branch Network (Deep Dive), Cash Management Forecast Accuracy (Branch)
  (CMFA) is used to gauge the quality of outputs and outcomes. Its calculation is 1 - Absolute Forecast
  Error / Actual Cash Demand, measured in percent (%). It provides the day-to-day signal that a process
  is running as designed. Higher values are better; gains are read as improvement and losses as deterioration.
  It originates from and is most used in Banking practice.
abbreviation: CMFA
unit: percent
