id: dea:metric-channel-program-roi
name: Channel Program ROI
type: Metric
description: Channel Program ROI (CPROI) addresses the economic value created or preserved and is a fixture
  of channel & distribution management reporting. The formula is Channel Contribution Margin / Program
  Cost - reported in ratio (x:1 or x). It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and losses
  as deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CPROI
