id: dea:metric-channel-training-coverage
name: Channel Training Coverage
type: Metric
description: Within Channel & Distribution Management, Channel Training Coverage (CTC-CD) is used to gauge
  capability maturity or development. Its value drives prioritization and resource reallocation among
  competing initiatives. Its calculation is Partner Staff Completing Required Training / Partner Staff,
  measured in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: CTC-CD
unit: percent
