id: dea:metric-code-review-coverage
name: Code Review Coverage
type: Metric
description: Within Software Development - Coding & Engineering Practices, Code Review Coverage (CRC-SD)
  is used to gauge the quality of outputs and outcomes. It provides the day-to-day signal that a process
  is running as designed. Its calculation is Changes Reviewed before Merge / Changes Merged, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: CRC-SD
unit: percent
version: 1.1.0
