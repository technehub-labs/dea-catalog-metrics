id: dea:metric-case-processing-time
name: Case Processing Time
type: Metric
description: Case Processing Time (CPT-G) addresses how efficiently resources are converted into outputs
  and is a fixture of public sector & government reporting. It is reviewed at cadence by planning owners
  to correct course before issues become strategic. It is computed as Days from Case Receipt to Case Closure,
  expressed in days. It should be driven down, since lower readings signal healthier performance. Its
  use is concentrated in Public sector.
abbreviation: CPT-G
unit: day
