id: dea:metric-clinical-trial-site-overhead-ratio
name: Clinical Trial Site Overhead Ratio
type: Metric
description: A Pharma R&D & Clinical Trials indicator, Clinical Trial Site Overhead Ratio (CTSO) quantifies
  how efficiently resources are converted into outputs. Its calculation is Site Overhead Costs / Direct
  Trial Costs, measured in percent (%). It originates from and is most used in Pharmaceuticals practice.
  Its value drives prioritization and resource reallocation among competing initiatives. Reduction is
  the goal, and sustained decreases indicate successful intervention.
abbreviation: CTSO
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- product_or_service
purpose_classification:
- efficiency
scope_classification:
- capability
directionality: lower_is_better
