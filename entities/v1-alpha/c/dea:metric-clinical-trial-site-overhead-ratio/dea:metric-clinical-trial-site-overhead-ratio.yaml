source_credit: Public domain - no attribution required
calculation_definition: Site Overhead Costs / Direct Trial Costs
formula_definition:
  formula_id: dea:formula-clinical-trial-site-overhead-ratio
  expression: CTSO = Site Overhead Costs / Direct Trial Costs
  inputs:
  - name: Site Overhead Costs
  - name: Direct Trial Costs
