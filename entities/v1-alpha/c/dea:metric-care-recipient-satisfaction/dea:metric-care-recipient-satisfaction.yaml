id: dea:metric-care-recipient-satisfaction
name: Care Recipient Satisfaction
type: Metric
description: 'Care Recipient Satisfaction (CRS) measures the engagement or satisfaction of the people
  involved in the Elder & Social Care domain. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. It is computed as Satisfied Recipient or Family Survey Responses
  / Responses, expressed in percent (%). Improvement means raising this figure toward best-in-class levels.
  Its use is concentrated in Social care.'
abbreviation: CRS
unit: percent
