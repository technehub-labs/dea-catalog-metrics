id: dea:metric-cost-of-quality-ratio
name: Cost of Quality Ratio
type: Metric
description: A Product Costing & Margin Management indicator, Cost of Quality Ratio (COQR) quantifies
  the economic value created or preserved. It is defined as Cost of Poor Quality / Total Production Cost;
  the result is stated in percent (%). It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Reduction is the goal, and
  sustained decreases indicate successful intervention.
abbreviation: COQR
unit: percent
