id: dea:metric-crisis-decision-log-completeness
name: Crisis Decision Log Completeness
type: Metric
description: Crisis Decision Log Completeness (CDLC) captures conformance to standards, plans, or obligations
  for organizations tracking crisis management & emergency response. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. The formula is Crisis Decisions with
  Documented Rationale / Decisions - reported in percent (%). Improvement means raising this figure toward
  best-in-class levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CDLC
unit: percent
