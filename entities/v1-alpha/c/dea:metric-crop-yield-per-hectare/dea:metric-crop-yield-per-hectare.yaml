id: dea:metric-crop-yield-per-hectare
name: Crop Yield per Hectare
type: Metric
description: Within Agriculture & Food Processing, Crop Yield per Hectare (CYH) is used to gauge how efficiently
  resources are converted into outputs. It is defined as Harvested Crop Mass / Cultivated Hectares; the
  result is stated in ratio (x:1 or x). In Agriculture & food, it is a recognized element of the standard
  performance toolkit. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CYH
