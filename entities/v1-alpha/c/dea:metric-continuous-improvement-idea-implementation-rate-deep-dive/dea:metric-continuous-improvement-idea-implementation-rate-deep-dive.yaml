id: dea:metric-continuous-improvement-idea-implementation-rate-deep-dive
name: Continuous Improvement Idea Implementation Rate (Deep Dive)
type: Metric
description: A Balanced Scorecard - Internal Process Perspective indicator, Continuous Improvement Idea
  Implementation Rate (Deep Dive) (CIIR-D) quantifies capability maturity or development. Its calculation
  is Implemented Improvement Ideas / Submitted, measured in percent (%). It is applied across virtually
  every sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CIIR-D
unit: percent
version: 1.1.0
