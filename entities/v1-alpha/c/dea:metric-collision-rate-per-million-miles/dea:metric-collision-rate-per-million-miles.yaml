id: dea:metric-collision-rate-per-million-miles
name: Collision Rate per Million Miles
type: Metric
description: Collision Rate per Million Miles (CRPM) addresses exposure to adverse outcomes and is a fixture
  of public transit reporting. It informs long-horizon decisions and is typically tracked on enterprise
  dashboards rather than team boards. Its calculation is Collisions / Miles Operated x 1,000,000, measured
  in events per thousand or million (scaled). It should be driven down, since lower readings signal healthier
  performance. It originates from and is most used in Public transit practice.
abbreviation: CRPM
unit: event
