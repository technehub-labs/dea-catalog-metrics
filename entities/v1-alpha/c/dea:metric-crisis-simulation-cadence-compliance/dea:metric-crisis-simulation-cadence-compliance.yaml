id: dea:metric-crisis-simulation-cadence-compliance
name: Crisis Simulation Cadence Compliance
type: Metric
description: 'Crisis Simulation Cadence Compliance (CSCC) measures conformance to standards, plans, or
  obligations in the Crisis Management & Emergency Response domain. It is computed as Required Simulations
  Held per Year / Required, expressed in percent (%). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: CSCC
unit: percent
