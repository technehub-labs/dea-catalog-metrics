id: dea:metric-cost-per-square-meter
name: Cost per Square Meter
type: Metric
description: A Facilities & Real Estate indicator, Cost per Square Meter (CPSM) quantifies how efficiently
  resources are converted into outputs. It is defined as Total Facilities Cost / Total Floor Area; the
  result is stated in currency per unit. It is applied across virtually every sector. Its trend is watched
  by senior leadership as an early signal of structural performance shifts. Reduction is the goal, and
  sustained decreases indicate successful intervention.
abbreviation: CPSM
unit: currency
