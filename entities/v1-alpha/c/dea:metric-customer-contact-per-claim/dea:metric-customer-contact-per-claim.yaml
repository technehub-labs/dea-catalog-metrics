description: 'A Claims Operations (Insurance) indicator, Customer Contact per Claim (CPCl) quantifies
  the quality of outputs and outcomes. The formula is Customer Contacts per Claim Lifetime - reported
  in ratio (x:1 or x). It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Lower values are better; each reduction is an improvement. It is a standard measure in the Insurance
  sector.'
