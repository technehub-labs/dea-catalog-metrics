id: dea:metric-corrective-action-closure-rate
name: Corrective Action Closure Rate
type: Metric
description: Corrective Action Closure Rate (CACR) measures conformance to standards, plans, or obligations
  in the Health & Safety domain. Its value drives prioritization and resource reallocation among competing
  initiatives. Its calculation is Safety Corrective Actions Closed on Time / Actions Opened, measured
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: CACR
unit: percent
