id: dea:metric-contract-renewal-miss-rate-legal
name: Contract Renewal Miss Rate (Legal)
type: Metric
description: A Legal Operations indicator, Contract Renewal Miss Rate (Legal) (CRML) quantifies exposure
  to adverse outcomes. It is reviewed at cadence by planning owners to correct course before issues become
  strategic. It is computed as Renewals Lapsed without Action / Renewals Due, expressed in percent (%).
  It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
abbreviation: CRML
unit: percent
