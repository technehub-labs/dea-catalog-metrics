id: dea:metric-centralization-versus-autonomy-balance-index
name: Centralization versus Autonomy Balance Index
type: Metric
description: Within Operating Model Monitoring & Design Effectiveness, Centralization versus Autonomy
  Balance Index (CVABI) is used to gauge capability maturity or development. The formula is Balance Score
  of Central and Local Mandates - reported in index (0-100 or normalized). It is applied across virtually
  every sector. It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Values outside the intended band, on either side, warrant investigation.
