id: dea:metric-crisis-communication-approval-cycle-time
name: Crisis Communication Approval Cycle Time
type: Metric
description: Crisis Communication Approval Cycle Time (CCACT) measures how efficiently resources are converted
  into outputs in the Crisis Management & Emergency Response domain. Its calculation is Minutes to Draft,
  Approve and Issue Public Statement, measured in minutes. It is applied across virtually every sector.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: CCACT
unit: minute
