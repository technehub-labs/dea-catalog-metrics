id: dea:metric-customer-satisfaction-field-service-deep-dive
name: Customer Satisfaction - Field Service (Deep Dive)
type: Metric
description: A Field Maintenance & Technical Field Service (Deep Dive) indicator, Customer Satisfaction
  - Field Service (Deep Dive) (CSFS-D) quantifies the engagement or satisfaction of the people involved.
  The formula is Average Field Visit CSAT - reported in score (points). It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. Higher values are better; gains
  are read as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
