id: dea:metric-commission-revenue-ratio
name: Commission Revenue Ratio
type: Metric
description: 'Within Insurance Distribution & Brokerage, Commission Revenue Ratio (CRR-I) is used to gauge
  the economic value created or preserved. It is computed as Commission Revenue / Gross Written Premium,
  expressed in percent (%). Its use is concentrated in Insurance distribution. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. Values outside the intended
  band, on either side, warrant investigation.'
