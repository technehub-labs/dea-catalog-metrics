id: dea:metric-confusion-matrix-balance-index
name: Confusion Matrix Balance Index
type: Metric
description: Confusion Matrix Balance Index (CMBI) addresses the quality of outputs and outcomes and is
  a fixture of statistical model performance diagnostics reporting. It provides the day-to-day signal
  that a process is running as designed. Its calculation is Symmetry of Error Types at Operating Threshold,
  measured in index (0-100 or normalized). The objective is neither maximization nor minimization but
  staying within an agreed operating band. It originates from and is most used in Software practice.
abbreviation: CMBI
