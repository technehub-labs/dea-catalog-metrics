id: dea:metric-contract-data-extraction-accuracy
name: Contract Data Extraction Accuracy
type: Metric
description: A Contract Lifecycle Management indicator, Contract Data Extraction Accuracy (CDEA) quantifies
  the quality of outputs and outcomes. It is computed as Key Fields Extracted Correctly / Fields Sampled,
  expressed in percent (%). It is applied across virtually every sector. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: CDEA
unit: percent
version: 1.1.0
