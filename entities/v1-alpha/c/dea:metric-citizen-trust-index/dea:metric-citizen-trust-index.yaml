id: dea:metric-citizen-trust-index
name: Citizen Trust Index
type: Metric
description: 'Citizen Trust Index (CTI-PS) addresses the engagement or satisfaction of the people involved
  and is a fixture of public sector & citizen service standard measures (deep dive) reporting. It is computed
  as Survey-Based Composite of Institutional Trust, expressed in index (0-100 or normalized). It is a
  headline indicator: movement in it prompts leadership questions about strategy and resourcing. Higher
  values are better; gains are read as improvement and losses as deterioration. Its use is concentrated
  in Public sector.'
abbreviation: CTI-PS
unit: index
