id: dea:metric-claim-file-audit-pass-rate
name: Claim File Audit Pass Rate
type: Metric
description: Claim File Audit Pass Rate (CFAP) addresses conformance to standards, plans, or obligations
  and is a fixture of insurance claims deep dive reporting. It is computed as Files Meeting Documentation
  Standards / Files Audited, expressed in percent (%). It is reviewed at cadence by planning owners to
  correct course before issues become strategic. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is concentrated in Insurance.
abbreviation: CFAP
unit: percent
version: 1.1.0
