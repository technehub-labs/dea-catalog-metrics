id: dea:metric-crisis-response-time
name: Crisis Response Time
type: Metric
description: Crisis Response Time (CRT-C) captures exposure to adverse outcomes for organizations tracking
  corporate communications & pr. It carries weight in boardroom and executive reviews, where it anchors
  cross-organization trade-offs. The formula is Hours from Crisis Trigger to Public Response - reported
  in hours. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: CRT-C
unit: hour
version: 1.1.0
