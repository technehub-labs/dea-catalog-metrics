id: dea:metric-cost-variance
name: Cost Variance
type: Metric
description: Cost Variance (CV) measures conformance to standards, plans, or obligations in the Project
  Management domain. It is defined as Earned Value - Actual Cost; the result is stated in currency value.
  It bridges daily operations and executive reporting, giving managers a lever to pull within a quarter.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CV
unit: currency
