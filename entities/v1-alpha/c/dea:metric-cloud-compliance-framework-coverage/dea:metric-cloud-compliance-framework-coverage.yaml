id: dea:metric-cloud-compliance-framework-coverage
name: Cloud Compliance Framework Coverage
type: Metric
description: Cloud Compliance Framework Coverage (CCFC) measures conformance to standards, plans, or obligations
  in the Cloud Security Posture Management domain. Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is defined as Framework Controls Monitored / Applicable
  Controls; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: CCFC
unit: percent
version: 1.1.0
