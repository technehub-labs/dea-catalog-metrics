id: dea:metric-customer-satisfaction-travel-experience
name: Customer Satisfaction (Travel Experience)
type: Metric
description: Customer Satisfaction (Travel Experience) (CST) measures the engagement or satisfaction of
  the people involved in the Travel & Tourism domain. The formula is Satisfied Traveler Survey Responses
  / Responses - reported in percent (%). It carries weight in boardroom and executive reviews, where it
  anchors cross-organization trade-offs. Higher values are better; gains are read as improvement and losses
  as deterioration. It is a standard measure in the Travel & tourism sector.
abbreviation: CST
unit: percent
