id: dea:metric-cost-per-originated-loan
name: Cost per Originated Loan
type: Metric
description: 'Cost per Originated Loan (CPOL) captures how efficiently resources are converted into outputs
  for organizations tracking banking retail lending (deep dive). It is computed as Origination Costs /
  Loans Originated, expressed in currency value. It is a headline indicator: movement in it prompts leadership
  questions about strategy and resourcing. Lower values are better; each reduction is an improvement.
  Its use is concentrated in Banking.'
abbreviation: CPOL
unit: currency
