id: dea:metric-complaint-rate
name: Complaint Rate
type: Metric
description: A Customer indicator, Complaint Rate (CoR) quantifies the quality of outputs and outcomes.
  Its calculation is Complaints / Total Customer Interactions, measured in ratio (x:1 or x). It provides
  the day-to-day signal that a process is running as designed. Lower values are better; each reduction
  is an improvement. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CoR
unit: ratio
version: 1.1.0
lifecycle_status: candidate
