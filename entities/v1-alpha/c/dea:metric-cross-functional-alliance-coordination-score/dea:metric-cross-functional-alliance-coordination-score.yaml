id: dea:metric-cross-functional-alliance-coordination-score
name: Cross-Functional Alliance Coordination Score
type: Metric
description: A Alliances & Partnerships Management indicator, Cross-Functional Alliance Coordination Score
  (CAACS) quantifies the engagement or satisfaction of the people involved. It is computed as Internal
  Team Alignment Survey per Alliance, expressed in score (points). It is applied across virtually every
  sector. It is reviewed at cadence by planning owners to correct course before issues become strategic.
  It should be maximized within the limits of cost and quality trade-offs.
