id: dea:metric-cath-lab-procedure-room-turnover-time
name: Cath Lab / Procedure Room Turnover Time
type: Metric
description: A Medical Practice & Clinical Operations indicator, Cath Lab / Procedure Room Turnover Time
  (CLRT) quantifies how efficiently resources are converted into outputs. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. It is computed as Minutes between
  Procedures, expressed in minutes. It should be driven down, since lower readings signal healthier performance.
  Its use is concentrated in Healthcare.
abbreviation: CLRT
unit: minute
