id: dea:metric-cost-per-student
name: Cost per Student
type: Metric
description: A Education indicator, Cost per Student (CPS) quantifies how efficiently resources are converted
  into outputs. Its calculation is Total Institution Cost / Enrolled Students, measured in currency per
  unit. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. Lower values are better; each reduction is an improvement. It originates from and is most
  used in Education practice.
abbreviation: CPS
unit: currency
version: 1.1.0
