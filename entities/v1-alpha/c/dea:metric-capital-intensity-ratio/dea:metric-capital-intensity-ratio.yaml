id: dea:metric-capital-intensity-ratio
name: Capital Intensity Ratio
type: Metric
description: 'Capital Intensity Ratio (CIR-VCF) measures how efficiently resources are converted into
  outputs in the Valuation & Corporate Finance Standard Measures domain. It is computed as Capital Expenditure
  / Revenue, expressed in percent (%). It is a headline indicator: movement in it prompts leadership questions
  about strategy and resourcing. Lower values are better; each reduction is an improvement. Its use is
  not sector-specific; it appears in cross-industry performance frameworks.'
abbreviation: CIR-VCF
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- financial
purpose_classification:
- efficiency
scope_classification:
- organizational_unit
directionality: lower_is_better
management_significance:
