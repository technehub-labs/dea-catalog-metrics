id: dea:metric-cask-cost-per-available-seat-kilometre-deep-dive
name: CASK - Cost per Available Seat Kilometre (Deep Dive)
type: Metric
description: CASK - Cost per Available Seat Kilometre (Deep Dive) (CASK-D) addresses how efficiently resources
  are converted into outputs and is a fixture of airline operations (deep dive) reporting. Its trend is
  watched by senior leadership as an early signal of structural performance shifts. It is defined as Operating
  Cost / ASK; the result is stated in currency per unit. It should be driven down, since lower readings
  signal healthier performance. In Airlines, it is a recognized element of the standard performance toolkit.
abbreviation: CASK-D
unit: currency
