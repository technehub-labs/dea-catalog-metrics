id: dea:metric-cloud-migration-readiness
name: Cloud Migration Readiness
type: Metric
description: A Enterprise Architecture indicator, Cloud Migration Readiness (CMR) quantifies capability
  maturity or development. Its calculation is Applications Assessed Migration-Ready / Applications in
  Scope, measured in percent (%). Its value drives prioritization and resource reallocation among competing
  initiatives. Higher values are better; gains are read as improvement and losses as deterioration. Its
  use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CMR
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- information_architecture
purpose_classification:
- capability
scope_classification:
- capability
directionality: higher_is_better
