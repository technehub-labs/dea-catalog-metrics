id: dea:metric-cost-to-serve-per-customer-deep-dive
name: Cost to Serve per Customer (Deep Dive)
type: Metric
description: Within Unit Economics & Growth (Deep Dive), Cost to Serve per Customer (Deep Dive) (CTSCD)
  is used to gauge how efficiently resources are converted into outputs. Its calculation is Service and
  Support Cost / Customers, measured in currency per unit. It originates from and is most used in Software
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Reduction is the goal, and sustained decreases indicate successful intervention.
abbreviation: CTSCD
unit: currency
