id: dea:metric-customer-effort-in-contact-resolution
name: Customer Effort in Contact Resolution
type: Metric
description: Customer Effort in Contact Resolution (CECR) addresses the engagement or satisfaction of
  the people involved and is a fixture of contact center reporting. Its calculation is Average Contact
  Effort Rating on Survey, measured in score (points). Its value drives prioritization and resource reallocation
  among competing initiatives. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: CECR
unit: score
