id: dea:metric-client-concentration-fee-revenue
name: Client Concentration (Fee Revenue)
type: Metric
description: A Investment Banking & Capital Markets indicator, Client Concentration (Fee Revenue) (CCFR)
  quantifies exposure to adverse outcomes. The formula is Largest Client Fees / Total Fees - reported
  in percent (%). It carries weight in boardroom and executive reviews, where it anchors cross-organization
  trade-offs. Lower values are better; each reduction is an improvement. It is a standard measure in the
  Investment banking sector.
abbreviation: CCFR
unit: percent
