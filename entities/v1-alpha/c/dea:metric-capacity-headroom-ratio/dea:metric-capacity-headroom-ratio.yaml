id: dea:metric-capacity-headroom-ratio
name: Capacity Headroom Ratio
type: Metric
description: Capacity Headroom Ratio (CHR-NW) addresses the utilization or availability of capacity and
  is a fixture of network performance & capacity reporting. It is defined as Available Capacity / Peak
  Demand; the result is stated in ratio (x:1 or x). Its trend is watched by senior leadership as an early
  signal of structural performance shifts. It is managed toward a defined target band rather than an extreme
  - both overshoot and undershoot can signal problems. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: CHR-NW
