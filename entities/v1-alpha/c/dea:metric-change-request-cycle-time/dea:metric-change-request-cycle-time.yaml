id: dea:metric-change-request-cycle-time
name: Change Request Cycle Time
type: Metric
description: 'Within Project Management, Change Request Cycle Time (CRCT) is used to gauge how efficiently
  resources are converted into outputs. It is defined as Days from Change Request to Decision; the result
  is stated in days. It is a working-level control: thresholds trigger immediate operational response.
  Lower values are better; each reduction is an improvement. Its use is not sector-specific; it appears
  in cross-industry performance frameworks.'
