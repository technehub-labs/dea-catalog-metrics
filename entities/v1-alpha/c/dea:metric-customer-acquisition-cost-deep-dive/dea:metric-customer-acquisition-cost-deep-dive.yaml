id: dea:metric-customer-acquisition-cost-deep-dive
name: Customer Acquisition Cost (Deep Dive)
type: Metric
description: Customer Acquisition Cost (Deep Dive) (CACDD) measures how efficiently resources are converted
  into outputs in the Unit Economics & Growth (Deep Dive) domain. The formula is Total Acquisition Spend
  / New Customers - reported in currency per unit. It is a standard measure in the Software sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Reduction
  is the goal, and sustained decreases indicate successful intervention.
abbreviation: CACDD
unit: currency
