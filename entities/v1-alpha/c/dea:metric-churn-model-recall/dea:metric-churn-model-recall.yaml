id: dea:metric-churn-model-recall
name: Churn Model Recall
type: Metric
description: Within Customer Analytics & Insights, Churn Model Recall (CMR-A) is used to gauge the quality
  of outputs and outcomes. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as True Churners Identified / Actual Churners; the result is stated
  in percent (%). Improvement means raising this figure toward best-in-class levels. Practitioners in
  nearly any industry can adopt it directly.
abbreviation: CMR-A
unit: percent
