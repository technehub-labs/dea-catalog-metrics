id: dea:metric-cumulative-layout-shift
name: Cumulative Layout Shift
type: Metric
description: Cumulative Layout Shift (CLS) captures the quality of outputs and outcomes for organizations
  tracking digital product & web operations. It provides the day-to-day signal that a process is running
  as designed. Its calculation is Sum of Layout Instability Scores during Page Load, measured in score
  (points). It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
