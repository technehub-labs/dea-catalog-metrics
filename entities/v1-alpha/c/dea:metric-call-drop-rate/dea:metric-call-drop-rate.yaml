id: dea:metric-call-drop-rate
name: Call Drop Rate
type: Metric
description: 'Call Drop Rate (CDR-T) measures the quality of outputs and outcomes in the Telecommunications
  domain. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  The formula is Dropped Calls / Total Calls - reported in percent (%). It should be driven down, since
  lower readings signal healthier performance. It is a standard measure in the Telecommunications sector.'
abbreviation: CDR-T
unit: percent
version: 1.1.0
lifecycle_status: candidate
