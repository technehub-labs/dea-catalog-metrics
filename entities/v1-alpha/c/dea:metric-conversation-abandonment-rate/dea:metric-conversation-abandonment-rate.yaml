id: dea:metric-conversation-abandonment-rate
name: Conversation Abandonment Rate
type: Metric
description: Within Conversational AI & Chatbots, Conversation Abandonment Rate (CAR-CB) is used to gauge
  the quality of outputs and outcomes. It is computed as Conversations Abandoned before Resolution / Conversations,
  expressed in percent (%). It is applied across virtually every sector. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: CAR-CB
unit: percent
