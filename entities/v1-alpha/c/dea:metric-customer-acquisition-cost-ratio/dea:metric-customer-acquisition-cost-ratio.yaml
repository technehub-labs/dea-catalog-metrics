id: dea:metric-customer-acquisition-cost-ratio
name: Customer Acquisition Cost Ratio
type: Metric
description: Customer Acquisition Cost Ratio (CACR) captures the economic value created or preserved for
  organizations tracking marketing. Its calculation is CAC / Average Customer Lifetime Value, measured
  in ratio (x:1 or x). It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: CACR
unit: ratio
version: 1.1.0
