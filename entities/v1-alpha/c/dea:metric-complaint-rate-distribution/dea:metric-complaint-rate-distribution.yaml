id: dea:metric-complaint-rate-distribution
name: Complaint Rate (Distribution)
type: Metric
description: Complaint Rate (Distribution) (CORD) measures the quality of outputs and outcomes in the
  Insurance Distribution & Brokerage domain. It is defined as Complaints / 1,000 Policies Serviced; the
  result is stated in events per thousand or million (scaled). It bridges daily operations and executive
  reporting, giving managers a lever to pull within a quarter. Lower values are better; each reduction
  is an improvement. In Insurance distribution, it is a recognized element of the standard performance
  toolkit.
abbreviation: CORD
