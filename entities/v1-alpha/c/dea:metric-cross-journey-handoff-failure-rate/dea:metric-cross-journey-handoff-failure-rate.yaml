id: dea:metric-cross-journey-handoff-failure-rate
name: Cross-Journey Handoff Failure Rate
type: Metric
description: 'Cross-Journey Handoff Failure Rate (JHFR) measures the quality of outputs and outcomes in
  the Customer Journey & Experience domain. The formula is Handoffs Requiring Customer Re-Explanation
  / Handoffs - reported in percent (%). It is monitored close to the work: teams act on it within a shift,
  sprint, or daily review. Lower values are better; each reduction is an improvement. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.'
abbreviation: JHFR
unit: percent
