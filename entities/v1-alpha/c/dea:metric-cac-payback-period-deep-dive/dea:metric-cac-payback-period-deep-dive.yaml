id: dea:metric-cac-payback-period-deep-dive
name: CAC Payback Period (Deep Dive)
type: Metric
description: 'CAC Payback Period (Deep Dive) (CACPB-D) addresses how efficiently resources are converted
  into outputs and is a fixture of startup & venture-backed business reporting. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as CAC / Monthly
  Gross Margin per Customer, expressed in months. It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.'
abbreviation: CACPB-D
unit: month
version: 1.1.0
lifecycle_status: candidate
