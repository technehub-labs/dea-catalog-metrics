id: dea:metric-contract-renewal-lead-time
name: Contract Renewal Lead Time
type: Metric
description: 'Contract Renewal Lead Time (CRLT) captures how efficiently resources are converted into
  outputs for organizations tracking outsourcing & vendor management. The formula is Days before Expiry
  that Renewal is Completed - reported in days. It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
