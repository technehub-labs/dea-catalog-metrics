id: dea:metric-coupling-index
name: Coupling Index
type: Metric
description: Coupling Index (COUI) addresses the quality of outputs and outcomes and is a fixture of software
  architecture & technical design reporting. The formula is Cross-Module Dependencies per Module - reported
  in ratio (x:1 or x). It is applied across virtually every sector. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: COUI
unit: ratio
