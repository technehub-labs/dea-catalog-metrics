id: dea:metric-code-review-coverage-deep-dive
name: Code Review Coverage (Deep Dive)
type: Metric
description: Code Review Coverage (Deep Dive) (CRC-PR) measures the quality of outputs and outcomes in
  the Code Review & Peer Quality domain. It is computed as Changes Reviewed before Merge / Total Changes,
  expressed in percent (%). Front-line and delivery teams watch it in real time, as small deviations demand
  immediate correction. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is concentrated in Software.
abbreviation: CRC-PR
unit: percent
version: 1.1.0
