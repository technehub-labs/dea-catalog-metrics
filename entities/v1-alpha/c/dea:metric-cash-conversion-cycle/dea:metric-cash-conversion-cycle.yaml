id: dea:metric-cash-conversion-cycle
name: Cash Conversion Cycle
type: Metric
description: Cash Conversion Cycle (CCC) captures how efficiently resources are converted into outputs
  for organizations tracking finance & accounting. Its calculation is DSO + DIO - DPO, measured in days.
  Its value drives prioritization and resource reallocation among competing initiatives. Lower values
  are better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
abbreviation: CCC
unit: day
