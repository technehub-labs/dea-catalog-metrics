id: dea:metric-cost-per-invoice-processed
name: Cost per Invoice Processed
type: Metric
description: Within Finance & Accounting, Cost per Invoice Processed (CPIP) is used to gauge how efficiently
  resources are converted into outputs. It provides the day-to-day signal that a process is running as
  designed. Its calculation is Total Invoice Processing Cost / Invoices Processed, measured in currency
  per unit. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.
abbreviation: CPIP
unit: currency
version: 1.1.0
lifecycle_status: candidate
