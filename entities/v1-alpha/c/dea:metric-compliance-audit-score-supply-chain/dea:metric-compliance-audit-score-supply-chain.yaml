id: dea:metric-compliance-audit-score-supply-chain
name: Compliance Audit Score (Supply Chain)
type: Metric
description: Compliance Audit Score (Supply Chain) (CASC) captures conformance to standards, plans, or
  obligations for organizations tracking textile & apparel. Its calculation is Weighted Score of Social
  and Environmental Audits, measured in score (points). It originates from and is most used in Textile
  & apparel practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards
  rather than team boards. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CASC
