id: dea:metric-campaign-launch-on-time-rate-ads
name: Campaign Launch On-Time Rate (Ads)
type: Metric
description: 'Campaign Launch On-Time Rate (Ads) (CLOT) addresses conformance to standards, plans, or
  obligations and is a fixture of advertising & media buying reporting. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Campaigns Live on Scheduled
  Date / Campaigns - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. It is a standard measure in the Media & Entertainment sector.'
