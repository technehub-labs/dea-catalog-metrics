id: dea:metric-certification-attainment-rate-l-d
name: Certification Attainment Rate (L&D)
type: Metric
description: 'Certification Attainment Rate (L&D) (CART-LD) addresses capability maturity or development
  and is a fixture of learning & development effectiveness (deep dive) reporting. It is a headline indicator:
  movement in it prompts leadership questions about strategy and resourcing. It is computed as Employees
  Achieving Target Certifications / Planned, expressed in percent (%). Improvement means raising this
  figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: CART-LD
unit: percent
version: 1.1.0
lifecycle_status: candidate
