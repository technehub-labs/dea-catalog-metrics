id: dea:metric-continuity-plan-currency-score
name: Continuity Plan Currency Score
type: Metric
description: 'A Business Continuity & Disaster Recovery indicator, Continuity Plan Currency Score (CPCC)
  quantifies the quality of outputs and outcomes. It is computed as BCPs Updated within 12 Months and
  Version-Controlled / BCPs, expressed in percent (%). It is applied across virtually every sector. It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  It should be maximized within the limits of cost and quality trade-offs.'
abbreviation: CPCC
unit: percent
version: 1.1.0
