id: dea:metric-channel-partner-productivity
name: Channel Partner Productivity
type: Metric
description: A Channel & Distribution Management indicator, Channel Partner Productivity (CPP-CD) quantifies
  how efficiently resources are converted into outputs. The formula is Revenue per Active Partner - reported
  in currency per unit. It is applied across virtually every sector. It carries weight in boardroom and
  executive reviews, where it anchors cross-organization trade-offs. It should be maximized within the
  limits of cost and quality trade-offs.
