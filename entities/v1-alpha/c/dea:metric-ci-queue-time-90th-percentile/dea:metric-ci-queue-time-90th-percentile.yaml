id: dea:metric-ci-queue-time-90th-percentile
name: CI Queue Time - 90th Percentile
type: Metric
description: A Continuous Integration indicator, CI Queue Time - 90th Percentile (CIQT90) quantifies the
  utilization or availability of capacity. Its calculation is Minutes Waiting in Build Queue, measured
  in minutes. It provides the day-to-day signal that a process is running as designed. Lower values are
  better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
