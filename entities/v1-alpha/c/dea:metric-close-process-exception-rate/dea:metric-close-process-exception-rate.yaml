id: dea:metric-close-process-exception-rate
name: Close Process Exception Rate
type: Metric
description: Within Internal Controls & Financial Reporting Integrity, Close Process Exception Rate (CPER)
  is used to gauge the quality of outputs and outcomes. It is computed as Close Tasks Requiring Rework
  / Close Tasks, expressed in percent (%). It is applied across virtually every sector. Front-line and
  delivery teams watch it in real time, as small deviations demand immediate correction. Reduction is
  the goal, and sustained decreases indicate successful intervention.
