id: dea:metric-contract-on-time-delivery-defense
name: Contract On-Time Delivery (Defense)
type: Metric
description: Contract On-Time Delivery (Defense) (COTD) addresses conformance to standards, plans, or
  obligations and is a fixture of defense & aerospace reporting. It is defined as Deliveries on Contract
  Schedule / Deliveries Due; the result is stated in percent (%). In Defense & aerospace, it is a recognized
  element of the standard performance toolkit. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: COTD
unit: percent
