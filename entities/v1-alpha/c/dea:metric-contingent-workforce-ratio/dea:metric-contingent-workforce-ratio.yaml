id: dea:metric-contingent-workforce-ratio
name: Contingent Workforce Ratio
type: Metric
description: Within Workforce Planning & Analytics, Contingent Workforce Ratio (CWR) is used to gauge
  the utilization or availability of capacity. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Contingent Workers / Total Workforce; the result
  is stated in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. Practitioners in nearly any industry can adopt it directly.
abbreviation: CWR
unit: percent
