id: dea:metric-preventive-care-screening-compliance
name: Preventive Care Screening Compliance
type: Metric
description: A Medical Practice & Clinical Operations indicator, Preventive Care Screening Compliance
  (PCSC) quantifies the quality of outputs and outcomes. It is defined as Eligible Patients Screened per
  Guideline / Eligible; the result is stated in percent (%). In Healthcare, it is a recognized element
  of the standard performance toolkit. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
