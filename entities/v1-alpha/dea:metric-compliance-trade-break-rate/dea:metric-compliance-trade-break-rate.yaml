id: dea:metric-compliance-trade-break-rate
name: Compliance Trade Break Rate
type: Metric
description: Compliance Trade Break Rate (CTBR) captures conformance to standards, plans, or obligations
  for organizations tracking investment management. It is computed as Trade Breaks Detected / Trades Executed,
  expressed in percent (%). Its use is concentrated in Asset management. It is reviewed at cadence by
  planning owners to correct course before issues become strategic. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: CTBR
unit: percent
