id: dea:metric-course-completion-rate
name: Course Completion Rate
type: Metric
description: 'Within Education, Course Completion Rate (CCR-E) is used to gauge the quality of outputs
  and outcomes. It guides mid-horizon planning: portfolio, program, and function owners act on it between
  review cycles. The formula is Completed Course Enrollments / Enrollments - reported in percent (%).
  Improvement means raising this figure toward best-in-class levels. It is a standard measure in the Education
  sector.'
abbreviation: CCR-E
unit: percent
