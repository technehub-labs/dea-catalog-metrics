id: dea:metric-regretted-attrition-ratio
name: Regretted Attrition Ratio
type: Metric
description: Within Employee Engagement & Culture (Deep Dive), Regretted Attrition Ratio (RAR-EE) is used
  to gauge the retention of customers, users, or assets over time. It informs long-horizon decisions and
  is typically tracked on enterprise dashboards rather than team boards. Its calculation is Regretted
  Leavers / Total Leavers, measured in percent (%). It should be driven down, since lower readings signal
  healthier performance. Practitioners in nearly any industry can adopt it directly.
abbreviation: RAR-EE
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
