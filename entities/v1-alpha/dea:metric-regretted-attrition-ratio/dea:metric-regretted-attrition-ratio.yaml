source_credit: Public domain - no attribution required
calculation_definition: Regretted Leavers / Total Leavers
formula_definition:
  formula_id: dea:formula-regretted-attrition-ratio
  expression: RAR-EE = Regretted Leavers / Total Leavers
  inputs:
  - name: Regretted Leavers
  - name: Total Leavers
