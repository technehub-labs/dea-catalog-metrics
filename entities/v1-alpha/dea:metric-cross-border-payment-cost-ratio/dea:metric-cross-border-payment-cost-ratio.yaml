id: dea:metric-cross-border-payment-cost-ratio
name: Cross-Border Payment Cost Ratio
type: Metric
description: A Payments & Cards (Deep Dive) indicator, Cross-Border Payment Cost Ratio (CBPCR) quantifies
  how efficiently resources are converted into outputs. It informs long-horizon decisions and is typically
  tracked on enterprise dashboards rather than team boards. Its calculation is Total Cost of Cross-Border
  Payment / Value, measured in percent (%). It should be driven down, since lower readings signal healthier
  performance. It originates from and is most used in Payments practice.
abbreviation: CBPCR
unit: percent
