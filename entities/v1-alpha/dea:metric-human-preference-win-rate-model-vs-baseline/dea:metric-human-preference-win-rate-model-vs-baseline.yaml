id: dea:metric-human-preference-win-rate-model-vs-baseline
name: Human Preference Win Rate - Model vs Baseline
type: Metric
description: Within Generative AI & LLM Operations, Human Preference Win Rate - Model vs Baseline (HPWR)
  is used to gauge the quality of outputs and outcomes. It is defined as Blind Preferences for New Model
  / Total Evaluations; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. It should
  be maximized within the limits of cost and quality trade-offs.
