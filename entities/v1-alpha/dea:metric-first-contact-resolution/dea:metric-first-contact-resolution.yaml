id: dea:metric-first-contact-resolution
name: First Contact Resolution
type: Metric
description: 'First Contact Resolution (FCR) addresses the quality of outputs and outcomes and is a fixture
  of customer reporting. It is defined as Issues Resolved on First Contact / Total Issues; the result
  is stated in percent (%). It is a working-level control: thresholds trigger immediate operational response.
  Higher values are better; gains are read as improvement and losses as deterioration. Its use is not
  sector-specific; it appears in cross-industry performance frameworks.'
