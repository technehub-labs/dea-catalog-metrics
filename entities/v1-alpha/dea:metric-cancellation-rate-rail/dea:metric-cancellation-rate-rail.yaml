id: dea:metric-cancellation-rate-rail
name: Cancellation Rate (Rail)
type: Metric
description: 'Cancellation Rate (Rail) (CNR) captures exposure to adverse outcomes for organizations tracking
  rail transport. It is computed as Cancelled Trains / Scheduled Trains, expressed in percent (%). It
  is a headline indicator: movement in it prompts leadership questions about strategy and resourcing.
  Lower values are better; each reduction is an improvement. Its use is concentrated in Rail.'
abbreviation: CNR
unit: percent
