id: dea:metric-catalyst-lifetime-efficiency
name: Catalyst Lifetime Efficiency
type: Metric
description: Catalyst Lifetime Efficiency (CLE) measures how efficiently resources are converted into
  outputs in the Chemicals & Specialty Materials domain. Its calculation is Output per Catalyst Load vs
  Design, measured in ratio (x:1 or x). It originates from and is most used in Chemicals practice. Its
  value drives prioritization and resource reallocation among competing initiatives. It should be maximized
  within the limits of cost and quality trade-offs.
