id: dea:metric-simulation-correlation-accuracy
name: Simulation Correlation Accuracy
type: Metric
description: A Engineering & Design indicator, Simulation Correlation Accuracy (SCA) quantifies the quality
  of outputs and outcomes. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It is defined as Model Prediction Error vs Test Data; the result is stated in percent
  (%). It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
