id: dea:metric-field-service-cost-per-job-deep-dive
name: Field Service Cost per Job (Deep Dive)
type: Metric
description: Field Service Cost per Job (Deep Dive) (FSCJ-D) captures how efficiently resources are converted
  into outputs for organizations tracking field maintenance & technical field service (deep dive). Its
  calculation is Total Field Cost / Jobs Completed, measured in currency value. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. Lower values are
  better; each reduction is an improvement. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.
