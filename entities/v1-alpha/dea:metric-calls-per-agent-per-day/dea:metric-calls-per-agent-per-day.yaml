id: dea:metric-calls-per-agent-per-day
name: Calls per Agent per Day
type: Metric
description: 'A Contact Center indicator, Calls per Agent per Day (CPAD) quantifies the utilization or
  availability of capacity. It is defined as Calls Handled / Agent Days Worked; the result is stated in
  ratio (x:1 or x). It is applied across virtually every sector. It is a working-level control: thresholds
  trigger immediate operational response. It should be maximized within the limits of cost and quality
  trade-offs.'
