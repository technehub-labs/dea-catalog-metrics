id: dea:metric-data-center-availability
name: Data Center Availability
type: Metric
description: Data Center Availability (DCA) measures the quality of outputs and outcomes in the Data Center
  & Cloud Operations domain. It is defined as Uptime across Redundancy Tier / Total Time; the result is
  stated in percent (%). In Technology & data centers, it is a recognized element of the standard performance
  toolkit. Its trend is watched by senior leadership as an early signal of structural performance shifts.
  It should be maximized within the limits of cost and quality trade-offs.
