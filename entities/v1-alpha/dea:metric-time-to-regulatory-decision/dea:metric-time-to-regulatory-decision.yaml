id: dea:metric-time-to-regulatory-decision
name: Time to Regulatory Decision
type: Metric
description: 'Time to Regulatory Decision (TTRD) addresses how efficiently resources are converted into
  outputs and is a fixture of pharma r&d & clinical trials reporting. It is computed as Days from Submission
  to Regulatory Decision, expressed in days. Its use is concentrated in Pharmaceuticals. It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. Reduction is the
  goal, and sustained decreases indicate successful intervention.'
