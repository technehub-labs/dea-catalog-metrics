id: dea:metric-handoff-count-per-process
name: Handoff Count per Process
type: Metric
description: 'A Operating Model & Process Health Deep Dive indicator, Handoff Count per Process (HCPP)
  quantifies how efficiently resources are converted into outputs. The formula is Average Handoffs between
  Functions per Process Run - reported in count (items per period). It is applied across virtually every
  sector. It is monitored close to the work: teams act on it within a shift, sprint, or daily review.
  Reduction is the goal, and sustained decreases indicate successful intervention.'
