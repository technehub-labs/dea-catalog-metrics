id: dea:metric-project-portfolio-health
name: Project Portfolio Health
type: Metric
description: Project Portfolio Health (PPH) measures exposure to adverse outcomes in the Project Management
  domain. The formula is Projects on Green Status / Total Projects - reported in percent (%). It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. Higher values
  are better; gains are read as improvement and losses as deterioration. Its use is not sector-specific;
  it appears in cross-industry performance frameworks.
abbreviation: PPH
unit: percent
