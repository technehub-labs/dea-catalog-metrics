id: dea:metric-greenhouse-gas-scope-3-emissions
name: Greenhouse Gas Scope 3 Emissions
type: Metric
description: Greenhouse Gas Scope 3 Emissions (GHG3) addresses environmental and social sustainability
  performance and is a fixture of sustainability & esg reporting. Its calculation is All Other Indirect
  Value-Chain Emissions, measured in tonnes CO2 equivalent (tCO2e). It is applied across virtually every
  sector. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than
  team boards. Reduction is the goal, and sustained decreases indicate successful intervention.
