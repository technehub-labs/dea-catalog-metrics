id: dea:metric-legacy-records-backlog-age
name: Legacy Records Backlog Age
type: Metric
description: 'Legacy Records Backlog Age (LRBA) measures how efficiently resources are converted into
  outputs in the Records & Information Management domain. The formula is Average Age of Unprocessed Legacy
  Records - reported in days. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. Lower values are better; each reduction is an improvement. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.'
