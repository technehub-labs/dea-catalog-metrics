id: dea:metric-quality-of-experience-score-video-streaming
name: Quality of Experience Score (Video Streaming)
type: Metric
description: Quality of Experience Score (Video Streaming) (QoE) measures the quality of outputs and outcomes
  in the Telecom Product & Bundle Management domain. It is defined as Weighted Index of Start Time, Rebuffering,
  Resolution; the result is stated in index (0-100 or normalized). In Telecommunications, it is a recognized
  element of the standard performance toolkit. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It should be maximized within the limits of cost and quality trade-offs.
