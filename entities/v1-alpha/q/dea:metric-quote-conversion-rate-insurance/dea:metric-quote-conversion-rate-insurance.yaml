id: dea:metric-quote-conversion-rate-insurance
name: Quote Conversion Rate (Insurance)
type: Metric
description: Quote Conversion Rate (Insurance) (QCR-I) addresses how effectively a process or entity achieves
  its intended outcome and is a fixture of insurance distribution & brokerage reporting. Its calculation
  is Quotes Converted to Bound Policies / Quotes Issued, measured in percent (%). It originates from and
  is most used in Insurance distribution practice. Its value drives prioritization and resource reallocation
  among competing initiatives. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: QCR-I
unit: percent
