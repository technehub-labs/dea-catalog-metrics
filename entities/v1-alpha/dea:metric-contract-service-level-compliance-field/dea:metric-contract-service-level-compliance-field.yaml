id: dea:metric-contract-service-level-compliance-field
name: Contract Service Level Compliance (Field)
type: Metric
description: 'Contract Service Level Compliance (Field) (CSLCF) captures conformance to standards, plans,
  or obligations for organizations tracking field service & asset performance. The formula is SLAs Met
  under Service Contracts / SLAs - reported in percent (%). It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. Higher values are better; gains are read
  as improvement and losses as deterioration. Its use is not sector-specific; it appears in cross-industry
  performance frameworks.'
abbreviation: CSLCF
unit: percent
