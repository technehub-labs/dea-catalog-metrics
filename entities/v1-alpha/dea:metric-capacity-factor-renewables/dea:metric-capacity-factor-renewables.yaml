id: dea:metric-capacity-factor-renewables
name: Capacity Factor (Renewables)
type: Metric
description: Capacity Factor (Renewables) (CFR-E) measures the utilization or availability of capacity
  in the Energy Transition & Renewables domain. It is defined as Actual Generation / Nameplate Generation
  Potential; the result is stated in percent (%). In Renewable energy, it is a recognized element of the
  standard performance toolkit. Its trend is watched by senior leadership as an early signal of structural
  performance shifts. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: CFR-E
unit: percent
