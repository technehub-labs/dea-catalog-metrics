id: dea:metric-scope-3-coverage-ratio
name: Scope 3 Coverage Ratio
type: Metric
description: Scope 3 Coverage Ratio (S3CR) captures conformance to standards, plans, or obligations for
  organizations tracking environmental, social & governance reporting. Its trend is watched by senior
  leadership as an early signal of structural performance shifts. It is defined as Categories Reported
  / Applicable Categories; the result is stated in percent (%). Improvement means raising this figure
  toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
