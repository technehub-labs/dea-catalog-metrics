id: dea:metric-capitalization-rate
name: Capitalization Rate
type: Metric
description: A Real Estate & Mortgage Standard Measures indicator, Capitalization Rate (CAPRT) quantifies
  the economic value created or preserved. Its trend is watched by senior leadership as an early signal
  of structural performance shifts. It is defined as Net Operating Income / Property Value; the result
  is stated in percent (%). The objective is neither maximization nor minimization but staying within
  an agreed operating band. In Real estate, it is a recognized element of the standard performance toolkit.
abbreviation: CAPRT
unit: percent
