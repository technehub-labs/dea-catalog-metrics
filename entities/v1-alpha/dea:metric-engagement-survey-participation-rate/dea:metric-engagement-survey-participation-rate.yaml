id: dea:metric-engagement-survey-participation-rate
name: Engagement Survey Participation Rate
type: Metric
description: A Employee Engagement & Culture (Deep Dive) indicator, Engagement Survey Participation Rate
  (ESPR) quantifies the engagement or satisfaction of the people involved. It is defined as Responses
  Received / Surveyed Employees; the result is stated in percent (%). It is applied across virtually every
  sector. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
