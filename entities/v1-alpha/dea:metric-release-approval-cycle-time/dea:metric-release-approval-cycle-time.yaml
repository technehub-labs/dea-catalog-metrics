id: dea:metric-release-approval-cycle-time
name: Release Approval Cycle Time
type: Metric
description: 'Release Approval Cycle Time (RACT-RM) addresses how efficiently resources are converted
  into outputs and is a fixture of release management & environments reporting. The formula is Days to
  Obtain Required Release Approvals - reported in days. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Lower values are better; each reduction is an improvement.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.'
