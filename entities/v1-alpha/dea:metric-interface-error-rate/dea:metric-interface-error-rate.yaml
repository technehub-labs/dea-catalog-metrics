id: dea:metric-interface-error-rate
name: Interface Error Rate
type: Metric
description: 'Interface Error Rate (IER-NW) measures the quality of outputs and outcomes in the Network
  Performance & Capacity domain. It is monitored close to the work: teams act on it within a shift, sprint,
  or daily review. The formula is Interfaces with Persistent Errors / Interfaces - reported in percent
  (%). It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.'
