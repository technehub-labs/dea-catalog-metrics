id: dea:metric-noc-first-level-resolution-rate
name: NOC First-Level Resolution Rate
type: Metric
description: A Network Operations Center (Deep Dive) indicator, NOC First-Level Resolution Rate (NOCFLR)
  quantifies how efficiently resources are converted into outputs. Its value drives prioritization and
  resource reallocation among competing initiatives. Its calculation is Tickets Resolved at NOC Tier 1
  / Tickets, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
