id: dea:metric-critical-data-element-quality-index
name: Critical Data Element Quality Index
type: Metric
description: Within Data Quality Management, Critical Data Element Quality Index (CDEQI) is used to gauge
  the quality of outputs and outcomes. Its trend is watched by senior leadership as an early signal of
  structural performance shifts. It is defined as Weighted Quality Score across CDE Dimensions; the result
  is stated in index (0-100 or normalized). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
