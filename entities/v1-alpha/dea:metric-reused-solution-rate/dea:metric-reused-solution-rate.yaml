calculation_definition: Solutions Reused from Repository / Solutions Delivered
formula_definition:
  formula_id: dea:formula-reused-solution-rate
  expression: RSR-K = Solutions Reused from Repository / Solutions Delivered
  inputs:
  - name: Solutions Reused from Repository
  - name: Solutions Delivered
