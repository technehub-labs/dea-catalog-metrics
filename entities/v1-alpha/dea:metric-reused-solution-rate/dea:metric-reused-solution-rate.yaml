id: dea:metric-reused-solution-rate
name: Reused Solution Rate
type: Metric
description: 'A Knowledge Management indicator, Reused Solution Rate (RSR-K) quantifies how efficiently
  resources are converted into outputs. The formula is Solutions Reused from Repository / Solutions Delivered
  - reported in percent (%). It is applied across virtually every sector. It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. It should be maximized within
  the limits of cost and quality trade-offs.'
abbreviation: RSR-K
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- information_architecture
purpose_classification:
