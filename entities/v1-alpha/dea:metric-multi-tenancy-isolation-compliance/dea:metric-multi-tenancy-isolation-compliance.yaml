id: dea:metric-multi-tenancy-isolation-compliance
name: Multi-Tenancy Isolation Compliance
type: Metric
description: A Software Architecture & Technical Design indicator, Multi-Tenancy Isolation Compliance
  (MTIC-SA) quantifies exposure to adverse outcomes. Its calculation is Isolation Tests Passed / Isolation
  Tests, measured in percent (%). It is applied across virtually every sector. It informs long-horizon
  decisions and is typically tracked on enterprise dashboards rather than team boards. It should be maximized
  within the limits of cost and quality trade-offs.
