id: dea:metric-policy-implementation-on-time-rate
name: Policy Implementation On-Time Rate
type: Metric
description: Policy Implementation On-Time Rate (PIT) measures conformance to standards, plans, or obligations
  in the Public Sector & Government domain. Its calculation is Policy Milestones Met on Schedule / Milestones
  Planned, measured in percent (%). It originates from and is most used in Public sector practice. It
  informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team boards.
  It should be maximized within the limits of cost and quality trade-offs.
