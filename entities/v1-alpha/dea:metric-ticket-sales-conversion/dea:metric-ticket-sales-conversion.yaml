id: dea:metric-ticket-sales-conversion
name: Ticket Sales Conversion
type: Metric
description: 'Ticket Sales Conversion (TSC) captures growth over time for organizations tracking sports
  & events. It is a headline indicator: movement in it prompts leadership questions about strategy and
  resourcing. It is computed as Tickets Sold / Tickets Offered, expressed in percent (%). Improvement
  means raising this figure toward best-in-class levels. Its use is concentrated in Sports & events.'
abbreviation: TSC
unit: percent
