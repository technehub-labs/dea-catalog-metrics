id: dea:metric-digital-skill-proficiency-index
name: Digital Skill Proficiency Index
type: Metric
description: Digital Skill Proficiency Index (DSPI-BSC) addresses capability maturity or development and
  is a fixture of balanced scorecard - learning & growth perspective reporting. Its trend is watched by
  senior leadership as an early signal of structural performance shifts. It is defined as Assessed Proficiency
  across Digital Skill Framework; the result is stated in index (0-100 or normalized). Improvement means
  raising this figure toward best-in-class levels. Practitioners in nearly any industry can adopt it directly.
