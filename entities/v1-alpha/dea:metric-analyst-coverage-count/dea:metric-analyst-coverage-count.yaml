id: dea:metric-analyst-coverage-count
name: Analyst Coverage Count
type: Metric
description: Analyst Coverage Count (ANCC) captures the economic value created or preserved for organizations
  tracking investor relations & capital markets. Its calculation is Sell-Side Analysts Publishing Estimates,
  measured in count (items per period). It originates from and is most used in Listed companies practice.
  It informs long-horizon decisions and is typically tracked on enterprise dashboards rather than team
  boards. It should be maximized within the limits of cost and quality trade-offs.
