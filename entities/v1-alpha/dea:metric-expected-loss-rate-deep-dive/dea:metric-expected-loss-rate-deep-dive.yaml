id: dea:metric-expected-loss-rate-deep-dive
name: Expected Loss Rate (Deep Dive)
type: Metric
description: 'Expected Loss Rate (Deep Dive) (ELRDD) captures exposure to adverse outcomes for organizations
  tracking credit & collections risk (enterprise). It is a headline indicator: movement in it prompts
  leadership questions about strategy and resourcing. It is computed as PD x LGD x EAD / Portfolio Exposure,
  expressed in percent (%). It should be driven down, since lower readings signal healthier performance.
  Practitioners in nearly any industry can adopt it directly.'
abbreviation: ELRDD
unit: percent
