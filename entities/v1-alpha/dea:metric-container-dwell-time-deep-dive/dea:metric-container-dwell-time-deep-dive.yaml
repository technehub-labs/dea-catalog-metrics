id: dea:metric-container-dwell-time-deep-dive
name: Container Dwell Time (Deep Dive)
type: Metric
description: 'Container Dwell Time (Deep Dive) (CDT-D) captures how efficiently resources are converted
  into outputs for organizations tracking maritime shipping (deep dive). It guides mid-horizon planning:
  portfolio, program, and function owners act on it between review cycles. The formula is Days Container
  in Yard before Pickup - reported in days. It should be driven down, since lower readings signal healthier
  performance. It is a standard measure in the Maritime sector.'
