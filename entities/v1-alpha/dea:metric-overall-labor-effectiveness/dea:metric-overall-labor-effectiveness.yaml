id: dea:metric-overall-labor-effectiveness
name: Overall Labor Effectiveness
type: Metric
description: 'Overall Labor Effectiveness (OLE) addresses how effectively a process or entity achieves
  its intended outcome and is a fixture of operations reporting. It guides mid-horizon planning: portfolio,
  program, and function owners act on it between review cycles. The formula is Availability x Performance
  x Quality of Direct Labor - reported in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.'
abbreviation: OLE
unit: percent
