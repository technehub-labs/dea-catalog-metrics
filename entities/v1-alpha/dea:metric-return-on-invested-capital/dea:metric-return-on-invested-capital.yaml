id: dea:metric-return-on-invested-capital
name: Return on Invested Capital
type: Metric
description: A Finance & Accounting indicator, Return on Invested Capital (ROIC) quantifies the economic
  value created or preserved. Its calculation is NOPAT / Invested Capital, measured in percent (%). It
  is applied across virtually every sector. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. It should be maximized within the limits of cost and
  quality trade-offs.
