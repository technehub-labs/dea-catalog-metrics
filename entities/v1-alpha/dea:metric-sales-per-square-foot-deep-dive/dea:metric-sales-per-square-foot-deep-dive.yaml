id: dea:metric-sales-per-square-foot-deep-dive
name: Sales per Square Foot (Deep Dive)
type: Metric
description: Sales per Square Foot (Deep Dive) (SPSFDD) addresses how efficiently resources are converted
  into outputs and is a fixture of retail standard measures reporting. The formula is Net Sales / Selling
  Area - reported in currency per unit. It is a standard measure in the Retail & E-commerce sector. It
  carries weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It
  should be maximized within the limits of cost and quality trade-offs.
