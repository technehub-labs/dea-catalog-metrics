id: dea:metric-portfolio-capacity-utilization
name: Portfolio Capacity Utilization
type: Metric
description: Portfolio Capacity Utilization (PCU-PPM) captures the utilization or availability of capacity
  for organizations tracking program & portfolio management. It is defined as Committed Resource Capacity
  / Total Capacity; the result is stated in percent (%). It is applied across virtually every sector.
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Values
  outside the intended band, on either side, warrant investigation.
