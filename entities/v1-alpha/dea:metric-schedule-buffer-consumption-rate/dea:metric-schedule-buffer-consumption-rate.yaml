id: dea:metric-schedule-buffer-consumption-rate
name: Schedule Buffer Consumption Rate
type: Metric
description: Schedule Buffer Consumption Rate (SBCR) addresses exposure to adverse outcomes and is a fixture
  of project risk & issue management reporting. It is defined as Buffer Consumed / Buffer Planned; the
  result is stated in percent (%). It is applied across virtually every sector. It bridges daily operations
  and executive reporting, giving managers a lever to pull within a quarter. Values outside the intended
  band, on either side, warrant investigation.
abbreviation: SBCR
unit: percent
