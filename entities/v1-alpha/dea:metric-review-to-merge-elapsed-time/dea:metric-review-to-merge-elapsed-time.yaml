id: dea:metric-review-to-merge-elapsed-time
name: Review-to-Merge Elapsed Time
type: Metric
description: Review-to-Merge Elapsed Time (RMET) captures how efficiently resources are converted into
  outputs for organizations tracking code review & peer quality. It is computed as Median Hours from Review
  Start to Merge, expressed in hours. Its use is concentrated in Software. Front-line and delivery teams
  watch it in real time, as small deviations demand immediate correction. Reduction is the goal, and sustained
  decreases indicate successful intervention.
abbreviation: RMET
