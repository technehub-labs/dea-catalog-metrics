id: dea:metric-agent-productivity-transactions
name: Agent Productivity (Transactions)
type: Metric
description: 'Agent Productivity (Transactions) (APT) captures how efficiently resources are converted
  into outputs for organizations tracking real estate brokerage. The formula is Closed Transactions /
  Agent per Period - reported in ratio (x:1 or x). It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. It is a standard measure in the Real estate sector.'
