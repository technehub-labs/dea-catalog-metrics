id: dea:metric-ore-grade-variance-deep-dive
name: Ore Grade Variance (Deep Dive)
type: Metric
description: Within Metals & Mining Operations (Deep Dive), Ore Grade Variance (Deep Dive) (OGV-D) is
  used to gauge the quality of outputs and outcomes. Its calculation is Milled Grade - Resource Model
  Grade / Model Grade, measured in percent (%). It originates from and is most used in Metals & Mining
  practice. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Values outside the intended band, on either side, warrant investigation.
