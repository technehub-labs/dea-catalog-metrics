id: dea:metric-on-time-project-delivery
name: On-Time Project Delivery
type: Metric
description: Within Project Management, On-Time Project Delivery (OTPD) is used to gauge conformance to
  standards, plans, or obligations. It is defined as Projects Delivered On Schedule / Projects Completed;
  the result is stated in percent (%). Its trend is watched by senior leadership as an early signal of
  structural performance shifts. Higher values are better; gains are read as improvement and losses as
  deterioration. Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: OTPD
unit: percent
