id: dea:metric-investigator-initiated-study-turnaround
name: Investigator-Initiated Study Turnaround
type: Metric
description: Within Pharma R&D & Clinical Trials, Investigator-Initiated Study Turnaround (IIST) is used
  to gauge how efficiently resources are converted into outputs. It is computed as Days from Proposal
  to Study Approval, expressed in days. Its use is concentrated in Pharmaceuticals. It is reviewed at
  cadence by planning owners to correct course before issues become strategic. Reduction is the goal,
  and sustained decreases indicate successful intervention.
abbreviation: IIST
unit: day
