id: dea:metric-investigator-meeting-attendance-rate
name: Investigator Meeting Attendance Rate
type: Metric
description: 'Investigator Meeting Attendance Rate (IMAR) measures the engagement or satisfaction of the
  people involved in the Pharma R&D & Clinical Trials domain. The formula is Sites Attending Investigator
  Meetings / Sites - reported in percent (%). It is monitored close to the work: teams act on it within
  a shift, sprint, or daily review. Higher values are better; gains are read as improvement and losses
  as deterioration. It is a standard measure in the Pharmaceuticals sector.'
abbreviation: IMAR
unit: percent
