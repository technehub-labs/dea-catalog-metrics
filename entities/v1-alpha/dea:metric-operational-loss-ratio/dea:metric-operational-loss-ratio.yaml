id: dea:metric-operational-loss-ratio
name: Operational Loss Ratio
type: Metric
description: Operational Loss Ratio (OLR) addresses exposure to adverse outcomes and is a fixture of risk
  & compliance reporting. Its trend is watched by senior leadership as an early signal of structural performance
  shifts. It is defined as Operational Losses / Revenue; the result is stated in percent (%). It should
  be driven down, since lower readings signal healthier performance. Practitioners in nearly any industry
  can adopt it directly.
abbreviation: OLR
unit: percent
