id: dea:metric-inventory-turnover
name: Inventory Turnover
type: Metric
description: Within Supply Chain, Inventory Turnover (ITR) is used to gauge how efficiently resources
  are converted into outputs. Its calculation is Cost of Goods Sold / Average Inventory, measured in times
  per period. It informs long-horizon decisions and is typically tracked on enterprise dashboards rather
  than team boards. Higher values are better; gains are read as improvement and losses as deterioration.
  Its use is not sector-specific; it appears in cross-industry performance frameworks.
abbreviation: ITR
unit: times
