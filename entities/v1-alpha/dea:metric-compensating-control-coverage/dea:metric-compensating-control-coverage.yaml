id: dea:metric-compensating-control-coverage
name: Compensating Control Coverage
type: Metric
description: 'Within Vulnerability & Exposure Management, Compensating Control Coverage (CCC-VM) is used
  to gauge exposure to adverse outcomes. The formula is Unpatched Systems with Compensating Controls /
  Unpatched Systems - reported in percent (%). It guides mid-horizon planning: portfolio, program, and
  function owners act on it between review cycles. Higher values are better; gains are read as improvement
  and losses as deterioration. Its use is not sector-specific; it appears in cross-industry performance
  frameworks.'
abbreviation: CCC-VM
unit: percent
