id: dea:metric-net-additions
name: Net Additions
type: Metric
description: Net Additions (NADD) addresses growth over time and is a fixture of telecommunications reporting.
  It is defined as New Subscribers - Lost Subscribers; the result is stated in count (items per period).
  Its trend is watched by senior leadership as an early signal of structural performance shifts. Higher
  values are better; gains are read as improvement and losses as deterioration. In Telecommunications,
  it is a recognized element of the standard performance toolkit.
