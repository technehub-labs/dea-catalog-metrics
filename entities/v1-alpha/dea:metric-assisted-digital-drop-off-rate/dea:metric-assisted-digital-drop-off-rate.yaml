id: dea:metric-assisted-digital-drop-off-rate
name: Assisted Digital Drop-off Rate
type: Metric
description: 'Assisted Digital Drop-off Rate (ADDR) measures the quality of outputs and outcomes in the
  Public Sector & Citizen Service Standard Measures (Deep Dive) domain. It is monitored close to the work:
  teams act on it within a shift, sprint, or daily review. The formula is Users Abandoning Digital Journey
  to Assisted Channel / Digital Starts - reported in percent (%). It should be driven down, since lower
  readings signal healthier performance. It is a standard measure in the Public sector sector.'
abbreviation: ADDR
unit: percent
version: 1.1.0
