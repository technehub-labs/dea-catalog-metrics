id: dea:metric-asset-health-index-deep-dive
name: Asset Health Index (Deep Dive)
type: Metric
description: Within Reliability & Maintainability Engineering (Deep Dive), Asset Health Index (Deep Dive)
  (AHID) is used to gauge exposure to adverse outcomes. The formula is Composite Condition Score of Asset
  Fleet - reported in index (0-100 or normalized). It is applied across virtually every sector. It carries
  weight in boardroom and executive reviews, where it anchors cross-organization trade-offs. It should
  be maximized within the limits of cost and quality trade-offs.
