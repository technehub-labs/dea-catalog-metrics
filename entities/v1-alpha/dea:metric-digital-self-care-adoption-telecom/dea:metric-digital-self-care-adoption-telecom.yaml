id: dea:metric-digital-self-care-adoption-telecom
name: Digital Self-Care Adoption (Telecom)
type: Metric
description: Digital Self-Care Adoption (Telecom) (DSCA) measures how efficiently resources are converted
  into outputs in the Telecom Customer Experience & Billing domain. Its trend is watched by senior leadership
  as an early signal of structural performance shifts. It is defined as Digital Channel Resolutions /
  Total Resolutions; the result is stated in percent (%). Improvement means raising this figure toward
  best-in-class levels. In Telecommunications, it is a recognized element of the standard performance
  toolkit.
abbreviation: DSCA
unit: percent
version: 1.1.0
lifecycle_status: candidate
subject_classification:
- customer
