id: dea:metric-dependency-closure-timeliness
name: Dependency Closure Timeliness
type: Metric
description: A Project Management (Deep Dive) indicator, Dependency Closure Timeliness (DCT-PM) quantifies
  exposure to adverse outcomes. The formula is Cross-Project Dependencies Resolved by Date / Dependencies
  - reported in percent (%). It is applied across virtually every sector. It carries weight in boardroom
  and executive reviews, where it anchors cross-organization trade-offs. It should be maximized within
  the limits of cost and quality trade-offs.
abbreviation: DCT-PM
unit: percent
