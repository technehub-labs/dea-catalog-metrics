id: dea:metric-price-protection-payout-ratio
name: Price Protection Payout Ratio
type: Metric
description: A Channel & Distribution Management indicator, Price Protection Payout Ratio (PPPR) quantifies
  the economic value created or preserved. It provides the day-to-day signal that a process is running
  as designed. Its calculation is Price Protection Claims Paid / Claims Assessed, measured in percent
  (%). It should be driven down, since lower readings signal healthier performance. Practitioners in nearly
  any industry can adopt it directly.
