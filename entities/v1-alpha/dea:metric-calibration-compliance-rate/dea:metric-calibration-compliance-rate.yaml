id: dea:metric-calibration-compliance-rate
name: Calibration Compliance Rate
type: Metric
description: 'A Quality Management indicator, Calibration Compliance Rate (CCR-Q) quantifies conformance
  to standards, plans, or obligations. The formula is In-Calibration Gauges / Gauges in Service - reported
  in percent (%). It is monitored close to the work: teams act on it within a shift, sprint, or daily
  review. Higher values are better; gains are read as improvement and losses as deterioration. Its use
  is not sector-specific; it appears in cross-industry performance frameworks.'
