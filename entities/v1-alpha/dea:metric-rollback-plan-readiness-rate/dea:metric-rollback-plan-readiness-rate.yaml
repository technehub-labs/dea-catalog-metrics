id: dea:metric-rollback-plan-readiness-rate
name: Rollback Plan Readiness Rate
type: Metric
description: Rollback Plan Readiness Rate (RPRR) captures exposure to adverse outcomes for organizations
  tracking release management & environments. It informs long-horizon decisions and is typically tracked
  on enterprise dashboards rather than team boards. Its calculation is Releases with Tested Rollback Plan
  / Releases, measured in percent (%). Improvement means raising this figure toward best-in-class levels.
  Practitioners in nearly any industry can adopt it directly.
abbreviation: RPRR
unit: percent
