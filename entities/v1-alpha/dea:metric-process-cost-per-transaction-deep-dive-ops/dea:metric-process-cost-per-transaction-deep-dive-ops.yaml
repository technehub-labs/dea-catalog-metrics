id: dea:metric-process-cost-per-transaction-deep-dive-ops
name: Process Cost per Transaction (Deep Dive - Ops)
type: Metric
description: 'Process Cost per Transaction (Deep Dive - Ops) (PCPTD) addresses how efficiently resources
  are converted into outputs and is a fixture of operating model & process health deep dive reporting.
  The formula is Fully Loaded Cost / Process Transactions - reported in currency per unit. It is applied
  across virtually every sector. It guides mid-horizon planning: portfolio, program, and function owners
  act on it between review cycles. Reduction is the goal, and sustained decreases indicate successful
  intervention.'
