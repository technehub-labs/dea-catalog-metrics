id: dea:metric-solvent-recovery-rate
name: Solvent Recovery Rate
type: Metric
description: Solvent Recovery Rate (SVR) addresses environmental and social sustainability performance
  and is a fixture of chemicals reporting. It is defined as Solvent Recovered and Reused / Solvent Consumed;
  the result is stated in percent (%). In Chemicals, it is a recognized element of the standard performance
  toolkit. It bridges daily operations and executive reporting, giving managers a lever to pull within
  a quarter. It should be maximized within the limits of cost and quality trade-offs.
abbreviation: SVR
unit: percent
