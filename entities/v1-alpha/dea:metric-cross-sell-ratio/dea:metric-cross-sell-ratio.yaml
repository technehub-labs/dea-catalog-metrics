id: dea:metric-cross-sell-ratio
name: Cross-Sell Ratio
type: Metric
description: Cross-Sell Ratio (XSR) measures growth over time in the Banking & Financial Services domain.
  It is computed as Products per Customer Relationship, expressed in ratio (x:1 or x). It is reviewed
  at cadence by planning owners to correct course before issues become strategic. Higher values are better;
  gains are read as improvement and losses as deterioration. Its use is concentrated in Financial services.
abbreviation: XSR
