id: dea:metric-order-fulfillment-cycle-time
name: Order Fulfillment Cycle Time
type: Metric
description: 'Within Operations, Order Fulfillment Cycle Time (OFCT) is used to gauge how efficiently
  resources are converted into outputs. It guides mid-horizon planning: portfolio, program, and function
  owners act on it between review cycles. The formula is Days from Order Received to Customer Delivery
  - reported in days. It should be driven down, since lower readings signal healthier performance. Practitioners
  in nearly any industry can adopt it directly.'
