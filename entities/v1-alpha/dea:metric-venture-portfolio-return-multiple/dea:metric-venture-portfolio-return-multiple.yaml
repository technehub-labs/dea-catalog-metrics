id: dea:metric-venture-portfolio-return-multiple
name: Venture Portfolio Return Multiple
type: Metric
description: A Corporate Venturing & Partnerships indicator, Venture Portfolio Return Multiple (VPRM)
  quantifies the economic value created or preserved. It carries weight in boardroom and executive reviews,
  where it anchors cross-organization trade-offs. The formula is Portfolio Exit and Fair Value / Capital
  Invested - reported in ratio (x:1 or x). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: VPRM
unit: ratio
