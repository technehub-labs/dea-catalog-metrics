id: dea:metric-table-turnover-rate
name: Table Turnover Rate
type: Metric
description: Table Turnover Rate (TTR-H) measures the utilization or availability of capacity in the Hospitality
  & Food Service domain. Its calculation is Table Service Cycles / Table per Service Period, measured
  in ratio (x:1 or x). It provides the day-to-day signal that a process is running as designed. Higher
  values are better; gains are read as improvement and losses as deterioration. It originates from and
  is most used in Hospitality practice.
abbreviation: TTR-H
