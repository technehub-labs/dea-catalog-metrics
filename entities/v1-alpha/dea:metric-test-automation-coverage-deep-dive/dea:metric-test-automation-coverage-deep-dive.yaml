id: dea:metric-test-automation-coverage-deep-dive
name: Test Automation Coverage (Deep Dive)
type: Metric
description: A Software Testing & Quality Engineering indicator, Test Automation Coverage (Deep Dive)
  (TAC-QA) quantifies capability maturity or development. Its trend is watched by senior leadership as
  an early signal of structural performance shifts. It is defined as Automated Test Cases / Total Test
  Cases; the result is stated in percent (%). Improvement means raising this figure toward best-in-class
  levels. Practitioners in nearly any industry can adopt it directly.
abbreviation: TAC-QA
unit: percent
