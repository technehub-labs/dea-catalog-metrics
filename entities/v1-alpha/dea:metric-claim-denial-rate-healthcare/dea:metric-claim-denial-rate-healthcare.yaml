id: dea:metric-claim-denial-rate-healthcare
name: Claim Denial Rate (Healthcare)
type: Metric
description: 'Claim Denial Rate (Healthcare) (CDR-H) addresses how efficiently resources are converted
  into outputs and is a fixture of healthcare reporting. It guides mid-horizon planning: portfolio, program,
  and function owners act on it between review cycles. The formula is Denied Claims / Claims Submitted
  - reported in percent (%). It should be driven down, since lower readings signal healthier performance.
  It is a standard measure in the Healthcare sector.'
