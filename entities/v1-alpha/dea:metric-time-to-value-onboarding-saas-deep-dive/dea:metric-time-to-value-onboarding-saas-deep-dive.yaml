id: dea:metric-time-to-value-onboarding-saas-deep-dive
name: Time to Value - Onboarding (SaaS Deep Dive)
type: Metric
description: 'Time to Value - Onboarding (SaaS Deep Dive) (TTV-D) captures how efficiently resources are
  converted into outputs for organizations tracking software product operations (deep dive). It is a headline
  indicator: movement in it prompts leadership questions about strategy and resourcing. It is computed
  as Days from Signup to First Value Milestone, expressed in days. It should be driven down, since lower
  readings signal healthier performance. Its use is concentrated in Technology.'
abbreviation: TTV-D
unit: day
