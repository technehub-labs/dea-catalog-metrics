id: dea:metric-brand-market-coverage
name: Brand Market Coverage
type: Metric
description: Brand Market Coverage (BMC) addresses growth over time and is a fixture of market structure
  & economics standard measures reporting. The formula is Segments Served / Addressable Segments - reported
  in percent (%). It is applied across virtually every sector. It carries weight in boardroom and executive
  reviews, where it anchors cross-organization trade-offs. It should be maximized within the limits of
  cost and quality trade-offs.
