name: validate-metrics

# CR-MET-009 CI: runs the 6 validation gates on every push and PR.
# Drift (missing required fields, MECE conflicts, invalid dual anchors)
# fails CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The normative schema lives in dea-metamodel. Checkout it so
      # test_schema_supersets_dea_metamodel_metric_json actually compares
      # against the upstream required set rather than skipping.
      - name: Check out dea-metamodel (read-only; normative schema)
        uses: actions/checkout@v4
        with:
          repository: technehub-labs/dea-metamodel
          ref: main
          path: .metamodel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema pytest openpyxl
      - name: Regenerate catalog
        run: python3 scripts/regenerate_catalog.py
      - name: Verify CATALOG.yaml is current
        # CR-MET-014 D6: the generator is idempotent, so a contributor who
        # edits a record without regenerating fails here.
        run: git diff --exit-code CATALOG.yaml
      - name: Verify the catalog matches the seed workbook
        # CR-MET-016: the seed-derived records must match the workbook, so a
        # record edited by hand, or a workbook row that never landed, fails CI.
        run: python3 scripts/ingest_seed.py --check
      - name: Coverage report
        # A report, not a gate: it prints how the corpus is distributed.
        run: python3 scripts/report_coverage.py
      - name: Gate 1 - check_metric_schema.py
        run: python3 scripts/check_metric_schema.py
      - name: Gate 2 - check_measurement_conformance.py
        run: python3 scripts/check_measurement_conformance.py
      - name: Gate 3 - check_mece_coverage.py
        run: python3 scripts/check_mece_coverage.py
      - name: Gate 4 - check_evidence_anchors.py
        run: python3 scripts/check_evidence_anchors.py
      - name: Gate 5 - check_threshold_semantics.py
        run: python3 scripts/check_threshold_semantics.py
      - name: Gate 6 - check_dual_anchor.py
        run: python3 scripts/check_dual_anchor.py
      - name: Gate 7 - check_formula_namespace.py
        run: python3 scripts/check_formula_namespace.py
      - name: Gate 8 - check_field_alignment.py
        run: python3 scripts/check_field_alignment.py
      - name: Run pytest
        run: pytest tests/ -q
        env:
          DEA_METAMODEL_ROOT: ${{ github.workspace }}/.metamodel

  allocation:
    # The existing reusable validator from dea-architecture-framework.
    # Pins this catalog's allocation against the OpenDEAM root model.
    uses: technehub-labs/dea-architecture-framework/.github/workflows/validate-against-model.yml@v0.2.1
    with:
      model_ref: v0.2.1
      pointer_file: metamodel-pointer.yaml